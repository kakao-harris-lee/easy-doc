# easydoc.kr 파일럿 운영 오버레이.
# 사용법: docker compose -f compose.yml -f compose.pilot.yml up -d --build --wait

x-pilot-logging: &pilot-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    # 다른 프로젝트가 호스트 5432를 사용해도 영향을 받지 않으며 DB는 Compose 내부에서만 접근한다.
    ports: !reset []
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *pilot-logging

  backend-api:
    # Production startup guard가 라이브 결제 설정을 검증한다. LLM provider는 .env에서
    # 반드시 실제 provider(openai/anthropic)를 선택하고 fake로 두지 않는다.
    #
    # 런타임 프로필은 .env의 EASYDOC_RUNTIME_PROFILE로 고른다. 기본값은 production이라
    # 이 오버레이를 그대로 배포하면 유료 결제 설정을 요구한다. 출시(2026-11-01) 전까지
    # 파일럿은 .env에 EASYDOC_RUNTIME_PROFILE=local과 EASYDOC_WORKER_PROFILES_INCLUDE=local을
    # 두고 toss_test 설정으로 계속 돈다 — 즉 main은 배포 가능한 상태로 두고, 전환 시점만
    # 운영자가 .env 두 줄로 정한다. 두 변수는 반드시 같은 쪽을 가리켜야 한다.
    command: ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=api,${EASYDOC_RUNTIME_PROFILE:-production}"]
    environment:
      # 브라우저의 fetch POST는 같은 사이트 요청에도 Origin을 보낸다. API 컨테이너는
      # TLS 앞단 프록시 뒤에 있으므로 공개 Origin을 명시적으로 허용해야 한다.
      EASYDOC_CORS_ORIGINS_0: https://easydoc.kr
      # www는 호스트 nginx(ops/nginx/easydoc.kr.conf)에서 apex로 301 된다. 이 항목은
      # 아직 www를 들고 있는 북마크·링크의 전환 기간용으로만 남긴다.
      EASYDOC_CORS_ORIGINS_1: https://www.easydoc.kr
      # 결제 시작(checkout·beginTossBilling)은 휴대폰 인증을 전제로 403을 건다. .env가
      # EASYDOC_SMS_PROVIDER를 빠뜨려도 기본값 fake로 조용히 기동해 문자만 안 나가는
      # 사고를 막기 위해 운영에서는 fake를 허용하지 않고 sens로 리터럴 고정한다. 아래
      # 값들은 `:?`로 필수화해 .env에 없으면 compose config 단계에서 실패한다(백엔드가
      # 기동해서 뒤늦게 실패하는 대신 더 앞에서 잡는다).
      EASYDOC_SMS_PROVIDER: sens
      EASYDOC_PHONE_VERIFICATION_PEPPER: ${EASYDOC_PHONE_VERIFICATION_PEPPER:?EASYDOC_PHONE_VERIFICATION_PEPPER must be set in .env}
      EASYDOC_SENS_SERVICE_ID: ${EASYDOC_SENS_SERVICE_ID:?EASYDOC_SENS_SERVICE_ID must be set in .env}
      EASYDOC_SENS_ACCESS_KEY: ${EASYDOC_SENS_ACCESS_KEY:?EASYDOC_SENS_ACCESS_KEY must be set in .env}
      EASYDOC_SENS_SECRET_KEY: ${EASYDOC_SENS_SECRET_KEY:?EASYDOC_SENS_SECRET_KEY must be set in .env}
      EASYDOC_SMS_FROM: ${EASYDOC_SMS_FROM:?EASYDOC_SMS_FROM must be set in .env}
    # 호스트 earlyoom(/etc/default/earlyoom, --prefer '^(java)$')이 메모리 고갈 때 빌드·테스트 JVM보다 파일럿 JVM을 먼저
    # 고르지 않게 낮춘다(2026-09-24 WSL hang 재발 방지). 커널 OOM killer에도 같은 값이 적용된다.
    oom_score_adj: -500
    restart: unless-stopped
    logging: *pilot-logging

  backend-worker:
    # backend-api와 같은 EASYDOC_RUNTIME_PROFILE을 쓴다(기본값 production).
    command: ["java", "-jar", "/app/easy-doc-worker.jar", "--spring.profiles.active=worker,${EASYDOC_RUNTIME_PROFILE:-production}"]
    environment:
      # admin-grant 등 일회성 운영 프로필에도 같은 결제 설정을 포함한다. 상시 worker의
      # --spring.profiles.active와 어긋나면 일회성 명령만 다른 결제 설정으로 도므로
      # EASYDOC_RUNTIME_PROFILE과 같은 값을 둔다.
      SPRING_PROFILES_INCLUDE: ${EASYDOC_WORKER_PROFILES_INCLUDE:-production}
    # 호스트 earlyoom(/etc/default/earlyoom, --prefer '^(java)$')이 메모리 고갈 때 빌드·테스트 JVM보다 파일럿 JVM을 먼저
    # 고르지 않게 낮춘다(2026-09-24 WSL hang 재발 방지). 커널 OOM killer에도 같은 값이 적용된다.
    oom_score_adj: -500
    restart: unless-stopped
    logging: *pilot-logging

  frontend:
    # 호스트 nginx(/etc/nginx/sites-available/easydoc_kr)의 upstream과 일치시킨다.
    ports: !override
      - "127.0.0.1:3100:80"
    restart: unless-stopped
    logging: *pilot-logging

  postgres-backup:
    build:
      context: .
      dockerfile: ops/postgres-backup.Dockerfile
    image: ${POSTGRES_BACKUP_IMAGE:-easy-doc-postgres-backup:local}
    user: "${POSTGRES_BACKUP_UID:-1000}:${POSTGRES_BACKUP_GID:-1000}"
    entrypoint: ["/bin/sh", "/usr/local/bin/easydoc-postgres-backup"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: easydoc
      PGUSER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      PGPASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env}
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-21600}
      # 개인정보처리방침 §3.2가 7일 보관을 공개한다 — 늘리면 방침을 먼저 개정한다
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
      # 원격 복제는 명시적으로 켤 때만 실행한다. OFF일 때 health는 remote=disabled를 보고한다.
      POSTGRES_BACKUP_REMOTE_ENABLED: ${POSTGRES_BACKUP_REMOTE_ENABLED:-false}
      POSTGRES_BACKUP_S3_ENDPOINT: ${POSTGRES_BACKUP_S3_ENDPOINT:-}
      POSTGRES_BACKUP_S3_REGION: ${POSTGRES_BACKUP_S3_REGION:-}
      POSTGRES_BACKUP_S3_BUCKET: ${POSTGRES_BACKUP_S3_BUCKET:-easy-doc-backups}
      POSTGRES_BACKUP_S3_PREFIX: ${POSTGRES_BACKUP_S3_PREFIX:-postgres}
      POSTGRES_BACKUP_S3_ACCESS_KEY_ID: ${POSTGRES_BACKUP_S3_ACCESS_KEY_ID:-}
      POSTGRES_BACKUP_S3_SECRET_ACCESS_KEY: ${POSTGRES_BACKUP_S3_SECRET_ACCESS_KEY:-}
      POSTGRES_BACKUP_AGE_PUBLIC_KEY: ${POSTGRES_BACKUP_AGE_PUBLIC_KEY:-}
      # Supabase 계정의 백업 전용 예산을 운영자가 확인해 입력한다. 자동 증설하지 않는다.
      POSTGRES_BACKUP_REMOTE_MAX_FILE_BYTES: ${POSTGRES_BACKUP_REMOTE_MAX_FILE_BYTES:-52428800}
      POSTGRES_BACKUP_REMOTE_CAPACITY_BYTES: ${POSTGRES_BACKUP_REMOTE_CAPACITY_BYTES:-}
      POSTGRES_BACKUP_REMOTE_PRUNE_MAX_OBJECTS: ${POSTGRES_BACKUP_REMOTE_PRUNE_MAX_OBJECTS:-200}
      POSTGRES_BACKUP_REMOTE_MAX_AGE_SECONDS: ${POSTGRES_BACKUP_REMOTE_MAX_AGE_SECONDS:-28800}
      POSTGRES_BACKUP_DELETION_MAX_AGE_SECONDS: ${POSTGRES_BACKUP_DELETION_MAX_AGE_SECONDS:-180}
      POSTGRES_BACKUP_DELETION_EXPORT_INTERVAL_SECONDS: ${POSTGRES_BACKUP_DELETION_EXPORT_INTERVAL_SECONDS:-60}
      POSTGRES_BACKUP_DELETION_ACCOUNT_TABLE: ${POSTGRES_BACKUP_DELETION_ACCOUNT_TABLE:-account_deletion_tombstones}
      POSTGRES_BACKUP_DELETION_DOCUMENT_TABLE: ${POSTGRES_BACKUP_DELETION_DOCUMENT_TABLE:-document_deletion_tombstones}
    volumes:
      - ./ops/postgres-backup.sh:/usr/local/bin/easydoc-postgres-backup:ro
      - ${POSTGRES_BACKUP_DIR:-./backups/postgres}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/easydoc-postgres-backup", "health"]
      interval: 1m
      timeout: 35s
      retries: 2
      start_period: 2m
    restart: unless-stopped
    logging: *pilot-logging
