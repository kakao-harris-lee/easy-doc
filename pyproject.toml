[project]
name = "easy-doc"
version = "0.1.0"
description = "공공기관용 '쉬운 글' 자동 변환 SaaS (Easy-Read AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "openai>=1.50",
    # [asyncio] extra: 비동기 드라이버 사용에 필요한 greenlet을 함께 설치한다.
    # 상한: 인프라 핵심 의존성은 메이저(또는 1.0 미만은 0.x) 업그레이드를
    # 자동으로 물지 않게 막는다 — 스키마·큐 동작이 조용히 바뀌면 위험하다.
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "arq>=0.26,<1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    # 상한: app/ingest/extractors.py가 머리글·바닥글을 읽을 때 python-docx의 비공개
    # 속성(_element)에 의존한다 — 공개 API로는 머리글 안 텍스트박스를 걷지 못한다.
    # 메이저 업그레이드가 이 접근을 조용히 깨지 않도록 막는다.
    "python-docx>=1.1,<2",
    "pypdf>=5.0,<7",
    # 테스트 도구가 아니라 제품 코드 의존성이다: app/easyread/collection.py(골든셋 수집
    # 스크립트가 쓰는 URL 수집)가 직접 import한다. 상한은 다른 인프라 의존성과 같은
    # 이유 — 1.0 이전이라 마이너 업그레이드가 API를 바꿀 수 있다.
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "fpdf2>=2.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff 0.16부터 마크다운 안의 python 코드 블록도 포맷 대상이 된다.
# docs/의 기획·계획 문서는 들여쓴 클래스 본문 같은 발췌 코드를 담고 있어 제외한다.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: 외부 LLM API를 실제 호출하는 테스트 (기본 실행에서 제외, CI 전체 실행에서만)",
    "db: PostgreSQL/Redis가 필요한 통합 테스트 (DATABASE_URL 없으면 skip)",
]
addopts = "-m 'not llm'"
