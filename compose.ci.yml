# CI 검증용 override. 제품 서비스와 검증 서비스를 한 Compose 모델에서 확인한다.
# 실행:
#   docker compose -f compose.yml -f compose.ci.yml run --rm backend-check
#   docker compose -f compose.yml -f compose.ci.yml run --rm frontend-check

services:
  backend-check:
    profiles: [ci]
    build:
      context: ./backend-kotlin
      dockerfile: Dockerfile
      target: build
    image: easy-doc-backend-check:ci
    working_dir: /build
    command: ["./gradlew", "build", "--no-daemon", "--no-build-cache"]
    environment:
      # Kotlin 통합 테스트의 Testcontainers가 호스트 Docker를 사용한다.
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 계약 정본은 저장소 루트 contracts/ 에 있다. Gradle·ContractSpec 은 backend
      # 루트(/build)의 부모에서 contracts/easy-doc-v1.yaml 을 찾으므로 /contracts 로 붙인다.
      # 빌드 컨텍스트는 backend-kotlin/ 만 유지하고, 테스트가 읽는 파일만 읽기 전용으로 연다.
      - ./contracts:/contracts:ro
      # 골든 fixture 정본은 저장소 루트 data/golden/ 에 있다. 품질 게이트 테스트가
      # backend 루트(/build)의 부모에서 data/golden/documents 를 찾으므로 /data 로 붙인다.
      - ./data/golden:/data/golden:ro
      # R2 오프라인 회귀는 보존한 실제 모델 응답을 재검증하며 provider를 호출하지 않는다.
      - ./docs/reports/2026-09-21-r2-model-evaluation-artifacts:/docs/reports/2026-09-21-r2-model-evaluation-artifacts:ro
      # R2 3회 평가(bounded-quality)의 동결 응답. round3 12개 재생 회귀가 같은 방식으로
      # 저장소 루트의 이 디렉터리를 읽는다(유료 호출 없음).
      - ./docs/reports/2026-09-21-r2-bounded-quality-artifacts:/docs/reports/2026-09-21-r2-bounded-quality-artifacts:ro

  frontend-check:
    profiles: [ci]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: check
    image: easy-doc-frontend-check:ci
    working_dir: /build
    command: ["sh", "-c", "npm run check && npm run test -- --run && npm run build"]
