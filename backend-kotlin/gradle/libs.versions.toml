# 의존성 좌표와 버전의 **유일한** 선언 지점.
# 모듈 빌드 스크립트에는 `implementation(libs.xxx)` 형태만 쓴다 (kotlin-spring-conventions §1).
#
# 버전 근거 (계획 §3.1 "구현 시작 시 호환성 spike를 통과한 조합을 고정한다"):
#
# - Phase 0 문서 spike(`00_kotlin-implementer_doc-spike.md`)가 검증한 조합은
#   Java 21.0.4 Temurin / Gradle 9.1.0 / Kotlin 2.2.0 / POI 5.4.1 / PDFBox 3.0.5 /
#   commons-compress 1.27.1 이다. 그 spike는 Spring Boot BOM 없이 좌표를 해석했으므로
#   여기서 BOM 기준으로 재정렬했다.
# - Spring Boot는 **4.1.0**을 고른다. 계획 §3.1이 적은 "4.1 계열 후보"를 그대로 채택한
#   결정이며, 2026-08-12 사용자 승인 건이다(경위는
#   `docs/migration/_workspace/01_kotlin-implementer_boot41-upgrade.md`).
#   Phase 1 골격은 4.0.7로 먼저 만들어졌는데, 계획이 지정한 계열과 어긋난 채로 Kotlin
#   코드가 쌓이면 되돌리는 비용이 시간에 비례해 커지므로 코드량이 가장 적은 시점에 옮겼다.
#   실측 결과 4.1 계열의 안정판은 4.1.0 하나뿐이다(4.1.1 이후 없음, maven-metadata
#   `<release>4.1.0</release>`). 4.0.7 대비 이 프로젝트가 실제로 쓰는 좌표 중 바뀐 것은
#   Kotlin(2.2.21 → 2.3.21)·Flyway(11.14.1 → 12.4.0)·kotlinx-serialization(1.9.0 → 1.11.0)
#   세 개뿐이고, Spring Framework(7.0.8)·Jackson(3.1.4)·JUnit(6.0.3)·
#   Testcontainers(2.0.5)·PostgreSQL 드라이버(42.7.11)·AssertJ(3.27.7)는 동일하다.
# - 문서 파서 조합(POI 5.4.1 / PDFBox 3.0.5)은 Phase 0 spike가 Kotlin 2.2.0 위에서
#   통과시킨 것이다. 2.3.21은 그보다 높은 마이너이므로 **Phase 4 착수 전에 그 spike의
#   DOCX 동등성 7항목을 이 조합으로 다시 확인해야 한다.** 여기서는 좌표 해석·컴파일만
#   확인했다(산출물 참고).
# - Kotlin·Jackson·JUnit·Testcontainers·Flyway·PostgreSQL 드라이버는 버전을 여기에
#   적지 않고 **Boot BOM이 관리**하게 둔다. 계획 §3.1의 "각자 임의 버전으로 섞지 않는다"를
#   지키는 가장 확실한 방법이다. 관리되는 값은 위 주석에 실측 기록으로만 남긴다.

[versions]
# Kotlin 플러그인 버전만은 BOM이 아니라 여기서 정해야 한다(플러그인은 BOM 대상이 아님).
# Boot 4.1.0이 관리하는 kotlin.version과 **같은 값**으로 맞춰 런타임 라이브러리와
# 컴파일러가 갈리지 않게 한다. BOM 밖에서 따로 고르지 않는다.
kotlin = "2.3.21"
springBoot = "4.1.0"

# 품질 게이트. Boot BOM 대상이 아니라 직접 고정한다.
#
# 둘 다 **자기 안에 Kotlin 컴파일러를 하나씩 안고 있고, 그 버전은 우리가 컴파일하는
# 2.3.21 과 다르다.** 실측(락파일):
#   - detekt 1.23.8  → kotlin-compiler-embeddable 2.0.21
#   - ktlint-cli 1.8.0 → kotlin-compiler-embeddable 2.2.21
# 즉 소스를 파싱하는 컴파일러와 컴파일하는 컴파일러가 갈려 있다. 이것이 문제가 되는
# 지점은 하나다 — **2.3 에서 새로 생긴 문법을 쓰면 두 도구가 파싱에 실패한다.**
# Boot 4.1(Kotlin 2.3.21) 전환 시점 기준으로 현재 소스는 양쪽 다 위반 0으로 통과한다.
# 파싱 오류가 나기 시작하면 그때 대응한다(선택지와 근거는 아래).
#
# detekt 를 2.x 로 올리지 않는 이유: 2026-08-12 실측으로 안정판이 없다. 좌표가
# io.gitlab.arturbosch.detekt → dev.detekt 로 바뀌었고 dev.detekt 쪽에는
# 2.0.0-alpha.0 ~ alpha.6 만 올라와 있다. 품질 게이트를 alpha 에 걸면 게이트가
# 깨졌을 때 "우리 코드가 나쁜가, 게이트가 미완성인가"를 가릴 수 없다.
ktlintPlugin = "14.2.0"
ktlintCli = "1.8.0"
detekt = "1.23.8"

# --- 인증(Phase 3) — Boot BOM 이 관리하지 않는 둘 -------------------------------
#
# 두 좌표 모두 spring-boot-dependencies 4.1.0 의 `<properties>`·`dependencyManagement`
# 에 **없다**(실측: `nimbus`·`bouncycastle`·`bcprov` grep 0건). BOM 밖이라 여기서 고른다.
# 고른 방식은 "최신을 집는다"가 아니라 **이미 검증된 조합에 정렬한다** 이다(계획 §3.1).
#
# - nimbus-jose-jwt: Boot 4.1.0 이 관리하는 spring-security-bom 7.1.0 의
#   `spring-security-oauth2-jose` 가 의존하는 값과 **같은 10.9** 로 맞춘다(실측: 해당
#   POM 의 `<version>10.9</version>`). 최신은 10.9.1 이지만, Spring Security 가 실제로
#   테스트한 조합에 맞추는 편이 "각자 임의 버전으로 섞지 않는다"에 부합한다. JWT 를 직접
#   조립하지 않는 이유는 알고리즘 혼동·base64url 처리처럼 손으로 쓰면 틀리는 자리가
#   많고, 그 취약점 유형이 `migration-safety-gate` I-9 검증 1 의 항목이기 때문이다.
#   다만 **만료 검증기는 쓰지 않는다** — Nimbus 기본 허용 오차가 60초라 계약(skew 0)과
#   어긋난다. 그 판정은 `JwtAccessTokens` 가 직접 한다.
# - bcprov-jdk18on: `spring-security-crypto` 의 `Argon2PasswordEncoder` 가 요구하는
#   런타임 의존이다. 그쪽 POM 은 이 좌표를 선언하지 않으므로(실측: 모듈 메타데이터의
#   apiElements·runtimeElements 가 비어 있다) 우리가 넣어야 한다. Argon2 프리미티브는
#   여기서 오고 우리 코드는 BC 타입을 import 하지 않는다 — 그래서 `runtimeOnly` 다.
nimbusJoseJwt = "10.9"
bouncycastle = "1.85.2"

# --- 문서 추출(Phase 4) — Boot BOM 이 관리하지 않는 넷 -------------------------
#
# 네 좌표 전부 spring-boot-dependencies 4.1.0 의 `<properties>`·`dependencyManagement`
# 에 **없다**(실측: `poi`·`pdfbox`·`commons-compress`·`commons-io`·`xmlbeans` grep 0건).
# BOM 밖이라 여기서 고르며, 고르는 방식은 **Phase 0 문서 spike 가 통과시킨 조합에
# 정렬한다** 이다(`00_kotlin-implementer_doc-spike.md` §8). 임의 최신을 집지 않는다.
#
# - poi-ooxml / pdfbox: spike 조합 그대로. spike 는 Kotlin 2.2.0 위에서 통과했고
#   현재 카탈로그는 2.3.21 이라, **좌표가 아니라 동작을 다시 확인**했다 —
#   그 재확인이 `DocxExtractorTest`·`PdfExtractorTest` 의 spike 동등성 항목이다.
# - commons-compress: POI 의 전이 의존이지만 **직접 고정한다.** zip 예산 방어가
#   `ZipFile` + `SeekableInMemoryByteChannel` API 에 직접 의존하므로, 전이에 맡기면
#   POI 업그레이드가 이 API 를 조용히 바꾼다.
# - commons-io / xmlbeans: POI 전이. **BOM 관리 대상이 아니므로** 고정하지 않으면
#   해석 결과가 스택마다 갈린다(계획 §3.1 "각자 임의 버전으로 섞지 않는다").
#
# ## commons-compress·commons-io 는 spike 값(1.27.1 / 2.18.0)이 **아니다** — 실측 근거
#
# 계획 §1.3 은 둘 다 "spike 조합에 정렬" 로 적었다. 그대로 넣고 락을 떠 보니
# **compileClasspath 와 testClasspath 가 갈렸다**(2026-08-20 실측):
#
#     commons-io:2.18.0        = compileClasspath, runtimeClasspath
#     commons-io:2.20.0        = testCompileClasspath, testRuntimeClasspath, testFixtures*
#     commons-compress:1.27.1  = compileClasspath, runtimeClasspath
#     commons-compress:1.28.0  = testCompileClasspath, testRuntimeClasspath, testFixtures*
#
# 원인은 `testcontainers:2.0.5` → `commons-compress:1.28.0` → `commons-io:2.20.0` 이고,
# 충돌 해소가 높은 쪽을 고른다. 이 상태로 두면 **파서 테스트가 배포본과 다른 라이브러리를
# 시험한다** — zip 경계 읽기처럼 바이트가 곧 결과인 자리에서 최악의 형태다.
#
# 그래서 **그래프 전체가 동의하는 값**으로 올린다. 이 파일의 kotlinx-serialization 주석이
# 적은 판단과 같다 — *"갈림을 막은 것은 버전을 잘 고른 것이 아니라 고르지 않은 것이다."*
# `strictly` 로 1.27.1 을 강제해 testcontainers 를 끌어내리는 갈래는 고르지 않았다:
# 우리가 검증하지 않은 조합(testcontainers 2.0.5 + commons-compress 1.27.1)을 새로
# 만드는 일이라 위험을 옮길 뿐이다.
#
# spike 값을 버려도 되는 근거: spike 가 준 것은 **동작 검증**이고, 그 검증은 이 커밋의
# 추출기 테스트가 **이 조합 위에서 다시 돈다**(DOCX 동등성 9항목 · zip 예산 · DTD 거부).
# 버전 숫자를 물려받는 것이 목적이 아니다.
poi = "5.4.1"
pdfbox = "3.0.5"
commonsCompress = "1.28.0"
commonsIo = "2.20.0"
xmlbeans = "5.3.0"

[libraries]
# --- Spring Boot BOM ---------------------------------------------------------
# platform()으로 적용해 아래 좌표들의 버전을 BOM이 결정하게 한다.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- Spring (버전 없음 = BOM 결정) -------------------------------------------
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# Bean Validation(Hibernate Validator + jakarta.validation API). 버전은 BOM 이 정한다.
#
# ## 왜 들이는가 — 계약이 **딱 두 자리**에 스키마 층 판정을 요구한다
#
# `GET /documents` 의 `limit`·`offset` 이다(계약 `x-request-field-constraints.x-contrast-case`).
# 그 둘은 "진짜 스키마 제약"이라 위반이 422 **배열** `detail` 이어야 하고, 그 모양을 내는
# 것이 컨트롤러 파라미터의 제약 애너테이션 → `HandlerMethodValidationException` 경로다.
# 검증기가 클래스패스에 없으면 Spring 은 그 예외를 **만들지 않으므로** 애너테이션이 무음이 된다.
#
# ## 무엇이 함께 켜지는가 — F3 의 1차 방벽이 여기서 사라진다
#
# 계약은 **다른** 다섯 요청 필드(`SignupRequest.email`·`password`·`DocumentTextRequest.text`·
# `ConversionReviewRequest.edited_text`·`WorkspaceNameRequest.name`)에 길이·형식 Bean
# Validation 을 **금지**했다(F3). 이 좌표가 들어오기 전까지 그 금지를 지킨 것은
# `RequestFieldConstraintLayerTest` **더하기** 「애너테이션을 달 수조차 없다」는 사실이었다.
# 이 줄이 그 두 번째를 없앤다.
#
# 그래서 같은 커밋에 대체 강제자를 세웠다 — `RequestFieldRejectionLayerTest` 가
# 「그 필드의 거절이 어느 층에서 일어나는가」를 **응답 `detail` 모양**으로 잰다.
# 금지 애너테이션 열거에 의존하지 않는 축이고, 사유는
# `docs/migration/_workspace/04_kotlin-implementer_documents.md` 「C4」 절에 있다.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4는 테스트 슬라이스도 기술별 모듈로 쪼갰다. @WebMvcTest·MockMvc 는
# spring-boot-starter-test 가 아니라 여기에 있다.
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# --- 마이그레이션 ------------------------------------------------------------
# Spring Boot 4는 autoconfigure를 기술별 모듈로 쪼갰다. Flyway 자동설정(FlywayMigrationStrategy
# 포함)은 spring-boot-autoconfigure가 아니라 spring-boot-flyway에 있고, starter가 그것을 끌어온다.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
# flyway-core만으로는 PostgreSQL을 인식하지 못한다(Flyway 10부터 DB별 모듈 분리).
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# --- DB ----------------------------------------------------------------------
postgresql = { module = "org.postgresql:postgresql" }

# --- 인증 --------------------------------------------------------------------
# Argon2id 는 spring-security-crypto 의 인코더를 쓴다. 이 모듈은 Spring Security 의
# **암호 유틸만** 들어 있고 필터 체인·SecurityContext 를 끌고 오지 않는다 —
# `spring-boot-starter-security` 가 아니라 이것을 고르는 이유다. 인증 흐름은 계약이
# 정한 대로 우리가 조립하고(인터셉터 + JWT), 라이브러리에서 가져오는 것은 검증된
# 해시 구현과 PHC 인코딩뿐이다.
#
# 버전은 Boot BOM 이 관리한다(spring-security-bom 7.1.0 을 import 한다).
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
# 위 인코더가 실제 Argon2 계산에 쓰는 프리미티브. 우리 코드는 이 타입을 import 하지 않는다.
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }

# --- LLM provider 어댑터 ------------------------------------------------------
# **벤더 SDK(anthropic-sdk-java)를 쓰지 않는다.** 이유는 격리다 — SDK 를 들이면 그 전이
# 의존성(자체 HTTP 클라이언트·Jackson 버전·재시도 정책)이 BOM 밖에서 따라 들어오고,
# 계획 §3.1이 금지한 "각자 임의 버전으로 섞는" 상태가 LLM 레인에서 되살아난다. 게다가
# SDK 의 내장 재시도는 워커 재시도와 겹쳐 호출 수를 늘린다(§4.6, §5 Phase 7 즉시 중단
# 기준의 "중복 LLM 호출"). Anthropic Messages API 는 단일 POST 라 Spring 의 RestClient
# 로 충분하고, 그 편이 재시도·타임아웃을 우리가 전부 통제한다.
#
# 둘 다 버전을 여기서 고르지 않는다 — Boot BOM 이 관리한다(spring-web 7.0.8,
# jackson-databind 3.1.4. api 모듈 락파일 실측). Jackson 3 은 groupId 가
# com.fasterxml → tools.jackson 으로 바뀐 계열이다.
spring-web = { module = "org.springframework:spring-web" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# --- 테스트 ------------------------------------------------------------------
# Testcontainers 2.x는 좌표가 바뀌었다: org.testcontainers:postgresql →
# org.testcontainers:testcontainers-postgresql (2.0.5 BOM 실측).
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }

# --- parity 하네스 -----------------------------------------------------------
# core 의 testFixtures 에서만 쓰는 JSON 직렬화. core 본 소스에는 들어가지 않는다 —
# core는 Spring도 Jackson도 모른다(§3.2).
#
# 버전을 여기서 고르지 않는다. Boot 4.0.7 시절 처음에는 최신(1.11.0)을 직접 박았는데
# dependency locking 이 잡아냈다: 1.11.0이 kotlin-stdlib 2.3.20을 끌어와 **테스트
# 클래스패스의 stdlib만** 2.2.21 → 2.3.20으로 올렸다(main 은 2.2.21 유지). 컴파일과
# 테스트 실행이 서로 다른 stdlib 을 보는 상태이며, 계획 §3.1이 금지한 "각자 임의 버전으로
# 섞는" 바로 그 상황이다. 그래서 BOM 에 맡겼다(그때 값 1.9.0).
#
# Boot 4.1.0 에서는 BOM 이 관리하는 값이 1.11.0 이 됐고 Kotlin 도 2.3.21 이라, 같은
# 1.11.0 인데도 stdlib 이 갈리지 않는다(락파일 실측: 제품·테스트 클래스패스 모두 2.3.21).
# 결론은 바뀌지 않는다 — **여기서 고르지 않고 BOM 에 맡긴다**. 갈림을 막은 것은 버전을
# 잘 고른 것이 아니라 고르지 않은 것이다.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }

# --- 로깅 --------------------------------------------------------------------
# `application` 이 쓰는 파사드. 구현체(logback)는 실행 모듈(api·worker)의 starter 가
# 가져온다 — 유스케이스 모듈은 파사드만 알아야 로그 백엔드 교체가 그 모듈에 닿지 않는다.
# 버전은 Boot BOM 이 관리한다.
slf4j-api = { module = "org.slf4j:slf4j-api" }

# --- Kotlin 런타임 리플렉션 ---------------------------------------------------
# **설정 바인딩의 전제다.** Spring 이 Kotlin 주 생성자를 찾는 경로가 이것을 요구하고,
# 없으면 모든 @ConfigurationProperties 가 JavaBean 바인딩으로 떨어져 기본값과 다른 값을
# 넣는 순간 기동이 깨진다(사유 전문: EasyDocProperties KDoc, 2026-08-19 실측).
# 버전은 Boot BOM 이 import 하는 kotlin-bom 이 관리한다 — 컴파일러(2.3.21)와 갈리지 않는다.
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# --- detekt 규칙 -------------------------------------------------------------
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# --- 문서 추출 ---------------------------------------------------------------
# **infrastructure 에서만** 선언한다. api·worker 는 infrastructure 를 runtimeOnly 로
# 붙이므로 POI·PDFBox 타입을 컴파일 시점에 볼 수 없다(계획 §3.2 의존 방향).
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
xmlbeans = { module = "org.apache.xmlbeans:xmlbeans", version.ref = "xmlbeans" }

# POI 가 끌고 오는 `log4j-api` 는 **API 만**이라 바인딩이 없으면
# `Log4j API could not find a logging provider` 경고가 난다(spike S-10).
# slf4j 로 잇는다 — 버전은 Boot BOM 이 관리한다(log4j 2.25.2).
#
# **commons-logging(PDFBox 쪽)은 exclude 하지 않는다.** Spring Framework 7 이
# `spring-jcl` 을 제거했으므로 Boot 3 시절의 관용적 exclude 를 그대로 옮기면
# `NoClassDefFoundError` 가 난다. 잇고 싶으면 `jcl-over-slf4j` 를 **더하는**
# 방향으로만 한다.
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
