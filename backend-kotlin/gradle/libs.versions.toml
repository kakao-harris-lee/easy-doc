# 의존성 좌표와 버전의 **유일한** 선언 지점.
# 모듈 빌드 스크립트에는 `implementation(libs.xxx)` 형태만 쓴다 (kotlin-spring-conventions §1).
#
# 버전 근거 (계획 §3.1 "구현 시작 시 호환성 spike를 통과한 조합을 고정한다"):
#
# - Phase 0 문서 spike(`00_kotlin-implementer_doc-spike.md`)가 검증한 조합은
#   Java 21.0.4 Temurin / Gradle 9.1.0 / Kotlin 2.2.0 / POI 5.4.1 / PDFBox 3.0.5 /
#   commons-compress 1.27.1 이다. 그 spike는 Spring Boot BOM 없이 좌표를 해석했으므로
#   여기서 BOM 기준으로 재정렬했다.
# - Spring Boot는 **4.1.0**을 고른다. 계획 §3.1이 적은 "4.1 계열 후보"를 그대로 채택한
#   결정이며, 2026-08-12 사용자 승인 건이다(경위는
#   `docs/migration/_workspace/01_kotlin-implementer_boot41-upgrade.md`).
#   Phase 1 골격은 4.0.7로 먼저 만들어졌는데, 계획이 지정한 계열과 어긋난 채로 Kotlin
#   코드가 쌓이면 되돌리는 비용이 시간에 비례해 커지므로 코드량이 가장 적은 시점에 옮겼다.
#   실측 결과 4.1 계열의 안정판은 4.1.0 하나뿐이다(4.1.1 이후 없음, maven-metadata
#   `<release>4.1.0</release>`). 4.0.7 대비 이 프로젝트가 실제로 쓰는 좌표 중 바뀐 것은
#   Kotlin(2.2.21 → 2.3.21)·Flyway(11.14.1 → 12.4.0)·kotlinx-serialization(1.9.0 → 1.11.0)
#   세 개뿐이고, Spring Framework(7.0.8)·Jackson(3.1.4)·JUnit(6.0.3)·
#   Testcontainers(2.0.5)·PostgreSQL 드라이버(42.7.11)·AssertJ(3.27.7)는 동일하다.
# - 문서 파서 조합(POI 5.4.1 / PDFBox 3.0.5)은 Phase 0 spike가 Kotlin 2.2.0 위에서
#   통과시킨 것이다. 2.3.21은 그보다 높은 마이너이므로 **Phase 4 착수 전에 그 spike의
#   DOCX 동등성 7항목을 이 조합으로 다시 확인해야 한다.** 여기서는 좌표 해석·컴파일만
#   확인했다(산출물 참고).
# - Kotlin·Jackson·JUnit·Testcontainers·Flyway·PostgreSQL 드라이버는 버전을 여기에
#   적지 않고 **Boot BOM이 관리**하게 둔다. 계획 §3.1의 "각자 임의 버전으로 섞지 않는다"를
#   지키는 가장 확실한 방법이다. 관리되는 값은 위 주석에 실측 기록으로만 남긴다.

[versions]
# Kotlin 플러그인 버전만은 BOM이 아니라 여기서 정해야 한다(플러그인은 BOM 대상이 아님).
# Boot 4.1.0이 관리하는 kotlin.version과 **같은 값**으로 맞춰 런타임 라이브러리와
# 컴파일러가 갈리지 않게 한다. BOM 밖에서 따로 고르지 않는다.
kotlin = "2.3.21"
springBoot = "4.1.0"

# 품질 게이트. Boot BOM 대상이 아니라 직접 고정한다.
#
# 둘 다 **자기 안에 Kotlin 컴파일러를 하나씩 안고 있고, 그 버전은 우리가 컴파일하는
# 2.3.21 과 다르다.** 실측(락파일):
#   - detekt 1.23.8  → kotlin-compiler-embeddable 2.0.21
#   - ktlint-cli 1.8.0 → kotlin-compiler-embeddable 2.2.21
# 즉 소스를 파싱하는 컴파일러와 컴파일하는 컴파일러가 갈려 있다. 이것이 문제가 되는
# 지점은 하나다 — **2.3 에서 새로 생긴 문법을 쓰면 두 도구가 파싱에 실패한다.**
# Boot 4.1(Kotlin 2.3.21) 전환 시점 기준으로 현재 소스는 양쪽 다 위반 0으로 통과한다.
# 파싱 오류가 나기 시작하면 그때 대응한다(선택지와 근거는 아래).
#
# detekt 를 2.x 로 올리지 않는 이유: 2026-08-12 실측으로 안정판이 없다. 좌표가
# io.gitlab.arturbosch.detekt → dev.detekt 로 바뀌었고 dev.detekt 쪽에는
# 2.0.0-alpha.0 ~ alpha.6 만 올라와 있다. 품질 게이트를 alpha 에 걸면 게이트가
# 깨졌을 때 "우리 코드가 나쁜가, 게이트가 미완성인가"를 가릴 수 없다.
ktlintPlugin = "14.2.0"
ktlintCli = "1.8.0"
detekt = "1.23.8"

[libraries]
# --- Spring Boot BOM ---------------------------------------------------------
# platform()으로 적용해 아래 좌표들의 버전을 BOM이 결정하게 한다.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- Spring (버전 없음 = BOM 결정) -------------------------------------------
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4는 테스트 슬라이스도 기술별 모듈로 쪼갰다. @WebMvcTest·MockMvc 는
# spring-boot-starter-test 가 아니라 여기에 있다.
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# --- 마이그레이션 ------------------------------------------------------------
# Spring Boot 4는 autoconfigure를 기술별 모듈로 쪼갰다. Flyway 자동설정(FlywayMigrationStrategy
# 포함)은 spring-boot-autoconfigure가 아니라 spring-boot-flyway에 있고, starter가 그것을 끌어온다.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
# flyway-core만으로는 PostgreSQL을 인식하지 못한다(Flyway 10부터 DB별 모듈 분리).
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# --- DB ----------------------------------------------------------------------
postgresql = { module = "org.postgresql:postgresql" }

# --- LLM provider 어댑터 ------------------------------------------------------
# **벤더 SDK(anthropic-sdk-java)를 쓰지 않는다.** 이유는 격리다 — SDK 를 들이면 그 전이
# 의존성(자체 HTTP 클라이언트·Jackson 버전·재시도 정책)이 BOM 밖에서 따라 들어오고,
# 계획 §3.1이 금지한 "각자 임의 버전으로 섞는" 상태가 LLM 레인에서 되살아난다. 게다가
# SDK 의 내장 재시도는 워커 재시도와 겹쳐 호출 수를 늘린다(§4.6, §5 Phase 7 즉시 중단
# 기준의 "중복 LLM 호출"). Anthropic Messages API 는 단일 POST 라 Spring 의 RestClient
# 로 충분하고, 그 편이 재시도·타임아웃을 우리가 전부 통제한다.
#
# 둘 다 버전을 여기서 고르지 않는다 — Boot BOM 이 관리한다(spring-web 7.0.8,
# jackson-databind 3.1.4. api 모듈 락파일 실측). Jackson 3 은 groupId 가
# com.fasterxml → tools.jackson 으로 바뀐 계열이다.
spring-web = { module = "org.springframework:spring-web" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# --- 테스트 ------------------------------------------------------------------
# Testcontainers 2.x는 좌표가 바뀌었다: org.testcontainers:postgresql →
# org.testcontainers:testcontainers-postgresql (2.0.5 BOM 실측).
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }

# --- parity 하네스 -----------------------------------------------------------
# core 의 testFixtures 에서만 쓰는 JSON 직렬화. core 본 소스에는 들어가지 않는다 —
# core는 Spring도 Jackson도 모른다(§3.2).
#
# 버전을 여기서 고르지 않는다. Boot 4.0.7 시절 처음에는 최신(1.11.0)을 직접 박았는데
# dependency locking 이 잡아냈다: 1.11.0이 kotlin-stdlib 2.3.20을 끌어와 **테스트
# 클래스패스의 stdlib만** 2.2.21 → 2.3.20으로 올렸다(main 은 2.2.21 유지). 컴파일과
# 테스트 실행이 서로 다른 stdlib 을 보는 상태이며, 계획 §3.1이 금지한 "각자 임의 버전으로
# 섞는" 바로 그 상황이다. 그래서 BOM 에 맡겼다(그때 값 1.9.0).
#
# Boot 4.1.0 에서는 BOM 이 관리하는 값이 1.11.0 이 됐고 Kotlin 도 2.3.21 이라, 같은
# 1.11.0 인데도 stdlib 이 갈리지 않는다(락파일 실측: 제품·테스트 클래스패스 모두 2.3.21).
# 결론은 바뀌지 않는다 — **여기서 고르지 않고 BOM 에 맡긴다**. 갈림을 막은 것은 버전을
# 잘 고른 것이 아니라 고르지 않은 것이다.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }

# --- detekt 규칙 -------------------------------------------------------------
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
