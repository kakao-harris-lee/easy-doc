# buildUponDefaultConfig 위에 덮어쓰는 프로젝트 규칙이다.

build:
  maxIssues: 0

config:
  validation: true

potential-bugs:
  UnsafeCallOnNullableType:
    # `!!` 대신 타입이나 명시적 예외로 처리한다.
    active: true
  UnsafeCast:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  PrintStackTrace:
    active: true

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  ForbiddenComment:
    active: true
    # 미완성 작업은 코드가 아니라 backlog에서 관리한다.
    comments:
      - reason: '미완성 표시는 docs/kotlin-redevelopment-backlog.md 에 적는다'
        value: 'FIXME:'
      - reason: '미완성 표시는 docs/kotlin-redevelopment-backlog.md 에 적는다'
        value: 'STOPSHIP:'

performance:
  SpreadOperator:
    # Spring Boot의 `runApplication<App>(*args)`를 허용한다.
    active: false

complexity:
  LongParameterList:
    ignoreAnnotated:
      - 'ConfigurationProperties'

naming:
  FunctionNaming:
    # 테스트 함수는 한국어 백틱 식별자를 허용한다.
    ignoreAnnotated:
      - 'Test'
      - 'ParameterizedTest'

formatting:
  # 포맷 검사는 ktlint 태스크가 담당한다.
  active: false
