spring:
  application:
    name: easy-doc-worker

  profiles:
    default: worker

  main:
    # worker는 HTTP를 받지 않고 상주한다.
    web-application-type: none
    keep-alive: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easydoc}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      initialization-fail-timeout: -1

  flyway:
    # 일회성 운영 프로필은 시작 전에 스키마를 확인한다. 상주 worker만 아래 프로필 문서에서 끈다.
    enabled: true

easydoc:
  table-relations:
    enabled: ${EASYDOC_TABLE_RELATIONS_ENABLED:false}
  review-history:
    enabled: ${EASYDOC_REVIEW_HISTORY_ENABLED:false}
  explanations:
    enabled: ${EASYDOC_EXPLANATIONS_ENABLED:false}
  illustrations:
    enabled: ${EASYDOC_ILLUSTRATIONS_ENABLED:false}
  action-guide:
    analysis-enabled: ${EASYDOC_ACTION_GUIDE_ANALYSIS_ENABLED:false}
    enabled: ${EASYDOC_ACTION_GUIDE_ENABLED:false}
    worker-enabled: ${EASYDOC_ACTION_GUIDE_WORKER_ENABLED:false}
    owner: ${EASYDOC_ACTION_GUIDE_WORKER_OWNER:}
    lease-duration-seconds: ${EASYDOC_ACTION_GUIDE_LEASE_DURATION_SECONDS:120}
    # 만료된 리스를 다시 넘기는 횟수 상한. 넘으면 호출 없이 실패로 정산해 예약과 slot을 돌려준다.
    max-lease-attempts: ${EASYDOC_ACTION_GUIDE_MAX_LEASE_ATTEMPTS:5}
    poll-interval-ms: ${EASYDOC_ACTION_GUIDE_POLL_INTERVAL_MS:500}
  # R7 ER-17 문맥 기반 그림 제안 worker. 토글 둘 다 꺼진 것이 기본값이다.
  illustration-suggestions:
    enabled: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_ENABLED:false}
    worker-enabled: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_WORKER_ENABLED:false}
    owner: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_WORKER_OWNER:}
    lease-duration-seconds: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_LEASE_DURATION_SECONDS:120}
    # 만료된 리스를 다시 넘기는 횟수 상한. 넘으면 호출 없이 실패로 정산해 예약과 slot을 돌려준다.
    max-lease-attempts: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_MAX_LEASE_ATTEMPTS:5}
    # 문서당 provider 시작 누적 상한(명세 §2). 운영 구성이며 D04를 자동 승계한 값이 아니다.
    max-provider-attempts-per-conversion: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_MAX_PROVIDER_ATTEMPTS:3}
    poll-interval-ms: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_POLL_INTERVAL_MS:500}
    max-output-tokens: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_MAX_OUTPUT_TOKENS:8192}
    # 미설정과 0은 다르다 — 실제 provider worker는 0 이하를 기동에서 거부한다.
    credits-per-100-chars: ${EASYDOC_ILLUSTRATION_SUGGESTIONS_CREDITS_PER_100_CHARS:}
  ingest:
    max-concurrent-extractions: ${EASYDOC_MAX_CONCURRENT_EXTRACTIONS:4}
  prompt:
    structure-max-runs: ${EASYDOC_PROMPT_STRUCTURE_MAX_RUNS:40}
    context-explanation-version: ${EASYDOC_PROMPT_CONTEXT_EXPLANATION_VERSION:BASELINE}
  payment:
    provider: ${EASYDOC_PAYMENT_PROVIDER:stub}
    mock-enabled: ${EASYDOC_PAYMENT_MOCK_ENABLED:false}
    toss-client-key: ${EASYDOC_TOSS_CLIENT_KEY:}
    toss-secret-key: ${EASYDOC_TOSS_SECRET_KEY:}
  # API와 같은 암호화 키 링을 사용한다.
  encryption:
    write-key-version: ${EASYDOC_ENCRYPTION_WRITE_KEY_VERSION:1}
    keys:
      - version: 1
        value: ${EASYDOC_ENCRYPTION_KEY_V1:}
        kcv: ${EASYDOC_ENCRYPTION_KCV_V1:}
  llm:
    provider: ${EASYDOC_LLM_PROVIDER:anthropic}
    model: ${EASYDOC_LLM_MODEL:}
    effort: ${EASYDOC_LLM_EFFORT:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    open-ai-api-key: ${OPENAI_API_KEY:}
    # 모델의 출력 한도를 넘기면 기동 검증이 실패한다.
    max-output-tokens: ${EASYDOC_LLM_MAX_OUTPUT_TOKENS:64000}
    read-timeout: ${EASYDOC_LLM_READ_TIMEOUT:120}
    pricing:
      input-usd-per-million-tokens: ${EASYDOC_LLM_INPUT_USD_PER_MILLION_TOKENS:}
      output-usd-per-million-tokens: ${EASYDOC_LLM_OUTPUT_USD_PER_MILLION_TOKENS:}
  worker:
    owner: ${EASYDOC_WORKER_OWNER:}
    lease-duration-seconds: ${EASYDOC_WORKER_LEASE_DURATION_SECONDS:120}
    max-attempts: ${EASYDOC_WORKER_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${EASYDOC_WORKER_RETRY_BACKOFF_SECONDS:5}
    heartbeat-interval-seconds: ${EASYDOC_WORKER_HEARTBEAT_INTERVAL_SECONDS:40}
    poll-interval-ms: ${EASYDOC_WORKER_POLL_INTERVAL_MS:500}
  retention:
    enabled: ${EASYDOC_RETENTION_ENABLED:true}
    dry-run: ${EASYDOC_RETENTION_DRY_RUN:false}
    cron: ${EASYDOC_RETENTION_CRON:0 0 3 * * *}
    batch-size: ${EASYDOC_RETENTION_BATCH_SIZE:100}
  access-log:
    zone: ${EASYDOC_ACCESS_LOG_ZONE:Asia/Seoul}
    retention: ${EASYDOC_ACCESS_LOG_RETENTION:P1Y}
    purge-enabled: ${EASYDOC_ACCESS_LOG_PURGE_ENABLED:true}
    purge-batch-size: ${EASYDOC_ACCESS_LOG_PURGE_BATCH_SIZE:200}
  auth:
    unverified-purge:
      enabled: ${EASYDOC_AUTH_UNVERIFIED_PURGE_ENABLED:true}
      ttl-hours: ${EASYDOC_AUTH_UNVERIFIED_PURGE_TTL_HOURS:24}
      batch-size: ${EASYDOC_AUTH_UNVERIFIED_PURGE_BATCH_SIZE:200}
    ephemeral-purge:
      enabled: ${EASYDOC_AUTH_EPHEMERAL_PURGE_ENABLED:true}
      retention-hours: ${EASYDOC_AUTH_EPHEMERAL_PURGE_RETENTION_HOURS:24}
      batch-size: ${EASYDOC_AUTH_EPHEMERAL_PURGE_BATCH_SIZE:500}
  # 종료된 자동 갱신 주기의 이용량을 초기화한다.
  credits:
    cycle-reset:
      enabled: ${EASYDOC_CREDITS_CYCLE_RESET_ENABLED:true}
      cron: ${EASYDOC_CREDITS_CYCLE_RESET_CRON:0 30 3 * * *}
      batch-size: ${EASYDOC_CREDITS_CYCLE_RESET_BATCH_SIZE:200}
  feedback:
    edit-distance-cell-budget: ${EASYDOC_FEEDBACK_EDIT_DISTANCE_CELL_BUDGET:200000000}
    comment-retention-days: ${EASYDOC_FEEDBACK_COMMENT_RETENTION_DAYS:30}
  mail:
    templates-location: ${EASYDOC_MAIL_TEMPLATES_LOCATION:classpath:mail/notifications.properties}
    provider: ${EASYDOC_MAIL_PROVIDER:fake}
    from-address: ${EASYDOC_MAIL_FROM_ADDRESS:no-reply@easydoc.kr}
    timeout-ms: ${EASYDOC_MAIL_TIMEOUT_MS:5000}
    smtp:
      host: ${EASYDOC_MAIL_SMTP_HOST:}
      port: ${EASYDOC_MAIL_SMTP_PORT:465}
      ssl: ${EASYDOC_MAIL_SMTP_SSL:true}
      username: ${EASYDOC_MAIL_SMTP_USERNAME:}
      password: ${EASYDOC_MAIL_SMTP_PASSWORD:}
  # worker도 infrastructure의 인증 정리 bean을 조립하므로 API와 같은 SMS/휴대폰 인증
  # 설정을 바인딩해야 한다. 환경변수 이름도 공개 배포 계약(.env.example)과 맞춘다.
  sms:
    provider: ${EASYDOC_SMS_PROVIDER:fake}
    service-id: ${EASYDOC_SENS_SERVICE_ID:}
    access-key: ${EASYDOC_SENS_ACCESS_KEY:}
    secret-key: ${EASYDOC_SENS_SECRET_KEY:}
    from: ${EASYDOC_SMS_FROM:}
    timeout-ms: ${EASYDOC_SMS_TIMEOUT_MS:5000}
  phone-verification:
    code-ttl-minutes: ${EASYDOC_PHONE_VERIFICATION_CODE_TTL_MINUTES:5}
    resend-cooldown-seconds: ${EASYDOC_PHONE_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EASYDOC_PHONE_VERIFICATION_MAX_ATTEMPTS:5}
    trial-credits: ${EASYDOC_PHONE_VERIFICATION_TRIAL_CREDITS:5}
    fingerprint-pepper: ${EASYDOC_PHONE_VERIFICATION_PEPPER:}
  app:
    public-base-url: ${EASYDOC_APP_PUBLIC_BASE_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    kr.easydoc: INFO

---
spring:
  config:
    activate:
      on-profile: worker
  flyway:
    # API와 동시에 시작하는 상주 worker는 스키마 마이그레이션에 참여하지 않는다.
    enabled: false
