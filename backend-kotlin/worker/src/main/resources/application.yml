spring:
  application:
    name: easy-doc-worker

  profiles:
    default: worker

  main:
    # worker 는 HTTP 를 받지 않는다.
    web-application-type: none
    # 웹 서버가 없으면 non-daemon 스레드가 하나도 없어 main 이 반환하는 순간 JVM 이
    # 종료한다(Phase 1 compose 실행에서 실제로 exit 0 로 즉시 끝나는 것을 확인했다).
    # worker 는 상주 프로세스여야 하므로 Spring 이 유지 스레드를 띄우게 한다.
    # Phase 5에서 lease 폴링 루프가 붙으면 그 루프가 같은 일을 하지만, 그때까지 compose 의
    # worker 서비스가 "떠 있다"를 보여줄 수 있어야 배선 문제와 구분된다.
    keep-alive: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easydoc_kotlin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      initialization-fail-timeout: -1

  flyway:
    # worker 는 스키마를 적용하지 않는다. 마이그레이션 주체는 migrate profile 하나뿐이다 —
    # 여럿이 동시에 migrate 하면 Flyway 잠금 경합과 부분 적용 상태가 생긴다.
    enabled: false

easydoc:
  # worker 도 같은 키를 갖는다 — 변환 결과·마스킹 대응표를 쓰는 쪽이 여기다(Phase 5).
  # api 와 **같은 환경변수 이름**을 읽는다. 두 프로세스가 다른 키를 들면 한쪽이 쓴 행을
  # 다른 쪽이 열지 못하고, 그 실패는 단일 예외라 원인이 드러나지 않는다.
  #
  # **값이 비면 worker 도 뜨지 않는다** — api 와 같은 기동 자기점검을 지난다.
  # 면제되는 프로필은 `migrate` 하나뿐이고 worker 는 거기에 들지 않는다.
  encryption:
    write-key-version: ${EASYDOC_ENCRYPTION_WRITE_KEY_VERSION:1}
    keys:
      - version: 1
        value: ${EASYDOC_ENCRYPTION_KEY_V1:}
        # 키 검사값(12자리 hex). **비밀이 아니다** — 키와 다른 자리에서 받아야 대조가 뜻을
        # 가진다. 값을 모르면 비워 둔 채 한 번 띄워라. 기동이 실패하면서 계산값을 알려 준다.
        kcv: ${EASYDOC_ENCRYPTION_KCV_V1:}

logging:
  level:
    root: INFO
    kr.easydoc: INFO
