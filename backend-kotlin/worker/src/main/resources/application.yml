spring:
  application:
    name: easy-doc-worker

  profiles:
    default: worker

  main:
    # worker 는 HTTP 를 받지 않는다.
    web-application-type: none
    # 웹 서버가 없으면 non-daemon 스레드가 하나도 없어 main 이 반환하는 순간 JVM 이
    # 종료한다(Phase 1 compose 실행에서 실제로 exit 0 로 즉시 끝나는 것을 확인했다).
    # worker 는 상주 프로세스여야 하므로 Spring 이 유지 스레드를 띄우게 한다.
    # 스케줄 폴링이 큐를 비워도 keep-alive 는 남겨 둔다 — idle 이어도 프로세스가 죽지 않는다.
    keep-alive: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easydoc}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      initialization-fail-timeout: -1

  flyway:
    # worker 는 스키마를 적용하지 않는다. Flyway 는 api 프로세스가 기동할 때만 실행한다 —
    # worker 와 동시에 migrate 하면 Flyway 잠금 경합이 생긴다.
    enabled: false

easydoc:
  # worker 도 같은 키를 갖는다 — 변환 결과·마스킹 대응표를 쓰는 쪽이 여기다.
  # api 와 **같은 환경변수 이름**을 읽는다. 두 프로세스가 다른 키를 들면 한쪽이 쓴 행을
  # 다른 쪽이 열지 못하고, 그 실패는 단일 예외라 원인이 드러나지 않는다.
  #
  # **값이 비면 worker 도 뜨지 않는다** — api 와 같은 기동 자기점검을 지난다.
  # 면제되는 프로필은 `migrate` 하나뿐이고 worker 는 거기에 들지 않는다.
  encryption:
    write-key-version: ${EASYDOC_ENCRYPTION_WRITE_KEY_VERSION:1}
    keys:
      - version: 1
        value: ${EASYDOC_ENCRYPTION_KEY_V1:}
        # 키 검사값(12자리 hex). **비밀이 아니다** — 키와 다른 자리에서 받아야 대조가 뜻을
        # 가진다. 값을 모르면 비워 둔 채 한 번 띄워라. 기동이 실패하면서 계산값을 알려 준다.
        kcv: ${EASYDOC_ENCRYPTION_KCV_V1:}
  llm:
    provider: ${EASYDOC_LLM_PROVIDER:anthropic}
    model: ${EASYDOC_LLM_MODEL:}
    effort: ${EASYDOC_LLM_EFFORT:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    open-ai-api-key: ${OPENAI_API_KEY:}
    # api 와 같은 이름·같은 기본값. ConvertDocumentUseCase 를 실제로 돌리는 것은
    # worker 프로세스이므로 이 값이 닿아야 하는 자리는 여기다.
    # 기본값 64000 은 anthropic 기준(게이트 ⓪ 3차 측정 조건)이다. provider 를 openai 로
    # 바꾸면 그 모델의 출력 한도(gpt-4.1: 32,768) 이하로 낮춰야 한다 — 알려진 모델
    # (LlmProviderConfiguration 의 KNOWN_MODEL_MAX_OUTPUT_TOKENS 표에 있는 모델.
    # EASYDOC_LLM_MODEL 을 비워 기본 모델을 쓰거나 gpt-4.1 을 그대로 명시한 경우)이면
    # 기동 시점에 조립을 막는다. EASYDOC_LLM_MODEL 을 표에 없는 모델로 지정하면 이
    # 검사를 건너뛴다 — 그 모델의 한도는 운영자 책임이다.
    max-output-tokens: ${EASYDOC_LLM_MAX_OUTPUT_TOKENS:64000}
    # api 와 같은 이름·같은 기본값·같은 이유(api application.yml 의 read-timeout 주석 참고).
    read-timeout: ${EASYDOC_LLM_READ_TIMEOUT:120}
    pricing:
      input-usd-per-million-tokens: ${EASYDOC_LLM_INPUT_USD_PER_MILLION_TOKENS:}
      output-usd-per-million-tokens: ${EASYDOC_LLM_OUTPUT_USD_PER_MILLION_TOKENS:}
      # 모델별 단가(선택, U1). api 의 같은 자리와 같은 설명 — 키가 임의 모델 식별자라
      # .env.example 환경변수 하나로는 표현할 수 없다. LLM 을 실제로 호출하는 것이 이
      # 프로세스이므로 이 값이 닿아야 하는 자리는 여기다.
      # models:
      #   claude-sonnet-5:
      #     input-usd-per-million-tokens: 2.00
      #     output-usd-per-million-tokens: 10.00
      # 모델 id 에 점이 있으면(gpt-4.1 등) api 의 같은 자리와 같은 이유로 이 YAML 중첩
      # 매핑에서는 키를 그대로 적으면 된다 — 대괄호 표기(`models[gpt-4.1]`)는 평평한 키
      # 형태(커맨드라인 인자·환경변수)로 채울 때만 필요하다.
  worker:
    owner: ${EASYDOC_WORKER_OWNER:}
    lease-duration-seconds: ${EASYDOC_WORKER_LEASE_DURATION_SECONDS:120}
    max-attempts: ${EASYDOC_WORKER_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${EASYDOC_WORKER_RETRY_BACKOFF_SECONDS:5}
    heartbeat-interval-seconds: ${EASYDOC_WORKER_HEARTBEAT_INTERVAL_SECONDS:40}
    poll-interval-ms: ${EASYDOC_WORKER_POLL_INTERVAL_MS:500}
  retention:
    enabled: ${EASYDOC_RETENTION_ENABLED:true}
    dry-run: ${EASYDOC_RETENTION_DRY_RUN:false}
    cron: ${EASYDOC_RETENTION_CRON:0 0 3 * * *}
    batch-size: ${EASYDOC_RETENTION_BATCH_SIZE:100}
  # 미검증 계정 TTL 파기(`docs/kotlin-redevelopment-backlog.md` §1.4 ⑵ ⓐ, 2026-09-07 결정).
  # 가입(비밀번호·소셜 공통) 후 이 시간 안에 이메일을 검증하지 않은 계정을 `RetentionPurgeScheduler`
  # 세 번째 단계가 지운다 — 미검증 계정이 `ix_users_email`(V1)을 무기한 선점해 진짜 이메일
  # 소유자의 가입을 막는 문제를 닫는다. 작업 공간·신원·인증 코드는 FK CASCADE 로 함께
  # 사라지고, 문서를 가진 계정은 건너뛰고 개수만 센다(`UnverifiedAccountPurgeConfiguration` KDoc).
  auth:
    unverified-purge:
      enabled: ${EASYDOC_AUTH_UNVERIFIED_PURGE_ENABLED:true}
      ttl-hours: ${EASYDOC_AUTH_UNVERIFIED_PURGE_TTL_HOURS:24}
      batch-size: ${EASYDOC_AUTH_UNVERIFIED_PURGE_BATCH_SIZE:200}
  # 크레딧 주기 초기화 — 크레딧을 「구독 주기에 포함된 이용량」으로 바꾼 사용자 결정
  # (2026-09-10). `cycle_ends_at`이 지난 계정마다 남은 잔액을 버리고 그 주기의 이용량
  # (`allowance`)으로 다시 채운다(`CreditCycleResetScheduler`, 매일 03:30). `cycle_ends_at
  # IS NULL`인 계정(주기 없음)은 건드리지 않는다 — 배포 직후 기존 계정 전부가 이 상태다.
  credits:
    cycle-reset:
      enabled: ${EASYDOC_CREDITS_CYCLE_RESET_ENABLED:true}
      cron: ${EASYDOC_CREDITS_CYCLE_RESET_CRON:0 30 3 * * *}
      batch-size: ${EASYDOC_CREDITS_CYCLE_RESET_BATCH_SIZE:200}
  # `DocumentConfiguration` 이 worker 에도 조립돼(`@Profile("!migrate")`) `ConversionFeedbackService`
  # 빈이 여기서도 서지만, 그 유스케이스를 부르는 `PUT /conversions/{id}/feedback` 컨트롤러는
  # api 에만 있다 — worker 는 이 경로를 실행하지 않는다. 그래도 api 와 **같은 환경변수 이름**을
  # 두는 것은 두 프로세스가 값을 요구하면 같은 손잡이여야 하기 때문이다(설명은 api 쪽 주석).
  feedback:
    edit-distance-cell-budget: ${EASYDOC_FEEDBACK_EDIT_DISTANCE_CELL_BUDGET:200000000}
    # 피드백 자유 의견(comment_encrypted 등 세 열)의 보존 일수. `RetentionPurgeScheduler`
    # 가 easydoc.retention 의 enabled·dryRun·batchSize 를 그대로 쓰면서 이 일수보다 오래된
    # 의견 세 열만 NULL 로 만든다 — 배포 의향·품질 만족도·소요 시간·수정률 지표(평문 숫자)는
    # 건드리지 않고 영구히 남는다(`FeedbackProperties` KDoc, master-plan §3.2).
    comment-retention-days: ${EASYDOC_FEEDBACK_COMMENT_RETENTION_DAYS:30}
  # 변환 완료 메일 알림(P0-3). 실제로 보내는 프로세스는 worker 다
  # (`ConversionCompletedNotifier`가 완료 커밋 뒤 여기서 불린다) — api 와 **같은 환경변수
  # 이름**을 두는 것은 다른 easydoc.* 설정과 같은 이유(두 프로세스가 값을 요구하면 같은
  # 손잡이여야 한다). provider 는 fake·smtp 둘이다(backlog §1.4, `MailConfiguration` KDoc).
  # smtp 는 임시 relay(2026-09-04 사용자 결정, SES 전환 전까지).
  mail:
    provider: ${EASYDOC_MAIL_PROVIDER:fake}
    from-address: ${EASYDOC_MAIL_FROM_ADDRESS:no-reply@easydoc.kr}
    timeout-ms: ${EASYDOC_MAIL_TIMEOUT_MS:5000}
    # api 의 easydoc.mail.smtp 주석과 같다 — worker 가 실제로 이 값을 쓴다.
    smtp:
      host: ${EASYDOC_MAIL_SMTP_HOST:}
      port: ${EASYDOC_MAIL_SMTP_PORT:465}
      ssl: ${EASYDOC_MAIL_SMTP_SSL:true}
      username: ${EASYDOC_MAIL_SMTP_USERNAME:}
      password: ${EASYDOC_MAIL_SMTP_PASSWORD:}
  # 알림 메일 링크의 기준 URL. api 의 easydoc.app 주석과 같다.
  app:
    public-base-url: ${EASYDOC_APP_PUBLIC_BASE_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    kr.easydoc: INFO
