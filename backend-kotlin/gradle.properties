# Gradle 데몬 힙. 문서 파서 spike에서 1GiB zip bomb 거부를 힙 256MB로 확인했으므로
# 테스트 JVM 힙은 별도로 좁게 잡는다(Phase 4). 여기 값은 빌드 데몬용이다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# configuration cache 는 아직 켜지 않는다 — ktlint/detekt 플러그인과의 호환을
# 이 Phase에서 검증하지 않았다. 켜는 판단은 별건으로 남긴다.
org.gradle.configuration-cache=false

kotlin.code.style=official
