spring:
  application:
    name: easy-doc-api

  # 실행 profile 은 api / worker / migrate 셋이다 (계획 §3.2).
  # 같은 JAR·같은 레이어를 쓰고 profile 로만 갈린다.
  profiles:
    default: api

  datasource:
    # 기본값은 compose.yml 의 로컬 개발 환경 기준. 운영은 환경변수로 덮어쓴다.
    # 비밀값을 이 파일에 적지 않는다 — .env/환경변수만 쓴다(프로젝트 CLAUDE.md).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easydoc}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # 기동 시 접속을 시도하지 않는다 — DB가 떠 있지 않아도 앱은 뜨고 /health 로
      # 진단할 수 있어야 한다. 실제 의존성 상태는 health 진단에서 구분한다.
      initialization-fail-timeout: -1

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate 를 켜지 않는다 — 이제 이 값을 쓰는 baseline 판정 로직이
    # 없으므로 항상 통상적인 마이그레이션 절차(V1부터 순서대로 적용)만 돈다.
    baseline-on-migrate: false
    baseline-version: 1

  # 오류 응답은 GlobalExceptionHandler 가 {"detail": ...} 로 만든다.
  # Spring 기본 /error 경로가 ProblemDetail 이나 흰 화면을 내지 않도록 막는다.
  mvc:
    problemdetails:
      enabled: false

  # --- multipart (POST /documents 파일 모드) — 계획 §5 D-1 의 L0 ---------------
  #
  # **컨테이너 상한은 계약 상한보다 넉넉해야 한다.** 정확한 경계 판정은 서비스가
  # 한다(`MAX_UPLOAD_BYTES` → UploadTooLargeException → 413 + 계약 문구). 컨테이너가
  # 경계를 판정하면 문구와 경계가 구현에 좌우되고, Spring 이 컨테이너 초과를 알아내는
  # 방식이 **Tomcat 예외 메시지 문자열 매칭**이라 메시지가 바뀌면 413 이 조용히 500 이
  # 된다(계획 §1.5 설계 지점 2 ⑵).
  #
  # 기본값을 그대로 두면 **DC-13 이 반드시 깨진다** — `max-file-size` 기본이 1MB 이고
  # `max-request-size` 기본이 10MB 라, 정확히 계약 상한(10MB)인 파일이 multipart 경계·
  # 파트 헤더 오버헤드 때문에 요청 전체로는 상한을 넘는다. 그래서 **둘 다** 올린다.
  #
  # 두 값이 계약 `x-input-limits.max_upload_bytes` 이상인지는 손으로 지키지 않는다 —
  # `DocumentEndpointReachTest` 의 「컨테이너 multipart 상한이 계약 업로드 상한 이상이다」가
  # 실기동 컨텍스트에서 `MultipartProperties` 를 읽어 계약과 대조한다.
  # (2026-08-21 정정 — 종전 문면은 저장소에 없는 이름을 지목했다. 그 종류는 이제
  # `NamedReferenceGuardTest` 축 A 가 잰다.)
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
      # 파싱 대상을 `multipart/form-data` 로 좁힌다(Boot 4 신설). 판정은
      # `StandardServletMultipartResolver.isMultipart` 의 `startsWithIgnoreCase` 하나뿐이라
      # **대소문자 비교는 그대로다** — DC-5(`Multipart/Form-Data`)에 영향이 없다(바이트코드 실측).
      strict-servlet-compliance: true
      # resolve-lazily 를 켜지 않는다. 켜면 상한 초과 예외가 `checkMultipart` 가 아니라
      # **핸들러 안(첫 파라미터 접근)** 에서 나고, 그러면 예외가 나는 시점이 인증·라우팅
      # 뒤로 밀려 어느 갈래가 먼저인지가 구현에 좌우된다.
      resolve-lazily: false

server:
  port: ${SERVER_PORT:8000}
  tomcat:
    # 요청 본문을 거절한 뒤 **남은 바이트를 삼키는** 상한 (계획 §5 D-3).
    #
    # 기본 2MB 다. 초과분을 삼키지 않으면 Tomcat 이 연결을 리셋하고, 그러면 클라이언트가
    # **413 본문을 읽지 못한다** — MockMvc 는 이 경로를 재현하지 못하면서 통과하므로
    # 실제 소켓(C-R)에서만 드러난다.
    #
    # `-1`(무제한)을 쓰지 않는다. 무제한은 거절한 요청의 나머지를 **끝까지** 읽어 주는
    # 것이라, 거절이 곧 방어가 되지 못한다. 위 `max-request-size` 보다 크되 유한한 값이면
    # 정상 초과 요청은 본문을 받아 보고 악의적 무한 본문은 리셋된다.
    max-swallow-size: 16MB
  error:
    # 오류 응답에 스택 트레이스·예외 메시지·바인딩 오류가 실리지 않게 전부 끈다.
    # 하나라도 켜지면 문서 본문이나 입력값이 응답 본문으로 새는 경로가 생긴다.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

easydoc:
  cors-origins:
    - http://localhost:5173
  auth:
    jwt-expire-minutes: 60
  llm:
    provider: ${EASYDOC_LLM_PROVIDER:openai}
    model: ${EASYDOC_LLM_MODEL:}
    effort: ${EASYDOC_LLM_EFFORT:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    open-ai-api-key: ${OPENAI_API_KEY:}
    pricing:
      input-usd-per-million-tokens: ${EASYDOC_LLM_INPUT_USD_PER_MILLION_TOKENS:}
      output-usd-per-million-tokens: ${EASYDOC_LLM_OUTPUT_USD_PER_MILLION_TOKENS:}
  # 저장 암호화(AES-256-GCM). 키는 base64 32바이트이고 **환경변수로만** 준다 —
  # 값을 이 파일에 적지 않는다(프로젝트 CLAUDE.md 보안 규칙).
  #
  # 회전 절차: 새 세대를 keys 에 **더하고** write-key-version 을 올린다. 옛 세대를
  # 목록에 남겨 두는 한 그 세대로 쓴 행은 계속 읽힌다(key_version 컬럼이 가리킨다).
  #
  # **값이 비면 앱이 뜨지 않는다.** 게이트 25 F-2·F-3 리더 판정으로 기동 자기점검이
  # 붙었고, 게이트 26 조치 3 으로 「kcv 만 적히고 값이 빈 세대」와 「값도 kcv 도 없는
  # 세대」도 기동 실패다. 오설정을 첫 업로드까지 미루면 그 사이에 쓴 행을 되돌릴 수
  # 없기 때문이다. 자기점검을 끄는 설정은 없다 — 있으면 그것이 곧 배포 시점 우회다.
  #
  # 예외는 `migrate` 프로필 하나다. 스키마만 옮기는 실행은 본문 암호화 키를 쥐지 않는다
  # (아래 migrate 문서 참고).
  encryption:
    write-key-version: ${EASYDOC_ENCRYPTION_WRITE_KEY_VERSION:1}
    keys:
      - version: 1
        value: ${EASYDOC_ENCRYPTION_KEY_V1:}
        # 키 검사값(12자리 hex). **비밀이 아니다** — 키와 다른 자리에서 받아야 대조가 뜻을
        # 가진다. 값을 모르면 비워 둔 채 한 번 띄워라. 기동이 실패하면서 계산값을 알려 준다.
        kcv: ${EASYDOC_ENCRYPTION_KCV_V1:}

logging:
  level:
    root: INFO
    kr.easydoc: INFO
    # 요청 본문을 찍는 로거는 절대 DEBUG 로 내리지 않는다 — 문서 본문이 로그에 남는다.
    org.springframework.web: INFO
    # ── 요청 값을 실제로 찍는 프레임워크 로거 3종 (게이트 28 P-2 / 원장 조건 18) ──
    #
    # 위 주석은 「요청 본문을 찍는 로거」라고 **복수로 선언**하면서 실제로는
    # org.springframework.web 하나만 가리키고 있었다. 그런데 강제 TRACE 에서 값을 찍는
    # 로거는 아래 셋이고 그중 어느 것도 그 한 줄에 걸리지 않는다 — 지금까지 조용했던 것은
    # 우리 고정 덕이 아니라 root: INFO 상속 덕이었다(privacy-gate 기록 ③ 실측:
    # reviews/03_security-workspaces-fixes_privacy-gate.md).
    #
    # 실측으로 확인한 각 로거가 흘리는 것:
    #   Http11InputBuffer      원시 요청 바이트 — 본문·제목·평문 비밀번호·Bearer 토큰 전부
    #   StatementCreatorUtils  JDBC 바인딩 파라미터 — 평문으로 저장되는 열(제목·이메일)
    #   QueryExecutorImpl      PostgreSQL 와이어 프로토콜 — 같은 파라미터의 전송 형태
    #
    # 이 고정은 **강제·표현형**이다(방출 자체를 막는다). 은폐형이 아니다 — 은폐형은
    # 신호를 줄이는 것(무시 패턴·억제·면제 조항)이고, 여기서 줄어드는 신호는 없다.
    #
    # **한계: 이것은 열거다.** 다음 판올림이 **네 번째 로거**로 같은 값을 흘리면 이 세 줄은
    # 아무것도 못 잡는다. 그 빈자리는 목록이 아니라 **실제 방출을 재는 탐지**가 덮는다:
    # api/src/test/.../DocumentBodyLogLeakReachTest — 루트만 TRACE 로 올리고 로거 이름을
    # 모른 채 방출 전량을 훑어 카나리 0건인지 본다. 그러므로 ⑴ 이 세 줄을 지우면 ⑵ 네 번째
    # 로거가 생기면 ⑶ 방어가 사라지면 그 커밋에서 빨개진다. 두 겹을 함께 지운 채로 통과하는
    # 경로는 없다. 세 줄을 지울 때는 그 회귀부터 돌려라.
    org.apache.coyote.http11.Http11InputBuffer: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
    org.postgresql.core.v3.QueryExecutorImpl: INFO
    # 이 고정이 막는 것은 **DEBUG/TRACE 가 기본값을 따라 내려오는 경로 하나**다.
    # L-1 이 걱정한 유출(Argon2PasswordEncoder 가 깨진 해시에 내는 WARN + 스택트레이스)은
    # WARN 이 INFO 위라 **여기서 막히지 않는다** — privacy-gate 가 깨진 PHC 를 주입해
    # 실측했다. 그 자리는 레벨이 아니라 회귀가 지킨다:
    # api/src/test/.../PasswordHashLogLeakReachTest — 깨진 PHC 를 주입한 로그인의 전체
    # 로그에 PHC·평문 비밀번호·이메일이 0건인지 본다. 로거를 ERROR 로 올려 닫지 않는다
    # (진단이 사라지고, 다른 로거가 같은 것을 흘리면 아무도 모른다).
    org.springframework.security: INFO
    org.flywaydb: INFO

---
# migrate profile — 스키마만 적용하고 종료한다. compose 의 backend-migrate가 쓴다.
#
# **본문 암호화 키를 요구하지 않는다** (게이트 26 조치 2). CryptoConfiguration 이
# `@Profile("!migrate")` 라 이 프로필에서는 조립되지 않으므로, 키가 비어 있어도 뜨고
# 키가 있어도 그것을 SecretKey 로 만들지 않는다 — 스키마만 옮기는 잡이 본문 키를
# 쥘 이유가 없다(privacy-gate R-2 최소 권한).
#
# 자기 전제(DB 도달·Flyway 적용)에 대해서는 그대로 fail-fast 다. 면제된 것은
# 「본문 암호화 키」 하나뿐이고, 그 경계를 CryptoProfileExemptionTest 가 고정한다.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
