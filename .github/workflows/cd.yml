name: CD - publish container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/easy-doc-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/easy-doc-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 배포 이미지 빌드
        run: docker compose -f compose.yml build backend-api frontend
      - name: 배포 이미지 게시
        run: docker compose -f compose.yml push backend-api frontend
      - name: 배포용 Compose 모델 보관
        run: docker compose -f compose.yml config > release-compose.yml
      - uses: actions/upload-artifact@v4
        with:
          name: release-compose-${{ github.sha }}
          path: release-compose.yml
          retention-days: 30

