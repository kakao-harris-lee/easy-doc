name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: 로컬 전체 스택 모델 검증
        run: docker compose -f compose.yml config --quiet
      - name: CI 서비스 포함 모델 검증
        run: docker compose -f compose.yml -f compose.ci.yml --profile ci config --quiet
      - name: E2E override 모델 검증
        run: docker compose -f compose.yml -f compose.e2e.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp .env.example .env
      - name: Kotlin 빌드·정적 분석·테스트
        run: docker compose -f compose.yml -f compose.ci.yml run --build --rm backend-check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: React 타입·린트·테스트·빌드
        run: docker compose -f compose.yml -f compose.ci.yml run --build --rm frontend-check

  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 사전 도구는 표준 라이브러리만 쓴다(dictionary/README.md) — pip 설치 단계가
      # 없다. 버전은 그 README가 선언한 하한 3.11로 고정한다: 개발은 3.14에서
      # 돌고 있으니 CI가 하한을 잡아야 선언한 범위의 양끝이 실제로 검증된다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # dist/ 산출물과 data/golden 코퍼스가 모두 저장소에 있으므로 5단계가
      # [건너뜀] 없이 전부 실제로 돈다 — 특히 5/5 소비자 중복 게이트는
      # dictionary/docs/consumer-overlap-policy.md §4가 CI 상시 실행을 요구한다.
      - name: 사전 검사 (테스트·불변식·코퍼스·소비자 중복 게이트)
        working-directory: dictionary
        run: ./scripts/check.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, compose-model]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Chromium 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: E2E 실행 한정 비밀값 생성
        run: |
          echo "EASYDOC_AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> .env
          ./backend-kotlin/gradlew -p backend-kotlin --no-daemon -q :infrastructure:writeEncryptionKeyEnv "-Peasydoc.encryptionEnvOut=$RUNNER_TEMP/easy-doc-key.env"
          cat "$RUNNER_TEMP/easy-doc-key.env" >> .env
      - name: Compose 전체 스택 기동
        run: docker compose -f compose.yml -f compose.e2e.yml up -d --build --wait
      - name: Kotlin API + React E2E
        env:
          E2E_SKIP_STACK: "1"
          E2E_API_BASE_URL: http://localhost:8100
        run: frontend/e2e/run-local.sh
      - name: Compose 로그 보관
        if: always()
        run: |
          mkdir -p frontend/test-results
          docker compose -f compose.yml -f compose.e2e.yml logs --no-color > frontend/test-results/compose.log
      - name: E2E 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: warn
