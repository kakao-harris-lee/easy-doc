name: CI

on:
  push:
    branches: [main]
  pull_request:
  # llm-lane 잡을 손으로 강제 실행하기 위한 트리거. 조건부 게이트는 반드시 손으로
  # 돌릴 길이 있어야 한다 — 조건 계산이 틀렸을 때 확인할 방법이 없으면 그 게이트는
  # 검증 불가능하다.
  workflow_dispatch:
    inputs:
      run_llm_lane:
        description: "변경 경로와 무관하게 -m llm 레인을 강제 실행한다"
        type: boolean
        default: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # 서비스 컨테이너·네트워크 대기로 잡이 매달리는 것을 방지한다.
    timeout-minutes: 15
    permissions:
      contents: read
    # 로컬 docker-compose.yml과 같은 이미지 — db 마커 통합 테스트를 CI에서 실제로 실행한다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: easydoc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easydoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/easydoc
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # mypy 는 크롤링할 때 점으로 시작하는 디렉터리를 건너뛴다. 그래서 `mypy .` 는
      # `.claude/skills/**/scripts/` 를 **한 번도 보지 않는다**(parity 스크립트 0개).
      # 하필 그 두 파일이 parity 게이트의 신뢰 뿌리다 — 저장소의 다른 모든 판정을 그것이
      # 내리는데, 정작 자기는 타입 게이트 밖에 있었다. 낡은 `type: ignore` 하나가 실제로
      # 이 사각지대에 남아 있었고, 사람이 경로를 손으로 줄 때만 드러났다.
      # 경로를 명시해 붙인다. 설정(`[tool.mypy] files`)이 아니라 명령에 적는 이유는,
      # 로컬에서 치는 명령과 CI 가 도는 명령이 같아야 사각지대가 다시 안 생기기 때문이다.
      #
      # **열거가 아니라 루트를 준다** (2026-08-13). 처음엔 `.claude/skills/python-kotlin-parity/scripts`
      # 한 곳만 열거했는데, 위 주석이 `**/scripts/` 라고 **복수로 선언**하는 동안 실제 도달은
      # 한 곳이었다 — `migration-safety-gate/scripts/scan_privacy_invariants.py` 는 그 사이
      # **한 번도 검사받지 않았다**. 빈자리가 구조적이라 열거로는 다음 스킬에서 또 벌어진다.
      # `.claude` 루트를 주면 mypy 가 재귀하고, 명시 경로에는 건너뛰기가 적용되지 않는다.
      # 글롭(`.claude/skills/*/scripts`)은 `.py` 없는 디렉터리에서 깨져 못 쓴다
      # (`codex-review/scripts` 는 셸 스크립트뿐).
      #
      # 도달 차이(실측, **이 커밋 시점** — 절대 개수는 커밋마다 움직이므로 시점 없이 쓰지 마라):
      #   `mypy .`                                      → 125 파일 (.claude 도달 0/3)
      #   `mypy . .claude/skills/python-kotlin-parity/scripts` → 127 파일 (도달 2/3)
      #   `mypy . .claude`                              → 128 파일 (도달 3/3)
      # 음성 대조: 위 gate 파일에 반환 타입 오류를 심으면 옛 명령은 Success, 새 명령은
      # `error: Incompatible return value type`. 도달 차이가 실제로 존재한다.
      - run: uv run mypy . .claude
      # 데이터 보호 불변식 기계 스캔 (privacy-gate 판정 X-8, 2026-08-13 · 리더 승인).
      #
      # **`kotlin` 잡이 아니라 여기다.** SCAN_ROOTS 가 app·backend-kotlin·scripts·frontend/src
      # 를 함께 덮는데, 배선 시점 실측으로 검사 171파일 중 **98개(57%)가 backend-kotlin 밖**
      # 이다. 좁은 잡에 붙이면 선언한 범위보다 좁은 자리에서 도는 게이트가 된다.
      # 이 잡은 이미 `uv sync --locked` 를 마쳐 필요한 것이 다 있고 DB·JDK 를 쓰지 않는다.
      #
      # 위치가 mypy 바로 다음인 이유: ⑴ 이 스캐너 자신이 mypy 대상이라 타입 검사를 통과한
      # 직후가 순서상 맞고, ⑵ alembic·pytest 같은 느린 단계 앞이라 실패가 빠르다.
      #
      # 배선 시점 실측: 검사 171파일(backend-kotlin 73) · BLOCK 후보 0 · exit 0.
      # 음성 대조(합성 저장소): 로거 본문 보간·403·난수 키·DTD 팩터리를 심은 .kt 에서
      # BLOCK 4건 검출 — Kotlin 에서 실제로 작동한다.
      #
      # `--changed` 를 쓰지 않는다: 기본 base 가 `main` 이라 오래 사는 브랜치에서 범위가
      # 계속 넓어지거나 fork point 이동으로 흔들리고, 전수가 이미 1초 미만이다.
      # `--no-fail` 을 붙이지 않는다: 붙이면 BLOCK 후보가 있어도 초록이라 게이트가 장식이 된다.
      #
      # 이 스텝 자체의 삭제는 이 스텝이 막지 못한다. 최종 방어선은 그 diff 가 리뷰에
      # 올라가는 것이다 — 한 칸 더 옮기지 않는다.
      - name: 데이터 보호 불변식 스캔 (BLOCK 후보 0건 유지)
        run: uv run python .claude/skills/migration-safety-gate/scripts/scan_privacy_invariants.py
      - run: uv run alembic upgrade head
      # 아래 `uv run pytest` 가 이 파일도 수집하는데 왜 경로를 또 적는가 —
      # **자기 안의 단언은 파일과 함께 사라지기 때문이다.**
      # tests/test_harness_scope_reach.py 는 "지금 어디서 도는가: CI quality 잡의
      # uv run pytest 단계" 를 자기 docstring 에 적어 두는데, 그 문장은 파일이 지워지면
      # 같이 지워진다. 그러면 전체 수집은 그냥 한 건 줄어들고 스위트는 초록이다.
      # 실측(이 커밋 시점): `--ignore` 로 빼면 수집 1055/1060 → 1036/1041 인데 **exit 0**.
      # `- run: uv run pytest` 한 줄을 지워도 잡 이름 `quality` 가 남아 표의 `ci:quality`
      # 표기는 계속 유효하다. 도달 0을 잡으려고 만든 파일에 도달 0이 재현되고 아무도
      # 모르는 상태였다. (수집 개수는 커밋마다 움직인다 — 시점 없는 절대 수치는 곧 거짓이 된다)
      #
      # 그래서 존재 단언을 **파일 밖**(여기)에 둔다. 이 스텝이 실제로 막는 것(실측):
      #   파일 삭제·경로 변경 → exit 4 (file or directory not found)
      #   `pytestmark = pytest.mark.llm` 등으로 전건 제외 → 1 deselected / 0 selected,
      #     exit 5 (no tests ran). 같은 조작이 전체 수집에서는 exit 0 이라 조용하다 —
      #     경로를 명시했기 때문에만 빨개진다. 마커 우회를 이 스텝이 실제로 막는다.
      # 막지 못하는 것: 이 스텝 자체의 삭제. 저장소 안의 어떤 파일도 자기 자신에 대한
      # 절대 기준이 될 수 없다 — 이 diff 가 리뷰에 올라가는 것이 최종 방어선이다.
      - name: 하네스 도달 검사 실재 확인 (경로 명시 — 자기 단언은 파일과 함께 사라진다)
        run: uv run pytest tests/test_harness_scope_reach.py
      - run: uv run pytest
      # 골든셋 LLM 평가(-m llm)는 API 키 시크릿 등록 후 별도 잡으로 활성화한다.

  # 프론트 게이트. 백엔드 잡과 독립이라 paths 필터 없이 항상 돌린다 — 필터를 걸면
  # 필수 체크가 건너뛴 채 "성공"으로 보고되어 병합이 열리는 함정이 있다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci는 package-lock.json을 그대로 재현한다(install과 달리 잠금 파일을 고치지 않는다).
      - run: npm ci
      - run: npm run check
      - run: npm run test -- --run
      - run: npm run build

  # Kotlin 게이트. 계획 §5 Phase 1 "CI에 Kotlin build/test를 추가하되 기존 Python/React
  # gate 유지". 위 두 잡을 건드리지 않는다 — 절체(Phase 7)까지 Python suite가 비교
  # 기준으로 계속 돌아야 한다.
  #
  # paths 필터를 걸지 않는 이유는 frontend 잡과 같다: 필터를 걸면 필수 체크가 건너뛴 채
  # "성공"으로 보고되어 병합이 열린다.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # build.gradle.kts 의 jvmToolchain(21)과 같은 값. Phase 0 spike 조합이기도 하다.
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # parity 비교기(compare_parity.py)가 Python 정본 생성기를 다시 돌려 fixture 를
      # 대조하므로 이 잡에도 uv 가 필요하다. Python **게이트**는 위 quality 잡이 그대로
      # 담당한다 — 여기서 중복 실행하지 않는다.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # 잠금 파일 그대로 설치한다. 비교기는 Python 정본 생성기를 **다시 돌려** fixture 를
      # 대조하므로, 이 잡의 의존성이 quality 잡과 다르면 "정본"이 잡마다 달라진다.
      - run: uv sync --locked
        working-directory: .

      # Testcontainers 는 ubuntu-latest 러너의 Docker 데몬을 그대로 쓴다.
      # 이미지를 미리 받아 두면 첫 테스트의 타임아웃 위험이 줄고, 무엇을 쓰는지 로그에 남는다.
      - name: PostgreSQL 이미지 미리 받기
        run: docker pull pgvector/pgvector:pg16

      # build = 컴파일 + ktlintCheck + detekt + test (Testcontainers 포함).
      # 락파일과 어긋나면 실패시킨다 — 전이 의존성이 조용히 올라가는 것을 막는 지점이다.
      - name: Gradle build (ktlint · detekt · test)
        run: ./gradlew build --no-daemon

      # --- parity 게이트 배선 (Phase 0 필수 조치 E) ---------------------------
      # 산출물(parity/actual/)을 **Kotlin 테스트가** 만든다는 것을 CI에서 보장한다.
      # 이 배선이 없으면 fixture 입력이 전부 공개돼 있으므로 Python이 같은 파일을 만들어도
      # 게이트가 구분하지 못한다(python-kotlin-parity 스킬 "이 게이트가 막지 못하는 것").
      # 이 태스크는 산출물을 쓰고 **곧바로** backend-kotlin/parity-domains.txt 의 선언과
      # 대조한다(parityManifestCheck). "포팅했다고 선언했는데 산출물이 없다"는 여기서
      # 빨개진다 — 아래 비교 단계의 부분 검증 사면과 **다른 단계**에 두었기 때문에
      # 사면이 이 결함을 구조적으로 삼킬 수 없다.
      - name: parity 산출물 생성 + 선언 대조 (Kotlin 하네스)
        run: ./gradlew parityHarness --no-daemon

      - name: parity 하네스 배선 확인
        working-directory: .
        run: |
          set -euo pipefail
          selfcheck=parity/_harness-selfcheck/kotlin.json
          if [ ! -f "$selfcheck" ]; then
            echo "::error::Kotlin parity 하네스가 산출물을 쓰지 않았다 ($selfcheck 없음)."
            echo "parityHarness 태스크와 ParityActual 의 parity.actual.dir 배선을 확인하라."
            exit 1
          fi
          grep -q '"runtime": "kotlin"' "$selfcheck" || {
            echo "::error::$selfcheck 의 runtime 이 kotlin 이 아니다."; exit 1; }
          echo "parity 하네스 배선 OK:"; cat "$selfcheck"

      # --- parity 비교 --------------------------------------------------------
      # 판정 범위를 **디렉터리 유무**가 아니라 **버전 관리되는 선언**에서 가져온다.
      #
      # 예전 방식은 두 방향으로 고장나 있었다. (1) parity/fixtures 가 없으면 비교기를
      # 부르지도 않고 exit 0 — 트리를 지우면 되살아나는 백도어였다. (2) 종료 코드 2 를
      # 사면했는데, "Kotlin 결과 파일 없음"은 비교기가 exit **1** 로 내므로 사면이
      # 겨냥한 조건이 실제로는 발생하지 않았다. 결과적으로 Phase 2 에서 fixture 가
      # 생기는 순간 CI 를 초록으로 만들 수 있는 경로가 없었다.
      #
      # 지금은 backend-kotlin/parity-domains.txt 가 "Kotlin 이 어느 도메인을 포팅했는가"를
      # 선언하고, 비교 범위를 그 선언으로 좁힌다. 좁힌 것은 통과가 아니라 **미검증**이며
      # 로그에 도메인 이름으로 크게 남는다. 선언과 실제 산출물의 대조는 위 Gradle
      # 단계(parityManifestCheck)가 이미 끝냈으므로, 여기의 사면은 "아직 포팅하지 않은
      # 도메인"에만 닿고 "포팅했다면서 산출물이 없는 도메인"에는 닿지 않는다.
      - name: parity 비교 (선언한 도메인 범위)
        working-directory: .
        run: |
          set -euo pipefail

          declaration=backend-kotlin/parity-domains.txt
          scripts=.claude/skills/python-kotlin-parity/scripts
          work=$(mktemp -d)

          if [ ! -f "$declaration" ]; then
            echo "::error::$declaration 이 없다 — 무엇을 검증해야 하는지의 선언이 사라졌다."
            echo "::error::이 파일이 없으면 비교 범위를 정할 근거가 없으므로 통과시키지 않는다."
            exit 1
          fi

          # 선언: 리뷰를 거치는 버전 관리 파일. 주석·빈 줄을 걷어낸다.
          sed 's/#.*//' "$declaration" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/declared" || true
          # 정본: 생성기의 BUILDERS 키. 도메인 목록을 여기에 복제하지 않는다 — 복제가
          # 곧 드리프트이고, 그 드리프트가 곧 "검증되지 않은 채 통과하는 도메인"이다.
          uv run python "$scripts/dump_parity_fixtures.py" --list \
            | awk 'NF {print $1}' | LC_ALL=C sort -u > "$work/canonical"
          canonical_count=$(wc -l < "$work/canonical" | tr -d '[:space:]')

          # 정본이 0개인 것은 정상 상태가 아니라 **도구가 고장 난 것**이다. 생성기에는
          # 언제나 도메인이 있어야 하므로, 0이 나왔다면 --list 가 실패했거나 출력 형식이
          # 바뀌어 awk 가 아무것도 못 뽑았거나 BUILDERS 자체가 비었다는 뜻이다.
          #
          # 이 검사가 없으면 무검증 통과 경로가 열린다. canonical 이 비면 아래 unknown
          # 검사도 통과하고(선언이 0개일 때), "선언 0개" 분기가 exit 0 을 낸다. 그때 로그는
          # "정본 0개 / 검증하지 않음 0개"로 찍혀 **"11개를 안 봤다"는 경고가 "0개를 안
          # 봤다"로 바뀐다** — 경고가 스스로 무의미해지고 사람은 초록불만 본다.
          #
          # 아래 하한 검사가 이 경우도 잡지만(하한이 비어 있지 않으므로 전부 누락으로
          # 걸린다), 원인이 전혀 다르므로 진단 문구를 따로 남긴다.
          if [ "$canonical_count" -eq 0 ]; then
            echo "::error::정본 도메인이 0개다 — 생성기를 읽지 못했거나 BUILDERS 가 비었다."
            echo "::error::정본이 비면 '무엇을 검증하지 않았는지'를 셀 수 없어 게이트가 무의미해진다."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          # --- 정본 하한 검사 (현재 정본 ⊇ 스냅샷) -----------------------------
          # 위 검사는 정본이 **0개**일 때만 막는다. 그래서 11개를 3개로 줄이는 부분 삭제는
          # 그대로 통과했다. 그것도 두 갈래로.
          #   선언 0개 → "정본 3개 / 검증하지 않음 3개" 를 찍고 exit 0
          #   선언 3개 → 선언 == 정본 이므로 **전체 게이트**로 들어가 "도메인 3개 전부 값으로
          #              대조했다" 를 찍고 exit 0 — 축소가 완전 검증으로 위장된다.
          # 정본이 곧 판정 기준인데 그 기준이 변경 가능하고, 축소를 알아챌 기준점이 없었다.
          #
          # 그래서 정본 도메인 목록의 스냅샷을 버전 관리 파일로 두고 **비대칭**으로 본다.
          #   추가(정본에 있고 스냅샷에 없다) → 통과. 선언하지 않은 도메인은 아래 배너에
          #     "검증하지 않음"으로 이름이 찍히므로 놓쳐도 드러난다.
          #   삭제(스냅샷에 있고 정본에 없다) → 실패. 줄이려면 .github/ 안의 스냅샷 파일을
          #     고쳐야 하고, 그 diff 는 "CI 게이트를 건드렸다"는 신호로 리뷰에 올라간다.
          # 한계: 스냅샷도 같은 커밋에서 함께 바꿀 수 있다 — 저장소 안의 어떤 파일도 저장소
          # 자신에 대한 절대 기준이 될 수 없다. 이 검사는 축소를 불가능하게 만들지 않고
          # **조용할 수 없게** 만든다. 최종 방어선은 리뷰다.
          floor=.github/parity-canonical-floor.txt
          if [ ! -f "$floor" ]; then
            echo "::error::$floor 가 없다 — 정본 축소를 감지할 기준점이 사라졌다."
            echo "::error::이 파일이 없으면 '정본이 원래 몇 개였는지'를 알 수 없으므로 통과시키지 않는다."
            exit 1
          fi
          sed 's/#.*//' "$floor" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/floor" || true
          floor_count=$(wc -l < "$work/floor" | tr -d '[:space:]')
          if [ "$floor_count" -eq 0 ]; then
            echo "::error::$floor 에 도메인이 한 줄도 없다 — 하한이 비면 무엇을 지우든 통과한다."
            echo "::error::파일을 지우는 것과 비우는 것은 같은 일이므로 똑같이 실패로 판정한다."
            exit 1
          fi
          vanished=$(LC_ALL=C comm -23 "$work/floor" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$vanished" | tr -d '[:space:]')" ]; then
            echo "::error::정본에서 도메인이 사라졌다: $vanished"
            echo "::error::$floor 은 ${floor_count}개를 요구하는데 현재 정본은 ${canonical_count}개다."
            echo "::error::게이트 판정 범위가 줄었다 — 이 실행의 '통과'는 사라진 도메인에 대해 아무 의미가 없다."
            echo "::error::생성기(BUILDERS)를 되돌리거나, 삭제가 의도라면 $floor 을 함께 고치고 PR 에 근거를 적어라."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi
          # --------------------------------------------------------------------

          unknown=$(LC_ALL=C comm -23 "$work/declared" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$unknown" | tr -d '[:space:]')" ]; then
            echo "::error::$declaration 에 정본에 없는 도메인이 있다: $unknown"
            echo "::error::정본 확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          declared_count=$(wc -l < "$work/declared" | tr -d '[:space:]')
          declared_list=$(tr '\n' ' ' < "$work/declared")
          skipped_list=$(LC_ALL=C comm -13 "$work/declared" "$work/canonical" | tr '\n' ' ')
          # 하한에 없는 정본 = 이 파일이 만들어진 뒤 추가된 도메인. 막지 않고 이름만 남긴다.
          unlisted=$(LC_ALL=C comm -13 "$work/floor" "$work/canonical" | tr '\n' ' ')

          echo "──────────────── parity 게이트 판정 범위 ────────────────"
          echo "  정본 도메인      : ${canonical_count}개 (하한 ${floor_count}개 충족)"
          echo "  Kotlin 구현 선언 : ${declared_count}개 — ${declared_list:-없음}"
          echo "  검증하지 않음    : $((canonical_count - declared_count))개 — ${skipped_list:-없음}"
          echo "  (검증하지 않은 도메인은 '통과'가 아니라 '증명되지 않음'이다)"
          if [ -n "$(echo "$unlisted" | tr -d '[:space:]')" ]; then
            echo "  하한 미등재      : ${unlisted}"
            echo "  (정본에 추가된 새 도메인이다. $floor 에도 적어야 나중에 삭제될 때 걸린다)"
          fi
          echo "─────────────────────────────────────────────────────────"

          if [ "$declared_count" -eq 0 ]; then
            # 실제로 발생하는 상태다(Phase 1 종료 시점). 산출물이 있는데 선언이 0개인
            # 경우는 위 parityManifestCheck 가 이미 빌드를 실패시켰으므로 여기 못 온다.
            echo "::warning::parity 게이트 미가동 — 포팅을 끝냈다고 선언한 도메인이 0개다."
            echo "::warning::이 실행은 값을 한 건도 검증하지 않았다. Phase 2에서 도메인을 선언하며 닫는다."
            exit 0
          fi

          # 선언이 0개가 아닌데 fixture 트리가 없다 = 정본이 사라진 것이다. 비교기에
          # 그대로 넘기면 "--only-domain 은 디렉터리일 때만" 이라는 인자 오류로 죽어
          # 원인이 흐려지므로 여기서 이름을 붙여 막는다.
          if [ ! -d parity/fixtures ]; then
            echo "::error::parity/fixtures 가 없는데 $declaration 은 ${declared_count}개 도메인을 선언한다."
            echo "::error::선언한 도메인의 정본이 사라졌다 — 비교를 건너뛰지 않고 실패로 판정한다."
            echo "::error::복구: uv run python $scripts/dump_parity_fixtures.py --out parity/fixtures"
            exit 1
          fi

          if [ "$declared_count" -eq "$canonical_count" ]; then
            # 선언이 정본을 다 덮으면 좁히지 않는다 — 도메인 지정 없이 넘겨야 비교기가
            # '기대 집합 전부'를 요구하는 전체 게이트로 돈다. 이 시점부터 종료 코드 3
            # (부분 검증)은 실패로 취급된다. 사면 장치가 스스로 사라지는 지점이다.
            echo "전체 게이트로 실행한다 (--only-domain 없이). 통과 조건: 종료 코드 0."
            status=0
            uv run python "$scripts/compare_parity.py" \
              --fixture parity/fixtures --actual parity/actual || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::parity 전체 게이트 실패 (종료 코드 $status)."
              exit 1
            fi
            echo "parity 전체 게이트 통과 — 도메인 ${canonical_count}개 전부 값으로 대조했다."
            exit 0
          fi

          # 부분 게이트. 도메인 이름은 위에서 정본과 대조해 걸렀으므로 공백이 없다.
          only_args=""
          while read -r domain; do
            only_args="$only_args --only-domain $domain"
          done < "$work/declared"

          status=0
          # shellcheck disable=SC2086 -- only_args 는 의도적으로 단어 분리한다.
          uv run python "$scripts/compare_parity.py" \
            --fixture parity/fixtures --actual parity/actual $only_args || status=$?

          case "$status" in
            3)
              echo "::notice::parity 부분 게이트 통과 — 선언한 ${declared_count}개 도메인(${declared_list})만 값으로 대조했다."
              echo "::warning::아직 검증하지 않은 도메인: ${skipped_list}"
              echo "::warning::게이트는 열려 있다 — 이 초록은 '전건 동등'이 아니라 '선언 범위 안에서 동등'이다."
              exit 0
              ;;
            0)
              echo "::error::부분 범위를 지정했는데 종료 코드 0 이 나왔다 — 비교기 계약과 어긋난다(0은 전체 게이트 전용)."
              echo "::error::compare_parity.py 의 판정 로직이 바뀌었는지 확인하라. 통과로 보고하지 않는다."
              exit 1
              ;;
            *)
              echo "::error::parity 부분 게이트 실패 (종료 코드 $status)."
              echo "::error::1 = 불일치·도메인 누락·결과 파일 없음 / 2 = 선언한 도메인이 spec_status=pending 이라 미검증."
              echo "::error::둘 다 '아직 포팅하지 않았다'가 아니라 '선언한 것을 지키지 못했다'이므로 사면하지 않는다."
              exit 1
              ;;
          esac

  # ── LLM 레인 (실제 API 호출 — 관련 변경일 때만 돈다) ──────────────────────
  #
  # 배경: `-m llm` 마커가 붙은 테스트는 실제 Anthropic/OpenAI API 를 호출한다.
  # 그런데 pyproject.toml 의 `addopts = "-m 'not llm'"` 때문에 기본 스위트에서 빠지고,
  # 그것을 돌리는 잡이 없어서 **CI 도달이 0** 이었다. 품질 합격선의 차단축 3개가
  # 전부 이 마커에 있는데 한 번도 안 돈 채 "합격선 확정" 이 보고된 적이 있다
  # (`kotlin-migration` 스킬 「선언한 범위와 실제 도달을 대조한다」 근거 6번).
  #
  # 그렇다고 매 커밋마다 돌리면 56건 골든 코퍼스를 통째로 변환하는 비용이 매번 나간다.
  # 그래서 **관련 변경일 때만** 돈다. 무엇이 '관련' 인지의 선언은
  # `.github/llm-lane-paths.txt` 한 곳뿐이고, 그 선언이 실제 도달보다 좁지 않은지는
  # `tests/test_llm_lane_scope.py` 가 매번 폐포를 다시 계산해 검사한다.
  #
  # 서드파티 액션(dorny/paths-filter 등)을 쓰지 않는다 — 공공기관 문서를 다루는
  # 저장소라 공급망을 늘리지 않는다. git 으로 직접 구한다.
  #
  # ## 조용한 초록을 만들지 않는다
  # 건너뛸 때 잡은 초록으로 끝나지만, 그 초록이 "레인이 통과했다" 로 읽히면 근거
  # 6번의 재발이다. 그래서 건너뛴 실행은 스텝 요약(job summary)과 로그에 **건너뛰었다는
  # 사실과 그 이유**를 반드시 남긴다.
  #
  # ## 이 잡이 막지 못하는 것
  # 필수 체크로 걸어도 조건 분기가 초록을 내므로, 이 잡의 성공은 "레인이 통과했다"가
  # 아니라 "레인이 필요했다면 통과했다" 이다. 실제로 무엇이 돌았는지는 요약을 읽어야 한다.
  llm-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # 워크플로 전체가 아니라 이 잡에만 건다 — quality·frontend·kotlin 의 실행 정책을
    # 건드리지 않기 위해서다. 연속 푸시로 API 호출이 겹쳐 쌓이는 것만 막는다.
    concurrency:
      group: llm-lane-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # PR base 와 push 이전 커밋을 diff 하려면 히스토리가 필요하다.
          # 얕게 받으면 merge-base 를 못 찾아 조건 계산이 통째로 실패한다.
          fetch-depth: 0

      # 경로 목록의 완전성 검사. **조건 없이 매번 돈다** — 판정 규칙 자신은 조건부일
      # 수 없다. 여기서 실패하면 "목록이 레인의 실제 도달보다 좁다" 는 뜻이고,
      # 그 상태의 초록은 아무것도 보장하지 않는다.
      #
      # 이 스텝을 경로로 명시 호출하는 데는 또 다른 이유가 있다. 검사 파일 안에 적은
      # 자기 단언은 그 파일과 함께 사라지지만, 이 스텝은 모듈을 import 하므로
      # 파일을 지우면 `No module named tests.test_llm_lane_scope` 로 **잡이 깨진다**.
      # 장치 밖에서 깨지는 지점을 그렇게 만든다(스킬 규칙 5·6).
      #
      # uv 없이 러너의 맨 python3 로 돈다 — 이 모듈은 표준 라이브러리만 쓴다.
      - name: 경로 목록 완전성 검사 (조건 없이 매번 — API 안 씀)
        run: python3 -m tests.test_llm_lane_scope --self-check

      - name: 변경 범위 판정 (.github/llm-lane-paths.txt 대조)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FORCE_INPUT: ${{ github.event.inputs.run_llm_lane }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          changed="$work/changed.txt"
          reason=""
          force=no

          # 수동 실행은 언제나 강제. 조건 계산을 우회할 손잡이가 반드시 하나 있어야 한다.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_INPUT" != "false" ]; then
              force=yes
              reason="workflow_dispatch 수동 강제 실행"
            fi
          fi

          if [ "$force" = "no" ]; then
            base=""
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE"
            fi

            # 판정할 수 없는 상태(첫 푸시의 0-sha, 강제 푸시로 사라진 커밋 등)에서는
            # **건너뛰지 않고 돌린다.** '알 수 없음' 은 '무관' 이 아니다. 여기서 조용히
            # 건너뛰면 그것이 정확히 근거 6번의 형태(도달 0 인데 초록)가 된다.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              force=yes
              reason="비교 기준 커밋을 찾을 수 없다(base='${base:-없음}') — 알 수 없음은 무관이 아니므로 실행한다"
            else
              # --no-renames: 이름만 바꾼 변경도 양쪽 경로가 다 나오게 한다.
              # 한쪽만 나오면 레인 파일을 목록 밖으로 옮기는 변경이 안 걸린다.
              merge_base=$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")
              git diff --name-only --no-renames "$merge_base" HEAD > "$changed"
              echo "변경 파일 $(wc -l < "$changed" | tr -d '[:space:]')건 (기준 ${merge_base})"
            fi
          fi

          if [ "$force" = "yes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            {
              echo "### LLM 레인: **실행**"
              echo ""
              echo "사유: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 매칭 규칙은 CI 쪽에 복제하지 않는다 — 완전성 검사와 **같은 판정기**를 부른다.
          # 규칙이 두 곳에 있으면 그 복사본이 갈리고, 갈린 순간 검사는 CI 가 실제로
          # 쓰는 규칙이 아니라 자기 규칙을 검사하게 된다.
          matched="$work/matched.txt"
          python3 -m tests.test_llm_lane_scope --match "$changed" > "$matched"
          count=$(wc -l < "$matched" | tr -d '[:space:]')

          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=골든 경로 ${count}건 변경" >> "$GITHUB_OUTPUT"
            {
              echo "### LLM 레인: **실행**"
              echo ""
              echo "\`.github/llm-lane-paths.txt\` 에 걸린 변경 ${count}건:"
              echo ""
              sed 's/^/- `/; s/$/`/' "$matched"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "레인을 돌린다 — 걸린 경로:"
            cat "$matched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=골든 경로 무변경" >> "$GITHUB_OUTPUT"
          fi

      # 건너뛴 실행이 통과처럼 보이면 안 된다. 초록은 남지만 그 초록이 무엇을
      # 뜻하는지는 로그와 요약에 글자로 남긴다.
      - name: 건너뜀 사유 기록 (조용한 초록 방지)
        if: steps.scope.outputs.run != 'true'
        run: |
          set -euo pipefail
          echo "::notice::이 커밋은 골든 경로를 건드리지 않아 -m llm API 레인을 돌리지 않았다."
          echo "::warning::이 잡의 초록은 '레인이 통과했다'가 아니라 '레인을 돌릴 필요가 없었다'는 뜻이다."
          {
            echo "### LLM 레인: **건너뜀**"
            echo ""
            echo "이 커밋은 \`.github/llm-lane-paths.txt\` 의 어떤 경로도 건드리지 않았다."
            echo "실제 API 호출은 **한 건도 하지 않았다.**"
            echo ""
            echo "> 이 초록은 품질 판정이 아니다 — 판정을 **하지 않았다**는 기록이다."
            echo "> 손으로 돌리려면: Actions → CI → Run workflow (workflow_dispatch)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked
        if: steps.scope.outputs.run == 'true'

      # 실제 호출 지점. 키는 시크릿에서만 오고 **값을 찍지 않는다** — 로그에 키가
      # 남으면 회수 외에는 되돌릴 방법이 없다.
      #
      # GOLDEN_RECORD_BASELINE 은 **세우지 않는다.** 기준선 기록은 판정이 아니라
      # 기준 자체를 바꾸는 일이라 CI 가 할 일이 아니다. 세우면 CI 가 자기 합격선을
      # 매번 새로 써서 회귀가 영원히 안 잡힌다. `tests/golden/baseline.json` 이
      # 저장소에 없다는 사실도 그래서 유지된다.
      - name: -m llm 레인 실행 (실제 API 호출)
        if: steps.scope.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 스텝 출력을 `run:` 본문에 `${{ }}` 로 직접 끼워 넣지 않는다 — 그 자리는
          # 셸 소스로 치환돼 값이 곧 코드가 된다. env 로 넘기면 값으로만 남는다.
          LANE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 비어 있다 — 자격 증명 없는 실행은 0건 측정이고 0건은 통과가 아니다."
            exit 1
          fi
          # 키 값 자체는 절대 찍지 않는다. 길이조차 찍지 않는다 — 회수 말고는 되돌릴 방법이 없다.
          echo "레인 실행 사유: $LANE_REASON"
          uv run pytest -m llm

      - name: 실행 결과 요약
        if: steps.scope.outputs.run == 'true'
        env:
          LANE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "레인 실행 사유: $LANE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
