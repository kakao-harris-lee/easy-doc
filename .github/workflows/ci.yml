name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # 서비스 컨테이너·네트워크 대기로 잡이 매달리는 것을 방지한다.
    timeout-minutes: 15
    permissions:
      contents: read
    # 로컬 docker-compose.yml과 같은 이미지 — db 마커 통합 테스트를 CI에서 실제로 실행한다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: easydoc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easydoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/easydoc
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # mypy 는 크롤링할 때 점으로 시작하는 디렉터리를 건너뛴다. 그래서 `mypy .` 는
      # `.claude/skills/**/scripts/` 를 **한 번도 보지 않는다**(116 파일 / parity 스크립트 0개).
      # 하필 그 두 파일이 parity 게이트의 신뢰 뿌리다 — 저장소의 다른 모든 판정을 그것이
      # 내리는데, 정작 자기는 타입 게이트 밖에 있었다. 낡은 `type: ignore` 하나가 실제로
      # 이 사각지대에 남아 있었고, 사람이 경로를 손으로 줄 때만 드러났다.
      # 경로를 명시해 붙인다. 설정(`[tool.mypy] files`)이 아니라 명령에 적는 이유는,
      # 로컬에서 치는 명령과 CI 가 도는 명령이 같아야 사각지대가 다시 안 생기기 때문이다.
      - run: uv run mypy . .claude/skills/python-kotlin-parity/scripts
      - run: uv run alembic upgrade head
      - run: uv run pytest
      # 골든셋 LLM 평가(-m llm)는 API 키 시크릿 등록 후 별도 잡으로 활성화한다.

  # 프론트 게이트. 백엔드 잡과 독립이라 paths 필터 없이 항상 돌린다 — 필터를 걸면
  # 필수 체크가 건너뛴 채 "성공"으로 보고되어 병합이 열리는 함정이 있다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci는 package-lock.json을 그대로 재현한다(install과 달리 잠금 파일을 고치지 않는다).
      - run: npm ci
      - run: npm run check
      - run: npm run test -- --run
      - run: npm run build

  # Kotlin 게이트. 계획 §5 Phase 1 "CI에 Kotlin build/test를 추가하되 기존 Python/React
  # gate 유지". 위 두 잡을 건드리지 않는다 — 절체(Phase 7)까지 Python suite가 비교
  # 기준으로 계속 돌아야 한다.
  #
  # paths 필터를 걸지 않는 이유는 frontend 잡과 같다: 필터를 걸면 필수 체크가 건너뛴 채
  # "성공"으로 보고되어 병합이 열린다.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # build.gradle.kts 의 jvmToolchain(21)과 같은 값. Phase 0 spike 조합이기도 하다.
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # parity 비교기(compare_parity.py)가 Python 정본 생성기를 다시 돌려 fixture 를
      # 대조하므로 이 잡에도 uv 가 필요하다. Python **게이트**는 위 quality 잡이 그대로
      # 담당한다 — 여기서 중복 실행하지 않는다.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # 잠금 파일 그대로 설치한다. 비교기는 Python 정본 생성기를 **다시 돌려** fixture 를
      # 대조하므로, 이 잡의 의존성이 quality 잡과 다르면 "정본"이 잡마다 달라진다.
      - run: uv sync --locked
        working-directory: .

      # Testcontainers 는 ubuntu-latest 러너의 Docker 데몬을 그대로 쓴다.
      # 이미지를 미리 받아 두면 첫 테스트의 타임아웃 위험이 줄고, 무엇을 쓰는지 로그에 남는다.
      - name: PostgreSQL 이미지 미리 받기
        run: docker pull pgvector/pgvector:pg16

      # build = 컴파일 + ktlintCheck + detekt + test (Testcontainers 포함).
      # 락파일과 어긋나면 실패시킨다 — 전이 의존성이 조용히 올라가는 것을 막는 지점이다.
      - name: Gradle build (ktlint · detekt · test)
        run: ./gradlew build --no-daemon

      # --- parity 게이트 배선 (Phase 0 필수 조치 E) ---------------------------
      # 산출물(parity/actual/)을 **Kotlin 테스트가** 만든다는 것을 CI에서 보장한다.
      # 이 배선이 없으면 fixture 입력이 전부 공개돼 있으므로 Python이 같은 파일을 만들어도
      # 게이트가 구분하지 못한다(python-kotlin-parity 스킬 "이 게이트가 막지 못하는 것").
      # 이 태스크는 산출물을 쓰고 **곧바로** backend-kotlin/parity-domains.txt 의 선언과
      # 대조한다(parityManifestCheck). "포팅했다고 선언했는데 산출물이 없다"는 여기서
      # 빨개진다 — 아래 비교 단계의 부분 검증 사면과 **다른 단계**에 두었기 때문에
      # 사면이 이 결함을 구조적으로 삼킬 수 없다.
      - name: parity 산출물 생성 + 선언 대조 (Kotlin 하네스)
        run: ./gradlew parityHarness --no-daemon

      - name: parity 하네스 배선 확인
        working-directory: .
        run: |
          set -euo pipefail
          selfcheck=parity/_harness-selfcheck/kotlin.json
          if [ ! -f "$selfcheck" ]; then
            echo "::error::Kotlin parity 하네스가 산출물을 쓰지 않았다 ($selfcheck 없음)."
            echo "parityHarness 태스크와 ParityActual 의 parity.actual.dir 배선을 확인하라."
            exit 1
          fi
          grep -q '"runtime": "kotlin"' "$selfcheck" || {
            echo "::error::$selfcheck 의 runtime 이 kotlin 이 아니다."; exit 1; }
          echo "parity 하네스 배선 OK:"; cat "$selfcheck"

      # --- parity 비교 --------------------------------------------------------
      # 판정 범위를 **디렉터리 유무**가 아니라 **버전 관리되는 선언**에서 가져온다.
      #
      # 예전 방식은 두 방향으로 고장나 있었다. (1) parity/fixtures 가 없으면 비교기를
      # 부르지도 않고 exit 0 — 트리를 지우면 되살아나는 백도어였다. (2) 종료 코드 2 를
      # 사면했는데, "Kotlin 결과 파일 없음"은 비교기가 exit **1** 로 내므로 사면이
      # 겨냥한 조건이 실제로는 발생하지 않았다. 결과적으로 Phase 2 에서 fixture 가
      # 생기는 순간 CI 를 초록으로 만들 수 있는 경로가 없었다.
      #
      # 지금은 backend-kotlin/parity-domains.txt 가 "Kotlin 이 어느 도메인을 포팅했는가"를
      # 선언하고, 비교 범위를 그 선언으로 좁힌다. 좁힌 것은 통과가 아니라 **미검증**이며
      # 로그에 도메인 이름으로 크게 남는다. 선언과 실제 산출물의 대조는 위 Gradle
      # 단계(parityManifestCheck)가 이미 끝냈으므로, 여기의 사면은 "아직 포팅하지 않은
      # 도메인"에만 닿고 "포팅했다면서 산출물이 없는 도메인"에는 닿지 않는다.
      - name: parity 비교 (선언한 도메인 범위)
        working-directory: .
        run: |
          set -euo pipefail

          declaration=backend-kotlin/parity-domains.txt
          scripts=.claude/skills/python-kotlin-parity/scripts
          work=$(mktemp -d)

          if [ ! -f "$declaration" ]; then
            echo "::error::$declaration 이 없다 — 무엇을 검증해야 하는지의 선언이 사라졌다."
            echo "::error::이 파일이 없으면 비교 범위를 정할 근거가 없으므로 통과시키지 않는다."
            exit 1
          fi

          # 선언: 리뷰를 거치는 버전 관리 파일. 주석·빈 줄을 걷어낸다.
          sed 's/#.*//' "$declaration" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/declared" || true
          # 정본: 생성기의 BUILDERS 키. 도메인 목록을 여기에 복제하지 않는다 — 복제가
          # 곧 드리프트이고, 그 드리프트가 곧 "검증되지 않은 채 통과하는 도메인"이다.
          uv run python "$scripts/dump_parity_fixtures.py" --list \
            | awk 'NF {print $1}' | LC_ALL=C sort -u > "$work/canonical"
          canonical_count=$(wc -l < "$work/canonical" | tr -d '[:space:]')

          # 정본이 0개인 것은 정상 상태가 아니라 **도구가 고장 난 것**이다. 생성기에는
          # 언제나 도메인이 있어야 하므로, 0이 나왔다면 --list 가 실패했거나 출력 형식이
          # 바뀌어 awk 가 아무것도 못 뽑았거나 BUILDERS 자체가 비었다는 뜻이다.
          #
          # 이 검사가 없으면 무검증 통과 경로가 열린다. canonical 이 비면 아래 unknown
          # 검사도 통과하고(선언이 0개일 때), "선언 0개" 분기가 exit 0 을 낸다. 그때 로그는
          # "정본 0개 / 검증하지 않음 0개"로 찍혀 **"11개를 안 봤다"는 경고가 "0개를 안
          # 봤다"로 바뀐다** — 경고가 스스로 무의미해지고 사람은 초록불만 본다.
          #
          # 아래 하한 검사가 이 경우도 잡지만(하한이 비어 있지 않으므로 전부 누락으로
          # 걸린다), 원인이 전혀 다르므로 진단 문구를 따로 남긴다.
          if [ "$canonical_count" -eq 0 ]; then
            echo "::error::정본 도메인이 0개다 — 생성기를 읽지 못했거나 BUILDERS 가 비었다."
            echo "::error::정본이 비면 '무엇을 검증하지 않았는지'를 셀 수 없어 게이트가 무의미해진다."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          # --- 정본 하한 검사 (현재 정본 ⊇ 스냅샷) -----------------------------
          # 위 검사는 정본이 **0개**일 때만 막는다. 그래서 11개를 3개로 줄이는 부분 삭제는
          # 그대로 통과했다. 그것도 두 갈래로.
          #   선언 0개 → "정본 3개 / 검증하지 않음 3개" 를 찍고 exit 0
          #   선언 3개 → 선언 == 정본 이므로 **전체 게이트**로 들어가 "도메인 3개 전부 값으로
          #              대조했다" 를 찍고 exit 0 — 축소가 완전 검증으로 위장된다.
          # 정본이 곧 판정 기준인데 그 기준이 변경 가능하고, 축소를 알아챌 기준점이 없었다.
          #
          # 그래서 정본 도메인 목록의 스냅샷을 버전 관리 파일로 두고 **비대칭**으로 본다.
          #   추가(정본에 있고 스냅샷에 없다) → 통과. 선언하지 않은 도메인은 아래 배너에
          #     "검증하지 않음"으로 이름이 찍히므로 놓쳐도 드러난다.
          #   삭제(스냅샷에 있고 정본에 없다) → 실패. 줄이려면 .github/ 안의 스냅샷 파일을
          #     고쳐야 하고, 그 diff 는 "CI 게이트를 건드렸다"는 신호로 리뷰에 올라간다.
          # 한계: 스냅샷도 같은 커밋에서 함께 바꿀 수 있다 — 저장소 안의 어떤 파일도 저장소
          # 자신에 대한 절대 기준이 될 수 없다. 이 검사는 축소를 불가능하게 만들지 않고
          # **조용할 수 없게** 만든다. 최종 방어선은 리뷰다.
          floor=.github/parity-canonical-floor.txt
          if [ ! -f "$floor" ]; then
            echo "::error::$floor 가 없다 — 정본 축소를 감지할 기준점이 사라졌다."
            echo "::error::이 파일이 없으면 '정본이 원래 몇 개였는지'를 알 수 없으므로 통과시키지 않는다."
            exit 1
          fi
          sed 's/#.*//' "$floor" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/floor" || true
          floor_count=$(wc -l < "$work/floor" | tr -d '[:space:]')
          if [ "$floor_count" -eq 0 ]; then
            echo "::error::$floor 에 도메인이 한 줄도 없다 — 하한이 비면 무엇을 지우든 통과한다."
            echo "::error::파일을 지우는 것과 비우는 것은 같은 일이므로 똑같이 실패로 판정한다."
            exit 1
          fi
          vanished=$(LC_ALL=C comm -23 "$work/floor" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$vanished" | tr -d '[:space:]')" ]; then
            echo "::error::정본에서 도메인이 사라졌다: $vanished"
            echo "::error::$floor 은 ${floor_count}개를 요구하는데 현재 정본은 ${canonical_count}개다."
            echo "::error::게이트 판정 범위가 줄었다 — 이 실행의 '통과'는 사라진 도메인에 대해 아무 의미가 없다."
            echo "::error::생성기(BUILDERS)를 되돌리거나, 삭제가 의도라면 $floor 을 함께 고치고 PR 에 근거를 적어라."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi
          # --------------------------------------------------------------------

          unknown=$(LC_ALL=C comm -23 "$work/declared" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$unknown" | tr -d '[:space:]')" ]; then
            echo "::error::$declaration 에 정본에 없는 도메인이 있다: $unknown"
            echo "::error::정본 확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          declared_count=$(wc -l < "$work/declared" | tr -d '[:space:]')
          declared_list=$(tr '\n' ' ' < "$work/declared")
          skipped_list=$(LC_ALL=C comm -13 "$work/declared" "$work/canonical" | tr '\n' ' ')
          # 하한에 없는 정본 = 이 파일이 만들어진 뒤 추가된 도메인. 막지 않고 이름만 남긴다.
          unlisted=$(LC_ALL=C comm -13 "$work/floor" "$work/canonical" | tr '\n' ' ')

          echo "──────────────── parity 게이트 판정 범위 ────────────────"
          echo "  정본 도메인      : ${canonical_count}개 (하한 ${floor_count}개 충족)"
          echo "  Kotlin 구현 선언 : ${declared_count}개 — ${declared_list:-없음}"
          echo "  검증하지 않음    : $((canonical_count - declared_count))개 — ${skipped_list:-없음}"
          echo "  (검증하지 않은 도메인은 '통과'가 아니라 '증명되지 않음'이다)"
          if [ -n "$(echo "$unlisted" | tr -d '[:space:]')" ]; then
            echo "  하한 미등재      : ${unlisted}"
            echo "  (정본에 추가된 새 도메인이다. $floor 에도 적어야 나중에 삭제될 때 걸린다)"
          fi
          echo "─────────────────────────────────────────────────────────"

          if [ "$declared_count" -eq 0 ]; then
            # 실제로 발생하는 상태다(Phase 1 종료 시점). 산출물이 있는데 선언이 0개인
            # 경우는 위 parityManifestCheck 가 이미 빌드를 실패시켰으므로 여기 못 온다.
            echo "::warning::parity 게이트 미가동 — 포팅을 끝냈다고 선언한 도메인이 0개다."
            echo "::warning::이 실행은 값을 한 건도 검증하지 않았다. Phase 2에서 도메인을 선언하며 닫는다."
            exit 0
          fi

          # 선언이 0개가 아닌데 fixture 트리가 없다 = 정본이 사라진 것이다. 비교기에
          # 그대로 넘기면 "--only-domain 은 디렉터리일 때만" 이라는 인자 오류로 죽어
          # 원인이 흐려지므로 여기서 이름을 붙여 막는다.
          if [ ! -d parity/fixtures ]; then
            echo "::error::parity/fixtures 가 없는데 $declaration 은 ${declared_count}개 도메인을 선언한다."
            echo "::error::선언한 도메인의 정본이 사라졌다 — 비교를 건너뛰지 않고 실패로 판정한다."
            echo "::error::복구: uv run python $scripts/dump_parity_fixtures.py --out parity/fixtures"
            exit 1
          fi

          if [ "$declared_count" -eq "$canonical_count" ]; then
            # 선언이 정본을 다 덮으면 좁히지 않는다 — 도메인 지정 없이 넘겨야 비교기가
            # '기대 집합 전부'를 요구하는 전체 게이트로 돈다. 이 시점부터 종료 코드 3
            # (부분 검증)은 실패로 취급된다. 사면 장치가 스스로 사라지는 지점이다.
            echo "전체 게이트로 실행한다 (--only-domain 없이). 통과 조건: 종료 코드 0."
            status=0
            uv run python "$scripts/compare_parity.py" \
              --fixture parity/fixtures --actual parity/actual || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::parity 전체 게이트 실패 (종료 코드 $status)."
              exit 1
            fi
            echo "parity 전체 게이트 통과 — 도메인 ${canonical_count}개 전부 값으로 대조했다."
            exit 0
          fi

          # 부분 게이트. 도메인 이름은 위에서 정본과 대조해 걸렀으므로 공백이 없다.
          only_args=""
          while read -r domain; do
            only_args="$only_args --only-domain $domain"
          done < "$work/declared"

          status=0
          # shellcheck disable=SC2086 -- only_args 는 의도적으로 단어 분리한다.
          uv run python "$scripts/compare_parity.py" \
            --fixture parity/fixtures --actual parity/actual $only_args || status=$?

          case "$status" in
            3)
              echo "::notice::parity 부분 게이트 통과 — 선언한 ${declared_count}개 도메인(${declared_list})만 값으로 대조했다."
              echo "::warning::아직 검증하지 않은 도메인: ${skipped_list}"
              echo "::warning::게이트는 열려 있다 — 이 초록은 '전건 동등'이 아니라 '선언 범위 안에서 동등'이다."
              exit 0
              ;;
            0)
              echo "::error::부분 범위를 지정했는데 종료 코드 0 이 나왔다 — 비교기 계약과 어긋난다(0은 전체 게이트 전용)."
              echo "::error::compare_parity.py 의 판정 로직이 바뀌었는지 확인하라. 통과로 보고하지 않는다."
              exit 1
              ;;
            *)
              echo "::error::parity 부분 게이트 실패 (종료 코드 $status)."
              echo "::error::1 = 불일치·도메인 누락·결과 파일 없음 / 2 = 선언한 도메인이 spec_status=pending 이라 미검증."
              echo "::error::둘 다 '아직 포팅하지 않았다'가 아니라 '선언한 것을 지키지 못했다'이므로 사면하지 않는다."
              exit 1
              ;;
          esac
