name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # 서비스 컨테이너·네트워크 대기로 잡이 매달리는 것을 방지한다.
    timeout-minutes: 15
    permissions:
      contents: read
    # 로컬 docker-compose.yml과 같은 이미지 — db 마커 통합 테스트를 CI에서 실제로 실행한다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: easydoc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easydoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/easydoc
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run alembic upgrade head
      - run: uv run pytest
      # 골든셋 LLM 평가(-m llm)는 API 키 시크릿 등록 후 별도 잡으로 활성화한다.

  # 프론트 게이트. 백엔드 잡과 독립이라 paths 필터 없이 항상 돌린다 — 필터를 걸면
  # 필수 체크가 건너뛴 채 "성공"으로 보고되어 병합이 열리는 함정이 있다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci는 package-lock.json을 그대로 재현한다(install과 달리 잠금 파일을 고치지 않는다).
      - run: npm ci
      - run: npm run check
      - run: npm run test -- --run
      - run: npm run build
