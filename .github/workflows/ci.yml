name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: 로컬 전체 스택 모델 검증
        run: docker compose -f compose.yml config --quiet
      - name: CI 서비스 포함 모델 검증
        run: docker compose -f compose.yml -f compose.ci.yml --profile ci config --quiet
      - name: E2E override 모델 검증
        run: docker compose -f compose.yml -f compose.e2e.yml config --quiet
      - name: E2E 집행 켜짐 override 모델 검증
        run: docker compose -f compose.yml -f compose.e2e.yml -f compose.e2e-enforced.yml config --quiet
      - name: 파일럿 오버레이 모델 검증
        # compose.pilot.yml의 backend-api는 SENS 필수 변수를 `:?`로 강제한다 — .env.example은
        # 빈 값이라 여기서만 더미 값을 env로 얹어 config 파싱 자체가 되는지 검증한다.
        env:
          EASYDOC_PHONE_VERIFICATION_PEPPER: ci-only-not-a-secret
          EASYDOC_SENS_SERVICE_ID: ci-only-not-a-secret
          EASYDOC_SENS_ACCESS_KEY: ci-only-not-a-secret
          EASYDOC_SENS_SECRET_KEY: ci-only-not-a-secret
          EASYDOC_SMS_FROM: "01000000000"
        run: docker compose -f compose.yml -f compose.pilot.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp .env.example .env
      - name: Kotlin 빌드·정적 분석·테스트
        run: docker compose -f compose.yml -f compose.ci.yml run --build --rm backend-check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: React 타입·린트·테스트·빌드
        run: docker compose -f compose.yml -f compose.ci.yml run --build --rm frontend-check

  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 사전 도구가 지원하는 Python 최소 버전을 검증한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 사전 검사 (테스트·불변식·코퍼스·소비자 중복 게이트)
        working-directory: dictionary
        run: ./scripts/check.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, compose-model]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Chromium 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: E2E 실행 한정 비밀값 생성
        run: |
          echo "EASYDOC_AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> .env
          ./backend-kotlin/gradlew -p backend-kotlin --no-daemon -q :infrastructure:writeEncryptionKeyEnv "-Peasydoc.encryptionEnvOut=$RUNNER_TEMP/easy-doc-key.env"
          cat "$RUNNER_TEMP/easy-doc-key.env" >> .env
      - name: Compose 전체 스택 기동
        run: docker compose -f compose.yml -f compose.e2e.yml up -d --build --wait
      - name: Kotlin API + React E2E
        env:
          EASYDOC_TABLE_RELATIONS_ENABLED: "true"
          EASYDOC_REVIEW_HISTORY_ENABLED: "true"
          E2E_SKIP_STACK: "1"
          E2E_API_BASE_URL: http://localhost:8100
        run: frontend/e2e/run-local.sh
      - name: Compose 로그 보관 (기본 스택)
        if: always()
        run: |
          mkdir -p frontend/test-results
          docker compose -f compose.yml -f compose.e2e.yml logs --no-color > frontend/test-results/compose.log
      # 기본 스펙은 집행 꺼짐을 전제로 하므로 스택 갱신 후 집행 전용 스펙만 실행한다.
      - name: Compose 스택 갱신 (집행 켜짐, E22·E23)
        run: >
          docker compose -f compose.yml -f compose.e2e.yml -f compose.e2e-enforced.yml
          up -d --build --wait
      - name: Kotlin API + React E2E (집행 켜짐, E22·E23)
        env:
          E2E_SKIP_STACK: "1"
          E2E_API_BASE_URL: http://localhost:8100
        run: frontend/e2e/run-local.sh -c playwright.enforced.config.ts
      - name: Compose 로그 보관 (집행 켜짐, E22·E23)
        if: always()
        run: |
          mkdir -p frontend/test-results-enforced
          docker compose -f compose.yml -f compose.e2e.yml -f compose.e2e-enforced.yml \
            logs --no-color > frontend/test-results-enforced/compose.log
      - name: E2E 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/playwright-report-enforced
            frontend/test-results
            frontend/test-results-enforced
          retention-days: 7
          if-no-files-found: warn
