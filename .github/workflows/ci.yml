name: CI

on:
  push:
    branches: [main]
  pull_request:
  # llm-lane 의 API 레인을 돌리는 **유일한 경로**다(2026-08-21 운영자 결정 —
  # 자동 실행을 껐다. 사유는 `llm-lane` 잡의 「변경 범위 판정」 스텝 주석에 있다).
  # 예전에는 "조건 계산이 틀렸을 때 확인할 손잡이" 였고, 지금은 그 손잡이가 본길이다.
  # push·pull_request 에서는 경로 «탐지» 만 하고 실행하지 않는다.
  workflow_dispatch:
    inputs:
      run_llm_lane:
        description: "-m llm 레인(실제 API 호출, ~28분·실과금)을 실행한다. 이 트리거에서만 실행된다"
        type: boolean
        default: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # 서비스 컨테이너·네트워크 대기로 잡이 매달리는 것을 방지한다.
    timeout-minutes: 15
    permissions:
      contents: read
    # 로컬 docker-compose.yml과 같은 이미지 — db 마커 통합 테스트를 CI에서 실제로 실행한다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: easydoc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easydoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/easydoc
      REDIS_URL: redis://localhost:6379/0
    steps:
      # `fetch-depth: 0` — **라쳇 상수 대조의 기준점이 git 이력이다** (C4 R-9).
      #
      # `tests/test_kotlin_gate_reach.py` 의 라쳇 핀(`MIN_TEST_CLASSES`·`MIN_FLOOR_CLASSES`·
      # `MIN_TESTS_IN_FLOOR_CLASS` 값들과 Kotlin 쪽 `MIN_*` 다섯)은 **값 자신이 권위**라
      # 값만 보고는 낮아졌는지 알 수 없다. 그래서 「이 파일 이력의 최댓값보다 작을 수 없다」로
      # 되짚는데, `actions/checkout` 의 기본 `fetch-depth` 는 **1** 이라 이력이 없다 —
      # 그 상태에서는 그 축이 **존재만 하고 도달이 0** 이 된다(규칙 3 근거 6 의 형태).
      #
      # 비용: 전체 클론이다. 실측 `.git` 112MB · 커밋 477개 · 이 대조가 읽는 리비전 64개
      # (`git show` 64회, 1~2초). 얕은 클론으로 되돌리면 요구 모드에서 **실패**하므로
      # 조용히 사라지지 않는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # mypy 는 크롤링할 때 점으로 시작하는 디렉터리를 건너뛴다. 그래서 `mypy .` 는
      # `.claude/skills/**/scripts/` 를 **한 번도 보지 않는다**(parity 스크립트 0개).
      # 하필 그 두 파일이 parity 게이트의 신뢰 뿌리다 — 저장소의 다른 모든 판정을 그것이
      # 내리는데, 정작 자기는 타입 게이트 밖에 있었다. 낡은 `type: ignore` 하나가 실제로
      # 이 사각지대에 남아 있었고, 사람이 경로를 손으로 줄 때만 드러났다.
      # 경로를 명시해 붙인다. 설정(`[tool.mypy] files`)이 아니라 명령에 적는 이유는,
      # 로컬에서 치는 명령과 CI 가 도는 명령이 같아야 사각지대가 다시 안 생기기 때문이다.
      #
      # **열거가 아니라 루트를 준다** (2026-08-13). 처음엔 `.claude/skills/python-kotlin-parity/scripts`
      # 한 곳만 열거했는데, 위 주석이 `**/scripts/` 라고 **복수로 선언**하는 동안 실제 도달은
      # 한 곳이었다 — `migration-safety-gate/scripts/scan_privacy_invariants.py` 는 그 사이
      # **한 번도 검사받지 않았다**. 빈자리가 구조적이라 열거로는 다음 스킬에서 또 벌어진다.
      # `.claude` 루트를 주면 mypy 가 재귀하고, 명시 경로에는 건너뛰기가 적용되지 않는다.
      # 글롭(`.claude/skills/*/scripts`)은 `.py` 없는 디렉터리에서 깨져 못 쓴다
      # (`codex-review/scripts` 는 셸 스크립트뿐).
      #
      # 도달 차이(실측, **이 커밋 시점** — 절대 개수는 커밋마다 움직이므로 시점 없이 쓰지 마라):
      #   `mypy .`                                      → 125 파일 (.claude 도달 0/3)
      #   `mypy . .claude/skills/python-kotlin-parity/scripts` → 127 파일 (도달 2/3)
      #   `mypy . .claude`                              → 128 파일 (도달 3/3)
      # 음성 대조: 위 gate 파일에 반환 타입 오류를 심으면 옛 명령은 Success, 새 명령은
      # `error: Incompatible return value type`. 도달 차이가 실제로 존재한다.
      - run: uv run mypy . .claude
      # 데이터 보호 불변식 기계 스캔 (privacy-gate 판정 X-8, 2026-08-13 · 리더 승인).
      #
      # **`kotlin` 잡이 아니라 여기다.** SCAN_ROOTS 가 app·backend-kotlin·scripts·frontend/src
      # 를 함께 덮는데, 배선 시점 실측으로 검사 171파일 중 **98개(57%)가 backend-kotlin 밖**
      # 이다. 좁은 잡에 붙이면 선언한 범위보다 좁은 자리에서 도는 게이트가 된다.
      # 이 잡은 이미 `uv sync --locked` 를 마쳐 필요한 것이 다 있고 DB·JDK 를 쓰지 않는다.
      #
      # 위치가 mypy 바로 다음인 이유: ⑴ 이 스캐너 자신이 mypy 대상이라 타입 검사를 통과한
      # 직후가 순서상 맞고, ⑵ alembic·pytest 같은 느린 단계 앞이라 실패가 빠르다.
      #
      # 배선 시점 실측: 검사 171파일(backend-kotlin 73) · BLOCK 후보 0 · exit 0.
      # 음성 대조(합성 저장소): 로거 본문 보간·403·난수 키·DTD 팩터리를 심은 .kt 에서
      # BLOCK 4건 검출 — Kotlin 에서 실제로 작동한다.
      #
      # `--changed` 를 쓰지 않는다: 기본 base 가 `main` 이라 오래 사는 브랜치에서 범위가
      # 계속 넓어지거나 fork point 이동으로 흔들리고, 전수가 이미 1초 미만이다.
      # `--no-fail` 을 붙이지 않는다: 붙이면 BLOCK 후보가 있어도 초록이라 게이트가 장식이 된다.
      #
      # 이 스텝 자체의 삭제는 이 스텝이 막지 못한다. 최종 방어선은 그 diff 가 리뷰에
      # 올라가는 것이다 — 한 칸 더 옮기지 않는다.
      - name: 데이터 보호 불변식 스캔 (BLOCK 후보 0건 유지)
        run: uv run python .claude/skills/migration-safety-gate/scripts/scan_privacy_invariants.py
      # Python 정본 스냅샷 재생성 diff 검사 (X-9 마감의 뒤 조각 — 게이트 15 X1 · P-B·C15-5).
      #
      # 이 생성기는 Kotlin 프롬프트·스타일 포팅 판정의 정본 스냅샷을 app/easyread 에서
      # 재생성해 커밋본과 대조한다. 배선 전 도달이 0 이었다 — 부르는 곳이 자기 docstring
      # 뿐이라(실측 grep 2줄) 한 번 손으로 돌린 diff 0 이 승격(L344·L345)의 근거로 쓰였고,
      # 그 뒤 app/easyread 가 바뀌어도 아무 데서도 빨개지지 않았다. 리더 판정: 승격은
      # 마감 축소가 아니라 **CI 배선 완성**으로 유지한다 — 이 스텝이 그 배선이다.
      #
      # **kotlin 잡이 아니라 여기다.** 생성기가 필요로 하는 것은 JDK 가 아니라 이 잡의
      # Python 환경(uv sync --locked)이다. app/** 가 지워지면 이 스텝은 exit 2 로 죽는다 —
      # 그것이 X-9 가 "되돌릴 수 없는 창"이라 부른 상태이고, 조용히 지나가면 안 되는
      # 자리라 사면을 붙이지 않는다(스냅샷의 삭제 후 지위는 P-C 판정 대상으로 열려 있다).
      #
      # 음성 대조(실측, tmp 사본): 케이스 45→4 축소 → SnapshotError·exit 2 /
      # 파생 키(GLOSS_COLLISION_PATTERN_GLOSSES) 단독 삭제 → [갈림]·exit 1.
      # 그 탐지력 자체의 회귀는 tests/test_python_snapshot_guard.py 가 고정한다.
      # 이 스텝 자체의 삭제는 이 스텝이 막지 못한다 — 그 diff 가 리뷰에 올라가는 것이
      # 최종 방어선이다.
      - name: Python 정본 스냅샷 재생성 diff 검사 (X-9 뒤 조각)
        run: uv run python .claude/skills/migration-safety-gate/scripts/dump_python_snapshots.py --check
      - run: uv run alembic upgrade head
      # 아래 `uv run pytest` 가 이 파일도 수집하는데 왜 경로를 또 적는가 —
      # **자기 안의 단언은 파일과 함께 사라지기 때문이다.**
      # tests/test_harness_scope_reach.py 는 "지금 어디서 도는가: CI quality 잡의
      # uv run pytest 단계" 를 자기 docstring 에 적어 두는데, 그 문장은 파일이 지워지면
      # 같이 지워진다. 그러면 전체 수집은 그냥 한 건 줄어들고 스위트는 초록이다.
      # 실측(이 커밋 시점): `--ignore` 로 빼면 수집 1055/1060 → 1036/1041 인데 **exit 0**.
      # `- run: uv run pytest` 한 줄을 지워도 잡 이름 `quality` 가 남아 표의 `ci:quality`
      # 표기는 계속 유효하다. 도달 0을 잡으려고 만든 파일에 도달 0이 재현되고 아무도
      # 모르는 상태였다. (수집 개수는 커밋마다 움직인다 — 시점 없는 절대 수치는 곧 거짓이 된다)
      #
      # 그래서 존재 단언을 **파일 밖**(여기)에 둔다. 이 스텝이 실제로 막는 것(실측):
      #   파일 삭제·경로 변경 → exit 4 (file or directory not found)
      #   `pytestmark = pytest.mark.llm` 등으로 전건 제외 → 1 deselected / 0 selected,
      #     exit 5 (no tests ran). 같은 조작이 전체 수집에서는 exit 0 이라 조용하다 —
      #     경로를 명시했기 때문에만 빨개진다. 마커 우회를 이 스텝이 실제로 막는다.
      # 막지 못하는 것: 이 스텝 자체의 삭제. 저장소 안의 어떤 파일도 자기 자신에 대한
      # 절대 기준이 될 수 없다 — 이 diff 가 리뷰에 올라가는 것이 최종 방어선이다.
      - name: 하네스 도달 검사 실재 확인 (경로 명시 — 자기 단언은 파일과 함께 사라진다)
        run: uv run pytest tests/test_harness_scope_reach.py
      # 같은 규약을 스캐너 회귀에도 적용한다 (게이트 09 M-13). `uv run pytest` 전체 수집만
      # 있으면 이 파일을 지워도 exit 0 이다 — 수집이 한 건 줄고 스위트는 초록이다.
      # 이 파일이 지키는 것은 CI BLOCK 게이트(scan_privacy_invariants.py)의 동작 전부다.
      - name: 스캐너 회귀 실재 확인 (경로 명시)
        run: uv run pytest tests/test_privacy_scanner.py
      # 같은 규약을 parity 게이트 회귀에도 적용한다 (게이트 15 X2 — 두 파일에 적용된
      # 규약의 세 번째 대상인데 이 파일만 빠져 있었다, codex C15-6 (c) 축).
      # 이 파일이 지키는 것은 parity 비교기의 게이트 우회 회귀 — runtime 위조·fixture
      # 축소를 helper 층과 **본류 배선**(compare_file·main 의 호출부) 양쪽에서 잡는
      # 테스트 — 와 CI 셸 가드(선언·정본·하한) 검증 전부다. 전체 수집만 있으면 이
      # 파일을 지워도 exit 0 이다 — 수집이 줄고 스위트는 초록이다.
      - name: parity 게이트 회귀 실재 확인 (경로 명시)
        run: uv run pytest tests/test_parity_ci_gate.py
      # 같은 규약을 스냅샷 가드 회귀에도 적용한다 (게이트 15 리더 판정 — 가드 성격
      # 테스트의 경로 명시는 이 저장소가 세 번 적용한 규약이고, 미적용은 X2 의 CI 축을
      # 새 파일에서 재생산한다). 이 파일이 지키는 것은 위 스냅샷 재생성 diff 검사
      # (dump_python_snapshots.py --check)의 **삭제 탐지력** 전부다 — 케이스 하한
      # PROMPT_CASE_FLOOR 와 파생 키 무조건 재생성이 다시 무력해지면 여기가 빨개진다.
      # 전체 수집만 있으면 이 파일을 지워도 exit 0 이다 — 수집이 줄고 스위트는 초록이다.
      # (§6.2 "열거 유지 vs 구조 유도"의 구조 판정은 다음 게이트 이월 — 지금은 규약 적용만.)
      - name: 스냅샷 가드 회귀 실재 확인 (경로 명시)
        run: uv run pytest tests/test_python_snapshot_guard.py
      # 같은 규약을 게이트 러너 계약 테스트에도 적용한다 (게이트 16 A — T-G·K16-1 후단 합의).
      # 이 파일이 지키는 것은 `.claude/skills/kotlin-migration/scripts/run_gate.sh` 의 계약
      # 전부다 — 빈/공백 인자 exit 2(C, 차단②), 단일 문자열 인자만 수용해 인용 경계
      # 보존(D), 파이프 안 실패 비-0 전파(게이트 15 X3 본래 목적), 그리고 러너 밖 파이프는
      # 못 잡는다는 한계(B)의 문서화. 첫 판에는 이 테스트가 0건이라 세 결함이 아무 데서도
      # 빨개지지 않았다. 전체 수집만 있으면 이 파일을 지워도 exit 0 이다 — 수집이 줄고
      # 스위트는 초록이다. 러너 자신을 CI 가 부르는 배선은 여전히 0 이다(local) — 이 스텝이
      # 배선하는 것은 러너가 아니라 러너의 계약 테스트다.
      - name: 게이트 러너 계약 실재 확인 (경로 명시)
        run: uv run pytest tests/test_run_gate.py
      # 같은 규약을 Kotlin 테스트 클래스 대조에도 적용한다 (게이트 25 H4 · 게이트 26).
      # 여기서 도는 것은 **선언 ↔ 트리 정확 일치**와 내용 결속뿐이다 — 테스트 파일을
      # 지우면 kotlin 잡을 기다리지 않고 이 값싼 잡에서 먼저 빨개진다.
      # 이 잡에는 Gradle 리포트가 없으므로 실행 대조의 대상이 0건이다 — **skip 이 아니라
      # 0건이다**(게이트 26 에서 skip 을 없앴다). 선언 전건에 대한 실행 요구는 아래
      # kotlin 잡이 요구 모드로 켠다.
      - name: Kotlin 테스트 클래스 실재 확인 (경로 명시)
        run: uv run pytest tests/test_kotlin_gate_reach.py
      # 원시 제어문자 전수 검사 (게이트 26 — privacy-gate 처방 · 교차 종합 §7 양립 확인).
      #
      # 추적 파일에 원시 제어문자가 들어가는 사고가 게이트 2·12·13·25·26 에 걸쳐 반복됐고,
      # 게이트 26 한 회차에만 세 번 났다(제품 테스트 · 감사문 · 교차 종합문 자신).
      # 그중 하나는 NUL 때문에 git 이 파일을 **바이너리로 분류**해 `git diff` 가 본문을
      # 내지 않았고, 그 상태로 연속 두 게이트 동안 아무 레인도 그 파일을 읽지 못했다 —
      # 저장소가 스스로 「최종 방어선」이라 적은 리뷰 diff 가 그 파일에서만 거짓이었다.
      #
      # **개인정보 스캐너에 넣지 않았다** — 그것은 개인정보 불변식 축이고 이것은 심사
      # 가능성 축이다. 섞으면 한쪽의 오탐이 다른 쪽 게이트의 신뢰를 갉는다.
      # 분모는 `git ls-files` 전수이고 면제 목록은 없다. 훑은 수가 0이면 실패한다.
      - name: 원시 제어문자 전수 검사 (경로 명시 — 추적 파일 전건)
        run: uv run pytest tests/test_raw_control_chars.py
      - run: uv run pytest
      # 골든셋 LLM 평가(-m llm)는 API 키 시크릿 등록 후 별도 잡으로 활성화한다.

  # 프론트 게이트. 백엔드 잡과 독립이라 paths 필터 없이 항상 돌린다 — 필터를 걸면
  # 필수 체크가 건너뛴 채 "성공"으로 보고되어 병합이 열리는 함정이 있다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci는 package-lock.json을 그대로 재현한다(install과 달리 잠금 파일을 고치지 않는다).
      - run: npm ci
      - run: npm run check
      - run: npm run test -- --run
      - run: npm run build

  # Kotlin 게이트. 계획 §5 Phase 1 "CI에 Kotlin build/test를 추가하되 기존 Python/React
  # gate 유지". 위 두 잡을 건드리지 않는다 — 절체(Phase 7)까지 Python suite가 비교
  # 기준으로 계속 돌아야 한다.
  #
  # paths 필터를 걸지 않는 이유는 frontend 잡과 같다: 필터를 걸면 필수 체크가 건너뛴 채
  # "성공"으로 보고되어 병합이 열린다.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-kotlin
    steps:
      # 사유는 quality 잡의 같은 스텝 주석과 같다 — 라쳇 대조가 이력을 기준점으로 쓴다.
      # 이 잡은 요구 모드(`KOTLIN_GATE_REACH_REQUIRE_REPORT=1`)로 그 대조를 돌리므로
      # 이력이 없으면 **실패**한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          # build.gradle.kts 의 jvmToolchain(21)과 같은 값. Phase 0 spike 조합이기도 하다.
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # parity 비교기(compare_parity.py)가 Python 정본 생성기를 다시 돌려 fixture 를
      # 대조하므로 이 잡에도 uv 가 필요하다. Python **게이트**는 위 quality 잡이 그대로
      # 담당한다 — 여기서 중복 실행하지 않는다.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # 잠금 파일 그대로 설치한다. 비교기는 Python 정본 생성기를 **다시 돌려** fixture 를
      # 대조하므로, 이 잡의 의존성이 quality 잡과 다르면 "정본"이 잡마다 달라진다.
      - run: uv sync --locked
        working-directory: .

      # Testcontainers 는 ubuntu-latest 러너의 Docker 데몬을 그대로 쓴다.
      # 이미지를 미리 받아 두면 첫 테스트의 타임아웃 위험이 줄고, 무엇을 쓰는지 로그에 남는다.
      - name: PostgreSQL 이미지 미리 받기
        run: docker pull pgvector/pgvector:pg16

      # build = 컴파일 + ktlintCheck + detekt + test (Testcontainers 포함).
      # 락파일과 어긋나면 실패시킨다 — 전이 의존성이 조용히 올라가는 것을 막는 지점이다.
      - name: Gradle build (ktlint · detekt · test)
        run: ./gradlew build --no-daemon

      # 테스트 클래스 **전체**의 실행 대조 (게이트 25 H4 — codex 단독 지적 · 게이트 26).
      #
      # 아래 두 스텝은 클래스를 **손으로 적어** 둘만 지킨다. 그 사이 Phase 3~4 에서 가드가
      # 여럿 늘었고, 늘어난 것들은 지워도 CI 가 통과하는 상태였다. 여기서는 목록을 손으로
      # 적지 않고 `tests/test_kotlin_gate_reach.py` 가 트리와 **정확 일치**로 대조한다.
      # 게이트 26 에서 분모가 「가드 이름 families」에서 「JUnit 애너테이션을 품은 최상위
      # 선언 전부」로 바뀌었다 — 이름 열거를 없앤 것이 그 처방의 본체다.
      #
      # 이 스텝이 위 `build` **뒤에** 있어야 하는 이유: 대조의 한 축이 방금 만들어진
      # `build/test-results/test/*.xml` 을 읽어 "그 클래스가 실제로 돌았는가"를 본다.
      # 요구 모드를 켜면 ⑴ 리포트 부재 자체가 실패이고 ⑵ 대상이 **선언 전건**으로
      # 넓어진다. 켜지 않으면 리포트에 실재하는 클래스만 재므로 조용히 좁아진다.
      #
      # **그리고 `build` 와 이 스텝 사이에 리포트를 덮는 것이 없어야 한다** (게이트 28 C-2).
      # 앞선 판은 이 스텝을 아래 두 「탐지기 존재 확인」 **뒤에** 두었다. 그 둘은
      # `:core:test --tests <클래스 하나>` 라서 core 모듈의 리포트를 그 하나로 통째로
      # 덮어쓴다 — 요구 모드 대조가 **덮인 리포트를 읽어 결정론적으로 실패**했다
      # (run 32333596159·32309434868 연속 빨강. 미실행 목록에 `ProvenanceCreationSitesTest`
      # **자신**이 들어 있었던 것이 그 증거다).
      #
      # 순서를 고치는 것만으로는 부족하다 — 다음 사람이 사이에 스텝 하나를 끼우면 같은
      # 일이 조용히 재발한다. 그래서 그 제약을 주석이 아니라 **탐지기**로 세웠다:
      # `tests/test_kotlin_gate_reach.py::test_요구모드_대조_앞에_리포트를_덮는_스텝이_없다`
      # 가 이 파일을 파싱해 `build` 와 이 스텝 **사이**에 `--tests` 필터를 건 gradlew 호출이
      # 없는지 본다(이름 면제 없음). 그 테스트는 quality 잡에서도 도므로 Gradle 없이 빨개진다.
      #
      # `working-directory: .` 인 이유는 이 잡의 기본값이 `backend-kotlin` 이기 때문이다.
      # 이 스텝 자체의 삭제는 이 스텝이 막지 못한다 — 다만 그 삭제는 quality 잡의
      # `test_CI_가_이_대조를_경로_명시로_배선했다` 에서 빨개진다(장치 밖 단언).
      - name: Kotlin 테스트 클래스 실행 대조 (리포트 XML — 삭제·미실행·skipped 시 실패)
        working-directory: .
        env:
          KOTLIN_GATE_REACH_REQUIRE_REPORT: "1"
        run: uv run pytest tests/test_kotlin_gate_reach.py

      # 보안 불변식 **탐지기 자신의 존재**를 확인한다 (교차 종합 C-05).
      #
      # 위 `build` 는 있는 테스트를 전부 돌리지만, **테스트 파일을 지우면 그대로 초록**이다.
      # 두 탐지기가 지켜야 할 것은 마스킹 선행 불변식(INV-01)이고, 그것을 지우는 diff 가
      # 조용히 지나가면 안 된다. `--tests` 필터는 일치하는 테스트가 없으면
      # `No tests found for given includes` 로 **실패**한다 — 실측 확인.
      #
      # 존재 단언을 파일 밖에 두는 이유는 quality 잡의 pytest 경로 명시와 같다:
      # 자기 안의 단언은 파일과 함께 사라진다.
      # `--tests` 는 **집합 의미론**이다 — 여러 개를 주면 "하나라도 맞으면 통과"라서
      # 클래스 **하나만** 지워도 RC=0 이었다(게이트 09 M-02 실측). 둘 다 지워야 실패하는
      # 가드는 "탐지기가 살아 있다"를 보장하지 못한다.
      #
      # 그래서 **클래스마다 따로 돌린다.** 하나가 사라지면 그 스텝이
      # `No tests found for given includes` 로 실패한다.
      #
      # **위 실행 대조보다 뒤에 둔다** (게이트 28 C-2). 이 둘은 core 리포트를 한 클래스로
      # 덮으므로 앞에 두면 그 대조가 덮인 것을 읽는다. 여기서 재는 것(클래스가 사라지면
      # `No tests found for given includes`)은 **순서와 무관**하므로 내려도 잃는 것이 없다.
      #
      # 목록을 손으로 적는 것 자체는 이 스텝이 막지 못한다(줄을 지우면 그만이다).
      # 최종 방어선은 그 diff 가 리뷰에 올라가는 것이다 — 한 칸 더 옮기지 않는다.
      - name: 탐지기 존재 확인 — provenance 생성 지점 (단독 삭제 시 실패)
        run: ./gradlew :core:test --no-daemon --tests kr.easydoc.core.privacy.ProvenanceCreationSitesTest
      - name: 탐지기 존재 확인 — MaskedText 생성 통로 (단독 삭제 시 실패)
        run: ./gradlew :core:test --no-daemon --tests kr.easydoc.core.privacy.MaskedTextGatewayTest

      # --- parity 게이트 배선 (Phase 0 필수 조치 E) ---------------------------
      # 산출물(parity/actual/)을 **Kotlin 테스트가** 만든다는 것을 CI에서 보장한다.
      # 이 배선이 없으면 fixture 입력이 전부 공개돼 있으므로 Python이 같은 파일을 만들어도
      # 게이트가 구분하지 못한다(python-kotlin-parity 스킬 "이 게이트가 막지 못하는 것").
      # 이 태스크는 산출물을 쓰고 **곧바로** backend-kotlin/parity-domains.txt 의 선언과
      # 대조한다(parityManifestCheck). "포팅했다고 선언했는데 산출물이 없다"는 여기서
      # 빨개진다 — 아래 비교 단계의 부분 검증 사면과 **다른 단계**에 두었기 때문에
      # 사면이 이 결함을 구조적으로 삼킬 수 없다.
      - name: parity 산출물 생성 + 선언 대조 (Kotlin 하네스)
        run: ./gradlew parityHarness --no-daemon

      - name: parity 하네스 배선 확인
        working-directory: .
        run: |
          set -euo pipefail
          selfcheck=parity/_harness-selfcheck/kotlin.json
          if [ ! -f "$selfcheck" ]; then
            echo "::error::Kotlin parity 하네스가 산출물을 쓰지 않았다 ($selfcheck 없음)."
            echo "parityHarness 태스크와 ParityActual 의 parity.actual.dir 배선을 확인하라."
            exit 1
          fi
          grep -q '"runtime": "kotlin"' "$selfcheck" || {
            echo "::error::$selfcheck 의 runtime 이 kotlin 이 아니다."; exit 1; }
          echo "parity 하네스 배선 OK:"; cat "$selfcheck"

      # --- parity 비교 --------------------------------------------------------
      # 판정 범위를 **디렉터리 유무**가 아니라 **버전 관리되는 선언**에서 가져온다.
      #
      # 예전 방식은 두 방향으로 고장나 있었다. (1) parity/fixtures 가 없으면 비교기를
      # 부르지도 않고 exit 0 — 트리를 지우면 되살아나는 백도어였다. (2) 종료 코드 2 를
      # 사면했는데, "Kotlin 결과 파일 없음"은 비교기가 exit **1** 로 내므로 사면이
      # 겨냥한 조건이 실제로는 발생하지 않았다. 결과적으로 Phase 2 에서 fixture 가
      # 생기는 순간 CI 를 초록으로 만들 수 있는 경로가 없었다.
      #
      # 지금은 backend-kotlin/parity-domains.txt 가 "Kotlin 이 어느 도메인을 포팅했는가"를
      # 선언하고, 비교 범위를 그 선언으로 좁힌다. 좁힌 것은 통과가 아니라 **미검증**이며
      # 로그에 도메인 이름으로 크게 남는다. 선언과 실제 산출물의 대조는 위 Gradle
      # 단계(parityManifestCheck)가 이미 끝냈으므로, 여기의 사면은 "아직 포팅하지 않은
      # 도메인"에만 닿고 "포팅했다면서 산출물이 없는 도메인"에는 닿지 않는다.
      - name: parity 비교 (선언한 도메인 범위)
        working-directory: .
        run: |
          set -euo pipefail

          declaration=backend-kotlin/parity-domains.txt
          scripts=.claude/skills/python-kotlin-parity/scripts
          work=$(mktemp -d)

          if [ ! -f "$declaration" ]; then
            echo "::error::$declaration 이 없다 — 무엇을 검증해야 하는지의 선언이 사라졌다."
            echo "::error::이 파일이 없으면 비교 범위를 정할 근거가 없으므로 통과시키지 않는다."
            exit 1
          fi

          # 선언: 리뷰를 거치는 버전 관리 파일. 주석·빈 줄을 걷어낸다.
          sed 's/#.*//' "$declaration" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/declared" || true
          # 정본: 생성기의 BUILDERS 키. 도메인 목록을 여기에 복제하지 않는다 — 복제가
          # 곧 드리프트이고, 그 드리프트가 곧 "검증되지 않은 채 통과하는 도메인"이다.
          uv run python "$scripts/dump_parity_fixtures.py" --list \
            | awk 'NF {print $1}' | LC_ALL=C sort -u > "$work/canonical"
          canonical_count=$(wc -l < "$work/canonical" | tr -d '[:space:]')

          # 정본이 0개인 것은 정상 상태가 아니라 **도구가 고장 난 것**이다. 생성기에는
          # 언제나 도메인이 있어야 하므로, 0이 나왔다면 --list 가 실패했거나 출력 형식이
          # 바뀌어 awk 가 아무것도 못 뽑았거나 BUILDERS 자체가 비었다는 뜻이다.
          #
          # 이 검사가 없으면 무검증 통과 경로가 열린다. canonical 이 비면 아래 unknown
          # 검사도 통과하고(선언이 0개일 때), "선언 0개" 분기가 exit 0 을 낸다. 그때 로그는
          # "정본 0개 / 검증하지 않음 0개"로 찍혀 **"11개를 안 봤다"는 경고가 "0개를 안
          # 봤다"로 바뀐다** — 경고가 스스로 무의미해지고 사람은 초록불만 본다.
          #
          # 아래 하한 검사가 이 경우도 잡지만(하한이 비어 있지 않으므로 전부 누락으로
          # 걸린다), 원인이 전혀 다르므로 진단 문구를 따로 남긴다.
          if [ "$canonical_count" -eq 0 ]; then
            echo "::error::정본 도메인이 0개다 — 생성기를 읽지 못했거나 BUILDERS 가 비었다."
            echo "::error::정본이 비면 '무엇을 검증하지 않았는지'를 셀 수 없어 게이트가 무의미해진다."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          # --- 정본 하한 검사 (현재 정본 ⊇ 스냅샷) -----------------------------
          # 위 검사는 정본이 **0개**일 때만 막는다. 그래서 11개를 3개로 줄이는 부분 삭제는
          # 그대로 통과했다. 그것도 두 갈래로.
          #   선언 0개 → "정본 3개 / 검증하지 않음 3개" 를 찍고 exit 0
          #   선언 3개 → 선언 == 정본 이므로 **전체 게이트**로 들어가 "도메인 3개 전부 값으로
          #              대조했다" 를 찍고 exit 0 — 축소가 완전 검증으로 위장된다.
          # 정본이 곧 판정 기준인데 그 기준이 변경 가능하고, 축소를 알아챌 기준점이 없었다.
          #
          # 그래서 정본 도메인 목록의 스냅샷을 버전 관리 파일로 두고 **비대칭**으로 본다.
          #   추가(정본에 있고 스냅샷에 없다) → 통과. 선언하지 않은 도메인은 아래 배너에
          #     "검증하지 않음"으로 이름이 찍히므로 놓쳐도 드러난다.
          #   삭제(스냅샷에 있고 정본에 없다) → 실패. 줄이려면 .github/ 안의 스냅샷 파일을
          #     고쳐야 하고, 그 diff 는 "CI 게이트를 건드렸다"는 신호로 리뷰에 올라간다.
          # 한계: 스냅샷도 같은 커밋에서 함께 바꿀 수 있다 — 저장소 안의 어떤 파일도 저장소
          # 자신에 대한 절대 기준이 될 수 없다. 이 검사는 축소를 불가능하게 만들지 않고
          # **조용할 수 없게** 만든다. 최종 방어선은 리뷰다.
          floor=.github/parity-canonical-floor.txt
          if [ ! -f "$floor" ]; then
            echo "::error::$floor 가 없다 — 정본 축소를 감지할 기준점이 사라졌다."
            echo "::error::이 파일이 없으면 '정본이 원래 몇 개였는지'를 알 수 없으므로 통과시키지 않는다."
            exit 1
          fi
          sed 's/#.*//' "$floor" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/floor" || true
          floor_count=$(wc -l < "$work/floor" | tr -d '[:space:]')
          if [ "$floor_count" -eq 0 ]; then
            echo "::error::$floor 에 도메인이 한 줄도 없다 — 하한이 비면 무엇을 지우든 통과한다."
            echo "::error::파일을 지우는 것과 비우는 것은 같은 일이므로 똑같이 실패로 판정한다."
            exit 1
          fi
          vanished=$(LC_ALL=C comm -23 "$work/floor" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$vanished" | tr -d '[:space:]')" ]; then
            echo "::error::정본에서 도메인이 사라졌다: $vanished"
            echo "::error::$floor 은 ${floor_count}개를 요구하는데 현재 정본은 ${canonical_count}개다."
            echo "::error::게이트 판정 범위가 줄었다 — 이 실행의 '통과'는 사라진 도메인에 대해 아무 의미가 없다."
            echo "::error::생성기(BUILDERS)를 되돌리거나, 삭제가 의도라면 $floor 을 함께 고치고 PR 에 근거를 적어라."
            echo "::error::확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi
          # --------------------------------------------------------------------

          unknown=$(LC_ALL=C comm -23 "$work/declared" "$work/canonical" | tr '\n' ' ')
          if [ -n "$(echo "$unknown" | tr -d '[:space:]')" ]; then
            echo "::error::$declaration 에 정본에 없는 도메인이 있다: $unknown"
            echo "::error::정본 확인: uv run python $scripts/dump_parity_fixtures.py --list"
            exit 1
          fi

          declared_count=$(wc -l < "$work/declared" | tr -d '[:space:]')
          declared_list=$(tr '\n' ' ' < "$work/declared")

          # --- 선언 0개 = 실패 — C-02 ------------------------------------------
          # 2026-08-14 이전에는 경고 + exit 0 이었다. Phase 1 종료 시점에는 그것이
          # **사실**이었다 — 포팅한 도메인이 0개였으므로 "검증하지 않았다"가 정직한 보고다.
          # 그 시기가 끝났다(masking·repair-adoption 이 실제로 값을 판정한다). 선언이 0개가
          # 되는 경로는 이제 하나뿐이다 — **누군가 지웠다.**
          #
          # 아래 선언 하한 검사보다 **먼저** 둔다. 순서가 뒤집히면 이 분기는 도달 0 이 된다
          # (하한이 비어 있지 않으면 전부 누락으로 걸려 여기까지 오지 못하고, 하한이 비면
          # 그쪽 검사가 먼저 막는다). 실측으로 확인했다 — 처음에 뒤에 두었더니 선언을 비운
          # 변형이 하한 검사 메시지로 걸려, 이 분기의 진단이 한 번도 출력되지 않았다.
          if [ "$declared_count" -eq 0 ]; then
            echo "::error::parity 게이트 미가동 — 포팅을 끝냈다고 선언한 도메인이 0개다."
            echo "::error::이 실행은 값을 한 건도 검증하지 않았다. '아직 시작 안 했다'와 '방금 껐다'는 로그가 같으므로 통과시키지 않는다."
            echo "::error::복구: $declaration 에 구현이 끝난 도메인을 선언한다(생산자 테스트와 같은 커밋에)."
            exit 1
          fi

          # --- 선언 하한 검사 (현재 선언 ⊇ 스냅샷) — C-02 -----------------------
          # 위 정본 하한은 "생성기가 아는 세계"가 줄어드는 것을 막는다. 그것과 별개로
          # **이미 검증되고 있던 도메인이 검증 대상에서 빠지는** 경로가 열려 있었다.
          # 선언을 2개에서 1개로 줄이면 남은 1개가 통과하므로 로그는 초록이고, 0개로
          # 줄이면 아래 분기가 "미가동"을 찍고 exit 0 이었다. 둘 다 게이트를 끄는 편집인데
          # 결과가 초록이다. 여기서 막는다.
          dfloor=.github/parity-declared-floor.txt
          if [ ! -f "$dfloor" ]; then
            echo "::error::$dfloor 가 없다 — 구현 완료 도메인이 줄어드는 것을 감지할 기준점이 사라졌다."
            echo "::error::이 파일이 없으면 '어제까지 무엇을 검증하고 있었는지'를 알 수 없으므로 통과시키지 않는다."
            exit 1
          fi
          sed 's/#.*//' "$dfloor" | tr -d '[:blank:]' | grep -v '^$' \
            | LC_ALL=C sort -u > "$work/dfloor" || true
          dfloor_count=$(wc -l < "$work/dfloor" | tr -d '[:space:]')
          if [ "$dfloor_count" -eq 0 ]; then
            echo "::error::$dfloor 에 도메인이 한 줄도 없다 — 하한이 비면 무엇을 지우든 통과한다."
            echo "::error::파일을 지우는 것과 비우는 것은 같은 일이므로 똑같이 실패로 판정한다."
            exit 1
          fi
          undeclared=$(LC_ALL=C comm -23 "$work/dfloor" "$work/declared" | tr '\n' ' ')
          if [ -n "$(echo "$undeclared" | tr -d '[:space:]')" ]; then
            echo "::error::구현 완료로 선언돼 있던 도메인이 선언에서 사라졌다: $undeclared"
            echo "::error::$dfloor 은 ${dfloor_count}개를 요구하는데 $declaration 은 ${declared_count}개를 선언한다."
            echo "::error::그 도메인의 값 비교가 이 실행에서 빠졌다 — 남은 도메인의 '통과'는 사라진 것에 대해 아무 의미가 없다."
            echo "::error::되돌리거나, 삭제가 의도라면 $dfloor 을 함께 고치고 PR 에 근거를 적어라(생산자·fixture 도 함께 지웠는지 포함)."
            exit 1
          fi
          # 선언에 있고 하한에 없는 것 = 이 파일이 만들어진 뒤 끝낸 포팅. 막지 않고 이름만 남긴다.
          dfloor_new=$(LC_ALL=C comm -13 "$work/dfloor" "$work/declared" | tr '\n' ' ')
          # --------------------------------------------------------------------

          skipped_list=$(LC_ALL=C comm -13 "$work/declared" "$work/canonical" | tr '\n' ' ')
          # 하한에 없는 정본 = 이 파일이 만들어진 뒤 추가된 도메인. 막지 않고 이름만 남긴다.
          unlisted=$(LC_ALL=C comm -13 "$work/floor" "$work/canonical" | tr '\n' ' ')

          echo "──────────────── parity 게이트 판정 범위 ────────────────"
          echo "  정본 도메인      : ${canonical_count}개 (하한 ${floor_count}개 충족)"
          echo "  Kotlin 구현 선언 : ${declared_count}개 (하한 ${dfloor_count}개 충족) — ${declared_list:-없음}"
          if [ -n "$(echo "$dfloor_new" | tr -d '[:space:]')" ]; then
            echo "  선언 하한 미등재 : ${dfloor_new}"
            echo "  ($dfloor 에도 적어야 나중에 이 도메인이 선언에서 빠질 때 걸린다)"
          fi
          echo "  검증하지 않음    : $((canonical_count - declared_count))개 — ${skipped_list:-없음}"
          echo "  (검증하지 않은 도메인은 '통과'가 아니라 '증명되지 않음'이다)"
          if [ -n "$(echo "$unlisted" | tr -d '[:space:]')" ]; then
            echo "  하한 미등재      : ${unlisted}"
            echo "  (정본에 추가된 새 도메인이다. $floor 에도 적어야 나중에 삭제될 때 걸린다)"
          fi
          echo "─────────────────────────────────────────────────────────"

          # 선언이 0개가 아닌데 fixture 트리가 없다 = 정본이 사라진 것이다. 비교기에
          # 그대로 넘기면 "--only-domain 은 디렉터리일 때만" 이라는 인자 오류로 죽어
          # 원인이 흐려지므로 여기서 이름을 붙여 막는다.
          if [ ! -d parity/fixtures ]; then
            echo "::error::parity/fixtures 가 없는데 $declaration 은 ${declared_count}개 도메인을 선언한다."
            echo "::error::선언한 도메인의 정본이 사라졌다 — 비교를 건너뛰지 않고 실패로 판정한다."
            echo "::error::복구: uv run python $scripts/dump_parity_fixtures.py --out parity/fixtures"
            exit 1
          fi

          if [ "$declared_count" -eq "$canonical_count" ]; then
            # 선언이 정본을 다 덮으면 좁히지 않는다 — 도메인 지정 없이 넘겨야 비교기가
            # '기대 집합 전부'를 요구하는 전체 게이트로 돈다. 이 시점부터 종료 코드 3
            # (부분 검증)은 실패로 취급된다. 사면 장치가 스스로 사라지는 지점이다.
            #
            # **이 분기가 게이트 13 X-1 이 난 자리다.** 여기서 --only-domain 을 빼는 것은
            # 옳은데, 비교기의 전체 게이트 하한이 그 인자가 **있을 때만** 돌아서 정작 8/8
            # 경로에서 통째로 잠들어 있었다. 셸과 비교기가 각자 자기 몫은 했고 이음매가
            # 비어 있었다.
            #
            # 강제 지점은 셸이 아니라 **비교기**다. 실제 구조는 이렇다
            # (compare_parity.py::full_gate_floor_problems):
            #
            #   1. 선언 하한 .github/parity-declared-floor.txt 를 비교기가 **직접 읽어**
            #      (declared_floor_domains) 정본 BUILDERS 집합과 비교한다. 이 값은 **이
            #      실행이 무엇을 골랐는지와 무관**하다 — 그것이 X-1 의 교훈이다.
            #   2. 표시 파일 .github/parity-full-gate.txt 는 **존재가 아니라 내용**을
            #      파싱한다(read_full_gate_mark → reached / domains 두 필드). 예전에는
            #      exists() 하나여서 touch 한 번이면 하한이 서는 것처럼 보였다.
            #   3. 두 방향을 본다 — 하한이 정본을 덮는데 표시가 없으면 "고정하라"로 막고,
            #      표시가 있는데 하한이 정본에 못 미치면 "내려왔다"로 막는다. 기록된
            #      domains 수가 지금 정본 크기와 다르면 "표시가 낡았다"로 막는다.
            #   4. --only 로 케이스를 좁힌 실행에서는 보지 않는다(fixture 를 전부 읽지
            #      않아 판단 근거가 없다). --only-domain 유무는 이제 무관하다.
            #
            # **앞선 판은 이 자리에 없는 것을 적어 두었다** — "비교기가 판정 범위를 스스로
            # 계산한다(effective_scope)". 그런 이름의 장치는 저장소에 없고, 그것은 X-1
            # 수정 과정에서 한 번 검토됐다가 **버려진 설계**다(실행이 고른 범위로 저장소의
            # 상태를 판정하려 하면 정상적으로 좁힌 실행이 전부 강등으로 걸린다 — 실측으로
            # 폐기됐다). 폐기된 설계를 현재형으로 적어 두면 다음 사람이 그것을 근거로
            # 판단하므로, 게이트 13 U-3 전례에 따라 **규칙과 같은 커밋에서 문장을 고친다.**
            # 하필 이 자리가 X-1 이 난 이음매라 거짓 기록의 값이 더 비싸다.
            echo "전체 게이트로 실행한다 (--only-domain 없이). 통과 조건: 종료 코드 0."
            status=0
            uv run python "$scripts/compare_parity.py" \
              --fixture parity/fixtures --actual parity/actual || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::parity 전체 게이트 실패 (종료 코드 $status)."
              exit 1
            fi
            echo "parity 전체 게이트 통과 — 도메인 ${canonical_count}개 전부 값으로 대조했다."
            exit 0
          fi

          # 부분 게이트. 도메인 이름은 위에서 정본과 대조해 걸렀으므로 공백이 없다.
          only_args=""
          while read -r domain; do
            only_args="$only_args --only-domain $domain"
          done < "$work/declared"

          status=0
          # shellcheck disable=SC2086 -- only_args 는 의도적으로 단어 분리한다.
          uv run python "$scripts/compare_parity.py" \
            --fixture parity/fixtures --actual parity/actual $only_args || status=$?

          case "$status" in
            3)
              echo "::notice::parity 부분 게이트 통과 — 선언한 ${declared_count}개 도메인(${declared_list})만 값으로 대조했다."
              echo "::warning::아직 검증하지 않은 도메인: ${skipped_list}"
              echo "::warning::게이트는 열려 있다 — 이 초록은 '전건 동등'이 아니라 '선언 범위 안에서 동등'이다."
              exit 0
              ;;
            0)
              echo "::error::부분 범위를 지정했는데 종료 코드 0 이 나왔다 — 비교기 계약과 어긋난다(0은 전체 게이트 전용)."
              echo "::error::compare_parity.py 의 판정 로직이 바뀌었는지 확인하라. 통과로 보고하지 않는다."
              exit 1
              ;;
            *)
              echo "::error::parity 부분 게이트 실패 (종료 코드 $status)."
              echo "::error::1 = 불일치·도메인 누락·결과 파일 없음 / 2 = 선언한 도메인이 spec_status=pending 이라 미검증."
              echo "::error::둘 다 '아직 포팅하지 않았다'가 아니라 '선언한 것을 지키지 못했다'이므로 사면하지 않는다."
              exit 1
              ;;
          esac

  # ── 브라우저 E2E 레인 (React ↔ Kotlin API ↔ PostgreSQL) ────────────────────
  #
  # 계획 정본: `docs/migration/_workspace/03_contract-keeper_react-e2e-plan.md`.
  # 원장 Phase 3 표 행 5 「React 를 Kotlin API 에 연결한 로그인·작업 공간 E2E」의
  # 실행 경로가 이 잡이다. 리더 판정(OQ-E1): `local:` 로 닫지 않고 CI 잡을 신설한다.
  #
  # ## 왜 `frontend` 잡을 키우지 않는가 (계획 §3-4 (a) vs (b))
  #
  # 순수 프런트 게이트에 DB·JVM 을 넣으면 **프런트 회귀가 인프라 실패로 빨강**이 된다.
  # 신호가 섞이고 잡 시간이 늘어난다. 기존 네 잡(`quality`·`frontend`·`kotlin`·`llm-lane`)은
  # 이 잡이 생겨도 한 줄도 바뀌지 않는다.
  #
  # ## 왜 compose 가 아니라 서비스 컨테이너 + bootJar 인가
  #
  # 계획 §3-4 는 compose 경로를 적었으나, 그러면 러너 안에서 이미지를 빌드하느라
  # Gradle 캐시가 안 먹고(컨테이너 빌드 컨텍스트가 따로다) 실패 시 로그가 컨테이너 안에
  # 갇힌다. 서비스 컨테이너 + `bootJar` 는 `kotlin` 잡이 이미 쓰는 조합이고,
  # 로컬 러너(`frontend/e2e/run-local.sh`)가 **같은 절차**를 그대로 재현한다.
  #
  # ## 이 잡이 막지 못하는 것
  #
  # 이 잡 자체의 삭제. 저장소 안의 어떤 파일도 자기 자신에 대한 절대 기준이 될 수 없다 —
  # 최종 방어선은 그 diff 가 리뷰에 올라가는 것이다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      # `kotlin-migrate`/`kotlin-api` 가 쓰는 DB 와 같은 이름. Alembic(Python)이 관리하는
      # `easydoc` 과 갈라 둔다 — 한 환경에서 Alembic 과 Flyway 를 함께 돌리지 않는다.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: easydoc_kotlin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easydoc_kotlin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/easydoc_kotlin
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Python api(8000)와 포트를 나눈다 — compose 의 `kotlin-api` 와 같은 값이다.
      SERVER_PORT: "8100"
      E2E_API_BASE_URL: http://localhost:8100
      # 브라우저 출처. 계약 `x-cors.allow_origins` 의 기본값과 같아야 프리플라이트가
      # 통과한다 — **계약 기본값을 여기서 덮어쓰지 않는다.** 덮어쓰면 계약이 정한
      # 값이 한 번도 실행되지 않는다.
      E2E_FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # build.gradle.kts 의 jvmToolchain(21)과 같은 값.
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 `kotlin` 잡이 돌린다 — 여기서는 실행 가능한 JAR 만 만든다.
      - name: Kotlin API bootJar 빌드
        working-directory: backend-kotlin
        run: ./gradlew :api:bootJar --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # ── Playwright 설치 — apt 와 CDN 다운로드를 나눈다 ────────────────────
      #
      # 왜 나눴나. run 32225305372(2026-08-19)이 `npx playwright install --with-deps
      # chromium` 한 스텝에서 **28분 매달려** 잡 타임아웃(30분)으로 취소됐다. 로그가
      # 지목하는 자리는 apt 다 — `azure.archive.ubuntu.com` 이 `Ign:` 으로 네 번
      # 튕긴 뒤 `archive.ubuntu.com` 으로 넘어가 `noble-security InRelease` 에서 멈췄고
      # (06:55:43 → 07:23:21 무출력), **브라우저 다운로드는 시작조차 못 했다**.
      # 첫 실행(32222249150)은 같은 명령이 azure 미러에 붙어 3분 37초에 끝났다.
      # 즉 결함은 명령이 아니라 **미러 장애에 상한이 없다는 것**이다.
      #
      # 한 스텝에 묶여 있으면 (1) 어느 쪽이 멈췄는지 로그를 파야 알고 (2) 캐시가
      # 맞아도 apt 를 또 타고 (3) 상한을 한쪽에만 걸 수 없다. 그래서 셋을 나눈다.

      # 브라우저 빌드는 Playwright 버전에 묶인다. lock 이 올라가면 캐시도 반드시
      # 갈려야 하므로 키에 **실제로 설치된** 버전을 넣는다(`^1.62.1` 같은 범위 표기가
      # 아니라 `npm ci` 가 깐 값).
      - name: Playwright 버전 확인 (캐시 키용)
        id: pw
        working-directory: frontend
        run: |
          set -euo pipefail
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright ${version}"

      # `restore-keys` 를 두지 않는다. 다른 버전의 부분 복원은 못 쓰는 브라우저 디렉터리를
      # 남기면서 `cache-hit` 은 false 라 어차피 다시 받는다 — 이득 없이 상태만 흐려진다.
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      # apt 단계. **캐시와 무관하게 매번 돈다** — 시스템 패키지는 `~/.cache/ms-playwright`
      # 에 없고 러너가 새로 뜨면 사라진다. 캐시는 다운로드를 줄일 뿐 이 스텝을 없애지 못한다.
      #
      # 잡을 세우지 않는 이유(은폐가 아니라 탐지 위치의 선택이다). 첫 성공 실행에서 이
      # 명령이 실제로 깐 것은 **폰트뿐이었다** — fonts-ipafont-gothic·fonts-freefont-ttf·
      # fonts-tlwg-loma-otf·fonts-unifont·fonts-wqy-zenhei·xfonts-*. 공유 라이브러리는
      # 한 개도 없었다(ubuntu-latest 이미지가 이미 갖고 있다). 그리고 이 스위트에는
      # 스크린샷·픽셀 단언이 0 건이라(`toHaveScreenshot`·`toMatchSnapshot` 부재) 폰트가
      # 합격/불합격을 가르지 않는다. 반대로 언젠가 Playwright 가 러너에 없는 `.so` 를
      # 요구하게 되면 chromium 이 기동에 실패하고 아래 `Playwright 실행` 스텝이
      # **시끄럽게** 깨진다 — 탐지기를 없앤 게 아니라 뒤로 옮긴 것이다.
      # `continue-on-error` 는 스텝을 실패로 표시한 채 잡을 잇는다(UI 에 남는다).
      - name: Playwright 시스템 의존성 (apt)
        id: pw-deps
        timeout-minutes: 6
        continue-on-error: true
        working-directory: frontend
        run: |
          set -uo pipefail
          # apt 자신에게 상한을 준다. 이것이 없으면 멈춘 미러를 붙들고 `timeout-minutes`
          # 가 스텝을 죽일 때까지 6분을 통째로 버린다 — 원 사고가 정확히 그 형태였다.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ftp::Timeout "20";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-e2e-acquire-timeout > /dev/null
          for attempt in 1 2; do
            if npx playwright install-deps chromium; then
              echo "시스템 의존성 설치 완료 (시도 ${attempt}/2)"
              exit 0
            fi
            echo "::warning::playwright install-deps chromium 실패 (시도 ${attempt}/2)"
            sleep 10
          done
          echo "::warning::시스템 의존성을 설치하지 못했다 — 폰트만 빠진 것이라면 이 스위트는 통과한다. chromium 이 기동하지 못하면 아래 Playwright 실행 스텝이 실패한다."
          exit 1

      # chromium 하나만 받는다. firefox·webkit 은 이 단계에서 재는 것(계약·CORS·헤더)에
      # 아무것도 더하지 않으면서 설치 시간만 세 배가 된다.
      # 이쪽은 **치명적**이다 — 브라우저가 없으면 잴 것이 없다.
      - name: Playwright 브라우저 설치 (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if npx playwright install chromium; then
              echo "chromium 설치 완료 (시도 ${attempt}/2)"
              exit 0
            fi
            echo "::warning::playwright install chromium 실패 (시도 ${attempt}/2)"
            sleep 10
          done
          echo "::error::chromium 을 받지 못했다 — CDN 장애이거나 캐시 키가 잘못됐다."
          exit 1

      # 비밀을 저장소에 적지 않는다. 이 실행에서만 사는 임의값이고, 붙는 DB 도 이 잡과
      # 함께 사라진다. 계약 `x-auth.min_secret_bytes` 가 32바이트를 요구한다.
      # **값을 찍지 않는다** — `$GITHUB_ENV` 로만 넘긴다.
      - name: JWT 서명 키 생성 (이 실행 한정 임의값)
        run: echo "EASYDOC_AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # 저장 암호화 키도 같은 원칙으로 **이 실행 한정 임의값**이다 (게이트 28 C-3).
      #
      # 없으면 어떻게 되는가: `CryptoConfiguration` 은 게이트 25 F-2·F-3 리더 판정으로
      # **하나라도 어긋나면 앱을 띄우지 않는다.** 이 스텝이 없던 두 회차에서 API 가 기동하지
      # 못해 `/health` 200 이 영영 오지 않았고, 잡은 60초 대기 뒤 죽었다
      # (run 32333596159·32309434868).
      #
      # 왜 `openssl` 한 줄이 아닌가: 자기점검은 키와 **검사값(KCV)** 을 함께 요구한다.
      # 키만 주면 "키 v1 에 kcv 가 없다"로 역시 기동이 거부된다. KCV 는 AES-256-GCM 인증
      # 태그라 `openssl enc` 로 계산할 수 없다 — 태그를 내주지 않는다.
      #
      # 왜 계산을 여기 적지 않는가: 적으면 KCV 계산이 저장소에 둘이 되고, 한쪽만 고쳐지는
      # 날 CI 는 조용히 초록인데 실제 배포는 뜨지 않는다. 그래서 **제품 코드를 실행한다** —
      # 태스크가 도는 `EncryptionKeyEnv.kt` 는 `TestEncryptionKeys` 를 부르고 그것이 제품
      # `KeyCheckValue.of` 로 검사값을 구한다. 계산하는 코드는 저장소에 한 곳뿐이다.
      #
      # **값을 찍지 않는다** — 태스크가 `$GITHUB_ENV` 에 직접 덧붙이고 표준출력에는 비밀이
      # 아닌 검사값만 낸다. 로그에 남은 키는 회수 말고는 되돌릴 방법이 없다.
      - name: 저장 암호화 키 생성 (이 실행 한정 임의값 — KCV 는 제품 KeyCheckValue 가 계산)
        working-directory: backend-kotlin
        run: ./gradlew --no-daemon -q :infrastructure:writeEncryptionKeyEnv "-Peasydoc.encryptionEnvOut=$GITHUB_ENV"

      - name: Flyway 마이그레이션 (profile=migrate)
        run: java -jar backend-kotlin/api/build/libs/easy-doc-api.jar --spring.profiles.active=migrate

      # 백그라운드 기동. 표준 출력·오류를 파일로 돌리고 표준 입력을 끊는다 —
      # 그러지 않으면 러너가 스텝 종료를 기다리며 매달린다.
      - name: Kotlin API 기동 + /health 대기
        run: |
          set -euo pipefail
          mkdir -p frontend/test-results
          nohup java -jar backend-kotlin/api/build/libs/easy-doc-api.jar \
            --spring.profiles.active=api \
            > frontend/test-results/kotlin-api.log 2>&1 < /dev/null &
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "${E2E_API_BASE_URL}/health"; then
              echo "Kotlin API 준비 완료 (${E2E_API_BASE_URL})"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kotlin API 가 60초 안에 /health 200 을 내지 않았다."
          cat frontend/test-results/kotlin-api.log
          exit 1

      # Vite dev 서버는 Playwright 의 `webServer` 가 띄운다 — 설정이 한 곳에 있어야
      # 로컬과 CI 가 같은 출처·같은 `VITE_API_BASE_URL` 로 돈다.
      - name: Playwright 실행 (12건)
        working-directory: frontend
        run: npx playwright test

      # 실패했을 때 볼 것이 남아야 한다. 추적에는 화면 스냅샷이 들어가지만 이 스위트의
      # 계정·작업 공간 이름은 전부 합성값이라(`e2e-<uuid>@example.test`) 개인정보가 없고,
      # 서버 로그는 문서 본문·개인정보를 애초에 남기지 않는다(프로젝트 보안 규칙).
      - name: 아티팩트 업로드 (보고서·추적·서버 로그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: warn

  # ── LLM 레인 (실제 API 호출 — 관련 변경일 때만 돈다) ──────────────────────
  #
  # 배경: `-m llm` 마커가 붙은 테스트는 실제 Anthropic/OpenAI API 를 호출한다.
  # 그런데 pyproject.toml 의 `addopts = "-m 'not llm'"` 때문에 기본 스위트에서 빠지고,
  # 그것을 돌리는 잡이 없어서 **CI 도달이 0** 이었다. 품질 합격선의 차단축 3개가
  # 전부 이 마커에 있는데 한 번도 안 돈 채 "합격선 확정" 이 보고된 적이 있다
  # (`kotlin-migration` 스킬 「선언한 범위와 실제 도달을 대조한다」 근거 6번).
  #
  # 그렇다고 매 커밋마다 돌리면 56건 골든 코퍼스를 통째로 변환하는 비용이 매번 나간다.
  # 그래서 **관련 변경일 때만** 돈다. 무엇이 '관련' 인지의 선언은
  # `.github/llm-lane-paths.txt` 한 곳뿐이고, 그 선언이 실제 도달보다 좁지 않은지는
  # `tests/test_llm_lane_scope.py` 가 매번 폐포를 다시 계산해 검사한다.
  #
  # 서드파티 액션(dorny/paths-filter 등)을 쓰지 않는다 — 공공기관 문서를 다루는
  # 저장소라 공급망을 늘리지 않는다. git 으로 직접 구한다.
  #
  # ## 조용한 초록을 만들지 않는다
  # 건너뛸 때 잡은 초록으로 끝나지만, 그 초록이 "레인이 통과했다" 로 읽히면 근거
  # 6번의 재발이다. 그래서 건너뛴 실행은 스텝 요약(job summary)과 로그에 **건너뛰었다는
  # 사실과 그 이유**를 반드시 남긴다.
  #
  # ## 이 잡이 막지 못하는 것
  # 필수 체크로 걸어도 조건 분기가 초록을 내므로, 이 잡의 성공은 "레인이 통과했다"가
  # 아니라 "레인이 필요했다면 통과했다" 이다. 실제로 무엇이 돌았는지는 요약을 읽어야 한다.
  #
  # ## 2026-08-21 이후: 자동 실행하지 않는다
  # push·pull_request 에서 이 잡이 하는 일은 **API 를 쓰지 않는 두 가지뿐**이다 —
  # ⑴ 경로 목록 완전성 검사(`--self-check`, 조건 없이 매번) ⑵ 변경 범위 «탐지».
  # 실제 `-m llm` 실행은 `workflow_dispatch` 로만 한다. 그래서 이 잡의 초록은 이제
  # "레인이 필요했다면 통과했다" 도 아니고 **"레인을 돌리지 않았다"** 이다 — 골든 경로를
  # 건드린 커밋에서는 요약이 그 사실을 경고로 남긴다. 사유는 「변경 범위 판정」 스텝 주석.
  llm-lane:
    runs-on: ubuntu-latest
    # 30분이었고, 그 값으로는 **이 레인이 CI에서 한 번도 완주하지 못했다.** 56문서를
    # 직렬로 변환하고(문서당 최대 2회 호출) 다시 최대 56회를 채점하는 작업의 실측
    # 소요가 35분 20초다(`docs/migration/_workspace/04_goldenset-first-run.md`).
    # 35분짜리에 30분 한도를 건 것이라 플래키가 아니라 구조였고, 방해받지 않은 실행은
    # 전부 정확히 ~30분에서 죽었다(`81ba9fa` 30m14s · `79447cd` 30m22s).
    #
    # ## 상한을 잡이 아니라 스텝에 건다 (2026-08-21)
    #
    # **잡 타임아웃은 잡을 «취소»한다.** 그래서 conclusion 이 `failure` 가 아니라
    # `cancelled` 가 되고, 더 나쁘게는 **뒤따르는 스텝이 통째로 skip 된다.**
    # 실측: run 32403598822 에서 한도에 걸리자 `실행 결과 요약` 스텝이 `skipped` 로
    # 끝났다 — 정작 무엇이 돌았는지 알아야 할 그때 요약이 사라졌다.
    #
    # 그래서 실제 상한은 아래 `-m llm 레인 실행` 스텝에 `timeout-minutes: 55` 로 건다.
    # 스텝 타임아웃은 그 «스텝»만 실패시키므로 ⑴ 잡 conclusion 이 `cancelled` 가 아니라
    # `failure` 가 되어 신호가 정직해지고 ⑵ 요약 스텝이 실제로 돈다.
    # 이 값(70분)은 그 스텝 상한을 감싸는 **바깥 안전망**이다 — 체크아웃·uv sync·요약이
    # 함께 매달리는 경우까지 흡수하되(55 + 여유 15), 매달린 잡을 무한정 붙들지는 않는다.
    # 두 값은 한 쌍이라 한쪽만 고치면 안 된다: 잡 상한이 스텝 상한보다 낮아지면
    # 위의 skip 사고가 그대로 되살아난다.
    #
    # **여유 15분의 근거는 실측이다.** 잡 시계는 checkout 부터 도는데, 선행 스텝
    # (`fetch-depth: 0` checkout · 범위 판정 · setup-uv · `uv sync --locked`)에는 개별
    # 상한이 없다. 그래서 "얼마나 걸리는가"를 재 봤다 — run 32403598822 에서 잡 시작
    # 18:30:49 → pytest collection 18:31:05 로 **총 16초**다. 15분은 그 56배이고,
    # 뒤따르는 요약 스텝은 `$GITHUB_STEP_SUMMARY` 에 몇 줄 쓰는 것이 전부다.
    # 개별 상한을 더 달지 않은 이유가 이것이다 — 16초짜리 구간에 상한 넷을 붙이면
    # 읽는 사람이 그 값들을 실제 위험으로 오해한다. **선행 스텝이 느려지면 이 계산이
    # 무너지므로, 여기를 고칠 때는 다시 재라.**
    #
    # 55분인 이유는 실측 35분 20초 대비 여유 56%다. 러너 성능 편차와 SDK 재시도를
    # 흡수한다 — 이 레인의 논리 호출 하나는 최악 **6분**이다(`ANTHROPIC_TIMEOUT_SECONDS`
    # 120초 × `max_retries=2` 이므로 최초 요청 포함 최대 3회, `app/llm/anthropic_provider.py`).
    # 공용 기본값 60초(`app/llm/provider.py`)가 아니다 — Anthropic 은 사고 토큰 때문에
    # 자기 상수를 따로 쓴다. 문서당 변환은 최대 2회 논리 호출이고 judge 가 1회 더 붙는다.
    #
    # 그래서 55분은 **최악 경계가 아니라 실측 + 여유**다. 최악으로 잡으면
    # 56문서 × 3호출 × 6분 = 1,008분이 되어 상한으로서 아무 의미가 없다. 느린 호출이
    # 겹쳐 55분을 넘기면 판정을 또 못 얻지만, 그때 얻는 것은 진행 로그가 가리키는
    # **어디서 느렸는가**이고 그것이 다음 상한값의 근거가 된다.
    # **이 값을 다시 줄이려면 먼저 실측을 갱신하라** — 위 35분 20초는 로컬 수치이고,
    # CI 실측은 이 변경이 처음으로 만들어 낸다.
    timeout-minutes: 70
    permissions:
      contents: read
    # 워크플로 전체가 아니라 이 잡에만 건다 — quality·frontend·kotlin 의 실행 정책을
    # 건드리지 않기 위해서다. 연속 푸시로 API 호출이 겹쳐 쌓이는 것만 막는다.
    concurrency:
      group: llm-lane-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # PR base 와 push 이전 커밋을 diff 하려면 히스토리가 필요하다.
          # 얕게 받으면 merge-base 를 못 찾아 조건 계산이 통째로 실패한다.
          fetch-depth: 0

      # 경로 목록의 완전성 검사. **조건 없이 매번 돈다** — 판정 규칙 자신은 조건부일
      # 수 없다. 여기서 실패하면 "목록이 레인의 실제 도달보다 좁다" 는 뜻이고,
      # 그 상태의 초록은 아무것도 보장하지 않는다.
      #
      # 이 스텝을 경로로 명시 호출하는 데는 또 다른 이유가 있다. 검사 파일 안에 적은
      # 자기 단언은 그 파일과 함께 사라지지만, 이 스텝은 모듈을 import 하므로
      # 파일을 지우면 `No module named tests.test_llm_lane_scope` 로 **잡이 깨진다**.
      # 장치 밖에서 깨지는 지점을 그렇게 만든다(스킬 규칙 5·6).
      #
      # uv 없이 러너의 맨 python3 로 돈다 — 이 모듈은 표준 라이브러리만 쓴다.
      - name: 경로 목록 완전성 검사 (조건 없이 매번 — API 안 씀)
        run: python3 -m tests.test_llm_lane_scope --self-check

      - name: 변경 범위 판정 (.github/llm-lane-paths.txt 대조)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FORCE_INPUT: ${{ github.event.inputs.run_llm_lane }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          changed="$work/changed.txt"
          reason=""
          force=no

          # 수동 실행은 언제나 강제. 조건 계산을 우회할 손잡이가 반드시 하나 있어야 한다.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_INPUT" != "false" ]; then
              force=yes
              reason="workflow_dispatch 수동 강제 실행"
            fi
          fi

          if [ "$force" = "no" ]; then
            base=""
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE"
            fi

            # 판정할 수 없는 상태(첫 푸시의 0-sha, 강제 푸시로 사라진 커밋 등)에서는
            # **건너뛰지 않고 돌린다.** '알 수 없음' 은 '무관' 이 아니다. 여기서 조용히
            # 건너뛰면 그것이 정확히 근거 6번의 형태(도달 0 인데 초록)가 된다.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              force=yes
              reason="비교 기준 커밋을 찾을 수 없다(base='${base:-없음}') — 알 수 없음은 무관이 아니므로 실행한다"
            else
              # --no-renames: 이름만 바꾼 변경도 양쪽 경로가 다 나오게 한다.
              # 한쪽만 나오면 레인 파일을 목록 밖으로 옮기는 변경이 안 걸린다.
              merge_base=$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")
              git diff --name-only --no-renames "$merge_base" HEAD > "$changed"
              echo "변경 파일 $(wc -l < "$changed" | tr -d '[:space:]')건 (기준 ${merge_base})"
            fi
          fi

          if [ "$force" = "yes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            {
              echo "### LLM 레인: **실행**"
              echo ""
              echo "사유: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 매칭 규칙은 CI 쪽에 복제하지 않는다 — 완전성 검사와 **같은 판정기**를 부른다.
          # 규칙이 두 곳에 있으면 그 복사본이 갈리고, 갈린 순간 검사는 CI 가 실제로
          # 쓰는 규칙이 아니라 자기 규칙을 검사하게 된다.
          matched="$work/matched.txt"
          python3 -m tests.test_llm_lane_scope --match "$changed" > "$matched"
          count=$(wc -l < "$matched" | tr -d '[:space:]')

          # ── 여기서 «탐지» 와 «실행» 이 갈린다 (2026-08-21 운영자 결정) ──────────
          #
          # 예전에는 골든 경로가 걸리면 곧바로 `run=true` 로 API 레인을 돌렸다. 이제
          # **자동 실행은 하지 않는다.** 실행은 `workflow_dispatch` 로만 한다(위 force 분기).
          #
          # 왜: 이 레인은 문서 56건을 변환하고 다시 채점하는 데 ~28분과 실과금이 든다.
          # 그런데 `.github/workflows/ci.yml` 자신이 위 목록에 들어 있어(규칙 6 — 판정
          # 장치는 자기를 대상에 넣는다) **CI 를 한 줄만 고쳐도** 그 비용이 딸려 왔다.
          # 게다가 이 게이트는 필수 정보 보존 축(허용치 0)이 구조적으로 실패해 **항상
          # 빨간색**이고, `main` 은 브랜치 보호가 없어 필수 체크도 아니다. 즉 자동 실행은
          # 돈을 쓰면서 아무것도 막지 못하고 있었고, 상시 빨간 체크는 읽히지 않는다.
          #
          # **탐지까지 끄지는 않는다.** 위 `--match` 는 API 를 쓰지 않는다. 걸린 경로를
          # 계속 계산해 «손으로 돌려라» 고 요약에 적는다 — 자동 실행을 끄는 것과 변경이
          # 골든 품질을 건드렸다는 사실을 감추는 것은 다르다. 조용해지면 그게 이 저장소가
          # 결함으로 보는 형태다.
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "touched=$count" >> "$GITHUB_OUTPUT"
            echo "reason=골든 경로 ${count}건 변경 — 자동 실행은 꺼져 있다(손으로 돌린다)" >> "$GITHUB_OUTPUT"
            echo "골든 경로에 걸린 변경 ${count}건 — 자동 실행하지 않는다:"
            cat "$matched"
            { sed 's/^/- `/; s/$/`/' "$matched"; } > "$work/matched.md"
            echo "matched_md<<EOF" >> "$GITHUB_OUTPUT"
            cat "$work/matched.md" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "touched=0" >> "$GITHUB_OUTPUT"
            echo "reason=골든 경로 무변경" >> "$GITHUB_OUTPUT"
          fi

      # 건너뛴 실행이 통과처럼 보이면 안 된다. 초록은 남지만 그 초록이 무엇을
      # 뜻하는지는 로그와 요약에 글자로 남긴다.
      - name: 건너뜀 사유 기록 (조용한 초록 방지)
        if: steps.scope.outputs.run != 'true'
        env:
          TOUCHED: ${{ steps.scope.outputs.touched }}
          MATCHED_MD: ${{ steps.scope.outputs.matched_md }}
        run: |
          set -euo pipefail
          # 두 경우를 **가른다.** 예전에는 한 문구뿐이라 "건드리지 않았다" 로만 적혔는데,
          # 자동 실행을 끈 지금은 «건드렸는데 안 돌린» 경우가 생긴다. 그 둘을 같은 문구로
          # 덮으면 골든 품질을 건드린 변경이 무변경 커밋과 구별되지 않는다.
          if [ "${TOUCHED:-0}" != "0" ]; then
            echo "::warning::이 커밋은 골든 경로 ${TOUCHED}건을 건드렸다. -m llm 레인은 **자동 실행하지 않는다** — 품질 영향을 보려면 손으로 돌려라."
            {
              echo "### LLM 레인: **미실행 — 손으로 돌려야 한다**"
              echo ""
              echo "이 커밋은 \`.github/llm-lane-paths.txt\` 에 걸린 변경 **${TOUCHED}건**을 담고 있다:"
              echo ""
              echo "$MATCHED_MD"
              echo ""
              echo "> **이 잡의 초록은 품질 판정이 아니다.** 골든 품질에 영향이 갈 수 있는"
              echo "> 변경인데 판정을 **하지 않았다**. 자동 실행은 비용(~28분·실과금) 대비"
              echo "> 차단력이 없어 껐다 — 필수 정보 보존 축이 구조적으로 실패해 상시"
              echo "> 빨간색이고, \`main\` 은 브랜치 보호가 없어 필수 체크도 아니다."
              echo ""
              echo "돌리는 법:"
              echo ""
              echo "- CI 에서: Actions → CI → **Run workflow** (\`run_llm_lane\` 기본 켜짐)"
              echo "- 로컬에서: \`GOLDEN_PROVIDER=anthropic LLM_MODEL=claude-sonnet-5 LLM_EFFORT=low uv run pytest tests/golden -m llm\`"
              echo "  (기준선 지문의 producer 와 같은 조건이어야 상대 하한선이 비교된다)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::이 커밋은 골든 경로를 건드리지 않았다. -m llm API 레인 미실행."
            {
              echo "### LLM 레인: **건너뜀 (골든 경로 무변경)**"
              echo ""
              echo "이 커밋은 \`.github/llm-lane-paths.txt\` 의 어떤 경로도 건드리지 않았다."
              echo "실제 API 호출은 **한 건도 하지 않았다.**"
              echo ""
              echo "> 이 초록은 품질 판정이 아니다 — 판정할 대상이 없었다는 기록이다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked
        if: steps.scope.outputs.run == 'true'

      # 실제 호출 지점. 키는 시크릿에서만 오고 **값을 찍지 않는다** — 로그에 키가
      # 남으면 회수 외에는 되돌릴 방법이 없다.
      #
      # GOLDEN_RECORD_BASELINE 은 **세우지 않는다.** 기준선 기록은 판정이 아니라
      # 기준 자체를 바꾸는 일이라 CI 가 할 일이 아니다. 세우면 CI 가 자기 합격선을
      # 매번 새로 써서 회귀가 영원히 안 잡힌다. 기준선 파일을 갱신하는 경로는
      # 사람이 로컬에서 돌려 diff 를 커밋하는 것 하나뿐이다.
      #
      # (`tests/golden/baseline.json` 이 "저장소에 없다"고 적혀 있던 자리다. 2026-08-12
      # 첫 실행 때는 조건이 비어 내렸으나 2026-08-13 에 조건을 채워 다시 기록됐고,
      # 지금은 추적 중이다. 낡은 서술이라 지운다 — 없다고 적힌 파일이 있으면 이 잡이
      # 무엇과 비교하는지를 읽는 사람이 잘못 안다.)
      - name: -m llm 레인 실행 (실제 API 호출)
        if: steps.scope.outputs.run == 'true'
        # **실제 상한은 여기다** (잡 레벨이 아니라). 잡 타임아웃은 잡을 취소해
        # 후속 스텝을 통째로 skip 시키지만(run 32403598822 에서 `실행 결과 요약` 이
        # 실제로 `skipped` 였다), 스텝 타임아웃은 이 스텝만 실패시킨다. 그래서
        # 잡 conclusion 이 `cancelled` 가 아니라 `failure` 로 남고 요약 스텝이 돈다.
        # 위 잡 레벨 `timeout-minutes: 70` 과 한 쌍이다 — 근거는 그쪽 주석에 있다.
        timeout-minutes: 55
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 스텝 출력을 `run:` 본문에 `${{ }}` 로 직접 끼워 넣지 않는다 — 그 자리는
          # 셸 소스로 치환돼 값이 곧 코드가 된다. env 로 넘기면 값으로만 남는다.
          LANE_REASON: ${{ steps.scope.outputs.reason }}
          # 기준선 지문의 producer 축과 **같은 조건으로 돌린다.**
          # `tests/golden/baseline.json` 의 producer 는
          # `provider=anthropic · model=claude-sonnet-5 · effort=low` 인데, 이 둘을 주지
          # 않으면 `Settings` 기본값이 둘 다 `None` 이라(`app/config.py`) 지문이 갈리고
          # **상대 하한선이 "비교 불가"로 떨어져 판정을 하지 않는다.** 그 상태의 초록은
          # "회귀가 없다"가 아니라 "회귀를 보지 않았다"는 뜻이다 — 이 저장소가 반복해서
          # 결함으로 지목해 온 '도달 0인데 초록' 형태다(CLAUDE.md 「범위 대조」).
          #
          # 값을 여기 박아 두는 것이 기준선을 CI 가 고쳐 쓰는 것과 다른 점: 이것은
          # **비교의 조건을 기준선에 맞추는 것**이지 합격선을 옮기는 것이 아니다.
          # 기준선을 다시 기록할 때 producer 가 바뀌면 이 두 줄도 함께 갱신해야 한다 —
          # 어긋나면 게이트가 조용해지는 것이 아니라 '비교 불가'로 시끄러워진다.
          LLM_MODEL: claude-sonnet-5
          LLM_EFFORT: low
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 비어 있다 — 자격 증명 없는 실행은 0건 측정이고 0건은 통과가 아니다."
            exit 1
          fi
          # 키 값 자체는 절대 찍지 않는다. 길이조차 찍지 않는다 — 회수 말고는 되돌릴 방법이 없다.
          echo "레인 실행 사유: $LANE_REASON"
          # `--log-cli-level=INFO` 가 붙은 이유는 취향이 아니라 **사고 재발 방지**다.
          # 이 레인이 죽는 방식은 테스트 실패가 아니라 **타임아웃 kill** 이라, pytest 의
          # 기본 캡처(=실패한 테스트에만 재생)로는 재생이 아예 일어나지 않는다. 실제로
          # 30분을 출력 0줄로 죽어서 어디서 매달렸는지를 로그에서 알 수 없었다.
          # 이 플래그가 없으면 `log_progress`(`tests/golden/test_golden_eval.py`) 가 찍는
          # 진행 줄이 그대로 사라진다 — 두 장치는 **한 쌍이고 한쪽만 있으면 둘 다 무의미하다.**
          #
          # ## 왜 `-s` 가 아닌가 (2026-08-21 실측으로 교체)
          #
          # 처음엔 `-s`(캡처 끄기) + `print` 였다. 근거는 "캡처를 켜면 진행 줄이 버퍼에
          # 갇혀 kill 때 사라진다" 였는데 **그 전제가 틀렸다.** CI 는 stdout 이 tty 가
          # 아니므로, 비-tty 리다이렉트(`> out.txt 2>&1`) 상태로 `kill -9` 한 뒤 파일에
          # 남은 진행 줄을 셌다(같은 탐침 2회):
          #
          #   (A) `--log-cli-level=INFO` (캡처 유지) → **8줄 / 9줄** 생존
          #   (B) `-s`                   (캡처 끔)   →   9줄 / 8줄 생존
          #
          # **둘 다 살아남는다.** live log 는 pytest 가 레코드마다 스트림을 명시적으로
          # flush 해서 블록 버퍼링을 타지 않는다(남은 8줄은 약 440바이트로 4KB 블록
          # 경계에 한참 못 미치는데도 파일에 있었다).
          #
          # 생존이 안 갈리므로 판정은 부수효과로 넘어간다. `-s` 는 캡처를 통째로 꺼서
          # 실패 리포트의 `Captured stdout/stderr` 섹션을 없앤다. 이 레인은 필수 정보
          # 보존 축의 허용치가 **0** 이라 빨간색으로 끝날 공산이 크고, 그때 가장 필요한
          # 것이 그 섹션이다. 즉 `-s` 는 진행 로그를 얻는 대가로 실패 진단을 버리는
          # 거래인데, 실측이 그 대가를 **치를 필요가 없다**고 말한다.
          #
          # 이 플래그는 무엇을 테스트하는지 바꾸지 않는다(선택·판정에 관여하지 않고
          # 출력만 늘린다). 그래서 로컬 명령과 갈려도 사각지대가 생기지 않는다.
          uv run pytest -m llm --log-cli-level=INFO

      - name: 실행 결과 요약
        # `!cancelled()` 가 붙은 이유: 기본 조건은 «앞 스텝이 성공했을 때만» 이라
        # 레인이 빨갛게 끝나면 요약이 통째로 사라진다. 그리고 잡이 취소되면
        # (잡 타임아웃·concurrency 선점) 조건과 무관하게 스텝이 skip 된다 —
        # run 32403598822 에서 실제로 이 스텝이 `skipped` 였다.
        # `!cancelled()` 는 **실패했어도 돈다**로 바꾸되 진짜 취소일 때는 비켜선다.
        # `always()` 를 쓰지 않는 이유: 취소 뒤에도 스텝을 붙들어 잡 중단이 늦어진다.
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          LANE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "레인 실행 사유: $LANE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
