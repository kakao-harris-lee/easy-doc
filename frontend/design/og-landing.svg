<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EASY-DOC AI — 어려운 글을 누구나 읽기 쉬운 글로">
  <title>EASY-DOC AI — 어려운 글을 누구나 읽기 쉬운 글로</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2F9"/>
    </linearGradient>
    <filter id="cardShadow" x="640" y="40" width="580" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0E2A4D" flood-opacity="0.12"/>
    </filter>
    <style>
      .ko { font-family: "Noto Sans CJK KR", "Noto Sans KR", "NanumSquare", sans-serif; }
      .title { font-size: 48px; font-weight: 700; letter-spacing: -1px; }
      .sitename { font-size: 26px; font-weight: 700; letter-spacing: 3px; }
      .lead { font-size: 25px; font-weight: 400; }
      .label { font-size: 24px; font-weight: 700; }
      .url { font-size: 24px; font-weight: 400; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F7F9FC"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="150" r="150" fill="#E3EEFA" opacity="0.85"/>
  <circle cx="1046" cy="604" r="118" fill="#FFF4CF" opacity="0.75"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1764B5"/>
  <rect x="0" y="0" width="208" height="10" fill="#C58B1A"/>

  <!-- brand row -->
  <image x="84" y="92" width="56" height="56" xlink:href="data:image/png;base64,"/>
  <text class="ko sitename" x="154" y="130" fill="#1764B5">EASY-DOC AI</text>

  <!-- headline -->
  <text class="ko title" x="84" y="272" fill="#172033">어려운 글을</text>
  <text class="ko title" x="84" y="362" fill="#1764B5">누구나 읽기 쉬운 글로</text>

  <!-- lead -->
  <text class="ko lead" x="84" y="432" fill="#4B5870">짧은 문장과 쉬운 표현으로 다시 씁니다.</text>
  <text class="ko lead" x="84" y="474" fill="#4B5870">내가 읽을 때도, 다른 사람에게 전할 때도.</text>

  <text class="ko url" x="84" y="544" fill="#7A8699">easydoc.kr</text>

  <!-- document card -->
  <g filter="url(#cardShadow)">
    <rect x="740" y="118" width="376" height="408" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="740.5" y="118.5" width="375" height="407" rx="27.5" fill="none" stroke="#E2E9F2"/>

  <text class="ko label" x="776" y="176" fill="#8A95A6">원문</text>
  <rect x="776" y="196" width="304" height="9" rx="4.5" fill="#DCE3EC"/>
  <rect x="776" y="214" width="272" height="9" rx="4.5" fill="#DCE3EC"/>
  <rect x="776" y="232" width="296" height="9" rx="4.5" fill="#DCE3EC"/>
  <rect x="776" y="250" width="238" height="9" rx="4.5" fill="#DCE3EC"/>

  <path d="M776 294H1080" stroke="#E6EBF2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="928" cy="294" r="30" fill="#1764B5" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M928 281V306M917 296L928 307L939 296" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="ko label" x="776" y="354" fill="#1764B5">쉬운 글 초안</text>

  <rect x="776" y="372" width="304" height="54" rx="15" fill="#E7F2FC"/>
  <circle cx="804" cy="399" r="11" fill="#1764B5"/>
  <path d="M799 399L803 403L810 395" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="830" y="390" width="180" height="10" rx="5" fill="#1764B5" opacity="0.45"/>
  <rect x="830" y="408" width="128" height="8" rx="4" fill="#1764B5" opacity="0.22"/>

  <rect x="776" y="436" width="304" height="54" rx="15" fill="#EEF3F9"/>
  <circle cx="804" cy="463" r="11" fill="#1764B5"/>
  <path d="M799 463L803 467L810 459" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="830" y="454" width="156" height="10" rx="5" fill="#1764B5" opacity="0.45"/>
  <rect x="830" y="472" width="104" height="8" rx="4" fill="#1764B5" opacity="0.22"/>

  <!-- brand sparkles -->
  <path d="M1096 116L1103.2 136.8L1124 144L1103.2 151.2L1096 172L1088.8 151.2L1068 144L1088.8 136.8L1096 116Z" fill="#C58B1A"/>
  <path d="M1122 158L1125.4 166.6L1134 170L1125.4 173.4L1122 182L1118.6 173.4L1110 170L1118.6 166.6L1122 158Z" fill="#E9B44C"/>
</svg>
