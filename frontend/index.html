<!doctype html>
<!-- lang="ko": 화면 낭독기가 한국어로 읽도록 하는 KWCAG 기본 요건 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 아이콘 원본은 public/icons/icon-320.png(320x320)이고 나머지는 전부
         거기서 뽑았다. favicon.ico는 링크가 없어도 브라우저·크롤러가 관례적으로
         /favicon.ico를 요청하므로 16·32·48 세 장을 담아 둔다. apple-touch-icon만
         흰 배경으로 합성한 이유는 iOS가 투명을 검게 칠하기 때문이다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f6b63" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EASY-DOC AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
