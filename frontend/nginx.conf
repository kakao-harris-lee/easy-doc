# 일회용 결제 자격 증명이 query string에 있으므로 URI와 Referer를 기록하지 않는다.
log_format private_uri '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log private_uri;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 애플리케이션과 같은 업로드 상한을 프록시에서도 강제한다.
    client_max_body_size 10m;

    # proxy_pass 끝의 슬래시가 /api/ 접두사를 제거한다.
    location /api/ {
        proxy_pass http://backend-api:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 해시 기반 번들은 장기 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html은 새 번들 이름을 가리키므로 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # `/landing.html` 직접 접근은 `/`의 중복 주소라 301로 합친다. noindex+canonical
    # 조합은 구글이 canonical 대상까지 noindex로 볼 수 있어 쓰지 않는다.
    # 아래 `location = /`의 try_files는 디스크의 파일을 보므로 이 301이 끼어들지 않는다.
    location = /landing.html {
        # 절대 주소로 바꾸면 컨테이너가 보는 scheme(http)로 내려가 TLS 앞단에서
        # https → http → https 체인이 된다. 상대 Location을 그대로 보낸다.
        absolute_redirect off;
        return 301 /;
    }

    # `/`만 검색 엔진 색인 대상이라 빌드 때 프리렌더한 본문을 응답한다.
    # 그 외 경로는 아래 SPA 셸(index.html)로 간다.
    # 프리렌더 산출물이 없으면 색인되지 않는 셸로라도 홈을 서빙한다(홈 404보다 낫다).
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /landing.html /index.html =404;
    }

    # SPA 경로의 직접 진입도 클라이언트 라우터로 보낸다.
    location / {
        try_files $uri /index.html;
    }
}
