# 일회용 결제 자격 증명이 query string에 있으므로 URI와 Referer를 기록하지 않는다.
log_format private_uri '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log private_uri;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 애플리케이션과 같은 업로드 상한을 프록시에서도 강제한다.
    client_max_body_size 10m;

    # proxy_pass 끝의 슬래시가 /api/ 접두사를 제거한다.
    location /api/ {
        proxy_pass http://backend-api:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 해시 기반 번들은 장기 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html은 새 번들 이름을 가리키므로 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # SPA 경로의 직접 진입도 클라이언트 라우터로 보낸다.
    location / {
        try_files $uri /index.html;
    }
}
