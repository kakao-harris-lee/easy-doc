# 파일럿 데모용 정적 서빙 + /api 프록시. 운영 배포용 정의가 아니다(TLS·접근 제어 없음).
# 브라우저는 이 서버 한 곳만 보고, API 호출도 같은 출처(/api)로 나간다 —
# 그래서 데모 경로에서는 백엔드 CORS 설정에 기대지 않는다(dev 서버 경로와 다른 점).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 업로드 상한(앱 10MB)과 같은 값을 프록시에도 건다 — 거대한 본문이 api까지
    # 도달해 메모리를 먹기 전에 여기서 끊는다(README '배포 주의'의 프록시 항목).
    client_max_body_size 10m;

    # /api/documents -> http://backend-api:8100/documents.
    # proxy_pass 끝의 슬래시가 location 접두(/api/)를 잘라낸다 — 백엔드 경로를
    # 바꾸지 않고 프론트만 같은 출처로 말하게 하는 부분이다.
    location /api/ {
        proxy_pass http://backend-api:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 변환은 워커가 비동기로 하지만 업로드(파일 추출)·내보내기는 동기 응답이라
        # 기본 60초보다 여유를 둔다.
        proxy_read_timeout 120s;
    }

    # 해시가 이름에 박힌 번들이다 — 내용이 바뀌면 파일명이 바뀌므로 길게 캐시해도
    # 낡은 자산을 잡고 있을 위험이 없다. expires 대신 add_header 하나만 쓴다
    # (둘을 같이 쓰면 Cache-Control이 두 줄로 나간다).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html만은 캐시하지 않는다. 이 파일이 낡으면 브라우저가 이미 사라진 자산
    # 이름을 계속 요청해, 재배포해도 화면이 그대로인 상태가 된다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 루트를 따로 잡는 이유: index 지시나 try_files $uri/ 로 들어가면 위의
    # = /index.html 블록을 거치지 않아 no-cache가 조용히 빠진다.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # SPA: /history 같은 경로는 서버에 파일이 없다 — index.html을 돌려주고
    # 라우팅은 클라이언트가 한다. 새로고침·직접 진입에서 404가 나지 않게 하는 부분.
    location / {
        try_files $uri /index.html;
    }
}
