# /etc/nginx/sites-available/easydoc_kr
# 인증서 경로는 이 서버에 설치된 GoGetSSL 인증서를 기준으로 한다.

# These directives are included in nginx's http context. The outer proxy sees the
# real TCP client; inner proxies must not combine all billing returns into one quota.
map $uri $easydoc_billing_callback_ip {
    default "";
    /api/payments/toss/billing/callback $binary_remote_addr;
}
limit_req_zone $easydoc_billing_callback_ip zone=easydoc_billing_callback:1m rate=30r/m;

server {
    listen 80;
    server_name easydoc.kr www.easydoc.kr;
    # 리다이렉트가 `$request_uri`(OAuth·결제 콜백 query string)를 그대로 싣는다 — 기록하지 않는다.
    access_log off;
    return 301 https://easydoc.kr$request_uri;
}

# apex 블록을 먼저 둔다 — 443의 기본 server가 되어 Host 헤더가 없거나 모르는 이름일 때도
# 정본 호스트로 응답한다. 검색 엔진에는 정본 호스트를 하나만 보여 준다.
server {
    listen 443 ssl;
    server_name easydoc.kr;

    ssl_certificate /etc/gogetssl/easydoc.kr_2026082445173.all.crt.pem;
    ssl_certificate_key /etc/gogetssl/easydoc.kr_2026082445173.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # OAuth·결제 콜백의 query string을 호스트 nginx 로그에 남기지 않는다.
    # 내부 frontend nginx가 query string을 제외한 method·path·status를 기록한다.
    access_log off;
    client_max_body_size 10m;
    limit_req zone=easydoc_billing_callback burst=10 nodelay;
    limit_req_status 429;
    # Rate-limit diagnostics include the full request URI. Keep them below the
    # explicit error-log threshold so billing credentials are never logged.
    limit_req_log_level notice;
    error_log /var/log/nginx/error.log error;

    # Upstream failures also include the original URI in nginx diagnostics.
    # Keep every callback diagnostic out of host logs; the inner proxy records
    # query-free status/path metadata for operational monitoring.
    location = /api/payments/toss/billing/callback {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# www는 apex로 301 보내기만 한다.
server {
    listen 443 ssl;
    server_name www.easydoc.kr;

    ssl_certificate /etc/gogetssl/easydoc.kr_2026082445173.all.crt.pem;
    ssl_certificate_key /etc/gogetssl/easydoc.kr_2026082445173.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 리다이렉트가 `$request_uri`(OAuth·결제 콜백 query string)를 그대로 싣는다 — 기록하지 않는다.
    access_log off;

    return 301 https://easydoc.kr$request_uri;
}
