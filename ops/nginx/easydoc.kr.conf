# /etc/nginx/sites-available/easydoc_kr
# 인증서 경로는 이 서버에 설치된 GoGetSSL 인증서를 기준으로 한다.

server {
    listen 80;
    server_name easydoc.kr www.easydoc.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name easydoc.kr www.easydoc.kr;

    ssl_certificate /etc/gogetssl/easydoc.kr_2026082445173.all.crt.pem;
    ssl_certificate_key /etc/gogetssl/easydoc.kr_2026082445173.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # OAuth·결제 콜백의 query string을 호스트 nginx 로그에 남기지 않는다.
    # 내부 frontend nginx가 query string을 제외한 method·path·status를 기록한다.
    access_log off;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
