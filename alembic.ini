# alembic 설정. 실행: uv run alembic upgrade head
#
# 접속 URL(sqlalchemy.url)은 여기에 두지 않는다 — migrations/env.py가
# app.config.Settings(환경변수 DATABASE_URL)에서 읽는다. 비밀 정보 커밋 방지.

[alembic]
# 마이그레이션 스크립트 위치 (%(here)s = 이 ini 파일이 있는 디렉터리)
script_location = %(here)s/migrations

# env.py가 app 패키지를 import 할 수 있도록 프로젝트 루트를 sys.path에 추가
prepend_sys_path = .

# version_locations 등 경로 목록의 구분자로 os.pathsep을 사용
path_separator = os


# 새로 생성된 리비전 스크립트를 ruff로 정리한다.
# alembic 템플릿 출력은 홑따옴표·후행 공백을 남기므로, 이 훅이 없으면
# 생성 직후의 마이그레이션 파일이 CI의 ruff 게이트에서 걸린다.
[post_write_hooks]
hooks = ruff_check,ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# 로깅 설정 (env.py의 fileConfig가 사용)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
