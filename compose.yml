# Kotlin 백엔드와 React 프런트엔드를 함께 보는 로컬·파일럿 스택.
# 사용법: docker compose up -d --build  (마이그레이션까지 자동으로 적용된다)
#
# 인프라만 띄우고 앱은 호스트에서 돌리려면: docker compose up -d postgres

name: easy-doc

# Kotlin 백엔드 세 프로세스가 같은 산출물을 공유하고 Spring profile로만 갈린다.
x-backend-app: &backend-app
  build:
    context: ./backend-kotlin
    dockerfile: Dockerfile
    target: runtime
  image: ${BACKEND_IMAGE:-easy-doc-backend:local}
  # 비밀키는 .env에서만 온다 — compose 파일에는 값을 적지 않는다.
  env_file: .env
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easydoc
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

services:
  # PostgreSQL + pgvector. 벡터 컬럼은 아직 없지만, 사전 RAG 도입 시
  # DB 교체 없이 확장하려고 처음부터 pgvector 이미지를 쓴다.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: easydoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 127.0.0.1 바인딩: 개발용 DB가 외부 네트워크에 노출되지 않게 한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # DB 준비 완료 후에만 마이그레이션·앱이 붙도록 한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d easydoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 파일럿 데모 화면. 브라우저는 여기 한 곳만 보고, /api 호출은 nginx가 backend-api로 넘긴다 —
  # 동일 출처라 데모 경로에서는 CORS 설정이 관여하지 않는다(dev 서버 경로와 다른 점).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    image: ${FRONTEND_IMAGE:-easy-doc-frontend:local}
    ports:
      # 127.0.0.1 바인딩: 파일럿 화면이 외부 네트워크에 그대로 열리지 않게 한다.
      - "127.0.0.1:8080:80"
    depends_on:
      # nginx는 기동할 때 upstream 호스트명을 한 번 풀어 본다 — backend-api가 아직 없으면
      # 설정을 읽다가 죽는다. healthcheck 통과를 기다렸다가 뜬다.
      backend-api:
        condition: service_healthy

  # --- Kotlin 백엔드 ---
  backend-migrate:
    <<: *backend-app
    command:
      ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    # 정상 종료(코드 0)를 완료 신호로 쓰므로 재시작 정책을 걸지 않는다.
    restart: "no"

  backend-api:
    <<: *backend-app
    command: ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=api"]
    ports:
      # 계약상 API가 쓰는 포트.
      - "127.0.0.1:8100:8100"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      # 계약상 /health 는 인증 없이 200 {"status":"ok"} 를 돌려준다.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 변환 워커. Phase 5에서 lease 기반 작업 큐가 붙기 전까지는 기동만 한다.
  backend-worker:
    <<: *backend-app
    command:
      ["java", "-jar", "/app/easy-doc-worker.jar", "--spring.profiles.active=worker"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
