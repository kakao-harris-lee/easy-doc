# Playwright E2E 전용 override — 유료 LLM 없이 worker 변환을 끝낸다.
#
# `EASYDOC_LLM_PROVIDER=fake` 는 **api·worker 에만** 넣는다.
#
# `backend-api` 의 `command` 는 `compose.yml` 의 `--spring.profiles.active=api,local` 에
# `e2e` 를 얹어 덮어쓴다 — `E2eMailInboxController`(`/__e2e/mail/latest`)가 이 profile
# 에서만 조립되고, Playwright 스위트가 그 진단 엔드포인트로 가입 직후 보낸 인증 코드
# 메일을 읽는다. `api`/`local`/prod 배포는 이 profile 을 켜지 않으므로 그 엔드포인트가
# 없다(`E2eMailInboxControllerProfileTest`).
#
# `EASYDOC_DICTIONARY_LOOKUP_ENABLED=true` 는 `backend-api`에만 얹는다(P0-5 조각 6) —
# `DictionaryLookupProperties.enabled` 기본값이 꺼짐이라 그대로 두면 `POST
# /dictionary/lookup`이 422로 막혀 `dictionary-lookup.spec.ts`가 통과할 수 없다. 값 자체는
# `application.yml` 기본값을 바꾸지 않고 이 override 로만 켠다.

services:
  backend-api:
    command: ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=api,local,e2e"]
    environment:
      EASYDOC_LLM_PROVIDER: fake
      EASYDOC_DICTIONARY_LOOKUP_ENABLED: "true"

  backend-worker:
    environment:
      EASYDOC_LLM_PROVIDER: fake
