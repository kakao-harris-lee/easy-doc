# Playwright E2E 전용 override. LLM·메일은 fake를 사용해 외부 호출을 막는다.
# e2e profile은 인증 코드를 읽는 진단 엔드포인트를 노출하므로 운영에서 켜지 않는다.
#
# 선택 기능은 이 스택에서만 켠다. 행동 안내·그림 제안 worker는 fake profile을 쓴다.
# 그림 제안 단가 0은 이용량 거래 없이 분석을 허용한다. 미설정 시에는 503이다.
#
# 기본 스펙은 크레딧 집행 꺼짐을 전제로 한다. 집행 경계는 compose.e2e-enforced.yml로 검증한다.
# 가입 부여가 양수이면 pepper가 필수이므로 이 스택 전용 값을 지정한다.

services:
  backend-api:
    command:
      [
        "java",
        "-jar",
        "/app/easy-doc-api.jar",
        "--spring.profiles.active=api,local,e2e",
      ]
    environment:
      EASYDOC_LLM_PROVIDER: fake
      EASYDOC_MAIL_PROVIDER: fake
      EASYDOC_DICTIONARY_LOOKUP_ENABLED: "true"
      EASYDOC_REVIEW_SUPPORT_ENABLED: "true"
      EASYDOC_ACTION_GUIDE_ENABLED: "true"
      EASYDOC_ACTION_GUIDE_ANALYSIS_ENABLED: "true"
      EASYDOC_TABLE_RELATIONS_ENABLED: "true"
      EASYDOC_REVIEW_HISTORY_ENABLED: "true"
      EASYDOC_EXPLANATIONS_ENABLED: "true"
      EASYDOC_ILLUSTRATIONS_ENABLED: "true"
      EASYDOC_ILLUSTRATION_SUGGESTIONS_ENABLED: "true"
      EASYDOC_ILLUSTRATION_SUGGESTIONS_CREDITS_PER_100_CHARS: "0"
      EASYDOC_CREDITS_ENFORCED: "false"
      EASYDOC_CREDITS_SIGNUP_GRANT: "1000"
      EASYDOC_CREDITS_SIGNUP_GRANT_PEPPER: "e2e-only-pepper-not-a-secret"

  backend-worker:
    command:
      [
        "java",
        "-jar",
        "/app/easy-doc-worker.jar",
        "--spring.profiles.active=worker,local,action-guide-fake,illustration-suggestion-fake",
      ]
    environment:
      EASYDOC_LLM_PROVIDER: fake
      EASYDOC_MAIL_PROVIDER: fake
      EASYDOC_ACTION_GUIDE_ENABLED: "true"
      EASYDOC_ACTION_GUIDE_WORKER_ENABLED: "true"
      EASYDOC_ACTION_GUIDE_ANALYSIS_ENABLED: "true"
      EASYDOC_ILLUSTRATION_SUGGESTIONS_ENABLED: "true"
      EASYDOC_ILLUSTRATION_SUGGESTIONS_WORKER_ENABLED: "true"
      EASYDOC_ILLUSTRATION_SUGGESTIONS_CREDITS_PER_100_CHARS: "0"
