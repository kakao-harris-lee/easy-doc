# compose.yml + compose.e2e.yml 위에 추가하는 크레딧 집행 검증용 override.
# 기본 스펙은 집행 꺼짐을 전제로 하므로 playwright.enforced.config.ts로만 실행한다.
# 가입 부여 1크레딧과 stub 결제의 Start 월 50크레딧 소진 경계를 검증한다.

services:
  backend-api:
    environment:
      EASYDOC_CREDITS_ENFORCED: "true"
      EASYDOC_CREDITS_SIGNUP_GRANT: "1"
      EASYDOC_PAYMENT_PROVIDER: stub
      EASYDOC_PAYMENT_MOCK_ENABLED: "true"
