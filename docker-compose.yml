# 로컬 개발·파일럿용 스택. 운영 배포용 정의가 아니다.
# 사용법: docker compose up -d --build  (마이그레이션까지 자동으로 적용된다)
#
# 인프라만 띄우고 앱은 호스트에서 돌리려면: docker compose up -d postgres

# Kotlin 런타임 세 서비스가 공유하는 정의. 같은 이미지를 쓰고 command(profile)로만 갈린다
# (계획 §3.2).
x-kotlin-app: &kotlin-app
  build:
    context: ./backend-kotlin
    dockerfile: Dockerfile
  image: easy-doc-kotlin:local
  # 비밀키는 .env에서만 온다 — compose 파일에는 값을 적지 않는다.
  env_file: .env
  environment:
    # Kotlin 전용 데이터베이스. Alembic(Python)이 관리하는 easydoc 과 갈라 둔다
    # (계획 §4.2-6: 한 환경에서 Alembic과 Flyway를 함께 실행하지 않는다).
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easydoc_kotlin
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

services:
  # PostgreSQL + pgvector. 벡터 컬럼은 아직 없지만, 사전 RAG 도입 시
  # DB 교체 없이 확장하려고 처음부터 pgvector 이미지를 쓴다.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: easydoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 127.0.0.1 바인딩: 개발용 DB가 외부 네트워크에 노출되지 않게 한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Kotlin 런타임용 easydoc_kotlin 데이터베이스를 만든다.
      # initdb 스크립트는 데이터 디렉터리가 빌 때만 돈다 — 기존 볼륨이 있으면
      # docker/postgres-init/10-kotlin-database.sql 주석의 수동 절차를 따른다.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # DB 준비 완료 후에만 마이그레이션·앱이 붙도록 한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d easydoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 파일럿 데모 화면. 브라우저는 여기 한 곳만 보고, /api 호출은 nginx가 kotlin-api로 넘긴다 —
  # 동일 출처라 데모 경로에서는 CORS 설정이 관여하지 않는다(dev 서버 경로와 다른 점).
  frontend:
    build:
      # 컨텍스트가 리포 루트다 — 백엔드와 .dockerignore를 공유한다.
      context: .
      dockerfile: Dockerfile.frontend
    image: easy-doc-frontend:local
    ports:
      # 127.0.0.1 바인딩: 파일럿 화면이 외부 네트워크에 그대로 열리지 않게 한다.
      - "127.0.0.1:8080:80"
    depends_on:
      # nginx는 기동할 때 upstream 호스트명을 한 번 풀어 본다 — kotlin-api가 아직 없으면
      # 설정을 읽다가 죽는다. healthcheck 통과를 기다렸다가 뜬다.
      kotlin-api:
        condition: service_healthy

  # --- Kotlin 런타임 ---
  kotlin-migrate:
    <<: *kotlin-app
    command:
      ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    # 정상 종료(코드 0)를 완료 신호로 쓰므로 재시작 정책을 걸지 않는다.
    restart: "no"

  kotlin-api:
    <<: *kotlin-app
    command: ["java", "-jar", "/app/easy-doc-api.jar", "--spring.profiles.active=api"]
    ports:
      # 계약상 API가 쓰는 포트.
      - "127.0.0.1:8100:8100"
    depends_on:
      kotlin-migrate:
        condition: service_completed_successfully
    healthcheck:
      # 계약상 /health 는 인증 없이 200 {"status":"ok"} 를 돌려준다.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 변환 워커. Phase 5에서 lease 기반 작업 큐가 붙기 전까지는 기동만 한다.
  kotlin-worker:
    <<: *kotlin-app
    command:
      ["java", "-jar", "/app/easy-doc-worker.jar", "--spring.profiles.active=worker"]
    depends_on:
      kotlin-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
