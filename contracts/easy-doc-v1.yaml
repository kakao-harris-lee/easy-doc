  - version: "1.1.0"
    date: "2026-08-12"
    author: contract-keeper
    change: |
      **계약의 성격 개정 — 동결물에서 개선 대상으로.** 아울러 그 새 기준으로 기존
      개선 후보를 전수 재분류하고, 명백한 오기 2건과 정책 변경 1건을 반영했다.

      성격 변경:
        - 최상위 `x-change-policy` 신설 — 변경 근거 G1~G4, 못 바꾸는 불변식,
          리더 에스컬레이션 대상, 절차, parity와의 관계.
        - 파일 머리말·`info.x-baselined-at`(옛 `x-frozen-at`)·`x-source-runtime` —
          "Python 동작 = 계약"이라는 등식을 걷어냈다.
        - `x-v2-candidates` → `x-improvements`. 보류함이 아니라 판정 원장이다.
          ID(V2-N)는 기존 리뷰·문서의 인용을 살리려 그대로 뒀다.

      조항 변경:
        - `MaskedItemResponse` — 마스킹 범주 **2종**(주민등록번호·카드번호) enum 고정,
          `placeholder`·`missing_placeholders` pattern 추가, 허구 예시 `"phone"` 제거.
          (V2-5 · V2-6)
        - `DocumentListItem.source_format` — `[text, docx, pdf, hwpx]` enum 고정. (V2-7)
        - `GET /health` · `HealthResponse` — 의존 서비스 진단으로 개정. `status`는
          `ok|degraded`, `checks`(이름→불리언) 추가. degraded여도 200. (V2-1)
        - `x-private-response-headers` — 범위 규칙을 명시하고, 전역 부착 재심(OQ-1)을
          미결로 기록. **범위 자체는 현행 10곳 그대로다.**
        - `info.description` 인증 우선순위 절 — 근거를 "Python이 그렇다"에서
          "인증되지 않은 호출자에게 검증 의미론을 노출하지 않는다"로 다시 썼다.
    basis: |
      2026-08-12 사용자 결정 — ① Python은 회귀가 잦은 구현이지 기준이 아니며 출력을
      Python과 맞출 필요가 없다, ② API 계약도 개선 대상이고 명백히 잘못된 계약은 고치고
      React도 맞춰 고친다, ③ 마스킹은 주민등록번호·카드번호 2종만 유지한다.
      **`info.version`을 1.1.0으로 올린다** — `source_format`·`category`·`HealthResponse`가
      와이어 스키마 변경이라 React 생성 타입이 달라진다(모두 비파괴: enum 축소는
      응답 필드라 소비자에게 안전하고, `checks`는 필드 추가다).
      영향받는 검증: contract test에 ① `/health` `status`↔`checks` 일관성,
      ② `category` 2종 밖 값 부재, ③ `source_format` enum 밖 값 부재를 추가한다.
      React 영향(고치지 않고 기록): `frontend/src/test/factories.ts`,
      `frontend/src/components/ReviewEditor.test.tsx`의 마스킹 픽스처가 사라진 범주를 쓴다.
      통보 대상: kotlin-implementer, parity-verifier, privacy-gate(마스킹 범위 축소),
      리더(OQ-1 재심).
      재분류 전문: `docs/migration/_workspace/02_contract-rebase.md`

  - version: "1.1.0"
    revision: "OQ-1"
    date: "2026-08-12"
    author: contract-keeper
    change: |
      **사적 응답 헤더의 전역 부착 — OQ-1 종결.** `Cache-Control: no-store` +
      `X-Content-Type-Options: nosniff`를 **Kotlin 런타임의 모든 응답**에 필터로 붙인다.

        - `x-global-response-headers` **신설** — 요구의 정본. 근거 G4, 강제 수단(필터 배치 +
          `set` 사용), 실패 양상 전환, OpenAPI 표현 한계, Python 이탈, Phase 3 실측 항목.
        - `x-private-response-headers` — **범위에서 하한선으로 성격 변경.** 10곳 목록과
          `paths` 아래 헤더 선언 10건은 **그대로 둔다**(필터가 무너져도 고위험 경로에서
          먼저 깨지게 하는 장치). `does_not_apply_to` 목록은 무효화하고 Python 동작 기술로 이관.
          `x-open-question` → `x-resolved-question`(정정된 전제 포함).
        - `info.description` — "응답 헤더 — 전역 요구" 절 추가. 10건 선언을 범위로 읽지
          말라는 경고와 Python 이탈 명시.
        - `x-change-policy.invariants` — no-store 항목을 전역 요구로 갱신.
        - `x-improvements` — OQ-1 `반영됨`, V2-3(DELETE 204) `흡수됨`.
    basis: |
      2026-08-12 리더 판정. 계약 소유자가 재심을 제기하고 리더가 판정한 경로다
      (`x-change-policy.escalate_to_leader` 1번 — 계약 소유자 단독으로 리더 판정을 뒤집지 않는다).
      근거 G4: 열거식 범위가 이 저장소에서 이미 두 번 누락됐다.
      **`info.version`은 올리지 않는다** — 헤더 추가는 비파괴이고 와이어 스키마가 그대로라
      React 생성 타입에 영향이 없다(U-1과 같은 판단).
      영향받는 검증: ① 오류 응답의 헤더 **부정** 단언이 **긍정**으로 뒤집힌다(Kotlin 한정.
      Python `tests/api/test_errors.py`의 부정 단언은 그대로 옳다), ② 열거 10곳 단언 유지,
      ③ 컨테이너 레벨 응답(400·404·413·415) 도달 여부 **Phase 3 실측 신규**,
      ④ 헤더 중복 부착(`no-store, no-store`) 부재 단언 신규.
      체크 항목 정본: `.claude/skills/api-contract-freeze` §5.
      통보 대상: kotlin-implementer, parity-verifier(두 런타임 헤더 차이는 불일치가 아니라
      기록된 차이), privacy-gate.
      판정문 전문: `docs/migration/_workspace/02_contract-rebase.md` §3.2

  - version: "1.1.0"
    revision: "H-1"
    date: "2026-08-12"
    author: contract-keeper
    change: |
      **H-1 실측 반영 — 강제 수단을 필터 1층에서 필터+밸브 2층으로 갱신.** 그리고 그
      실측이 부수로 드러낸 **오류 본문 사각지대**를 새 계약 항목으로 세웠다.

        - `x-global-response-headers.enforcement` — "서블릿 필터 하나로 붙인다" → **필터 +
          Tomcat Engine 밸브 2층**. 각 층이 덮는 범위를 실측 결과로 적었다.
          **요구를 좁힌 것이 아니라 강제 수단을 넓힌 것**이므로 `invariants` 축소가 아니다.
        - `x-global-response-headers.x-container-coupling` **신설** — 밸브가 Tomcat 결합이며
          서블릿 표준이 아니라는 사실, 계획 §3.1의 내장 Tomcat 고정이 감수 근거라는 사실,
          컨테이너를 바꾸면 **기동 시점에 깨진다(조용히 사라지지 않는다)**는 사실.
        - `x-global-response-headers.x-phase3-measurement` — "미실측" 산문 → **실측 결과
          구조체.** 측정 수단(원시 소켓 + `RANDOM_PORT`), MockMvc가 왜 근거가 못 되는지,
          도달 5종 / 미도달 7종, 음성 대조, **기각된 가설**(`shouldNotFilterErrorDispatch()`),
          그리고 이번 실측이 다루지 **않은** 것(본문 모양).
        - `x-global-response-headers.x-failure-mode-shift` · `x-openapi-expressibility` ⑥ —
          실측으로 닫힌 상태를 반영하되 절을 지우지 않았다. 강제 수단을 건드리는 변경은
          매번 같은 방식으로 다시 재야 하기 때문이다.
        - **`x-error-body-universality` 신설** — 오류 본문 `detail` 불변식이 **어떤 경로로
          만들어진 응답이든** 적용된다는 것을 검증 항목 E-1~E-3으로 적었다. ④(컨테이너 생성
          응답)의 본문은 **미실측**으로 명시했다 — 충족으로도 위반으로도 적지 않는다.
        - `info.description`(오류 본문 계약) · `components.schemas.ErrorResponse` ·
          `x-change-policy.invariants` — 위 절을 정본으로 가리키게 갱신.
    basis: |
      **실측 출처**: kotlin-implementer가 원시 소켓으로 측정(Tomcat 11.0.22 / Boot 4.1.0).
      근거 G1 — 계약의 강제 수단 서술("필터 하나")이 **사실과 달랐다.** 필터만으로는 파싱
      단계 거절 7종에 닿지 않는다.
      근거 G4 — 오류 본문 항목. 조항은 옳았으나 "모든"의 범위가 검증되지 않은 채 참으로
      읽히고 있었고, `sendError` → `/error`가 그 범위를 벗어난다.
      **`info.version`은 올리지 않는다** — 와이어 스키마가 그대로다. 강제 수단 서술과
      실측 기록은 React 생성 타입에 영향이 없고, 오류 본문 항목은 **새 요구가 아니라 기존
      불변식의 적용 범위 명시**다(U-1·OQ-1과 같은 판단).
      영향받는 검증: ① X-D2c **미실측 → 실측 완료**, ② 신규 X-D2d(밸브 제거 시 malformed
      3건이 깨지는 음성 대조), ③ 신규 X-C7(오류 본문이 경로를 가리지 않음 = E-1~E-3),
      ④ X-C4를 `/error`·컨테이너 경로로 확장.
      통보 대상: kotlin-implementer(E-1~E-3은 Phase 3 인증 필터와 같은 단위),
      parity-verifier(오류 본문은 Python과 같아야 하는 자리다 — 의도된 차이가 아니다),
      privacy-gate, 리더(④ 미실측 항목이 어긋나면 재심).

  - version: "1.1.0"
    revision: "R-1"
    date: "2026-08-12"
    author: contract-keeper
    change: |
      **재개발 전환으로 근거를 잃은 호환 요구 정리.** 2026-08-12 2차 사용자 결정으로
      Python을 폐기하고 재개발하며 **롤백을 포기했다.** 롤백 창에서만 성립하던 요구를
      걷어내되 **그 자리에 있던 "올바른가"는 남겼다.**

        - `x-auth.rehash_policy` — "기존 PHC 문자열은 그대로 검증 가능해야 한다"는
          **호환 프레이밍**을 **기능 요구**로 다시 썼다. 재해시 판정 기준을
          변형·`time_cost`·`memory_cost`·`parallelism`의 **전체 파라미터 동등성**으로
          명시했다(Phase 0 실측 결함 — Spring `upgradeEncoding()`은 `memory`·`iterations`의
          "미만"만 본다).
        - `x-auth.clock_skew_seconds: 0` + `x-clock-skew` **신설** — 만료 검증 허용 오차 0.
          Nimbus·Spring 기본 60초를 그대로 두면 만료 토큰이 **+59초까지 통과한다**
          (Phase 0 실측 결함). `exp` 필수 조항이 강제되려면 이것이 함께 있어야 한다.
        - `x-auth.x-rebuild-note` **신설** — "Python↔Kotlin 양방향 상호 수용" 요구가
          폐기됐고, 없어진 것은 **상호 수용**이지 발급·검증의 정확성이 아님을 남겼다.
          지우기만 하면 다음 사람이 "왜 JWT 검증 요구가 없지?"라고 묻고 되돌린다.
        - `responses.ServiceUnavailable` — "Fernet 키 미설정" → **"저장 암호화 키 미설정"**.
          재개발이 표준 AEAD를 처음부터 쓰므로 스킴 이름에 묶이지 않는다.
          **상태 코드(503)·동작·`detail` 문구는 바꾸지 않았다.**
        - `x-global-response-headers.x-python-deviation` → **`x-origin-of-the-ten`으로
          재작성.** 종전 내용("인정된 이탈 / 관찰 기간의 기록된 차이 / parity 불일치로
          올리지 않는다")은 두 런타임 병행과 롤백 창을 전제했는데 그 상황이 소멸했다.
          **리더 판정(부수 결정 2)이 뒤집힌 것이 아니라 대상이 사라진 것**이며, 남긴 것은
          10곳 목록의 출처뿐이다. `info.description`·`x-superseded`·`x-not-a-scope`의
          참조 3곳을 함께 고쳤다.
    basis: |
      근거 **G3**(정책 결정 변경 — 2026-08-12 2차 사용자 결정: Python 폐기·재개발, 롤백
      포기) + **G1**(재해시 판정 기준과 clock skew 서술이 사실과 달랐다 — Phase 0 실측).
      **`info.version`은 올리지 않는다** — 와이어 스키마가 그대로다. 상태 코드·오류 본문·
      필드 이름·enum이 하나도 바뀌지 않았고, 바뀐 것은 인증 검증 규약의 서술과 503 사유의
      **명칭**뿐이라 React 생성 타입에 영향이 없다(U-1·OQ-1·H-1과 같은 판단).
      React 영향: **없음.** `types.ts`·`client.ts`·컴포넌트 어느 쪽도 Argon2 파라미터,
      JWT 허용 오차, 503 사유 명칭을 읽지 않는다. 토큰 만료는 `client.ts`가 401 응답으로만
      감지하며 그 계약은 그대로다.
      영향받는 검증: ① 옛 "JWT 양방향 fixture" → **JWT 계약 준수 fixture**(만료 직후 401 ·
      `typ` 오값 · `exp` 누락 · 서명 위조), ② **Argon2 재해시 판정 단위 테스트 신규**
      (파라미터가 하나라도 다르면 재해시), ③ 사적 헤더의 "Python 이탈 기록" 관련 parity
      항목 **삭제**(대조 상대가 없다).
      통보 대상: kotlin-implementer(**필수조치 A·B는 살아 있는 요구다**),
      parity-verifier(crypto·jwt·argon2 도메인과 `compat` 판정 모드 삭제를 계약 쪽에서도
      확인), privacy-gate(저장 암호화 키 **명칭만** 변경 — 동작 불변), 리더.

# =============================================================================
# 개선 원장 (2026-08-12 개정 — 옛 이름 `x-v2-candidates`)
#
# 계약이 동결물이 아니게 되면서 "v2 후보"라는 보류함도 없어졌다. 개선안은 이제
# 미루는 대상이 아니라 `x-change-policy`의 근거로 판정하는 대상이다.
# ID(V2-N)는 기존 문서·리뷰가 그 번호로 인용하고 있어 **추적성을 위해 그대로 둔다** —
# 번호의 "V2"는 이제 역사적 접두사일 뿐 "버전 2로 미룸"을 뜻하지 않는다.
#
# status 값: 반영됨 / 진행 / 요구사항 없음 — 유지 / 리더 재심
# =============================================================================
x-improvements:
  - id: V2-1
    subject: "GET /health 의존 서비스 진단"
    status: 반영됨
    ground: G2
    detail: |
      계약을 진단하는 쪽으로 고쳤다(`paths./health`, `components.schemas.HealthResponse`).
      degraded여도 200을 유지하고 상태는 본문으로 표현한다 — 상태 코드를 바꾸면 배포
      동작이 달라지기 때문이다. 진단 상세(호스트·버전·예외 메시지)는 싣지 않는다.
      React 영향 없음(화면이 `/health`를 부르지 않는다).
      **구현은 의존성이 배선되는 Phase에 맞춘다**(DB Phase 3, 큐 Phase 5). 확인하지 못한
      의존 서비스는 `checks`에서 키를 생략한다.
  - id: V2-2
    subject: "미처리 500 응답의 CORS 헤더"
    status: 반영됨
    ground: G2
    detail: |
      Kotlin은 미처리 500에도 CORS 헤더를 낸다(2026-08-12 리더 판정, 사용자 승인).
      근거·범위·Phase 6 확인 항목은 `x-cors.x-unhandled-500-cors`가 정본이다 —
      두 벌이 갈리지 않게 여기에 옮겨 적지 않는다.
  - id: V2-3
    subject: "DELETE 204 응답의 no-store/nosniff"
    status: "흡수됨 — OQ-1 전역 부착에 포함"
    detail: |
      **2026-08-12 리더 판정으로 이 항목은 독립 판정 대상이 아니게 됐다.** 전역 부착이
      승인되어 204에도 두 헤더가 붙는다(`x-global-response-headers`).
      직전 판정("요구사항 없음 — 유지")의 논지는 여전히 옳았다는 점을 기록해 둔다 —
      204에 캐시될 사적 값이 없다는 것은 사실이고, 그것이 뒤집힌 이유는 이 항목의 이득이
      새로 발견됐기 때문이 **아니라** 범위를 열거로 관리하는 방식 자체가 G4로 폐기됐기
      때문이다. 즉 이 항목은 논쟁에서 진 것이 아니라 논쟁의 대상이 없어졌다.
  - id: V2-4
    subject: "목록 응답의 총 개수(total)"
    status: "요구사항 없음 — 유지"
    detail: |
      필드 추가는 비파괴적이지만, 요구하는 화면이 없다. 목록 요청마다 `COUNT(*)`가
      늘어나는 비용만 확정되고 쓰는 곳은 없다. 페이지네이션 UI 요구사항이 생기면
      그때 G2로 추가한다(추가는 비파괴이므로 미리 넣어 둘 이유가 없다).
  - id: V2-5
    subject: "MaskedItemResponse.category 예시 값"
    status: 반영됨
    ground: G1
    detail: |
      초판 예시가 `"phone"`이었는데 어떤 구현에서도 나오지 않는 값이다(실제 값은
      한국어 `"전화번호"`였고, 2종 결정 이후로는 그것조차 없다).
      `frontend/src/test/factories.ts`도 같은 허구 값 `'phone'`을 쓰고 있어 계약과
      프런트 픽스처가 나란히 틀려 있었다 — 프런트 수정은 별도 작업이다.
  - id: V2-6
    subject: "마스킹 범주 5종 → 2종"
    status: 반영됨
    ground: G3
    detail: |
      주민등록번호·카드번호만 유지한다(2026-08-12 사용자 결정).
      계약에는 `MaskedItemResponse.category` enum, `placeholder` pattern,
      `missing_placeholders` pattern으로 반영했다.
      **프런트 영향(고치지 않고 기록만)**: `frontend/src/test/factories.ts`와
      `frontend/src/components/ReviewEditor.test.tsx`의 픽스처가 사라진 범주
      (`전화번호`·`이메일`)를 쓴다. 런타임 코드는 `category`를 문자열로 렌더링만 하므로
      깨지지 않는다.
  - id: V2-7
    subject: "DocumentListItem.source_format enum 고정"
    status: 반영됨
    ground: G1
    detail: |
      초판이 "자유 문자열"이라 적었으나 값 집합은 이미 닫혀 있다(text·docx·pdf·hwpx).
      React 영향 없음 — 이 필드를 읽는 화면 코드가 없다.
  - id: OQ-1
    subject: "사적 헤더 전역 부착"
    status: "반영됨 — 충족 실측 확인 (2026-08-12, H-1)"
    ground: G4
    detail: |
      **2026-08-12 리더 판정 — 전역 부착 승인.** 정본은 `x-global-response-headers`다.
      여기에 옮겨 적지 않는다.
      경로: 계약 소유자가 재심을 제기하고 리더가 판정했다. 계약 소유자가 전제 변화를
      근거로 리더 판정을 스스로 뒤집지 않았다(`x-change-policy.escalate_to_leader` 1번).
      **충족이 실측으로 확인됐다(H-1)** — 종전 "미확인" 서술은 무효다. 필터 1층으로는
      파싱 단계 거절 **6종**에 닿지 않았고, Tomcat Engine 밸브를 더해 전부 덮었다
      (2026-08-19 M-405b — 종전 "7종"은 M-405 정정에서 빠뜨린 자리다. `x-changelog`의
      옛 항목과 달리 이 절은 **지금의 상태**를 적는 자리이므로 현행 수로 맞춘다).
      계약을 좁히지 않고 강제 수단을 넓히는 순서(①)로 해결되어 리더 재심(②)은 필요 없었다.
  - id: V2-8
    subject: "오류 본문 불변식의 적용 범위 — `sendError` → `/error` 사각지대"
    status: 반영됨
    ground: G4
    detail: |
      정본은 `x-error-body-universality`다. 여기에 옮겨 적지 않는다.
      H-1 실측의 **범위 밖 부수 발견**이다 — `sendError` 경로가 `{"detail": …}`가 아니라
      Spring `BasicErrorController` 기본 본문을 낸다. 지금은 운영 코드가 `sendError`를
      부르지 않아 드러나지 않지만, **Phase 3 인증 필터가 401을 그렇게 내는 순간 깨진다.**
      새 요구를 만든 것이 아니라 기존 불변식의 "모든"이 검증되지 않은 채 참으로 읽히던
      것을 검증 가능한 형태(E-1~E-3)로 세운 것이다.
      React 영향: 런타임 코드가 깨지는 변경이 **아니다** — 오히려 지금 상태가 방치되면
      `client.ts`의 `readErrorMessage`가 401에서 `detail`을 못 찾아 폴백 문구만 남는다.
      계약은 현행 React 동작을 지키는 쪽에 서 있다.
