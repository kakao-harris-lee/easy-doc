  - version: "2.22.0"
    date: "2026-09-07"
    revision: "CREDIT-ACCOUNTS-C1"   # 크레딧 계정·차감 — 워크스페이스 잔액, 등록 시 예약, 완료 시 소비
    author: contract-keeper
    change: |
      **워크스페이스 크레딧 계정을 연다.** 정본은
      `docs/plans/2026-09-07-credit-accounts.md`§2 — 2.21.0(U2)이 연 사용량 집계 위에
      실제 **차감**(예약·소비·해제·402 거절)을 얹는다. 문서 등록 때 필요한 크레딧을
      예약하고 변환이 끝나면 소비하며, 집행 스위치가 켜진 상태에서 잔액이 모자라면
      등록을 거절한다. 충전(부여)은 운영자가 수동으로 한다 — 이 변경 단위는 조회·API
      경로만 열고 `credit-grant` 프로필은 C2(다음 슬라이스)가 연다.

      ⑴ **오퍼레이션 1종 신설** — `GET /workspaces/{workspace_id}/credits`
         (`readWorkspaceCredits`, Bearer 필요, 200). 소유자만 조회할 수 있고 아니면
         404(존재 은닉, `readWorkspaceUsage`와 같은 원칙). 최근 거래 50건을 최신순으로
         담는다. `workspace_id` 형식 오류는 공유 `ValidationFailed`(422) — 경로 값
         자리 하나뿐인 `readDocumentSource`와 같은 처분(`ValueSlotInvariantReachTest`).

      ⑵ **`createDocument`에 402와 헤더 2종을 더한다.** 크레딧 예약이
         `documents`/`conversions` insert **앞**, 같은 트랜잭션에서 돈다 — 거절되면
         (집행 중 가용 잔액 부족) 문서가 아무 데도 생기지 않는다. 402 본문은 공유
         `InsufficientCredits`이고 `X-Credit-Balance`(가용)·`X-Credits-Required`(필요)
         헤더를 싣는다 — `ReconversionBudgetExhausted`(429)와 같은 이유로 몸체가 아니라
         헤더다(`x-error-body-universality`). **202 응답에도** `X-Credit-Balance`
         (예약 직후 가용 잔액)가 항상 실린다 — 집행 스위치와 무관하게 화면이 잔액을
         안다.

      ⑶ **스키마 4종 신설** — `WorkspaceCreditsResponse`(잔액·예약·가용·집행 여부·
         거래 목록), `CreditTransaction`, `CreditTransactionKind`(`grant`·`reserve`·
         `consume`·`release`·`adjust` — `credit_transactions.kind`, V15와 같은 값),
         `CreditReason`(`signup`·`plan_monthly`·`manual`·`refund`·`conversion`). 공유
         응답 `InsufficientCredits` 1종도 신설.

      ⑷ **`AuthenticatedEndpoints`에 `/workspaces/{workspace_id}/credits` 추가** —
         `/workspaces/{workspace_id}`가 하위 경로를 덮지 않아 기존 관행대로 따로
         넣는다(`usage`·`export`·`feedback`·`reconvert`와 같은 이유).

      ⑸ **엔드포인트 수 29 → 30** — 2.21.0(`USAGE-U2-AGGREGATE`)이 연 29 위에 이
         오퍼레이션 1종을 더한다.

      ⑹ **CORS 노출 목록 정정** — 이전 버전의 브라우저는 재변환 예산·Retry-After
         헤더를 읽지 못했다. `x-cors.expose_headers`가 `Content-Disposition`·`Location`
         둘뿐이라, `Retry-After`·`X-Remaining-Call-Budget`(재변환 예산, 2.14.0)과 이번
         버전이 새로 낸 `X-Credit-Balance`·`X-Credits-Required`가 응답에는 실려도
         브라우저 JS(`client.ts`)는 교차 출처(Compose: 프런트 8080 → API 8100)에서
         전부 `null`로 읽고 있었다 — 계약 선언(`ContractHeaderDeclarationTest`)과
         CORS 노출은 서로 다른 관문이라 그 테스트가 이 누락을 잡지 못했다. 이번 버전
         안에서(2.22.0, 미배포) 넷을 목록에 더해 정정한다 — 이 변경 단위 자체가
         아직 나가지 않았으므로 별도 버전을 새로 열지 않는다.
    ground: |
      **G1 — 사용자 요청(2026-09-07).** 「크레딧 계정·차감 스팩 쓰고 진행」 — 계획
      §2의 결정을 계약으로 옮긴다. 402·헤더 패턴은 같은 계획 §1.5가 인용한
      `ReconversionBudgetExhausted`(429) 선례를 그대로 따른다.
    compatibility: |
      **넓히는 변경이다.** 새 오퍼레이션 1종, 새 스키마 4종·공유 응답 1종을 더하고
      기존 오퍼레이션(`createDocument`)에는 **새 실패 갈래(402)와 헤더**만 더한다 —
      기존 성공 응답의 필드는 바뀌지 않는다(202 본문은 그대로이고 헤더만 하나
      늘었다).

  - version: "2.21.0"
    date: "2026-09-07"
    revision: "USAGE-U2-AGGREGATE"   # 사용량 가시화 U2 — 워크스페이스·기간 집계
    author: contract-keeper
    change: |
      **워크스페이스 사용량 집계 오퍼레이션을 연다.** 정본은
      `docs/plans/2026-09-07-usage-ledger-and-report.md`§2 결정 5-6 — U1(2.19.0과
      같은 브랜치 계열에서 병행, `llm_calls` 원장 V14)이 남긴 호출 원장을 워크스페이스·
      기간으로 묶어 화면·운영 리포트(U3)가 쓸 조회 하나를 연다. 크레딧 **차감**(잔액·
      거절)은 이 변경 단위 밖이다 — 집계가 먼저 서야 얹을 수 있다(계획 목표 문단).

      ⑴ **오퍼레이션 1종 신설** — `GET /workspaces/{workspace_id}/usage`
         (`readWorkspaceUsage`, Bearer 필요, 200). 소유자만 조회할 수 있고 아니면
         404(존재 은닉, 기존 워크스페이스 오퍼레이션과 같은 원칙). 쿼리 `from`·`to`는
         `YYYY-MM-DD`이고 **포함** 상한이며, 생략하면 `easydoc.usage.zone`(기본
         `Asia/Seoul`) 기준 이번 달 1일~오늘이다. 형식 오류·`to < from`·366일 초과
         구간은 422(문자열 detail) — 스키마 제약이 아니라 서비스 층 규칙이라
         `ValidationFailed`의 문자열 갈래를 쓴다(대표 자리는 `POST /documents`의
         `workspace_id` 형식 오류와 같은 경계, 2026-08-23 신설 조항). **빈 값**
         (`?from=`, 공백뿐인 값)은 네 번째 갈래로 배열 detail이다 — 이 오퍼레이션이
         처음으로 자유 형식(`type: string`, 제약 없음) 쿼리 파라미터를 열어
         `TypedValueSlotInterceptor`의 문자열 파라미터 제외를 걷어냈다(2026-09-08
         리뷰 — 그 인터셉터는 강제 변환이 있는 타입만 다뤘는데, 이 파라미터가 처음으로
         강제 변환 없는 문자열 값 자리를 계약에 들여 「값 자체가 없다」와 「형식이
         틀렸다」를 가를 필요가 생겼다).

      ⑵ **스키마 3종 신설** — `WorkspaceUsageResponse`(문서·문자·크레딧·호출·토큰·
         예상 비용·비용 미상 건수·목적별 소계), `PurposeUsageItem`, `UsagePurpose`
         (`convert`·`repair`·`reconvert` — `llm_calls.purpose`, V14와 같은 값).
         비용 필드는 **문자열**(부동소수 반올림 오차를 피한다)이고, 알려진 비용이
         하나도 없으면 `null`이다(0달러가 아니다 — 프로젝트 CLAUDE.md 「미설정은
         null」).

      ⑶ **`documents`·`characters`·`credits`는 `documents` 표를 참조하지 않는다**
         (2026-09-08 리뷰 정정, 착수 당일 병합 전 잡힌 문제라 별도 버전을 새로 열지
         않는다). 최초 설계는 이 셋을 `documents.created_at` 기준으로 그 표에서 직접
         셌는데, `documents` 행이 보존 만료·계정 삭제로 지워지면 지난달 청구 근거가
         이 조회에서도 함께 사라진다 — U1이 `llm_calls`를 append-only 원장으로 만든
         이유와 정면으로 어긋난다. 그래서 셋 다 `llm_calls.document_char_count`(그
         호출이 속한 문서의 `documents.char_count` 스냅샷, U1도 같은 날 이 열을 더해
         정정했다)에서 유도한다 — **그 기간에 완료된 LLM 호출이 하나라도 있던 문서만
         센다**(등록만 되고 변환되지 않은 문서는 비용·크레딧이 없으므로 제외되는 것이
         맞다).

      ⑷ **`AuthenticatedEndpoints`에 `/workspaces/{workspace_id}/usage` 추가** —
         `/workspaces/{workspace_id}`가 하위 경로를 덮지 않아 기존 관행대로
         따로 넣는다(`export`·`feedback`·`reconvert`와 같은 이유).

      ⑸ **엔드포인트 수 28 → 29** — 2.20.0(`REMOVE-MASKING`)이 유지한 28 위에 이
         오퍼레이션 1종을 더한다.
    ground: |
      **G1 — 사용자 요청(2026-09-07).** 「1·2·3 묶음으로 진행, 권고대로 결정」 —
      계획 §3 슬라이스 U2. 집계 경계(zone 자정, 366일 상한, 비용 미상 처리)는 같은
      계획 §2 결정 5·4가 이미 확정한 값이고 이 변경 단위는 그 결정을 계약으로 옮긴다.
      **G4(계약이 사실과 다름)** — ⑶의 정정은 독립 리뷰가 병합 전에 잡은 문제를 이
      버전 자체에 반영한 것이다(비밀번호 설정·재설정 2.19.0 changelog의 같은 처분).
    compatibility: |
      **넓히는 변경이다.** 새 오퍼레이션 1종과 새 스키마 3종뿐이고 기존 오퍼레이션의
      요청·응답은 바뀌지 않는다. ⑶의 정정은 아직 배포되지 않은 응답의 **의미**만
      바꾼다 — 필드 이름·타입·필수 여부는 그대로다.

  - version: "2.20.0"
    date: "2026-09-07"
    revision: "REMOVE-MASKING"   # 사용자 결정 — 개인정보 마스킹 파이프라인 전면 제거
    author: contract-keeper
    change: |
      **개인정보 마스킹을 계약에서 걷어낸다. 파괴적 변경이다** — `masked_items`·
      `missing_placeholders`를 읽던 소비자는 그 필드를 더는 받지 못한다.

      ⑴ **`MaskedItemResponse` 스키마를 삭제했다.** 마스킹 범주(주민등록번호·카드번호)
         enum, `placeholder`·`missing_placeholders` pattern을 포함해 스키마 전체가
         계약에서 사라졌다.
      ⑵ **`ConversionResponse`에서 `masked_items`·`missing_placeholders` 두 필드를
         제거했다.** `required` 배열에서도 함께 뺐다. 응답 필드 수는 열아홉에서
         열일곱이 된다.
      ⑶ **`readDocumentSource`·`readConversion`·`reconvertUnit`·`exportConversion`
         오퍼레이션 설명에서 마스킹·자리표시자 복원에 관한 서술을 모두 걷어냈다** —
         `exportConversion`의 409 사유 목록도 다섯에서 넷으로 준다(「검수본이 없는데
         자리표시자가 결과에서 사라졌다」 사유가 구조적으로 사라진다).
      ⑷ **`x-title-policy.rationale`·`ConversionFeedbackDtos.comment`·
         `DocumentSourceResponse.source_text` 등에서 "마스킹 우회"·"마스킹 전 원문"
         같은 서술을 걷어냈다** — 남는 근거는 암호화 우회·파일명 예측 가능성 등
         마스킹과 무관한 것만이다.
      ⑸ **엔드포인트 수는 28로 그대로다** — 오퍼레이션 추가·삭제가 아니라 기존
         응답 모양을 줄인다.
      ⑹ **`x-changelog`·`x-improvements`의 과거 항목(1.1.0 `MaskedItemResponse` 도입,
         V2-5·V2-6 마스킹 범주 5종 → 2종 등)은 이 개정으로 고치지 않는다** — 그
         시점의 결정을 있는 그대로 남긴 역사 기록이다.
    ground: |
      **G3 — 정책 결정이 바뀌었다(사용자 결정, 2026-09-07).** 이 제품이 변환하는
      문서는 공공기관이 이미 공개 배포한 안내문이라 개인정보를 담지 않는다. 남아 있는
      마스킹 코드는 실재하지 않는 위협을 가정한 채 계속 손이 가는 헛작업만 만든다는
      것이 사용자의 명시적 판단이었고, 부분 제거가 아니라 전면 제거를 지시했다.
    compatibility: |
      **파괴적이지만 계약 밖 소비자가 없다.** 이 API를 부르는 클라이언트는
      `frontend/`(같은 저장소) 하나뿐이고 별도 배포로 나가는 SDK나 외부 통합이 없다 —
      그래서 major bump가 아니라 minor bump를 골랐다(`x-change-policy`에는
      `versioning` 키가 아직 없고, 2.0.0 `version_note`가 남긴 대로 그 신설은 아직
      별도 작업이다). React 쪽 대응은 같은 변경 단위(`frontend/`)에서 함께 간다.
    db_migration: |
      Flyway `V12__drop_masking_columns.sql` — `conversions.masked_items_encrypted`·
      `conversions.missing_placeholders` 두 열을 제거한다. 두 열 모두 도메인 모델에서
      완전히 빠졌으므로 하나만 지우면 고아 열이 남는다.
    notified: [kotlin-implementer, parity-verifier]

  - version: "2.19.0"
    date: "2026-09-06"
    revision: "PASSWORD-SET-RESET"   # backlog §1.4 다음 조각 — 비밀번호 설정·재설정
    author: contract-keeper
    change: |
      **소셜 전용 계정에 비밀번호 경로를 연다.** 2.17.0의 `oauthUnlink` 409가
      "비밀번호 설정을 안내하지 않는다 — 그 엔드포인트가 아직 없다"고 적어 두었던
      자리다.

      ⑴ **오퍼레이션 3종 신설.**
         - `POST /auth/password`(`setPassword`, Bearer 필요, 204) — 비밀번호가 없는
           계정만 새 비밀번호를 만든다. 이미 있으면 409. **이메일 인증을 요구한다**
           (독립 리뷰 지적, 2026-09-06 정정) — 네이버처럼 이메일 미검증 상태로도
           계정을 만들 수 있는 제공자가 있어, 호출자가 이미 인증된 상태만으로는
           *그 이메일 주소*의 소유까지 증명되지 않는다. 미인증이면 403
           (`createDocument`의 이메일 인증 게이트와 같은 예외·같은 문구를 재사용한다).
           성공하면 등록된 이메일로 "비밀번호가 만들어졌습니다" 알림 메일을 best-effort로
           보낸다.
         - `POST /auth/password-reset/request`(`passwordResetRequest`,
           `security: []`, 202) — 이메일 존재 여부·재요청 빈도와 무관하게 항상 202다
           (존재 은닉). 60초 재발송 쿨다운은 조용히 흡수한다.
         - `POST /auth/password-reset/confirm`(`passwordResetConfirm`,
           `security: []`, 200) — 코드를 확인해 비밀번호를 바꾸고(비밀번호 없던
           계정에도 새로 생긴다) `readMe.email_verified`를 참으로 표시한 뒤 `login`과
           같은 `TokenResponse`를 낸다. 이메일 부재·오답·만료·시도 소진을 전부 같은
           401로 묶는다. 코드 확인·비밀번호 갱신·이메일 인증 표시를 한 트랜잭션으로
           묶는다 — 갱신이 실패해도 코드가 소비된 채로 남지 않는다(독립 리뷰 지적,
           2026-09-06 정정). 성공하면 "비밀번호가 바뀌었습니다" 알림 메일도
           best-effort로 보낸다(재설정 코드 메일과 별개로 한 통 더).
      ⑵ **스키마 3종 신설** — `SetPasswordRequest`(`new_password`)·
         `PasswordResetRequest`(`email`)·`PasswordResetConfirmRequest`(`email`·
         `code`·`new_password`). `new_password` 필드 둘은 `SignupRequest.password`와
         같은 서비스 층 규칙(최소 8자)을 `x-request-field-constraints`에 추가한다.
      ⑶ **`oauthUnlink` 409 문구 갱신** — "먼저 다른 소셜 계정을 연결하세요"에서
         "먼저 비밀번호를 만들거나 다른 소셜 계정을 연결하세요"로. 탈출구가 하나
         늘었으니 안내도 함께 넓힌다(`x-social-login.explicit_linking`).
      ⑷ **`x-private-response-headers.applies_to`에 `POST
         /auth/password-reset/confirm` 추가** — `login`과 같은 이유(응답 본문이
         Bearer 토큰 자체다). 같은 절의 "1:1 대응" 문구도 함께 정정했다 — 그 대응은
         이 목록이 `paths`의 명시 선언과 갖는 관계의 **한 방향**일 뿐이었고(이 목록에
         없어도 이미 명시 선언된 자리가 여럿 있었다), 정정 전 문구는 그 사실을
         "1:1"이라고 잘못 좁혀 적고 있었다(독립 리뷰 지적, 2026-09-06 정정 — 이
         변경 단위 이전부터 사실과 달랐다).
      ⑸ **엔드포인트 수 25 → 28.**
    ground: |
      **G1 — 사용자 요청(2026-09-06).** backlog §1.4 "소셜 전용 계정은 비밀번호
      경로가 없다"는 공백을 이번 변경 단위로 닫는다. **G4(계약이 사실과 다름)** —
      ⑴·⑷의 정정은 독립 리뷰가 병합 전에 잡은 문제를 이 버전 자체에 반영한
      것이다(별도 버전을 새로 열지 않는다 — 아직 배포되지 않았다).
    compatibility: |
      **넓히는 변경이다.** 새 오퍼레이션 3종과 새 스키마 3종. 기존 오퍼레이션의
      요청·응답 모양은 `oauthUnlink` 409의 `detail` **값**만 바뀐다 — 상태 코드·본문
      키(`detail` 하나)는 그대로라 그 값을 손으로 비교하는 소비자만 갱신이 필요하다.

  - version: "2.18.0"
    date: "2026-09-06"
    revision: "P0-4-S7-COMPLIANT-SOURCE-UNITS"   # P0-4 S7 — segment_map.compliant_source_units
    author: contract-keeper
    change: |
      **§5 「이미 쉬운 글인 입력의 저변경 보장」이 미뤄 둔 자리를 연다.**

      ⑴ **`SegmentMap`에 새 required 필드** `compliant_source_units: integer[]` —
         저장된 추출 원문을 `\n`으로 쪼갠 원본 단위 중 스타일 게이트(`checkStyle`)를
         위반 0건으로 통과하고 공백만이 아닌 단위의 0 기반 색인을 오름차순·중복 없이
         담는다. 검사 대상은 **마스킹 전** 원문이다 — 화면이 읽는 문단이지 LLM이 본
         마스킹 본문이 아니다. `source_unit_indexes`(`SegmentMapUnit`)와 같은 좌표계라
         `maskText`가 줄 수를 바꾸지 않는다는 불변식에 기댄다. 저장하지 않고 다른
         `segment_map` 필드와 함께 매 조회마다 유도한다.
      ⑵ **화면은 경고만 하고 재변환을 막지 않는다.** 이 목록에 있는 원본 단위 행에는
         「이미 쉬운 글 규칙을 통과했다」 배지를 달지만, 재변환 버튼은 여전히 활성이다
         — 다시 쓰면 나빠질 수 있다는 판단은 서버가 아니라 사용자 몫이다.
      ⑶ **엔드포인트 수는 25로 그대로다** — 새 오퍼레이션이 아니라 기존 `segment_map`
         응답 모양 하나를 넓힌다.
    ground: |
      **G1 — 사용자 요청(2026-09-06).** `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md`
      §11. §5 「이미 쉬운 글인 입력의 저변경 보장」이 이 자리를 후속 슬라이스로 미뤄
      두었던 것을, S6(내보내기가 지도를 소비, PR #45)·연결 해제(PR #47, 2.17.0)가
      병합돼 계약 파일 충돌이 사라진 뒤 사용자가 착수를 결정했다.
    compatibility: |
      **넓히는 변경이다.** `SegmentMap`에 새 required 필드(`compliant_source_units`)
      하나를 더한다. 기존 오퍼레이션의 모양은 바뀌지 않는다 — 이 필드를 모르는 기존
      소비자는 무시하면 그만이지만, 스키마가 `required`로 못박았으므로 엄격한 스키마
      검증기를 쓰는 소비자는 응답을 다시 생성해야 한다.

  - version: "2.17.0"
    date: "2026-09-06"
    revision: "SOCIAL-LOGIN-UNLINK"   # backlog §1.4 다음 조각 — 소셜 계정 연결 해제
    author: contract-keeper
    change: |
      **연결 해제를 연다.** 2.10.0의 `x-social-login.explicit_linking`이 "연결 해제는
      이 변경 단위 밖이다 — backlog §1.4의 다음 조각"이라 적어 두었던 자리다.

      ⑴ **오퍼레이션 신설** — `DELETE /auth/oauth/{provider}/link`(`oauthUnlink`,
         Bearer 필요, 204). 코드 교환도 state 도 없는 순수 DB 조작이라(제공자를
         왕복하지 않는다) 502 도 `provider_not_configured` 422 갈래도 없다 —
         `oauthLinkStart`·`oauthLinkCallback`과 갈리는 점이다.
      ⑵ **판정 셋.** 호출자가 이 제공자에 연결한 신원이 없으면(애초에 없었는지
         이미 해제됐는지 구분하지 않는다) 404 — 반복 호출도 이 갈래라 멱등하다.
         비밀번호가 없고 이 신원이 유일한 연결이면 409(`last_login_method`) —
         해제하면 로그인할 방법이 하나도 남지 않는다. 그 밖은 유일한 신원이어도
         해제된다.
      ⑶ **`UserResponse.has_password`(신규 required 필드)** — `users.password_hash
         IS NOT NULL`. 화면이 위 409 판정을 요청 전에 미리 가늠해 「연결 해제」
         버튼을 비활성화할 재료다 — 서버 판정을 대신하지 않는다(경쟁 상태에서는
         여전히 409가 정본).
      ⑷ **엔드포인트 수 24 → 25.**
    ground: |
      **G1 — 사용자 요청.** backlog §1.4 「다음 조각」(2026-09-06 착수 결정) — 명시적
      연결(2.10.0)의 반대 방향을 닫는다.
    compatibility: |
      **넓히는 변경이다.** 새 오퍼레이션(`oauthUnlink`) 하나와 `UserResponse`의 새
      required 필드(`has_password`) 하나. 기존 오퍼레이션의 요청·응답 모양은 바뀌지
      않았다 — `has_password`를 모르는 기존 소비자는 그 필드를 무시하면 그만이다
      (다만 스키마가 `required`로 못박았으므로 엄격한 스키마 검증기를 쓰는 소비자는
      응답을 다시 생성해야 한다).

  - version: "2.16.0"
    date: "2026-09-06"
    revision: "P0-4-S6-EXPORT-CONSUMES-MAP"   # P0-4 S6 — 내보내기가 segment_map을 소비한다
    author: contract-keeper
    change: |
      **내보내기 반영이 `segment_map`을 소비한다.** S1~S5(PR #25·#28·#30·#35·#36)가 놓은
      지도는 지금까지 검수 화면의 대응 표시에만 쓰였다 — 파일 내보내기(`exportConversion`)
      의 자리 맞춤은 여전히 차례(원본 순서 × 검수본 순서)뿐이었다. 모델이 문단을 합치거나
      나누면 그 뒤 모든 문단이 한 칸씩 밀려 화면이 보여 준 대응과 파일의 대응이 갈렸다
      (계획 `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md` §10.1). 이
      조각이 그 간극을 닫는다.

      ⑴ **자리 맞춤의 유도가 하나로 합쳐진다.** 조회 응답의 `segment_map`을 낸 것과 같은
         함수가 내보내기의 반영에도 쓰인다 — 화면이 보여 준 대응과 파일에 적용된 대응이
         **같은 계산**에서 나온다(§10.2 결정 1). 필드·엔드포인트는 늘지 않는다.
      ⑵ **`FormatPreservationStatus.available`이 `details`를 실을 수 있다(2.16.0부터).**
         `segment_map`이 놓은 합침(N:1)·나눔(1:N)은 대응을 확신한 반영이라 `available`을
         깨지 않지만, 무슨 일이 있었는지는 여전히 알려야 한다(§10.2 결정 4). 2.15.0까지는
         `available`의 `details`가 언제나 빈 배열이었다 — 그 불변식이 이 버전부터 깨진다.
      ⑶ **`partial`의 근거가 둘 늘었다.** `LOW` confidence로 실제로 자리가 옮겨진 줄이
         있거나, 지도의 모양(단위 수·색인의 완전성)이 이 원본·검수본과 맞지 않아 차례
         짝짓기로 떨어지면(전제 검사 실패, `ORDINAL_FALLBACK`) 여전히 `partial`이다 —
         후자는 **파일의 자리 맞춤**은 `null` 지도와 같지만(차례 그대로), **판정은 다르다**:
         `partial` + 「원본 구조와 문단 수를 맞출 수 없어 차례대로 반영합니다.」 +
         「문단 수가 원본과 달라 뒤쪽 문단의 서식이 밀릴 수 있습니다.」 두 항목이 붙는다.
      ⑷ **`FormatPreservation.status`·`FormatPreservationStatus` 값 집합은 늘지 않는다.**
         `details`는 여전히 자유 문자열 배열이고 새 필드도 없다 — 순수 문구·상태 규칙
         변경이다.
      ⑸ **`segment_map`이 없으면(`null`) 응답·파일 모두 2.15.0과 바이트 단위로 같다**
         (§10.4 회귀 가드). **지도가 있으나 전제 검사에 실패해 거절되면 파일 자리
         맞춤만 2.15.0과 같고 응답은 다르다** — 위 ⑶ 후자가 그 경우다.
    ground: |
      **G2 — 요구사항 반영.** 계획 §10 「S6 스팩 — 내보내기가 지도를 소비한다」
      (2026-09-06 사용자 착수 결정).
    compatibility: |
      **좁히는 변경이다.** `FormatPreservationStatus.available`의 `details`가 이제
      빈 배열이 아닐 수 있다 — `available`이면 `details`가 항상 비어 있다고 가정한
      기존 소비자는 그 가정을 고쳐야 한다. 값 집합·필드는 늘지 않았고, `segment_map`이
      없는 반영은 2.15.0과 응답·파일 모두 같다. **다만 지도가 있는데 거절되는 변환은
      2.15.0에서 `available` + `[]`였던 것이 이 버전부터 `partial` +
      「원본 구조와 문단 수를 맞출 수 없어 차례대로 반영합니다.」·
      「문단 수가 원본과 달라 뒤쪽 문단의 서식이 밀릴 수 있습니다.」로 바뀔 수 있다** —
      파일 바이트는 그대로인데 판정 문구만 달라지는 갈래다.

  - version: "2.15.0"
    date: "2026-09-05"
    revision: "SOCIAL-LOGIN-NAVER"   # backlog §1.4 — 소셜 로그인 세 번째(마지막) 제공자
    author: contract-keeper
    change: |
      **네이버를 세 번째 `SocialLoginProvider` 로 연다.** 로그인·연결 흐름은 이미
      `{provider}` 로 갈리게 설계돼 있어 새 오퍼레이션 없이 enum 값 하나만 늘린다 —
      "권고 순서: 구글 → 카카오 → 네이버"(backlog §1.4)의 마지막 자리이자
      `reserved` 목록을 비우는 조각이다.

      ⑴ **`provider` enum 이 `[google, kakao]` → `[google, kakao, naver]`.** 영향을
         받는 자리 다섯 — `oauthStart`·`oauthCallback`·`oauthLinkStart`·
         `oauthLinkCallback` 넷과 `UserIdentityResponse.provider`. 새 오퍼레이션은
         없다. `providers.reserved` 는 이제 빈 배열이다 — 예고했던 값이 전부 열렸다.
      ⑵ **`provider_not_configured` 문구가 갈린다.** 네이버 키 미설정은 "네이버
         로그인이 설정되지 않았습니다"(**문자열**, 422) — 구글·카카오와 같은 방침
         (기동을 막지 않는다).
      ⑶ **네이버는 OIDC 가 없다.** ID 토큰 자체가 없어 인가 코드 교환은 액세스
         토큰만 내고, 신원은 `GET https://openapi.naver.com/v1/nid/me` 의
         `response.id`·`response.email` 로 얻는다(userinfo 전용 경로 하나뿐 — 카카오
         처럼 OIDC/userinfo 두 경로를 가르지 않는다). JWKS 서명 검증이 없어
         `OidcJwksVerifier` 를 쓰지 않는다. `nonce` 도 지원하지 않는다 — 다른
         제공자와 같은 방식으로 발급·저장은 하지만(state 저장소 스키마를 제공자마다
         가르지 않기 위해서) 인가 URL 에 싣지도, 콜백에서 대조하지도 않는다.
      ⑷ **네이버는 `email_verified` 개념이 없다 — 이 어댑터는 이메일이 있어도 항상
         미검증으로 신원을 낸다(2026-09-05 결정).** 검증되지 않은 값을 검증됨으로
         잘못 표시하는 쪽보다 안전한 쪽을 택했다. **`account_linking` 이 네이버에
         예외를 둔다(같은 날 후속 결정, option 2)** — 이메일이 없으면 여전히 422
         (`email_required`, 네이버 전용 문구)지만, 이메일이 있으면 **미검증인 채로도**
         계정(`users.email_verified_at IS NULL`)과 기본 작업 공간을 만든다. 미검증
         이메일 제공자(네이버)는 가입 뒤 이메일 인증 코드 절차를 거친다 — 트랜잭션
         커밋 뒤 비밀번호 가입(`signup`)과 같은 best-effort 로 `EmailVerificationService`
         가 코드를 발급한다. 이메일이 이미 다른 계정에 등록돼 있으면 다른 제공자와
         같은 규칙대로 여전히 409(자동 연결 안 함). 이미 인증된 계정에 여는
         `explicit_linking`(이메일 검증을 요구하지 않는다)이나, 이미 연결된 신원으로
         다시 로그인하는 경로(신원이 있으면 이메일 규칙을 다시 보지 않는다)도 그대로
         열려 있다.
      ⑸ **연결 해제(unlink)는 이번에도 범위 밖이다** — backlog §1.4의 다음 조각
         (구글 2.10.0·카카오 2.13.0 changelog와 같은 처분).

      **신뢰도.** 네이버 공식 문서(`developers.naver.com`)는 이 조사 환경의
      WebFetch 에서 접근이 차단돼 2차 출처 교차검증에 그쳤다(backlog §1.4) —
      엔드포인트 URL·응답 모양·`email_verified` 부재는 이 전제 위에서 확인된
      값이다.
    ground: |
      **G2 — 요구사항 반영.** backlog §1.4 「소셜 로그인」 권고 순서의 세 번째(마지막)
      제공자.
    compatibility: |
      **순수 확장이다.** 기존 오퍼레이션 넷의 요청·응답 스키마는 그대로고, `provider`
      enum 에 값이 하나 늘었을 뿐이다. `google`·`kakao` 만 알던 기존 소비자는 영향이
      없다 — `naver` 를 아직 안 쓰면 그 값을 볼 일이 없다.

  # 2026-09-05 — 버전 순서 노트: 이 브랜치는 origin/main(2.12.0, PR #30 병합 시점) 위에서
  # 시작했다. Kakao 로그인(PR #31, 병합 대기)이 2.13.0을 먼저 가져갔으므로 이 조각은
  # 2.14.0이다. 이 항목은 리베이스로 2.13.0 항목 **위**에 놓인다 — 두 항목의 날짜가 같아
  # 보여도 서수는 병합 순서를 따른다.
  - version: "2.14.0"
    date: "2026-09-05"
    revision: "P0-4-S4-RECONVERT"   # P0-4 — 문단 단위 재변환(S4). S1~S3(정렬·segment_map·검수 화면)의 마지막 조각
    author: contract-keeper
    change: |
      **재변환 엔드포인트를 새로 연다** — `POST
      /conversions/{conversion_id}/units/{source_unit_index}/reconvert`
      (`reconvertUnit`, Bearer 필요). 원본 단위 하나를 다시 변환한 **후보**만 돌려주고
      변환 본문에는 아무것도 쓰지 않는다(P0-4 S4,
      `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md` §4 결정 3).

      ⑴ **요청** `ReconvertUnitRequest` — `easy_unit_indexes`(현재 이 원본 단위에 대응
         중인 쉬운 글 단위 색인들, 빈 배열 가능) · `easy_text_fingerprint`(에디터 현재
         본문의 SHA-256 16진 문자열, 64자). 서버는 이 값들로 **아무 판정도 하지 않고**
         응답에 그대로 되울린다 — 어느 편집 상태에 대한 응답인지 클라이언트가 식별하는
         용도다.
      ⑵ **응답** `ReconvertUnitResponse` — `candidate_text`·`source_unit_index`·
         `easy_unit_indexes`·`easy_text_fingerprint`·`llm_calls_used`·
         `remaining_call_budget`. **자동 교체는 어떤 경우에도 없다** — 채택은 클라이언트
         몫이다.
      ⑶ **예산은 요청이 아니라 LLM 호출 수로 센다.** 재변환 1회는 보정 여부에 따라 1
         또는 2회를 쓴다. 문서 1건당 예산(`easydoc.reconversion.call-budget`, 기본
         20 — 계획 §0 게이트 1, 2026-09-05 사용자 확정)을 예약(호출 전, 2회)·정산(호출
         후, 실제 사용량만)한다. 예약 실패는 **LLM 호출 0회를 보장**하고 429를 낸다.
      ⑷ **429는 공유 컴포넌트 `TooManyRequests`를 쓰지 않는다** — 새 컴포넌트
         `ReconversionBudgetExhausted`. 저 컴포넌트는 60초 재발송 쿨다운 전용이라
         `Retry-After`를 필수로 요구하는데, 재변환에는 쿨다운도 재시도 시각도 없다
         (예산은 문서당 영구 상한이지 시간 창이 아니다). **잔여 예산은 몸체가 아니라
         헤더(`X-Remaining-Call-Budget`)로 낸다** — `x-error-body-universality`
         (오류 응답 본문은 언제나 `ErrorResponse`)를 지키면서 `Retry-After`와 같은
         자리에 값을 싣는다.
      ⑸ **502(`BadGateway`)를 세 번째로 선언한다** — `x-retired-responses[0].reinstated_by`
         2.14.0 항목. 재변환 1회의 LLM 호출은 워커 큐를 타지 않고 요청 스레드에서
         **동기로** 나간다(계획 §4 결정 3 「동기 처리」) — `oauthCallback`·
         `oauthLinkCallback`과 같은 근거(동기로 하위 시스템을 부르는 오퍼레이션).
      ⑹ **409**(완료 전 변환) · **422 문자열**(원본 단위 색인이 범위 밖) · **404**(남의
         변환, 존재 은폐)는 기존 `updateConversion`·`readConversion`과 같은 판정 축을
         쓴다.
      ⑺ **`compliant_source_units`는 이번에도 더하지 않는다** — `SegmentMap` 설명 참고.
         스타일 게이트 사전 경고(호출 전 「이미 통과했다」안내)는 이 슬라이스의 범위
         밖이고, 응답에는 채택 판정(`adopted`)·거절 사유·문체 위반 수도 싣지 않는다 —
         이번 조각은 **후보 텍스트와 예산 회계**로 좁혔다.
    ground: |
      **G2 — 요구사항 반영.** `docs/master-plan.md` §3.2(재변환 호출 예산 개정문,
      2026-09-05 확정)·§4.1 P0-4, `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md`
      §0·§4 결정 3·§6 S4.
    compatibility: |
      **순수 추가다.** 새 경로 하나, 새 스키마 둘(`ReconvertUnitRequest`·
      `ReconvertUnitResponse`), 새 응답 컴포넌트 하나(`ReconversionBudgetExhausted`,
      본문은 기존 `ErrorResponse`를 그대로 쓰고 헤더 하나만 더한다)뿐이고 기존
      오퍼레이션·스키마는 하나도 바뀌지 않는다. Flyway `V10`이 `conversions`에
      평문 정수 열 둘(`reconversion_calls_reserved`·`reconversion_calls_used`)을
      더하지만 API 응답에는 나가지 않는다.

  - version: "2.13.0"
    date: "2026-09-05"
    revision: "SOCIAL-LOGIN-KAKAO"   # backlog §1.4 — 소셜 로그인 두 번째 제공자
    author: contract-keeper
    change: |
      **카카오를 두 번째 `SocialLoginProvider` 로 연다.** 로그인·연결 흐름(시작/콜백,
      연결 시작/콜백)은 이미 `{provider}` 로 갈리게 설계돼 있어 새 오퍼레이션 없이
      enum 값 하나만 늘린다 — 구글 구현(2.8.0/2.10.0)이 예고한 "권고 순서: 구글 →
      카카오 → 네이버"(backlog §1.4)의 다음 자리다.

      ⑴ **`provider` enum 이 `[google]` → `[google, kakao]`.** `naver` 는 여전히
         예약만 됐고 enum 밖이다 — 오늘 영향을 받는 오퍼레이션은 `oauthStart`·
         `oauthCallback`·`oauthLinkStart`·`oauthLinkCallback` 넷과
         `UserIdentityResponse.provider` 다. 새 오퍼레이션은 없다(엔드포인트 수는
         그대로다).
      ⑵ **`provider_not_configured` 문구가 제공자별로 갈린다.** 카카오 키 미설정은
         "카카오 로그인이 설정되지 않았습니다"(**문자열**, 422) — 구글과 같은 방침
         (기동을 막지 않는다, 정본은 `x-social-login.provider_state`).
      ⑶ **카카오 이메일 caveat.** 비즈 앱 전환 + 이메일 동의항목 심사 전에는
         `account_email` 스코프 자체를 열 수 없고, 열려도 이메일이 없거나
         `is_email_valid`/`is_email_verified` 가 거짓일 수 있다(backlog §1.4 조사).
         **새 규칙을 만들지 않는다** — 기존 `account_linking` 의 "이메일이 없거나
         검증되지 않으면 422(`email_required`)" 가 그대로 적용된다(`oauthCallback` 전용,
         `oauthLinkCallback` 은 애초에 이메일 검증을 요구하지 않는다 — `explicit_linking`
         참고).
      ⑷ **어댑터가 OIDC ID 토큰과 사용자 정보 엔드포인트 두 경로를 갖는다** — 인가 코드
         교환 응답에 ID 토큰(`scope=openid`)이 실려 있으면 그 토큰을 검증하고, 없으면
         액세스 토큰으로 `GET https://kapi.kakao.com/v2/user/me` 를 불러 이메일·검증
         상태를 읽는다. 계약이 보는 결과(`SocialIdentity`)의 모양은 두 경로가 같다 —
         구현 세부는 `kr.easydoc.infrastructure.auth.kakao.KakaoSocialLoginProvider`,
         정본은 `x-social-login.providers.x-note`.
      ⑸ **연결 해제(unlink)는 이번에도 범위 밖이다** — backlog §1.4의 다음 조각(구글
         2.10.0 changelog와 같은 처분).
    ground: |
      **G2 — 요구사항 반영.** backlog §1.4 「소셜 로그인」 권고 순서의 두 번째 제공자.
    compatibility: |
      **순수 확장이다.** 기존 오퍼레이션 넷의 요청·응답 스키마는 그대로고, `provider`
      enum 에 값이 하나 늘었을 뿐이다. `google` 만 알던 기존 소비자는 영향이 없다 —
      `kakao` 를 아직 안 쓰면 그 값을 볼 일이 없다.

  - version: "2.12.0"
    date: "2026-09-05"
    revision: "P0-4-S2-SEGMENT-MAP"   # P0-4 — 문단 단위 대응 표시(S2), 재변환(S4)의 앞 조각
    author: contract-keeper
    change: |
      **`ConversionResponse`에 `segment_map` 필드를 더한다.** 좌측 원본 / 우측 변환 결과의
      **문단 단위 대응 하이라이트**를 화면에 놓기 위한 첫 조각이다(P0-4 S2,
      `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md`).

      ⑴ **새 컴포넌트 셋** — `SegmentMap`(`source_unit_count`·`easy_unit_count`·`units`),
         `SegmentMapUnit`(`easy_unit_index`·`source_unit_indexes`·`confidence`),
         `SegmentConfidence`(`high`|`low`). 정본 정렬 알고리즘은 `core/segment/SegmentAlignment.kt`
         (patience 방식 앵커 + 차례 보간) — Spring·DB 를 모르는 순수 함수다.
      ⑵ **저장하지 않는다.** 매 조회마다 (문서 등록 시점과 같은 규칙으로 마스킹한 원문)
         대 (`edited_text ?? easy_text`)에서 유도한다 — 검수 저장마다 즉시 낡는 두 번째
         진실을 만들지 않기 위해서다. 마이그레이션이 없다.
      ⑶ **`null`이면 완료 전이거나 원문·본문 중 하나를 지금 읽을 수 없다는 뜻이다.** 별도
         사유 필드를 두지 않는다 — `status`와 `easy_text`가 이미 사유를 말한다.
      ⑷ **본문(원문·쉬운 글 텍스트)은 싣지 않는다.** 원문은 `GET /documents/{document_id}/source`가
         이미 주고, 본문은 같은 응답의 `easy_text`·`edited_text`에 있다. 배열은 색인만
         나른다 — `SensitiveToStringReachTest`가 새 DTO 둘의 이 성질을 검사한다.
      ⑸ **`compliant_source_units`(스타일 게이트 통과 원본 단위)는 이 버전에 없다** — 재변환
         (P0-4 S4)이 그 자리에서 더한다. 이번 조각은 대응 표시만 연다.
    ground: |
      **G2 — 요구사항 반영.** `docs/master-plan.md` §4.1 P0-4·`DESIGN.md` §6.4·§6.5,
      `docs/kotlin-redevelopment-backlog.md` §1.3.
    compatibility: |
      **순수 확장이다.** 기존 필드는 하나도 바뀌지 않았고 `segment_map`은 완료 전에는
      `null`이라 기존 소비자(폴링 중인 화면)는 영향이 없다. 새 필드를 아직 읽지 않는
      소비자는 알 수 없는 키를 무시한다.

  - version: "2.11.0"
    date: "2026-09-05"
    revision: "DICTIONARY-LOOKUP"   # P0-5 조각 1 — 검수 화면 대체어 추천의 조회 API
    author: contract-keeper
    change: |
      **검수 화면 담당자가 지목한 문자열의 사전 지침(쉬운 말·뜻·주의·치환 가능 여부)을
      조회하는 오퍼레이션을 연다.** 문서 변환 프롬프트 주입과는 별개 경로다 — 사람의
      조회이지 LLM 컨텍스트가 아니다.

      ⑴ **오퍼레이션 1종 신설** — `POST /dictionary/lookup`(`dictionaryLookup`,
         Bearer 필요, 200). 요청은 `{ "text": string }` 하나뿐이고 **위치 정보를
         갖지 않는다** — `easy_unit_index`·`start`·`end` 같은 좌표는 편집기의 클라이언트
         전용 상태다(계획 §3.4 위치 계약, P0-4 편집기가 그대로 물려받는 경계).
      ⑵ **어휘 우선, pgvector 도입 없음.** 사전에 이미 있는 표제어를 트라이 최장일치로
         찾을 뿐 임베딩 근접 검색을 쓰지 않는다 — 미등재어를 벡터로 찾으면 「의미가
         가까운 다른 표제어」가 나와 `과태료 → 벌금` 같은 오변환 사고를 검색 계층이
         되살릴 위험이 있다(계획 §3.1). 임베딩 착수는 파일럿 무결과율 실측이 트리거를
         넘을 때 사용자가 별도로 결정한다.
      ⑶ **새 표·새 마이그레이션이 없다.** 조회는 워커가 프롬프트 주입에 이미 쓰는
         같은 색인(`easy_dict.index.json`, 커밋된 사본)을 API 프로세스가 별도로
         메모리에 올려 읽는다 — 매칭 구현이 둘로 갈리는 것(표 vs 트라이)을 피한다.
      ⑷ **404를 쓰지 않는다.** 사용자 소유 자원을 읽지 않으므로 이 오퍼레이션에는
         "없거나 내 것이 아니다" 판정이 성립할 자리가 없다(위 "소유권 은닉" 절 예외 둘).
         후보 0건도 200 + 빈 배열이다.
      ⑸ **남용 한도** — 사용자별 분당 60회, 인스턴스별 카운터(`TooManyRequests`
         컴포넌트 재사용, 두 번째 선언자). 기능 자체는 `easydoc.dictionary.lookup.enabled`
         로 끌 수 있고, 꺼져 있으면 422 문자열 `detail`이다.
      ⑹ **`text` 길이 제약은 스키마가 아니라 서비스 층이다** — `x-request-field-constraints`
         가 이미 세운 다섯 필드와 같은 판단(정규화 후 길이를 재고, 문구가 한국어다).
      ⑺ **엔드포인트 수 22 → 23**(제품 21 → 22 + 헬스 1).
    ground: |
      **G2 — 요구사항 반영.** master-plan §4.1 P0-5, 계획
      `docs/plans/2026-09-04-p0-5-easy-word-dictionary-rag.md` §3.4·조각 1.
    compatibility: |
      **순수 확장이다.** 기존 22개 오퍼레이션의 요청·응답·오류 모양은 그대로다.
      `TooManyRequests`의 설명 문구만 "두 번째 선언자가 생겼다"로 갱신했고 헤더·본문
      모양은 그대로라 기존 소비자(`POST /auth/email-verification/request`)는 영향이 없다.

  - version: "2.10.0"
    date: "2026-09-04"
    revision: "SOCIAL-LOGIN-EXPLICIT-LINK"   # backlog §1.4 — 소셜 로그인 다음 조각, 명시적 계정 연결
    author: contract-keeper
    change: |
      **이미 비밀번호 계정으로 로그인한 사용자가 그 계정에 소셜(Google) 신원을 잇는
      명시적 연결 흐름을 연다.** 2.8.0(`x-social-login.account_linking`)이 자동 연결을
      막으며 예고했던 "다음 작업 단위"가 이것이다.

      ⑴ **오퍼레이션 2종 신설** — `POST /auth/oauth/{provider}/link/start`
         (`oauthLinkStart`, Bearer 필요, 200) · `POST /auth/oauth/{provider}/link/callback`
         (`oauthLinkCallback`, Bearer 필요, 204). 정본은 최상위
         `x-social-login.explicit_linking`.
      ⑵ **state 가 사용자에 바인딩된다.** `oauth_states.user_id`(nullable, 새 컬럼)가
         로그인 state(`NULL`)와 연결 state(요청한 사용자 id)를 가른다.
         `oauthLinkCallback` 이 그 값과 Bearer 사용자를 대조해 다르면(로그인 state 가
         왔거나 다른 사용자의 연결 state 가 왔거나) 400 이다 — 반대 방향(연결 state 가
         `oauthCallback` 에 옴)도 같은 400.
      ⑶ **이메일 검증을 요구하지 않는다** — `oauthCallback` 과 갈리는 핵심 지점.
         호출자가 이미 인증돼 있고 코드 교환 자체가 신원 소유를 증명한다. 검증된
         이메일이 계정 이메일과 같고 계정이 미인증이면 부수 효과로
         `email_verified_at` 을 채운다(선택적 이득).
      ⑷ **연결 판정 셋** — 같은 신원·같은 사용자는 멱등 204, 신원이 이미 **다른**
         사용자 것이면 409(`identity_already_linked_to_other_user`), 호출자가 이 제공자에
         **이미 다른** 신원을 연결했으면 409(`provider_already_linked`, 사용자당
         제공자 하나 불변식).
      ⑸ **`UserResponse` 가 `identities: UserIdentityResponse[]` 를 얻는다(필수).**
         연결된 제공자 목록 — 비밀번호 전용 계정은 빈 배열이다.
      ⑹ **`BadGateway`(502) 선언이 둘로 늘었다** — `oauthLinkCallback` 도
         `oauthCallback` 과 같은 이유(제공자 토큰 교환을 동기로 부른다)로 이 컴포넌트를
         쓴다. 근거는 `x-retired-responses[0]` 의 `reinstated_by` 확장분.
      ⑺ **엔드포인트 수 20 → 22**(제품 19 → 21 + 헬스 1).
      ⑻ **연결 해제(unlink)는 이 변경 단위 밖이다** — backlog §1.4의 다음 조각.
    ground: |
      **G2 — 요구사항 반영.** backlog §1.4 「소셜 로그인」의 남은 조각(2026-09-04,
      팀 리드 지시) — 2.8.0 이 자동 연결을 거절하며 예고한 자리를 채운다.
    compatibility: |
      **순수 확장이다.** 기존 20개 오퍼레이션의 요청·응답·오류 모양은 그대로다.
      `UserResponse` 에 필드가 늘었지만 기존 소비자는 알 수 없는 키를 무시하므로
      깨지지 않는다(React 도 마찬가지 — 이 필드를 아직 읽지 않는 소비자는 영향이 없다).
      `oauth_states.user_id` 는 새 nullable 컬럼이라 기존 행(전부 로그인 state)은
      `NULL` 로 채워지고 `oauthStart`/`oauthCallback` 동작은 바뀌지 않는다.

  - version: "2.9.0"
    date: "2026-09-04"
    revision: "EMAIL-VERIFICATION"   # backlog §1.4 P0-1/P0-3 — 이메일 가입의 소유 확인
    author: contract-keeper
    change: |
      **이메일/비밀번호 가입이 이메일 소유를 증명해야 문서를 변환할 수 있게 한다.**
      소셜(Google) 계정은 제공자가 이미 검증했고, 기존 계정은 소급 인증(grandfather)된다.

      ⑴ **오퍼레이션 2종 신설** — `POST /auth/email-verification/request`
         (`requestEmailVerification`, 인증 필요, 204) ·
         `POST /auth/email-verification/confirm`(`confirmEmailVerification`,
         인증 필요, 204). 응답 본문이 없다 — 코드가 왕복하지 않는다.
      ⑵ **`UserResponse` 가 `email_verified: boolean` 을 얻는다(필수).** 소셜 로그인
         계정과 마이그레이션 이전 기존 계정은 항상 참이다.
      ⑶ **스키마 1종** — `ConfirmEmailVerificationRequest`(`code`, 6자리 고정 길이).
      ⑷ **`createDocument` 하나만 403 을 얻는다** — 이메일 미인증 계정의 변환 요청을
         막는다. 검사 순서의 맨 앞이다(본문을 보기 전에 거절). 남의 자원을 감추는
         403(이 계약이 원래 금지하는 것)이 아니다 — 정본은 최상위 설명의 "소유권 은닉"
         절 예외 항.
      ⑸ **컴포넌트 1종 신설** — `TooManyRequests`(429, 계산되는 `Retry-After` 헤더를
         인라인으로 선언 — `Location`·`Content-Disposition` 과 같은 자리라 `const` 를
         갖는 `components/headers` 로 옮기지 않는다). 재발송 쿨다운(60초) 안의
         재요청에만 나간다.
      ⑹ **엔드포인트 수 18 → 20**(제품 17 → 19 + 헬스 1).
    ground: |
      **G2 — 요구사항 반영.** backlog §1.4 「이메일 가입의 소유 확인」P0-1/P0-3
      (2026-09-04, 팀 리드 지시). 설계 결정(6자리 코드, 10분 TTL, 5회 오답 무효화,
      60초 재발송 쿨다운, 활성 코드는 항상 최대 하나, DB 로 쿨다운 판정 — 인메모리
      아님)은 그 위임 지침이 원본이다.
    compatibility: |
      **거의 순수 확장이다.** 기존 오퍼레이션 17개의 요청·응답·오류 모양은 그대로다.
      **유일한 예외는 `createDocument` 다** — 미인증 이메일/비밀번호 계정은 2.9.0
      이전에 되던 문서 등록이 이제 403 이다. 이 계약이 정의하는 "이메일/비밀번호로
      가입했고 아직 인증하지 않은 계정"이 2.9.0 이전에는 아예 존재하지 않았으므로
      (모든 기존 행이 배포 시점에 소급 인증된다), 이 변화는 **2.9.0 이후 새로 가입한
      계정에만** 미친다 — 배포 순간 기존 사용자의 요청이 갑자기 거절되지 않는다.
      `UserResponse` 에 필드가 늘었지만 기존 소비자는 알 수 없는 키를 무시하므로
      깨지지 않는다(React 도 마찬가지 — 이 필드를 아직 읽지 않는 소비자는 영향이 없다).

  - version: "2.8.0"
    date: "2026-09-04"
    revision: "SOCIAL-LOGIN-GOOGLE"   # backlog §1.4 P0-1 — Google Authorization Code 흐름
    author: contract-keeper
    change: |
      **소셜 로그인 첫 제공자(Google)를 더한다.** 이메일/비밀번호 가입·로그인 곁에
      Authorization Code 흐름을 새로 연다 — 우리 JWT 를 발급하는 것은 여전히 우리
      서버다(제공자 토큰을 그대로 클라이언트에 돌려주지 않는다).

      ⑴ **오퍼레이션 2종 신설** — `POST /auth/oauth/{provider}/start`(`oauthStart`,
         인증 불필요, 200) · `POST /auth/oauth/{provider}/callback`(`oauthCallback`,
         인증 불필요, 200 — 응답은 `login` 과 같은 `TokenResponse`). 정본은
         신설 최상위 `x-social-login`.
      ⑵ **스키마 3종** — `OAuthStartRequest`·`OAuthStartResponse`·`OAuthCallbackRequest`.
      ⑶ **BadGateway(502) 를 되살린다.** 2026-08-20 폐기(`x-retired-responses[0]`)
         당시 예고한 조건("동기로 하위 시스템을 부르는 오퍼레이션이 새로 생기면")이
         정확히 이번이다 — `oauthCallback` 이 Google 토큰 교환을 동기로 부른다.
         `oauthCallback` **하나만** 이 컴포넌트를 선언한다.
      ⑷ **`Conflict` 예시 추가** — `email_already_linked`(같은 검증된 이메일의 계정이
         이미 있을 때, 자동 연결하지 않는다).
      ⑸ **엔드포인트 수 16 → 18**(제품 15 → 17 + 헬스 1).
      ⑹ **리뷰 후속 조치(2026-09-05)**: `OAuthStartRequest.redirect_uri`·
         `OAuthCallbackRequest.code`/`state`/`redirect_uri` 넷에 `minLength: 1` —
         이 넷은 사용자가 타이핑하지 않는 프로토콜 토큰이라(`OAuthStartRequest` KDoc과
         같은 근거) 빈 값은 정규화·형식 판정 없는 순수 스키마 위반이다. 빈 값은 422
         **배열**이고 제공자를 왕복하지 않고 끊긴다 — `x-request-field-constraints`
         다섯 필드(문자열 422)와는 다른 결정이며 서로 충돌하지 않는다(그쪽은 여전히
         `minLength`를 의도적으로 갖지 않는다).
    ground: |
      **G2 — 요구사항 반영.** backlog §1.4 「소셜 로그인」 P0-1(2026-09-04, 팀 리드
      지시). 설계 결정(Authorization Code 흐름, state/nonce 서버 저장, 계정 자동
      연결 금지, google 키 미설정 시 422 로 기능만 비활성화)은 그 위임 지침이 원본이다.
    compatibility: |
      **순수 확장이다.** 기존 15개 오퍼레이션의 요청·응답·오류 모양을 하나도 바꾸지
      않는다. `Conflict` 에 예시 하나가 늘었을 뿐 스키마(`ErrorResponse`)는 그대로다.
      `BadGateway` 컴포넌트가 늘었지만 기존 오퍼레이션 중 이것을 선언하는 것은 없다.
      기존 소비자(React `readErrorMessage`, contract test)는 갱신 없이 계속 통과한다.
      새로 통과해야 하는 것은 새 오퍼레이션 두 개를 부르는 소비자뿐이다.

  - version: "2.7.0"
    date: "2026-09-03"
    revision: "GATE0-CAP-RAISE"   # 게이트 ⓪ 판정: 변환 상한 4,000자 → 20,000자, 출력 토큰 기본값 16,000 → 64,000
    author: contract-keeper
    change: |
      **게이트 ⓪ 판정(2026-09-03, 사용자): 상한값 재조정.** 분할 변환은 하지 않기로
      했고, 그 대신 상한 자체를 올린다.

      ⑴ **`x-input-limits.max_convertible_chars`·`max_review_chars`가 4,000 → 20,000이다.**
         `DocumentTextRequest.text`·`ConversionReviewRequest.edited_text`의
         `x-service-constraint.max_length`, `POST /documents`·
         `PUT /conversions/{conversion_id}` 422 응답의 `limit`·`description`·예시
         `detail`이 같은 변경 단위로 20,000을 반영한다.
      ⑵ **422 `detail` 문구에서 「(긴 문서 분할 변환은 준비 중입니다)」 꼬리를 뗀다.**
         분할 변환은 하지 않기로 판정이 났으므로 "준비 중"이라는 말이 더 이상 맞지
         않는다 — 두 문구 다 "…자 이하 문서만 변환할 수 있습니다"/"…자 이하여야
         합니다"로 끝난다.
      ⑶ **출력 토큰 구성 기본값이 16,000 → 64,000이다(계약 밖, 참고).** 두
         `application.yml`의 `easydoc.llm.max-output-tokens`(환경변수
         `EASYDOC_LLM_MAX_OUTPUT_TOKENS`) 기본값만 게이트 ⓪ 3차 측정 조건과 같은
         64,000으로 올라간다 — 이것이 제품 운영값이다. `core.llm`의
         `DEFAULT_MAX_TOKENS`는 16,000 그대로다 — 이 상수는 그 구성값이 없을 때만
         쓰이는 **provider 안전 fallback**이라 운영값과 다르게 유지한다: 기본
         provider가 아닌 OpenAI(기본 모델 gpt-4.1, 출력 한도 32,768)로 바뀌어도
         무설정 조립이 항상 성공해야 하기 때문이다. `MAX_OUTPUT_TOKENS_CEILING`
         (64,000)은 그대로다.
    ground: |
      **G3 — 정책 결정.** 게이트 ⓪ 판정(2026-09-03, 사용자) — `docs/master-plan.md`
      §9 근거. 분할 변환 없이 상한 재조정으로 처리한다.
    compatibility: |
      **비파괴 확장이다.** 상한이 늘었을 뿐 검증 방향은 바뀌지 않았다 — 이전에 통과하던
      요청은 계속 통과하고, 20,000자를 넘는 요청만 새로 통과한다(이전에는 4,000자
      초과부터 거절). 422 `detail` 문구가 바뀌었으므로 그 문자열을 그대로 비교하는
      소비자는 갱신이 필요하다.

  - version: "2.6.0"
    date: "2026-09-02"
    revision: "PDF-EXPORT-CHOICE"   # PDF 원본은 사용자가 DOCX·HWPX 중 하나를 골라 내보낸다
    author: contract-keeper
    change: |
      **PDF 원본에 내보내기 경로가 생겼다. PDF 렌더러는 만들지 않는다** — 사용자가
      검수 완료 후 `docx`·`hwpx` 중 하나를 골라 그 형식의 **새 문서**로 받는다
      (2026-09-02 사용자 결정). §6.5의 「PDF 다운로드 기능이 준비되기 전까지 다른
      형식으로의 우회 다운로드를 기본 행동으로 제공하지 않는다」는 *조용한* 대체를
      금지한 것이었고, 이번 변경은 **명시적으로 고른** 두 구조화 형식 사이의 선택이라
      그 금지의 재결정이지 위반이 아니다 — `DESIGN.md` §6.5에 한 문단을 더해 이 재결정을
      적었다.

      ⑴ **`x-export-format-derivation`에 `choices` 신설.** `mapping[source]`이 `null`인
         원본이 고를 수 있는 형식 목록이다. 오늘은 `{ pdf: [docx, hwpx] }` 하나뿐이고,
         정의역 불변식(「`mapping`이 `null`인 키는 여기 반드시, 값을 낸 키는 여기 없어야」)
         은 `DocumentContractNodeTest`가 잰다.
      ⑵ **`enforcement`에 갈래 셋 추가** — `on_absent_with_choices`(생략 거절)·
         `on_choice`(고른 값이 `choices` 안이면 신문서 조립)·`on_choice_mismatch`(그
         밖의 값 집합 안 값 거절). 셋 다 409다 — 사유는 기존 `on_mismatch`·
         `on_null_mapping`과 같다(자원 상태 판정, 소유 은닉과의 순서).
      ⑶ **`ConversionResponse`에 `export_format_choices` 필드 추가.** `export_format`이
         `null`이고 그 원본에 선택지가 있을 때만 비어 있지 않다. `required`에 더했다 —
         키는 항상 있고 값이 빈 배열일 수 있다.
      ⑷ **`FormatPreservationStatus.not_applicable`에 넷째 갈래(PDF)가 생겼다.** PDF는
         원본을 열지 않고 새 문서를 조립하므로 반영이라는 개념 자체가 적용되지 않는다 —
         `format_preservation`이 완료 전후 가리지 않고 즉시 `not_applicable`이다.
      ⑸ **`format_preservation: null`의 둘째 조건(「원본이 PDF다」)이 빠졌다.** ⑷로
         옮겨 갔다 — PDF는 더 이상 판정 보류(`null`) 갈래가 아니다.
      ⑹ **`GET .../export` 409 예시가 둘 늘었다** — `export_format_choice_required`·
         `export_format_choice_mismatch`. 기존 `no_exportable_format` 예시 문구는 PDF를
         이름으로 부르지 않도록 고쳤다 — PDF가 그 갈래를 더 이상 밟지 않기 때문이다
         (오늘 그 갈래를 밟는 원본은 없다).
      ⑺ **`ExportFormat`은 값을 늘리지 않았다.** `pdf`는 여전히 없다 — PDF는 결과
         형식이 아니라 원본 형식일 뿐이고, 나가는 파일은 항상 `docx`나 `hwpx`다.
    ground: |
      **G3 — 정책 결정.** 2026-09-02 사용자 결정: "PDF 원본 문서는 사용자가 DOCX 또는
      HWPX 중 하나를 골라 신문서 조립으로 내보낸다. PDF 렌더러는 만들지 않는다."
      `docs/kotlin-redevelopment-backlog.md` §1.3의 PDF 항목이 이 결정으로 닫힌다.
    compatibility: |
      **비파괴다.** 기존 요청 갈래(PDF가 아닌 원본의 생략·일치·불일치)는 하나도 거절
      방향이 바뀌지 않았다. 새로 거절되는 요청은 **PDF 원본에 한해서만**이고, PDF는
      2.5.1까지 **모든** `format` 값(생략 포함)이 이미 409였다 — 그러니 이번 변경으로
      PDF 원본에 새로 거절당하는 요청은 없다. 오히려 `format=docx`·`format=hwpx`가
      **처음으로 통과한다**(200). `ConversionResponse`에 필드가 하나 늘었다
      (`export_format_choices`, `required`) — 엄격한 스키마 검증기를 쓰는 소비자는
      재생성이 필요하다(React 생성 타입과 같은 사유, 1.6.0 이후 반복된 패턴).

  - version: "2.5.1"
    date: "2026-09-02"
    revision: "TXT-ENCODING-HANGUL-SIGNAL"   # `.txt` 인코딩 판정을 한글 신호 우선으로 못박고, SourceFormat 모순을 고친다
    author: contract-keeper
    change: |
      **두 가지를 한 변경 단위로 고친다. 둘 다 코드 리뷰(Codex, `.txt` 인코딩 finding)가
      짚었고 사용자가 그 자리에서 승인했다.**

      **⑴ `SourceFormat` 설명의 모순을 정정한다.** 2.4.0 이 적은 문장("`txt`는 업로드된
      평문 파일이라 바이트가 있다. 그 차이가 `document_originals`에 행을 남기는지를
      가른다")은 "바이트가 있으면 저장한다"로 읽히는데, 실제로는 `.txt` 원본 바이트를
      `document_originals`에 저장하지 않는다(`DocumentService`, 2.4.0 changelog 본문과
      `FormatPreservationStatus.not_applicable` ⑶ 이 이미 그렇게 적어 놓고도 `SourceFormat`
      쪽 요약 문장만 앞뒤가 안 맞았다). 고친 문장은 `text`·`txt`가 다른 축이 **원본 바이트의
      유무가 아니라 수집 경로**(붙여넣기 대 파일 디코딩)이고, 저장 여부는 **반영할 서식
      구조가 있는지**로 갈린다고 말한다. 값 집합·필드는 바뀌지 않았다 — 산문만 고쳤다.

      **⑵ `.txt` 인코딩 판정 규칙을 계약에 새로 기록한다.** 2.4.0 changelog는 "UTF-8
      우선, 실패하면 CP949"라고만 적고 "이 규칙은 구현 세부이고 계약이 값으로 고정하는
      항목이 아니다"라고 선을 그었다 — 그 전제 자체가 틀렸다. UTF-8 과 CP949 는 서로
      배타적이지 않다: 바이트 `C2 A1 C2 A1` 은 유효한 UTF-8(`¡¡`)이면서 동시에 유효한
      CP949(`징징`)다. "유효한 UTF-8 이 아니면 CP949"로는 이런 바이트열을 결정할 수
      없고, `.txt` 원본은 저장하지 않아 되돌릴 수 없다. 새 필드
      `x-input-limits.txt_encoding_policy`(`legacy_hwp_policy` 옆, 같은 형태)에 판정
      순서를 적었다 — **한글 신호 우선**: 두 인코딩이 모두 성공하면 결과에 한글이 있는
      쪽을 고르고(반례가 그 이유다), UTF-8 BOM 은 한글 유무와 무관하게 그 자체로 UTF-8 을
      확정한다. "한글 포함"은 한글 음절·자모·호환 자모 세 Unicode 블록으로 정의한다.
      Kotlin 구현은 `infrastructure/ingest/TxtExtractor.kt`(`TxtExtractorTest.kt` 가
      반례·판정 순서 다섯 갈래를 각각 테스트로 고정한다).
    ground: |
      **G3 — 정책 결정의 구현.** 2026-09-02 사용자 결정 「한글 신호 우선」의 이행이다.
      ⑴은 기존 사실(원본 미저장)과 기존 문장이 갈린 **오류 정정**이라 G2에 가깝고, ⑵는
      "계약이 값으로 고정하지 않는다"던 종전 판단을 뒤집어 새로 고정하는 조항이므로
      사용자 결정이 직접 근거다(G3).
    compatibility: |
      **비파괴다.** 요청·응답 스키마·상태 코드 어느 것도 바뀌지 않았다 — `.txt` 업로드는
      여전히 통과하거나 거절될 뿐이고 그 판정 결과(어느 인코딩으로 읽혔는가)는 애초에
      응답에 나타나지 않는다. `x-input-limits.txt_encoding_policy`는 **새 필드 추가**이고
      `SourceFormat` 산문 정정은 필드·값 집합에 손대지 않았다. 기존에 「UTF-8 우선,
      실패하면 CP949」로만 알던 소비자가 있다면 그 소비자가 관측하는 바이트 결과는
      한글이 있는 텍스트에서는 이전과 같고(두 인코딩이 다 성공하는 바이트열 자체가
      드물다), 계약이 그 세부를 요구한 적이 없었으므로 이 개정이 기존 계약 위반을
      만들지 않는다.

  - version: "2.5.0"
    date: "2026-09-02"
    revision: "LEGACY-HWP-MESSAGE"   # `.hwp` 거절 문구를 `.doc`와 같은 급으로 올린다
    author: contract-keeper
    change: |
      **`.hwp`(구버전, 5.x)는 계속 미지원이다 — 이 개정은 거절 여부가 아니라 안내 문구를
      바꾼다.** `x-input-limits.supported_upload_formats`는 이 개정에서 한 글자도 바뀌지
      않았다(`[docx, pdf, hwpx, txt]` 그대로) — `.hwp`를 지원 형식에 더하지 않는다.

      전에는 `.hwp` 업로드가 일반 `UNSUPPORTED_FORMAT`("지원 형식: docx, pdf, hwpx, txt")
      만 받았다 — `.doc`가 이미 갖고 있던 것과 같은 급의 **전용 안내**가 없었다. 이번
      개정으로 두 경로 모두 전용 문구를 낸다:
      ⑴ **확장자 경로.** `.hwp`로 올라온 파일은 내용을 열어 보지 않고 확장자만으로
      거절 문구를 정한다(`.doc`도 지금까지 이 경로에서는 일반 문구만 받고 있었다는
      사실이 이번에 드러나, 같은 변경 단위에서 `.doc`도 전용 문구를 받게 했다 — 한쪽만
      특별대우하지 않는다).
      ⑵ **내용 경로.** `.hwpx`(zip이어야 할 확장자)로 이름만 바꿔 올렸지만 내용이 실은
      HWP 5.x OLE2 복합 문서인 경우 — 기존 `Ole2Diagnosis`의 암호화·구버전 `.doc` 판정에
      **세 번째 갈래**를 더해 가려낸다. 서명은 HWP 5.x `FileHeader` 스트림의 32바이트
      ASCII 시그니처 `"HWP Document File"`이며, 한글과컴퓨터 공개 명세(「한글 문서 파일
      형식 5.0」 revision 1.3, 4.1절)와 오픈소스 파서 `pyhwp`의 `HWP5_SIGNATURE` 상수로
      교차 확인했다(`Ole2Diagnosis.kt` KDoc에 출처를 남겼다).

      새 필드 `x-input-limits.legacy_hwp_policy`를 `legacy_doc_policy` 옆에 더했다 — 형태를
      그대로 따랐다(전용 문구를 산문에 그대로 인용).
    ground: |
      **G3 — 정책 결정의 구현.** 2026-09-02 사용자 결정: 「`.hwp`는 미지원으로 유지하되
      안내가 불친절하니 고친다 — 지원 형식으로 추가하는 것이 아니다」. 거절 자체는
      바뀌지 않았으므로 G2(요구사항 미충족)가 아니라 문구 개선이고, `.doc`와 같은 대접을
      요구한 것은 이미 있던 `legacy_doc_policy` 조항의 **적용 범위를 넓힌 것**이지 새
      불변식을 만든 것이 아니다.
    compatibility: |
      **비파괴다.** `supported_upload_formats`·`SourceFormat.enum` 모두 그대로다. 바뀐 것은
      `.doc`·`.hwp` 두 확장자·두 콘텐츠-진단 갈래가 받는 422 `detail` 문자열뿐이고, 이
      문자열은 애초에 계약이 고정값으로 못박은 적이 없었다(`legacy_doc_policy`도 종전에
      "전용 안내 문구와 함께 422"라고만 적었지 값을 다른 곳에서 인용하도록 강제하지
      않았다). 기존에 `.hwp`·`.doc`를 업로드해 일반 `UNSUPPORTED_FORMAT` 문자열을 그대로
      비교하던 소비자가 있다면 그 문자열 비교만 깨진다 — 상태 코드(422)·최상위 키
      (`detail`)는 그대로다.

  - version: "2.4.0"
    date: "2026-09-02"
    revision: "TXT-UPLOAD"   # `.txt` 를 기본 업로드 형식에 더한다
    author: contract-keeper
    change: |
      **`.txt`(평문) 업로드를 지원 형식에 더했다. 비파괴 추가다** — 기존 세 형식(docx·pdf·hwpx)의
      요청·응답은 한 글자도 바뀌지 않았고, 새 값은 두 곳에 **같은 변경 단위로** 늘었다
      (`SourceFormat.enum`이 스스로 요구하는 규칙, 2026-08-12 개정 G1):
      ⑴ `x-input-limits.supported_upload_formats` — `[docx, pdf, hwpx]` → `[docx, pdf, hwpx, txt]`.
      ⑵ `components.schemas.SourceFormat.enum` — `txt` 추가.

      **`text`(붙여넣기)와 `txt`(업로드)는 다른 값이다.** 사용자 결정(2026-09-02):
      「.txt 파일은 기본 업로드 항목이어야 한다」. 기존 `text`를 재사용하지 않은 이유는
      `text`가 "파일이 아니므로 `document_originals`에 원본이 없다"는 불변식을 지고 있고,
      `.txt` 업로드는 원본 바이트가 있어 그 불변식을 깨기 때문이다(Kotlin
      `core/document/SourceFormat.kt`).

      **내보내기·서식 유지 판정.** `x-export-format-derivation.mapping`에 `txt: txt`를
      더했다 — 평문은 반영할 원본 구조가 없으므로 "그대로 나간다"의 가장 단순한 형태이고,
      값을 `null`로 두면(PDF처럼) 사용자가 변환 결과를 **영영 내려받지 못한다** — 렌더러가
      없는 PDF와 달리 평문 렌더러는 이미 있다(붙여넣기가 쓰던 `txt` 렌더러 그대로다).
      `FormatPreservationStatus.not_applicable` 설명에 세 번째 갈래를 더했다 — `.txt`는
      파일이지만 평문에는 애초에 유지할 서식이 없으므로(글꼴·표·머리말 같은 구조가 없다)
      붙여넣기와 같은 사유로 `not_applicable`이다. 그래서 구현은 `.txt`의 원본 바이트를
      `document_originals`에 **저장하지 않는다** — 저장해도 반영할 대상이 없고, 저장하면서
      반영을 구현하지 않으면 "반영할 서식이 없다"와 "저장된 원본을 읽을 수 없다"(500)가
      같은 신호(`hasStoredOriginal`)에 실려 매 내보내기가 오류로 떨어진다.

      **인코딩.** UTF-8을 우선 시도하고 실패하면 CP949(EUC-KR 상위 집합, 한국 공공기관
      `.txt`의 흔한 인코딩)로 재시도한다. 둘 다 실패하면 다른 추출 실패와 같은 방식으로
      거절한다(`DocumentExtractionException`, 손상 파일과 같은 문구) — 계약에 새 오류
      문구를 추가하지 않았다. UTF-8 BOM은 본문에 새지 않게 걷어낸다. 이 규칙은 구현
      세부(`infrastructure/ingest/TxtExtractor.kt`)이고 계약이 값으로 고정하는 항목이
      아니다 — 계약은 "업로드가 통과한다/거절한다"만 정한다.
    ground: |
      **G3 — 정책 결정의 구현.** 2026-09-02 사용자 결정 「.txt 파일은 기본 업로드 항목이어야
      한다」의 이행이다. 값 추가는 `x-change-policy` G1이 이미 허용한 비파괴 변경이고,
      서식 유지 판정을 셋째 갈래로 넓힌 것은 새 원본 형식이 기존 넷(붙여넣기·docx·hwpx·pdf)
      어디에도 딱 맞지 않아 판정 스스로가 요구한 확장이다(G2에 가깝다 — 기존 조항을
      좁히지 않고 새 사실을 반영했다).
    compatibility: |
      **기존 클라이언트가 깨지지 않는다.** 기존 세 형식의 업로드·조회·내보내기 요청·응답이
      전부 그대로다. `SourceFormat`·`x-input-limits.supported_upload_formats` 모두 값을
      **더했을 뿐 빼지 않았다.** 이미 저장된 문서의 `source_format`은 여전히 옛 값 중
      하나이므로 이 변경으로 응답이 달라지는 기존 자원이 하나도 없다.

  - version: "2.3.0"
    date: "2026-08-27"
    revision: "RETENTION-READ-GUARD"   # 만료 창을 「내용을 내주는」 경로 전부에서 닫는다
    author: contract-keeper
    change: |
      **보존 기간이 지난 문서의 내용을 내주는 경로를 전부 404로 닫았다. 파괴적 변경이
      아니다** — 요청 모양도 응답 필드도 그대로이고, 만료되지 않은 자원의 동작은 하나도
      바뀌지 않았다.

      ⑴ **닫은 곳 셋**: `GET /conversions/{conversion_id}` ·
         `GET /conversions/{conversion_id}/export` · `PUT /conversions/{conversion_id}`.
         2.2.0이 `GET /documents/{document_id}/source`에 건 것과 **같은 술어**
         (`retention_expires_at > now()`)이고, 소유 술어와 같은 문장 안에 있다.
      ⑵ **없음·타인·만료가 모두 같은 404다.** 만료가 존재를 드러내면 소유권 은닉이 그만큼
         뚫린다 — 셋이 구분되지 않는 것이 조항이다.
      ⑶ **`PUT`이 특히 중요하다.** 파기 대상 문서에 새 검수본을 쓰면 다음 배치가 방금 쓴
         내용을 지운다. 판정을 저장 전 잠금 질의가 지므로 **아무것도 쓰이지 않는다.**
      ⑷ **`PUT /conversions/{conversion_id}/feedback`도 같은 판정으로 닫힌다.** 그 저장은
         소유·상태 판정을 `GET /conversions/{conversion_id}`에 그대로 위임하므로 별도 술어
         없이 함께 닫혔고, 2.3.0은 **이미 그랬던 동작을 계약에 적는다.** 사유는 위임의
         우연이 아니다: 그 저장은 수정률 지표를 계산하려고 변환 본문을 **복호화해서 읽는다.**
         `conversion_feedback` 표가 파기와 분리돼 있다는 것은 「이미 낸 의견이 남는다」는
         뜻이지 「만료 뒤에도 새로 낼 수 있다」는 뜻이 아니다 — 그 구분을 해당 오퍼레이션의
         `description`에 적었다.
      ⑸ **`GET /documents`(목록)만 열어 둔다. 사용자 결정이다** — 목록은 제목만 싣고,
         문서가 파기됐다는 사실을 사용자가 알아차리는 자리가 목록이다. 만료 직후 목록에서까지
         소리 없이 사라지면 사용자는 이유를 알 수 없다. 남은 항목은 이 하나뿐이고
         `docs/kotlin-redevelopment-backlog.md` §1.1에 있다.
    ground: |
      **G3 — 정책 결정의 구현.** master-plan §3.2가 「기본 보존 30일 후 자동 삭제」를
      약속하는데, 파기는 `RetentionPurgeScheduler`가 **매일 03:00 한 번** 도는 배치라
      만료와 파기 사이의 창이 **최대 24시간**이다. 2.2.0은 그 창을 원문 조회에서만 닫으며
      "다른 조회는 마스킹을 거친 결과"라고 적었는데 **그것이 틀렸다** —
      `GET /conversions/{conversion_id}`는 `masked_items[].original`로 가려졌던 실제
      주민등록번호·카드번호를 **평문으로** 돌려준다(`MaskedItemResponse`가 명시한다).
      노출 크기만 다를 뿐 범주는 원문 조회와 같다. 2026-08-27 사용자 결정으로 범위를
      「내용을 내주는 경로 전부, 목록은 제외」로 정했다.
    compatibility: |
      **기존 클라이언트가 깨지지 않는다.** 만료되지 않은 자원에서는 요청·응답이 완전히
      그대로다. 달라지는 것은 **만료됐지만 아직 파기되지 않은** 자원뿐이고, 그 자원은
      배치가 도는 순간 어차피 404가 된다 — 이 변경은 그 시점을 만료 시각으로 당긴다.
      프런트는 이미 이 경우의 문구를 갖고 있다(「보관 기간이 지나 파기됐거나 지워진
      문서입니다. 다시 불러와도 결과는 같습니다.」).

  - version: "2.2.0"
    date: "2026-08-27"
    revision: "DESIGN-6.4-SOURCE"   # §6.4 비교 화면의 **왼쪽 절반**
    author: contract-keeper
    change: |
      **추출된 원문을 다시 읽는 경로가 생겼다. 파괴적 변경이 아니다** —
      기존 오퍼레이션은 요청 모양도 응답 필드도 하나 바뀌지 않았다.

      ⑴ **`GET /documents/{document_id}/source` 신설.** 응답은 새 스키마
         `DocumentSourceResponse`이고 `document_id`·`source_format`·`char_count`·
         `source_text` 넷이 전부다. 소유자만 200이고 없거나 남의 것이면 **404**다
         (403이 아니다 — 존재를 숨긴다).
      ⑵ **`ConversionResponse`에 원문을 얹지 않았다.** 그 응답은 변환 완료를 기다리며
         2초 간격으로 폴링되는 자리라 수천 자 본문을 매 폴링마다 실어 보내게 된다.
         원문은 문서 등록 시점에 확정되고 그 뒤 바뀌지 않으므로 한 번만 가져오면 된다.
      ⑶ **`DocumentListItem`에는 싣지 않는다.** 목록은 한 번에 여러 문서를 돌려주는
         자리라 원문을 얹으면 응답 크기가 문서 수만큼 곱해지고, 목록 화면은 본문을
         그리지 않는다.
      ⑷ **`x-private-response-headers.applies_to`에 등록했다.** 저장된 원문은 마스킹
         **전**이라 주민등록번호·카드번호가 본문 안 어디에 있든 그대로 실린다 —
         이 목록에서 개인정보가 가장 날것으로 실리는 자리이고, 그래서 열거에서
         빠지면 안 된다.
      ⑸ **보존 기간이 지난 문서는 파기 전이라도 404다.** 파기는 워커 배치가 실제로 행을
         지울 때 일어나 만료와 다음 배치 사이에 창이 열리는데, 이 응답은 마스킹 전 문서
         전문이라 그 창에서 나가는 양이 다른 조회와 다르다. 술어는
         `retention_expires_at > now()` — 파기 배치 술어(`<= now()`)의 정확한 여집합이다.
         **같은 판정을 내용을 내주는 나머지 세 오퍼레이션에도 걸었다** — 2.3.0이 그 자리다.
      ⑹ **엔드포인트 수가 15 → 16이다.**
    ground: |
      **G3 — 정책 결정의 구현.** `DESIGN.md` §6.4가 검수 화면을 "원문과 AI 초안을
      나란히 놓고 비교하는 자리"로 정했는데, 원문은 문서 등록 이후 어떤 응답에도
      실린 적이 없었다. 그래서 붙여넣기 직후의 한 화면 밖 — 파일 업로드, 변환 기록
      재진입, **새로고침** — 에서는 비교 대상 자체가 없었다. 사용자가 이것을 고쳐
      달라고 요청했다(2026-08-27).
    compatibility: |
      **기존 클라이언트가 깨지지 않는다.** 오퍼레이션이 하나 늘었을 뿐 기존 경로의
      요청·응답이 그대로다. 새 표면을 여는 것이 아니라는 근거는 `applies_to`의
      `x-why-these-ten`에 적었다 — 같은 소유자에게 `GET /conversions/{conversion_id}`가
      이미 `masked_items[].original`로 가려졌던 실제 값을 돌려주고 있다.
  - version: "2.1.0"
    date: "2026-08-26"
    revision: "DESIGN-6.5-PRESERVE"   # §6.5 의 본체 — 2.0.0 이 예고한 「원본 서식 유지」
    author: contract-keeper
    change: |
      **원본 DOCX·HWPX 구조에 검수본을 반영해 내보낸다. 파괴적 변경이 아니다** —
      기존 요청 갈래는 하나도 거절되지 않고, 응답 필드도 늘지 않았다.

      ⑴ **`FormatPreservationStatus`에 값 셋이 돌아왔다** — `available`·`partial`·`failed`.
         1.6.0이 넷을 빼며 "구조 보존이 서면 그때 이 enum에 값을 더한다(비파괴 추가)"고
         적었고, 이번이 그 시점이다. **각각의 배제 사유가 해소된 방식**은 이렇다.
           - `available` — 1.6.0의 사유는 "내보내기가 원본 바이트를 읽지 않고 새 문서를
             만든다"였다. 이제 원본을 열어 **그 구조를 고쳐** 내보내므로 유지되는 원본
             요소가 실재한다. 낙관적 추측이 아니라 **짝이 정확히 맞았다는 관측**이다.
           - `partial` — 사유는 "원본 구조 분석기가 없다"였다. 이제 원본 단위를 세고
             검수본 문단과 맞춰 보므로 무엇이 얼마나 달라지는지 개수로 말할 수 있다.
           - `failed` — 사유는 "내보내기가 오늘 성공한다"였다. 이제 저장된 원본을 열지
             못하면 내보내기가 **실제로 실패한다**(500). 실패하는 경로가 생겼다.
      ⑵ **`checking`은 되살리지 않았다.** 1.6.0의 사유가 그대로 유효하다 — 이 판정은
         조회 한 번 안에서 **동기로** 끝나므로 클라이언트가 지켜볼 진행 상태가 없다.
         비동기 분석 단계를 만들지 않았고, 만들 이유도 없었다(판정의 재료는 이미 그
         조회가 복호화하는 값이다). 완료 전에는 이 enum의 값이 아니라 `null`이다.
      ⑶ **`format_preservation: null`의 조건이 바뀌었다.** 「원본은 있는데 분석기가 없다」가
         사라지고 「완료 전이라 짝지을 검수본이 없다」와 「원본이 PDF라 반영 대상이 없다」
         둘이 남았다. **필드의 뜻(「서버가 아직 판정하지 않았다」)은 바뀌지 않았다.**
      ⑷ **`details`가 실제로 채워진다.** 담기는 것은 여전히 구조 요소의 종류와 개수뿐이고,
         구현에서 문서 본문이 끼어들 형식 인자가 하나도 없다.
      ⑸ **`GET .../export`에 500 갈래를 명시했다.** 상태 집합은 늘지 않았다(500은 이미
         있었다) — 어느 경우에 그 코드가 나는지를 적었고, `InternalError`에 그 고정 문구
         예시를 더했다. §6.5의 "텍스트 전용 파일로 조용히 대체하지 않는다"가 그 자리다.
      ⑹ **`ExportFormat`은 값을 늘리지 않았다.** `pdf`는 여전히 없다(렌더러가 없다).
      **응답 상태 집합도 필드 집합도 그대로다** — enum 값 셋과 산문만 늘었다.
    ground: |
      **G3 — 정책 결정의 구현.** `DESIGN.md` §6.5가 "원본 문서의 문단, 표, 이미지 위치에
      검수한 쉬운 글을 반영합니다"와 네 상태의 UX를 정했고, 1.6.0이 "근거가 설 때 되살린다"고
      예고한 자리다. 되살린 값마다 **그 근거가 무엇인지**를 위 `change`에 적었다.
    compatibility: |
      **기존 클라이언트가 깨지지 않는다.** 요청 모양이 그대로이고 응답 필드도 그대로다.
      다만 `format_preservation.status`에 **처음 보는 값**이 올 수 있다 — 생성된 React
      union이 넓어지므로 그 값을 다루지 않는 화면은 컴파일 시점에 드러난다.

  - version: "2.0.0"
    date: "2026-08-26"
    revision: "DESIGN-6.5-ENFORCE"   # §6.5 의 **쓰기 절반** — 1.6.0 이 예고한 그 조각
    author: contract-keeper
    change: |
      **내보내기 형식을 서버가 원본에서 강제한다. 이것은 파괴적 변경이다** —
      지금까지 통과하던 요청 갈래가 오늘부터 거절된다.

      ⑴ **`GET /conversions/{conversion_id}/export`의 `format`이 `required: false`가 됐다.**
         생략이 기본 경로이고, 그때 서버가 `x-export-format-derivation.mapping`으로 정한다.
      ⑵ **값을 주면 그 변환의 `export_format`과 같아야 한다.** 값 집합 안이지만 다른 값은
         **409**다. 상태 코드를 고른 근거는 `x-export-format-derivation.x-why-409-and-not-422`
         — 요약하면 ⓐ 판정이 행을 읽어야 서는 **자원 상태**이고 ⓑ 422로 두면 검증 층이
         소유 확인보다 먼저 답해 「남의 문서는 DOCX가 아니다」가 샌다.
      ⑶ **원본이 PDF인 변환은 내보낼 수 없다** — `export_format: null`이고 **어떤 값도,
         생략도** 409다. 새 문구 하나(`no_exportable_format`)를 그 자리에 뒀다.
      ⑷ **`format` 누락의 422 갈래가 폐기됐다.** 누락은 오류가 아니라 기본 경로다.
         422는 **`ExportFormat` 밖의 값**에만 남는다. 폐기 사실은
         `x-export-format-derivation.x-superseded`가 안는다 —
         `x-retired-responses`가 아닌 이유는 **상태 코드가 아니라 그 코드의 한 갈래**가
         내려갔기 때문이고, 그 구분은 `x-retired-503-configurations` 머리 주석의 규칙 그대로다.
      ⑸ **`enforcement` 블록 신설** — `x-export-format-derivation` 안이다. 처분(어느
         갈래가 어느 상태 코드인가)을 **기계가 읽을 수 있게** 두었다. 오퍼레이션 산문은
         이 키들을 설명하고 규칙을 옮겨 적지 않는다 — 두 자리에 적으면 한쪽만 바뀐다.
      ⑹ **`ExportFormat`은 값을 늘리지 않았다.** `pdf`는 여전히 없다(렌더러가 없다).
         PDF 원본의 처분은 값 추가가 아니라 409로 말한다.
      ⑺ **`ConversionResponse.export_format` 설명에서 「강제하지 않는다」를 걷어냈다.**
         1.6.0이 그 단서를 「다음 조각에서 사라진다」고 적어 두었고, 이번이 그 조각이다.
         **필드의 정의는 바뀌지 않았다** — 그것이 1.6.0 `rationale` ③이 셋째 갈래를 고른
         값어치다.
      **응답 상태 집합은 늘지도 줄지도 않았다** — 200·401·404·409·422·500·503 그대로다.
    ground: |
      **G3 — 정책 결정이 바뀌었다.** `DESIGN.md` §6.5가 "현재처럼 클라이언트가
      `format=docx|txt|hwpx`를 임의 선택하게 두지 않는다. 기존 쿼리 파라미터를 유지해야
      한다면 원본과 다른 값을 거절하고, 가능한 값은 서버 응답의 `export_format`과 일치해야
      한다"고 정했고, §13 4단계가 그 강제를 **서버에서** 하라고 못박았다("텍스트→TXT,
      DOCX→DOCX, HWPX→HWPX, PDF→PDF 규칙을 서버에서 강제"). G2로도 성립하지만
      1차 근거는 설계 문서의 정책 결정이다.
    escalation: |
      **`x-change-policy.escalate_to_leader` 2번에 걸린다** — React 런타임 코드
      (`ReviewEditor.tsx`의 3버튼)가 이미 의존하는 동작이 바뀐다. 계약 소유자가 단독으로
      정하지 않았다: 근거는 사용자 승인 설계 문서 `DESIGN.md` §6.5·§13 4단계·§14 완료
      기준("입력 형식과 다른 교차 형식 내보내기가 라이브 기능처럼 보이지 않는다")이며,
      이번 조각의 지시가 그 이행이다. 계약이 정책을 만들지 않았고 따라갔다.
    rationale: |
      **① 왜 `required`를 풀었나 — 버린 두 선택지의 대가.**
      §6.5는 "기존 쿼리 파라미터를 유지해야 한다면"이라고 **조건부로** 적었으므로 셋 중
      하나를 골라야 했다.

      - **⑴ required 유지 + 불일치 거절**(버림). 서버가 아무것도 «결정»하지 않는다 —
        클라이언트가 여전히 형식을 **이름 대야** 하고, 맞히려면 먼저 조회해야 하니
        왕복이 하나 는다. §6.5의 첫 문장("서버가 원본 형식으로부터 결과 형식을 결정하는
        것을 **기본으로** 한다")이 요구하는 기본값이 서지 않는다. **PDF 원본에서는 더
        나쁘다**: 필수인데 통과하는 값이 **하나도 없는** 파라미터가 된다.
      - **⑶ 파라미터 제거**(버림). 가장 순수해 보이지만 **가장 위험하다.** OpenAPI에도
        Spring에도 「선언되지 않은 쿼리는 무시」가 기본이라, 제거하면 `?format=pdf`가
        조용히 무시되고 DOCX가 나간다 — §6.5가 금지한 **조용한 대체**를 계약이 만든다.
        막으려면 미선언 쿼리 거절이라는, 이 계약 어디에도 없는 장치를 새로 세워야 한다.
      - **⑵ optional + 일치 강제**(고름). 생략이 기본 경로라 §6.5의 기본값이 서고,
        직접 URL·북마크가 동작하며, PDF 원본에서 「보낼 값이 없다」가 자연스럽다.
        준 값은 **주장**으로 취급해 다르면 소리 내어 거절한다.

      **required → optional 자체는 비파괴다**(요청 제약 완화). 파괴적인 것은 어느 선택지를
      골랐든 같은 몫, 즉 **불일치 거절**이다.

      **② 왜 409이고 422가 아닌가.** 정본은 `x-export-format-derivation.x-why-409-and-not-422`.
      여기서 다시 적지 않는다.

      **③ 왜 PDF도 409인가 — 「미구현」이 아니라 「이 자원은 못 한다」.**
      501은 **메서드**가 구현되지 않았다는 뜻이라 틀리고, 이 경로는 DOCX·HWPX·TXT 원본에서
      멀쩡히 200을 낸다. 못 하는 것은 **이 변환**이고 그 사유는 이 변환의 `source_format`이다.
      자원 상태에 달린 거절이므로 다른 셋과 같은 409다.

      **④ 왜 불일치 문구가 형식 이름을 말하지 않는가.** 문구는 상수 하나다
      (`"원본과 같은 형식으로만 내려받을 수 있습니다"`). 옳은 값은 이미 조회 응답의
      `export_format`에 있고, 그 값을 오류 문구에 **또** 실으면 정본이 둘이 된다.
    version_note: |
      **1.6.0 → 2.0.0.** 이 계약의 **첫 major bump**다.

      1.1.0~1.6.0의 선례는 「나가는 바이트가 바뀌면 minor를 올린다」였고 그 항목들은 전부
      **비파괴**였다(추가·이동·상태 집합 축소). 이번은 다르다: **지금까지 200이던 요청이
      409가 된다.** minor로 두면 "1.x 안에서는 깨지지 않는다"는 선례가 조용히 거짓이 된다.

      **major가 뜻하는 것은 「문서 개정이 호환되지 않는다」이지 「API가 v2가 됐다」가
      아니다.** 경로 접두사도(`/api`도 `/v2`도 없다) `openapi:` 필드도 오퍼레이션 id도
      그대로이며, v1과 v2를 나란히 서비스하지 않는다. 이 파일은 여전히 「외부 HTTP 계약 v1」이고
      `info.version`은 그 **문서의 판번호**다.

      ⚠ **버전 규칙은 아직 계약에 없다**(1.3.0 `version_note`가 남긴 경고 그대로 —
      `x-change-policy`에 `versioning` 키가 없고 그 신설은 별도 작업 C6이다). 이 bump는
      「파괴적이면 major」라는 semver의 평이한 독법을 따른 것이며, 규칙이 서는 날
      **이 항목과 1.3.0을 소급 대조**해야 한다.
    react_impact: |
      **런타임 파손 2건 — 이번 변경 단위에서 함께 고쳤다.**
        - `frontend/src/components/ReviewEditor.tsx` — `DOWNLOAD_FORMATS` 상수
          (`['docx','hwpx','txt']`)가 원본과 무관하게 버튼 셋을 그렸다. 붙여넣기 문서에서
          `docx`·`hwpx` 버튼은 이제 **반드시 409로 실패한다.** 목록의 출처를 상수에서
          `conversion.export_format`으로 **바꿨다** — `null`이면 내려받기 버튼이 없다
          (§6.5 "화면은 이 `null`을 보고 내려받기 행동을 제시하지 않는다").
          **버튼 하나의 모양·문구·`원본 서식 유지` 패널은 이 단위에서 바꾸지 않았다** —
          그것은 §13 4단계의 다음 조각이다.
        - `frontend/src/api/client.ts::downloadExport` — 시그니처는 그대로 두었다.
          화면이 `export_format`을 그대로 넘기므로 **보내는 값이 언제나 일치**한다.
          계약이 생략을 허용하게 됐다는 사실은 KDoc에 적었다.
      `frontend/src/api/types.ts`는 **바뀌지 않는다** — 값 집합도 필드도 그대로다.
    affected_tests: |
      - `ConversionExportContractTest` — 「형식마다 성공」이 **한 문서에 세 형식**을 던지고
        있었다. 그 문서는 붙여넣기라 이제 `txt`만 통과한다. 원본 형식마다 문서를 만들어
        그 형식으로 내보내는 대조로 바꾼다. 「형식 누락 → 422」는 **뒤집힌다**(누락이
        기본 경로다). 불일치 409·PDF 409·소유 은닉 우선(404) 케이스를 더한다.
      - `ConversionExportReachTest` — 같은 이유로 실제 DOCX·HWPX·PDF 업로드를 지나야
        한다(`UploadFixtures`). 「없는 것과 남의 것이 구분되지 않는다」는 불일치 형식으로도
        404여야 한다 — 그것이 409를 고른 둘째 근거의 실측이다.
      - `ConversionFormatContractTest` — `enforcement` 블록과 구현 처분의 대조를 더한다.
      - `ConversionExportServiceTest`(application) — 유스케이스 층의 거절 순서.
      - `PrivateHeaderFloorCensusTest` — 헤더를 재려고 `ExportFormat` 값 집합의 **첫 값**을
        붙이고 있었다. 그 값(`docx`)은 붙여넣기 문서에서 이제 409라 헤더를 성공 경로에서
        재지 못한다. **`format`을 아예 붙이지 않는** 요청으로 바꾼다 — 생략이 원본과
        무관하게 200을 내는 경로다. 이 대조가 재는 것은 형식이 아니라 헤더다.
      - `frontend/src/components/ReviewEditor.test.tsx` — 버튼 목록이 `export_format`을
        따르는지, `null`에서 버튼이 없는지.
      - `frontend/e2e/conversion-flow.spec.ts` E13은 **그대로 통과한다** — 붙여넣기라
        `export_format`이 `txt`이고 화면이 그 값으로 버튼 하나를 그린다.
    notified: [kotlin-implementer, 리더]

  - version: "1.6.0"
    date: "2026-08-26"
    revision: "DESIGN-6.5-READ"   # §6.5 「필요한 계약 정보」의 **읽기 절반**
    author: contract-keeper
    change: |
      **변환 조회 응답이 원본 형식과 출력 형식을 말하게 했다 — 추가와 이동만 있고
      나가는 바이트의 기존 값은 하나도 바뀌지 않는다.**

      ⑴ **`ConversionResponse`에 필드 셋 추가** — `source_format`(비-null) ·
         `export_format`(nullable) · `format_preservation`(nullable). `required`가
         열셋에서 **열여섯**으로 늘었다. 「키는 항상 있고 값이 null일 수 있다」 규칙 그대로다.
      ⑵ **`SourceFormat` 컴포넌트 신설** — `DocumentListItem.source_format`의 인라인
         enum을 **옮긴** 것이다. 값 집합 `[text, docx, pdf, hwpx]`는 한 글자도 다르지
         않고, 2026-08-12 개정의 근거 산문도 그대로 옮겼다. 두 응답이 같은 값 집합을
         쓰게 됐으므로 인라인 두 벌은 한쪽만 늘어나는 날을 예약하는 일이다.
      ⑶ **`FormatPreservationStatus`·`FormatPreservation` 신설.** 상태 enum은
         **`not_applicable` 하나뿐이다.** `DESIGN.md` §6.5가 제시한 다섯 중 넷
         (`available`·`partial`·`checking`·`failed`)을 **뺐고**, 각각을 뺀 사유를 그
         컴포넌트 안에 적었다. 요약하면 오늘 내보내기는 원본 바이트를 읽지 않고 제목·본문으로
         새 문서를 만들기 때문에 「유지 가능」도 「일부 유지」도 근거가 없고, 시작하지 않는
         분석의 「확인 중」과 실패한 적 없는 「유지 실패」는 화면에 끝나지 않는 상태를 만든다.
      ⑷ **`ConversionResponse.description`과 `GET /conversions/{conversion_id}`의
         `description`에 「형식 셋은 결과 필드가 아니다」를 적었다.** 완료 전에 나가는 것이
         넷에서 **일곱**으로 늘었다는 뜻이고, 그 분모를 계약에서 읽는 대조가 있다
         (`affected_tests`).
      ⑸ **`ExportFormat`은 값을 늘리지 않았다.** `pdf`를 넣지 않는 사유를 그 자리에
         **명시적으로 적었다** — 이전에는 "범위 밖"이라고만 적혀 있어 다음 조각이 무심코
         넣을 수 있었다. 원본이 PDF인 변환은 `export_format: null`로 그 부재를 말한다.
      ⑹ **`GET /conversions/{conversion_id}/export`는 한 글자도 바꾸지 않았다.**
         `format` 쿼리는 여전히 **필수**이고 값 집합도 `docx|txt|hwpx` 그대로다. 서버가
         원본에서 형식을 강제하는 것(§6.5 "원본과 다른 값을 거절하고")은 **다음 조각**이며,
         그 사실을 `export_format` 설명이 안고 있다.
    ground: |
      **G2 — 요구사항이 그것을 요구한다.** `DESIGN.md` §6.5 「필요한 계약 정보」가 네 가지를
      이름으로 지목했고, 그중 셋이 조회 응답에 **없었다.** 없으면 검수 화면이 「무슨 형식으로
      내려받는가」를 화면 전환 상태(업로드 직후의 메모리)로만 알 수 있고, 직접 URL 진입과
      새로고침에서 그 사실이 사라진다. 취향이 아니라 §6.5 첫 문장의 선결이다.

      직전 커밋이 `document_originals`를 세워 원본 바이트를 저장하기 시작한 것이 이 조각의
      선행 조건이었다 — 「원본이 있는가」를 서버가 알게 된 뒤에야 `format_preservation`을
      추측 없이 말할 수 있다.
    rationale: |
      **① 왜 `format_preservation`이 nullable인가 — 그리고 `null`이 무엇을 뜻하는가.**
      §6.5는 "상태는 낙관적으로 추측하지 않는다. 서버가 제공한 결과만 표시한다"고 정한다.
      원본 구조 분석기가 없는 오늘, 원본 바이트가 **있는** 문서에 대해 서버가 정직하게 낼
      수 있는 상태는 없다. 그때 다섯 값 중 아무거나 고르는 것은 전부 추측이므로 **아무것도
      제공하지 않는다** — 그것이 `null`이다. 「유지 불가」로 접지 않는 이유는 그것도 판정이기
      때문이다: 원본이 남아 있으므로 나중에 판정이 설 수 있다.

      **② 왜 그런데도 enum이 비어 있지 않은가.** 원본 바이트가 **없는** 문서에 대해서는
      서버가 오늘 확실히 안다 — 유지할 것이 없다. 붙여넣기는 파일이 아니었고, 표가 서기 전에
      올라온 문서는 바이트가 이미 사라졌다. 둘 다 **영구히 참**이라 구조 보존이 구현된 뒤에도
      뒤집히지 않는다. 판정 기준을 `source_format == text`가 아니라 **원본 행의 유무**로 둔
      것이 이 둘째 갈래를 덮는다.

      **③ 왜 `export_format`이 「요청해야 하는 값」인가.** 두 갈래가 있었다.
      「지금 반드시 나오는 값」으로 정의하면 오늘 거짓이다 — 클라이언트가 `format`을 임의로
      고를 수 있고 서버가 막지 않는다. 「앞으로 될 값」으로 정의하면 계약이 아직 없는 강제를
      약속한다. 셋째 갈래를 골랐다: **서버가 원본에서 유도한, 클라이언트가 요청해야 하는
      형식.** 이 정의는 오늘 참이고(유도는 실재하고 안정적이다), 다음 조각이 강제를 붙이면
      **정의를 바꾸지 않고** 그대로 「나오는 값」이 된다. 유일한 대가는 "서버가 아직 강제하지
      않는다"를 계약이 소리 내어 말해야 한다는 것이고, 그것은 적었다.

      **④ 왜 PDF가 `null`이고 `txt`가 아닌가.** 대체 형식을 실으면 계약이 우회 다운로드를
      **권하는** 것이 된다. §6.5는 그것을 금지한다("다른 형식으로의 우회 다운로드를 기본
      행동으로 제공하지 않는다"). `null`은 「이 변환에는 내려받기 행동이 없다」를 화면이
      추측 없이 읽을 수 있는 유일한 값이다.

      **⑤ 왜 `SourceFormat`을 컴포넌트로 뽑았고, 그것이 왜 비파괴인가.** `ConversionStatus`
      (2026-08-12)와 `PublishIntent`(1.5.0)가 같은 판정을 받은 자리다 — React 생성 타입이
      이름으로 부르는 union이어야 화면이 문자열 리터럴을 복제하지 않는다. 와이어에서 보면
      `$ref`는 인라인 enum과 **같은 스키마**이고 값 집합이 그대로라, 소비자가 받는 바이트도
      받아들여야 하는 값도 달라지지 않는다.
    version_note: |
      **1.5.0 → 1.6.0.** `ConversionResponse`에 필드 셋이 늘고 컴포넌트 셋이 새로 서므로
      React 생성 타입이 달라진다 — 1.5.0과 같은 기준이다.
      **비파괴다** — 기존 경로·상태 코드·필드 이름·문구·값 집합이 하나도 바뀌지 않았고
      `required`는 넓어지기만 했다(응답의 required 확장은 소비자에게 안전하다).
      `DocumentListItem.source_format`의 enum 이동은 **와이어에서 무변화**라 이 상향의
      사유가 아니다(1.4.0의 두 항목이 버전을 올리지 않은 것과 같은 기준이며, 이번에는
      필드 추가 쪽이 사유다).
    react_impact: |
      `frontend/src/api/types.ts`에 `SourceFormat`·`FormatPreservationStatus`·
      `FormatPreservation` 타입이 서고 `ConversionResponse`에 필드 셋이 는다.
      `DocumentListItem.source_format`은 `string`에서 `SourceFormat` union으로 좁아진다 —
      계약이 2026-08-12부터 enum이었는데 프런트 타입만 넓게 남아 있던 자리를 맞춘 것이다.
      **화면 코드는 이 변경 단위에서 바꾸지 않는다.** 검수 화면의 `원본 서식 유지` 패널과
      「DOCX로 내려받기」 버튼(§6.5)은 뒤 조각이며, 그전에 타입이 먼저 서 있어야 그 조각이
      화면 상태를 지어내지 않는다. 실측(2026-08-26): `frontend/src` 전체에서
      `source_format`을 읽는 화면 코드는 여전히 없다.
    affected_tests: |
      **이 계약 변경이 분모를 바꾸는 대조들이다.**
      - `ConversionReadContractTest` CR-1 — 최상위 키 집합을 `ConversionResponse.required`와
        **직접 대조**한다. DTO가 따라오기 전까지 빨갛다. 그것이 이 장치의 의도다.
      - `ConversionReadContractTest`의 「결과 필드 아홉」 대조 — 분모가
        `required - BEFORE_DONE_FIELDS`다. 완료 전에 나가는 것이 넷에서 **일곱**으로 늘었으므로
        그 집합을 함께 넓힌다. 넓히지 않으면 형식 셋이 「완료 전에 실리면 안 되는 값」으로
        잘못 분류돼 빨갛다.
      - `DocumentListReachTest` DL-3 — `DocumentListItem.properties.source_format.enum`을
        **경로로 직접** 읽고 있었다. `$ref`가 되었으므로 `$ref`를 따라가는 조회로 바꾼다
        (`ContractSpec.schemaPropertyEnumResolved`).
      - **신규 `ConversionFormatContractTest`** — 형식 셋의 값이 전부 계약에서 나온다는 대조.
        Kotlin `SourceFormat`·`ExportFormat`·`FormatPreservationStatus`가 계약 enum을
        **정확히** 덮는지, 유도 규칙(`source → export`)의 상과 정의역이 계약 값 집합 안인지,
        `format_preservation` 객체의 키 집합이 계약 `required`와 같은지를 잰다.
      - `ConversionReadReachTest` — 붙여넣기(`text`)와 DOCX 업로드 두 갈래에서 실제 DB를
        거쳐 나온 형식 셋을 계약과 대조한다.
      - `x-input-limits.supported_upload_formats` ↔ `SourceFormat` 대조
        (`UploadFormatContractTest`)는 그대로다 — 그 목록은 옮기지 않았다.
    notified: [kotlin-implementer, 리더]

  - version: "1.5.0"
    date: "2026-08-26"
    revision: "PILOT-GATE-1"   # 파일럿 게이트 ① 판정 수단 — 리더 지시
    author: contract-keeper
    change: |
      **파일럿 피드백 엔드포인트 하나를 세웠다 — 추가만 있고 기존 조항의 값은 하나도 바뀌지 않는다.**

      ⑴ **경로 `PUT /conversions/{conversion_id}/feedback` 신설(#15).** `put` 하나뿐이고
         `get`은 두지 않았다 — 재방문 시 이전 값 복원은 이번 범위 밖이며, 필요해지면
         **같은 경로에 `get`을 더한다**는 것을 그 오퍼레이션 서술에 적었다.
         응답은 200·401·404·409·415·422·500·503이고, **404·409의 문구는 기존
         `PUT /conversions/{conversion_id}`와 같은 값**이다(같은 사유에 문구를 새로 만들면
         한 API 안에서 같은 상황이 두 문장으로 갈린다).
      ⑵ **스키마 셋 신설** — `PublishIntent`(독립 enum) · `ConversionFeedbackRequest` ·
         `ConversionFeedbackResponse`. `ConversionResponse`(열세 필드 고정)와
         `ConversionReviewRequest`는 **건드리지 않았다.**
      ⑶ **`x-input-limits.max_feedback_comment_length: 500`** 추가(초과 시 422 문자열).
      ⑷ **`x-private-response-headers.applies_to`에 새 오퍼레이션 추가** — 하한선이 한 자리
         늘었다. **넓히는 방향이라 `invariants` 축소가 아니다**(`invariants_note`).
      ⑸ **`x-stored-text-domain.applies_to`에 `ConversionFeedbackRequest.comment` 팔 추가**
         (`status: pending` — 오늘 재지 않았다. 남아 있다는 것 자체가 마감 목록이다).
      ⑹ **`x-unsupported-media-type.x-measured.not_reached`에 새 오퍼레이션을 적었다** —
         본문을 받으므로 415를 선언하지만 구현이 없어 그것은 선언이지 측정이 아니다.
      ⑺ **개수를 세는 산문을 정리했다.** 두 갈래로 갈라 처리했다:
         - **수 자체가 주장인 자리는 수를 고쳤다** — `info.description`의 엔드포인트 수
           (14→15, 제품 13→14)와 `x-retired-responses`의 「14개 오퍼레이션 중 동기로 LLM을
           부르는 것이 없다」(→15). 후자의 주장은 새 오퍼레이션에서도 그대로 참이다.
         - **하한선·컴포넌트 사용처를 세던 산문은 수를 지웠다** — 「헤더 선언 10건」
           (`info.description`) · 「고위험 10곳」(`x-change-policy.invariants`) · 「10곳 목록」
           (`x-global-response-headers` 머리 주석·`enforcement`) · 「고위험 10곳」·「이 10곳의
           개별 contract test」(`x-private-response-headers` 머리 주석) · 「이 열 자리」·
           「헤더 선언 10건과 1:1」(`x-why-these-ten`) · 「13개 오퍼레이션이 선언하므로 13곳이
           인용한다」(`ServiceUnavailable`). 다시 세지 않은 이유는 **게이트 28 P-5와 같다** —
           목록이 늘어나는데 서수를 옮겨 적은 자리들이 따라오지 않으면 계약 자체로 무엇이
           참인지 결정할 수 없게 된다. 개수 대조는 산문이 아니라 `PrivateHeaderFloorCensusTest`
           와 `MIN_PRIVATE_HEADER_TARGETS`가 한다.
         - **키 이름 `x-why-these-ten`·`x-origin-of-the-ten`은 그대로 뒀다.** 목록이 열
           자리이던 때를 가리키는 **안정 id**이며, 이름을 다시 세면 이 파일과 리뷰 기록의
           인용이 함께 어긋난다. 두 자리에 그 사실을 적었다.
         - `x-changelog`의 **과거 항목은 고치지 않는다** — 그때의 수는 그때 참이었다.
      ⑻ **새 오퍼레이션의 번호는 #15다** — 자리는 `#9` 다음이지만 뒤 번호를 밀지 않았다.
         `x-stored-text-domain`이 이미 「마감은 #8을 구현하는 단위다」로 서수를 인용하고
         있어, 다시 세면 그 인용이 조용히 다른 것을 가리킨다(같은 P-5 처방).
    ground: |
      **G2 — 요구사항이 그것을 요구한다.** `docs/master-plan.md` §9 게이트 ①(파일럿 실무자
      검증 → 단계 2 진행)을 판정하려면 「배포 의향」과 「1건 소요 시간」이 필요한데 그 값을
      받을 자리가 계약에 **없었다.** `docs/pilot-runbook.md` 「기록 방법」이 검수 화면의 폼
      제출 한 번을 유일한 수기 입력으로 정하고 있으므로, 그 제출을 받는 HTTP 자리가 서야
      파일럿을 시작할 수 있다. 취향이 아니라 게이트의 선결이다.
    rationale: |
      **① 왜 POST가 아니라 PUT인가.** 한 변환의 피드백은 1건이고 자원이 변환당 하나로
      정해져 있어 만드는 자리와 고치는 자리가 같다. 폼 재제출·네트워크 재시도로 한 변환에
      두 건이 쌓이면 게이트 ①의 **분모(10건)**가 조용히 부풀고 그 오염은 집계 시점에
      되돌릴 수 없다. 멱등 upsert는 그 위험을 프로토콜 층에서 없앤다.

      **② 왜 `get`이 없는가.** 지금 필요한 것은 판정 데이터를 받는 것뿐이고 조회는 집계
      스크립트가 DB에서 한다. 쓰지 않을 오퍼레이션을 미리 세우면 구현·테스트·프런트 타입이
      함께 늘고 그중 무엇도 게이트를 앞당기지 않는다. 필요해지면 **같은 경로**에 더한다.

      **③ 왜 파생 지표를 응답에 싣지 않는가.** 편집 거리·글자 수는 판정용 집계 값이지
      사용자에게 보여 줄 값이 아니다. 검수본과의 차이를 화면에 올리면 「AI가 내 수정을
      채점한다」는 오해를 만들고, 그 오해는 파일럿이 재려는 것(담당자의 판단)을 왜곡한다.

      **④ 왜 보존이 문서와 분리되는가.** 문서·변환은 30일 뒤 파기되지만 게이트 판정 근거는
      그 뒤에 읽는다. 계약이 정하는 것은 이 오퍼레이션이 문서 파기 뒤에도 의미를 갖는다는
      것뿐이고 저장 형태는 구현 판단이다.

      **⑤ 왜 범위·길이를 스키마 키워드로 적지 않는가.** `x-request-field-constraints.x-decision`
      (2026-08-13, G1+G4)이 이미 판정한 자리와 같다 — 스키마 층에 적으면 같은 위반이 배열
      detail로 나가고 사용자 문구가 영문으로 바뀐다. 상한은 그대로이고 강제하는 층만 사실과
      맞게 적는다. `comment`는 거기에 더해 **정규화 후** 길이를 재므로 `maxLength`가 애초에
      그 요구를 표현하지 못한다.
    version_note: |
      **1.4.0 → 1.5.0.** 새 경로와 새 스키마 셋이라 React 생성 타입이 달라진다.
      **비파괴다** — 기존 경로·스키마·필드·문구·상태 코드가 하나도 바뀌지 않았고 추가만 있다.
      (1.4.0의 두 항목이 버전을 올리지 않은 것과 다른 이유가 이것이다: 그쪽은 나가는 바이트가
      같았고 이번에는 없던 오퍼레이션과 타입이 생긴다.)
    react_impact: |
      `frontend/src/api/types.ts`에 `PublishIntent`·`ConversionFeedbackRequest`·
      `ConversionFeedbackResponse`가, `frontend/src/api/client.ts`에 호출부가 늘고,
      검수 화면 하단에 새 컴포넌트 `ReviewFeedback.tsx`가 붙는다. **기존 화면 코드가 깨지는
      자리는 없다**(추가만). 폼 안의 「문서 내용은 적지 마세요」 안내는 그 컴포넌트가 진다 —
      사유는 `ConversionFeedbackRequest.comment`에 적혀 있다.
    affected_tests: |
      **이 계약 변경이 분모를 바꾸는 대조들이다. 고치는 것은 구현 레인이지만 기록은 여기 남긴다.**
      - `PrivateHeaderFloorCensusTest.DECLARED_FLOOR_TARGETS` — `PUT /conversions/{conversion_id}/feedback`
        추가. 계약의 `applies_to`와 **1:1로 대조**하므로 고치기 전까지 빨갛다. 그것이 이 장치의 의도다.
      - `support/ContractEnumerationFloors.kt`의 `MIN_PRIVATE_HEADER_TARGETS` — 10 → 11.
      - `AuthenticationCoverageContractTest` — 계약에서 자동 파생이다. 계약과
        `AuthenticatedEndpoints.PROTECTED_PATH_PATTERNS`가 맞으면 통과한다.
      - **신규 `ConversionFeedbackContractTest`** — 스키마·응답 집합·문구 대조(404·409 문구가
        `PUT /conversions/{conversion_id}`와 **같은 값**임을 계약에서 읽어 단언).
      - **신규 `ConversionFeedbackReachTest`** — 200 멱등 덮어쓰기 · 404 소유자 은폐 ·
        409 미완료 · 422 두 갈래(배열/문자열) · 415.
      - `x-stored-text-domain`의 새 팔은 `pending`이므로 오늘 케이스를 요구하지 않는다.
    notified: [kotlin-implementer, 리더]

  - version: "1.4.0"
    date: "2026-08-23"
    revision: "G29-X8"   # 게이트 회차 04_documents-c6r2 판정 X-8 (contract-keeper 판정 → 리더 승인)
    author: contract-keeper
    change: |
      **두 자리의 표현 빈자리를 메웠다 — 값은 하나도 바뀌지 않는다.**

      ⑴ **`DocumentTextRequest.workspace_id`에 형식 오류 처분을 복기했다.**
         종전 문면은 *"생략하면 기본 작업 공간. 남의 것이면 404."* 뿐이라 **형식 오류의
         처분이 없었다.** 같은 규칙이 multipart 팔(`DocumentFileRequest.workspace_id`)에만
         적혀 있었고, 그 비대칭에서 JSON 팔이 배열 `detail`을 내는 구현 결함이 실제로 생겼다.
         `format: uuid`가 강제 지점이 아니라는 것과, 검사 **순서**의 정본이
         `paths./documents.post.description`이라는 것도 함께 적었다.
      ⑵ **`ValidationFailed`의 두 갈래 경계에서 「타입 불일치」를 JSON 원시 타입으로 한정했다.**
         배열 갈래의 「타입 불일치」와 문자열 갈래의 「형식 규칙 **전부**」가 **UUID 형식
         오류에서 겹쳐** 계약이 양쪽을 동시에 만족시킬 수 없었다. 문자열로 실려 온 값의
         타입 변환 실패는 **문자열** 갈래임을 명시하고, **경계가 전송 팔을 가리지 않는다**는
         것을 함께 못 박았다.
    ground: "G4 (⑴⑵ 모두) + G1 (⑴ 보조 — 두 팔을 대칭으로 진술하지 않아 사실과 어긋나 보였다)"
    rationale: |
      **둘 다 「이미 계약이던 것」을 읽을 수 있게 만든 것이지 새 요구가 아니다.**
      `paths./documents.post.responses.422.description`이 *"`workspace_id` 형식 오류 …
      앞의 것들은 문자열 detail"*이라고 **오퍼레이션 수준**으로 이미 적고 있었다. 계약에는
      「JSON 팔의 422」와 「multipart 팔의 422」가 따로 없고 `POST /documents`의 422 하나뿐이다.

      **그래서 이 개정이 없어도 X-8은 오늘 성립하는 구현 결함이다.** 개정의 목적은 판정의
      근거를 만드는 것이 아니라 **재발을 막는 것**이다 — 규칙을 한 팔에만 적어 두면 다른
      팔에서 지켜지지 않는다는 것이 가설이 아니라 이 결함 자체가 실측이다(G4).

      ⑵는 `x-request-field-constraints.x-decision`(2026-08-13, G1+G4)이 이미 한 번 판정한
      것과 **같은 종류의 자기모순**이다 — 계약의 두 조항이 한 입력에서 서로 다른 답을 낸다.
      그때와 같은 처방을 쓴다: 값을 바꾸지 않고 **어느 조항이 그 자리를 관할하는지**를 적는다.
    version_note: |
      **`info.version`은 올리지 않는다**(1.4.0 유지). **계약에 적합한 구현에서 나가는 바이트가
      하나도 달라지지 않는다** — 상태 코드·`detail` 값·필드 이름·헤더가 전부 그대로다.
      오늘 Kotlin의 JSON 팔이 다른 바이트를 내는 것은 **이 개정이 만든 차이가 아니라
      개정 전부터 있던 계약 위반**이다(X-8). 그것을 버전으로 표현하면 구현 결함이 계약
      변경으로 둔갑한다.
    react_impact: |
      **런타임 영향 없음**(실측). `frontend/src/api/types.ts`의 오류 본문 타입에 `workspace_id`가
      등장하지 않고, `client.ts`의 `readErrorMessage`는 문자열·배열 **양쪽 분기를 이미 갖는다** —
      즉 이 결함은 화면을 깨뜨리지 않고 **문구를 한국어에서 영문(`Input should be a valid UUID`)
      으로 바꾼다.** `x-request-field-constraints.x-decision`이 「상태 코드는 그대로라 테스트로도
      잡히지 않는 종류의 품질 저하」라고 적은 바로 그 형태다. 계약·백엔드·프런트를 한 변경
      단위로 묶을 필요가 없다.
    affected_tests: |
      - **DC-27에 JSON 팔 케이스** — 형식 오류 `workspace_id`를 `application/json`으로 보내
        422 · `detail` **문자열** · 값이 multipart 팔과 **같음**. 오늘 이 입력의 테스트가 **0건**이다.
      - **DC-26에 JSON 팔 복합 케이스** — 본문 20,000자 초과 **+** 형식 오류 `workspace_id` →
        본문 길이 문구(문자열)가 관측된다. 검사 순서 조항이 JSON 팔에서 깨지는 자리다.
      - **두 팔 교차 단언** — 같은 결함에서 두 팔의 `detail` **타입과 값이 같다**를 한 단언에
        담는다. 팔별로 따로 재면 갈림이 다시 조용히 들어온다.
      - 명세 반영은 `04_contract-keeper_documents-test-spec.md` §2-2·§2-6.
    x-implementation-note: |
      **계약은 층을 지정하지 않는다** — 나간 바이트만 정한다. 다만 `workspace_id`를
      역직렬화 타입(`UUID?`)으로 두는 형태는 **어떤 배치로도 이 조항과 검사 순서를 동시에
      만족시킬 수 없다.** 역직렬화가 컨트롤러 본문보다 앞서기 때문이다. 어떤 구현을 고를지는
      구현 레인의 판단이다.
    notified: [kotlin-implementer, parity-verifier, migration-reviewer, 리더]

  - version: "1.4.0"
    date: "2026-08-20"
    revision: "G28-P5"   # 게이트 28 리더 판정 P-5·P-4·P-12 + L-⑧ 판정 1·3 + O-14·O-21·O-22
    author: contract-keeper
    change: |
      **한 변경 단위로 여섯을 집행했다 — 503 다섯 자리 정합 · `/health` 두 문면 · 415 ·
      검사 순서 · 저장 정의역 어휘.**

      ⑴ **`x-retired-503-configurations` 신설 — 서수를 버렸다** (게이트 28 **P-5**).
         같은 줄을 다섯 자리가 「세 줄」·「두 줄」·「넷째 줄」·「미측정」으로 서로 다르게
         세어 **계약 자체로 무엇이 참인지 결정할 수 없었다.** 내용 불일치가 아니라 **활성
         목록이 줄어드는데 서수가 그대로 인용된 것**이 원인이므로, 각 항목에 안정 `id`
         (`queue`·`cipher`·`datasource`)를 주고 사유는 그 절 한 곳에만 두었다.
         `ServiceUnavailable.description`은 **포인터만** 남긴다(13개 오퍼레이션이 선언하는
         컴포넌트라 사유를 거기 두면 13곳이 인용한다).
      ⑵ **`datasource` 줄을 내렸다** (근거 **G1** — **이번에는 실측이다**. O-21).
         1.3.0에서는 *"재지 않았으므로 그대로 두었다"*였고 그 유보는 옳았다. P-5가 그
         유보를 마감으로 올렸고, **bootJar를 다섯 구성으로 띄워 다섯 팔 전부 재고 내렸다** —
         DataSource가 미배선·도달 불가면 **컨텍스트 조립이 취소되어 앱이 뜨지 않는다.**
         강제로 띄운 구성(제품 구성 아님)에서조차 DB를 만지는 요청은 **500**이었다.
         측정 방법·다섯 팔·대조군의 근거는 그 절 `measured`에 있다.
      ⑶ **`/health` 두 문면을 고쳤다** (근거 **G1** ×2. **O-14·O-22**).
         - 「캐시 금지 헤더도 붙지 않는다」 삭제 — 2026-08-12 리더 판정으로 전역 부착이
           요구가 됐고 `x-global-response-headers.x-superseded`가 제외 목록을 이미
           무효화했는데 이 산문만 옛 실측을 들고 있었다. **재실측: 두 헤더가 실려 나간다.**
         - **Redis를 진단 대상에서 내렸다** — 큐가 PostgreSQL lease 테이블로 옮겨졌고
           제품 코드 적중 0이다. `checks`의 `queue` 키는 **남긴다**(큐는 사라지지 않았고
           같은 DataSource 위의 테이블이 됐다). 두 키가 **같은 배선을 공유**함을 명시했다.
         - **`checks.database: false`가 제품 구성에서 도달 0임을 적었다**(⑵의 귀결).
           **조항은 지우지 않았다** — 도달 0은 조항이 틀렸다는 뜻이 아니고 기동 정책의
           귀결이다. 처분은 배포 동작 변경이라 리더에게 올렸다.
      ⑷ **415를 신설했다 — 엔드포인트별이 아니라 종류로** (근거 **G2**. L-⑧ **판정 3**).
         `x-unsupported-media-type`(정본) + `UnsupportedMediaType` 컴포넌트 +
         **요청 본문을 받는 6개 오퍼레이션 전부**에 `'415'` 선언.
         **리더 지목은 셋이었고 실측은 다섯을 냈다** — `POST /auth/signup`·`POST /auth/login`도
         같은 응답을 낸다. 열거했으면 두 자리가 빠졌다. 그래서 규칙을 집합으로 적고
         **대상을 계약에서 계산하는** 검증을 함께 걸었다.
         `detail`이 한국어가 아닌 사유(세 경로 균일성)를 `detail_source`에 명문화했다 —
         적지 않으면 다음 사람이 "빠뜨린 번역"으로 보고 고쳐 그 균일성을 깬다.
      ⑸ **검사 순서 조항이 복합 결함에 적용됨을 명시했다** (근거 **G2**. **P-4** 선결).
         함께 메운 공백: `workspace_id`의 **형식** 검증 자리(종전 목록에는 소유권만 있었다).
         형식은 소유권의 선결이므로 같은 단계이고 **크기·추출·본문 길이보다 뒤다.**
      ⑹ **`x-stored-text-domain`의 `status` 어휘에 `unreachable`을 더했다**
         (L-⑧ **판정 1** + **P-12**). 파일 모드 팔이 `measured`인데 **실측하면 도달하지
         않았다** — 두 값으로는 「재봤더니 도달하지 않는다」를 적을 자리가 없어 거짓 선언이
         됐다. 그 팔을 `unreachable` + `measured_absent`(어떻게 쟀나 · 무엇이 바뀌면 다시
         도달하나)로 바꿨고, **선언은 지우지 않았다.**
         **`x-closed-enum` 신설** — 파서가 `measured`인지만 보고 나머지를 `pending`으로
         취급해 **오타 하나가 팔을 조용히 강등**시킬 수 있었다(codex 서술 채택).
    ground: "G1(⑴⑵⑶) · G2(⑷⑸⑹)"
    rationale: |
      **⑴⑵⑶의 공통 사유: 계약이 폐기된 아키텍처와 뒤집힌 판정을 가리키는 진단 서술을
      들고 있었다.** 리더가 O-14·O-21·O-22를 한 단위로 지정한 근거가 그 동일성이다.
      셋 다 「그때는 참이었고 전제가 바뀐 뒤 문면만 남은」 형태이며, 그런 문면은 다음
      게이트가 그 위에서 돌기 때문에 값이 아니라 **비용**이다.

      **⑵가 이 개정의 값어치다.** 「의심되나 재지 않았다」를 두 회차 이어 정직하게 이월한
      끝에 **실측이 그것을 닫았다.** 유보를 지운 것이 아니라 **근거를 만들어 지운 것**이고,
      그 차이가 이 저장소가 「재지 않은 것을 지우지 않는다」로 지키려는 것이다.

      **⑷가 남기는 교훈은 415가 아니다.** 지목 셋과 실측 다섯의 차이다 —
      열거는 그때마다 맞아 보이고 다음 자리에서 틀린다. 리더 지시(*"엔드포인트별로 따로
      처리하지 마라"*)가 실측으로 정당화된 자리이므로 그 사실을 여기 남긴다.
    escalated: |
      **리더 판정 대기 셋** — 전문은
      `docs/migration/_workspace/04_contract-keeper_p5-verdict.md` §7-2.
        ⑴ **DB 기동 정책**(`escalate_to_leader` 4번) — 계약이 「기동을 막지 않고 `/health`로
           진단한다」와 「DB를 진단한다」를 동시에 원하는데 **실측이 그 둘의 비양립을 보였다.**
        ⑵ **무인증 415가 401보다 앞선다**(3번) — 어느 리뷰도 짚지 않은 **새 발견**이다.
           415 응답의 `Accept` 헤더가 무인증 호출자에게 그 오퍼레이션이 받는 미디어 타입
           집합을 준다. `info.description`의 「인증이 먼저다」가 든 근거가 **API 표면 탐색**
           이므로 정면으로 걸린다. **조항을 좁히지 않았고 케이스도 쓰지 않았다.**
        ⑶ 원장(`00_progress.md`) 두 줄 — 계약 레인 범위 밖이라 대체 문면을 값으로 넘겼다.
    unmeasured: |
      **`PUT /conversions/{conversion_id}`의 415는 재지 못했다** — 구현이 없다.
      6개 중 다섯만 실측이고 여섯째는 선언만이다(`x-unsupported-media-type.x-measured`).
      **복합 결함 입력(⑸)도 소켓으로 재지 않았다** — 기제는 고정 리비전 코드 실측을
      채택했고 실행 재현은 구현 레인의 케이스가 닫는다.
      **Gradle을 한 번도 돌리지 않았다** — 고친 것이 YAML·마크다운이고 Kotlin 레인이 같은
      트리에서 병렬 작업 중이라 빌드 산출물을 공유하지 않았다. **이 개정에 테스트 근거는 없다.**
    affected_tests: |
      `04_contract-keeper_documents-test-spec.md` §2·§4·§7에 이 개정의 케이스·파서·판정이
      들어갔다: **DC-26·DC-27**(복합 우선순위 — 오늘 0건) · **DC-28**(415, 6개 오퍼레이션을
      계약에서 **유도**) · **CU-11**(415의 미측정 팔을 닫는다) ·
      **P-41·P-42·P-43·P-44** 신설 · **N-35~N-45** 설계.
      **계약 값 축의 음성 대조는 전건 미실행이다** — 그중 여섯은 P-41·P-44가 서기 전에는
      실행 자체가 불가능하다(그 파서가 오늘 0개이므로 "바꿔도 안 깨진다"가 예상 결과다).
      ⑵ 측정의 대조군(팔 A·팔 E)은 **다른 축이므로 `N-*`에 섞지 않았다.**
    notify: [kotlin-implementer, parity-verifier, privacy-gate, 리더]

  - version: "1.3.0"
    superseded_by: |
      **⑵의 「넷째 줄(DB 세션 팩토리)은 재지 않았으므로 그대로 두었다」는 1.4.0에서 닫혔다** —
      실측 후 내렸고 정본은 `x-retired-503-configurations`의 `datasource`다.
      **아래 본문은 1.3.0 시점의 기재를 그대로 둔다** — 그때 내린 것은 실제로 두 줄이었고
      그 기재는 참이었다. 고치면 역사 위조다. 「두 줄」·「세 줄」·「넷째 줄」이 갈려 보이던
      사유(서수가 가리키는 목록이 줄었다)는 `x-retired-503-configurations` 머리 주석에 있다.
    date: "2026-08-20"
    revision: "G27-C3"   # 리더 판정 L-1 잔여 ⑴⑵ + 구현 계획 §9 질문 ④
    author: contract-keeper
    change: |
      **판정 셋을 한 변경 단위로 집행했다 — 502 폐기 · 503 큐 줄 폐기 · 저장 정의역 신설.**

      ⑴ **502(`BadGateway`)를 폐기했다** (근거 **G1**).
         - `POST /documents`의 `'502'` 선언 삭제 — 계약 전체에서 502를 선언한 유일한 자리였다.
         - `components/responses/BadGateway` **삭제**(참조가 그 하나였으므로 남기면 고아다).
         - `POST /documents` description의 **검사 순서 문장**과 **`EnqueueFailed`/502 문단** 재서술 —
           저장과 큐 등록이 한 트랜잭션이고, 등록 실패는 전량 롤백 + **500**임을 명시.
         - `ConversionResponse.failure_code.description`에서 `"EnqueueFailed"` 요구 삭제.
         - **`x-retired-responses` 신설** — 폐기 사실·사유·되살릴 조건·소비자 부채를 남긴다.
      ⑵ **`ServiceUnavailable`에서 도달 0인 **두 줄**과 대응 예시를 내렸다** (근거 **G1** ×2).
         - 「큐(Redis) 미배선 → 업로드」 + `no_queue` — lease 큐에 별도 배선이 없다.
         - **「저장 암호화 키 미설정 → 문서 API 전체」 + `no_cipher`** — **큐 줄을 재다가
           형제 줄도 죽어 있음을 발견했다.** 2026-08-19 리더 판정(게이트 25 F-2·F-3·X8)이
           저장 암호화를 **기동 fail-fast**로 바꿨으므로 "키가 없는데 서비스 중"인 상태가
           없다. 계약이 그 판정을 반영하지 못한 채 남아 있었다.
         - 남은 유일한 줄(**인증 서명 키**)의 적용 범위를 「인증 API 전체」에서
           **「인증이 필요한 모든 요청」**으로 정정했다 — 보호 자원 전체가 같은 경로를 지나고,
           그것이 이 컴포넌트를 13개 오퍼레이션이 선언하는 근거다.
         - 넷째 줄(DB 세션 팩토리)은 **재지 않았으므로 그대로 두었다.**
      ⑶ **`x-stored-text-domain` 신설** (근거 **G2**) — 저장되는 본문의 **정의역**.
         짝 없는 UTF-16 서로게이트는 422 **문자열** `detail`로 거절한다.
         `POST /documents` 422 `examples`에 `undecodable_text` 추가,
         `DocumentTextRequest.text`·`ConversionReviewRequest.edited_text` 설명에 포인터 추가.
      ⑷ **`x-title-policy.rule`에 서로게이트 제거를 더했다** (근거 **G2**).
         제목은 **정제**이고 본문은 **거절**이다 — 다른 처분인 사유를 `x-surrogate-note`에 적었다.
    ground: "G1(⑴⑵) · G2(⑶⑷)"
    rationale: |
      **⑴⑵의 공통 사유: 두 조항 모두 Redis/ARQ 아키텍처의 잔재였다.**
      큐가 PostgreSQL의 테이블이 되면서 ⓐ "커밋은 됐는데 등록만 실패"라는 상태와
      ⓑ "큐만 미배선"이라는 구성이 **둘 다 존재할 수 없게** 됐다. 실측(2026-08-20):
      `QueueUnavailableException`을 던지는 제품 코드 **0곳**, 큐 배선에 대한
      `ConfigurationException` **0곳**. 계약이 두 자리에서 **도달 0인 조항**을 들고 있었다.

      **한 판정에서 함께 처분한 이유**: 두 조항은 documents 명세의 X-C6 축(「502 ≠ 503」)의
      두 팔이었다. 한 팔만 내리면 다른 팔이 무대 없는 케이스로 남는다.
      축은 **「503 ≠ 500」**으로 다시 세웠다 — 두 팔 모두 도달이 실재한다
      (503 = **인증 서명 키가 하한 미만인 구성** / 500 = 큐 등록 실패로 전량 롤백).

      **재는 김에 형제 줄을 재지 않았으면 같은 실수를 반복할 뻔했다.** 503의 무대를 처음에는
      「저장 암호화 키 미배선」으로 옮기려 했는데 **그 구성도 존재하지 않는다**(위 ⑵ 둘째 항목).
      계약 문면만 보고 「어느 구성이 실재하는가」를 고르면 무대 없는 케이스가 다시 생긴다.

      **⑶의 사유**: 성질은 이미 구현에 있었고 **없던 것은 오라클**이다.
      계약에 기계가독 문구가 없으면 경계 테스트가 그 문구를 **코드에 복제**하고,
      그러면 계약과 구현이 갈려도 테스트는 자기 사본과 대조해 초록이다
      (`x-filename-charset` 신설과 같은 갈래). 이 갈래는 C3에서 처음 실물로 열린다.
    react_impact: |
      **런타임 파손 0건**(실측 2026-08-20).
        - `frontend/src/conversion/failureMessages.ts:43` `EnqueueFailed` — 조회가
          `MESSAGES[code] ?? UNKNOWN`이라 값이 오지 않아도 예외가 없다. **사용되지 않는 항목 1**.
        - `frontend/src/pages/UploadPage.tsx:74` 주석의 `502(변환 서비스)` — 주석이다.
        - `frontend/src/api/client.test.ts:121` 502 픽스처 — **일반 오류 경로** 검증이라
          이 조항과 무관하다. 건드리지 않는다.
        - `frontend/src/api/types.ts` — `failure_code: string | null`. **타입 변화 없음.**
        - ⑶⑷는 422 갈래가 하나 느는 것이고 React는 `detail` 문자열을 그대로 화면에
          올린다(`readErrorMessage`). **분기 추가 없음.**
      Phase 6 회수 대상 **2건**(위 첫 둘) — `x-retired-responses.consumer_debt`가 정본.
    version_note: |
      **`info.version`을 1.2.0 → 1.3.0으로 올린다.** 나가는 바이트가 바뀐다 —
      `POST /documents`가 더는 502를 낼 수 없고, 422 갈래가 하나 는다.
      **비파괴다**: 응답 상태 집합의 **축소**는 소비자가 받는 값의 부분집합화이고,
      422 갈래 추가는 이미 선언된 상태 안에서 일어난다. 필드·타입·헤더 변화 0.

      ⚠ **버전 규칙 자체는 아직 계약에 없다.** `x-change-policy`에 `versioning` 키가
      없고 그 신설은 별도 작업(C6)이다. 이 bump는 **직전 개정(G27-C1)이 세운 선례**
      —「나가는 바이트가 바뀌면 올린다」— 를 따른 것이며, 규칙이 서면 **이 항목과
      G27-C1을 소급 대조**해야 한다. 규칙보다 먼저 굳히지 않기 위해 그 사실을 적는다.
    affected_tests: |
      **계약 명세**(`04_contract-keeper_documents-test-spec.md`): DC-18 재정의(500) ·
      DC-19 재정의(503의 무대 교체) · X-C6 재정의(「503 ≠ 500」) · DC-24·DC-25 신설 ·
      파서 노드 P-38·P-39 신설 · 음성 대조 N-31~N-34 신설.
      **Kotlin**: `ErrorContractTest`의 502 두 행 · `GlobalExceptionHandler.mappingFor`의
      `BAD_GATEWAY` 갈래 · `ErrorProbeController`의 `queue` 항목 ·
      `QueueUnavailableException` 자체(던지는 곳 0).
    notified: [kotlin-implementer, parity-verifier, privacy-gate, 리더]

  - version: "1.2.0"
    date: "2026-08-20"
    revision: "G27-C1"   # 게이트 27 codex Critical ① 의 계약 레인 몫
    author: contract-keeper
    change: |
      **제목 유도 조항을 폐기했다. 제목은 문서 내용에서 만들지 않는다.**
        - **`x-title-policy` 신설** — 이 규칙의 정본. `sources` · `forbidden_sources` ·
          `fallback_title`(`제목 없음`)을 **기계가 읽을 수 있게** 두었다.
        - `DocumentTextRequest.title` — *"생략하면 본문 첫 줄에서 유도한다(30자 목표,
          어절 경계에서 자르고 `…` 부착)"* → **"생략하면 고정 문구 `제목 없음`"**.
          같은 절의 *"파일명은 제목으로 쓰지 않는다"* 는 **그대로 두고 강화 사실을 덧붙였다.**
        - `DocumentFileRequest.title` — *"생략하면 추출한 본문 첫 줄에서 유도한다"* →
          같은 규칙. **파일명 금지를 이 절에도 명시**했다(종전에는 텍스트 모드 설명에만 있어
          파일 모드만 읽는 사람에게 도달하지 않았다).
        - `DocumentListItem.title` — 값의 출처와 `maxLength`의 의미를 적었다.
        - 낡은 서술 3곳 정정 — `x-global-response-headers.applies_to`의 `GET /documents`
          주석, `x-filename-charset.check`의 파일명 바탕, `POST /workspaces` 설명의 대비 문구.
        - `x-input-limits.max_title_length` 주석 — 상한이 **사용자 입력에만** 걸린다는 사실을 명시.
    ground: G3
    rationale: |
      **2026-08-20 사용자 결정**이며 게이트 27 codex Critical ①(C-1)의 처방이다.
      유도된 제목은 방어 **둘을 동시에** 우회한다 — 봉인된 원문의 조각을 평문 열
      `documents.title`에 복제해 **암호화를 우회**하고, 마스킹은 워커의 일이라 업로드
      시점에 돌지 않으므로 **마스킹도 우회**한다. 얻는 것은 목록 화면의 편의뿐이다.

      **계약을 함께 고치지 않으면 구현이 계약 밖이 된다.** 계약이 유도 동작을 두 자리에서
      **명시적으로 요구**하고 있었으므로, 코드만 고치면 「계약을 어긴 구현」이 된다.
      이 개정이 그 자리를 닫는다.

      사유를 조항에 남긴 이유: 이 계약은 현재 동작의 스냅샷이 아니라 요구사항이 요구하는
      인터페이스다. **왜 유도를 버렸는지가 없으면 다음 사람이 편의를 이유로 되살린다.**
    version_note: |
      **`info.version`을 1.1.0 → 1.2.0으로 올린다.** 앞선 두 개정(R-1 · C-4)은 나가는
      바이트가 바뀌지 않아 올리지 않았지만, 이번에는 **바뀐다** — 제목 없이 올린 문서의
      `title`이 「본문 첫 줄 30자」에서 「`제목 없음`」이 된다.
      **비파괴다**: 타입(`string`)·`maxLength`·필드 유무·상태 코드·헤더가 하나도 안 바뀌고,
      소비자 코드가 고쳐야 할 것이 없다.
    react_impact: |
      **런타임 코드 변경 0건**(실측).
        - `frontend/src/api/types.ts` — `DocumentTextRequest.title?: string | null`,
          `DocumentListItem.title: string`. **타입 변화 없음.**
        - `frontend/src/api/client.ts` — `createDocumentFromText`가 `title ?? null`을 싣고,
          `createDocumentFromFile`은 애초에 `title` 파트를 보내지 않는다. **변화 없음.**
        - `frontend/src/pages/HistoryPage.tsx` — `item.title`을 표와 `aria-label`에
          **그대로 렌더링**한다. `title`은 계약상 비지 않으므로(고정 문구가 선다) 빈 제목
          처리 분기가 필요 없다. **화면 문구만 달라진다**(제목 없이 올린 문서의 목록 이름이
          본문 첫 줄 대신 `제목 없음`으로 보인다).
      **픽스처 영향**: `frontend/src/test/factories.ts`와 `HistoryPage.test.tsx`는 제목을
      명시적으로 넘기므로 깨지지 않는다. 「제목 없이 올린 문서」 픽스처는 **없다** —
      Phase 6에서 `제목 없음` 케이스를 하나 두는 것이 좋다(런타임 부채는 아니다).
    affected_tests: |
      - **신규 계약 테스트가 필요하다(이 개정에는 포함되지 않았다 — 구현 레인이 같은 시각에
        작업 중이라 Kotlin 코드를 쓰지 않았다)**:
        `POST /documents`에 `title` 없이 JSON·multipart로 올린 뒤 `GET /documents`의
        `title`이 **계약에서 읽은 `x-title-policy.fallback_title`과 같음**을 단언한다.
        값을 코드에 복제하지 않는다(X-J2).
      - **음성 대조**: 본문 유도를 되살리면 위 단언이 빨강이어야 한다. 구현 레인이 이미
        같은 성질을 `JdbcDocumentStoreTest.본문 표식이 평문 열에 남지 않는다`로 재고 있고,
        이 계약 테스트는 그것을 **HTTP 경계에서** 다시 잰다(계층이 다르므로 중복이 아니다).
      - **기존 테스트 영향 없음**(실측): `x-input-limits`는 키로만 읽히고
        (`ContractSpec.inputLimit`), `x-request-field-constraints.fields[]`에 `title` 항목이
        없으며, `UploadFormatContractTest`는 `supported_upload_formats`만 읽는다.
        `info.version`을 고정하는 테스트는 저장소에 **0건**이다.
    x-implementation-alignment: |
      **한때 갈렸다 — 이 개정 시점의 실측으로는 수렴 중이다.**

      착지한 커밋 `13b0828`의 `TitleRules.kt::resolveTitle(given, uploadFilename)`은 제목이
      없을 때 **업로드 파일 이름**을 썼다. 그 커밋은 같은 날짜의 사용자 결정을 *"파일 이름은
      써도 된다(본문과 성격이 다르다)"*로 적었고, 이 개정에 주어진 지시는 *"본문에서도
      파일명에서도 만들지 않는다"*다 — **둘은 동시에 참일 수 없다.**

      **실측(2026-08-20, 이 개정과 같은 시각)**: 구현 레인의 작업 트리는 이미
      `resolveTitle(given)` 한 인자로 줄어 **계약과 같은 규칙**이다(파일 이름 갈래 삭제).
      즉 나중 결정이 앞 결정을 덮었고 두 레인이 같은 곳으로 가고 있다.
      **아직 커밋되지 않았으므로 이력에는 갈린 상태만 남아 있다** — 구현 레인의 다음 커밋이
      착지하면 이 항목은 닫힌다. 닫히기 전까지 `13b0828` 기준으로는 파일 모드가 계약 밖이다.
    notified: [kotlin-implementer, parity-verifier, privacy-gate, migration-reviewer, 리더]

  - version: "1.1.0"
    date: "2026-08-19"
    revision: "C-4"      # Phase 4 착수. 계약 개정 1건 + 판정 1건(무변경)
    author: contract-keeper
    change: |
      **내보내기 파일명의 금지 문자 집합을 계약 조항으로 신설했다.**
      `paths./conversions/{conversion_id}/export.get.responses.200.headers.Content-Disposition`
      아래 **`x-filename-charset`** 한 절. 문면은 이 한 곳뿐이다 — 상태 코드·본문 스키마·
      헤더 구조·예시·미디어 타입은 하나도 바뀌지 않았다.

      **함께 기록한 판정(계약 동작 무변경)**: 같은 헤더와 `POST /documents` 202의 `Location`을
      `components/headers`로 **옮기지 않는다.** 사유를 `Content-Disposition`의
      `description` 끝에 한 문단으로 남겼다(⇒ 아래 `x-no-change-verdict`).
    ground: G2
    rationale: |
      계획 §5 Phase 2의 종료 조건 「내보내기 파일명·`Content-Disposition` 생성 포팅」
      (원장 L348)이 요구하는 성질인데, 그 요구의 일부(C1 블록·윈도우 예약 문자)가
      **어느 단언에도 걸리지 않는다**는 것이 게이트 14 F-3·F-4와 게이트 16 후속 R-1이었고
      마감이 **「Phase 4 착수 전」**이었다. 지금이 그 시점이다.

      **없던 것은 성질이 아니라 오라클이다.** 구현
      (`backend-kotlin/core/src/main/kotlin/kr/easydoc/core/easyread/Export.kt`)은 이미 이
      성질을 만족한다. 계약에 기계가독 집합이 없으면 경계 테스트가 집합을 **코드에 복제**하고,
      그러면 계약과 구현이 갈려도 테스트는 **자기 사본과 대조해 초록**이다 — X-J2가 금지하는
      형태이며 F-4를 모양만 바꿔 남긴다.

      **이 조항이 계약인 이유**: 파일명이 헤더 값으로 나가고, 디코딩한 이름이 사용자 파일
      시스템에 닿는다. 계약이 정하는 것은 나간 바이트이고, 어느 층에서 걷어내는지는 구현 판단이다.

      **이것으로 L348을 닫지 않는다.** 그 판정은 리더의 것이고 F-3·F-4의 **parity fixture 몫**
      (그 레인 스크립트의 손열거)은 그대로 남는다. 이 개정이 한 것은 **경계에서 잴 수 있게
      만든 것**까지다.
    x-no-change-verdict: |
      **인라인 헤더 2건(`Location` · `Content-Disposition`)을 컴포넌트화하지 않는다.**
      바꾸지 않기로 하는 것도 판정이므로 기록한다 — 기록하지 않으면 같은 제안이 다시 올라온다.

      G1~G4 어디에도 근거가 없다. 가장 그럴듯했던 후보는 G4였는데, X24-5가 드러낸 것은
      **조항의 결함이 아니라 강제 수단의 도달 0**(파서가 인라인 갈래를 조용히 무시)이었고
      `44eec3f`가 파서를 fail-closed로 만들어 그 자리를 닫았다. **탐지를 넓혀 해결된 자리를
      구조 변경으로 되돌리지 않는다.**

      바꾸면 **잃는 것**도 있다 — `components/headers`의 세 항목은 전부 `schema.const`를 갖고
      그 성질이 단언으로 강제된다. 계산되는 값은 `const`를 가질 수 없으므로 컴포넌트화하려면
      그 탐지 조항을 약화시켜야 한다. **얻는 것**은 없다 — 두 헤더는 각각 한 응답에서만 쓰여
      줄일 중복이 없다.
    version_note: |
      **`info.version`은 올리지 않는다.** 와이어에 나가는 상태 코드·본문·헤더 구조·예시가
      하나도 바뀌지 않는다. 조항 자체는 새것이지만 **오늘 적합한 어떤 구현에서도 나가는
      바이트가 달라지지 않는다** — 구현은 이미 이 성질을 만족한다.
    react_impact: |
      **없다**(실측). `frontend/src/api/client.ts`의 `parseFilename`은 확장 파라미터를
      **읽기만** 하고 문자 집합을 검사하지 않는다. `Location`을 읽는 코드는 프런트 전체에
      **0건**이다. 응답 바이트가 안 바뀌므로 화면 영향도 없다.
    affected_tests: |
      - **신규 계약 테스트 2건** — `04_contract-keeper_documents-test-spec.md` **CE-5·CE-6**.
        금지 집합을 계약에서 **읽어 케이스를 유도**한다(손열거 금지). 음성 대조 **N-20**이
        결속을 잰다(C1 구간만 지웠을 때 C1 케이스만 빨강).
      - **파서 노드 신설** — 같은 명세 **P-23**(`forbidden`·`measured_on`).
      - **인라인 헤더 판정의 강제자는 그대로다** — `ContractHeaderDeclarationTest`가
        `inlineHeaderNames()`를 두 이름으로 고정한다. 이 개정으로 그 집합이 바뀌지 않는다
        (실측: 개정 후에도 인라인 2건, `:api:test --tests '*Contract*'` exit 0).
      - **같은 변경 단위 요건**: CE-5·CE-6은 **내보내기 엔드포인트를 구현하는 그 커밋**에
        들어간다. 조항만 있고 단언이 없는 상태가 이어지면 F-4가 「집합이 계약에 있는데도
        무단언」으로 모양만 바꿔 남는다.
