# -----------------------------------------------------------------------------
# 오류 본문의 보편성 — "어떤 경로로 만들어진 오류 응답이든"
#
# 오류 본문 최상위 `detail` 하나는 불변식이다(`x-change-policy.invariants`, 계획 §2.2).
# 이 절은 그 불변식이 **전역 예외 매퍼를 거친 응답에만** 적용된다는 오독을 막는다.
# 헤더 쪽 `x-global-response-headers`와 같은 모양의 문제이고, 같은 이유로 여기 둔다.
# -----------------------------------------------------------------------------
x-error-body-universality:
  status: "결정됨 (2026-08-12) — kotlin-implementer가 범위 밖 발견으로 올린 실측에서 사각지대가 드러났다"
  ground: G4
  requirement: |
    **HTTP 오류 응답에 본문이 있으면, 그 본문은 `components.schemas.ErrorResponse`다 —
    그 응답이 어떤 경로로 만들어졌는지를 가리지 않는다.**
    최상위 키는 `detail` 하나뿐이고 `Content-Type`은 `application/json`이다.

    "어떤 경로로 만들어졌든"이 포함하는 것:
      ① 컨트롤러가 던진 도메인 예외를 전역 예외 매퍼가 변환한 응답 (지금 유일하게 검증되는 경로)
      ② `HttpServletResponse.sendError(...)`로 만들어져 `/error`로 **ERROR 디스패치**된 응답
      ③ 필터·인터셉터·보안 계층이 컨트롤러에 닿기 전에 만든 응답
      ④ 서블릿 컨테이너가 직접 만든 응답
  x-measured-blind-spot: |
    **2026-08-12 실측 — ②가 계약을 어긴다.** Tomcat 11.0.22 / Boot 4.1.0에서 `sendError`가
    부른 `/error`의 응답 본문이 이것이었다:

        {"timestamp":"…","status":503,"error":"Service Unavailable","path":"…"}

    Spring `BasicErrorController`의 **기본 본문**이고 `{"detail": …}`가 아니다.
    최상위 키가 넷이므로 `ErrorResponse`의 `additionalProperties: false`와 `required: [detail]`
    양쪽을 어긴다. 전역 예외 매퍼는 이 경로를 지나지 않는다 — `sendError`는 예외를 던지지
    않고 컨테이너에 상태 코드만 넘기기 때문이다.

    **지금은 드러나지 않는다.** 운영 코드가 `sendError`를 부르지 않아서다.
    **Phase 3에서 드러난다** — 인증 필터가 401을 `sendError`로 내는 것이 Spring Security
    안팎을 통틀어 **가장 흔한 구현**이고, 그 순간 이 API의 401 본문이 계약을 벗어난다.
    401은 React `client.ts`가 세션 만료 분기로 쓰는 자리라 화면 동작까지 함께 바뀐다
    (`readErrorMessage`가 `detail`을 못 찾아 폴백 문구만 남는다).

    사각지대의 성격은 헤더 쪽(`x-global-response-headers`)과 같다 — 조항이 틀린 것이
    아니라 **"모든"의 범위가 검증되지 않은 채 참으로 읽히고 있었다.** 그래서 근거는 G4다.
  x-not-an-implementation-mandate: |
    이 절은 **무엇이 나가야 하는지**만 정한다. `sendError`를 쓰지 않는 것, `/error` 응답을
    계약 모양으로 바꾸는 것, 오류 속성을 다시 쓰는 것 중 무엇을 고를지는 구현 판단이며
    `kotlin-implementer`의 영역이다. 계약이 판정하는 것은 **나간 바이트**뿐이다.
  verification:
    - id: E-1
      check: |
        `sendError`로 만들어진 응답의 본문이 `{"detail": …}`이고, 최상위 키 집합이 정확히
        `{detail}` 하나다. `timestamp`·`status`·`error`·`path`·`trace`·`message`·`errors`가
        **없음**을 명시적으로 단언한다 — 키가 하나 있는지만 보면 통과해 버린다.
      how: |
        `@SpringBootTest(webEnvironment = RANDOM_PORT)`로 실제 HTTP를 태운다.
        **MockMvc가 `/error` ERROR 디스패치를 재현하는지는 이 저장소에서 확인된 바 없다** —
        확인 없이 MockMvc로 쓰면 헤더 쪽에서 이미 겪은 "측정한 것처럼 보이는 통과"를
        반복하게 된다(`x-phase3-measurement.method`).
    - id: E-2
      check: |
        **인증 실패 401은 어떤 구현 수단으로 나가든** 본문이 `{"detail": …}`이고
        `WWW-Authenticate: Bearer`가 붙는다. 구현이 예외 매퍼에서 필터로 옮겨가도
        이 단언은 그대로 서 있어야 한다.
      how: "Phase 3 신규 회귀. 인증 필터를 도입하는 커밋과 같은 단위에서 넣는다"
    - id: E-3
      check: "오류 응답의 `Content-Type`이 `application/json`이다 (`text/html`·`application/problem+json` 아님)"
      how: "기존 X-C4를 ②·③·④ 경로로 확장한다"
  x-unmeasured: |
    **④(컨테이너 생성 응답)의 본문 모양은 아직 대부분 측정되지 않았다.** 2026-08-12 실측이
    다룬 것은 그 응답들의 **헤더**뿐이었다(`x-phase3-measurement.residual`).

    **2026-08-19 현행화 — 대상이 6종이 됐고 그중 1종이 측정됐다.**
      - **대상 축소**: 「알 수 없는 메서드 → 405」는 ④가 아니라 ①이다
        (`x-phase3-measurement.x-405-reclassification`). 그 응답의 본문은 우리 고정 문구이며
        **이 절의 미측정 목록에서 빠진다** — 다른 ① 응답과 같은 요구를 받는다.
      - **1종 측정**: 「콜론 없는 헤더 줄 → 400」의 본문이 원시 소켓 실측에서
        최상위 키 `detail` 하나로 관측됐다(`03_kotlin-implementer_auth-fixes2.md` §4).
        **이 한 건으로 E-4를 닫지 않는다** — 나머지 5종(요청 대상 금지 문자·요청 줄 파손·
        헤더 상한 초과·`Host` 없음 400 · 알 수 없는 HTTP 버전 505)은 여전히 보지 않았다.

    **남은 5종을 "충족"으로도 "위반"으로도 적지 않는다.** 측정 결과 만족시킬 수 없는 자리가
    남으면 계약을 좁히지 말고 리더에게 올린다 — 헤더 쪽에서 밟은 순서와 같다.
    측정 결과 계약을 만족시킬 수 없는 자리가 남으면 **계약을 좁히지 말고** 목록·실측 근거와
    함께 리더에게 올린다(`x-change-policy.escalate_to_leader` 1번). 헤더 쪽에서 밟은 순서와
    같다 — ① 닿게 만들어 본다 → ② 그래도 남으면 재심.
  x-openapi-expressibility: |
    **이 요구도 OpenAPI 문법으로 끝까지 표현되지 않는다.** `ErrorResponse` 스키마는 응답
    **본문의 모양**을 적을 수 있지만, 그 스키마가 **어느 응답에 적용되는지**는 `paths` 아래
    (경로, 오퍼레이션, 상태 코드) 삼중키에 달린 자리에만 적을 수 있다.
    이번에 문제가 된 ②는 `/error`라는 **스펙에 존재하지 않는 경로**의 응답이고, ④는 애초에
    어떤 경로에도 매칭되지 않는다. 둘 다 스키마를 붙일 문법상의 자리가 없다.
    `x-global-response-headers.x-openapi-expressibility` ②와 **같은 구멍**이며,
    같은 결론이 나온다 — 강제 수단은 스펙 밖의 contract test뿐이다.

# -----------------------------------------------------------------------------
# 사적 응답 헤더 — 읽는 순서를 틀리지 않는다.
#
# `x-global-response-headers`가 **요구의 정본**이다 (Kotlin의 모든 응답).
# 뒤따르는 `x-private-response-headers`의 10곳 목록은 그 요구의 **하한선**이지
# 범위가 아니다. 10곳을 범위로 읽으면 이 절을 거꾸로 읽은 것이다.
# -----------------------------------------------------------------------------
x-global-response-headers:
  status: "결정됨 (2026-08-12 리더 판정) — OQ-1 종결. 경로: 계약 소유자 재심 제기 → 리더 판정"
  headers:
    Cache-Control: no-store
    X-Content-Type-Options: nosniff
  ground: G4
  applies_to: |
    **Kotlin 런타임이 내보내는 모든 HTTP 응답.** 상태 코드·경로·핸들러 유무·본문 유무를
    가리지 않는다. 성공 응답, 오류 응답(4xx·5xx), 본문 없는 204, `GET /health`,
    CORS 프리플라이트, 그리고 매칭되는 핸들러가 없어 컨테이너가 직접 만든 응답까지
    전부 포함이다.
  rationale: |
    열거식 범위가 이 저장소에서 **이미 두 번** 누락됐다(`PUT /conversions/{id}` 하나,
    `/auth` 셋). 사람이 매번 기억해야 지켜지는 조항은 지켜지지 않는 형태이고, 그것이
    G4의 정의다. "오류 본문에 개인정보가 없다"는 실측은 여전히 유효하지만 그것은
    *얻는 것이 작다*는 근거일 뿐 *좁게 유지해야 한다*는 근거가 아니다.
    전역 부착의 비용이 사실상 0인 쪽이 결정을 갈랐다 — 이 API가 내보내는 것은 JSON과
    첨부 파일뿐이라 정적 자원·HTML 문서가 없고, `no-store`가 망가뜨릴 캐시 동작 자체가
    없다. CORS 프리플라이트 캐시는 `Access-Control-Max-Age`가 관장하므로 영향받지 않는다.
  x-failure-mode-shift: |
    **이 판정의 핵심 귀결은 실패 양상이 바뀐다는 것이다.**
    위험이 "누가 한 자리를 빠뜨렸는가"에서 **"강제 수단이 그 응답까지 닿는가"**로 옮겨간다.
    전자는 목록 대조로 잡히지만 후자는 **실행해 봐야만** 잡힌다.
    따라서 이 조항은 적어 두면 지켜지는 종류가 아니다.

    **2026-08-12 실측으로 이 자리는 닫혔다**(`x-phase3-measurement`) — 그리고 그 실측이
    바로 이 서술을 정당화했다. 필터 하나만으로는 6종이 비었고, 목록 대조로는 그것이
    보이지 않았으며, MockMvc로는 **통과했다는 잘못된 근거**까지 나왔다.
    이 절을 "이제 끝난 이야기"로 지우지 않는 이유가 그것이다 — 강제 수단을 건드리는 변경
    (필터 순서, 밸브 제거, 컨테이너 교체)은 매번 같은 방식으로 다시 재야 한다.
  enforcement: |
    **2층 강제 — 서블릿 필터 + Tomcat Engine 밸브.** 종전 서술("서블릿 필터 하나로 붙인다")은
    2026-08-12 실측으로 **부족함이 확인되어 무효**다(`x-phase3-measurement`).
    이것은 요구를 좁히는 변경이 아니라 **강제 수단을 넓히는 변경**이므로
    `x-change-policy.invariants` 축소에 해당하지 않는다.

    ① **서블릿 필터** — 체인의 **가장 바깥**(CORS 필터와 같은 층 또는 그 바깥)에 두어
       라우팅·예외 처리보다 먼저 응답 객체를 잡는다. 서블릿에 매핑된 요청은 전부 덮는다.
       실측으로 확인된 도달 범위: 핸들러 없는 404, 415, 413, CORS 프리플라이트 OPTIONS 200,
       `sendError` → `/error` ERROR 디스패치.
    ② **Tomcat Engine 밸브** — 요청 줄·헤더 블록 **파싱 단계**에서 거절되는 응답은 서블릿에
       매핑되지 않아 **필터 체인이 시작조차 하지 않는다.** 필터로는 물리적으로 닿을 수 없는
       자리이고, Engine 밸브는 그보다 앞이라 닿는다. 실측으로 6종 전부를 덮는 것을 확인했다
       (목록은 `x-phase3-measurement.unreachable_by_filter`).

    두 층 모두 헤더를 `add`가 아니라 **`set`**으로 쓴다 — 컨트롤러 `ResponseEntity`가 같은
    헤더를 이미 실은 10곳에서 `add`를 쓰면 `Cache-Control: no-store, no-store`가 나가고,
    값을 `const`로 못박은 이 계약(`components.headers.CacheControlNoStore`)에 위반된다.
    이중 부착은 기능은 멀쩡하고 계약만 깨지는 종류라 눈으로는 안 잡힌다.
    **밸브와 필터가 같은 응답에 둘 다 닿는 구간이 존재하므로**(밸브는 모든 응답을 지나간다)
    중복 부착 단언(`header().stringValues(...)`로 개수까지)은 2층이 된 뒤 더 중요해졌다.
  x-container-coupling: |
    **②는 Tomcat 결합이다 — 서블릿 표준이 아니다.** `org.apache.catalina.valves.ValveBase`는
    Tomcat 전용 확장 지점이고, 서블릿 스펙에는 "필터보다 앞"에 해당하는 표준 자리가 없다.
    계약을 읽는 사람이 **"서블릿 표준 필터만 있으면 이 조항이 만족된다"고 읽으면 오독**이다.

    감수 범위인 이유: 계획 §3.1이 내장 Tomcat을 기술 고정으로 못박았다. 따라서 이 결합은
    이미 내린 결정의 귀결이지 이 계약이 새로 만든 제약이 아니다.

    **컨테이너를 바꾸면(Jetty·Undertow·Netty) 이 층은 조용히 사라지지 않고 기동 시점에
    깨진다** — 밸브 등록은 `TomcatServletWebServerFactory`에 붙는 구성이라 그 팩토리가
    없으면 컨텍스트 조립이 실패한다. 이것은 결함이 아니라 **의도된 성질**이다.
    조용히 사라지는 쪽이었다면 파싱 단계 거절 응답 6종이 헤더 없이 나가는 것을 아무도
    모르게 된다. 컨테이너 교체는 이 조항의 재설계를 동반해야 하며, 그 판단은
    `x-change-policy.escalate_to_leader` 4번(배포·운영 동작이 달라지는 변경)이다.
  x-openapi-expressibility: |
    **이 전역 요구를 OpenAPI 문법으로 끝까지 표현할 수 없다.** 아래가 표현하지 못한
    것의 전부이며, 표현한 척하지 않기 위해 남긴다.

    ① **"모든 응답에 적용"이라는 구성 자체가 없다.** `components.headers`는 헤더
       **정의**를 재사용할 뿐 **부착**하지 않는다. 루트에서 상속되는 `security`와 달리
       헤더에는 대응물이 없다.
    ② **응답 객체는 (경로, 오퍼레이션, 상태 코드) 삼중키에만 달린다.** 그런데 이번
       판정이 정확히 겨냥한 위험은 **어떤 경로에도 매칭되지 않는 요청의 응답**이다 —
       핸들러 없는 404, malformed HTTP 400, 디스패치 전에 잘리는 413·415. 이들에는
       헤더를 적을 **문법상의 자리가 존재하지 않는다.** `paths`에 없는 응답을
       `paths` 아래에 적을 수 없다.
    ③ **`default` 응답도 대안이 아니다.** 한 오퍼레이션 안의 미문서화 상태 코드만
       덮고 오퍼레이션 밖은 못 덮으며, 명시된 상태 코드는 애초에 `default`를 쓰지 않는다.
    ④ **CORS 프리플라이트(OPTIONS) 응답에는 오퍼레이션이 없다.** 필터가 처리하므로
       스펙에 자리가 없는데, 전역 요구의 대상이기는 하다.
    ⑤ **모든 응답에 헤더를 적어 넣는 것은 "표현"이 아니라 "재열거"다.** 그렇게 하면
       G4가 지목한 실패 양상(사람이 기억해야 지켜지는 목록)을 스펙 안에 복제하는 셈이고,
       그러고도 ②·③·④는 여전히 못 덮는다. 그래서 `paths` 아래 선언을 늘리지 않았다.
    ⑥ **강제 수단의 계층 구조에 문법상의 자리가 없다.** OpenAPI는 "무엇이 나가야 하는가"를
       적는 문법이고 "무엇이 그것을 붙이는가"를 적는 문법이 아니다. 필터 1층으로는 6종이
       비고 밸브가 그 자리를 덮는다는 사실, 그리고 그 밸브가 Tomcat 결합이라는 사실은
       `x-` 확장의 산문으로만 남는다(`enforcement`·`x-container-coupling`).
       **이것이 실제 위험이다** — 스펙만 읽은 구현자는 "필터 하나면 이 요구를 만족한다"는
       결론에 도달할 수 있고, 실제로 그 결론이 2026-08-12 실측 전까지 이 계약의 서술이었다.

    **귀결**: 이 조항의 강제 수단은 스펙 밖에 있다 — contract test와 실측뿐이다.
    스펙은 요구를 **기술**할 수 있을 뿐 **검사 가능한 형태로** 만들지 못한다.
    "스펙에 적혀 있으니 검증됐다"고 읽으면 오독이다.
  x-origin-of-the-ten: |
    **아래 `x-private-response-headers.applies_to`의 10곳이 왜 하필 10곳인지의 출처.**
    그 목록은 Python `app/api/`의 `PRIVATE_RESPONSE_HEADERS` 부착 자리에서 왔다 —
    Python은 그 성공 응답 10곳에만 붙이고 오류 응답·204·`/health`에는 붙이지 않았다
    (실측 2026-08-12: 401·422 응답 헤더에 cache-control 없음). Kotlin 계약이 전역으로
    넓힌 뒤에도 이 10곳을 하한선으로 남긴 이유는 그 연혁이 아니라
    `x-private-response-headers.x-why-these-ten`의 위험도 기준이다.

    **2026-08-12 2차 재심 — 이 절의 옛 내용(`x-python-deviation`)은 대상 소멸로 정리됐다.**
    종전에는 "Python은 이 전역 요구를 만족하지 않는다 — 인정된 이탈이며, 관찰 기간에 두
    런타임의 헤더가 다른 것은 기록된 차이이므로 parity 불일치로 올리지 않는다"고 적혀
    있었다. 그 지시는 **Python과 Kotlin이 함께 도는 관찰 기간과 롤백 창**을 전제했는데,
    Python 폐기·재개발과 롤백 포기로 **전제 상황 자체가 없어졌다.** 헤더가 갈릴 상대
    런타임이 없으므로 기록할 차이도, 올리지 않을 불일치도 없다.
    **리더 판정(부수 결정 2 "Python은 고치지 않는다")이 뒤집힌 것이 아니다** — 판정이
    다루던 대상이 사라진 것이고, 결론("고치지 않는다")은 오늘도 그대로다.
    키 이름을 `x-python-deviation`에서 바꾼 것은 그 이름이 더는 존재하지 않는 이탈을
    가리키기 때문이다. 이 파일 밖에서 옛 이름을 참조하는 곳은 없음을 확인했다.
  x-phase3-measurement:
    status: "실측 완료 (2026-08-12) — 종전 '미실측' 서술은 무효. 필터 단층으로는 부족했고 밸브를 더해 충족"
    measured_by: "kotlin-implementer"
    environment: "Tomcat 11.0.22 / Spring Boot 4.1.0"
    method: |
      `@SpringBootTest(webEnvironment = RANDOM_PORT)`로 실제 포트를 열고 **원시 소켓**으로
      요청을 보내 응답 바이트를 그대로 읽었다.
      **MockMvc로는 이 항목을 측정할 수 없다** — 서블릿 컨테이너를 띄우지 않아 컨테이너가
      필터 앞·바깥에서 만드는 응답을 재현하지 못하고, 그런데도 **측정한 것처럼 보이는
      통과**가 나온다. 통과했다는 사실이 근거가 되지 않는 종류의 측정이므로,
      이 항목을 MockMvc로 다시 쓰는 것은 검증이 아니라 검증의 외양이다.
      HTTP 클라이언트 라이브러리도 malformed 요청을 교정해 버리므로 원시 소켓이 필요하다.
    reachable_by_filter:
      - "핸들러 없는 404"
      - "415 (미지원 Content-Type)"
      - "413 (요청 본문 상한 초과)"
      - "CORS 프리플라이트 OPTIONS 200"
      - "`sendError` → `/error` ERROR 디스패치 503"
      - "알 수 없는 메서드 → 405 (2026-08-19 재분류 — `x-405-reclassification`)"
    x-405-reclassification: |
      **2026-08-19 정정 — 근거 G1(계약이 사실과 달랐다).** 초판은 「알 수 없는 메서드 → 405」를
      아래 `unreachable_by_filter`에 넣어 미도달을 7종으로 셌다. 원시 소켓 실측(`FROB /health`,
      실기동 `@SpringBootTest(RANDOM_PORT)` · `03_kotlin-implementer_auth-fixes2.md` §4)에서
      **그 응답은 서블릿까지 도달한다.** 판별 근거 셋이 모두 같은 방향을 가리킨다.

        ① `Allow: GET`이 붙는다 — 매핑을 알아야만 만들 수 있는 헤더다.
        ② `Content-Type`에 `;charset=UTF-8`이 **없다.** 밸브가 만든 응답(콜론 없는 헤더 줄 400)
           에는 붙는다 — 두 응답의 생성자가 다르다는 표시다.
        ③ 본문이 **우리 고정 문구**다 — 컨테이너 기본 본문이 아니다.

      **별도 응답 조항을 만들지 않는다.** 이 405는 컨테이너가 아니라 프레임워크 오류 핸들러가
      만든 응답이므로 `x-error-body-universality`의 ④가 아니라 **①**에 속하고, 그 절이 이미
      요구를 건다. `paths` 아래에 선언할 자리는 여전히 없다 — 경로는 있으나 그 메서드의
      오퍼레이션이 없어 삼중키가 성립하지 않는다(`x-openapi-expressibility` ②와 같은 자리).
      **재분류로 바뀌는 것은 「무엇이 어느 층에 닿는가」이지 「무엇이 나가야 하는가」가 아니다.**
    unreachable_by_filter:
      note: |
        **요청 줄·헤더 블록 파싱 단계에서 거절되는 응답 6종.** 서블릿에 매핑되지 않아
        필터 체인이 **시작조차 하지 않는다.** 필터 배치를 어떻게 고쳐도 닿지 않는다 —
        배치 문제가 아니라 서블릿 컨테이너의 처리 순서 문제다.
        (2026-08-19까지 7종이었다. 하나가 사실과 달라 위 `x-405-reclassification`으로 옮겼다.)
      cases:
        - "요청 대상(request target) 금지 문자 → 400"
        - "콜론 없는 헤더 줄 → 400"
        - "요청 줄 파손(malformed request line) → 400"
        - "헤더 상한 초과 → 400"
        - "`Host` 헤더 없음 → 400"
        - "알 수 없는 HTTP 버전 → 505"
    resolution: |
      **계약을 좁히지 않고 강제 수단을 넓혔다**(`x-change-policy.escalate_to_leader` 1번의
      순서 ① — 먼저 닿게 만든다). Tomcat Engine 밸브가 위 6종 **전부**를 덮는 것을 계측으로
      확인하고 구현했다. 리더 재심(순서 ②)은 필요하지 않았다 — 물리적으로 닿지 않는 자리가
      남지 않았기 때문이다. 밸브의 컨테이너 결합은 `x-container-coupling`에 명시했다.
    negative_control: |
      **음성 대조를 함께 돌렸다.** 밸브를 빼면 malformed 계열 3건만 정확히 깨진다 —
      즉 이 테스트가 실제로 밸브의 존재를 측정하고 있음이 확인됐다. 음성 대조가 없으면
      "밸브가 없어도 통과하는 테스트"를 근거로 삼게 된다.
    x-rejected-hypothesis: |
      **후보 원인으로 지목됐던 `OncePerRequestFilter.shouldNotFilterErrorDispatch()`는
      기각됐다.** 대조 실험 결과 그 오버라이드와 `DispatcherType.ERROR` 등록을 **둘 다
      기본값으로 되돌려도** 헤더가 남는다 — 필터가 `chain.doFilter` **앞에서** 헤더를 쓰고
      Tomcat이 포워딩에서 버퍼만 비우기 때문이다.
      종전 이 계약과 스킬 §5.2가 "후보 원인"으로 적었던 세 가설 중 하나가 이렇게 정리됐다.
      **후보를 사실로 적지 않았던 것이 여기서 값어치를 했다** — 사실로 적었다면 기각을
      기록할 자리가 없었다.
    residual: |
      이 실측이 다룬 것은 **두 헤더의 유무**뿐이다. 같은 6종 응답의 **본문 모양**은 아직
      측정되지 않았다 — `x-error-body-universality.x-unmeasured`가 그 자리다.
  x-superseded: |
    이 절은 종전 `x-private-response-headers.does_not_apply_to`("DELETE 204 · /health ·
    모든 오류 응답")를 **무효화한다.** 그 목록의 유래는 Python 동작이었고
    (`x-origin-of-the-ten`), Kotlin 계약에서는 제외 대상이 없다.
    개선 원장의 V2-3(DELETE 204의 헤더)도 이 판정에 흡수됐다.

# -----------------------------------------------------------------------------
# 하한선 — 개인정보·자격증명이 실리는 고위험 10곳.
#
# 전역 규칙이 있는데도 이 목록을 남기는 이유: 필터가 제거되거나 체인 순서가 어긋나도
# **고위험 경로에서 테스트가 먼저 깨져야** 하기 때문이다(2026-08-12 리더 판정 부수 결정 1).
# 이 10곳의 개별 contract test는 삭제하지 않는다.
# Python 기준선 확인: grep -rn "headers.update(PRIVATE_RESPONSE_HEADERS)\|\*\*PRIVATE_RESPONSE_HEADERS" app/api/ | wc -l  → 10
# -----------------------------------------------------------------------------
x-private-response-headers:
  role: |
    **하한선이지 범위가 아니다.** 요구의 정본은 `x-global-response-headers`이고
    이 목록은 그 요구가 무너졌을 때 가장 먼저 깨져야 하는 자리를 지목한다.
    여기에 없는 응답이라고 헤더가 없어도 되는 것이 아니다.
  headers:
    Cache-Control: no-store
    X-Content-Type-Options: nosniff
  applies_to:
    - "POST /auth/signup"              # 이메일이 실린다
    - "POST /auth/login"               # 응답 본문이 Bearer 토큰 자체다
    - "GET /auth/me"                   # 이메일이 실린다
    - "GET /documents"                 # 제목이 본문 첫 줄에서 유도한 사용자 콘텐츠다
    - "GET /conversions/{conversion_id}"       # masked_items[].original에 실제 개인정보
    - "PUT /conversions/{conversion_id}"       # GET과 같은 응답 스키마
    - "GET /conversions/{conversion_id}/export"  # 자리표시자가 원문으로 복원된 최종본
    - "GET /workspaces"                # 작업 공간 이름도 사용자가 적은 콘텐츠
    - "POST /workspaces"
    - "PATCH /workspaces/{workspace_id}"
  x-why-these-ten: |
    이 열 자리를 고른 규칙은 **"개인정보·자격증명이 실리는 응답"**이다.
    `POST /auth/login`은 Bearer 토큰 자체를, 나머지 `/auth` 둘은 이메일을, 문서·작업 공간
    응답은 사용자 콘텐츠를 싣는다. 헤더가 빠지면 **200 OK로 나타나는 보안 사고**라
    본문 검증으로는 절대 잡히지 않는다 — 그래서 전역 규칙과 별개로 개별 단언을 남긴다.
    이 목록은 `paths` 아래 개별 응답의 헤더 선언 10건과 1:1로 대응한다.
  x-not-a-scope: |
    **여기 없는 응답에도 헤더는 붙는다.** 종전 이 절에 있던 `does_not_apply_to`
    (DELETE 204 · `/health` · 모든 오류 응답)는 2026-08-12 리더 판정으로 **무효**이며,
    그 목록이 어디서 왔는지는 `x-global-response-headers.x-origin-of-the-ten`에 남아 있다.
    Kotlin 계약에는 제외 대상이 없다.
  x-resolved-question:
    id: OQ-1
    subject: "사적 헤더를 모든 응답에 붙일 것인가 (전역 필터)"
    status: "종결 (2026-08-12 리더 판정) — **전역 부착 승인**"
    resolution_ref: "`x-global-response-headers` (요구의 정본)"
    path: |
      계약 소유자가 재심을 **제기**하고 리더가 **판정**했다. 계약 소유자는 전제 변화
      (parity 재현이 더는 목표가 아님)를 근거로 리더 판정을 **스스로 뒤집지 않고** 올렸다.
      결과가 같아도 경로가 다르다 — 이 절차가 없으면 앞으로 어떤 리더 결정도 "전제가
      바뀌었다"는 주장 하나로 무효화된다(`x-change-policy.escalate_to_leader` 1번).
    x-corrected-premise: |
      재심 제기 시 계약 소유자가 적었던 **"넓혔다가 좁히려면 서블릿 API에 헤더 삭제
      수단이 없어 되돌릴 수 없다"는 과장이며 판정과 함께 정정됐다.** 좁히는 것은 필터
      하나에 조건을 더하는 일이지 전송된 헤더를 회수하는 일이 아니고, 절체 전이라 캐시에
      남은 응답도 없다. 판정이 틀린 전제 위에 기록되지 않도록 함께 남긴다.
      다만 **비대칭 판단 자체는 옳았다** — 좁은 쪽을 기본값으로 두고 재심을 올린 절차
      판단은 이 정정과 무관하게 유효하다.

