x-changelog:
  - version: "1.1.0"
    date: "2026-08-19"
    revision: "G24-R1"   # 2026-08-12의 `R-1`(호환 요구 정리)과 다른 항목이다 — 게이트 24 R-1
    author: contract-keeper
    change: |
      **401 균일화 열거가 두 조항에서 갈리던 내부 모순을 정합시켰다.**
      (교차 종합 게이트 24 **R-1** · 3관점 ⓒ.)
        - `components/responses/Unauthorized.description` — **사유 열거를 걷어내고**
          정본(`x-auth.failure_uniformity`)을 가리키게 했다. 이 응답이 고정하는 것은
          **두 문구 구조**(무헤더 / 토큰 제시)임을 표로 명시.
        - `x-auth.failure_uniformity` — ① "이 조항이 정본"임을 선언, ② `위조`가
          **서명 불일치·필수 클레임 누락·`typ` 용도 불일치**를 포함함을 명시,
          ③ **범위 조항 신설** — `Authorization` 헤더가 아예 없는 갈래는 균일화 대상이
          아니며, 균일성 판정의 대상은 **토큰·자격증명이 제시된 갈래들**이다.

      **무엇이 갈렸었나**(줄 위치는 **정정 전** 기준) — `x-auth`(`:299-302`)는 *이메일 부재·
      비밀번호 불일치·토큰 만료·위조·계정 삭제*로 **무헤더가 없었고**, `Unauthorized`(`:1495-1498`)는
      *헤더 누락·토큰 위조·만료·용도 불일치·계정 삭제*로 **무헤더가 있었으며**,
      같은 블록 **세 줄 뒤**가 "메시지는 두 가지가 나온다"로 자기 자신을 반증했다.
      구현(`b9097f6`)은 첫째만 인용해 무헤더를 제외했다.
    basis: |
      근거 **G1**(계약이 사실과 다르다 — 내부 모순). 한 계약이 같은 요구를 두 곳에
      다르게 적었고, 그중 한 곳은 **자기 블록 안에서** 반증됐다. "같은 메시지로
      처리한다"와 "메시지는 두 가지가 나온다"는 동시에 참일 수 없다.

      **정본을 `x-auth`로 고른 이유 셋.** ① 그쪽이 인증 요구를 모아 둔 **규범 확장**이고
      `Unauthorized`는 그 요구가 나타나는 **응답 표현**이다. ② `Unauthorized` 쪽 문면만
      자기 반증을 안고 있었다. ③ 세 관점의 실질 판단이 **무헤더 제외가 옳다**로 수렴했다
      — codex는 계약 열거 근거로, privacy-gate는 **기제 근거**(요청자가 만든 상태 사이에
      서버 비밀이 없어 정보 이득 0)로, Claude는 판정 유보. 리더가 이 방향을 지시했다.

      **열거를 없애지 않고 정본으로 병합했다 — 잃은 요구는 0이다.** `Unauthorized`에만
      있던 `용도 불일치`는 `x-auth`의 `위조` 괄호로 들어갔고(`claim_typ`·
      `required_claims`가 이미 같은 것을 요구한다), `x-auth`에만 있던 이메일 부재·
      비밀번호 불일치는 `Unauthorized` 둘째 갈래 서술에 남는다.

      **복사를 다시 만들지 않았다.** 종전 문면을 「무헤더만 빼고 그대로」 고치면 두 벌
      목록이 그대로 남아 다음 개정에서 또 갈린다. 드리프트의 기제가 **중복**이므로
      한쪽을 포인터로 바꿨다(프로젝트 규약: 정본에 값을 옮겨 적지 않는다).

      **무헤더 제외는 균일성 불변식의 축소가 아니다.** 불변식이 막는 것은 「서버만 아는
      사실이 응답 차이로 새는 것」이고, 무헤더↔토큰있음은 요청자가 만든 상태라 그 사실을
      담지 않는다. 그래도 자유도를 좁히는 방향이므로 **단독으로 정하지 않았다** —
      `x-change-policy.escalate_to_leader` ③에 따라 리더 지시(게이트 24)를 근거로 삼는다.

      **`info.version`은 올리지 않는다** — 와이어에 나가는 상태 코드·본문·헤더·예시가
      하나도 바뀌지 않는다. 두 `detail` 예시(`no_header`·`invalid_token`)도 그대로다.
    react_impact: |
      **없다**(실측). `frontend/src/api/client.ts:128`의 401 분기는
      `response.status === 401 && token !== null` 하나뿐이고 **`detail` 문자열을 비교하지
      않는다** — `readErrorMessage`(`:69-89`)가 문자열 `detail`을 그대로 화면 문구로 넘길
      뿐이다. 두 문구를 코드에 박아 둔 곳은 프런트에 **0건**이다(grep: `인증이
      필요합니다` → `frontend/src` 0, `backend-kotlin` 1 =
      `AuthenticationInterceptor.kt:95` 상수). 응답 바이트가 안 바뀌므로 화면 영향도 없다.
    affected_tests: |
      - **계약 테스트 변경 없음.** X-A2(`00_contract-keeper_test-plan.md`)·L-3·M-3
        (`03_contract-keeper_auth-test-spec.md`)이 이미 **두 갈래로 나눠** 재고 있어
        정정된 문면과 일치한다. 단언이 바뀌는 케이스가 0건이다.
      - **문서 드리프트 1건 잔존** — `00_contract-keeper_test-plan.md` §2 **X-A2** 행이
        `x-auth.failure_uniformity`를 인용하면서 「헤더 누락」을 열거에 넣고 있다(옛 넓은
        문면의 잔재). 이번 커밋 범위 밖이라 **별도 문서 커밋에서 정정**한다. 실제 케이스
        (L-3·M-3)는 이미 좁은 범위로 갈라 재므로 강제되는 동작은 어긋나지 않는다.
      - `AuthenticationWorkUniformityTest`(구조 단언)는 **토큰 제시 갈래**만 묶으므로
        정정된 범위와 정합한다. 무헤더를 넣은 4갈래 시간 비는 이 조항의 측정이 아니다.
    notified: [kotlin-implementer, parity-verifier, privacy-gate, migration-reviewer, 리더]

  - version: "1.1.0"
    date: "2026-08-19"
    revision: "D-2"
    author: contract-keeper
    change: |
      **`DELETE /workspaces/{workspace_id}` — 409 두 갈래가 동시에 해당할 때의 순서 신설.**
      (교차 종합 게이트 22 **X-12**. 3자 대조 미결 D-2.)
        - `paths./workspaces/{workspace_id}.delete.description` 409 두 갈래 서술에
          **"둘 다 해당하면 「마지막 남은 작업 공간」을 낸다"** 한 문단 추가.
      **문면은 이 한 곳뿐이다** — 상태 코드(409)·본문 스키마·두 `detail` 예시는 그대로이고,
      바뀐 것은 **겹치는 상태에서 둘 중 어느 예시가 나가는가**뿐이다.
    basis: |
      근거 **G2**(요구사항이 요구한다). 지목하는 요구사항은 **이 조항 자신이 적어 둔 것**이다 —
      계획 §2.3에서 온 갈래 1의 사유("되돌릴 수 없는 파기를 「정리」라는 이름으로 실행하게
      두지 않는다"). 순서를 반대로 고르면 사용자는 안내대로 문서를 지우고 **다시** 거절당하고,
      그 조항이 막겠다고 적은 파기가 **안내를 따랐기 때문에** 일어난다. 계약이 침묵하면 그
      순서도 계약을 만족하므로, 침묵은 조항 자신의 목적을 지키지 못한다.

      **드문 자리가 아니다.** 겹치는 상태는 「작업 공간이 하나뿐이고 그 안에 문서가 있다」이며
      기본 작업 공간이 가입 때 하나 만들어지므로(`paths./auth/signup.post.description`),
      가입 후 문서를 올리고
      두 번째 공간을 만들지 않은 **모든** 사용자의 상태다.

      **구현이 고른 순서가 옳다고 판정했다** — 바꾸라는 개정이 아니라 계약이 그것을 말하게
      하는 개정이다(`WorkspaceService.refusalFor`가 `ownedWorkspaceCount <= 1`을 먼저 본다).

      **`info.version`은 올리지 않는다** — 와이어 스키마·상태 코드·본문 필드·enum이 하나도
      바뀌지 않고, 생성 타입에 나타나는 차이가 0이다. 다만 **자유도 하나를 좁힌 것은
      맞다**(종전에는 두 순서가 다 계약을 만족했다). 좁히는 방향이지만 보안 불변식이 아니고
      React 런타임 코드도 이 오퍼레이션을 부르지 않아, `x-change-policy.escalate_to_leader`
      ①~④ 어디에도 해당하지 않는다.
    react_impact: |
      **없다.** `frontend/src/api/client.ts`에 이 오퍼레이션의 호출부가 아예 없다(UI 범위 밖 —
      같은 `description`이 그 사실을 적고 있다). 409 문구를 읽는 화면도 없다.
    affected_tests: |
      - **WD-9 신설** — 겹치는 상태(마지막 하나 + 문서 있음)에서 409 `detail`이 **`last_one`
        예시**와 같고 `has_documents` 예시와 **다름**을 함께 단언한다. 명세는
        `03_contract-keeper_workspaces-test-spec.md` §2-4.
      - **지금 이 순서를 재는 케이스가 0건이다**(실측): WD-4는 공간을 하나 **더 만든 뒤**
        문서를 넣고, WD-5는 **문서 없는** 마지막 공간을 지운다. 즉 순서를 뒤집어도 현재
        계약 테스트는 전부 초록이다 — WD-9이 없으면 이 조항은 강제되지 않는다.
    notified: [kotlin-implementer, parity-verifier, migration-reviewer, 리더]

  - version: "1.1.0"
