        수단이 되므로 캐시 금지 헤더가 반드시 붙는다.
        실패는 401이며 이메일 부재와 비밀번호 불일치를 구분하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
