openapi: 3.1.0

# =============================================================================
# easy-doc 외부 HTTP 계약 v1
#
# 이 파일이 Kotlin API 구현과 React 타입 생성의 **단일 정본**이다.
# 계약 스펙 전문을 다른 문서에 복사하지 않는다 — 두 벌이 갈라지면 어느 쪽이 정본인지
# 알 수 없게 된다.
#
# ## 이 계약이 무엇인가 (2026-08-12 개정)
#
# **요구사항이 요구하는 인터페이스**다. 현재 Python 구현의 스냅샷이 아니다.
# 초판(2026-08-12)은 "현재 Python 동작을 v1으로 동결한다"는 전제로 썼으나,
# 사용자 결정으로 그 전제가 걷혔다 — **Python은 회귀가 잦은 구현이지 기준이 아니다.**
# 따라서 Python 동작은 이제 **가장 신뢰도 높은 출발점**이지 정답이 아니며,
# 명백히 잘못된 계약(상태 코드 오용, 필드 누락, 실재하지 않는 값 예시)은 고친다.
#
# 그렇다고 아무나 아무 때나 바꿀 수 있는 문서는 아니다. 바꿀 수 있는 근거와
# 바꿀 수 없는 것을 `x-change-policy`에 적었다. **그 절을 읽지 않고 이 파일을 고치지 않는다.**
#
# 계약이 여전히 계약인 이유: React가 의존하는 인터페이스이고, Kotlin 구현과 프런트
# 타입 생성이 같은 한 곳을 읽어야 두 쪽이 갈리지 않는다.
#
# ## 출처
#
# 조항의 1차 출처는 과거 Python 참고 구현(`app/api/*.py`·`app/main.py`)의 실제 동작이었다
# — 그 구현은 2026-08-24 재개발 전환으로 저장소에서 제거됐고 git 태그
# `pre-python-removal-20260824`에서만 열람할 수 있다. "그렇게 동작했다"가 곧
# "그래야 한다"는 아니다. Python과 의도적으로 다른 조항은
# 각 자리에 `x-improved` 또는 산문으로 근거를 남긴다.
# 3자 대조 기록: `docs/migration/_workspace/00_contract-keeper_three-way-diff.md`
# 재분류 기록: `docs/migration/_workspace/02_contract-rebase.md`
#
# FastAPI 자동 생성 OpenAPI(`docs/migration/_workspace/00_contract-keeper_openapi-fastapi.yaml`)는
# 초안으로만 썼다. 자동 생성물에는 401·404·409·413·502·503, 모든 응답 헤더,
# multipart 요청 본문, CORS, status enum이 빠져 있어 손으로 채웠다.
# (이 줄은 **초판 작성 경위**다. 그중 502는 2026-08-20에 폐기됐다 — `x-retired-responses`.)
#
# 이 파일의 예시 값은 전부 합성이다. 실제 사용자 데이터·개인정보를 넣지 않는다.
# =============================================================================

info:
  title: Easy-Read AI API
  version: "2.7.0"
  x-baselined-at: "2026-08-12"       # 초판 기준선을 뜬 날 (동결일이 아니다)
  x-rebased-at: "2026-08-12"         # 계약의 성격을 "개선 대상"으로 다시 정의한 날
  x-source-runtime: "Python 3.12 / FastAPI (app/main.py) — 과거 참고 구현이었고 2026-08-24 저장소에서 제거됨(git 태그 pre-python-removal-20260824). 기준선 출처였을 뿐 정답이 아니었다"
  x-change-policy-ref: "최상위 x-change-policy"
  description: |
    공공기관용 '쉬운 글' 자동 변환 서비스의 HTTP 계약 v1.

    **엔드포인트는 정확히 16개다** — 제품 15개 + 헬스 체크 1개.
    계획 §2.2가 센 "14개 HTTP 엔드포인트"는 **그 문서를 쓸 때의 수**이며 `/health`를
    포함해야 맞는 수였다. 1.5.0에서 `PUT /conversions/{conversion_id}/feedback`이,
    2.2.0에서 `GET /documents/{document_id}/source`가 더해져 오늘은 16개다 —
    계획 문서의 수를 고치는 것이 아니라 **수의 정본이 이 계약**이다.

    ## 경로 접두사
    애플리케이션 경로에는 `/api` 접두사가 없다. `app/api/auth.py`의
    `APIRouter(prefix="/auth")`만 존재하고 문서·작업 공간 라우터는 접두사가 없다.
    nginx가 `/api`로 프록시하는 구성(계획 §5 Phase 6)은 **배포 구성 항목**이며
    이 스펙이 정하는 애플리케이션 경로와 별개다.

    ## 오류 본문 계약
    모든 오류 응답의 최상위 키는 `detail` **하나뿐**이고, `Content-Type`은
    `application/json`이다 (`application/problem+json` 아님).
    `detail`은 **문자열 또는 객체 배열의 union**이다:
      - 도메인 예외 → 문자열(한국어 사용자 문구)
      - 입력 검증 실패(422) → `[{loc, msg, type}]` 객체 배열
    React `frontend/src/api/client.ts`의 `readErrorMessage`가 두 모양을 모두
    분기 처리하므로, 한쪽만 구현하면 화면에서 진짜 사유가 사라지고 폴백 문구만 나온다.
    Spring 기본 `ProblemDetail`을 그대로 노출하면 계약 위반이다(계획 §2.2).

    **"모든 오류 응답"은 경로를 가리지 않는다.** 전역 예외 매퍼를 거친 응답만이 아니라,
    `HttpServletResponse.sendError(...)`로 만들어져 `/error`로 ERROR 디스패치된 응답,
    컨테이너가 직접 만든 응답까지 포함이다. 2026-08-12 실측에서 `sendError` 경로가
    `{"timestamp":…,"status":…,"error":…,"path":…}`(Spring `BasicErrorController` 기본
    본문)를 내는 것이 확인됐다 — 이는 `ProblemDetail`이 새는 것과 같은 등급의 위반이다.
    요구와 검증의 정본은 최상위 `x-error-body-universality`이며, 이 자리 역시 OpenAPI
    문법으로는 끝까지 표현되지 않는다(같은 절의 `x-openapi-expressibility`).

    ## 422 응답의 입력값 에코 금지
    검증 실패 응답 항목에 `input`·`ctx` 키를 **넣지 않는다**. FastAPI 기본 핸들러는
    넣지만 `app/api/errors.py`의 `_handle_request_validation`이 걷어낸다 —
    비밀번호가 응답 본문과 액세스 로그에 남는 경로이기 때문이다.
    실측 확인(2026-08-12): `POST /auth/signup` 본문에서 `password`를 빼면
    `{"detail": [{"loc": ["body", "password"], "msg": "Field required", "type": "missing"}]}`.

    ## 소유권 은닉
    다른 사용자의 자원은 **403이 아니라 404**다. 없는 자원과 남의 자원을 구분하지
    않는다 — 구분하면 식별자의 존재 여부가 새어 나간다. 403이 새면 스타일 문제가
    아니라 보안 계약 위반이다(계획 §5 Phase 7 즉시 중단 기준).

    ## 인증 실패와 입력 검증의 우선순위
    **인증이 먼저다.** 이것은 Python이 그렇게 동작해서가 아니라 **그래야 하기
    때문이다** — 인증되지 않은 호출자에게 검증 의미론(어느 파라미터가 어떤 범위를
    받는지, 어떤 경로가 UUID를 요구하는지)을 알려 줄 이유가 없다. 순서가 뒤집히면
    토큰 없이도 API 표면을 탐색할 수 있게 된다.
    실측 확인(2026-08-12): 위조 토큰으로 `GET /documents?limit=0`,
    `DELETE /documents/not-a-uuid`, `GET /conversions/{id}/export?format=pdf`를
    호출하면 셋 다 422가 아니라 **401**이 나온다. Kotlin 구현에서 Bean Validation이
    보안 필터보다 먼저 돌면 이 순서가 뒤집혀 계약 위반이 된다.

    ## 필드 이름
    모든 JSON 필드는 **snake_case**다. Jackson 기본 네이밍 전략이 camelCase로 바꾸면
    계약 위반이다. 식별자는 UUID 문자열, 시각은 ISO 8601 문자열이다.

    ## 응답 헤더 — 전역 요구 (2026-08-12 리더 판정)
    `Cache-Control: no-store`와 `X-Content-Type-Options: nosniff`는 **Kotlin 런타임이
    내보내는 모든 응답**에 붙는다. 상태 코드·경로·핸들러 유무를 가리지 않는다.
    **`paths` 아래 개별 응답에 적힌 헤더 선언을 "붙는 자리 목록"으로 읽으면 안 된다** —
    그것은 고위험 경로에 남긴 **하한선**이고 범위가 아니다. 그 선언이 몇 건인지는 이 자리에
    적지 않는다 — 하한선 목록은 늘어나는데(1.5.0에서 피드백 오퍼레이션이 더해졌다) 수를
    옮겨 적은 산문은 따라오지 않아 조용히 거짓이 된다(게이트 28 P-5가 서수를 버린 것과 같은 처방).
    요구의 정본은 최상위 `x-global-response-headers`이며, **OpenAPI 문법으로는 이 요구를
    끝까지 표현할 수 없다**(같은 절의 `x-openapi-expressibility`에 무엇을 표현하지 못하는지
    적었다). 이 요구의 대상은 **Kotlin 런타임 하나뿐**이다 — Python은 폐기·재개발
    대상이고 롤백 창이 없으므로 "두 런타임의 헤더가 다르다"는 상황이 존재하지 않는다
    (2026-08-12 2차 재심, `x-global-response-headers.x-origin-of-the-ten`).

servers:
  - url: http://localhost:8000
    description: 개발 서버 (React는 VITE_API_BASE_URL로 주입받는다)

# -----------------------------------------------------------------------------
# 계약 변경 기준 — 이 계약은 동결물이 아니라 개선 대상이다.
# 이 절이 "무엇을 근거로 바꿀 수 있고 무엇은 못 바꾸는지"의 정본이다.
# -----------------------------------------------------------------------------
x-change-policy:
  premise: |
    Python 구현은 회귀가 잦아 Kotlin으로 옮기는 중이다. 따라서 **Python과 같은 값을
    내는 것이 목표가 아니고**, 프로젝트 요구사항을 만족하는 인터페이스를 내는 것이 목표다.
    "Python이 이렇게 한다"는 사실 진술이지 근거가 아니다.

  # 바꿀 수 있는 근거 — 이 넷 중 하나에 해당해야 변경이 성립한다.
  valid_grounds:
    - id: G1
      name: 계약이 사실과 다르다
      detail: |
        스펙에 적힌 값이 어떤 구현에서도 나오지 않는다(존재하지 않는 예시 값, 잘못 옮겨
        적은 상태 코드, 실제와 다른 필드명). 판단이 필요 없는 오기이므로 즉시 고친다.
    - id: G2
      name: 요구사항이 그것을 요구한다
      detail: |
        제품·보안·운영 요구사항이 현재 조항으로 충족되지 않는다. 근거로 요구사항을
        지목해야 하며 "이게 더 낫다"는 취향 진술은 근거가 아니다.
    - id: G3
      name: 정책 결정이 바뀌었다
      detail: |
        사용자·리더가 정책을 바꾸면 계약이 따라간다(예: 마스킹 범주 5종 → 2종,
        2026-08-12 사용자 결정). 계약 소유자가 정책을 만들지는 않는다.
    - id: G4
      name: 조항이 지킬 수 없거나 지켜지지 않는 형태다
      detail: |
        Kotlin/Spring에서 물리적으로 만족시킬 수 없거나, 사람이 매번 기억해야만 지켜지는
        조항이라 이미 두 번 이상 누락된 이력이 있다. 이때는 **결과가 아니라 강제 수단**을
        함께 바꾼다.

  # 바꿀 수 없는 것 — 근거가 G1~G4에 해당해도 이 목록은 계약 소유자 단독으로 못 바꾼다.
  invariants:
    - "소유권 은닉 404 (403 금지) — 보안 계약이다"
    - "오류 본문 최상위 키 `detail` 하나, Content-Type application/json — **어떤 경로로 만들어진
       오류 응답이든** 적용된다(2026-08-12 명시, 정본 `x-error-body-universality`).
       핸들러가 만든 응답만이 아니라 `sendError` → `/error` 디스패치와 컨테이너 생성 응답까지다"
    - "422 응답에 입력값 에코 금지(`input`·`ctx`) — 비밀번호 유출 경로"
    - "JSON 필드 snake_case"
    - "JWT 페이로드에 개인정보 금지 (sub·exp·typ 세 개)"
    - "Cache-Control: no-store + X-Content-Type-Options: nosniff — Kotlin 런타임의 모든 응답
       (2026-08-12 리더 판정, 정본 `x-global-response-headers`). 고위험 경로 목록
       (`x-private-response-headers.applies_to`)은 좁힐 수 없는 하한선이다"
    - "인증 실패 응답의 균일성(계정 열거 방지)"
  invariants_note: |
    위 목록은 깨지면 사용자 데이터가 새는 항목이다. 개선의 이름으로도 좁히지 않는다.
    넓히는 방향(더 많은 응답에 no-store)은 리더 승인 사항이지 금지가 아니다.

  # 계약 소유자가 단독으로 못 정하는 것
  escalate_to_leader:
    - "리더가 이미 명시적으로 판정한 조항을 뒤집는 변경 — 전제가 바뀌었더라도 재심을 요청한다"
    - "React 런타임 코드가 이미 의존하는 동작의 변경 (테스트·타입만 닿는 것은 제외)"
    - "invariants 목록의 축소"
    - "배포·운영 동작이 달라지는 변경 (헬스 체크 상태 코드, 컨테이너 재시작 조건 등)"

  # 절차
  procedure: |
    1. 근거를 G1~G4 중 하나로 지목한다. 지목할 수 없으면 변경하지 않는다.
    2. React 영향을 먼저 확인한다 — `frontend/src/api/types.ts`·`client.ts`·컴포넌트를
       읽고 무엇이 깨지는지 적는다. "아마 괜찮다"는 확인이 아니다.
    3. 파괴적인지 판정한다. 필드·헤더·상태 코드 추가는 대개 비파괴, 제거·이름 변경·
       타입 축소·enum 값 제거는 파괴다.
    4. 계약과 contract test를 **같은 변경 단위**에서 고친다. 스펙만 바뀌면 두 기준이 충돌한다.
    5. `x-changelog`와 `docs/migration/_workspace/00_contract-keeper_changelog.md`에
       조항·근거 ID·영향받는 테스트·통보 대상을 남긴다.
    6. `kotlin-implementer`와 `parity-verifier`에 통보한다.

  parity_relationship: |
    **parity 불일치는 더 이상 자동으로 차단 사유가 아니다.** 계약이 Python과 의도적으로
    다른 조항에서는 Kotlin이 계약을 따르는 것이 옳고, parity 하네스는 그 차이를
    "의도된 차이"로 기록한다. 반대로 계약에 없는 자리에서 값이 갈리면 종전대로 차단이다.
    판정 권한은 계약 소유자에게 있다.

# -----------------------------------------------------------------------------
# 폐기된 응답 — **되살리지 않기 위해 이름을 남긴다**
#
# 조항을 지우기만 하면 다음 사람이 같은 자리를 "빠뜨린 것"으로 보고 되살린다.
# `x-title-policy.x-superseded`와 같은 장치이며, 여기 적힌 상태 코드는
# **어느 오퍼레이션의 `responses`에도 나타나서는 안 된다**(계약 테스트가 그것을 잰다).
# -----------------------------------------------------------------------------
x-retired-responses:
  - status: "502"
    component: BadGateway
    retired_at: "2026-08-20"
    ground: G1
    retired_by: "리더 판정 L-1 (게이트 27 교차 종합 행 2) — 계약·구현·테스트를 한 변경 단위로"
    was: |
      "하위 시스템 장애 — 재시도할 값어치가 있다"로 두 사유를 담았다:
      `QueueUnavailableError`(큐 등록 시도 실패)와 `LLMProviderError`(및 하위 둘).
      선언 자리는 `POST /documents`의 `'502'` 하나뿐이었다.
    why: |
      **두 사유 모두 이 API에서 만들 수 없다.**

      1. `QueueUnavailableError` — Redis/ARQ 전제였다. 큐가 같은 DB로 옮겨오면서 등록이
         저장과 **같은 트랜잭션**에 들어갔고, "저장은 됐는데 등록은 실패"라는 상태가
         구조적으로 성립하지 않는다. 등록이 실패하면 전량 롤백이고 그때 옳은 코드는
         500이다. 실측(2026-08-20): 그 예외를 던지는 제품 코드가 **0곳**이었다.
      2. `LLMProviderError` — **15개 오퍼레이션 중 동기로 LLM을 부르는 것이 없다.**
         변환은 워커가 비동기로 하고, LLM 실패는 HTTP 상태가 아니라
         `ConversionResponse.failure_code` 값으로 사용자에게 간다.
         (수는 1.5.0에서 14에서 15로 늘었다 — 새 오퍼레이션
         `PUT /conversions/{conversion_id}/feedback`도 LLM을 부르지 않으므로
         이 진술은 그대로 참이다.)

      즉 502는 이 계약에서 **도달 0인 조항**이었다. 조항만 지우고 컴포넌트를 남기면
      참조 없는 고아가 되고, 그것을 읽는 테스트는 자기 사본과 대조해 초록이 된다.
    if_it_should_return: |
      **동기로 하위 시스템을 부르는 오퍼레이션이 새로 생기면** 그때 다시 세운다.
      그 변경은 조항 하나가 아니라 ⑴ 컴포넌트 ⑵ 그 오퍼레이션의 `responses`
      ⑶ 502와 503과 500을 가르는 근거 ⑷ React 실패 안내를 한 단위로 갖춰야 한다.
    consumer_debt: |
      `frontend/src/conversion/failureMessages.ts`의 `EnqueueFailed` 항목은 이제 어떤
      구현에서도 오지 않는 코드다(조회는 `MESSAGES[code] ?? UNKNOWN`이라 **런타임은
      깨지지 않는다**). `frontend/src/pages/UploadPage.tsx`의 `502(변환 서비스)` 주석도
      같다. 둘 다 Phase 6 타입 교체에서 회수한다.
      `frontend/src/api/client.test.ts`의 502 픽스처는 **일반 오류 경로 검증**이라
      이 조항과 무관하다 — 건드리지 않는다.

# -----------------------------------------------------------------------------
# 폐기된 503 구성 — `ServiceUnavailable`이 한때 열거했던 "구성 상태"들
# (2026-08-20 신설. **이 절이 정본이다** — 사유·근거·되살릴 조건은 여기 한 곳에만 적는다)
#
# **서수로 부르지 않는다.** 종전에는 같은 줄을 「세 줄」·「두 줄」·「넷째 줄」로 세 자리가
# 서로 다르게 세어 무엇이 참인지 계약 자체로 결정할 수 없었다(게이트 28 P-5). 원인은
# 내용 불일치가 아니라 **활성 목록이 줄어드는데 서수가 그대로 인용된 것**이다 —
# 「세 줄」은 블록 항목 수, 「두 줄」은 실제 폐기 수, 「넷째 줄」은 줄어들기 전 목록의
# 서수였고 셋 다 각자 참이었다. 그래서 처방은 다시 세는 것이 아니라 **서수를 없애는 것**이다.
# 각 항목에 바뀌지 않는 `id`를 주고 다른 자리는 그 id로만 가리킨다.
#
# `x-retired-responses`와 다른 것: 저쪽은 **상태 코드 자체**의 폐기이고 이쪽은 그 상태 코드가
# 살아 있는 채로 **그것을 만드는 구성 상태**의 폐기다. 503은 지금도 유효하다.
# -----------------------------------------------------------------------------
x-retired-503-configurations:
  x-what-remains: |
    **남은 구성은 하나뿐이다 — 인증 서명 키.** 그 줄의 조항은
    `components/responses/ServiceUnavailable`에 있고, 이 절은 **내려간 것**만 담는다.
    두 자리가 같은 것을 적지 않는다.
  retired:
    - id: queue
      was: "큐(Redis) 미배선 → 업로드"
      retired_at: "2026-08-20"
      revision: "1.3.0"
      ground: G1
      why: |
        PostgreSQL lease 큐에서 큐는 **별도 배선을 갖지 않는다.** 작업 테이블은 Flyway
        마이그레이션이고 접속은 같은 DataSource다. "큐만 미배선"은 독립한 구성 상태로
        **존재하지 않는다.** 실측(2026-08-20): 큐 배선에 대한 `ConfigurationException` 0곳.
      also_removed: "예시 `no_queue`"
    - id: cipher
      was: "저장 암호화 키 미설정 → 문서 API 전체"
      retired_at: "2026-08-20"
      revision: "1.3.0"
      ground: G1
      why: |
        **2026-08-19 리더 판정(게이트 25 F-2·F-3·X8)이 이 자리의 규약을 뒤집었다.**
        저장 암호화는 오설정이 드러나는 시점이 다르다 — 키가 틀리면 **성공한 채 열 수 없는
        행**을 남기고 그것은 되돌릴 수 없다. 그래서 **기동 자기점검이 앱을 띄우지 않는다.**
        "키가 없는데 서비스 중"인 상태가 없으므로 그 503은 도달 0이었다.
      also_removed: |
        예시 `no_cipher`. 실측하면 그 문구는 구현의 방어 상수와도 **이미 갈려 있었고**
        둘 다 나가지 않으므로 아무 데서도 걸리지 않았다 — **도달 0인 조항이 조용히
        갈리는 방식**이 그것이다.
    - id: datasource
      was: "DB 세션 팩토리 미배선 → 전체"
      retired_at: "2026-08-20"
      revision: "1.4.0"
      ground: G1
      x-was-deferred: |
        **1.3.0에서는 내리지 않았다 — 재지 않았기 때문이다.** 그 유보는 옳았고
        (`재지 않은 것을 지우지 않는다`), 게이트 28 P-5가 그 유보 자체를 마감으로 올렸다.
        **1.4.0에서 재고 내렸다.** 아래 `measured`가 그 측정이다.
      why: |
        **DataSource가 미배선·도달 불가인 구성에서 애플리케이션이 기동해 503을 응답하는
        상태가 존재하지 않는다.** `JdbcClient`는 컨트롤러가 생성 시점에 요구하는 빈이므로
        DataSource가 서지 않으면 **컨텍스트 조립 자체가 취소된다.** 즉 "미배선인데 서비스
        중"이 구조적으로 없다.

        **강제로 띄운 구성에서도 503이 아니다** — Flyway를 환경변수로 끈 채(제품 구성이
        아니다) DB가 죽은 상태로 띄우면 앱은 뜨지만, DB를 만지는 요청이 내는 것은
        **500**이다. 그러므로 **어떤 구성에서도** DB 장애가 503으로 관측되지 않는다.
      measured:
        at: "2026-08-20"
        by: contract-keeper
        method: |
          이미 빌드된 bootJar를 **저장소를 고치지 않고** 다섯 가지 구성으로 띄웠다.
          저장 암호화 키·KCV는 다섯 팔 전부에 같은 값으로 주어 **독립 변수를 하나로**
          유지했다 — 움직인 것은 `SPRING_DATASOURCE_URL`과 `SPRING_FLYWAY_ENABLED`뿐이다.
        arms: |
          A(도달 가능 DB · Flyway 제품 기본)      → 기동 O · `/health` 200
          B(URL 빈 값 · Flyway 제품 기본)         → 기동 실패 (드라이버 결정 불가)
          C(닫힌 포트 · Flyway 제품 기본)         → 기동 실패 (Flyway 초기화에서 접속 시간 초과)
          D(닫힌 포트 · Flyway 꺼짐 — 제품 구성 아님) → 기동 O · DB를 만지는 요청은 **500**
          E(URL 빈 값 · Flyway 꺼짐 — 제품 구성 아님) → 기동 실패
        why_five_arms: |
          **A는 대조군이다** — 같은 하네스·같은 키·같은 jar로 URL만 도달 가능하게 하면
          기동이 성공한다. 실패가 하네스 탓이 아님을 그 팔이 고정한다.
          **E는 "Flyway 때문이 아니다"를 가른다** — Flyway를 끈 채 빈 URL로도 실패하므로
          원인은 DataSource 자신이다. 이 팔이 없으면 "Flyway를 끄면 되는 문제"로 오독된다.
          **D는 제품 구성이 아니다** — `spring.flyway.enabled: true`를 환경변수로 덮은
          것이고 api 프로필에 그것을 끄는 조항은 없다. 그런데도 재둔 이유는 **그 팔에서조차
          503이 나오지 않음**을 보이기 위해서다.
      unmeasured: |
        **복합 실패(DB는 살아 있고 작업 테이블만 없는 구성)는 재지 않았다.** Flyway가
        같은 기동에서 스키마를 맞추므로 그 상태를 만들려면 마이그레이션을 우회해야 하고,
        그것은 제품 구성이 아니다. **"충족"으로도 "위반"으로도 적지 않는다.**
      if_it_should_return: |
        **기동 정책이 바뀌면 다시 봐야 한다.** "DB 없이도 뜨게" 만들면 그때는 "DB 미배선인데
        서비스 중"이 실재하게 된다 — 다만 위 D 팔이 보인 대로 그 상태의 응답은 500이었으므로,
        되살리려면 503을 내는 코드를 함께 세워야 한다. 그 변경은 배포 동작을 바꾸므로
        `x-change-policy.escalate_to_leader` 4번이다.
      x-collateral: |
        **이 측정이 계약 밖의 문면 하나를 거짓으로 만들었다.** `application.yml`의 Hikari
        `initialization-fail-timeout: -1` 주석이 *"DB가 떠 있지 않아도 앱은 뜨고 `/health`로
        진단할 수 있어야 한다"*고 적는데 **위 C 팔이 그 반대를 보였다** — 같은 기동의 Flyway가
        접속하기 때문이다. Hikari 설정 자체는 유효하고 **주석의 전칭이 거짓**이다.
        이 사실은 `/health`의 `checks.database` 도달 범위와 직결된다(`paths./health.get`).

# -----------------------------------------------------------------------------
# 415(미지원 Content-Type) — **엔드포인트별 조항이 아니라 종류다**
# (2026-08-20 신설. 근거 **G2**. **이 절이 정본이다**)
#
# 왜 종류로 적는가: 게이트 28 리더 판정이 지목한 자리는 **셋**이었고
# (`POST /documents` · `POST`·`PATCH /workspaces`) **실측은 다섯을 냈다** —
# `POST /auth/signup`·`POST /auth/login`도 같은 응답을 낸다. 열거했으면 두 자리가 빠졌다.
# 그래서 규칙을 집합으로 적고, 그 집합을 **계약에서 계산하는** 검증을 함께 건다.
# -----------------------------------------------------------------------------
x-unsupported-media-type:
  ground: G2
  decided_at: "2026-08-20"
  component: UnsupportedMediaType
  requirement: |
    클라이언트가 **"본문이 틀렸다"(422)와 "본문의 형식을 아예 받지 않는다"(415)**를
    구분할 수 있어야 한다. 둘을 한 코드로 뭉개면 재시도 판단이 무너진다 —
    422는 값을 고쳐 다시 보내는 것이고 415는 **다른 형식으로 보내야 하는 것**이다.
  rule: |
    **요청 본문을 받는 모든 오퍼레이션은 415를 선언한다.** 대상 집합은 열거가 아니라
    `paths` 아래 `requestBody`를 가진 오퍼레이션 전부이고, 계약 테스트가 그 집합을
    **계약에서 계산해** 선언 유무를 대조한다(그러므로 본문을 받는 오퍼레이션이 새로 생기면
    415 선언 누락이 그 커밋에서 드러난다).

    **본문을 받지 않는 오퍼레이션은 선언하지 않는다** — 그쪽은 `Content-Type`을 보지 않는다.
  detail_shape: string
  detail_source: |
    **상태 코드의 표준 사유 문구**다. 도메인 예외의 한국어 문구와 **다른 규칙**이며
    그것이 의도다.

    구현에서 오류 본문을 만드는 세 경로(전역 예외 advice · `/error` 디스패치 ·
    컨테이너가 직접 만드는 응답)가 **같은 함수 하나**로 이 문구를 만든다. 경로마다 문구
    규칙이 갈리면 같은 상태 코드에 다른 본문이 나가고, **그 차이가 어느 경로를 탔는지를
    밖에 알려주는 신호**가 된다. 415는 프레임워크가 만드는 응답이므로 이 규칙에 속한다.

    **한국어로 바꾸지 마라.** 그것은 미번역 자리를 고치는 것이 아니라 위 균일성을 깨는
    것이다. 사유를 여기 적는 이유가 그것이다 — 적지 않으면 다음 사람이 "빠뜨린 번역"으로
    보고 고친다(`x-title-policy.rationale`이 밟은 순서와 같다).
  response_header_accept: |
    이 응답에는 **그 오퍼레이션이 받는 미디어 타입 집합**이 `Accept` 응답 헤더로 실린다
    (프레임워크가 `requestBody.content`의 키 집합에서 만든다). 계약 테스트는 그 값을
    **오퍼레이션의 `requestBody.content` 키 집합에서 읽어** 대조한다 — 코드에 적지 않는다.
  x-measured:
    at: "2026-08-20"
    reached: |
      **다섯 오퍼레이션에서 실측했다** — `POST /auth/signup` · `POST /auth/login` ·
      `POST /documents` · `POST /workspaces` · `PATCH /workspaces/{workspace_id}`.
      다섯 전부 415이고 본문 최상위 키는 `detail` 하나였다.
    not_reached: |
      **`PUT /conversions/{conversion_id}`는 재지 못했다 — 구현이 없다.**
      선언은 하되 **"쟀다"로 읽히지 않게 이 자리에 적는다.** 그 오퍼레이션을 구현하는
      단위가 이 팔의 케이스를 함께 닫는다.

      **`PUT /conversions/{conversion_id}/feedback`도 같다** (1.5.0 신설, 구현 전).
      본문을 받으므로 위 `rule`에 따라 415를 선언하지만 그것은 선언이지 측정이 아니다.
  x-auth-order-open:
    status: 판정_대기
    escalated_to: 리더
    escalated_at: "2026-08-20"
    what: |
      **무인증 요청에도 415가 나간다 — 401보다 앞선다.** 실측(2026-08-20):
      `POST /documents`에 두 `consumes` 밖 `Content-Type`을 **토큰 없이** 보내면 415이고,
      **위조 토큰**으로 보내도 415다. 같은 요청을 `application/json`으로 보내면 401이다.
    why_it_matters: |
      `info.description`의 「인증 실패와 입력 검증의 우선순위」는 *"인증이 먼저다 …
      인증되지 않은 호출자에게 **검증 의미론**을 알려 줄 이유가 없다"*고 적는다.
      **415 응답은 그 검증 의미론을 알려 준다** — `Accept` 헤더가 그 오퍼레이션이 받는
      미디어 타입 집합을 무인증 호출자에게 그대로 준다. 조항이 든 근거가 바로 **API 표면
      탐색**이므로 이 자리는 그 근거에 정면으로 걸린다.
    mechanism: |
      미디어 타입 매칭은 핸들러 매핑(`getHandler()`)에서 일어나고 인증은
      `HandlerInterceptor.preHandle`이라 **인터셉터 체인이 시작되기 전에 415가 확정된다.**
      `x-global-response-headers.x-phase3-measurement`의 「필터에 못 닿는 응답」과 같은
      계열의 층 문제이나, 그쪽과 달리 **이 자리는 도달이 실재한다**(위 실측).
    x-not-narrowed: |
      **조항을 좁히지 않았다.** 불변식 축소는 `x-change-policy.escalate_to_leader` 3번이고,
      무엇보다 **좁히는 것이 옳은지 모른다** — 415는 자원의 존재를 누설하지 않지만 API 표면을
      누설한다. **케이스도 쓰지 않는다**: 판정 전에 기대값을 못박으면 틀릴 수 있는 동작을
      계약으로 굳힌다. 유효한 토큰으로 재는 케이스는 판정과 무관하게 성립하므로 그쪽만 쓴다.

# -----------------------------------------------------------------------------
# CORS 정책 — OpenAPI로 표현할 수 없어 확장 필드로 둔다.
# 원본: app/main.py의 CORSMiddleware 설정.
# -----------------------------------------------------------------------------
x-cors:
  allow_origins:
    - http://localhost:5173   # Vite dev 서버 (Playwright E2E 교차 출처)
    - http://localhost:8080   # compose frontend (nginx); fetch POST도 Origin을 보낸다
    - http://127.0.0.1:8080   # 위와 동일, 호스트 표기만 다름
  allow_credentials: false     # 쿠키를 쓰지 않는다 — 켜면 CSRF 노출 면적만 넓어진다
  allow_methods: [GET, POST, PUT, PATCH, DELETE]  # OPTIONS는 미들웨어가 스스로 처리
  allow_headers: [Authorization, Content-Type]
  expose_headers: [Content-Disposition, Location]
  x-note: |
    expose_headers가 빠지면 서버 응답은 완전한데 **브라우저 JS만** 헤더를 못 읽는다.
    다운로드 파일명(Content-Disposition)과 접수 주소(Location)가 그 대상이다.
    서버 테스트로는 잡히지 않으므로 브라우저 컨텍스트에서 확인한다.
  # 미처리 500 응답의 CORS 헤더 — Python과 Kotlin이 의도적으로 다른 지점.
  # 이 절이 그 결정의 정본이다(다른 문서에 옮겨 적지 않는다).
  x-unhandled-500-cors:
    decision_status: "결정됨 (2026-08-12 리더 판정, 사용자 승인) — 개선을 받아들인다"
    x-rebase-note: |
      2026-08-12 계약 성격 개정 이후 이 항목의 지위가 달라졌다. 예전에는 "동결 원칙의
      유일한 예외"였으나, 이제는 `x-change-policy` G2를 적용한 **통상적인 개선**이다.
      아래 rationale은 그대로 유효하고 결론도 바뀌지 않는다 — 바뀐 것은 "왜 예외가
      허용됐는가"를 더는 설명할 필요가 없다는 점뿐이다.
    python_behavior: |
      미처리 500 응답에는 CORS 헤더가 붙지 않는다. `ServerErrorMiddleware`가 CORS
      미들웨어 **바깥**에 있어 구조적으로 붙일 수 없다(app/api/errors.py에 한계로 명시).
      브라우저는 상태 코드조차 읽지 못하고 네트워크 오류로 보며, React
      `frontend/src/api/client.ts`의 fetch catch가
      `ApiError(0, "서버에 연결하지 못했습니다…")`를 만든다.
    kotlin_behavior: |
      **미처리 500에도 CORS 헤더가 붙는다.** `CorsFilter`가 라우팅 밖(서블릿 필터 체인
      앞)에 있기 때문이다 — Starlette 미들웨어와 같은 위치이고, `/nope`(404)와 405에도
      헤더가 붙어야 하므로 이 배치가 옳다. 그 결과 예외가 어디서 나든 헤더가 남는다.
      실측(리더 보고, 일회성 프로브 — 커밋되지 않음):
      `미처리 500 | status=500 | ACAO=http://localhost:5173 | EXPOSE=Content-Disposition, Location`
    rationale: |
      브라우저가 응답을 읽을 수 있게 되어 React가
      `ApiError(500, "서버 오류가 발생했습니다")`를 받는다. 진단이 쉬워지고 사용자에게
      더 정확한 문구가 나간다. 반대로 Python 동작을 재현하려면 `CorsFilter`를 감싸는
      필터를 새로 만들어야 하는데, 그것은 **일부러 나쁜 동작을 만드는 코드**가 저장소에
      영구히 남는다는 뜻이다.
    scope: |
      달라지는 것은 **CORS 응답 헤더의 유무뿐**이다. 상태 코드(500)와 본문
      (`{"detail": "서버 오류가 발생했습니다"}`)은 Python과 같아야 한다 — 그쪽이
      달라지면 의도된 차이가 아니라 계약 위반이다.
      parity 대조가 이 헤더를 불일치로 잡더라도 **의도된 차이**이므로 구현 차단 사유가
      아니다. 그 밖의 500 응답 항목이 어긋나면 종전대로 차단한다.
    x-phase6-check: |
      **Phase 6 확인 항목 — React 오류 분기.**
      실측(2026-08-12, `grep -rn "NETWORK_ERROR_STATUS|status === 0|\.status" frontend/src`):
      **`status = 0` 경로에 의존하는 화면 분기는 없다.** `NETWORK_ERROR_STATUS`는
      `client.ts`(생성 지점)와 `client.test.ts`(단언)에만 등장한다. 화면 컴포넌트는
      UploadPage · HistoryPage · ReviewEditor · WorkspaceMenu · WorkspaceProvider ·
      useConversionPolling · CredentialsForm 전부
      `caught instanceof ApiError ? caught.message : <폴백 문구>` 한 가지 모양이라
      HTTP 상태를 아예 보지 않는다. 상태로 갈리는 자리는 `client.ts`의
      `response.status === 401 && token !== null`(토큰 폐기 + unauthorizedHandler)
      하나뿐이며 500과 무관하다.
      따라서 이 결정이 깨뜨리는 화면 분기는 없고, 사용자에게 보이는 **문구만**
      "서버에 연결하지 못했습니다…" → "서버 오류가 발생했습니다"로 바뀐다.
      `client.test.ts`의 네트워크 오류 테스트는 `fetch`를 직접 reject시키는 방식이라
      이 변경과 무관하게 통과한다(진짜 연결 실패는 계속 status 0이다).
      Phase 6에서 다시 확인할 것 — ① 위 grep을 재실행해 그 사이 `status === 0` 분기가
      새로 생기지 않았는지, ② Kotlin 미처리 500의 `detail` 문구가 위와 같은지
      (계획 §4.1의 오류 문구 어댑터가 이 값을 전제한다).

# -----------------------------------------------------------------------------
# 인증 계약
# 원본: app/services/auth.py, app/api/deps.py
# -----------------------------------------------------------------------------
x-auth:
  scheme: "Authorization: Bearer <token>"
  algorithm: HS256
  claims: [sub, exp, typ]        # 세 개뿐. 이메일 등 개인정보를 넣지 않는다
  claim_sub: "사용자 UUID 문자열"
  claim_typ: "access"            # 값이 다르면 거부
  required_claims: [sub, exp, typ]  # 모두 있어야 유효. exp 없는 토큰은 영구 자격증명이 된다
  min_secret_bytes: 32           # HS256 해시 출력 크기. 미만이면 ConfigurationError → 503
  default_lifetime_seconds: 3600 # Settings.jwt_expire_minutes 기본 60분
  clock_skew_seconds: 0
  x-clock-skew: |
    **만료 검증에 허용 오차를 두지 않는다.** `exp`를 1초라도 지난 토큰은 401이다.
    Nimbus·Spring Security의 기본 허용 오차가 **60초**라 그냥 두면 만료된 토큰이
    **+59초까지 통과한다**(Phase 0 실측 결함 — 필수조치 B). `exp` 없는 토큰을 금지한
    위 `required_claims` 조항과 같은 목적이다 — 만료가 강제되지 않으면 그 클레임을
    요구한 의미가 없다. 서버 시계는 NTP 동기를 전제한다.
  x-rebuild-note: |
    **2026-08-12 2차 개정 — "Python 발급 토큰과 Kotlin 발급 토큰의 양방향 상호 수용"
    요구는 폐기됐다.** 그 요구는 롤백 창에서만 나왔고, Python 폐기·재개발과 롤백 포기로
    근거가 사라졌다. 없어진 것은 **상호 수용**이지 이 절의 발급·검증 정확성이 아니다 —
    `claims`·`algorithm`·`required_claims`·`clock_skew_seconds`는 그대로 계약이며,
    검증 방법은 `.claude/skills/api-contract-freeze` §2.4·§5로 옮겨 갔다.
  password_hash: "argon2id (time_cost=3, memory_cost=65536, parallelism=4)"
  rehash_policy: |
    로그인 **성공 시에만** 재해시한다. 재해시 실패는 로그인을 막지 않는다(best-effort).

    **재해시 판정은 저장된 PHC의 파라미터가 현재 설정과 전부 같은지로 한다** —
    변형(`argon2id`)·`time_cost`·`memory_cost`·`parallelism` 중 **하나라도 다르면**
    재해시 대상이다. Spring `Argon2PasswordEncoder.upgradeEncoding()`은 `memory`와
    `iterations`의 **"미만"만** 보므로, 파라미터를 **낮춘** 경우와 `parallelism`만 바뀐
    경우를 놓친다(Phase 0 실측 결함 — 필수조치 A). 그대로 쓰면 계약 위반이다.

    **2026-08-12 2차 개정**: 종전 문구는 "기존 PHC 문자열은 그대로 검증 가능해야 한다"는
    **호환 요구**였다. 그 요구는 롤백 창(Python이 Kotlin이 쓴 데이터를 읽어야 한다)에서만
    나왔는데 Python 폐기·재개발과 롤백 포기로 근거가 사라졌다. 남은 것은 호환이 아니라
    **기능 요구**다 — 저장된 해시로 로그인이 되어야 하고, 파라미터가 낡았으면 올려야 한다.
  failure_uniformity: |
    이메일 부재·비밀번호 불일치·토큰 만료·위조(서명 불일치·필수 클레임 누락·`typ`
    용도 불일치를 포함한다)·계정 삭제를 **모두 같은 401과 같은 메시지**로 처리한다.
    구분하면 계정 열거 공격의 단서가 된다. 사용자가 없을 때도 더미 해시로 같은 검증
    비용을 치러 응답 시간으로도 새지 않게 한다.

    **이 조항이 균일성 요구의 정본이다.** 다른 절은 사유 목록을 옮겨 적지 않고 여기를
    가리킨다 — `components/responses/Unauthorized`가 한때 목록을 복사해 두었다가
    갈렸다(게이트 24 R-1, 2026-08-19 정합).

    **범위 — `Authorization` 헤더가 아예 없는 갈래는 여기 들어가지 않는다.**
    위 열거는 전부 **자격증명이 제시된 뒤** 서버만 아는 사실(계정의 존재·삭제 여부,
    토큰의 만료·진위)로 갈리는 자리다. 무헤더는 요청자가 스스로 만든 상태이고 자기가
    붙이지 않았음을 이미 알므로 응답에서 얻는 **정보 이득이 0**이다. 그래서 무헤더는
    균일화 대상이 아니라 `components/responses/Unauthorized`가 적는 **두 문구 구조**의
    첫째 갈래로 남는다.

    따라서 **균일성 판정의 대상은 토큰·자격증명이 제시된 갈래들**이다 — 무헤더를
    함께 넣은 비교(예: 4갈래 응답 시간 비)는 이 조항이 요구하는 균일성의 측정이
    아니다. 무헤더 갈래의 처리 비용이 다른 것은 이 조항 위반이 아니며, 자원 소모
    관점의 논의는 별건이다.
    (범위·근거는 게이트 24 3관점 수렴 + 리더 지시, 2026-08-19.)

# -----------------------------------------------------------------------------
# 입력 상한 — 전부 계약이다.
# -----------------------------------------------------------------------------
x-input-limits:
  max_convertible_chars: 20000       # core/document/DocumentLimits.kt MAX_CONVERTIBLE_CHARS → 초과 시 422
  max_review_chars: 20000            # 검수 수정본도 같은 상한 → 초과 시 422
  max_upload_bytes: 10485760         # app/ingest/extractors.py MAX_UPLOAD_BYTES (10 * 1024 * 1024) → 초과 시 413
  max_extracted_chars: 500000        # 추출 결과 상한 → 초과 시 422
  zip_uncompressed_budget_bytes: 52428800  # 업로드 상한의 5배. 초과 시 422 (압축 폭탄 방어)
  supported_upload_formats: [docx, pdf, hwpx, txt]  # 확장자 대소문자 무시. 그 밖은 422
  legacy_doc_policy: |
    구버전 `.doc`(OLE2)은 전용 안내 문구와 함께 422다 —
    "구버전 doc 형식은 지원하지 않습니다 (docx로 다시 저장해 올려주세요)".
  legacy_hwp_policy: |
    구버전 `.hwp`(5.x, OLE2)는 **지원 형식으로 추가되지 않았다** — 여전히 422다.
    다만 전용 안내 문구와 함께 거절한다 —
    "구버전 hwp 형식은 지원하지 않습니다 (hwpx로 다시 저장해 올려주세요)".
    확장자가 `.hwp`인 업로드(내용을 열어 보지 않아도 안다)와, `.hwpx`(zip)로 이름만
    바꿔 올렸지만 내용이 실은 HWP 5.x OLE2 복합 문서인 업로드 둘 다 이 문구로 거절한다.
  txt_encoding_policy: |
    `.txt` 업로드 디코딩 — **한글 신호 우선**(사용자 결정, 2026-09-02 「한글 신호 우선」,
    2.5.1). "유효한 UTF-8 이 아니면 CP949" 는 결정적 규칙이 아니다 — 두 인코딩은 서로
    배타적이지 않다. 반례: 바이트 `C2 A1 C2 A1` 은 유효한 UTF-8("¡¡", 한글 없음)이면서
    동시에 유효한 CP949(EUC-KR 상위 집합, "징징", 한글)다. `.txt` 원본 바이트는
    `document_originals`에 저장하지 않으므로(`SourceFormat` 설명 참고) 여기서 잘못
    판정하면 되돌릴 수 없다.

    판정 순서:
    ⑴ 원시 바이트 선두가 UTF-8 BOM(`EF BB BF`)이면 디코딩을 시도하기 전에 UTF-8 로 확정한다 —
    한글 유무와 무관하고, BOM 뒤가 유효한 UTF-8 이 아니면 CP949 로 넘기지 않고 ⑸처럼 거절한다.
    ⑵ 그 외 UTF-8 엄격 디코딩이 성공하고 결과에 한글이 있으면 UTF-8.
    ⑶ 그 외 CP949 엄격 디코딩이 성공하고 결과에 한글이 있으면 CP949.
    ⑷ 그 외 UTF-8 엄격 디코딩이 성공했으면(순수 ASCII·비한국어 텍스트) UTF-8.
    ⑸ 그 외(둘 다 실패, 또는 둘 다 성공했지만 어느 쪽도 한글이 없는 경우는 ⑵·⑶이 이미
    처리해 여기 남지 않는다) 손상 파일과 같은 방식으로 422 거절한다 — 새 오류 문구를
    추가하지 않았다.

    "한글 포함"은 한글 음절(Hangul Syllables, U+AC00–U+D7A3) · 한글 자모(Hangul Jamo,
    U+1100–U+11FF) · 한글 호환 자모(Hangul Compatibility Jamo, U+3130–U+318F) 중 하나라도
    있으면 참이다(Unicode 표준 `Blocks.txt` 기준). 이 판정은 **한국 공공기관 문서만
    다루는 이 제품의 전제 위에서만 성립한다** — 그 전제가 없는 일반 텍스트 서비스라면
    한글 유무로 인코딩을 정할 근거가 없다. UTF-8 로도 CP949 로도 유효한데 그 어느 쪽도
    한글이 아닌 텍스트(비한국어 라틴 문서가 우연히 CP949 로도 읽히는 경우)는 이 제품
    범위 밖이며, 그런 경우도 ⑷에 의해 UTF-8 로 처리된다.

    UTF-8 BOM(`U+FEFF`)은 본문 첫 글자로 새지 않게 걷어낸다. 구현 세부는
    `infrastructure/ingest/TxtExtractor.kt` 이고, 이 값이 정책의 정본이다.
  rejected_pdf: "텍스트 레이어 없는 스캔 PDF·암호화 PDF는 422"
  list_limit: { min: 1, max: 100, default: 20 }   # 범위 밖은 422 — **스키마 층**이라 배열 detail
  list_offset: { min: 0, default: 0 }             # 범위 밖은 422 — **스키마 층**이라 배열 detail
  max_workspace_name_length: 50      # 초과 시 422 (자르지 않고 거절) — 서비스 층, 문자열 detail
  max_email_length: 255              # 초과 시 422 — 서비스 층, 문자열 detail
  min_password_length: 8             # 미만 시 422 — 서비스 층, 문자열 detail
  max_title_length: 255              # **사용자가 준 제목에만** 걸린다 — 자른다(거절하지 않는다).
                                     # 생략 시의 고정 문구 `제목 없음`은 이 상한과 무관하다 (`x-title-policy`)
  max_feedback_comment_length: 500   # 피드백 자유 의견. 초과 시 422 — 서비스 층, 문자열 detail (정규화 **후** 길이)
  retention_days: 30

# -----------------------------------------------------------------------------
# 내보내기 형식 유도 — **들어온 형식 그대로 나간다** (`DESIGN.md` §6.5, 2026-08-26)
#
# 이 표가 `ConversionResponse.export_format` 값의 정본이다. 그 필드의 산문은 규칙을
# 설명하고, 대조는 이 표를 읽는다 — 산문에서 값을 뽑는 규칙은 문장이 바뀌면 조용히
# 어긋난다. **2026-08-26(2.0.0)부터 이 표는 `GET /conversions/{conversion_id}/export`가
# 받아들이는 값도 정한다** — 아래 `enforcement`. 두 자리가 같은 규칙을 각자 적지 않게
# 그 오퍼레이션은 이 절을 가리키기만 한다.
# -----------------------------------------------------------------------------
x-export-format-derivation:
  ground: G2
  decided_at: "2026-08-26"
  basis: "DESIGN.md §6.5 — 파일 형식 선택은 사용자가 검수 과정에서 해결해야 할 문제가 아니다"
  # 키는 `SourceFormat` 값, 값은 `ExportFormat` 값 또는 `null`.
  # **정의역이 `SourceFormat` 전부여야 한다** — 빠진 형식은 「모른다」가 아니라 누락이다.
  mapping:
    text: txt      # 붙여넣기는 파일이 아니었다. UTF-8 텍스트로 내려받는다
    docx: docx
    hwpx: hwpx
    pdf: null      # 서버가 정하지 않는다 — 사용자가 고른다. 아래 `choices`·`x-null-is-not-unknown`
    txt: txt       # 2.4.0. 업로드된 평문도 같은 렌더러로 나간다 — 반영할 원본 구조가 없다는
                   # 점만 `text`와 다르고(아래 `x-not-a-rename`), 나가는 형식은 같다
  # ---------------------------------------------------------------------------
  # 선택지 (2.6.0, 2026-09-02 사용자 결정) — `mapping`이 `null`인 원본에서 사용자가
  # 고를 수 있는 형식. **정의역 불변식**: `mapping`이 `null`인 키는 여기 반드시 나타나야
  # 하고(값은 `[]`여도 된다 — 「선택지도 없다」는 사실을 명시적으로 적는다), `mapping`이
  # 값을 낸 키는 여기 나타나면 안 된다(선택의 여지가 없다). `DocumentContractNodeTest`가
  # 이 정의역 대조를 잰다.
  # ---------------------------------------------------------------------------
  choices:
    pdf: [docx, hwpx]
  x-null-is-not-unknown: |
    `null`은 「모른다」가 아니라 **「서버가 정하지 않는다」**다. 그 뜻은 두 갈래로 갈린다:

    ⑴ **`choices`에 값이 있는 원본(오늘은 `pdf`뿐)** — 서버가 못 정하는 것이 아니라
       **사용자가 고른다** (2.6.0 재결정, `DESIGN.md` §6.5). PDF는 편집 가능한 문서
       구조가 아니라 「들어온 형식 그대로」가 성립하지 않고, PDF 렌더러도 없다 — 그래서
       사용자가 `docx`·`hwpx` 중 하나를 골라 **신문서 조립**으로 받는다. 이것은
       §6.5가 금지한 *조용한* 대체가 아니다 — 사용자가 명시적으로 고른 두 구조화
       형식 사이의 선택이고, 아무 것도 고르지 않으면 내보내지 않는다(아래 `enforcement`).
    ⑵ **`choices`에도 없는 원본(오늘은 없다)** — 이때만 원래 뜻 그대로
       「같은 형식으로 내보낼 수단이 없다」이고 대체 형식으로 접지 않는다. §6.5가
       "PDF 다운로드 기능이 준비되기 전까지 다른 형식으로의 우회 다운로드를 기본
       행동으로 제공하지 않는다"고 정한 자리는 이제 이 갈래(⑵)에 적용된다 — PDF는
       ⑴로 옮겨졌다. 화면은 이 `null`을 보고 내려받기 행동을 제시하지 않는다.
  x-not-a-rename: |
    `text → txt`는 유도이지 이름 변환이 아니다. 두 값 집합은 서로 다른 축이고
    (`SourceFormat`은 「어디서 왔는가」, `ExportFormat`은 「무엇으로 나가는가」),
    붙여넣기에는 애초에 확장자가 없다. 이름이 같은 셋(`docx`·`hwpx`·`txt`)은 우연이 아니라
    「그대로 나간다」의 결과이며, 그 우연을 유도 **규칙**으로 삼으면 이 한 갈래가 어긋난다.

  # ---------------------------------------------------------------------------
  # 강제 (2.0.0, 2026-08-26) — **서버가 원본에서 정한다.**
  # 이 블록이 `GET /conversions/{conversion_id}/export`의 처분 정본이다.
  # 그 오퍼레이션의 산문은 이 키들을 설명하고, 대조는 이 키들을 읽는다.
  # ---------------------------------------------------------------------------
  enforcement:
    since: "2.0.0"
    operation: exportConversion
    parameter: format
    required: false            # 생략이 기본 경로다 — 서버가 `mapping`으로 정한다
    on_absent: derive          # `mapping[source_format]`이 나간다
    on_match: export           # 준 값이 `mapping[source_format]`과 같으면 그대로 나간다
    on_mismatch: 409           # `ExportFormat` 안의 값이지만 이 변환의 원본과 다르다
    on_null_mapping: 409       # `mapping[source_format]`이 `null` 이고 `choices`도 없다 — 내보낼 수단이 없다(오늘은 없는 갈래)
    on_unknown_value: 422      # `ExportFormat` 밖의 값 — 변환을 읽기 전에 갈린다
    # -------------------------------------------------------------------------
    # 선택지 처분 (2.6.0) — `mapping[source_format]`이 `null`이고 `choices[source_format]`이
    # 비어 있지 않을 때만 적용된다. `on_null_mapping`보다 **먼저** 검사한다 — 그 갈래는
    # 「선택지도 없다」는 사실을 재는 것이라, 선택지가 있는 원본에는 애초에 해당하지 않는다.
    # -------------------------------------------------------------------------
    on_absent_with_choices: 409   # `format`을 생략했다 — 서버가 대신 고르지 않는다
    on_choice: export             # 준 값이 `choices[source_format]` 안이다 — 신문서 조립
    on_choice_mismatch: 409       # 준 값이 `ExportFormat` 안이지만 `choices[source_format]` 밖이다
  x-why-409-and-not-422: |
    **판정이 이 변환의 상태에 달렸기 때문이다.** 같은 쿼리 문자열이 `conversion_id`에 따라
    통과하기도 하고 거절되기도 한다 — `format=txt`는 붙여넣기 변환에서 옳고 DOCX 변환에서
    그르다. 422가 재는 것은 **값 자체**(`ExportFormat` 밖인가)이고 그 판정에는 DB가 필요
    없다. 원본과의 불일치는 행을 읽어야만 알 수 있으므로 422의 성질이 아니다.

    **두 번째 이유가 결정적이다: 소유 은닉과 순서가 맞아야 한다.** 불일치를 검증 층(422)에
    두면 그 응답이 **소유 확인보다 먼저** 나가고, 남의 변환에 `format=docx`를 던진 호출자가
    「이 문서는 DOCX가 아니다」를 알게 된다 — 404로 가려 둔 사실이 형식 축으로 샌다
    (`x-change-policy.invariants` 「소유권 은닉 404」). 409는 행을 읽은 **뒤**의 판정이라
    남의 자원에서는 404가 먼저 나가고 이 갈래에 닿지 않는다.

    이 오퍼레이션의 기존 409 둘(완료 전·자리표시자 유실)도 같은 성질이다: 요청은
    온전한데 **이 변환의 상태**가 내보내기를 허락하지 않는다. 새 갈래 둘을 그 옆에 두면
    같은 종류의 판정이 한 상태 코드 아래 모이고, 오퍼레이션의 상태 집합은 그대로다.

    **새 상태 코드를 만들지 않았다.** 406은 `Accept` 협상의 코드이고(여기는 쿼리
    파라미터다), 415는 요청 본문의 미디어 타입이며(GET에 본문이 없다), 501은 **메서드**가
    구현되지 않았다는 뜻이라 셋 다 이 상황을 가리키지 않는다.
  x-superseded: |
    **폐기된 조항: 클라이언트가 형식을 임의로 고른다.**

    2.0.0 이전의 `GET /conversions/{conversion_id}/export`는 `format`을 **필수**로 받고
    `ExportFormat` 안의 값이면 원본과 무관하게 그대로 내보냈다 — DOCX로 올린 문서를
    `format=txt`로 받을 수 있었고, 그 교차 형식 내보내기가 **기본 동작**이었다.
    그 조항은 폐기됐다. 되살리지 마라.

    되살리면 무엇이 깨지는가: `DESIGN.md` §6.5의 첫 문장(「들어온 형식 그대로 나간다」)과
    §14 완료 기준(「입력 형식과 다른 교차 형식 내보내기가 라이브 기능처럼 보이지 않는다」)이
    동시에 깨진다. 화면 쪽 대가는 더 크다 — 형식 선택이 화면으로 돌아오고, 그것이 §6.5가
    "사용자가 검수 과정에서 해결해야 할 문제가 아니다"라고 말한 바로 그 선택이다.

    **`format` 누락이 422였던 갈래도 함께 폐기됐다.** 이제 누락은 오류가 아니라 기본
    경로다(`enforcement.on_absent`). 422는 **값 집합 밖**에서만 남는다.

    **2.6.0의 `choices` 갈래는 이 폐기를 되살리는 것이 아니다.** 옛 조항은 「원본과
    무관하게 아무 값이나 통과한다」였고, `choices`는 그 반대다 — 값 집합이 **원본별로
    좁혀진 목록**(오늘은 PDF의 `[docx, hwpx]`뿐)이고, 목록 밖 값은 여전히 409로 거절되며
    (`on_choice_mismatch`), 생략도 통과하지 않는다(`on_absent_with_choices`). 서버가
    「하나로 정하지 않는다」일 뿐 「아무거나 받는다」가 아니다.

# -----------------------------------------------------------------------------
# 문서 제목 — **제목은 문서 내용에서 만들지 않는다**
# (2026-08-20 사용자 결정 · 게이트 27 codex Critical ① 의 처방. 근거 G3)
#
# 이 절이 정본이다. 두 요청 스키마의 `title` 과 응답 `DocumentListItem.title` 은
# 여기를 가리킨다 — 규칙을 옮겨 적으면 두 벌이 갈린다.
# -----------------------------------------------------------------------------
x-title-policy:
  ground: G3
  decided_at: "2026-08-20"
  decided_by: "사용자 결정 (게이트 27 codex Critical ① 의 처방)"
  sources: [given_title]                 # 제목의 바탕이 될 수 있는 입력은 이것뿐이다
  forbidden_sources: [body_text, upload_filename]
  fallback_title: "제목 없음"             # 고정 문구. 계약 테스트는 이 값을 코드에 복제하지 말고 여기서 읽는다
  rule: |
    `title`을 주면 그것이 제목이다 — 제어문자와 **짝을 이루지 않은 UTF-16 서로게이트**를
    걷어내고 `x-input-limits.max_title_length`에서 **자른다**(거절하지 않는다).
    주지 않았거나 정제 후 남는 것이 없으면 제목은 **고정 문구 `fallback_title`**이다.
    **본문에서도 업로드 파일 이름에서도 유도하지 않는다.**
  x-surrogate-note: |
    **서로게이트를 걷어내는 조항은 2026-08-20에 더했다**(근거 **G2**).
    제목은 평문 열에 그대로 저장되므로, 짝 없는 서로게이트가 남으면 드라이버가 UTF-8로
    쓰는 시점에 갈린다 — 치환(`?`)이면 **조용한 손상**, 오류면 **원인을 알 수 없는 500**이다.
    둘 다 요구를 어긴다.

    **거절이 아니라 정제인 이유**: 이 절의 처분은 이미 정제다(제어문자를 걷어내고
    상한에서 자른다). 같은 필드에서 「길이는 자르고 문자는 거절한다」로 갈리면 사용자가
    **라벨 하나 때문에 문서 접수를 거절당한다.** 저장되는 **본문**은 반대다 —
    거기서는 잃는 것이 라벨이 아니라 문서이므로 정제가 아니라 거절이며,
    그 조항이 `x-stored-text-domain`이다. **두 처분이 다른 것은 실수가 아니다.**
  x-superseded: |
    이 절 이전의 계약은 *"생략하면 본문 첫 줄에서 유도한다(30자 목표, 어절 경계에서
    자르고 `…` 부착)"*였다(`DocumentTextRequest.title` · `DocumentFileRequest.title`).
    **그 조항은 폐기됐다.** 30자 목표·어절 경계·`…` 부착을 규정하는 조항은 계약 어디에도
    남지 않는다 — 한 곳이라도 남으면 그것이 이 절과 다투는 정본을 주장한다.
  rationale: |
    **유도된 제목은 방어 둘을 동시에 우회하고, 얻는 것은 목록 화면의 편의뿐이다.**

    1. **암호화 우회** — 문서 원문은 AEAD로 봉인해 저장하는데, 그 첫 줄 조각이
       **평문 열** `documents.title`에 복제된다. 봉인의 보호 범위가 그 조각만큼 줄고
       DB·백업·덤프·향후 검색 표면에 전부 걸린다.
    2. **마스킹 우회** — 마스킹은 LLM 전송 직전(워커)의 일이라 **업로드 시점에는 돌지
       않는다.** 붙여넣기 본문 첫 줄에 주민등록번호가 있으면 그대로 평문으로 저장된다.

    **파일 이름도 같은 이유로 쓰지 않는다.** `홍길동_주민등록등본.docx` 같은 이름은 그
    자체가 개인정보이며, 이름 안의 개인정보를 걸러낼 수단이 업로드 시점에는 없다.
    이 결정은 `migration-safety-gate` **I-4**(차단 등급)의 보장
    *"파일명은 아예 저장하지 않는다"*와 **같은 계열이고 그 조항을 강화한다** —
    이제 파일 이름도 본문도 제목이 되지 않는다.

    **왜 사유를 계약에 적는가**: 이 계약은 「현재 동작의 스냅샷」이 아니라 요구사항이
    요구하는 인터페이스다(`x-change-policy`). 유도를 버린 사유가 여기 없으면 다음 사람이
    **목록 편의**를 이유로 되살리고, 그때 되살아나는 것은 편의가 아니라 위 두 우회다.
  x-what-this-does-not-change: |
    **사용자가 준 제목의 처분은 그대로다.** 255자까지 자르기만 하고 거절하지 않는다
    (`x-input-limits.max_title_length`). `fallback_title`은 고정 문구라 그 상한에 닿을 일이
    없다 — 상한은 **사용자 입력에만** 걸린다.

    **계약이 정하는 것은 응답에 실리는 `title` 값과 그 값의 출처다.** 어느 층에서
    `fallback_title`을 채우는지(요청 파싱·서비스·저장)는 구현 판단이다.

# -----------------------------------------------------------------------------
# 저장되는 본문의 정의역 — **텍스트로 왕복하지 않는 값은 받지 않는다**
# (2026-08-20 신설. 근거 G2 — `migration-safety-gate` I-7의 round-trip 요구)
#
# 이 절이 정본이다. 길이는 `x-request-field-constraints`가, **정의역**은 여기가 정한다.
# 둘은 다른 축이다 — 길이는 "얼마나"이고 정의역은 "그 값이 텍스트로 성립하는가"다.
# -----------------------------------------------------------------------------
x-stored-text-domain:
  ground: G2
  decided_at: "2026-08-20"
  requirement: |
    `migration-safety-gate` **I-7** — 저장 암호화의 round-trip 불변식
    ("봉인한 것을 열면 같은 값이 나온다")이 **저장 가능한 모든 값에 대해** 참이어야 한다.
  layer: service            # 위반 시 422 **문자열** detail — `x-request-field-constraints`의 다섯 필드와 같은 모양
  status: 422
  detail_shape: string
  detail: "문서 본문에 텍스트로 저장할 수 없는 문자가 있습니다"   # 고정 문구. 입력값을 담지 않는다. 계약 테스트는 이 값을 여기서 읽는다
  rule: |
    저장되는 본문은 **UTF-8로 왕복해야 한다.** 짝을 이루지 않은 UTF-16 서로게이트는
    UTF-8로 인코딩되지 않고 `?`(U+003F)로 **비가역 치환**된다. 그런 값을 받으면
    복호화는 성공하는데 사용자 문서만 조용히 영구 손상된다 — 암호가 깨지는 것이 아니라
    암호화 **이전**, 문자열을 바이트로 바꾸는 자리에서 잃는다.

    그래서 **받지 않고 거절한다.** 치환을 수용하는 대안을 고르지 않은 이유는 치환이
    비가역이라 나중에 되돌릴 수 없고, 그사이 저장된 행은 원문을 잃은 채 남기 때문이다.
  x-status-vocabulary:
    note: |
      **`applies_to[].status`의 값은 아래 셋뿐이다.** 2026-08-20에 `unreachable`을 더했다 —
      종전 두 값(`measured`/`pending`)으로는 **"재봤더니 그 팔로 값이 들어오지 않는다"를
      적을 자리가 없었다.** 그래서 실측으로 도달하지 않음이 확인된 팔이 `measured`로 남아
      **거짓 선언**이 됐다(게이트 28 L-⑧ 판정 1).
    values:
      measured: "쟀고, 그 팔로 값이 실제로 들어온다"
      pending: "아직 재지 않았다. 이것이 남아 있다는 것 자체가 마감 목록이다"
      unreachable: |
        **재봤더니 그 팔로는 값이 들어오지 않는다.** `pending`과 다르다 — 저쪽은 모르는
        것이고 이쪽은 **아는 것**이다. 이 값을 쓰는 팔은 `measured_absent` 아래에
        ⑴ 무엇을 어떻게 쟀는지 ⑵ **무엇이 바뀌면 다시 도달하는지**를 적어야 한다.
        선언을 지우지 않는 이유는 정의역 자체가 그 필드에 걸려 있고, 도달 경로가
        **라이브러리 동작에 좌우되기 때문**이다.
    x-closed-enum: |
      **닫힌 집합이다. 계약 테스트는 이 세 값 밖의 문자열을 발견하면 실패해야 한다.**
      종전에는 파서가 `measured`인지만 보고 나머지를 전부 `pending`으로 취급했다 —
      그러면 **`measured`의 오타 하나가 팔을 조용히 강등**시키고, 다른 팔이 남아 있는 한
      전체는 초록이다(게이트 28 P-12, codex 서술 채택). 검증은 두 갈래를 **함께** 걸어야
      한다: ⑴ 값이 이 집합 안인가 ⑵ `measured`인 팔마다 케이스가 실재하는가.
  applies_to:
    - field: "DocumentTextRequest.text"
      reached_from: "POST /documents (붙여넣기 모드)"
      status: measured           # 이 조항이 실물로 서는 첫 자리 — 오늘 유일한 도달 경로다
    - field: "DocumentFileRequest.file에서 추출한 본문"
      reached_from: "POST /documents (파일 모드)"
      status: unreachable
      measured_absent:
        at: "2026-08-20"
        by: kotlin-implementer
        how: |
          **깨진 `ToUnicode` CMap을 담은 fixture로 추출을 실제로 돌렸다.** PDF 파서가
          짝 없는 상위 서로게이트를 그대로 내놓지 않고 **대체 문자(U+FFFD)로 치환**한다 —
          추출 결과의 코드 포인트가 그 한 자다. 즉 이 정의역을 벗어난 값이 **추출 단계를
          통과하지 못한다.**
        why_other_formats_cannot: |
          워드·한글 컨테이너는 well-formed UTF-8 XML을 거치므로 **인코딩 자체로 불가능**하다
          (짝 없는 서로게이트는 UTF-8로 표현되지 않는다). 그러므로 파일 모드 전체에서
          도달 경로가 없고, **오늘 이 조항의 유일한 도달 경로는 붙여넣기 팔 하나다.**
        reachable_again_if: |
          **파서 판올림이 그 치환을 그만두면 도달한다.** 그 변화를 사람이 알아채는 것에
          기대지 않는다 — 구현 레인이 회귀를 「라이브러리가 치환한다」를 붙드는 쪽으로
          돌려 두었으므로, 치환이 사라지면 **그 커밋에서 빨개진다.** 도달 자체를
          탐지형으로 고정한 형태다.
      x-why-not-removed: |
        **선언을 지우지 않는다.** 정의역은 이 필드에도 걸려 있고(같은 저장 경로를 지난다),
        도달 여부만 라이브러리 동작에 달렸다. 지우면 위 `reachable_again_if`가 실현될 때
        **조항 없이 값이 들어온다.**
    - field: "ConversionReviewRequest.edited_text"
      reached_from: "PUT /conversions/{conversion_id}"
      status: pending            # 같은 저장 경로를 지난다. 마감은 #8을 구현하는 단위다
      note: |
        검수본도 봉인해 저장하므로 같은 정의역이 걸린다. **오늘 이 팔은 측정되지 않았다** —
        `status`가 그 사실을 담는다. 빈 선언으로 통과하지 않게 하려면 계약 테스트가
        `measured`인 팔에 대해서만 케이스를 요구하고, `pending`이 남아 있다는 것 자체를
        마감 목록으로 읽어야 한다.
    - field: "ConversionFeedbackRequest.comment"
      reached_from: "PUT /conversions/{conversion_id}/feedback"
      status: pending            # 같은 저장 경로를 지난다. 마감은 #15를 구현하는 단위다
      note: |
        피드백 자유 의견도 봉인해 저장하므로 같은 정의역이 걸린다.
        **오늘 이 팔은 측정되지 않았다** — `status`가 그 사실을 담는다.
        길이(`x-input-limits.max_feedback_comment_length`)와는 다른 축이다.
        위 `detail` 문구가 「문서 본문」을 말하지만 **팔마다 문구를 바꾸지 않는다** —
        고정 문구 하나가 이 절의 조항이고, 자리마다 다듬으면 두 벌이 되어 갈린다.
  x-not-the-title: |
    **제목은 이 절의 대상이 아니다.** 제목은 봉인되지 않는 평문 열이고, `x-title-policy`가
    **정제** 처분을 정했다(제어문자·짝 없는 서로게이트를 걷어내고 상한에서 자른다).
    같은 문자 때문에 본문은 거절하고 제목은 정제하는 것이 이 계약의 판정이다 —
    사유는 `x-title-policy.x-surrogate-note`에 있다.
  x-why-not-schema: |
    OpenAPI `pattern`으로 표현되지 않는다. JSON Schema의 정규식은 **코드포인트 시퀀스**를
    전제하는데 짝 없는 서로게이트는 그 전제를 벗어난 UTF-16 코드유닛이고, 애초에 유효한
    JSON 문서라도 `\uD800` 이스케이프로 실려 올 수 있다. `maxLength`가 "정규화 후 길이"를
    말하지 못한 것과 같은 종류의 한계이므로 같은 처방을 쓴다 —
    `x-request-field-constraints.x-openapi-expressibility` 참조.
  x-what-this-does-not-say: |
    **어느 층에서 거르는지는 구현 판단이다.** 계약이 정하는 것은 나간 바이트뿐이다 —
    이 정의역을 벗어난 본문에 422와 `detail` 문자열이 나가고, **그 문서가 저장되지
    않는다**는 것. 요청 파싱에서 막든 저장 직전 타입에서 막든 계약은 가리지 않는다.

# -----------------------------------------------------------------------------
# 요청 본문 필드의 길이·형식 제약 — **어느 층이 재는가 · 무엇을 재는가**
#
# 이 절이 F3(교차 리뷰 C-5)의 판정 결과이자 요구의 정본이다.
# 상한 값 자체는 위 `x-input-limits`에, 그 값을 **어떻게 적용하는가**는 여기에 있다.
# -----------------------------------------------------------------------------
x-request-field-constraints:
  x-why-this-section-exists: |
    초판은 다섯 요청 필드에 OpenAPI `maxLength`/`minLength`를 달았다. 그것은 **스키마 층
    제약을 선언한 것**이고, 이 계약 자신의 오류 본문 규칙에 따르면 스키마 실패는 422
    **배열** `detail`이다. 그런데 실제로 이 다섯을 판정하는 것은 스키마가 아니라 서비스
    층이고 결과는 422 **문자열** `detail`이다. **계약이 자기 자신과 충돌했다.**

    실측(2026-08-13): 다섯 필드의 Pydantic 모델에는 길이 제약이 **하나도 없다**
    (`SignupRequest`·`DocumentTextRequest`·`ConversionReviewRequest`·`WorkspaceNameRequest`
    전부 `model_json_schema()`에 `maxLength`/`minLength` 0건). 전부
    `InvalidInputError` → 422 문자열이다.

    더 나쁜 것은 **경계까지 달랐다**는 점이다. 서비스는 정규화한 **뒤**의 길이를 재는데
    스키마 제약은 **원시 값**에 걸리므로, 셋은 계약이 코드보다 엄격했다. 실측한 갈림 입력:

      - `email` 원시 260자(앞 공백 10) → 정규화 후 250자. **코드 통과 / 스키마 거절**
      - `edited_text` 원시 4,010자(제어문자 11) → 정규화 후 3,999자. **코드 통과 / 스키마 거절**
      - `name` 원시 55자(제어문자 10) → 정규화 후 45자. **코드 통과 / 스키마 거절**

    반대 방향도 있다 — `name`의 `minLength: 1`은 `"   "`(공백 3자)를 통과시키지만 서비스는
    거절한다. 한 필드에서 두 방향으로 갈렸다.

  x-decision: |
    **다섯 전부 서비스 층 규칙으로 유지한다. OpenAPI 길이 키워드를 제거한다.**
    (판정 2026-08-13, contract-keeper. 근거 **G1**(계약이 사실과 다름) + **G4**(계약의 두
    조항이 서로 모순이라 양쪽을 동시에 만족시킬 수 없음).)

    반대 방향(코드를 스키마 층으로 옮기기)을 택하지 않은 이유가 셋이다.

    1. **요구가 정규화 후 판정을 지정했다.** "제어문자를 걷어내고 앞뒤 공백을 턴 뒤
       검사한다"는 이 계약 자신의 문장이고(`POST /workspaces` 설명), 제어문자를 먼저
       걷어내는 이유도 명시돼 있다 — 남겨 두면 docx 내보내기 시점에 터져 사용자가 원인을
       알 수 없는 500을 받는다. 스키마 층은 정규화 전에 돌므로 **이 요구를 표현할 수 없다.**
    2. **사용자에게 보이는 문구가 한국어에서 영어로 바뀐다.** React `readErrorMessage`
       (`frontend/src/api/client.ts:83-90`)는 배열 `detail`에서 `msg`만 뽑아 그대로 화면에
       올린다. 스키마 층으로 옮기면 `"작업 공간 이름은 50자 이하여야 합니다"` 대신
       Bean Validation의 영문 문구가 사용자에게 나간다. **상태 코드는 그대로라 테스트로도
       잡히지 않는 종류의 품질 저하다.**
    3. **한 API 안에서 길이 위반의 응답 모양이 둘로 갈린다.** 다섯 중 둘(`password`·`text`)은
       경계가 코드와 같아 옮겨도 값 동작이 안 바뀌지만, 옮기면 같은 "길이 위반"이 필드에
       따라 배열/문자열로 갈려 클라이언트 분기가 예측 불가능해진다.

    **이것은 계약을 느슨하게 만드는 변경이 아니다.** 상한은 그대로이고, 강제하는 층과
    재는 대상이 사실과 맞게 적혔을 뿐이다.

  x-contrast-case: |
    **모든 제약을 걷어낸 것이 아니다.** `GET /documents`의 `limit`·`offset`은 진짜 스키마
    제약이고 그대로 둔다 — 구현이 `Annotated[int, Query(ge=1, le=100)]`로 **실제로 스키마
    층에서** 판정하며 422 배열이 나간다(`ValidationFailed.examples.query_range`가 그 예시다).

    계약이 통째로 틀렸던 것이 아니라, **코드가 스키마 층에서 재는 자리에서는 맞았고 아닌
    자리에서 틀렸다.** 이 대비가 판정의 근거다 — 규칙을 일괄 적용한 것이 아니라 자리마다
    실제 강제 지점을 확인했다.

  fields:
    - field: "SignupRequest.email"
      layer: service            # 위반 시 422 **문자열** detail
      limit: 255
      measured_on: "정규화 후 — 앞뒤 공백 제거 + 소문자화(app/services/auth.py:192-194)"
      detail: "이메일 형식이 올바르지 않습니다"    # 길이 초과와 형식 오류가 같은 문구다(입력값 비반향)
    - field: "SignupRequest.password"
      layer: service
      limit: 8                  # 하한. 상한 없음 — argon2는 입력 길이에 비용이 좌우되지 않는다
      measured_on: "원시 값 — 정규화하지 않는다"
      detail: "비밀번호는 8자 이상이어야 합니다"
    - field: "DocumentTextRequest.text"
      layer: service
      limit: 20000
      measured_on: "원시 값 — 정규화하지 않는다. ⚠ `edited_text`와 비대칭이다(아래 x-open-asymmetry)"
      detail: "현재는 20,000자 이하 문서만 변환할 수 있습니다"
    - field: "ConversionReviewRequest.edited_text"
      layer: service
      limit: 20000
      measured_on: "정규화 후 — 제어문자 제거(app/services/documents.py:399-402)"
      detail: "수정본은 20,000자 이하여야 합니다"
    - field: "WorkspaceNameRequest.name"
      layer: service
      limit: 50                 # 하한은 "정규화 후 비어 있지 않을 것"이며 minLength로 표현되지 않는다
      measured_on: "정규화 후 — 제어문자 제거 + 앞뒤 공백 제거(app/services/workspaces.py:136-140)"
      detail: ["작업 공간 이름을 입력해 주세요", "작업 공간 이름은 50자 이하여야 합니다"]

  x-open-asymmetry: |
    **미결 — Phase 4, `kotlin-implementer`·`parity-verifier` 공동.**
    `edited_text`는 제어문자를 걷어낸 뒤 길이를 재는데 `text`(붙여넣기)는 그러지 않는다
    (`create_from_text`가 `strip_control_chars`를 부르지 않는다 — 2026-08-13 실측).
    그런데 제어문자를 먼저 걷어내는 **이유**로 계약이 든 것(docx 내보내기가 담지 못해
    500이 된다)은 두 경로에 똑같이 적용된다. 즉 붙여넣기 본문의 제어문자는 지금 저장까지
    도달한다.

    **이 계약은 그 비대칭을 해소하지 않는다** — 정규화 범위를 넓히는 것은 계약 문구가 아니라
    변환 파이프라인의 판단이고, 텍스트 정규화 명세는 parity 레인이 소유한다. 계약은 현재
    요구되는 측정 기준을 **있는 그대로** 적고 이 자리를 미결로 표시한다. 해소되면
    `measured_on`을 함께 고친다.

  x-openapi-expressibility: |
    이 절의 요구는 OpenAPI 문법으로 끝까지 표현되지 않는다. `maxLength`는 "원시 값의
    길이"만 말할 수 있고 "정규화 후 길이"를 말할 수 없다. 그래서 값을 스키마 키워드가
    아니라 이 확장 절에 둔다 — **생성기가 조용히 틀린 검증기를 만드는 것**이
    상한을 기계가독으로 잃는 것보다 나쁘다(`x-error-body-universality`와 같은 판단).

