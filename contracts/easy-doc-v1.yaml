    revision: "M-405b"
    author: contract-keeper
    change: |
      **M-405 정정 누락 보완 — `x-improvements` OQ-1의 「7종」을 6종으로.**
      (교차 종합 게이트 22 **ⓗ**.)
        - `x-improvements[id=OQ-1].detail` — "파싱 단계 거절 7종" → **6종** + 정정 표시.
      M-405가 같은 수를 인용하는 자리를 훑으면서 이 한 곳을 놓쳤다.
    basis: |
      근거 **G1** — M-405와 같다. 「알 수 없는 메서드 → 405」는 파싱 단계 거절이 아니므로
      미도달 목록은 6종이다(판별 근거 셋은 `x-phase3-measurement.x-405-reclassification`).

      **`x-changelog`의 옛 항목 2곳(H-1·R-1 인접)은 이번에도 고치지 않는다** — 그 항목들은
      당시에 무엇을 적었는지의 기록이라 사후 편집하면 판정 근거가 사라진다. `x-improvements`는
      성격이 다르다: **지금의 상태**를 적는 자리이므로 현행 수로 맞추는 것이 맞고, 그래서
      M-405의 면제 대상이 아니었다.

      **`info.version`은 올리지 않는다** — 서술 정정이고 나가는 바이트가 그대로다.
    react_impact: "없다 — 서술 정정."
    affected_tests: "없다. 이 절을 읽는 테스트가 없다(열거자 대조는 `x-phase3-measurement`를 읽는다)."
    notified: [kotlin-implementer, migration-reviewer, 리더]

  - version: "1.1.0"
    date: "2026-08-19"
    revision: "M-405"
    author: contract-keeper
    change: |
      **파싱 단계 거절 응답의 분류 정정 — 7종 → 6종.**
      「알 수 없는 메서드 → 405」를 `x-phase3-measurement.unreachable_by_filter.cases`에서
      `reachable_by_filter`로 옮겼다.
        - `unreachable_by_filter.note`·`cases` — 7종 → **6종**, 405 항목 제거
        - `reachable_by_filter` — 405 항목 추가
        - `x-405-reclassification` **신설** — 판별 근거 셋(실측)과 「별도 조항을 만들지 않는
          이유」를 적는다
        - 같은 수를 인용하던 네 자리 정정: `x-failure-mode-shift`·`enforcement`·
          `x-container-coupling`·`x-openapi-expressibility` ⑥ (전부 7 → 6)
        - `resolution`("밸브가 위 N종 **전부**를 덮는다")·`residual` — 7 → 6
        - `x-error-body-universality.x-unmeasured` — 대상에서 405 제외(④가 아니라 ①이다) +
          「콜론 없는 헤더 줄 400」 본문 1종 측정 등재. **E-4는 닫지 않는다**(5종 미측정)
      **`x-changelog`의 옛 항목은 고치지 않았다** — 그 항목들은 당시에 무엇을 적었는지의
      기록이고, 사후 편집하면 판정의 근거가 사라진다.
    basis: |
      근거 **G1**(계약이 사실과 다름). 원시 소켓 실측(실기동 `@SpringBootTest(RANDOM_PORT)`,
      `FROB /health`)에서 그 405는 **서블릿까지 도달한다** — `Allow: GET`이 붙고,
      `Content-Type`에 `;charset=UTF-8`이 없으며, 본문이 우리 고정 문구다.
      측정 전문은 `03_kotlin-implementer_auth-fixes2.md` §4.

      **G4가 아니다.** 조항이 지킬 수 없는 형태였던 것이 아니라 **한 항목의 소속이 틀렸다.**
      **요구는 하나도 바뀌지 않았다** — 그 응답에도 두 헤더가 붙어야 하고 본문은
      `ErrorResponse`여야 한다. 바뀐 것은 「무엇이 그것을 붙이는가」의 서술뿐이다.

      **`info.version`은 올리지 않는다** — 올바르게 구현한 런타임이 내보내는 바이트가
      달라지지 않는다.
    react_impact: |
      **없다.** `frontend/src/api/client.ts`는 405를 분기하지 않고(401 하나만 분기한다)
      나머지는 `ApiError(status, message)`로 감싼다. 이 재분류는 응답 자체를 바꾸지 않는다.
    affected_tests: |
      - `ContainerRejectedRequest` 열거자 — 계약 6종과 **집합으로** 같아야 한다.
        정정 전에는 열거자 6 vs 계약 7이라 대조 장치를 넣으면 빨간 채 커밋해야 했다.
        **이제 6 = 6이므로 열거자↔계약 대조를 빌드에 넣을 수 있다**(구현 레인 몫).
      - 405 도달 응답 — `PrivateResponseHeadersReachTest`의 **도달 케이스**로 붙든다.
      - `00_contract-keeper_test-plan.md` §3 **X-D2c** 행의 7종 열거 — 별도 문서 커밋에서 정정.
    notified: [kotlin-implementer, parity-verifier, migration-reviewer, 리더]

  - version: "1.1.0"
    date: "2026-08-15"
    revision: "F3"
    author: contract-keeper
    change: |
      **요청 본문 필드 5개의 길이 제약을 스키마 키워드에서 서비스 층 규칙으로 정정.**
      (F3 = 교차 리뷰 C-5. Phase 3 착수 전 판정 항목.)
        - `SignupRequest.email` `maxLength: 255` 제거 → `x-service-constraint`
        - `SignupRequest.password` `minLength: 8` 제거 → `x-service-constraint`
        - `DocumentTextRequest.text` `maxLength: 4000` 제거 → `x-service-constraint`
        - `ConversionReviewRequest.edited_text` `maxLength: 4000` 제거 → `x-service-constraint`
        - `WorkspaceNameRequest.name` `minLength: 1`·`maxLength: 50` 제거 → `x-service-constraint`
        - **`x-request-field-constraints` 신설** — 판정문·근거·필드별 측정 기준의 정본
        - `x-input-limits`에 `max_email_length`·`min_password_length` 추가,
          `list_limit`·`list_offset`에 "스키마 층" 표시
        - `components/responses/ValidationFailed` — 배열/문자열의 **경계 규칙**을 명시
    basis: |
      근거 **G1**(계약이 사실과 다름) + **G4**(계약의 두 조항이 서로 모순이라 동시에
      만족시킬 수 없음). 계약은 스키마 실패를 422 **배열**로 못박았는데 이 다섯을 판정하는
      것은 스키마가 아니라 서비스 층이고 결과는 422 **문자열**이다.

      실측(2026-08-13): 다섯 필드의 Pydantic 모델에 길이 제약 **0건**. 셋은 계약이 코드보다
      엄격했다 — 서비스가 **정규화 후** 길이를 재기 때문이다. 갈림 입력 실측:
      email 원시 260→정규화 250 / edited_text 원시 4,010→3,999 / name 원시 55→45.
      셋 다 **코드 통과·스키마 거절**. 반대로 `name`의 `minLength: 1`은 `"   "`를
      통과시키는데 서비스는 거절한다 — 한 필드가 양방향으로 갈렸다.

      **반대 방향(코드를 스키마 층으로)을 택하지 않은 이유**: ① 요구가 정규화 후 판정을
      지정했고(제어문자를 남기면 docx 내보내기에서 500) 스키마 층은 정규화 전에 돌아 이를
      표현할 수 없다, ② React `readErrorMessage`가 배열의 `msg`를 그대로 화면에 올리므로
      한국어 문구가 Bean Validation 영문으로 바뀐다 — 상태 코드가 같아 테스트로 안 잡히는
      품질 저하다, ③ 같은 "길이 위반"이 필드마다 배열/문자열로 갈려 클라이언트 분기가
      예측 불가능해진다.

      **일괄 삭제가 아니다** — `limit`·`offset`(`Annotated[int, Query(ge=1, le=100)]`)은
      진짜 스키마 제약이라 그대로 뒀다. 자리마다 실제 강제 지점을 확인한 결과다.

      **`info.version`은 올리지 않는다** — 올바르게 구현한 런타임이 내보내는 바이트가
      달라지지 않는다. 계약의 산문(`POST /auth/signup` 설명)은 이미 "도메인 예외 → 422
      문자열"이라고 적고 있었고, 이번 변경은 그 산문과 충돌하던 스키마 키워드를 걷어낸
      **오기 정정**이다(R-1·U-1·OQ-1·H-1과 같은 판단).

      React 영향: **없음.** 문자열 `detail`은 `client.ts:79-81`이 이미 처리하는 경로이고,
      이번 판정은 그 경로를 **유지**하는 쪽이다. 스키마 층으로 옮겼다면 오히려 화면 문구가
      바뀌었을 것이다.

      미결로 남긴 것: `text`(원시 길이)와 `edited_text`(정규화 후 길이)의 **비대칭**.
      정규화 범위 확대는 계약 문구가 아니라 변환 파이프라인 판단이라
      `x-request-field-constraints.x-open-asymmetry`에 Phase 4 미결로 표시했다.

      영향받는 검증: X-F1·X-F2에 **`detail` 타입 단언 추가**(문자열이어야 한다),
      X-F9 신설(정규화 후 경계 — 원시 초과·정규화 후 이하인 입력이 **통과**한다),
      X-F10 신설(`name`이 `"   "`를 문자열 detail로 거절한다).
      통보 대상: kotlin-implementer(Phase 3에서 바로 걸린다 — `@Size`/`@NotBlank` 금지),
      parity-verifier(다섯 필드의 `detail` 전문 일치는 계약이다), 리더.
