    - id: datasource
      was: "DB 세션 팩토리 미배선 → 전체"
      retired_at: "2026-08-20"
      revision: "1.4.0"
      ground: G1
      x-was-deferred: |
        **1.3.0에서는 내리지 않았다 — 재지 않았기 때문이다.** 그 유보는 옳았고
        (`재지 않은 것을 지우지 않는다`), 게이트 28 P-5가 그 유보 자체를 마감으로 올렸다.
        **1.4.0에서 재고 내렸다.** 아래 `measured`가 그 측정이다.
      why: |
        **DataSource가 미배선·도달 불가인 구성에서 애플리케이션이 기동해 503을 응답하는
        상태가 존재하지 않는다.** `JdbcClient`는 컨트롤러가 생성 시점에 요구하는 빈이므로
        DataSource가 서지 않으면 **컨텍스트 조립 자체가 취소된다.** 즉 "미배선인데 서비스
        중"이 구조적으로 없다.

        **강제로 띄운 구성에서도 503이 아니다** — Flyway를 환경변수로 끈 채(제품 구성이
        아니다) DB가 죽은 상태로 띄우면 앱은 뜨지만, DB를 만지는 요청이 내는 것은
        **500**이다. 그러므로 **어떤 구성에서도** DB 장애가 503으로 관측되지 않는다.
      measured:
        at: "2026-08-20"
        by: contract-keeper
        method: |
          이미 빌드된 bootJar를 **저장소를 고치지 않고** 다섯 가지 구성으로 띄웠다.
          저장 암호화 키·KCV는 다섯 팔 전부에 같은 값으로 주어 **독립 변수를 하나로**
          유지했다 — 움직인 것은 `SPRING_DATASOURCE_URL`과 `SPRING_FLYWAY_ENABLED`뿐이다.
        arms: |
          A(도달 가능 DB · Flyway 제품 기본)      → 기동 O · `/health` 200
          B(URL 빈 값 · Flyway 제품 기본)         → 기동 실패 (드라이버 결정 불가)
          C(닫힌 포트 · Flyway 제품 기본)         → 기동 실패 (Flyway 초기화에서 접속 시간 초과)
          D(닫힌 포트 · Flyway 꺼짐 — 제품 구성 아님) → 기동 O · DB를 만지는 요청은 **500**
          E(URL 빈 값 · Flyway 꺼짐 — 제품 구성 아님) → 기동 실패
        why_five_arms: |
          **A는 대조군이다** — 같은 하네스·같은 키·같은 jar로 URL만 도달 가능하게 하면
          기동이 성공한다. 실패가 하네스 탓이 아님을 그 팔이 고정한다.
          **E는 "Flyway 때문이 아니다"를 가른다** — Flyway를 끈 채 빈 URL로도 실패하므로
          원인은 DataSource 자신이다. 이 팔이 없으면 "Flyway를 끄면 되는 문제"로 오독된다.
          **D는 제품 구성이 아니다** — `spring.flyway.enabled: true`를 환경변수로 덮은
          것이고 api 프로필에 그것을 끄는 조항은 없다. 그런데도 재둔 이유는 **그 팔에서조차
          503이 나오지 않음**을 보이기 위해서다.
      unmeasured: |
        **복합 실패(DB는 살아 있고 작업 테이블만 없는 구성)는 재지 않았다.** Flyway가
        같은 기동에서 스키마를 맞추므로 그 상태를 만들려면 마이그레이션을 우회해야 하고,
        그것은 제품 구성이 아니다. **"충족"으로도 "위반"으로도 적지 않는다.**
      if_it_should_return: |
        **기동 정책이 바뀌면 다시 봐야 한다.** "DB 없이도 뜨게" 만들면 그때는 "DB 미배선인데
        서비스 중"이 실재하게 된다 — 다만 위 D 팔이 보인 대로 그 상태의 응답은 500이었으므로,
        되살리려면 503을 내는 코드를 함께 세워야 한다. 그 변경은 배포 동작을 바꾸므로
        `x-change-policy.escalate_to_leader` 4번이다.
      x-collateral: |
        **이 측정이 계약 밖의 문면 하나를 거짓으로 만들었다.** `application.yml`의 Hikari
        `initialization-fail-timeout: -1` 주석이 *"DB가 떠 있지 않아도 앱은 뜨고 `/health`로
        진단할 수 있어야 한다"*고 적는데 **위 C 팔이 그 반대를 보였다** — 같은 기동의 Flyway가
        접속하기 때문이다. Hikari 설정 자체는 유효하고 **주석의 전칭이 거짓**이다.
        이 사실은 `/health`의 `checks.database` 도달 범위와 직결된다(`paths./health.get`).

# -----------------------------------------------------------------------------
# 415(미지원 Content-Type) — **엔드포인트별 조항이 아니라 종류다**
# (2026-08-20 신설. 근거 **G2**. **이 절이 정본이다**)
#
# 왜 종류로 적는가: 게이트 28 리더 판정이 지목한 자리는 **셋**이었고
# (`POST /documents` · `POST`·`PATCH /workspaces`) **실측은 다섯을 냈다** —
# `POST /auth/signup`·`POST /auth/login`도 같은 응답을 낸다. 열거했으면 두 자리가 빠졌다.
# 그래서 규칙을 집합으로 적고, 그 집합을 **계약에서 계산하는** 검증을 함께 건다.
# -----------------------------------------------------------------------------
x-unsupported-media-type:
  ground: G2
  decided_at: "2026-08-20"
  component: UnsupportedMediaType
  requirement: |
    클라이언트가 **"본문이 틀렸다"(422)와 "본문의 형식을 아예 받지 않는다"(415)**를
    구분할 수 있어야 한다. 둘을 한 코드로 뭉개면 재시도 판단이 무너진다 —
    422는 값을 고쳐 다시 보내는 것이고 415는 **다른 형식으로 보내야 하는 것**이다.
  rule: |
    **요청 본문을 받는 모든 오퍼레이션은 415를 선언한다.** 대상 집합은 열거가 아니라
    `paths` 아래 `requestBody`를 가진 오퍼레이션 전부이고, 계약 테스트가 그 집합을
    **계약에서 계산해** 선언 유무를 대조한다(그러므로 본문을 받는 오퍼레이션이 새로 생기면
    415 선언 누락이 그 커밋에서 드러난다).

    **본문을 받지 않는 오퍼레이션은 선언하지 않는다** — 그쪽은 `Content-Type`을 보지 않는다.
  detail_shape: string
  detail_source: |
    **상태 코드의 표준 사유 문구**다. 도메인 예외의 한국어 문구와 **다른 규칙**이며
    그것이 의도다.

    구현에서 오류 본문을 만드는 세 경로(전역 예외 advice · `/error` 디스패치 ·
    컨테이너가 직접 만드는 응답)가 **같은 함수 하나**로 이 문구를 만든다. 경로마다 문구
    규칙이 갈리면 같은 상태 코드에 다른 본문이 나가고, **그 차이가 어느 경로를 탔는지를
    밖에 알려주는 신호**가 된다. 415는 프레임워크가 만드는 응답이므로 이 규칙에 속한다.

    **한국어로 바꾸지 마라.** 그것은 미번역 자리를 고치는 것이 아니라 위 균일성을 깨는
    것이다. 사유를 여기 적는 이유가 그것이다 — 적지 않으면 다음 사람이 "빠뜨린 번역"으로
    보고 고친다(`x-title-policy.rationale`이 밟은 순서와 같다).
  response_header_accept: |
    이 응답에는 **그 오퍼레이션이 받는 미디어 타입 집합**이 `Accept` 응답 헤더로 실린다
    (프레임워크가 `requestBody.content`의 키 집합에서 만든다). 계약 테스트는 그 값을
    **오퍼레이션의 `requestBody.content` 키 집합에서 읽어** 대조한다 — 코드에 적지 않는다.
  x-measured:
    at: "2026-08-20"
    reached: |
      **다섯 오퍼레이션에서 실측했다** — `POST /auth/signup` · `POST /auth/login` ·
      `POST /documents` · `POST /workspaces` · `PATCH /workspaces/{workspace_id}`.
      다섯 전부 415이고 본문 최상위 키는 `detail` 하나였다.
    not_reached: |
      **`PUT /conversions/{conversion_id}`는 재지 못했다 — 구현이 없다.**
      선언은 하되 **"쟀다"로 읽히지 않게 이 자리에 적는다.** 그 오퍼레이션을 구현하는
      단위가 이 팔의 케이스를 함께 닫는다.

      **`PUT /conversions/{conversion_id}/feedback`도 같다** (1.5.0 신설, 구현 전).
      본문을 받으므로 위 `rule`에 따라 415를 선언하지만 그것은 선언이지 측정이 아니다.
  x-auth-order-open:
    status: 판정_대기
    escalated_to: 리더
    escalated_at: "2026-08-20"
    what: |
      **무인증 요청에도 415가 나간다 — 401보다 앞선다.** 실측(2026-08-20):
      `POST /documents`에 두 `consumes` 밖 `Content-Type`을 **토큰 없이** 보내면 415이고,
      **위조 토큰**으로 보내도 415다. 같은 요청을 `application/json`으로 보내면 401이다.
    why_it_matters: |
      `info.description`의 「인증 실패와 입력 검증의 우선순위」는 *"인증이 먼저다 …
      인증되지 않은 호출자에게 **검증 의미론**을 알려 줄 이유가 없다"*고 적는다.
      **415 응답은 그 검증 의미론을 알려 준다** — `Accept` 헤더가 그 오퍼레이션이 받는
      미디어 타입 집합을 무인증 호출자에게 그대로 준다. 조항이 든 근거가 바로 **API 표면
      탐색**이므로 이 자리는 그 근거에 정면으로 걸린다.
    mechanism: |
      미디어 타입 매칭은 핸들러 매핑(`getHandler()`)에서 일어나고 인증은
      `HandlerInterceptor.preHandle`이라 **인터셉터 체인이 시작되기 전에 415가 확정된다.**
      `x-global-response-headers.x-phase3-measurement`의 「필터에 못 닿는 응답」과 같은
      계열의 층 문제이나, 그쪽과 달리 **이 자리는 도달이 실재한다**(위 실측).
    x-not-narrowed: |
      **조항을 좁히지 않았다.** 불변식 축소는 `x-change-policy.escalate_to_leader` 3번이고,
      무엇보다 **좁히는 것이 옳은지 모른다** — 415는 자원의 존재를 누설하지 않지만 API 표면을
      누설한다. **케이스도 쓰지 않는다**: 판정 전에 기대값을 못박으면 틀릴 수 있는 동작을
      계약으로 굳힌다. 유효한 토큰으로 재는 케이스는 판정과 무관하게 성립하므로 그쪽만 쓴다.

