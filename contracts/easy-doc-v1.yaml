# 폐기된 응답 — **되살리지 않기 위해 이름을 남긴다**
#
# 조항을 지우기만 하면 다음 사람이 같은 자리를 "빠뜨린 것"으로 보고 되살린다.
# `x-title-policy.x-superseded`와 같은 장치이며, 여기 적힌 상태 코드는
# **어느 오퍼레이션의 `responses`에도 나타나서는 안 된다**(계약 테스트가 그것을 잰다).
# -----------------------------------------------------------------------------
x-retired-responses:
  - status: "502"
    component: BadGateway
    retired_at: "2026-08-20"
    ground: G1
    retired_by: "리더 판정 L-1 (게이트 27 교차 종합 행 2) — 계약·구현·테스트를 한 변경 단위로"
    was: |
      "하위 시스템 장애 — 재시도할 값어치가 있다"로 두 사유를 담았다:
      `QueueUnavailableError`(큐 등록 시도 실패)와 `LLMProviderError`(및 하위 둘).
      선언 자리는 `POST /documents`의 `'502'` 하나뿐이었다.
    why: |
      **두 사유 모두 이 API에서 만들 수 없다.**

      1. `QueueUnavailableError` — Redis/ARQ 전제였다. 큐가 같은 DB로 옮겨오면서 등록이
         저장과 **같은 트랜잭션**에 들어갔고, "저장은 됐는데 등록은 실패"라는 상태가
         구조적으로 성립하지 않는다. 등록이 실패하면 전량 롤백이고 그때 옳은 코드는
         500이다. 실측(2026-08-20): 그 예외를 던지는 제품 코드가 **0곳**이었다.
      2. `LLMProviderError` — **15개 오퍼레이션 중 동기로 LLM을 부르는 것이 없다.**
         변환은 워커가 비동기로 하고, LLM 실패는 HTTP 상태가 아니라
         `ConversionResponse.failure_code` 값으로 사용자에게 간다.
         (수는 1.5.0에서 14에서 15로 늘었다 — 새 오퍼레이션
         `PUT /conversions/{conversion_id}/feedback`도 LLM을 부르지 않으므로
         이 진술은 그대로 참이다.)

      즉 502는 이 계약에서 **도달 0인 조항**이었다. 조항만 지우고 컴포넌트를 남기면
      참조 없는 고아가 되고, 그것을 읽는 테스트는 자기 사본과 대조해 초록이 된다.
    if_it_should_return: |
      **동기로 하위 시스템을 부르는 오퍼레이션이 새로 생기면** 그때 다시 세운다.
      그 변경은 조항 하나가 아니라 ⑴ 컴포넌트 ⑵ 그 오퍼레이션의 `responses`
      ⑶ 502와 503과 500을 가르는 근거 ⑷ React 실패 안내를 한 단위로 갖춰야 한다.
    reinstated_at: "2026-09-04"
    reinstated_by: |
      2.8.0(backlog §1.4 P0-1, 소셜 로그인) — 정확히 위 [if_it_should_return] 이 예고한
      경우다. `POST /auth/oauth/{provider}/callback` 이 인가 코드를 Google 토큰
      엔드포인트와 동기로 교환한다(`GoogleSocialLoginProvider`). 네 요소:
      ⑴ 컴포넌트를 아래서 되살렸다(`components.responses.BadGateway`, 예시는 이번엔
      일반 문구 — 벤더 오류 텍스트를 담지 않는다). ⑵ 그 오퍼레이션의 `responses` 에만
      `'502'` 를 선언했다(다른 15개 오퍼레이션은 여전히 502 를 선언하지 않는다 —
      "동기로 하위 시스템을 부르는" 오퍼레이션이 이것 하나뿐이라서다). ⑶ 근거:
      500(우리 코드 버그) · 503(우리 설정 미비, 제공자와 무관) · 502(제공자에 닿지
      못함 — 우리 잘못도 사용자 잘못도 아니다). ⑷ **React 실패 안내는 이 변경 단위
      밖이다** — 프런트 레인이 뒤따르며(같은 PR) 그 화면 문구를 붙인다; 이 계약
      변경은 백엔드·계약만 묶는다.

      **2.10.0 — 두 번째 오퍼레이션이 같은 자리를 밟는다(backlog §1.4 명시적 연결).**
      `POST /auth/oauth/{provider}/link/callback` 도 인가 코드를 Google 과 동기로
      교환한다 — `oauthCallback` 과 같은 `GoogleSocialLoginProvider.exchange` 를 그대로
      쓰므로 근거 ⑶이 그대로 적용된다. **범위는 여전히 좁다** — 이번에도 컴포넌트에
      `'502'`를 선언한 오퍼레이션은 딱 둘(`oauthCallback`·`oauthLinkCallback`)이고, 나머지
      20개는 여전히 선언하지 않는다. "동기로 하위 시스템을 부르는" 오퍼레이션이
      늘어난 것이지 이 조항의 판정 기준([if_it_should_return])이 넓어진 것이 아니다.

      **2.14.0 — 세 번째 오퍼레이션(P0-4 S4, 2026-09-05).**
      `POST /conversions/{conversion_id}/units/{source_unit_index}/reconvert`
      (`reconvertUnit`)이 재변환 1회의 LLM 호출을 **동기로** 부른다(`ReconvertUnitService`)
      — 워커 큐를 타지 않는 유일한 변환 경로다(계획
      `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md` §4 결정 3 「동기
      처리」). 같은 근거 ⑶이 그대로 적용된다: 500(우리 코드 버그) · 503(우리 설정
      미비) · 502(제공자에 닿지 못함). **범위 판정은 이번에도 좁게 유지한다** —
      `'502'`를 선언한 오퍼레이션은 이제 정확히 셋(`oauthCallback`·`oauthLinkCallback`·
      `reconvertUnit`)이고, 나머지 20개는 여전히 선언하지 않는다.
    consumer_debt: |
      `frontend/src/conversion/failureMessages.ts`의 `EnqueueFailed` 항목은 이제 어떤
      구현에서도 오지 않는 코드다(조회는 `MESSAGES[code] ?? UNKNOWN`이라 **런타임은
      깨지지 않는다**). `frontend/src/pages/UploadPage.tsx`의 `502(변환 서비스)` 주석도
      같다. 둘 다 Phase 6 타입 교체에서 회수한다.
      `frontend/src/api/client.test.ts`의 502 픽스처는 **일반 오류 경로 검증**이라
      이 조항과 무관하다 — 건드리지 않는다.

