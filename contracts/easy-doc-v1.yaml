  # ===========================================================================
  # #4 POST /documents — 202 (201 아님 — 변환은 아직 시작 전)
  # 원본: app/api/documents.py::create_document
  # ===========================================================================
  /documents:
    post:
      tags: [documents]
      operationId: createDocument
      summary: 문서를 등록하고 변환을 요청한다 (접수만 한다)
      security: [{ HTTPBearer: [] }]
      description: |
        한 엔드포인트가 **두 가지 입력**을 받는다. `Content-Type`으로 가르며 비교는
        대소문자를 가리지 않는다(RFC 9110) — `Multipart/Form-Data`가 JSON 경로로
        새면 안 된다.

        1. `application/json` — 붙여넣기 모드 (`text`, `title?`, `workspace_id?`)
        2. `multipart/form-data` — 파일 모드 (`file`, `title?`, `workspace_id?`)

        **FastAPI 자동 생성 OpenAPI에는 이 요청 본문이 아예 없다.** 라우터가
        `Request`를 직접 읽어 파싱하기 때문이다(본문은 한 번만 읽을 수 있어 두 방식을
        동시에 선언할 수 없다). 아래 스키마는 라우터 코드를 읽고 손으로 적은 것이다.

        `workspace_id`를 주지 않으면 기본(가장 먼저 만든) 작업 공간에 담긴다.
        남의 `workspace_id`는 **404**다 — 빈 목록으로 답하면 남의 작업 공간 존재를
        확인하는 수단이 된다.

        검사 순서: 파일 크기(413) → 추출(422) → 본문 길이(422) →
        **작업 공간: 형식(422) 다음 소유권(404)** → **저장 정의역(422)** →
        **저장과 큐 등록(한 트랜잭션)** → 커밋.
        작업 공간 확인이 저장보다 **먼저**여야 거절당한 업로드가 기본 공간에 남지 않는다.

        **이 순서는 복합 결함에도 적용된다** (2026-08-20 신설, 근거 **G2**).
        결함이 둘 이상 겹친 요청에서 **관측되는 응답은 이 목록에서 가장 앞선 검사의 것**이다.
        예: 상한을 넘는 파일 + 형식이 잘못된 작업 공간 식별자 → **413이다**(422가 아니다).

        **왜 조항이 필요한가.** 종전 문면은 순서를 열거하면서 ⑴ 복합 결함에 적용되는지
        ⑵ `workspace_id`의 **형식** 검증이 어디에 있는지를 **둘 다 말하지 않았다**(소유권만
        적혀 있었다). 그 공백에서 두 리뷰가 같은 자리를 보고 반대 결론을 냈고(게이트 28 P-4),
        실제 구현에서는 **언어의 인자 평가 순서**가 관측되는 상태 코드를 정하고 있었다 —
        즉 호출 지점의 줄 순서를 바꾸는 리팩터링이 와이어 동작을 조용히 바꾼다.
        **계약이 말하지 않으면 그 순서는 아무도 지키지 않는다.**

        **요구의 내용**: 클라이언트가 재시도 판단을 할 수 있어야 한다. 형식 오류(422)가
        크기 초과(413)를 앞서면 클라이언트는 식별자를 고쳐 **상한 초과 본문을 다시 올리고**
        그제서야 413을 받는다 — 큰 본문을 두 번 보내게 만드는 순서이고, 이 목록이 애초에
        "싼 거절을 먼저"로 짜인 취지에 반한다. 형식 검증은 소유권 확인의 **선결**이므로
        같은 단계에 속하고, 따라서 크기·추출·본문 길이보다 **뒤다**.

        **계약이 정하는 것은 나가는 상태 코드뿐이다** — 크기 판정을 앞으로 끌어오든 형식
        파싱을 뒤로 미루든 구현 판단이다.

        **저장 정의역이 소유권 뒤에 오는 것은 의도다**(`x-stored-text-domain`). 그것은 요청
        필드의 형식 규칙이 아니라 **저장 경로의 정의역**이고, 판정하는 자리가 곧 봉인 직전이다.
        앞의 세 검사와 달리 트랜잭션 **안**에서 나므로 거절되면 함께 롤백된다 — 어느 쪽이든
        **거절된 업로드는 아무 데도 남지 않는다.**

        **저장과 큐 등록은 한 트랜잭션이고 커밋이 마지막이다.** 큐가 별도 저장소가 아니라
        같은 DB이므로 "문서·변환은 커밋됐는데 작업만 없다"는 상태가 **구조적으로 생기지
        않는다**. 등록이 실패하면 문서·변환도 함께 롤백되어 **아무것도 접수되지 않으며**,
        그때 나가는 것은 **500**(`InternalError`)이다 — 되돌릴 것이 없는 실패에 재시도
        신호(502)를 붙이지 않는다. 등록은 작업 id를 변환 id로 고정해 **멱등**하다.

        이 문단은 2026-08-20에 개정됐다. 옛 조항(*"큐 등록에 실패하면 이미 커밋된 변환을
        `failure_code = "EnqueueFailed"`로 표시한 뒤 502"*)은 **Redis/ARQ 전제**였고,
        PostgreSQL lease 큐에는 그 상태를 만들 무대가 없다 — `x-retired-responses` 참조.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTextRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentFileRequest' }
            encoding:
              file:
                contentType: >-
                  application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                  application/pdf,
                  application/hwp+zip
      responses:
        '202':
          description: |
            접수됨. 변환은 아직 시작되지 않았다 — `Location`이 가리키는 주소에서
            상태를 확인한다.
          headers:
            Location:
              description: |
                `/conversions/{conversion_id}` 형식. 클라이언트가 폴링 주소를 스스로
                조립하지 않아도 되게 하는 표준 헤더다. **CORS `expose_headers`에
                포함되어야 브라우저 JS가 읽을 수 있다.**
              required: true
              schema: { type: string, examples: ["/conversions/00000000-0000-4000-8000-000000000001"] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (403 아님)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found:
                  value: { detail: "작업 공간을 찾을 수 없습니다" }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            빈 본문 · 20,000자 초과 · 지원하지 않는 형식 · 추출 실패 ·
            **텍스트로 저장할 수 없는 문자**(`x-stored-text-domain`) · 잘못된 JSON ·
            `workspace_id` 형식 오류 · 필드 누락.
            앞의 것들은 문자열 detail, 마지막은 배열 detail이다.
            **이 목록도 `examples`도 전칭이 아니다** — 새 거절 갈래가 생기면 그 갈래의
            조항과 예시를 같은 변경 단위에서 더한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty_body:
                  value: { detail: "본문이 비어 있습니다" }
                too_long:
                  value: { detail: "현재는 20,000자 이하 문서만 변환할 수 있습니다" }
                unsupported_format:
                  value: { detail: "지원 형식: docx, pdf, hwpx, txt" }
                undecodable_text:
                  # 값의 정본은 `x-stored-text-domain.detail`이다. 여기 있는 것은 그 값의 예시이며,
                  # 계약 테스트는 두 자리가 같은지도 함께 본다 — 두 벌이 갈리면 오라클이 둘이 된다.
                  value: { detail: "문서 본문에 텍스트로 저장할 수 없는 문자가 있습니다" }
                missing_field:
                  value: { detail: [{ loc: ["body", "text"], msg: "Field required", type: "missing" }] }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

    # =========================================================================
    # #5 GET /documents — 200
    # 원본: app/api/documents.py::list_documents
    # =========================================================================
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 내 문서를 최신순으로 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        소유자 범위로만 조회한다. 총 개수는 싣지 않고 `has_more`로 다음 쪽 유무만
        알린다(전수 count는 목록 조회마다 비싸다).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: workspace_id
          in: query
          required: false
          description: 주면 그 작업 공간만 본다. 내 것이 아니면 404.
          schema:
            anyOf:
              - { type: string, format: uuid }
              - { type: 'null' }
      responses:
        '200':
          description: 문서 목록
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #6 DELETE /documents/{document_id} — 204
  # 원본: app/api/documents.py::delete_document
  # ===========================================================================
  /documents/{document_id}:
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: 문서와 변환 결과를 즉시 파기한다
      security: [{ HTTPBearer: [] }]
      description: |
        보존 기간(30일)을 기다리지 않는 즉시 파기 경로다(master-plan 3.2).
        복구 수단은 없다.

        **본문이 없다.** 지운 내용을 되돌려 주면 방금 파기한 문서를 다시 밖으로
        내보내는 셈이므로 삭제 확인은 상태 코드로만 한다.
        **캐시 금지 헤더는 붙는다** — 본문이 없어 캐시될 내용이 없다는 것은 사실이지만,
        2026-08-12 리더 판정으로 헤더 부착이 열거식 범위에서 전역 규칙으로 바뀌었다
        (`x-global-response-headers`). 종전 서술("붙이지 않는다")은 무효다.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: 파기됨. 본문 길이 0.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다 (403 아님 — 존재 자체를 숨긴다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "문서를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #16 GET /documents/{document_id}/source — 200
  # 원본 없음 — Python 참고 구현에 대응물이 없다(2.2.0 신설).
  # ===========================================================================
  /documents/{document_id}/source:
    get:
      tags: [documents]
      operationId: readDocumentSource
      summary: 추출된 원문을 다시 읽는다
      security: [{ HTTPBearer: [] }]
      description: |
        **검수 화면의 왼쪽 절반이다.** `DESIGN.md` §6.4가 원문과 AI 초안을 나란히 놓고
        비교하라고 정했는데, 원문은 문서 등록 시점 이후로 서버 응답에 실린 적이 없었다.
        그래서 붙여넣기 직후의 한 화면 밖(파일 업로드·기록 재진입·새로고침)에서는
        비교 대상 자체가 없었다. 이 오퍼레이션이 그 자리를 채운다.

        **`ConversionResponse`에 얹지 않고 경로를 새로 냈다.** 변환 조회는 완료를 기다리며
        폴링되는 자리라(2초 간격) 수천 자 본문을 매 폴링마다 실어 보내게 된다. 원문은
        문서 등록 시점에 확정되고 그 뒤 바뀌지 않으므로 **한 번만** 가져오면 된다.

        **여기 실리는 것은 파일에서 뽑아낸 텍스트다** — 원본 파일 바이트가 아니다.
        업로드 파일 자체를 내려받는 경로는 없고, 이 응답의 `char_count`는
        `DocumentListItem.char_count`와 같은 값이다(같은 열을 읽는다).

        **마스킹 전 개인정보가 실린다.** 저장된 원문은 사용자가 올린 그대로이고
        마스킹은 LLM에 넘기기 직전에만 적용된다 — 그래서 이 오퍼레이션이
        `x-private-response-headers.applies_to`에 있고 캐시 금지 헤더가 필수다.
        **새로 여는 표면은 아니다**: 같은 소유자에게
        `GET /conversions/{conversion_id}`가 이미 `masked_items[].original`로
        가려졌던 실제 값을 돌려주고 있으므로, 원문 조회는 그보다 넓은 범주를 열지 않는다.

        **보존 기간(30일)이 지난 문서는 파기 전이라도 404다.** 파기는 워커 배치가 실제로
        행을 지울 때 일어나므로 만료 시각과 다음 배치 사이에 창이 열리는데, 이 응답은
        **마스킹 전 문서 전문**이라 그 창에서 나가는 양이 다른 조회와 다르다 — 배치가 늦으면
        master-plan §3.2의 「30일 뒤 자동 삭제」가 가장 날것인 데이터에서 먼저 깨진다.
        그래서 **이 오퍼레이션만** 조회 질의에 만료 술어를 함께 건다(다른 조회의 처분은
        `docs/kotlin-redevelopment-backlog.md` §1.1의 추후 개선 항목이다).
        즉시 파기된 문서도, 남의 문서도, 없는 식별자도 **같은 404다** — 넷이 구분되지 않아야
        존재 여부가 드러나지 않는다.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 추출된 원문
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **보존 기간이 지났다** (403 아님 — 존재 자체를 숨긴다).
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "문서를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #7 GET /conversions/{conversion_id} — 200
  # #8 PUT /conversions/{conversion_id} — 200
  # 원본: app/api/documents.py::read_conversion, ::update_conversion
  # ===========================================================================
  /conversions/{conversion_id}:
    parameters:
      - name: conversion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documents]
      operationId: readConversion
      summary: 변환 상태와 결과를 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        **`masked_items[].original`에 가려졌던 실제 개인정보가 실린다** — 소유자 인증을
        통과한 조회에서만 나간다. 그래서 캐시 금지 헤더가 필수다.

        **보존 기간(30일)이 지난 문서의 변환은 파기 전이라도 404다.** 파기는 하루 한 번
        배치이므로(`RetentionPurgeScheduler`) 만료와 파기 사이의 창이 **최대 24시간**인데,
        이 응답은 그 창에서 실제 주민등록번호·카드번호를 평문으로 내준다 — 노출 크기는
        `GET /documents/{document_id}/source`보다 작아도 **범주는 같다.**
        완료(`done`) 전에는 `easy_text`·`edited_text`·`masked_items`가 비어 있고
        상태와 `failure_code`, 그리고 **형식 셋**(`source_format`·`export_format`·
        `format_preservation`)만 나간다 — 형식 셋은 변환 결과가 아니라 문서 메타에서
        오므로 완료 여부와 무관하다(`ConversionResponse` 설명).
      responses:
        '200':
          description: 변환 상태·결과
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "변환 결과를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [documents]
      operationId: updateConversion
      summary: 담당자 검수 수정본을 저장한다
      security: [{ HTTPBearer: [] }]
      description: |
        **AI 초안(`easy_text`)은 그대로 남는다.** 수정률 KPI(master-plan 7장)가 둘의
        차이를 재므로 초안을 덮어쓰면 기준선이 사라지고 되살릴 수 없다.

        아직 `done`이 아니면 **409**다 — 없는 것이 아니라 지금이 아닐 뿐이라는 뜻이며
        사용자가 취할 조치가 422와 다르다(기다렸다 다시).

        저장 전에 제어문자를 걷어낸 뒤 빈 값·길이를 판정한다 — "제어문자만 담긴
        수정본"이 빈 수정본과 같은 취급을 받아야 하고, XML(docx)이 담지 못하는 문자를
        저장해 두면 내보내기 시점에야 터지기 때문이다.

        **응답은 GET과 같은 스키마다** — 따라서 캐시 금지 헤더도 GET과 같다
        (api-contract-freeze §2.7 해결 1: 2026-08-11에 구현을 고쳐 계약으로 확정).

        **보존 기간이 지난 문서의 변환은 404다** — GET과 같은 판정이며, 쓰기라서 더 중요하다:
        파기 대상 문서에 새 검수본을 쓰면 다음 배치가 방금 쓴 내용을 지운다. 판정은 저장 전
        잠금 질의가 지므로 **아무것도 쓰이지 않는다.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionReviewRequest' }
      responses:
        '200':
          description: 저장됨 (갱신된 조회 결과)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다** (GET과 같은 판정).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 아직 완료되지 않은 변환이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 수정할 수 있습니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 수정본이 비었거나 20,000자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty: { value: { detail: "수정본이 비어 있습니다" } }
                too_long: { value: { detail: "수정본은 20,000자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #9 GET /conversions/{conversion_id}/export — 200 (파일)
  # 원본: app/api/documents.py::export_conversion
  # ===========================================================================
  /conversions/{conversion_id}/export:
    get:
      tags: [documents]
      operationId: exportConversion
      summary: 검수 완료 문서를 파일로 내려받는다
      security: [{ HTTPBearer: [] }]
      description: |
        **이 응답에서만** 마스킹 자리표시자가 원문으로 복원될 수 있다 — 담당자가
        그대로 배포할 최종 산출물이기 때문이다. 마스킹 선행 불변식의 유일한 예외이며,
        다른 어떤 경로도 복원본을 만들지 않는다.

        본문 선택 규칙: 검수본이 있으면 그것이 최종본이고, 없으면 AI 초안이다
        (`edited_text ?? easy_text`).

        복원 규칙: 검수본이 있을 때만 자리표시자를 원문으로 되돌린다. 검수 없는 초안은
        자리표시자를 그대로 둔다 — 모델이 자리를 옮기거나 위조 라벨을 넣어도 원문을
        주입하지 않기 위해서다. 검수본에서 자리표시자가 빠져 있어도 막지 않는다(최종
        판단은 담당자 몫 — HITL).

        **결과 형식은 서버가 원본에서 정한다** (2.0.0 — `DESIGN.md` §6.5 「들어온 형식
        그대로 나간다」). 규칙과 처분의 정본은 최상위 `x-export-format-derivation`이고
        여기서 옮겨 적지 않는다. 요약하면: `format`을 **생략하면** 서버가
        `mapping[source_format]`으로 정하고, 주면 그 값과 **같아야** 한다.
        그 값은 이 변환의 `ConversionResponse.export_format`과 언제나 같다.

        **PDF는 다르다 — 서버가 정하지 않고 사용자가 고른다** (2.6.0 재결정,
        `x-export-format-derivation.choices`). 원본이 PDF면 `export_format`이 `null`이고
        `export_format_choices`가 `[docx, hwpx]`다. `format`은 그 배열 안의 값이어야
        하고(생략은 409), 원본을 여닫지 않은 채 **고른 형식의 새 문서**를 조립해 내보낸다
        — 원본 서식을 반영하는 것이 아니므로 `format_preservation`은 언제나
        `not_applicable`이다.

        409가 나는 경우가 다섯이다:
          1. 아직 완료되지 않아 내보낼 결과가 없다
          2. 검수본이 없는데 자리표시자가 결과에서 사라졌다 — 그 자리의 정보가 통째로
             빠졌다는 뜻이라, 검수를 거치지 않은 초안을 그대로 배포하게 둘 수 없다.
          3. `format`이 이 변환의 원본이 정한 형식과 다르다 (`enforcement.on_mismatch`)
          4. **PDF 원본인데 `format`을 생략했다** (`enforcement.on_absent_with_choices`)
             — 서버가 대신 고르지 않는다. 「내보낼 형식을 골라주세요」가 이 갈래의 문구다.
          5. **PDF 원본인데 `format`이 `export_format_choices` 밖이다**
             (`enforcement.on_choice_mismatch`) — 값 집합(`ExportFormat`) 안이어도 이
             원본이 고를 수 있는 형식이 아니면 거절한다.

          PDF가 아닌 원본에는 4·5가 일어나지 않는다 — `export_format_choices`가 비어
          있으므로 `format`을 생략하면 그대로 1·2·3의 갈래를 지난다(2.0.0부터의 동작과
          같다). `choices`도 없는 원본이 생기면(오늘은 없다) 그때는 옛 `no_exportable_format`
          409가 어떤 `format` 값도·생략도 통과시키지 않는다
          (`enforcement.on_null_mapping`, `x-export-format-derivation.x-null-is-not-unknown`).

        **1·2와 3·4·5의 순서**: 형식 판정이 먼저다. 3·4·5는 기다려도 바뀌지 않는 사실이고
        1은 시간이 푸는 사실이라, 결국 거절될 요청에 「끝난 뒤에 다시 오라」고 답하면
        틀린 행동을 권하게 된다. 소유 판정(404)은 그 전부보다 먼저다.

        **원본 파일 바이트가 남아 있으면 그 원본을 고쳐서 내보낸다** (2.1.0 —
        `DESIGN.md` §6.5 「원본 문서의 문단, 표, 이미지 위치에 검수한 쉬운 글을
        반영합니다」). 새 문서를 만들지 않으므로 본문에 없던 것 — 이미지, 표, 머리말·
        꼬리말, 스타일, 쪽 나눔 — 이 그대로 남는다. 무엇이 유지되고 무엇이 달라지는지는
        **내려받기 전에** `ConversionResponse.format_preservation`이 말하고, 그 판정과 이
        오퍼레이션은 같은 코드를 지난다. **PDF는 이 갈래가 아니다** — 위에서 말했듯 원본을
        열지 않고 새 문서를 만든다.

        원본이 없는 문서(붙여넣기 · `document_originals` 표가 서기 전 업로드)는 예전처럼
        본문 문자열로 새 문서를 만든다. 그 갈래의 판정이 `not_applicable`이고 영구히 참이다.

        **보존 기간이 지난 문서의 변환은 404다** — 조회와 **같은 질의**가 그 판정을 지므로
        두 오퍼레이션이 갈릴 수 없다. 이 응답은 자리표시자가 원문으로 복원된 최종본이라
        만료 창에서 나가면 안 되는 값이다.

        **저장된 원본을 열 수 없으면 500이다.** 텍스트 전용 파일로 조용히 대체하지
        않는다(§6.5). 409가 아닌 이유: 업로드 때 같은 바이트가 파서를 지나갔으므로(그래야
        변환이 섰다) 지금 열리지 않는 것은 사용자가 고칠 수 있는 입력 문제도, 기다리면
        달라지는 상태도 아니라 **서버가 보관한 바이트의 문제**다. 그 변환의
        `format_preservation.status`는 같은 사유로 이미 `failed`다.
      parameters:
        - name: conversion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: false
          description: |
            **선택 파라미터다** (2.0.0에서 필수를 풀었다 —
            `x-export-format-derivation.enforcement`가 정본이다). PDF 원본은 예외다 —
            아래 참고.

            - **생략하면** 서버가 원본에서 정한다. 이것이 기본 경로다.
            - **주면** 이 변환의 `ConversionResponse.export_format`과 같아야 한다.
              값 집합 안이지만 다른 값이면 **409**다(422가 아니다 —
              `x-why-409-and-not-422`).
            - 목록에 없는 값(`pdf`·구버전 `hwp` 등)은 그대로 **422**다. **빈 값
              (`?format=`)도 여기다** — 값을 주지 않은 것이 아니라 목록에 없는 값을 준 것이다.

            **누락은 더 이상 422가 아니다.** 그 갈래는 폐기됐다(`x-superseded`) —
            되살리면 내보내기가 다시 「클라이언트가 형식을 고르는」 오퍼레이션이 된다.

            **PDF 원본(2.6.0)**: `ConversionResponse.export_format`이 `null`이라 위 규칙이
            적용되지 않는다. 대신 `export_format_choices`(`[docx, hwpx]`) 안의 값이어야
            한다 — **생략은 여기서도 409**다(서버가 대신 고르지 않는다), 배열 밖의 값 집합
            안 값(예: `txt`)도 409다.
          schema: { $ref: '#/components/schemas/ExportFormat' }
      responses:
        '200':
          description: |
            파일 바이트. 미디어 타입은 `format`에 따라 셋 중 하나다.
            `txt`의 `charset=utf-8`은 필수다 — 없으면 브라우저가 로캘 기본 인코딩으로
            열어 한글이 깨진다(BOM 없이 UTF-8로 내보내기 때문).
          headers:
            Content-Disposition:
              description: |
                `attachment; filename="easy-read.<ext>"; filename*=UTF-8''<percent-encoded>`

                ASCII 대체 이름과 RFC 5987 확장을 **둘 다** 보낸다. HTTP 헤더 값은
                latin-1만 담을 수 있어 한글 이름은 `filename*`에만 실린다.
                React `parseFilename`이 `filename\*=UTF-8''` 부분만 읽으므로 이 부분이
                빠지면 다운로드는 되고 파일명만 깨진다.
                **CORS `expose_headers`에 포함되어야 브라우저 JS가 읽을 수 있다.**

                **`filename*`의 이름은 `<문서 제목>-쉬운글.<ext>`다** (2.1.0 — `DESIGN.md`
                §6.5 「원본 제목을 기반으로 하되 `-쉬운글`을 덧붙여 원본 파일과 구분한다」).
                원본 서식을 유지해 내보내면 결과가 원본과 **같은 형식**이라, 표식이 없으면
                내려받기 폴더에서 원본과 결과를 가릴 수 없다. 제목이 정제 후 비면 표식 없이
                기본 이름 `쉬운 글.<ext>`다 — 구분할 원본 제목이 애초에 없다.
                `filename`(ASCII 대체)은 계산되지 않는 고정값 `easy-read.<ext>`로 남는다.

                **이 헤더는 `components/headers`로 옮기지 않는다** (2026-08-19 판정).
                값이 문서마다 계산되므로 그쪽 갈래가 요구하는 `schema.const`를 가질 수
                없고, 컴포넌트화하려면 "컴포넌트 갈래는 전부 `const`"라는 탐지 조항을
                약화시켜야 한다 — 탐지를 넓혀 닫은 자리를 구조 변경으로 되돌리는 셈이다.
                재사용처도 이 응답 하나뿐이라 컴포넌트가 줄여 줄 중복이 없다.
                인라인 갈래의 조용한 무시는 파서 쪽에서 fail-closed로 닫혔다.
              required: true
              x-filename-charset:
                ground: G2
                measured_on: "`filename*`의 퍼센트 디코딩 결과 — 인코딩된 표기가 아니라 사용자 파일 시스템에 닿는 이름"
                forbidden: '[\u0000-\u001F\u007F-\u009F"\\/:*?<>|]'
                check: |
                  **`filename*`을 퍼센트 디코딩한 값에 `forbidden`의 문자가 하나도 없다.**
                  대상은 제어문자 세 블록(C0·DEL·C1)과 경로 구분자·따옴표·윈도우 예약 문자다.
                  파일명의 바탕은 문서 제목이고 그 제목은 사용자가 적어 준 값이므로
                  (`x-title-policy` — 본문·파일 이름 유도는 폐기됐다) 그대로 쓰면
                  디렉터리를 벗어나거나 저장이 실패하는 이름이 되고, C1은 눈에 보이지
                  않으면서 일부 터미널·파일 관리자에서 제어 시퀀스로 해석된다.
                  퍼센트 인코딩은 이것을 막아 주지 않는다 — 인코딩은 전송만 안전하게 할 뿐
                  디코딩한 이름은 그대로 남는다.
                rationale: |
                  **왜 이 조항이 여기 새로 생겼나 (근거 G2).**
                  계획 §5 Phase 2의 종료 조건 "내보내기 파일명·`Content-Disposition` 생성
                  포팅"(원장 L348)이 요구하는 성질인데, 그 요구의 일부(C1 블록과 윈도우
                  예약 문자)가 **어느 단언에도 걸리지 않는다**는 것이 게이트 14의 F-3·F-4와
                  게이트 16 후속 R-1의 내용이었고, 마감이 "Phase 4 착수 전"이었다.
                  구현(`backend-kotlin/core/.../easyread/Export.kt`)은 이미 이 성질을
                  만족한다 — 없던 것은 **기계가 읽을 수 있는 오라클**이고, 그것이 없으면
                  경계 테스트가 금지 집합을 코드에 복제하게 된다(X-J2가 금지하는 형태).

                  **이 조항이 정하는 것은 나간 바이트뿐이다.** 어느 층에서 걷어내는지,
                  지우는지 공백으로 바꾸는지는 구현 판단이다. `forbidden`은 계약이
                  오라클이고 `Export.kt`의 집합은 구현이다 — 둘이 갈리면 경계 테스트가
                  빨강으로 알린다(그것이 이 조항을 계약에 두는 이유다).

                  **파일명 fixture 커버리지(F-3·F-4의 parity 몫)는 이 조항이 닫지 않는다.**
                  `.claude/skills/python-kotlin-parity/scripts/`의 손열거는 그 레인 소관이다.
                x-openapi-expressibility: |
                  JSON Schema의 `pattern`으로는 표현되지 않는다 — 제약이 헤더 값 전체가
                  아니라 **한 파라미터를 퍼센트 디코딩한 뒤의** 문자열에 걸리기 때문이다.
                  그래서 `schema` 키워드가 아니라 이 확장 절에 둔다
                  (`x-request-field-constraints.x-openapi-expressibility`와 같은 판단).
              schema:
                type: string
                examples:
                  - "attachment; filename=\"easy-read.docx\"; filename*=UTF-8''%EC%89%AC%EC%9A%B4%20%EA%B8%80.docx"
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            text/plain; charset=utf-8:
              schema: { type: string, format: binary }
            application/hwp+zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            내보낼 수 없는 변환이다 — 완료 전 · 자리표시자 유실 · 원본과 다른 형식 요청 ·
            선택지 있는 원본(PDF)에서 형식 생략·선택지 밖 요청 · 내보낼 형식 자체가 없음.
            여섯의 구분과 순서는 `description`에 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 내려받을 수 있습니다" } }
                missing_placeholders:
                  value: { detail: "변환에서 유실된 개인정보 표시가 있습니다 — 검수 화면에서 수정 후 내보내세요" }
                format_mismatch:
                  value: { detail: "원본과 같은 형식으로만 내려받을 수 있습니다" }
                export_format_choice_required:
                  value: { detail: "내보낼 형식을 골라주세요 (docx·hwpx)" }
                export_format_choice_mismatch:
                  value: { detail: "고를 수 있는 형식으로만 내려받을 수 있습니다" }
                no_exportable_format:
                  value: { detail: "이 문서는 내려받을 수 있는 형식이 없습니다" }
        '422':
          description: |
            `format`이 `ExportFormat` 밖의 값이다. **누락은 여기가 아니다** —
            생략은 2.0.0부터 기본 경로이고, 원본과 다른 값은 409다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #15 PUT /conversions/{conversion_id}/feedback — 200
  # 1.5.0 신설(2026-08-26). 파일럿 게이트 ① 판정 수단 — Python 참고 구현에 대응물이 없다.
  #
  # **번호는 자리가 아니라 id다.** 이 오퍼레이션은 목록 중간(#9 다음)에 놓이지만 번호는
  # 가장 큰 수를 잇는다 — 뒤 번호를 밀면 이 파일과 리뷰 기록이 이미 인용한 서수
  # (예: `x-stored-text-domain`의 「마감은 #8을 구현하는 단위다」)가 조용히 다른 것을
  # 가리키게 된다. 다시 세지 않고 안정 id를 주는 것이 게이트 28 P-5의 처방이다.
  # ===========================================================================
  /conversions/{conversion_id}/feedback:
    parameters:
      - name: conversion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [documents]
      operationId: saveConversionFeedback
      summary: 검수 담당자의 파일럿 피드백을 저장한다
      security: [{ HTTPBearer: [] }]
      description: |
        검수 화면 하단 폼의 제출을 받는다 — 배포 의향 · 품질 만족도 · 이번 건 소요 시간 ·
        자유 의견(선택). **게이트 ①의 유일한 수기 입력**이고 나머지 지표는 시스템이 남긴다
        (`docs/pilot-runbook.md` 「기록 방법」).

        **POST가 아니라 PUT인 이유: 한 변환의 피드백은 1건이고 다시 보내면 덮어쓴다.**
        자원이 변환당 하나로 정해져 있어 만드는 자리와 고치는 자리가 같고, 그것이 멱등
        upsert다. 같은 본문을 두 번 보내도 결과가 같아야 하는 것은 취향이 아니다 —
        폼 재제출·네트워크 재시도로 한 변환에 두 건이 쌓이면 게이트 ① 판정의 **분모**
        (10건)가 조용히 부풀고, 그 오염은 집계 시점에 되돌릴 수 없다.

        **아직 `done`이 아니면 409다** — `PUT /conversions/{conversion_id}`와 **같은 사유,
        같은 문구**다. 결과를 보지 않은 채 품질을 답할 수 없으므로 없는 것이 아니라 지금이
        아닐 뿐이고, 사용자가 취할 조치가 422와 다르다(기다렸다 다시).

        **`get`을 두지 않는다.** 재방문 시 이전 값을 폼에 되살리는 것은 이번 범위 밖이다.
        필요해지면 **같은 경로에 `get`을 더한다** — 다른 경로를 새로 만들지 않는다.

        **저장 수명이 문서와 분리돼 있다.** 문서·변환은 보존 기간이 지나면 파기되지만
        (`x-input-limits.retention_days`) 게이트 판정 근거는 그 뒤에 읽는다
        (`docs/pilot-runbook.md` 「집계」). 계약이 정하는 것은 이 오퍼레이션이 문서 파기
        뒤에도 의미를 갖는다는 것뿐이고, 저장 형태는 구현 판단이다.

        **그 분리는 「이미 낸 의견이 남는다」는 뜻이지 「만료 뒤에도 새로 낼 수 있다」는
        뜻이 아니다.** 두 문장을 섞어 읽지 마라 — **보존 기간이 지난 문서의 변환에는
        피드백을 낼 수 없다(404).** 이 저장은 수정률 지표를 계산하려고 변환 본문
        (`easy_text`·`edited_text`)을 **복호화해서 읽기** 때문이다. 만료 뒤에도 허용하면
        「30일 뒤 자동 삭제」(master-plan §3.2) 뒤에 본문 복호화가 계속 열려 있게 되고,
        그것은 2.3.0이 조회·내보내기·검수 저장을 닫은 것과 **같은 이유**다.
        이미 저장된 행은 그대로 남는다 — 닫히는 것은 **새 제출**뿐이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionFeedbackRequest' }
      responses:
        '200':
          description: |
            저장됨. 처음 낸 것이든 덮어쓴 것이든 **같은 200**이다 — 클라이언트가 두 경우를
            구분해서 할 일이 없고, 구분해 주면 "이미 냈는가"가 화면 분기로 새어 들어온다.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionFeedbackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다 — 위 `description`의 「분리」 문단이 그 사유다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "변환 결과를 찾을 수 없습니다" } }
        '409':
          description: 아직 완료되지 않은 변환이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 수정할 수 있습니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            필수 필드 누락은 **배열** detail(스키마 층)이고, 값 범위 밖·자유 의견 길이 초과는
            **문자열** detail(서비스 층)이다. 두 갈래의 경계는 `ValidationFailed`가 정본이며
            이 오퍼레이션이 새 경계를 만들지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                field_missing:
                  value: { detail: [{ loc: ["body", "publish_intent"], msg: "Field required", type: "missing" }] }
                score_out_of_range: { value: { detail: "품질 만족도는 1에서 5 사이의 값이어야 합니다" } }
                minutes_out_of_range: { value: { detail: "소요 시간은 0에서 600분 사이의 값이어야 합니다" } }
                comment_too_long: { value: { detail: "자유 의견은 500자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #10 GET /workspaces — 200
  # #11 POST /workspaces — 201
  # 원본: app/api/workspaces.py
  # ===========================================================================
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: 내 작업 공간을 만든 순서대로 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        **첫 번째 항목이 기본 작업 공간이다**(가장 먼저 만든 것). 이 순서가 계약이다 —
        Kotlin이 정렬을 바꾸면 업로드 기본 대상이 달라진다.
        문서 수(`document_count`)는 목록 응답에만 실린다.
      responses:
        '200':
          description: 작업 공간 목록
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: 작업 공간을 만든다
      security: [{ HTTPBearer: [] }]
      description: |
        이름은 제어문자를 걷어내고 앞뒤 공백을 턴 뒤 검사한다. 빈 이름·50자 초과는 422.
        상한을 넘는 이름은 자르지 않고 **거절한다** — 사용자가 직접 적은 이름을
        말없이 자르면 그 사람이 담은 뜻이 사라진다 — 사용자가 준 **문서 제목**을 255자에서
        자르는 것과 다른 판단이다(그쪽은 목록에 보일 이름일 뿐이라 업로드를 통째로
        실패시킬 이유가 없다. `x-title-policy`).
        같은 사용자 안에서 이름은 유일하다(`uq_workspaces_user_id_name`) — 중복은 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceNameRequest' }
      responses:
        '201':
          description: 생성됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 같은 이름의 작업 공간이 이미 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 이름이 비었거나 50자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty: { value: { detail: "작업 공간 이름을 입력해 주세요" } }
                too_long: { value: { detail: "작업 공간 이름은 50자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #12 PATCH /workspaces/{workspace_id} — 200 (PUT 아님)
  # #13 DELETE /workspaces/{workspace_id} — 204
  # 원본: app/api/workspaces.py
  # ===========================================================================
  /workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: 작업 공간 이름을 바꾼다
      security: [{ HTTPBearer: [] }]
      description: |
        **PUT이 아니라 PATCH다.** 바꾸는 것이 이름 하나뿐이라, 전체 표현을 보내는 PUT은
        클라이언트가 나머지 필드(만든 시각 등)까지 실어 보내야 한다는 뜻이 된다.
        메서드를 바꾸면 React `renameWorkspace`가 그대로 깨진다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceNameRequest' }
      responses:
        '200':
          description: 이름 변경됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '409':
          description: 같은 이름의 작업 공간이 이미 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 이름이 비었거나 50자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: 빈 작업 공간을 지운다
      security: [{ HTTPBearer: [] }]
      description: |
        **React에 호출부가 없다** — UI 범위 밖이라 의도적으로 비워 둔 것이다
        (`frontend/src/api/client.ts`의 `renameWorkspace` 주석, `app/api/workspaces.py`
        모듈 docstring). 계약에는 포함하되 Phase 6 타입 교체 후에도 호출 래퍼를
        추가하지 않는다.

        409가 나는 경우가 둘이다(계획 §2.3):
          1. 문서가 남아 있다 — 되돌릴 수 없는 파기를 "정리"라는 이름으로 실행하게
             두지 않고 무엇이 사라지는지 사용자가 먼저 보게 한다
          2. 마지막 남은 작업 공간이다 — 전부 지우면 업로드가 갈 곳을 잃고
             "기본 작업 공간"이라는 기준도 가리킬 대상이 없어진다

        **둘 다 해당하면 2(마지막 남은 작업 공간)를 낸다** — 2026-08-19 신설, 근거 G2.
        겹치는 상태(작업 공간이 하나뿐이고 그 안에 문서가 있다)는 드문 자리가 아니라
        **가입 후 문서를 올리고 두 번째 공간을 만들지 않은 모든 사용자**의 상태다.
        1을 먼저 내면 사용자는 안내대로 문서를 지운 뒤 **다시** 거절당하고, 그때는 1이
        막겠다고 적은 되돌릴 수 없는 파기가 **그 안내를 따랐기 때문에** 이미 일어난
        뒤다. 2를 먼저 내면 문서를 비워도 결과가 바뀌지 않으므로 사용자는 헛된 파기
        대신 새 작업 공간을 만드는 쪽으로 안내된다.
        계약이 침묵하면 두 순서가 다 허용되는데, 그중 하나가 이 조항이 지키겠다고 적은
        것을 정확히 깨뜨린다 — 그래서 침묵이 맞지 않다.
      responses:
        '204':
          description: 삭제됨. 본문 길이 0.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 문서가 남아 있거나 마지막 남은 작업 공간이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                has_documents:
                  value: { detail: "작업 공간에 문서가 남아 있습니다 — 먼저 비운 뒤 삭제해 주세요" }
                last_one:
                  value: { detail: "작업 공간은 적어도 하나 있어야 합니다" }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #14 GET /health — 200 (인증 불필요)
  # 원본: app/main.py::health
  # ===========================================================================
  /health:
    get:
      tags: [health]
      operationId: health
      summary: 서비스 생존 확인
      security: []
      description: |
        인증이 필요 없다. React 화면은 이 엔드포인트를 부르지 않는다.

        **캐시 금지 헤더는 붙는다.** 정본은 `x-global-response-headers`이며 그 절이
        **모든 응답**을 요구한다 — 이 엔드포인트도 예외가 아니다.
        (2026-08-20 정정, 근거 **G1**. 종전 문면은 *"캐시 금지 헤더도 붙지 않는다(실측 확인
        2026-08-12)"*였다. 그 실측은 같은 날 리더 판정으로 **요구가 뒤집히기 전**의 것이고,
        `x-global-response-headers.x-superseded`가 제외 목록을 이미 무효화했는데 이 산문만
        옛 문면을 들고 있었다. **재실측 2026-08-20**: 이 응답에 두 헤더가 실제로 실려 나간다.)

        **의존 서비스를 진단한다** (2026-08-12 개정, `x-change-policy` G2).
        현재 Python 구현은 상수 `{"status": "ok"}`만 돌려주어 DB·설정이 모두 죽어도
        200 ok가 나온다(`app/main.py::health`). 그것은 요구사항 미구현이지 계약이 아니다 —
        기동을 막지 않는 대신 `/health`로 배포 상태를 진단한다는 설계 의도가
        `app/api/deps.py` 주석에 이미 적혀 있는데, 진단하지 않는 헬스 체크는 그 의도를
        전혀 만족하지 못한다. **Kotlin은 진단하는 쪽으로 구현한다.**

        **항상 200이다. degraded여도 503을 내지 않는다.** 이 엔드포인트 하나가 liveness와
        readiness를 겸하기 때문이다 — 의존 서비스가 잠깐 죽었다고 503을 내면 오케스트레이터가
        멀쩡히 읽기를 처리하던 프로세스를 재시작시켜 장애를 키운다. 상태는 본문으로
        표현하고, 상태 코드는 "프로세스가 살아 있다"만 뜻한다.
        상태 코드를 바꾸는 변경은 배포 동작을 바꾸므로
        `x-change-policy.escalate_to_leader` 4번 항목이다.

        **응답에 진단 상세를 싣지 않는다.** 인증 없이 누구나 부를 수 있으므로 호스트명·
        포트·드라이버 버전·예외 메시지는 넣지 않는다. 의존 서비스 **이름과 up/down**까지다.

        **진단 대상에 Redis는 없다** (2026-08-20 정정, 근거 **G1**). 큐가 PostgreSQL lease
        테이블로 옮겨졌으므로 Redis는 이 런타임의 의존 서비스가 아니다 — 제품 코드 적중 0.
        `checks`의 `queue` 키는 **남는다**: 큐가 사라진 것이 아니라 **같은 DataSource 위의
        테이블**이 됐고, 「그 작업 테이블을 읽을 수 있는가」는 여전히 별개 진단이다.
        따라서 `database`와 `queue`는 **같은 배선을 공유한다** — 별도 Phase가 아니다.

        그 전까지 Kotlin이 확인 못 하는 의존 서비스는 `checks`에서 **키 자체를 생략**한다 —
        확인하지 않은 것을 `true`로 적으면 진단이 거짓말이 된다.

        **`database: false`인 응답은 제품 구성에서 도달 0이다 — 실측 2026-08-20.**
        DB가 도달 불가면 애플리케이션이 **기동하지 못하므로** 그 응답을 낼 프로세스가 없다
        (`x-retired-503-configurations`의 `datasource`가 그 측정이다). 그러므로 DB 축에서는
        `status: degraded`도 도달 0이다.

        **이 사실을 근거로 조항을 지우지 않는다.** DB 진단은 요구사항이 요구하는 것이고
        (`x-improvements` 판정 5), 도달 0인 것은 **기동 정책의 귀결**이다. 즉 고쳐야 할 곳이
        있다면 그것은 이 조항이 아니라 기동 정책이거나 진단 대상의 정의다. 그 처분은 배포
        동작을 바꾸므로 `x-change-policy.escalate_to_leader` 4번이며 **2026-08-20에 리더에게
        올렸다**(`docs/migration/_workspace/04_contract-keeper_p5-verdict.md` §7-2 ⑴).
        판정 전까지 이 조항은 그대로다.
      responses:
        '200':
          description: 프로세스 생존 (degraded 포함 — 상태는 본문으로 표현한다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

components:

  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. HS256 서명, 페이로드 클레임은
        `sub`·`exp`·`typ` 셋뿐이다. 자세한 계약은 최상위 `x-auth` 참고.

  headers:
    CacheControlNoStore:
      description: |
        `no-store`. 이 응답에는 개인정보 또는 자격증명이 실린다. 파일럿은 nginx가
        프론트와 API를 같은 호스트로 서빙하는 구성이라, 누군가 proxy_cache를 켜는
        순간 캐시된 사본이 소유자 검증 없이 다른 사용자에게 나갈 수 있다.
      required: true
      schema: { type: string, const: "no-store" }
    XContentTypeOptions:
      description: |
        `nosniff`. 브라우저가 내용을 보고 타입을 추측하지 않게 한다 — 사용자 본문이
        그대로 담긴 내려받기 파일이 스크립트로 해석되는 경로를 닫는다.
      required: true
      schema: { type: string, const: "nosniff" }
    WWWAuthenticateBearer:
      description: 401에 요구되는 표준 헤더. 클라이언트가 재인증 방식을 안다.
      required: true
      schema: { type: string, const: "Bearer" }

  responses:

    Unauthorized:
      description: |
        인증 실패. **균일성 요구의 정본은 `x-auth.failure_uniformity`다** — 사유 목록을
        여기 옮겨 적지 않는다. 종전 문면은 그 목록을 복사해 두었다가 정본과 갈렸고
        (무헤더 유무), 세 줄 뒤 "메시지는 두 가지"라는 **자기 반증**까지 안고 있었다
        (게이트 24 R-1, G1로 정정 2026-08-19).

        이 응답이 고정하는 것은 **문구가 두 갈래라는 구조**다.

        | 갈래 | `detail` | 균일화 대상 |
        |---|---|---|
        | `Authorization`이 없다 — 헤더 부재·스킴 불일치·토큰부 공백 | `"인증이 필요합니다"` | **아니다** |
        | 토큰·자격증명이 제시됐으나 유효하지 않다 | `"이메일 또는 비밀번호가 올바르지 않습니다"` | **그렇다**(정본 `x-auth.failure_uniformity`) |

        둘째 갈래 **안에서는** 실패 사유를 구분하지 않는다 — 만료·서명 위조·클레임
        누락·`typ` 용도 불일치·계정 삭제·이메일 부재·비밀번호 불일치가 전부 같은 401,
        같은 본문, 같은 헤더 집합으로 모인다. 어디서 실패했는지 알려주면 유효한 토큰
        형식을 탐색하는 단서가 된다.

        **무헤더가 균일화 대상이 아닌 이유**는 정본 조항에 있다 — 두 갈래를 가르는 것이
        서버의 비밀이 아니라 요청자가 스스로 만든 상태라서 정보 이득이 0이다.

        두 문구는 실측 확인했다(2026-08-12). 스킴 비교는 **대소문자를 가리지 않는다** —
        `bearer`로 보낸 요청을 「헤더 없음」으로 취급하면 갈래가 잘못 갈린다.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticateBearer' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            no_header: { value: { detail: "인증이 필요합니다" } }
            invalid_token: { value: { detail: "이메일 또는 비밀번호가 올바르지 않습니다" } }

    Conflict:
      description: 상태 충돌. 요청 자체는 올바르고 지금이 아닐 뿐이거나 이미 있다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            duplicate_email: { value: { detail: "이미 가입된 이메일입니다" } }

    PayloadTooLarge:
      description: |
        업로드 파일이 10MB를 넘었다.

        **계획 §2.2 목록에 없는 상태 코드지만 실재한다**(`UploadTooLargeError` →
        `413 CONTENT_TOO_LARGE`, app/api/errors.py). 형식·내용 문제(422)와 가르는
        이유는 사용자가 취할 조치가 "파일을 나눠 올리기"로 다르기 때문이다.
        회귀 테스트: `tests/api/test_documents.py::test_상한을_넘는_파일은_413`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            too_large: { value: { detail: "파일이 너무 큽니다 (최대 10MB)" } }

    UnsupportedMediaType:
      description: |
        요청 `Content-Type`이 그 오퍼레이션의 `requestBody.content` 키 집합 밖이다.
        **조항의 정본은 최상위 `x-unsupported-media-type`이다** — 대상 집합·`detail`의 출처·
        `Accept` 응답 헤더·미측정 팔·판정 대기 항목이 그 절 한 곳에 있다. 여기에 옮겨 적지 않는다.

        **422와 가르는 이유**: 422는 "본문의 값이 규칙을 어겼다"이고 415는 "그 형식을 아예
        받지 않는다"다. 사용자가 취할 조치가 다르다 — 앞은 값을 고치는 것이고 뒤는 **다른
        형식으로 보내는 것**이다. 지원 확장자 밖의 파일이나 추출 실패는 415가 **아니라**
        422다(`x-input-limits`) — 그쪽은 `Content-Type`이 아니라 본문 자체를 처리 못 하는 것이다.

        `detail`은 **상태 코드의 표준 사유 문구**이며 도메인 예외의 한국어 문구와 다른 규칙을
        따른다. 그 사유는 `x-unsupported-media-type.detail_source`에 있다 —
        **한국어로 바꾸는 것은 번역이 아니라 세 경로 균일성을 깨는 것이다.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    ValidationFailed:
      description: |
        입력 검증 실패. **Spring 기본값 400이 아니라 422다.**

        같은 422에 `detail`의 두 모양이 모두 나온다:
          - Pydantic/Bean Validation 층에서 걸리면 **배열**
          - 도메인 규칙에서 걸리면 **문자열**

        배열 항목에는 `loc`·`msg`·`type`만 있다. `input`·`ctx`는 금지 —
        비밀번호가 응답 본문과 액세스 로그에 남는 경로다.

        **어느 모양이 나오는지는 구현 재량이 아니라 계약이다.** 경계는 이렇다:

          - **배열** — 필드 누락 · **JSON 원시 타입 불일치**(문자열 자리에 숫자·객체 등) ·
            enum 밖 값, 그리고 스키마에 실제로 제약이 선언된 쿼리 파라미터(`limit`·`offset`)
          - **문자열** — 요청 본문 필드의 길이·형식·빈 값 규칙 **전부**.
            정본은 `x-request-field-constraints`이며 그 다섯 필드에는 `maxLength`/
            `minLength`가 **의도적으로 없다**

        **「타입 불일치」는 JSON 원시 타입까지다** (2026-08-23 신설, 근거 **G4**).
        문자열로 실려 온 값이 대상 타입으로 **변환되지 않는 것**(UUID·날짜 등 형식 위반)은
        배열이 아니라 **문자열** 갈래다 — 그것은 「형식 규칙」이고, 종전 문면은 이 자리에서
        두 줄이 서로 다른 답을 가리켜 **양쪽을 동시에 만족시킬 수 없었다.** 역직렬화기가
        이 실패를 자기 어휘로 「타입 불일치」라 부르는 것은 구현 사정이지 계약의 경계가 아니다.
        대표 자리는 `POST /documents`의 `workspace_id` 형식 오류이며, 그 오퍼레이션의 422
        서술이 이미 문자열이라고 적고 있다 — 이 문단은 그 답을 일반화한 것이지 새 값이 아니다.

        **이 경계는 전송 팔을 가리지 않는다.** 한 오퍼레이션이 JSON과 multipart를 모두 받아도
        같은 결함이면 같은 모양이 나간다. `detail`의 모양을 가르는 축은 **걸린 규칙의 종류**이고
        요청을 어떤 미디어 타입으로 보냈는가는 그 축에 없다 — 팔마다 갈리면 클라이언트가
        같은 실수에 두 가지 화면 문구를 받는다.

        길이 위반을 Bean Validation(`@Size`·`@NotBlank`)으로 구현하면 배열이 나가고
        문구가 영문으로 바뀌어 **계약 위반**이다. 상태 코드가 같아 눈에 띄지 않으므로
        contract test가 `detail`의 **타입까지** 단언한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            field_missing:
              value: { detail: [{ loc: ["body", "password"], msg: "Field required", type: "missing" }] }
            query_range:
              value: { detail: [{ loc: ["query", "limit"], msg: "Input should be greater than or equal to 1", type: "greater_than_equal" }] }
            domain_rule:
              value: { detail: "이메일 형식이 올바르지 않습니다" }

    InternalError:
      description: |
        서버 오류. 두 가지 고정 문구가 있고 **예외 내용을 그대로 노출하지 않는다**.
          - 매핑되지 않은 도메인 예외 → `"요청을 처리하지 못했습니다"`
          - 도메인 밖 예외(라이브러리 오류 등) → `"서버 오류가 발생했습니다"`
          - `StorageError`(코드 버그) → 저장소가 만든 고정 문자열
        미처리 예외(둘째 줄)에 CORS 헤더가 붙는지는 런타임에 따라 다르다 — Python은
        구조적으로 못 붙이고 Kotlin은 붙인다. **의도된 차이**이며 상태 코드와 본문은
        같다(최상위 `x-cors.x-unhandled-500-cors`가 정본).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            unmapped_domain: { value: { detail: "요청을 처리하지 못했습니다" } }
            unexpected: { value: { detail: "서버 오류가 발생했습니다" } }
            storage: { value: { detail: "저장된 변환 결과를 읽을 수 없습니다" } }
            storage_original: { value: { detail: "저장된 원본 파일을 읽을 수 없습니다" } }

    # BadGateway(502)는 2026-08-20에 **폐기**됐다. 되살리기 전에 `x-retired-responses`를 읽어라 —
    # 어느 오퍼레이션도 502를 선언하지 않는다는 것이 지금의 조항이고, 그것을 재는 단언이 있다.

    ServiceUnavailable:
      description: |
        운영 설정 문제(`ConfigurationError`). 사용자 잘못이 아니다.
        **이 상태가 되는 구성은 하나뿐이다.**
          - **JWT 서명 키 미설정 또는 32바이트 미만 → 인증이 필요한 모든 요청**
            (인증 API 셋만이 아니다 — 보호 자원 전체가 같은 인증 경로를 지난다.
            그래서 `ServiceUnavailable`을 인증이 걸린 모든 오퍼레이션이 선언한다.)

        **기동을 막지 않는 것은 이 줄뿐이다.** 서명 키가 비어도 앱은 뜬다(실측 2026-08-20:
        키를 주지 않은 채 기동 → `/health` 200). 그래야 `/health`로 배포 상태를 진단할 수
        있으므로, 그 설정이 필요한 요청만 503이 된다. 401로 감추지 않는 것도 조항이다:
        배포 사고가 "사용자가 토큰을 잘못 냈다"로 둔갑하면 안 된다.

        **다른 오설정은 기동을 막는다** — 저장 암호화 키(2026-08-19 리더 판정)와
        DataSource(2026-08-20 실측)가 그렇다. 그래서 한때 이 목록에 있던 구성 셋이
        내려갔다: **`queue` · `cipher` · `datasource`**.

        **내려간 것의 사유·근거·되살릴 조건은 `x-retired-503-configurations`가 정본이다.**
        이 자리에 두 벌로 적지 않는다 — 이 컴포넌트를 **인증이 걸린 오퍼레이션 전부**가
        선언하므로 사유를 여기 두면 그 모든 자리가 그것을 인용하게 된다.
        (수를 적지 않는 이유는 오퍼레이션이 늘 때마다 산문이 갈리기 때문이다 — 게이트 28 P-5.) **서수로 부르지 않는다**: 그 절의 `id`로만
        가리킨다(서수를 버린 사유는 그 절 머리 주석에 있다 — 게이트 28 P-5).

        **그래서 `POST /documents`의 503은 어디서 오는가**: 위 유일한 줄, 곧 **인증 경로**다.
        업로드 고유의 503 구성은 **없다** — 저장 암호화가 없는 배포는 뜨지 않고, 큐는
        배선이라는 것을 갖지 않으며, DB가 없는 배포도 뜨지 않는다. 큐 등록이 **실패**하는
        것은 구성 문제가 아니라 실행 실패이고 그때는 500이다(`POST /documents` 설명).
        **DB 장애도 503이 아니다** — 제품 구성에서는 응답이 아예 없고(기동 실패), 강제로
        띄운 구성에서는 500이었다(`x-retired-503-configurations`의 `datasource`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            no_jwt: { value: { detail: "인증이 설정되지 않았습니다" } }
            short_secret: { value: { detail: "인증 서명 키는 32바이트 이상이어야 합니다" } }

  schemas:

    # ---------------------------------------------------------------------
    # 오류 본문 — 계약의 핵심
    # ---------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [detail]
      additionalProperties: false
      description: |
        모든 오류 응답의 유일한 모양. 최상위 키는 `detail` 하나뿐이다.

        **"모든"의 범위는 최상위 `x-error-body-universality`가 정본이다** — 전역 예외
        매퍼를 거친 응답만이 아니라 `sendError` → `/error` 디스패치와 컨테이너 생성
        응답까지다. 이 스키마는 **모양**을 정의할 뿐 **어느 응답에 적용되는지**를 정하지
        못한다(OpenAPI 문법의 한계). 2026-08-12 실측에서 `/error` 경로가 Spring
        `BasicErrorController` 기본 본문(`timestamp`·`status`·`error`·`path`)을 내는 것이
        확인됐고, 그것은 `additionalProperties: false`와 `required: [detail]` 양쪽 위반이다.
      properties:
        detail:
          description: |
            **문자열 또는 객체 배열의 union이다.** 이 union이 계약의 핵심이며,
            한쪽만 구현하면 React가 폴백 문구만 보여 준다.
          oneOf:
            - type: string
              description: 도메인 예외의 한국어 사용자 문구
            - type: array
              description: 입력 검증 실패 항목 목록
              items: { $ref: '#/components/schemas/ValidationErrorItem' }

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      additionalProperties: false
      description: |
        검증 실패 항목. **`input`·`ctx`를 넣지 않는다** — FastAPI 기본 핸들러는
        넣지만 `_handle_request_validation`이 걷어낸다. 비밀번호가 응답 본문과
        액세스 로그에 그대로 남는 경로이기 때문이다.
        `loc`의 원소는 현행 구현에서 전부 **문자열**이다(배열 인덱스도 `str()`로
        변환된다 — FastAPI 자동 생성 스키마의 `string | integer`와 다르다).
      properties:
        loc:
          type: array
          items: { type: string }
          examples: [["body", "password"]]
        msg: { type: string, examples: ["Field required"] }
        type: { type: string, examples: ["missing"] }

    # ---------------------------------------------------------------------
    # 값 집합 — enum으로 고정한다
    # ---------------------------------------------------------------------
    ConversionStatus:
      type: string
      enum: [pending, processing, done, failed]
      description: |
        변환 상태. DB CHECK 제약(`ck_conversions_status_valid`)과 **같은 값 집합**이며
        소문자 4개뿐이다.

        **백엔드 Pydantic은 이 필드를 `str`로 선언해 FastAPI 자동 생성 스키마에
        `string`으로만 나온다.** React는 4값 리터럴 union으로 좁혀 놓았으므로,
        계약 파일이 enum으로 고정하지 않으면 Phase 6에서 생성 타입이 자유 문자열로
        넓어져 **현재보다 타입 안전성이 떨어진다**. 교체가 퇴보가 되면 안 되므로
        여기서 enum으로 고정한다(계획 §2.2 "변환 상태 유지"의 이행).

    ExportFormat:
      type: string
      enum: [docx, txt, hwpx]
      description: |
        내보내기 형식. 값이 그대로 확장자이자 쿼리 파라미터 값이다.
        `pdf`와 구버전 `hwp`(바이너리)는 Lean MVP 범위 밖이며 목록에 없는 값은 422다.

        **`pdf`를 여기 더하지 않는다** (2026-08-26 재확인). PDF 렌더러가 없고
        `GET /conversions/{conversion_id}/export?format=pdf`는 오늘 422다
        (`docs/pilot-runbook.md`도 PDF를 범위 밖으로 적는다). 값을 먼저 넣으면 계약이
        없는 기능을 약속한다. 원본이 PDF인 변환의 `ConversionResponse.export_format`이
        `null`인 것이 이 부재를 응답에서 말하는 방법이다.

    SourceFormat:
      type: string
      enum: [text, docx, pdf, hwpx, txt]
      description: |
        문서가 **어디서 왔는가**. 붙여넣기는 `"text"`, 파일은 소문자 확장자다.

        **enum으로 고정한다** (2026-08-12 개정, `x-change-policy` G1).
        초판은 "자유 문자열이라 좁히면 파괴적"이라고 적었으나 사실이 아니었다 —
        값 집합은 이미 닫혀 있다. 저장 값은 업로드 확장자를 소문자화한 것이지만 그 유도는
        추출기가 지원 형식(`docx`·`pdf`·`hwpx`·`txt`)만 통과시킨 **뒤에** 일어나고, 붙여넣기는
        상수 `text`다. 그 밖의 값이 나올 경로가 없다(Kotlin `core/document/SourceFormat.kt`).
        지원 형식을 늘리면 이 enum과 `x-input-limits.supported_upload_formats`를
        같은 변경 단위에서 함께 늘린다(추가는 비파괴).

        **1.6.0에서 `DocumentListItem.source_format`의 인라인 enum을 여기로 옮겼다.**
        `ConversionResponse.source_format`이 **같은 값 집합**을 쓰기 때문이고, 인라인으로
        두 번 적으면 그 순간 값 집합이 두 벌이 된다 — 한쪽만 늘어나는 날이 온다.
        독립 컴포넌트로 두는 둘째 이유는 `ConversionStatus`·`PublishIntent`와 같다:
        React 생성 타입이 **이름으로 부르는 union**이어야 화면 코드가 문자열 리터럴을
        자기 자리에 복제하지 않는다. 값 집합은 옮기기 전과 **한 글자도 다르지 않다.**

        **`txt`는 2.4.0에서 더했다** — `text`(붙여넣기)와는 다른 값이다. 다른 축은 **원본
        바이트의 유무가 아니라 수집 경로**다: `text`는 붙여넣기라 애초에 파일이 없고,
        `txt`는 업로드된 파일이라 요청 시점에는 바이트가 있다 — 다른 세 업로드 형식과 같은
        디코딩 단계를 거친다(`x-input-limits.txt_encoding_policy`).

        **둘 다 `document_originals`에 행을 남기지 않지만, 이유는 다르다** (2.5.1에서 이
        문단을 정정했다 — 종전 문구는 "바이트가 있으면 저장한다"로 읽혔는데 사실이
        아니었다). `text`는 파일이 아니었으므로 저장할 원본 바이트가 처음부터 없고
        (아래 `FormatPreservationStatus` `not_applicable` ⑴), `txt`는 파일이지만 평문에는
        반영할 서식 구조가 없어(글꼴·표·머리말 같은 것이 없다) 바이트를 저장해도 쓸 데가
        없다(같은 상태 ⑶). 저장 여부를 가르는 것은 바이트의 유무가 아니라 **반영할 서식
        구조가 있는지**다(`x-export-format-derivation.mapping`).

    FormatPreservationStatus:
      type: string
      enum: [not_applicable, available, partial, failed]
      description: |
        원본 서식 유지 상태.

        - `not_applicable` — **유지할 원본 서식이 없다.** 네 갈래가 여기 든다:
          ⑴ 붙여넣기(`source_format: text`) — 파일이 아니었으므로 서식이 애초에 없다.
          ⑵ 원본 파일 바이트가 저장돼 있지 않은 문서 — `document_originals` 표가 서기
             전(2026-08-26 이전)에 업로드된 문서가 그렇다. 그 바이트는 파싱 직후 사라졌고
             다시 만들 수 없으므로 이 판정은 앞으로도 바뀌지 않는다.
          ⑶ 업로드된 평문(`source_format: txt`, 2.4.0) — 파일은 맞지만 평문에는 애초에
             유지할 서식이 없다(굵기·글꼴·표·머리말 같은 구조가 없다). ⑴과 사유가 같으므로
             `document_originals`에 원본을 남기지 않는다 — 남겨도 반영할 대상이 없다.
          ⑷ PDF(`source_format: pdf`, 2.6.0) — 원본 파일 바이트는 저장돼 있을 수 있지만
             **반영할 대상 자체가 없다.** 사용자가 `export_format_choices` 중 하나를 골라
             그 형식의 **새 문서**로 조립해 받는다(`x-export-format-derivation.choices`) —
             원본 구조를 여닫지 않으므로 판정할 「짝」이 없다. ⑵와 사유가 다르다 — 바이트가
             없어서가 아니라 반영이라는 개념 자체가 이 갈래에 적용되지 않는다.
          네 갈래 모두 **영구히 참**이고, **완료 전에도** 이 값이 즉시 선다 — 짝지을
          검수본을 기다릴 이유가 없다(아래 `format_preservation: null`의 조건 ⑴ 참고).
        - `available`(「유지 가능」) — **원본 구조 그대로 나간다.** 원본의 본문 단위
          하나하나에 검수본 문단 하나씩이 들어가고(수가 정확히 같다), 원본 문구가 남는
          머리말·꼬리말도 없다. 짝이 하나라도 어긋나면 이 값이 아니다.
        - `partial`(「일부 유지」) — **일부는 달라진다.** 무엇이 얼마나 달라지는지
          `FormatPreservation.details`가 개수로 말한다. 세 갈래가 이 값을 만든다:
          머리말·꼬리말이 원본 문구로 남는다 / 반영할 문단이 없어 비워지는 원본 문단이
          있다 / 원본에 자리가 없어 본문 끝에 덧붙는 문단이 있다.
        - `failed`(「서식 유지 실패」) — **같은 형식으로 다시 만들 수 없다.** 저장된 원본을
          열 수 없다는 뜻이고, `GET /conversions/{conversion_id}/export`도 같은 사유로
          **500**이다. §6.5: "서식을 유지할 수 없을 때 텍스트 전용 파일로 조용히 대체하지
          않는다" — 그 금지를 지키는 방법이 이 값과 그 500이다.

        **`checking`(「서식 확인 중」)은 이 집합에 없다.** 1.6.0이 뺀 사유가 그대로
        유효하다: 이 판정은 **조회 한 번 안에서 동기로 끝난다.** 클라이언트가 지켜볼 진행
        상태가 없으므로, 내보내면 끝나지 않을 스피너를 약속하게 된다. 판정에 필요한
        검수본이 아직 없는 동안(완료 전)은 이 enum의 값이 아니라
        `ConversionResponse.format_preservation: null`이다.

    FormatPreservation:
      type: object
      required: [status, details]
      description: |
        원본 서식 유지 상태와, 사용자에게 보여 줄 영향 항목.
        `ConversionResponse.format_preservation`이 `null`이면 **서버가 판정하지 않았다**는
        뜻이다 — 그 사유는 그 필드 쪽에 적혀 있다.
      properties:
        status: { $ref: '#/components/schemas/FormatPreservationStatus' }
        details:
          type: array
          items: { type: string }
          description: |
            사용자에게 그대로 보여 줄 **영향 항목** 문구 목록. 예를 들어 「복잡한 표 1개는
            단순 표로 바뀔 수 있습니다」 같은 문장이 여기 든다(§6.5).

            **개인정보도 문서 본문도 담지 않는다.** 담을 수 있는 것은 구조 요소의 종류와
            개수뿐이며, 그 규칙은 `missing_placeholders`가 라벨만 싣는 것과 같은 판단이다.
            구현에서 이 문구들은 **고정 문장 + 개수**로만 만들어진다 — 문서에서 읽은
            문자열이 끼어들 형식 인자가 하나도 없다(Kotlin
            `core/document/FormatPreservation.kt`).

            `available`과 `not_applicable`에서는 **빈 배열**이다 — 알릴 영향 항목이 없다.
            `null`이 아니라 `[]`인 것은 `masked_items`와 같은 규칙이다.
            `partial`·`failed`에서는 비어 있지 않다: 「일부」라고 말해 놓고 무엇이
            달라지는지 말하지 않으면 사용자가 취할 행동이 없다.

    # ---------------------------------------------------------------------
    # auth
    # ---------------------------------------------------------------------
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          x-service-constraint: { max_length: 255, measured_on: normalized }
          description: |
            공백 제거 + 소문자로 정규화한 뒤 **그 결과의** 길이(≤255)와 형식을 검사한다.
            위반은 422 **문자열** detail이다.
            **`maxLength`를 쓰지 않는다** — 스키마 키워드는 원시 값에 걸려 정규화로 줄어드는
            입력을 잘못 거절하고, 오류 모양도 배열로 바뀐다(`x-request-field-constraints`).
          examples: ["user@example.test"]
        password:
          type: string
          x-service-constraint: { min_length: 8, measured_on: raw }
          description: |
            최소 8자. 상한은 두지 않는다(argon2는 입력 길이에 비용이 좌우되지 않는다).
            원시 값으로 재지만 판정은 **서비스 층**이라 위반은 422 **문자열** detail이다 —
            경계가 스키마와 같아도 오류 모양이 다르므로 `minLength`를 쓰지 않는다.
            **이 값은 응답 본문·로그 어디에도 반향되지 않는다.**

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, examples: ["user@example.test"] }
        password: { type: string }

    UserResponse:
      type: object
      required: [id, email]
      description: 사용자 공개 표현. `password_hash`는 절대 포함하지 않는다.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, examples: ["user@example.test"] }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      description: |
        `token_type`은 Pydantic 기본값 `"bearer"`가 있어 FastAPI 자동 생성 스키마에서
        `required`가 아니지만 **응답에는 항상 실린다**. React도 필수로 다루므로
        계약에서는 필수로 고정한다.
      properties:
        access_token: { type: string, description: HS256 JWT }
        token_type: { type: string, const: "bearer" }
        expires_in:
          type: integer
          description: |
            유효 기간(초). 클라이언트가 토큰을 디코딩해 `exp`를 읽지 않고도 재발급
            시점을 안다. 현재 기본값 3600(60분).
          examples: [3600]

    # ---------------------------------------------------------------------
    # documents
    # ---------------------------------------------------------------------
    DocumentTextRequest:
      type: object
      required: [text]
      description: |
        붙여넣기 업로드 요청 (JSON 모드).
        **FastAPI 자동 생성 OpenAPI에는 이 스키마가 등장하지 않는다** — 라우터가
        `Request`를 직접 읽기 때문이다. 라우터 코드를 읽고 손으로 적었다.
      properties:
        text:
          type: string
          x-service-constraint: { max_length: 20000, measured_on: raw }
          description: |
            공백만 있으면 422("본문이 비어 있습니다").
            20,000자 초과도 422. **바이트가 아니라 문자 수**로 잰다 — 한국어는 UTF-8에서
            글자당 3바이트라 바이트 기준이면 실제 분량의 1/3에서 잘린다.
            둘 다 **서비스 층** 판정이라 422 **문자열** detail이다(`maxLength` 미사용 사유는
            `x-request-field-constraints`). ⚠ 이 필드는 `edited_text`와 달리 **원시 길이**로
            잰다 — 그 비대칭은 미결이다(같은 절 `x-open-asymmetry`).
            길이와 **별개의 축**으로 **정의역**이 걸린다 — 텍스트로 왕복하지 않는 값은
            길이와 무관하게 422다(`x-stored-text-domain`).
        title:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            생략하면(또는 정제 후 남는 것이 없으면) **고정 문구 `제목 없음`**이다.
            **본문 첫 줄에서 유도하지 않는다** (2026-08-20 사용자 결정, `x-change-policy` G3).
            유도된 제목은 봉인된 원문의 조각을 평문 열 `documents.title`에 복제해
            **암호화를 우회**하고, 업로드 시점에는 마스킹이 돌지 않아 **마스킹도 우회**한다 —
            얻는 것은 목록 화면의 편의뿐이다. 정본과 전문은 **`x-title-policy`**.
            사용자가 준 제목은 255자까지 자르기만 하고 거절하지 않는다.
            **파일명은 제목으로 쓰지 않는다** — 파일명 자체가 개인정보일 수 있다.
            (이 개정은 그 금지를 **강화한다**: 파일명도 본문도 쓰지 않는다.)
        workspace_id:
          anyOf: [{ type: string, format: uuid }, { type: 'null' }]
          description: |
            생략하거나 `null`이면 기본(가장 먼저 만든) 작업 공간. 빈 문자열도 미지정과 같다.
            남의 것이면 **404**(403 아님 — 빈 목록으로 답하면 남의 작업 공간 존재를 확인하는
            수단이 된다).

            UUID 형식이 아니면 **422**이고 `detail`은 **문자열**
            `"작업 공간 식별자 형식이 올바르지 않습니다"`다 — **값 자체는 메시지에 담지 않는다.**
            **multipart 팔(`DocumentFileRequest.workspace_id`)과 같은 규칙이며**, 이 문장은
            그 대칭을 복기한다(2026-08-23, 근거 **G4** + G1). 종전에는 같은 규칙이 파일 모드
            쪽에만 적혀 있었고, 그 비대칭에서 JSON 팔이 배열 `detail`을 내는 결함이 실제로
            생겼다 — 오퍼레이션 수준 422 서술이 두 팔 모두에 걸린다는 것이 **이미** 계약이었다.

            **`format: uuid`는 주석이지 강제 지점이 아니다.** 이 형식 검사는 서비스 층에
            있고(`x-request-field-constraints`가 다섯 필드에 대해 판정한 것과 같은 구조),
            역직렬화 층에서 재면 배열 `detail`이 나가 위 문장을 위반한다. 검사가 놓이는
            **순서**는 `paths./documents.post.description`이 정한다 — 형식은 소유권의
            선결이므로 같은 단계이고 크기·추출·본문 길이보다 **뒤다.**

    DocumentFileRequest:
      type: object
      required: [file]
      description: |
        파일 업로드 요청 (multipart/form-data 모드).
        **FastAPI 자동 생성 OpenAPI에는 이 요청 본문이 없다** — 손으로 적었다.
        React `createDocumentFromFile`은 `file`과 `workspace_id`만 보낸다.
      properties:
        file:
          type: string
          format: binary
          description: |
            docx · pdf · hwpx (확장자 대소문자 무시). 10MB 초과는 413,
            그 밖의 형식·추출 실패는 422.
            파트가 없거나 파일이 아니면 422("업로드할 파일(file)이 필요합니다").
        title:
          type: string
          description: |
            폼 값은 전부 문자열이다. 생략하면(또는 정제 후 남는 것이 없으면)
            **고정 문구 `제목 없음`**이다 — **추출한 본문에서도, `file` 파트의 파일 이름에서도
            유도하지 않는다** (2026-08-20 사용자 결정, `x-change-policy` G3).
            **파일명은 제목으로 쓰지 않는다** — 파일명 자체가 개인정보일 수 있고
            (`홍길동_주민등록등본.docx`), 본문 첫 줄은 암호화와 마스킹 두 방어를 우회한다.
            붙여넣기 모드와 **같은 규칙이다**. 정본과 전문은 **`x-title-policy`**.
        workspace_id:
          type: string
          format: uuid
          description: |
            빈 문자열은 미지정과 같게 다룬다. UUID 형식이 아니면 422
            ("작업 공간 식별자 형식이 올바르지 않습니다") — **값 자체는 메시지에 담지 않는다.**

    DocumentCreatedResponse:
      type: object
      required: [document_id, conversion_id, status, char_count]
      description: 업로드 접수 응답. 변환은 아직 시작되지 않았다(202).
      properties:
        document_id: { type: string, format: uuid }
        conversion_id:
          type: string
          format: uuid
          description: '`Location` 헤더의 값과 같은 식별자여야 한다.'
        status: { $ref: '#/components/schemas/ConversionStatus' }
        char_count:
          type: integer
          description: 공백 포함 문자 수. 크레딧 환산(1,000자 = 1크레딧)의 기준값이다.

    MaskedItemResponse:
      type: object
      required: [category, placeholder, original]
      description: |
        검수 화면에 보여줄 마스킹 항목.
        **`original`은 가려졌던 실제 개인정보다** — 소유자 인증을 통과한 조회에서만
        실린다. 이 필드가 있기 때문에 조회·검수 응답에 캐시 금지 헤더가 필수다.

        **마스킹 범주는 2종뿐이다** (2026-08-12 사용자 결정 — `x-change-policy` G3).
        주민등록번호·카드번호만 가린다. 전화번호·이메일·계좌번호는 **가리지 않는다** —
        공공기관 안내문에는 담당 부서 연락처처럼 가려서는 안 되는 값이 본문에 그대로
        들어가고, 그것을 자리표시자로 바꾸면 안내문의 쓸모가 사라진다.
        고유식별정보(주민등록번호·외국인등록번호)와 금융 식별자(카드번호)만 남긴다.
      properties:
        category:
          type: string
          enum: ["주민등록번호", "카드번호"]
          description: |
            **한국어 값이다.** `MaskCategory` StrEnum의 값이 그대로 실린다 —
            `"rrn"`·`"phone"` 같은 영문 코드가 아니다. React `ReviewEditor`가 이 값을
            표에 **그대로 렌더링**하므로(`<td>{item.category}</td>`) 값 자체가 화면 문구다.
            초판 스펙의 예시 `"phone"`은 어떤 구현에서도 나오지 않는 값이었다
            (`x-change-policy` G1로 정정, 2026-08-12).
        placeholder:
          type: string
          pattern: '^\[\[(주민등록번호|카드번호)[0-9]+\]\]$'
          examples: ["[[주민등록번호1]]"]
          description: |
            `[[<범주><n>]]` 형식. `n`은 **범주별** 1부터의 일련번호다(전역 카운터가 아니다).
            자리표시자는 값이지 표기 형식이 아니다 — 형태·번호·개수가 달라지면
            내보내기 시 원문 복원이 어긋난다.
        original: { type: string, description: 실제 개인정보 (합성 예시 없음 — 문서에 예시를 적지 않는다) }

    ConversionReviewRequest:
      type: object
      required: [edited_text]
      properties:
        edited_text:
          type: string
          x-service-constraint: { max_length: 20000, measured_on: normalized }
          description: |
            제어문자를 걷어낸 뒤 **그 결과로** 빈 값·길이를 판정한다. 원문과 **같은 20,000자
            상한**을 쓴다 — 검수는 초안을 다듬는 자리이지 새 문서를 쓰는 자리가 아니다.
            먼저 걷어내는 이유는 docx(XML)가 담지 못하는 문자를 저장해 두면 **내보내기
            시점에** 터져 사용자가 원인을 알 수 없는 500을 받기 때문이다.
            위반은 422 **문자열** detail이며, 그래서 `maxLength`를 쓰지 않는다 — 스키마
            키워드는 정규화 전 원시 값에 걸린다(`x-request-field-constraints`).
            이 필드도 봉인해 저장하므로 **정의역**이 함께 걸린다(`x-stored-text-domain`) —
            길이와는 다른 축이고, 그 팔의 마감은 이 오퍼레이션을 구현하는 단위다.

    ConversionResponse:
      type: object
      required:
        [id, document_id, status, source_format, export_format, export_format_choices,
         format_preservation, easy_text, edited_text, reviewed_at, feedback_submitted_at,
         masked_items, missing_placeholders, model, provider_name,
         input_tokens, output_tokens, failure_code]
      description: |
        변환 상태·결과. 완료 전에는 **결과 필드**가 모두 비어 있다.

        **형식 셋(`source_format`·`export_format`·`export_format_choices`·
        `format_preservation`)은 결과 필드가 아니다.** 문서 메타에서 오는 값이라
        `pending`·`processing`·`failed`에서도 그대로 나간다. 검수 화면을 직접 URL로
        열거나 새로고침해도 원본 형식을 잃지 않아야 하고(`DESIGN.md` §6.5 「필요한 계약
        정보」), 변환이 실패한 화면에서도 「이 문서는 DOCX였다」는 사실은 여전히 참이기
        때문이다.

        **required 범위가 FastAPI 자동 생성물보다 넓다.** 자동 생성물은
        기본값이 있거나 nullable인 필드를 required에서 빼지만, 실제 응답은 항상
        모든 키를 실어 보내고 React도 모든 키를 필수로 다룬다. 계약은 "키가 항상
        존재하고 값이 null일 수 있다"로 고정한다 — Kotlin이 null 필드를 생략하면
        (Jackson `NON_NULL`) React가 `undefined`를 받아 분기가 달라진다.
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConversionStatus' }
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            이 변환이 딸린 문서의 **원본 형식**. `DocumentListItem.source_format`과
            **같은 값 집합이자 같은 값**이다 — 두 응답이 같은 컬럼을 읽는다.

            검수 화면이 화면 전환 상태에 기대지 않고 이 값 하나로 「DOCX로 내려받기」를
            그릴 수 있어야 한다는 것이 이 필드가 여기 있는 이유다(`DESIGN.md` §6.5).
        export_format:
          anyOf:
            - { $ref: '#/components/schemas/ExportFormat' }
            - { type: 'null' }
          description: |
            이 변환을 내려받을 때 나오는 형식. 서버가 `source_format`에서 유도한다:
            `text → txt` · `docx → docx` · `hwpx → hwpx` · **`pdf → null`**.
            유도표의 정본은 최상위 `x-export-format-derivation`이다.

            **2.0.0부터 「나오는 값」이자 「요청할 수 있는 유일한 값」이다.**
            `GET /conversions/{conversion_id}/export`가 이 값과 다른 `format`을 **거절한다**
            (409). 1.6.0에서 이 필드를 세울 때 「지금 요청해야 하는 값이지 지금 반드시
            나오는 값이 아니다」라고 적었던 단서는 그 강제가 서면서 사라졌다 —
            **정의를 바꾸지 않고** 강제만 붙었다. 그 오퍼레이션의 `format`을 생략하면
            서버가 여기 적힌 값을 그대로 쓴다.

            **`null`이면 서버가 하나로 정하지 않았다는 뜻이다.** 두 갈래로 갈린다 —
            `export_format_choices`가 **비어 있으면** 어떤 `format` 값도 생략도 통과하지
            못하고(내려받기 자체가 없다), **비어 있지 않으면** 그 배열 안의 값 하나를
            `format`으로 골라야 한다(생략은 409). 아래 두 문단이 그 사유다.

            **`null`은 「모른다」가 아니라 「서버가 정하지 않는다」다.** 오늘 이 값이 나오는
            원본은 PDF뿐이다. PDF는 편집 가능한 문서 구조가 아니라서 「들어온 형식 그대로」
            (§6.5)가 성립하지 않고 PDF 렌더러도 없다 — 그래서 **사용자가**
            `export_format_choices`(`[docx, hwpx]`) 중 하나를 골라 그 형식의 새 문서로
            받는다(2.6.0 재결정, `x-export-format-derivation.choices`). 그 전(2.0.0–2.5.1)
            에는 PDF에 선택지도 없어 이 `null`이 곧 「내보낼 수단이 없다」였다 — 오늘도
            `choices`가 비는 원본이 생기면(현재는 없다) 그 원본에서는 이 옛 뜻이 그대로다.
        export_format_choices:
          type: array
          items: { $ref: '#/components/schemas/ExportFormat' }
          description: |
            `export_format`이 `null`이고 이 원본에 사용자가 고를 수 있는 형식이 있을 때만
            **비어 있지 않은 배열**이다 — 그 밖에는(`export_format`이 값을 냈거나, `null`
            이지만 고를 형식도 없을 때) **빈 배열**이다. `null`이 아니라 `[]`인 것은
            `masked_items`와 같은 규칙이다 — React가 `undefined` 분기를 만들지 않는다.

            정본은 `x-export-format-derivation.choices[source_format]`이다. 오늘 이 배열이
            비어 있지 않은 원본은 PDF 하나뿐이고 값은 `[docx, hwpx]`다(2.6.0).

            `GET /conversions/{conversion_id}/export`의 `format`은 이 배열이 비어 있지
            않으면 그 안의 값이어야 한다(생략은 409 — `enforcement.on_absent_with_choices`).
        format_preservation:
          anyOf:
            - { $ref: '#/components/schemas/FormatPreservation' }
            - { type: 'null' }
          description: |
            원본 서식 유지 상태. **`null`은 「서버가 아직 판정하지 않았다」다** —
            「유지 가능」도 「유지 불가」도 아니다.

            `null`이 나오는 조건은 하나뿐이고, **판정의 재료가 없다**는 뜻이다.
              ⑴ **변환이 아직 완료되지 않았다** — 판정의 한쪽인 검수본(`edited_text ??
                 easy_text`)이 없다. 원본 단위와 짝지을 문단이 없으므로 어느 상태를 골라도
                 추측이다. 완료되면 그다음 조회에서 값이 선다.

            **2.6.0에서 둘째 조건(「원본이 PDF다」)이 빠졌다.** PDF는 이제 완료 전이든
            후든 **즉시 `not_applicable`**이다(`FormatPreservationStatus.not_applicable`
            ⑷) — 반영이라는 개념 자체가 PDF에 적용되지 않는다는 사실은 검수본을 기다려도
            바뀌지 않으므로, 붙여넣기·옛 업로드와 같은 「영구히 참」 갈래로 옮겼다.

            그 밖에는 언제나 값이 선다 — 원본이 없거나(붙여넣기·옛 업로드·PDF) `not_applicable`,
            있으면 서버가 **실제로 할 반영을 미리 재서** `available`·`partial`·`failed`
            중 하나다. 판정과 내보내기가 같은 코드를 지나므로 여기서 말한 개수와 실제로
            나가는 파일이 갈릴 수 없다.

            §6.5: "상태는 낙관적으로 추측하지 않는다. 서버가 제공한 결과만 표시한다."
            `null`은 **서버가 아무것도 제공하지 않았다**는 뜻이고, 화면은 그때 상태를
            지어내지 말고 `원본 서식 유지` 패널의 상태 줄을 비운다.
        easy_text:
          anyOf: [{ type: string }, { type: 'null' }]
          description: AI 초안. `done`이 아니면 null.
        edited_text:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            담당자 검수 수정본. 저장 전에는 null.
            **AI 초안과 별도로 보존한다** — 에디터 초기값은 `edited_text ?? easy_text`이고,
            초안은 수정률 KPI의 기준선으로 남는다.
        reviewed_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: 검수 수정본을 마지막으로 저장한 시각(ISO 8601). null이면 초안 그대로.
        feedback_submitted_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            이 변환에 **파일럿 피드백을 마지막으로 제출한** 시각(ISO 8601). 낸 적이 없으면 null.
            값은 `conversion_feedback.submitted_at` 이고 `ConversionFeedbackResponse.submitted_at`
            과 **같은 열**이다 — 덮어쓰면 함께 갱신된다.

            **`reviewed_at` 과 다른 사실이다.** 「수정본을 저장했다」와 「의견을 냈다」는 서로를
            함의하지 않는다: 초안을 그대로 두고 의견만 낼 수 있고, 고쳐 저장하고 의견은 안 낼
            수도 있다. 그래서 피드백 제출이 `reviewed_at` 을 대신 찍지 않는다 — 두 사실을 한
            컬럼에 뭉개면 수정률 지표(`conversion_feedback.edit_distance`·`edited_char_count`)가
            기대는 구분이 무너진다. 검수 화면이 「검수함」을 그리려면 **둘 다** 봐야 하고, 이
            필드가 없으면 새로고침한 화면이 방금 낸 의견을 잃는다.

            **제출 시각뿐이다.** 배포 의향·만족도·소요 시간·자유 의견은 여기 싣지 않는다 —
            자유 의견은 봉인해 둔 사용자 콘텐츠라 조회 응답에 나가지 않고, 그 값을 되돌려
            주는 자리는 저장 응답(`PUT /conversions/{conversion_id}/feedback`) 하나다.
        masked_items:
          type: array
          items: { $ref: '#/components/schemas/MaskedItemResponse' }
          description: |
            `done`이 아니면 빈 배열. null이 아니다.
            범주는 주민등록번호·카드번호 **2종뿐**이므로, 전화번호·이메일이 든 문서라도
            이 배열이 비어 있는 것이 정상이다.
        missing_placeholders:
          type: array
          items:
            type: string
            pattern: '^\[\[(주민등록번호|카드번호)[0-9]+\]\]$'
          description: |
            결과에서 사라진 자리표시자 라벨 목록. 라벨뿐이라 개인정보가 아니다.
            비어 있지 않고 검수본도 없으면 내보내기가 409로 막힌다.
            범주 2종만 남으므로 `[[전화번호1]]`·`[[이메일1]]` 같은 라벨은 더 이상 나오지 않는다.
        model: { anyOf: [{ type: string }, { type: 'null' }] }
        provider_name: { anyOf: [{ type: string }, { type: 'null' }] }
        input_tokens: { anyOf: [{ type: integer }, { type: 'null' }] }
        output_tokens: { anyOf: [{ type: integer }, { type: 'null' }] }
        failure_code:
          anyOf: [{ type: string }, { type: 'null' }]
          maxLength: 64
          description: |
            실패 사유 코드 = 예외 클래스명. **문서 본문·모델 응답은 절대 담기지 않는다.**
            **변환이 접수된 뒤의 실패만 여기 실린다.** 접수 자체가 실패하면 저장과 큐
            등록이 함께 롤백되어 변환 행이 남지 않으므로(`POST /documents` 설명) 이
            필드로 알릴 대상이 없다.
            `"EnqueueFailed"`는 **2026-08-20에 폐기된 값**이다 — Redis/ARQ 전제였고,
            어떤 구현에서도 더는 나오지 않는다(`x-retired-responses`).

    # ---------------------------------------------------------------------
    # 파일럿 피드백 (1.5.0 신설) — 게이트 ① 판정 수단.
    # 세 스키마 모두 `PUT /conversions/{conversion_id}/feedback` 하나에서만 쓰인다.
    # ---------------------------------------------------------------------
    PublishIntent:
      type: string
      enum: [as_is, with_edits, not_usable]
      description: |
        검수 담당자의 **배포 의향**. 값의 뜻은 이렇다:
          - `as_is` — 그대로 쓸 수 있다
          - `with_edits` — 조금 고쳐서 쓰겠다
          - `not_usable` — 쓸 수 없다

        **이 값 자체가 게이트 ① 판정의 분모다.** 통과 기준 1이 10건 중 `as_is`와
        `with_edits`의 **건수**를 세므로(`docs/pilot-runbook.md` 「게이트 ① 판정」),
        값을 늘리거나 이름을 바꾸면 스키마가 아니라 **판정 기준**이 바뀐다. 「보통」 같은
        중간값을 더하면 세는 쪽이 그것을 어느 편에 넣을지 계약이 답하지 못한다 —
        값 추가는 `x-change-policy.escalate_to_leader`에 걸리는 변경이다.

        **독립 컴포넌트로 두는 이유는 `ConversionStatus`와 같다** — React 생성 타입이
        이름으로 부르는 union이어야 한다. 인라인 enum은 익명 타입으로 풀려 화면 코드가
        세 문자열 리터럴을 자기 자리에 복제하게 되고, 그러면 값 집합이 두 벌이 된다.

    ConversionFeedbackRequest:
      type: object
      required: [publish_intent, quality_score, minutes_spent]
      description: |
        검수 화면 하단 피드백 폼의 제출 본문. 수기 입력은 이 네 필드가 전부이고
        나머지 지표는 시스템이 남긴다(`docs/pilot-runbook.md` 「기록 방법」).
        `comment`만 선택이며, 나머지 셋은 없으면 판정이 성립하지 않으므로 필수다.
      properties:
        publish_intent: { $ref: '#/components/schemas/PublishIntent' }
        quality_score:
          type: integer
          description: |
            품질 만족도. **1 이상 5 이하의 정수**다(1이 가장 낮고 5가 가장 높다).
            게이트 ① 통과 기준 2가 이 값의 평균을 3.5와 견준다.

            **`minimum`/`maximum`을 쓰지 않는다.** 범위 위반은 이 계약에서 **서비스 층**
            판정이고 422 **문자열** detail이다. 스키마 키워드로 적으면 같은 위반이 배열
            detail로 나가고 사용자에게 보이는 문구가 한국어에서 영문으로 바뀐다 —
            `x-request-field-constraints.x-decision`의 둘째 사유가 그대로 적용된다.
            그래서 **범위는 이 산문이 고정한다.**
            `x-service-constraint`도 달지 않는다: 그 확장은 **길이** 축의 상한을 적는
            자리이고 여기는 값의 범위다. 두 축을 한 키로 뭉치면 그 키를 읽는 대조가
            무엇을 재는지 알 수 없게 된다.
        minutes_spent:
          type: integer
          description: |
            **이 건 하나**를 처리하는 데 든 시간(분). **0 이상 600 이하의 정수**다.
            게이트 ① 기준 3의 중앙값이 이 값에서 나온다.

            **상한 600(10시간)의 사유**: 문서 한 건의 검수가 10시간을 넘는 값은 측정값이
            아니라 **오타**다(자릿수를 하나 더 누른 입력 하나가 중앙값을 통째로 끌어올린다).
            상한이 막는 것은 성실한 응답이 아니라 실수다.
            **0을 허용하는 사유**: 1분이 안 걸린 건이 실제로 있다. 하한을 1로 두면 가장
            빠른 건이 반올림 때문에 거절되는데, 그것은 이 지표가 재려는 것과 정반대다.
            범위 위반의 처분은 `quality_score`와 같다(422 문자열, 스키마 키워드 없음).
        comment:
          anyOf: [{ type: string }, { type: 'null' }]
          x-service-constraint: { max_length: 500, measured_on: normalized }
          description: |
            자유 의견. **선택**이며 주지 않거나 `null`이면 의견 없음이다.

            **정규화 후** 길이를 재고 500자를 넘으면 422 **문자열** detail이다.
            `maxLength`를 쓰지 않는 이유는 `ConversionReviewRequest.edited_text`와 같다 —
            스키마 키워드는 정규화 **전** 원시 값에 걸려 "정규화 후 길이"를 말하지 못한다
            (`x-request-field-constraints.x-openapi-expressibility`).
            상한 값의 정본은 `x-input-limits.max_feedback_comment_length`다.

            **이 필드는 AEAD로 봉인해 저장한다.** 자유 의견에는 사용자가 문서 본문 조각을
            그대로 옮겨 적을 수 있어 평문 열에 둘 수 없다. 봉인해 저장하므로 길이와 다른
            축인 **저장 정의역**이 함께 걸린다(`x-stored-text-domain` — 텍스트로 왕복하지
            않는 값은 받지 않는다). 봉인의 귀결로 집계 스크립트는 이 값을 읽지 못한다.

            **화면은 「문서 내용은 적지 마세요」 안내를 폼 안에 고정한다.** 마스킹 범주가
            주민등록번호·카드번호 **2종뿐**이라(master-plan §3.2) 의견에 적힌 전화번호·
            주소·이름은 어디서도 가려지지 않는다. 계약이 안내 문구까지 정하지는 않지만,
            **그 안내가 없으면 이 필드가 마스킹을 우회하는 자리가 된다**는 것은 계약이
            적는다 — `x-title-policy.rationale`이 같은 종류의 우회를 적어 둔 이유와 같다.

    ConversionFeedbackResponse:
      type: object
      required:
        [conversion_id, publish_intent, quality_score, minutes_spent,
         comment, submitted_at]
      description: |
        저장된 피드백. **required 범위가 넓은 사유는 `ConversionResponse`의 description에
        적힌 것과 같다** — 키는 항상 존재하고 값이 null일 수 있다. Kotlin이 null 필드를
        생략하면(Jackson `NON_NULL`) React가 `undefined`를 받아 분기가 달라진다.

        **저장된 값을 그대로 돌려준다.** 시스템이 계산하는 파생 지표(검수본과 초안의
        편집 거리·글자 수 같은 것)는 **응답에 싣지 않는다.** 그것은 판정용 집계 값이지
        사용자에게 보여 줄 값이 아니고, 검수본과의 차이를 화면에 올리면 「AI가 내 수정을
        채점한다」는 오해를 만든다. 파일럿이 재려는 것은 담당자의 **판단**이지 담당자의
        점수가 아니며, 채점받는다는 느낌은 그 판단 자체를 왜곡한다.
        파생 지표의 집계는 DB에서 스크립트가 한다(`docs/pilot-runbook.md` 「집계」).
      properties:
        conversion_id: { type: string, format: uuid }
        publish_intent: { $ref: '#/components/schemas/PublishIntent' }
        quality_score: { type: integer }
        minutes_spent: { type: integer }
        comment:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            저장된 자유 의견. 주지 않았으면 null이다. 봉인해 둔 값을 **소유자 조회에서만**
            푼다 — 그래서 이 응답에 캐시 금지 헤더가 붙는다.
        submitted_at:
          type: string
          format: date-time
          description: |
            이 피드백을 **마지막으로 저장한** 시각(ISO 8601). 덮어쓰면 갱신된다.
            멱등 upsert라 "처음 낸 시각"과 "마지막으로 낸 시각"이 갈리는데, 판정에 쓰는
            것은 마지막 값이므로 계약이 싣는 것도 그것이다.

    DocumentListItem:
      type: object
      required:
        [id, title, source_format, char_count, created_at,
         retention_expires_at, conversion_id, status, reviewed_at, feedback_submitted_at]
      description: 문서 목록 한 줄 (문서 메타 + 최신 변환 상태). required 범위는 ConversionResponse와 같은 이유로 넓다.
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          maxLength: 255
          description: |
            사용자가 적어 준 제목, 없으면 고정 문구 `제목 없음`.
            **문서 본문에서도 업로드 파일 이름에서도 유도되지 않는다**(`x-title-policy`).
            `maxLength`는 사용자 입력을 자른 결과의 사후 보장이다 — 고정 문구는 그 상한과 무관하다.
            React `HistoryPage`가 이 값을 표에 **그대로 렌더링**하므로 값 자체가 화면 문구다.
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            붙여넣기는 `"text"`, 파일은 소문자 확장자.

            **1.6.0에서 인라인 enum을 `SourceFormat` 컴포넌트로 옮겼다** — 값 집합과
            그것을 enum으로 고정한 사유(2026-08-12 개정)는 전부 그쪽에 있다.
            `ConversionResponse.source_format`이 같은 값 집합을 쓰게 되면서, 인라인으로
            두 벌을 두면 한쪽만 늘어나는 날이 오기 때문이다.
        char_count: { type: integer }
        created_at: { type: string, format: date-time }
        retention_expires_at:
          type: string
          format: date-time
          description: 보관 만료 시점. 기본 생성 시각 + 30일.
        conversion_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        status:
          anyOf:
            - { $ref: '#/components/schemas/ConversionStatus' }
            - { type: 'null' }
          description: 최신 변환의 상태. 변환이 하나도 없으면 null.
        reviewed_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            목록에서 "검수함/초안"을 표시하려면 필요하다 — `status`만으로는 알 수 없다
            (`done`은 "AI 변환이 끝났다"는 뜻일 뿐이다).
        feedback_submitted_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            **최신 변환**에 피드백을 마지막으로 제출한 시각. 낸 적이 없거나 변환이 하나도
            없으면 null이다. `ConversionResponse.feedback_submitted_at`과 같은 열을 읽고,
            그 필드의 설명이 「왜 `reviewed_at`으로 대신 찍지 않는가」의 정본이다.

            여기 함께 싣는 이유: 목록이 "검수함"을 그리는 근거가 **둘로 갈린다**(수정본 저장·
            의견 제출). 한쪽만 보면 의견만 낸 문서가 목록에서 영영 "검수 필요"로 남는다.

            최신 변환이 없으면(`conversion_id`가 null) 이 값도 null이다 — 피드백은 변환 한
            건에 딸리기 때문이다. 반대로 이 값이 서면 `status`는 언제나 `done`이다(완료 전
            변환에는 피드백을 낼 수 없다, #15의 409).

    DocumentSourceResponse:
      type: object
      required: [document_id, source_format, char_count, source_text]
      description: |
        `GET /documents/{document_id}/source` 응답 — **네 필드가 전부다.**

        **`DocumentListItem`에는 이 본문이 실리지 않는다.** 목록은 한 번에 여러 문서를
        돌려주는 자리라 원문을 얹으면 응답 크기가 문서 수만큼 곱해지고, 목록 화면은
        본문을 그리지 않는다. 원문은 언제나 이 오퍼레이션 하나로만 나간다.
      properties:
        document_id: { type: string, format: uuid }
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            이 원문이 어디서 왔는지. 붙여넣기는 `"text"`, 파일은 소문자 확장자다.
            `ConversionResponse.source_format`·`DocumentListItem.source_format`과
            **같은 열을 읽으므로** 세 자리의 값이 갈릴 수 없다.
        char_count:
          type: integer
          description: |
            `source_text`의 공백 포함 문자 수. `DocumentListItem.char_count`와 같은 열이다
            — 클라이언트가 본문을 세어 다시 구할 필요가 없게 함께 싣는다.
        source_text:
          type: string
          description: |
            **마스킹 전 원문 그대로다** — 저장된 값에 주민등록번호·카드번호가 들어 있으면
            그대로 실린다(마스킹은 LLM에 넘기기 직전에만 적용된다). 이 필드가 있기 때문에
            이 오퍼레이션에 캐시 금지 헤더가 필수다.

            파일 업로드였다면 **파서가 뽑아낸 텍스트**이지 원본 파일 바이트가 아니다 —
            서식·표·이미지는 여기 없고, 그것을 되살리는 자리는 내보내기다
            (`GET /conversions/{conversion_id}/export`).
    DocumentListResponse:
      type: object
      required: [items, limit, offset, has_more]
      description: 총 개수는 싣지 않는다(전수 count는 목록 조회마다 비싸다).
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentListItem' }
          description: 최신순.
        limit: { type: integer, description: 요청에 쓰인 값을 그대로 되돌려준다. }
        offset: { type: integer, description: 요청에 쓰인 값을 그대로 되돌려준다. }
        has_more:
          type: boolean
          description: 다음 페이지가 있는지. 한 건 더 읽어(limit+1) 판정한다.

    # ---------------------------------------------------------------------
    # workspaces
    # ---------------------------------------------------------------------
    WorkspaceNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          x-service-constraint: { max_length: 50, non_empty: true, measured_on: normalized }
          description: |
            제어문자를 걷어내고 앞뒤 공백을 턴 뒤 **그 결과로** 판정한다 — 비어 있으면 422,
            50자를 넘으면 422이며 **자르지 않고 거절한다**. 둘 다 문자열 detail이다.
            `minLength`/`maxLength`를 쓰지 않는 이유가 **양방향**이다: `maxLength: 50`은
            제어문자를 포함한 원시 55자를 잘못 거절하고, `minLength: 1`은 서비스가 거절하는
            `"   "`(공백만)를 통과시킨다(`x-request-field-constraints`).

    WorkspaceResponse:
      type: object
      required: [id, name, created_at]
      description: 작업 공간 한 건 (POST·PATCH 응답). `document_count`는 싣지 않는다.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        created_at: { type: string, format: date-time }

    WorkspaceListItem:
      allOf:
        - $ref: '#/components/schemas/WorkspaceResponse'
        - type: object
          required: [document_count]
          description: |
            목록 한 줄. **문서 수는 목록에서만 준다** — 방금 만든 공간은 늘 0이고,
            이름만 바꾼 공간의 문서 수는 화면이 이미 안다. 응답마다 COUNT를 붙이면
            쓰지 않는 값을 위해 질의가 는다.
          properties:
            document_count: { type: integer, minimum: 0 }

    WorkspaceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceListItem' }
          description: '만든 순서. **첫 번째가 기본 작업 공간이다.**'

    # ---------------------------------------------------------------------
    # health
    # ---------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, checks]
      description: |
        `status`는 **`checks`에서 유도한다** — 별개로 계산하지 않는다.
        `checks`의 값이 모두 true면 `ok`, 하나라도 false면 `degraded`다.
        둘이 어긋난 응답은 계약 위반이다(단언하기 쉬운 조항이므로 contract test로 고정한다).
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: |
            `ConversionStatus`와 **다른 네임스페이스**이므로 혼동하지 않는다.
            `"ok"`는 초판(상수 응답)과 같은 값이라, 이 필드만 보던 소비자는 영향받지 않는다.
        checks:
          type: object
          additionalProperties: { type: boolean }
          description: |
            의존 서비스 이름 → 사용 가능 여부. **불리언만 싣는다** — 인증 없는
            엔드포인트이므로 예외 메시지·호스트·버전 같은 내부 정보를 담지 않는다.
            아직 배선되지 않아 확인할 수 없는 의존 서비스는 **키를 생략한다**
            (`false`가 아니다 — "죽었다"와 "확인 안 했다"는 다른 말이다).
            현재 정의된 키: `database`, `queue`. **둘은 같은 DataSource를 공유한다**
            (큐는 같은 DB의 lease 테이블이다 — `paths./health.get.description`).
            의존 서비스가 하나도 배선되지 않았으면 `{}`이고 `status`는 `ok`다.
            **`database: false`는 제품 구성에서 도달 0이다** — 그 사유와 처분은
            `paths./health.get.description`에 있다. 아래 예시 둘은 **조항의 모양**을 보이는
            것이지 오늘 관측되는 응답이 아니다.
          examples:
            - { database: true, queue: true }
            - { database: true, queue: false }

