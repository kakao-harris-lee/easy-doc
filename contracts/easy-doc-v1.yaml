paths:

  # ===========================================================================
  # #1 POST /auth/signup — 201
  # 원본: app/api/auth.py::signup
  # ===========================================================================
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 계정을 만든다 (기본 작업 공간도 함께 생성된다)
      security: []          # 인증 불필요
      description: |
        가입은 계정과 **기본 작업 공간**을 같은 트랜잭션에서 만든다. 나눠 커밋하면
        계정만 있고 작업 공간이 없는 사용자가 생겨 첫 업로드가 갈 곳을 잃는다.
        기본 작업 공간 이름은 `기본 작업 공간`(app/models/workspace.py).

        입력 규칙: 이메일은 공백 제거 + 소문자 정규화 후 형식 검사(최대 255자),
        비밀번호는 최소 8자. 위반은 **도메인 예외 → 422 문자열 detail**이며,
        Pydantic 필드 누락은 **422 배열 detail**이다. 같은 상태 코드에 두 모양이
        모두 나오므로 union 처리가 필수다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 계정 생성됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409':
          $ref: '#/components/responses/Conflict'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
