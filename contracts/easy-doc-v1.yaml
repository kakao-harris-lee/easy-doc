      - **1종 측정**: 「콜론 없는 헤더 줄 → 400」의 본문이 원시 소켓 실측에서
        최상위 키 `detail` 하나로 관측됐다(`03_kotlin-implementer_auth-fixes2.md` §4).
        **이 한 건으로 E-4를 닫지 않는다** — 나머지 5종(요청 대상 금지 문자·요청 줄 파손·
        헤더 상한 초과·`Host` 없음 400 · 알 수 없는 HTTP 버전 505)은 여전히 보지 않았다.

    **남은 5종을 "충족"으로도 "위반"으로도 적지 않는다.** 측정 결과 만족시킬 수 없는 자리가
    남으면 계약을 좁히지 말고 리더에게 올린다 — 헤더 쪽에서 밟은 순서와 같다.
    측정 결과 계약을 만족시킬 수 없는 자리가 남으면 **계약을 좁히지 말고** 목록·실측 근거와
    함께 리더에게 올린다(`x-change-policy.escalate_to_leader` 1번). 헤더 쪽에서 밟은 순서와
    같다 — ① 닿게 만들어 본다 → ② 그래도 남으면 재심.
  x-openapi-expressibility: |
    **이 요구도 OpenAPI 문법으로 끝까지 표현되지 않는다.** `ErrorResponse` 스키마는 응답
    **본문의 모양**을 적을 수 있지만, 그 스키마가 **어느 응답에 적용되는지**는 `paths` 아래
    (경로, 오퍼레이션, 상태 코드) 삼중키에 달린 자리에만 적을 수 있다.
    이번에 문제가 된 ②는 `/error`라는 **스펙에 존재하지 않는 경로**의 응답이고, ④는 애초에
    어떤 경로에도 매칭되지 않는다. 둘 다 스키마를 붙일 문법상의 자리가 없다.
    `x-global-response-headers.x-openapi-expressibility` ②와 **같은 구멍**이며,
    같은 결론이 나온다 — 강제 수단은 스펙 밖의 contract test뿐이다.

# -----------------------------------------------------------------------------
# 사적 응답 헤더 — 읽는 순서를 틀리지 않는다.
#
# `x-global-response-headers`가 **요구의 정본**이다 (Kotlin의 모든 응답).
# 뒤따르는 `x-private-response-headers`의 목록은 그 요구의 **하한선**이지
# 범위가 아니다. 그 목록을 범위로 읽으면 이 절을 거꾸로 읽은 것이다.
# -----------------------------------------------------------------------------
x-global-response-headers:
  status: "결정됨 (2026-08-12 리더 판정) — OQ-1 종결. 경로: 계약 소유자 재심 제기 → 리더 판정"
  headers:
    Cache-Control: no-store
    X-Content-Type-Options: nosniff
  ground: G4
  applies_to: |
    **Kotlin 런타임이 내보내는 모든 HTTP 응답.** 상태 코드·경로·핸들러 유무·본문 유무를
    가리지 않는다. 성공 응답, 오류 응답(4xx·5xx), 본문 없는 204, `GET /health`,
    CORS 프리플라이트, 그리고 매칭되는 핸들러가 없어 컨테이너가 직접 만든 응답까지
    전부 포함이다.
  rationale: |
    열거식 범위가 이 저장소에서 **이미 두 번** 누락됐다(`PUT /conversions/{id}` 하나,
    `/auth` 셋). 사람이 매번 기억해야 지켜지는 조항은 지켜지지 않는 형태이고, 그것이
    G4의 정의다. "오류 본문에 개인정보가 없다"는 실측은 여전히 유효하지만 그것은
    *얻는 것이 작다*는 근거일 뿐 *좁게 유지해야 한다*는 근거가 아니다.
    전역 부착의 비용이 사실상 0인 쪽이 결정을 갈랐다 — 이 API가 내보내는 것은 JSON과
    첨부 파일뿐이라 정적 자원·HTML 문서가 없고, `no-store`가 망가뜨릴 캐시 동작 자체가
    없다. CORS 프리플라이트 캐시는 `Access-Control-Max-Age`가 관장하므로 영향받지 않는다.
  x-failure-mode-shift: |
    **이 판정의 핵심 귀결은 실패 양상이 바뀐다는 것이다.**
    위험이 "누가 한 자리를 빠뜨렸는가"에서 **"강제 수단이 그 응답까지 닿는가"**로 옮겨간다.
    전자는 목록 대조로 잡히지만 후자는 **실행해 봐야만** 잡힌다.
    따라서 이 조항은 적어 두면 지켜지는 종류가 아니다.

    **2026-08-12 실측으로 이 자리는 닫혔다**(`x-phase3-measurement`) — 그리고 그 실측이
    바로 이 서술을 정당화했다. 필터 하나만으로는 6종이 비었고, 목록 대조로는 그것이
    보이지 않았으며, MockMvc로는 **통과했다는 잘못된 근거**까지 나왔다.
    이 절을 "이제 끝난 이야기"로 지우지 않는 이유가 그것이다 — 강제 수단을 건드리는 변경
    (필터 순서, 밸브 제거, 컨테이너 교체)은 매번 같은 방식으로 다시 재야 한다.
  enforcement: |
    **2층 강제 — 서블릿 필터 + Tomcat Engine 밸브.** 종전 서술("서블릿 필터 하나로 붙인다")은
    2026-08-12 실측으로 **부족함이 확인되어 무효**다(`x-phase3-measurement`).
    이것은 요구를 좁히는 변경이 아니라 **강제 수단을 넓히는 변경**이므로
    `x-change-policy.invariants` 축소에 해당하지 않는다.

    ① **서블릿 필터** — 체인의 **가장 바깥**(CORS 필터와 같은 층 또는 그 바깥)에 두어
       라우팅·예외 처리보다 먼저 응답 객체를 잡는다. 서블릿에 매핑된 요청은 전부 덮는다.
       실측으로 확인된 도달 범위: 핸들러 없는 404, 415, 413, CORS 프리플라이트 OPTIONS 200,
       `sendError` → `/error` ERROR 디스패치.
    ② **Tomcat Engine 밸브** — 요청 줄·헤더 블록 **파싱 단계**에서 거절되는 응답은 서블릿에
       매핑되지 않아 **필터 체인이 시작조차 하지 않는다.** 필터로는 물리적으로 닿을 수 없는
       자리이고, Engine 밸브는 그보다 앞이라 닿는다. 실측으로 6종 전부를 덮는 것을 확인했다
       (목록은 `x-phase3-measurement.unreachable_by_filter`).

    두 층 모두 헤더를 `add`가 아니라 **`set`**으로 쓴다 — 컨트롤러 `ResponseEntity`가 같은
    헤더를 이미 실은 자리에서 `add`를 쓰면 `Cache-Control: no-store, no-store`가 나가고,
    값을 `const`로 못박은 이 계약(`components.headers.CacheControlNoStore`)에 위반된다.
    이중 부착은 기능은 멀쩡하고 계약만 깨지는 종류라 눈으로는 안 잡힌다.
    **밸브와 필터가 같은 응답에 둘 다 닿는 구간이 존재하므로**(밸브는 모든 응답을 지나간다)
    중복 부착 단언(`header().stringValues(...)`로 개수까지)은 2층이 된 뒤 더 중요해졌다.
  x-container-coupling: |
    **②는 Tomcat 결합이다 — 서블릿 표준이 아니다.** `org.apache.catalina.valves.ValveBase`는
    Tomcat 전용 확장 지점이고, 서블릿 스펙에는 "필터보다 앞"에 해당하는 표준 자리가 없다.
    계약을 읽는 사람이 **"서블릿 표준 필터만 있으면 이 조항이 만족된다"고 읽으면 오독**이다.

    감수 범위인 이유: 계획 §3.1이 내장 Tomcat을 기술 고정으로 못박았다. 따라서 이 결합은
    이미 내린 결정의 귀결이지 이 계약이 새로 만든 제약이 아니다.

    **컨테이너를 바꾸면(Jetty·Undertow·Netty) 이 층은 조용히 사라지지 않고 기동 시점에
    깨진다** — 밸브 등록은 `TomcatServletWebServerFactory`에 붙는 구성이라 그 팩토리가
    없으면 컨텍스트 조립이 실패한다. 이것은 결함이 아니라 **의도된 성질**이다.
    조용히 사라지는 쪽이었다면 파싱 단계 거절 응답 6종이 헤더 없이 나가는 것을 아무도
    모르게 된다. 컨테이너 교체는 이 조항의 재설계를 동반해야 하며, 그 판단은
    `x-change-policy.escalate_to_leader` 4번(배포·운영 동작이 달라지는 변경)이다.
  x-openapi-expressibility: |
    **이 전역 요구를 OpenAPI 문법으로 끝까지 표현할 수 없다.** 아래가 표현하지 못한
    것의 전부이며, 표현한 척하지 않기 위해 남긴다.

    ① **"모든 응답에 적용"이라는 구성 자체가 없다.** `components.headers`는 헤더
       **정의**를 재사용할 뿐 **부착**하지 않는다. 루트에서 상속되는 `security`와 달리
       헤더에는 대응물이 없다.
    ② **응답 객체는 (경로, 오퍼레이션, 상태 코드) 삼중키에만 달린다.** 그런데 이번
       판정이 정확히 겨냥한 위험은 **어떤 경로에도 매칭되지 않는 요청의 응답**이다 —
       핸들러 없는 404, malformed HTTP 400, 디스패치 전에 잘리는 413·415. 이들에는
       헤더를 적을 **문법상의 자리가 존재하지 않는다.** `paths`에 없는 응답을
       `paths` 아래에 적을 수 없다.
    ③ **`default` 응답도 대안이 아니다.** 한 오퍼레이션 안의 미문서화 상태 코드만
       덮고 오퍼레이션 밖은 못 덮으며, 명시된 상태 코드는 애초에 `default`를 쓰지 않는다.
    ④ **CORS 프리플라이트(OPTIONS) 응답에는 오퍼레이션이 없다.** 필터가 처리하므로
       스펙에 자리가 없는데, 전역 요구의 대상이기는 하다.
    ⑤ **모든 응답에 헤더를 적어 넣는 것은 "표현"이 아니라 "재열거"다.** 그렇게 하면
       G4가 지목한 실패 양상(사람이 기억해야 지켜지는 목록)을 스펙 안에 복제하는 셈이고,
       그러고도 ②·③·④는 여전히 못 덮는다. 그래서 `paths` 아래 선언을 늘리지 않았다.
    ⑥ **강제 수단의 계층 구조에 문법상의 자리가 없다.** OpenAPI는 "무엇이 나가야 하는가"를
       적는 문법이고 "무엇이 그것을 붙이는가"를 적는 문법이 아니다. 필터 1층으로는 6종이
       비고 밸브가 그 자리를 덮는다는 사실, 그리고 그 밸브가 Tomcat 결합이라는 사실은
       `x-` 확장의 산문으로만 남는다(`enforcement`·`x-container-coupling`).
       **이것이 실제 위험이다** — 스펙만 읽은 구현자는 "필터 하나면 이 요구를 만족한다"는
       결론에 도달할 수 있고, 실제로 그 결론이 2026-08-12 실측 전까지 이 계약의 서술이었다.

    **귀결**: 이 조항의 강제 수단은 스펙 밖에 있다 — contract test와 실측뿐이다.
    스펙은 요구를 **기술**할 수 있을 뿐 **검사 가능한 형태로** 만들지 못한다.
    "스펙에 적혀 있으니 검증됐다"고 읽으면 오독이다.
  x-origin-of-the-ten: |
    **아래 `x-private-response-headers.applies_to`의 첫 열 자리가 왜 하필 그 열이었는지의 출처.**
    그 목록은 Python `app/api/`의 `PRIVATE_RESPONSE_HEADERS` 부착 자리에서 왔다 —
    Python은 그 성공 응답 10곳에만 붙이고 오류 응답·204·`/health`에는 붙이지 않았다
    (실측 2026-08-12: 401·422 응답 헤더에 cache-control 없음). Kotlin 계약이 전역으로
    넓힌 뒤에도 그 자리들을 하한선으로 남긴 이유는 그 연혁이 아니라
    `x-private-response-headers.x-why-these-ten`의 위험도 기준이다.

    **목록은 그 뒤로 늘었다** — 1.5.0에서 `PUT /conversions/{conversion_id}/feedback`이
    더해졌다. 그 자리는 Python에 대응물이 아예 없으므로 **이 절의 대상이 아니다**:
    여기가 설명하는 것은 「왜 하필 그 열 자리였나」이지 「목록의 현재 크기」가 아니다.
    현재 크기를 이 자리에서 세지 않는 이유는 세는 자리가 늘수록 갈리기 때문이다
    (게이트 28 P-5). **키 이름의 `ten`은 그 연혁을 가리키는 안정 id로 남긴다** —
    목록이 늘 때마다 이름을 다시 세면 이 파일과 리뷰 기록의 인용이 전부 어긋난다.

    **2026-08-12 2차 재심 — 이 절의 옛 내용(`x-python-deviation`)은 대상 소멸로 정리됐다.**
    종전에는 "Python은 이 전역 요구를 만족하지 않는다 — 인정된 이탈이며, 관찰 기간에 두
    런타임의 헤더가 다른 것은 기록된 차이이므로 parity 불일치로 올리지 않는다"고 적혀
    있었다. 그 지시는 **Python과 Kotlin이 함께 도는 관찰 기간과 롤백 창**을 전제했는데,
    Python 폐기·재개발과 롤백 포기로 **전제 상황 자체가 없어졌다.** 헤더가 갈릴 상대
    런타임이 없으므로 기록할 차이도, 올리지 않을 불일치도 없다.
    **리더 판정(부수 결정 2 "Python은 고치지 않는다")이 뒤집힌 것이 아니다** — 판정이
    다루던 대상이 사라진 것이고, 결론("고치지 않는다")은 오늘도 그대로다.
    키 이름을 `x-python-deviation`에서 바꾼 것은 그 이름이 더는 존재하지 않는 이탈을
    가리키기 때문이다. 이 파일 밖에서 옛 이름을 참조하는 곳은 없음을 확인했다.
  x-phase3-measurement:
    status: "실측 완료 (2026-08-12) — 종전 '미실측' 서술은 무효. 필터 단층으로는 부족했고 밸브를 더해 충족"
    measured_by: "kotlin-implementer"
    environment: "Tomcat 11.0.22 / Spring Boot 4.1.0"
    method: |
      `@SpringBootTest(webEnvironment = RANDOM_PORT)`로 실제 포트를 열고 **원시 소켓**으로
      요청을 보내 응답 바이트를 그대로 읽었다.
      **MockMvc로는 이 항목을 측정할 수 없다** — 서블릿 컨테이너를 띄우지 않아 컨테이너가
      필터 앞·바깥에서 만드는 응답을 재현하지 못하고, 그런데도 **측정한 것처럼 보이는
      통과**가 나온다. 통과했다는 사실이 근거가 되지 않는 종류의 측정이므로,
      이 항목을 MockMvc로 다시 쓰는 것은 검증이 아니라 검증의 외양이다.
      HTTP 클라이언트 라이브러리도 malformed 요청을 교정해 버리므로 원시 소켓이 필요하다.
    reachable_by_filter:
      - "핸들러 없는 404"
      - "415 (미지원 Content-Type)"
      - "413 (요청 본문 상한 초과)"
      - "CORS 프리플라이트 OPTIONS 200"
      - "`sendError` → `/error` ERROR 디스패치 503"
      - "알 수 없는 메서드 → 405 (2026-08-19 재분류 — `x-405-reclassification`)"
    x-405-reclassification: |
      **2026-08-19 정정 — 근거 G1(계약이 사실과 달랐다).** 초판은 「알 수 없는 메서드 → 405」를
      아래 `unreachable_by_filter`에 넣어 미도달을 7종으로 셌다. 원시 소켓 실측(`FROB /health`,
      실기동 `@SpringBootTest(RANDOM_PORT)` · `03_kotlin-implementer_auth-fixes2.md` §4)에서
      **그 응답은 서블릿까지 도달한다.** 판별 근거 셋이 모두 같은 방향을 가리킨다.

        ① `Allow: GET`이 붙는다 — 매핑을 알아야만 만들 수 있는 헤더다.
        ② `Content-Type`에 `;charset=UTF-8`이 **없다.** 밸브가 만든 응답(콜론 없는 헤더 줄 400)
           에는 붙는다 — 두 응답의 생성자가 다르다는 표시다.
        ③ 본문이 **우리 고정 문구**다 — 컨테이너 기본 본문이 아니다.

      **별도 응답 조항을 만들지 않는다.** 이 405는 컨테이너가 아니라 프레임워크 오류 핸들러가
      만든 응답이므로 `x-error-body-universality`의 ④가 아니라 **①**에 속하고, 그 절이 이미
      요구를 건다. `paths` 아래에 선언할 자리는 여전히 없다 — 경로는 있으나 그 메서드의
      오퍼레이션이 없어 삼중키가 성립하지 않는다(`x-openapi-expressibility` ②와 같은 자리).
      **재분류로 바뀌는 것은 「무엇이 어느 층에 닿는가」이지 「무엇이 나가야 하는가」가 아니다.**
    unreachable_by_filter:
      note: |
        **요청 줄·헤더 블록 파싱 단계에서 거절되는 응답 6종.** 서블릿에 매핑되지 않아
        필터 체인이 **시작조차 하지 않는다.** 필터 배치를 어떻게 고쳐도 닿지 않는다 —
        배치 문제가 아니라 서블릿 컨테이너의 처리 순서 문제다.
        (2026-08-19까지 7종이었다. 하나가 사실과 달라 위 `x-405-reclassification`으로 옮겼다.)
      cases:
        - "요청 대상(request target) 금지 문자 → 400"
        - "콜론 없는 헤더 줄 → 400"
        - "요청 줄 파손(malformed request line) → 400"
        - "헤더 상한 초과 → 400"
        - "`Host` 헤더 없음 → 400"
        - "알 수 없는 HTTP 버전 → 505"
    resolution: |
      **계약을 좁히지 않고 강제 수단을 넓혔다**(`x-change-policy.escalate_to_leader` 1번의
      순서 ① — 먼저 닿게 만든다). Tomcat Engine 밸브가 위 6종 **전부**를 덮는 것을 계측으로
      확인하고 구현했다. 리더 재심(순서 ②)은 필요하지 않았다 — 물리적으로 닿지 않는 자리가
      남지 않았기 때문이다. 밸브의 컨테이너 결합은 `x-container-coupling`에 명시했다.
    negative_control: |
      **음성 대조를 함께 돌렸다.** 밸브를 빼면 malformed 계열 3건만 정확히 깨진다 —
      즉 이 테스트가 실제로 밸브의 존재를 측정하고 있음이 확인됐다. 음성 대조가 없으면
      "밸브가 없어도 통과하는 테스트"를 근거로 삼게 된다.
    x-rejected-hypothesis: |
      **후보 원인으로 지목됐던 `OncePerRequestFilter.shouldNotFilterErrorDispatch()`는
      기각됐다.** 대조 실험 결과 그 오버라이드와 `DispatcherType.ERROR` 등록을 **둘 다
      기본값으로 되돌려도** 헤더가 남는다 — 필터가 `chain.doFilter` **앞에서** 헤더를 쓰고
      Tomcat이 포워딩에서 버퍼만 비우기 때문이다.
      종전 이 계약과 스킬 §5.2가 "후보 원인"으로 적었던 세 가설 중 하나가 이렇게 정리됐다.
      **후보를 사실로 적지 않았던 것이 여기서 값어치를 했다** — 사실로 적었다면 기각을
      기록할 자리가 없었다.
    residual: |
      이 실측이 다룬 것은 **두 헤더의 유무**뿐이다. 같은 6종 응답의 **본문 모양**은 아직
      측정되지 않았다 — `x-error-body-universality.x-unmeasured`가 그 자리다.
  x-superseded: |
    이 절은 종전 `x-private-response-headers.does_not_apply_to`("DELETE 204 · /health ·
    모든 오류 응답")를 **무효화한다.** 그 목록의 유래는 Python 동작이었고
    (`x-origin-of-the-ten`), Kotlin 계약에서는 제외 대상이 없다.
    개선 원장의 V2-3(DELETE 204의 헤더)도 이 판정에 흡수됐다.

# -----------------------------------------------------------------------------
# 하한선 — 개인정보·자격증명이 실리는 고위험 경로.
#
# 전역 규칙이 있는데도 이 목록을 남기는 이유: 필터가 제거되거나 체인 순서가 어긋나도
# **고위험 경로에서 테스트가 먼저 깨져야** 하기 때문이다(2026-08-12 리더 판정 부수 결정 1).
# 이 목록의 개별 contract test는 삭제하지 않는다.
# Python 기준선 확인 (초판 열 자리의 출처. 그 뒤 더해진 자리는 Python에 대응물이 없다): grep -rn "headers.update(PRIVATE_RESPONSE_HEADERS)\|\*\*PRIVATE_RESPONSE_HEADERS" app/api/ | wc -l  → 10
# -----------------------------------------------------------------------------
x-private-response-headers:
  role: |
    **하한선이지 범위가 아니다.** 요구의 정본은 `x-global-response-headers`이고
    이 목록은 그 요구가 무너졌을 때 가장 먼저 깨져야 하는 자리를 지목한다.
    여기에 없는 응답이라고 헤더가 없어도 되는 것이 아니다.
  headers:
    Cache-Control: no-store
    X-Content-Type-Options: nosniff
  applies_to:
    - "POST /auth/signup"              # 이메일이 실린다
    - "POST /auth/login"               # 응답 본문이 Bearer 토큰 자체다
    - "POST /auth/password-reset/confirm"  # login과 같은 이유 — 응답 본문이 Bearer 토큰 자체다(2.19.0)
    - "GET /auth/me"                   # 이메일이 실린다
    - "GET /documents"                 # 사용자가 적어 준 제목이 실린다 (본문 유도는 폐기 — `x-title-policy`)
    - "GET /documents/{document_id}/source"    # source_text가 사용자가 올린 원문 그대로다
    - "GET /conversions/{conversion_id}"       # easy_text·edited_text에 사용자 문서 본문
    - "PUT /conversions/{conversion_id}"       # GET과 같은 응답 스키마
    - "GET /conversions/{conversion_id}/export"  # 검수 후 원문이 복원될 수 있는 최종본
    - "GET /workspaces"                # 작업 공간 이름도 사용자가 적은 콘텐츠
    - "POST /workspaces"
    - "PATCH /workspaces/{workspace_id}"
    - "PUT /conversions/{conversion_id}/feedback"  # 자유 의견 — 사용자가 적어 준 콘텐츠가 그대로 되돌아 나간다
  x-why-these-ten: |
    이 목록을 고른 규칙은 **"개인정보·자격증명이 실리는 응답"**이다.
    `POST /auth/login`은 Bearer 토큰 자체를, 나머지 `/auth` 둘은 이메일을, 문서·작업 공간
    응답은 사용자 콘텐츠를 싣는다. 헤더가 빠지면 **200 OK로 나타나는 보안 사고**라
    본문 검증으로는 절대 잡히지 않는다 — 그래서 전역 규칙과 별개로 개별 단언을 남긴다.
    이 목록의 각 항목은 `paths` 아래 그 오퍼레이션의 헤더 선언과 대응한다(그 방향은
    실측했다 — 열거된 자리마다 실제로 `headers:` 가 있다). **역방향(1:1)은 성립하지
    않는다** — `paths` 에는 이 목록보다 **먼저** `Cache-Control`/`X-Content-Type-Options`
    를 선언한 자리가 이미 있었다(예: `POST /auth/oauth/{provider}/callback`,
    `POST /dictionary/lookup`, 재변환·이메일 인증 오퍼레이션들 — 전역 필터
    `x-global-response-headers` 채택 이후 신설된 오퍼레이션은 대체로 명시 선언까지
    함께 얹는다). 그런 자리를 전부 이 목록에 옮기지 않는다 — **여기는 "개인정보·
    자격증명이 실리는 응답"이라는 별도 기준으로 고른 하한선**(`x-why-these-ten` 첫
    문장)이지, `paths` 의 명시적 헤더 선언 전체의 색인이 아니다. 개수 대조는
    `PrivateHeaderFloorCensusTest`가 한다. 1.5.0에서
    `PUT /conversions/{conversion_id}/feedback`이 더해졌다: 자유 의견은 사용자가 직접 적은
    콘텐츠이고 그 응답이 그것을 그대로 되돌려 주므로 같은 규칙에 걸린다.
    2.2.0에서 `GET /documents/{document_id}/source`가 더해졌다: 사용자가 올린 문서
    원문이 그대로 나가는 자리다. 새로 여는 범주는 아니다 — 같은 소유자에게
    `GET /conversions/{conversion_id}`가 이미 변환 본문을 그대로 돌려주고 있고,
    원문 조회는 그보다 넓은 범주를 열지 않는다.
    **키 이름의 `ten`은 목록이 열 자리이던 때의 안정 id다**
    (연혁은 `x-global-response-headers.x-origin-of-the-ten`).
  x-not-a-scope: |
    **여기 없는 응답에도 헤더는 붙는다.** 종전 이 절에 있던 `does_not_apply_to`
    (DELETE 204 · `/health` · 모든 오류 응답)는 2026-08-12 리더 판정으로 **무효**이며,
    그 목록이 어디서 왔는지는 `x-global-response-headers.x-origin-of-the-ten`에 남아 있다.
    Kotlin 계약에는 제외 대상이 없다.
  x-resolved-question:
    id: OQ-1
    subject: "사적 헤더를 모든 응답에 붙일 것인가 (전역 필터)"
    status: "종결 (2026-08-12 리더 판정) — **전역 부착 승인**"
    resolution_ref: "`x-global-response-headers` (요구의 정본)"
    path: |
      계약 소유자가 재심을 **제기**하고 리더가 **판정**했다. 계약 소유자는 전제 변화
      (parity 재현이 더는 목표가 아님)를 근거로 리더 판정을 **스스로 뒤집지 않고** 올렸다.
      결과가 같아도 경로가 다르다 — 이 절차가 없으면 앞으로 어떤 리더 결정도 "전제가
      바뀌었다"는 주장 하나로 무효화된다(`x-change-policy.escalate_to_leader` 1번).
    x-corrected-premise: |
      재심 제기 시 계약 소유자가 적었던 **"넓혔다가 좁히려면 서블릿 API에 헤더 삭제
      수단이 없어 되돌릴 수 없다"는 과장이며 판정과 함께 정정됐다.** 좁히는 것은 필터
      하나에 조건을 더하는 일이지 전송된 헤더를 회수하는 일이 아니고, 절체 전이라 캐시에
      남은 응답도 없다. 판정이 틀린 전제 위에 기록되지 않도록 함께 남긴다.
      다만 **비대칭 판단 자체는 옳았다** — 좁은 쪽을 기본값으로 두고 재심을 올린 절차
      판단은 이 정정과 무관하게 유효하다.

tags:
  - name: auth
    description: 가입·로그인·내 정보
  - name: documents
    description: 문서 업로드·목록·변환 결과 조회·검수·내보내기
  - name: workspaces
    description: 작업 공간 목록·만들기·이름 바꾸기·삭제
  - name: dictionary
    description: 어려운 말 사전 조회 — 검수 화면의 대체어 추천(P0-5, 2.11.0)
  - name: health
    description: 생존 확인 (인증 불필요)

paths:

  # ===========================================================================
  # #1 POST /auth/signup — 201
  # 원본: app/api/auth.py::signup
  # ===========================================================================
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 계정을 만든다 (기본 작업 공간도 함께 생성된다)
      security: []          # 인증 불필요
      description: |
        가입은 계정과 **기본 작업 공간**을 같은 트랜잭션에서 만든다. 나눠 커밋하면
        계정만 있고 작업 공간이 없는 사용자가 생겨 첫 업로드가 갈 곳을 잃는다.
        기본 작업 공간 이름은 `기본 작업 공간`(app/models/workspace.py).

        입력 규칙: 이메일은 공백 제거 + 소문자 정규화 후 형식 검사(최대 255자),
        비밀번호는 최소 8자. 위반은 **도메인 예외 → 422 문자열 detail**이며,
        Pydantic 필드 누락은 **422 배열 detail**이다. 같은 상태 코드에 두 모양이
        모두 나오므로 union 처리가 필수다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 계정 생성됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409':
          $ref: '#/components/responses/Conflict'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #2 POST /auth/login — 200
  # 원본: app/api/auth.py::login
  # ===========================================================================
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 자격증명을 확인하고 액세스 토큰을 발급한다
      security: []
      description: |
        **응답 본문이 액세스 토큰 자체다.** 캐시된 사본 하나가 그대로 계정 탈취
        수단이 되므로 캐시 금지 헤더가 반드시 붙는다.
        실패는 401이며 이메일 부재와 비밀번호 불일치를 구분하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 토큰 발급됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #3 GET /auth/me — 200
  # 원본: app/api/auth.py::read_me
  # ===========================================================================
  /auth/me:
    get:
      tags: [auth]
      operationId: readMe
      summary: 토큰이 가리키는 사용자 정보
      security: [{ HTTPBearer: [] }]
      responses:
        '200':
          description: 사용자 정보
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #19 POST /auth/email-verification/request — 204
  # 이메일 인증(backlog §1.4 P0-1/P0-3, 2.9.0 신설) — 코드를 (재)발급하고 메일로 보낸다.
  # ===========================================================================
  /auth/email-verification/request:
    post:
      tags: [auth]
      operationId: requestEmailVerification
      summary: 이메일 인증 코드를 (재)발급하고 메일로 보낸다
      security: [{ HTTPBearer: [] }]
      description: |
        6자리 숫자 코드를 발급해 로그인 이메일로 보낸다. 10분 뒤 만료되고, 최대 5회
        오답이면 그 코드는 무효화된다(재요청으로만 회복). 이미 있던 활성 코드는 이번
        발급으로 무효화된다 — **활성 코드는 항상 최대 하나**다.

        본문은 없다 — 대상 이메일은 토큰의 사용자로 고정이며 요청자가 고를 수 없다.
      responses:
        '204':
          description: 발급됨(메일 발송은 best-effort — 발송 실패도 204다. 재요청으로 회복한다)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 인증된 이메일이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                already_verified: { value: { detail: "이미 인증된 이메일입니다" } }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #20 POST /auth/email-verification/confirm — 204
  # 이메일 인증 — 발급된 코드를 확인한다.
  # ===========================================================================
  /auth/email-verification/confirm:
    post:
      tags: [auth]
      operationId: confirmEmailVerification
      summary: 발급된 인증 코드를 확인한다
      security: [{ HTTPBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailVerificationRequest' }
      responses:
        '204':
          description: 인증 완료 — 이후 `readMe.email_verified` 가 참이고 `createDocument` 가 열린다
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '400':
          description: |
            코드가 오답·만료·무효(5회 오답 소진) — **사유를 구분하지 않는다.** 어느
            갈래인지 알려주면 공격자가 "이 코드가 한때 존재했다"는 정보를 얻는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_code: { value: { detail: "인증 코드가 올바르지 않거나 만료되었습니다" } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 인증된 이메일이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                already_verified: { value: { detail: "이미 인증된 이메일입니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # 비밀번호 설정 (2.19.0 신설, backlog §1.4 다음 조각) — POST /auth/password
  # 소셜 전용(비밀번호 없는) 계정이 처음으로 비밀번호를 만드는 자리. 정본은 최상위
  # x-social-login.explicit_linking 「비밀번호 설정·재설정」 문단.
  # ===========================================================================
  /auth/password:
    post:
      tags: [auth]
      operationId: setPassword
      summary: 비밀번호 없는 계정에 새 비밀번호를 만든다
      security: [{ HTTPBearer: [] }]
      description: |
        소셜 로그인으로만 가입해 비밀번호가 없는 계정(`readMe.has_password: false`)이
        처음으로 비밀번호를 만드는 자리다.

        **이메일 인증을 요구한다(2026-09-06 정정).** 호출자가 이미 유효한 Bearer
        토큰으로 인증된 상태는 *그 소셜 계정*의 소유는 증명하지만, 네이버처럼 이메일이
        검증되지 않은 채로도 계정을 만들 수 있는 제공자가 있다(`readMe.email_verified:
        false`, `x-social-login.providers.x-note`). 그 상태에서 비밀번호를 허용하면
        아무도 소유를 증명하지 않은 이메일 주소로 "이메일+비밀번호" 로그인이 새로
        열린다 — 그래서 `createDocument`의 이메일 인증 게이트와 **같은 예외·같은
        문구**를 재사용한다(403, 아래).

        비밀번호를 **바꾸는** 자리가 아니다 — 이미 있으면 409로 거절하고
        `POST /auth/password-reset/{request,confirm}`(이메일 코드 재설정)을 안내한다.
        입력 규칙은 `SignupRequest.password`와 같다(최소 8자, `x-request-field-constraints`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204':
          description: 비밀번호가 만들어졌다
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            이메일 인증 전이다 — `createDocument` 403과 같은 예외
            (`EmailNotVerifiedException`)·같은 문구를 쓴다(같은 게이트를 재사용한다는
            뜻이지 새 갈래가 아니다). 남의 자원을 감추는 403이 아니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                email_not_verified: { value: { detail: "이메일 인증 후 문서를 변환할 수 있습니다" } }
        '409':
          description: 이미 비밀번호가 있는 계정이다 — 재설정을 이용하라고 안내한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                already_has_password:
                  value:
                    detail: "이미 비밀번호가 있는 계정입니다. 비밀번호를 바꾸려면 재설정을 이용하세요."
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 비밀번호 재설정 요청 (2.19.0 신설, backlog §1.4 다음 조각) —
  # POST /auth/password-reset/request
  # 인증 없이 호출된다 — 비밀번호를 잊은 사용자는 로그인할 수 없다.
  # ===========================================================================
  /auth/password-reset/request:
    post:
      tags: [auth]
      operationId: passwordResetRequest
      summary: 비밀번호 재설정 코드를 이메일로 보낸다
      security: []
      description: |
        **이메일 존재 여부·재요청 빈도와 무관하게 항상 202다** — 그 이메일의 계정이
        있으면 6자리 숫자 코드를 발급해 보내고, 없으면 아무 일도 하지 않는다. 60초
        재발송 쿨다운 안의 재요청도 조용히 202로 끝난다(429를 노출하지 않는다). 두
        신호 모두 "이 이메일에 계정이 있는가"를 드러내는 존재 확인 수단이 되므로,
        `x-auth.failure_uniformity`가 로그인 실패에 적용하는 것과 같은 원칙을 여기서는
        **응답 자체를 하나로 고정**하는 방식으로 지킨다.

        이메일당 재발송 쿨다운(60초)이 사실상의 빈도 제한이다 — IP 단위 요청 빈도
        제한은 이 계약의 범위 밖이다(backlog §1.4에 별도 과제로 기록).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: 접수됨 — 이메일이 존재하는지, 코드가 실제로 발급됐는지는 이 응답만으로 알 수 없다
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 비밀번호 재설정 확인 (2.19.0 신설, backlog §1.4 다음 조각) —
  # POST /auth/password-reset/confirm
  # 인증 없이 호출된다. 성공 응답은 login 과 같은 TokenResponse 다.
  # ===========================================================================
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: passwordResetConfirm
      summary: 재설정 코드를 확인하고 비밀번호를 바꾼 뒤 로그인 토큰을 발급한다
      security: []
      description: |
        코드가 유효하면(발급 후 10분 이내, 시도 5회 미만) 비밀번호를 새 값으로
        바꾸고 — **비밀번호가 없던 계정(소셜 전용)에도 이 자리에서 비밀번호가
        생긴다** — 코드를 소비 처리한 뒤 `readMe.email_verified`를 참으로 표시한다
        (코드를 이메일로 받았다는 사실 자체가 그 이메일 소유를 증명한다). 마지막으로
        `login`과 **완전히 같은 모양**의 `TokenResponse`를 발급한다.

        이메일이 존재하지 않거나, 코드가 오답·만료·시도 상한(5회) 소진이면 **전부
        같은 401**로 묶는다 — 사유를 가르면 공격자가 "이 이메일에 계정이 있다"거나
        "이 코드가 한때 존재했다"는 정보를 얻는다(`InvalidVerificationCodeException`
        이 이메일 인증 코드에 적용하는 것과 같은 원칙을 계정 존재 축까지 넓힌 것).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '200':
          description: 비밀번호가 바뀌고 토큰이 발급됨 — `login`과 같은 응답 모양
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: |
            재설정 코드가 오답·만료·시도 상한(5회) 소진이거나 이메일이 존재하지 않는다
            — 사유를 구분하지 않는다. 이 오퍼레이션은 Bearer 토큰을 검증하는 것이
            아니지만, "제시된 자격 증명이 유효하지 않다"는 성격이 같아 공유
            `Unauthorized` 컴포넌트와 같은 헤더 계약(`WWW-Authenticate: Bearer`)을
            쓴다 — 문구만 이 오퍼레이션 전용이다.
          headers:
            WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticateBearer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_reset_code:
                  value: { detail: "재설정 코드가 올바르지 않거나 만료되었습니다" }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #17 POST /auth/oauth/{provider}/start — 200
  # 소셜 로그인(backlog §1.4 P0-1, 2.8.0 신설) — Authorization Code 흐름의 시작.
  # 정본은 최상위 x-social-login. 번호가 #4보다 앞선 경로에 있는데도 17인 것은
  # #6/#16, #7-#9/#15 처럼 이 계약이 번호를 "추가된 순서"로 붙이지 "파일 순서"로
  # 붙이지 않기 때문이다(기존 관행 그대로 따른다 — 기존 번호를 밀지 않는다).
  # ===========================================================================
  /auth/oauth/{provider}/start:
    post:
      tags: [auth]
      operationId: oauthStart
      summary: 소셜 로그인 제공자 인가 URL을 만든다
      security: []          # 인증 불필요 — 로그인 자체를 시작하는 자리다
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao, naver]
          description: |
            오늘은 `google`·`kakao`·`naver` 셋이다(네이버는 2.15.0 신설). 이 enum
            밖의 어떤 값도 같은 422 하나로 응답한다(`x-social-login` 참고).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthStartRequest' }
      responses:
        '200':
          description: 인가 URL 발급됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStartResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            셋 중 하나 — 지원하지 않는 `provider`(**배열** `detail`, 스키마 층), 그
            제공자가 서버에 설정되지 않음(키 미설정, **문자열**), 허용 목록 밖
            `redirect_uri`(**문자열**). 정본은 `x-social-login.provider_state`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsupported_provider:
                  value: { detail: [{ loc: ["path", "provider"], msg: "Input should be a valid value", type: "value_parsing" }] }
                provider_not_configured: { value: { detail: "구글 로그인이 설정되지 않았습니다" } }
                kakao_provider_not_configured: { value: { detail: "카카오 로그인이 설정되지 않았습니다" } }
                naver_provider_not_configured: { value: { detail: "네이버 로그인이 설정되지 않았습니다" } }
                redirect_uri_not_allowed: { value: { detail: "허용되지 않은 redirect_uri 입니다" } }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # #18 POST /auth/oauth/{provider}/callback — 200
  # 소셜 로그인 — 인가 코드를 액세스 토큰으로 바꾼다. 성공 응답은 login 과 같다.
  # ===========================================================================
  /auth/oauth/{provider}/callback:
    post:
      tags: [auth]
      operationId: oauthCallback
      summary: 인가 코드를 액세스 토큰으로 바꾼다
      security: []
      description: |
        성공 응답은 `login` 과 **완전히 같은 모양**이다(`TokenResponse`) — 소셜 로그인도
        결국 우리 JWT 를 발급하는 로그인의 한 경로이기 때문이다.

        신원 연결 규칙(정본은 `x-social-login.account_linking`): 이미 연결된 신원이면
        로그인, 새 신원인데 같은 이메일의 계정이 이미 있으면(검증 여부와 무관) 409(자동
        연결하지 않는다 — 연결 흐름은 다음 작업 단위), 완전히 새로우면 계정 + 기본 작업 공간을
        만든다(가입과 같은 트랜잭션 원자성). **예외 — 미검증 이메일 제공자(네이버)는**
        이메일이 있으면 미검증인 채로도 계정을 만들고, 가입 뒤 이메일 인증 코드
        절차를 거친다(비밀번호 가입과 같은 흐름, 2026-09-05 결정).
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCallbackRequest' }
      responses:
        '200':
          description: 토큰 발급됨 — 기존 신원 로그인과 신규 계정 생성 모두 이 상태다
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: |
            `state` 가 없거나 만료·이미 사용됐거나 발급 당시의 `provider`/`redirect_uri`
            와 다르다. 사유를 구분하지 않는다 — CSRF 방지 토큰의 실패 사유를 알려주면
            탐색 단서가 된다(`x-auth.failure_uniformity` 와 같은 원칙, 정본은
            `x-social-login.state`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_state: { value: { detail: "요청이 만료되었거나 이미 사용되었습니다" } }
        '401':
          description: |
            제공자가 인가 코드를 거절했거나(만료·재사용·불일치) ID 토큰 검증에 실패했다
            (서명·`aud`·`iss`·`exp`·`nonce` 불일치). **문구는 새로 만들지 않는다** —
            `x-auth.failure_uniformity` 의 "유효하지 않음" 갈래 문구를 그대로 재사용한다.
            유효하지 않은 코드의 사유를 가르면 유효한 코드 형식을 탐색하는 단서가 된다는
            것이 로그인 실패와 같은 이유다.
          headers:
            WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticateBearer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                code_rejected: { value: { detail: "이메일 또는 비밀번호가 올바르지 않습니다" } }
        '409':
          description: 같은 이메일의 계정이 이미 있다(검증 여부와 무관) — 자동 연결하지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                email_already_linked:
                  value:
                    detail: "이미 같은 이메일로 가입된 계정이 있습니다. 이메일로 로그인한 뒤 연결해 주세요."
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            지원하지 않는 `provider`(**배열**, 스키마 층), 제공자 미설정, 또는 제공자가
            이메일을 주지 않았거나 검증하지 않았다(`email_verified: false`, 둘 다
            **문자열**, 도메인 층). **예외 — 네이버는 이메일이 있으면 미검증
            (`email_verified: false`)이어도 이 422 를 타지 않는다** — 미검증인 채로
            계정을 만들고 가입 뒤 이메일 인증 코드 절차로 이어간다(`naver_email_required`
            예시, `x-social-login.account_linking` 예외). 네이버도 이메일 자체가
            없으면 이 422 를 그대로 탄다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsupported_provider:
                  value: { detail: [{ loc: ["path", "provider"], msg: "Input should be a valid value", type: "value_parsing" }] }
                provider_not_configured: { value: { detail: "구글 로그인이 설정되지 않았습니다" } }
                kakao_provider_not_configured: { value: { detail: "카카오 로그인이 설정되지 않았습니다" } }
                naver_provider_not_configured: { value: { detail: "네이버 로그인이 설정되지 않았습니다" } }
                email_required: { value: { detail: "이메일 정보를 확인할 수 없습니다" } }
                naver_email_required:
                  value:
                    detail: "네이버 계정에 이메일이 없어 가입할 수 없습니다. 이메일로 가입하거나 다른 방법을 이용해 주세요"
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #21 POST /auth/oauth/{provider}/link/start — 200
  # 명시적 계정 연결(backlog §1.4, 2.10.0 신설) — 이미 로그인한 사용자가 자기 계정에
  # 소셜 신원을 이으려는 흐름의 시작. 정본은 최상위 x-social-login.explicit_linking.
  # ===========================================================================
  /auth/oauth/{provider}/link/start:
    post:
      tags: [auth]
      operationId: oauthLinkStart
      summary: 인증된 사용자의 계정에 소셜 신원을 이으려고 제공자 인가 URL을 만든다
      security: [{ HTTPBearer: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
          description: |
            `oauthStart` 와 같은 enum — 오늘은 `google`·`kakao`·`naver` 셋이다. 밖의
            값은 같은 422 배열로 간다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthStartRequest' }
      responses:
        '200':
          description: |
            인가 URL 발급됨. 응답 모양은 `oauthStart` 와 같다(`OAuthStartResponse`) —
            갈리는 것은 `state` 에 Bearer 토큰의 사용자 id 가 함께 실린다는 점뿐이고,
            그 사실은 응답 본문에 드러나지 않는다(`x-social-login.explicit_linking`).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStartResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            `oauthStart` 와 같은 세 갈래 — 지원하지 않는 `provider`(**배열**), 제공자
            미설정(**문자열**), 허용 목록 밖 `redirect_uri`(**문자열**). 정본은
            `x-social-login.provider_state`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsupported_provider:
                  value: { detail: [{ loc: ["path", "provider"], msg: "Input should be a valid value", type: "value_parsing" }] }
                provider_not_configured: { value: { detail: "구글 로그인이 설정되지 않았습니다" } }
                kakao_provider_not_configured: { value: { detail: "카카오 로그인이 설정되지 않았습니다" } }
                naver_provider_not_configured: { value: { detail: "네이버 로그인이 설정되지 않았습니다" } }
                redirect_uri_not_allowed: { value: { detail: "허용되지 않은 redirect_uri 입니다" } }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # #22 POST /auth/oauth/{provider}/link/callback — 204
  # 명시적 계정 연결 — 인가 코드를 검증하고 신원을 호출자 계정에 잇는다. 응답 본문이
  # 없다(로그인과 달리 토큰을 새로 발급하지 않는다 — 호출자는 이미 인증돼 있다).
  # ===========================================================================
  /auth/oauth/{provider}/link/callback:
    post:
      tags: [auth]
      operationId: oauthLinkCallback
      summary: 인가 코드를 검증하고 소셜 신원을 호출자 계정에 잇는다
      security: [{ HTTPBearer: [] }]
      description: |
        정본은 최상위 `x-social-login.explicit_linking`. 이메일 검증 여부나 계정
        이메일과의 일치를 요구하지 않는다 — 호출자가 이미 인증돼 있고, 코드 교환
        자체가 신원 소유를 증명한다. 검증된 이메일이 계정 이메일과 같고 계정이
        미인증이면 부수 효과로 `readMe.email_verified` 가 참이 된다(선택적 이득이지
        요구 조건은 아니다).

        같은 신원을 같은 사용자에 다시 연결하면 **멱등**하게 204다(새 행을 만들지
        않는다) — 사용자가 새로고침·재시도로 같은 요청을 중복해도 안전하다.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCallbackRequest' }
      responses:
        '204':
          description: 연결됨 — 이미 연결돼 있던 경우(멱등)도 포함이다.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '400':
          description: |
            `state` 가 없거나 만료·이미 사용됐거나 발급 당시의 `provider`/`redirect_uri`
            와 다르다 — `oauthCallback` 과 같은 갈래. **더해서** 로그인 흐름의 state가
            이 콜백에 왔거나(`user_id IS NULL`), 이 state 가 호출자가 아닌 다른 사용자
            앞으로 발급됐어도 같은 400 이다. 사유를 구분하지 않는다(정본은
            `x-social-login.state`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_state: { value: { detail: "요청이 만료되었거나 이미 사용되었습니다" } }
        '401':
          description: |
            **둘 중 하나** — Bearer 토큰이 없거나 무효(`components/responses/Unauthorized`
            와 같은 두 예시), 또는 제공자가 인가 코드를 거절했다(만료·재사용·불일치) ·
            ID 토큰 검증에 실패했다. 문구는 새로 만들지 않는다 —
            `x-auth.failure_uniformity` 의 "유효하지 않음" 갈래 문구를 그대로 재사용한다.
          headers:
            WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticateBearer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                no_header: { value: { detail: "인증이 필요합니다" } }
                invalid_token: { value: { detail: "이메일 또는 비밀번호가 올바르지 않습니다" } }
                code_rejected: { value: { detail: "이메일 또는 비밀번호가 올바르지 않습니다" } }
        '409':
          description: |
            둘 중 하나(정본은 `x-social-login.explicit_linking`) — 그 소셜 신원이 이미
            **다른** 사용자 계정에 연결돼 있다, 또는 호출자 계정이 이 제공자에 이미
            **다른** 신원을 연결했다(사용자당 제공자 하나 불변식). 같은 신원을 같은
            사용자에 다시 연결하는 것은 이 갈래가 아니다(멱등 204).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                identity_already_linked_to_other_user:
                  value: { detail: "이 구글 계정은 이미 다른 계정에 연결되어 있습니다" }
                provider_already_linked:
                  value: { detail: "이미 다른 구글 계정이 이 계정에 연결되어 있습니다" }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            지원하지 않는 `provider`(**배열**, 스키마 층) 또는 제공자 미설정(**문자열**).
            `oauthCallback` 과 달리 이메일 부재·미검증은 422 가 아니다 — 이 오퍼레이션은
            이메일 검증을 요구하지 않는다(위 설명).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsupported_provider:
                  value: { detail: [{ loc: ["path", "provider"], msg: "Input should be a valid value", type: "value_parsing" }] }
                provider_not_configured: { value: { detail: "구글 로그인이 설정되지 않았습니다" } }
                kakao_provider_not_configured: { value: { detail: "카카오 로그인이 설정되지 않았습니다" } }
                naver_provider_not_configured: { value: { detail: "네이버 로그인이 설정되지 않았습니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # 소셜 계정 연결 해제 (2.17.0 신설) — DELETE /auth/oauth/{provider}/link
  # backlog §1.4 다음 조각 — 2.10.0의 x-social-login.explicit_linking이 "연결 해제는
  # 이 변경 단위 밖"이라 적어 두었던 자리다. 정본은 그 절의 「연결 해제」 문단.
  # 제공자를 왕복하지 않는 순수 DB 조작이라(코드 교환도 state도 없다)
  # provider_not_configured 422 갈래가 없다 — link/start·link/callback과 갈리는 점이다.
  # ===========================================================================
  /auth/oauth/{provider}/link:
    delete:
      tags: [auth]
      operationId: oauthUnlink
      summary: 인증된 사용자의 계정에서 소셜 신원 연결을 끊는다
      security: [{ HTTPBearer: [] }]
      description: |
        정본은 최상위 `x-social-login.explicit_linking` 「연결 해제」 문단. 존재를
        숨기는 관행(다른 사용자의 자원과 같은 원칙 — 소유권 절)에 따라 호출자가 이
        제공자에 연결한 신원이 없으면(애초에 없었거나 이미 해제됐거나, 둘을 구분하지
        않는다) 404 하나로 응답한다 — 반복 호출도 이 갈래라 멱등하다.

        비밀번호가 없고(`UserResponse.has_password: false`) 이 신원이 호출자 계정의
        유일한 연결이면 409다 — 해제하면 계정에 로그인할 방법이 하나도 남지 않는다.
        비밀번호가 있거나 다른 신원이 남아 있으면 유일한 신원이어도 해제된다.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, kakao, naver] }
          description: |
            `oauthLinkStart`·`oauthLinkCallback`과 같은 enum — 오늘은 `google`·
            `kakao`·`naver` 셋이다. 밖의 값은 같은 422 배열로 간다.
      responses:
        '204':
          description: 해제됨.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 호출자가 이 제공자에 연결한 신원이 없다 — 존재를 숨긴다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                identity_not_found: { value: { detail: "연결된 소셜 계정을 찾을 수 없습니다" } }
        '409':
          description: 비밀번호가 없고 이 신원이 유일한 로그인 수단이다 — 해제를 거절한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                last_login_method:
                  value:
                    detail: "마지막 로그인 수단은 해제할 수 없습니다. 먼저 비밀번호를 만들거나 다른 소셜 계정을 연결하세요."
        '422':
          description: 지원하지 않는 `provider` — **배열**(스키마 층, 경로 값이 enum으로 해석되지 않는다).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unsupported_provider:
                  value: { detail: [{ loc: ["path", "provider"], msg: "Input should be a valid value", type: "value_parsing" }] }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # #4 POST /documents — 202 (201 아님 — 변환은 아직 시작 전)
  # 원본: app/api/documents.py::create_document
  # ===========================================================================
  /documents:
    post:
      tags: [documents]
      operationId: createDocument
      summary: 문서를 등록하고 변환을 요청한다 (접수만 한다)
      security: [{ HTTPBearer: [] }]
      description: |
        한 엔드포인트가 **두 가지 입력**을 받는다. `Content-Type`으로 가르며 비교는
        대소문자를 가리지 않는다(RFC 9110) — `Multipart/Form-Data`가 JSON 경로로
        새면 안 된다.

        1. `application/json` — 붙여넣기 모드 (`text`, `title?`, `workspace_id?`)
        2. `multipart/form-data` — 파일 모드 (`file`, `title?`, `workspace_id?`)

        **FastAPI 자동 생성 OpenAPI에는 이 요청 본문이 아예 없다.** 라우터가
        `Request`를 직접 읽어 파싱하기 때문이다(본문은 한 번만 읽을 수 있어 두 방식을
        동시에 선언할 수 없다). 아래 스키마는 라우터 코드를 읽고 손으로 적은 것이다.

        `workspace_id`를 주지 않으면 기본(가장 먼저 만든) 작업 공간에 담긴다.
        남의 `workspace_id`는 **404**다 — 빈 목록으로 답하면 남의 작업 공간 존재를
        확인하는 수단이 된다.

        검사 순서: **이메일 인증(403)** → 파일 크기(413) → 추출(422) → 본문 길이(422) →
        **작업 공간: 형식(422) 다음 소유권(404)** → **저장 정의역(422)** →
        **크레딧 예약(402)** → **저장과 큐 등록(한 트랜잭션)** → 커밋.
        작업 공간 확인이 저장보다 **먼저**여야 거절당한 업로드가 기본 공간에 남지 않는다.

        **크레딧 예약이 402 다(2.22.0 신설, 크레딧 계정 계획 §2 결정 4, C1).** 필요
        크레딧은 `ceil(char_count / 1000)`이고, `documents`/`conversions` insert **앞**
        같은 트랜잭션에서 예약한다 — 거절되면(집행 스위치 `easydoc.credits.enforced`
        가 켜진 상태에서 가용 잔액 부족) 문서가 아무 데도 생기지 않는다. 집행 스위치가
        꺼져 있으면 예약은 잔액과 무관하게 항상 성공하고 잔액이 음수로 기록된다.
        `X-Credit-Balance`(예약 직후 가용 잔액)는 스위치와 무관하게 202 응답에
        항상 실린다.

        **이메일 인증이 맨 앞이다(2.9.0 신설, backlog §1.4 P0-1/P0-3).** 본문을 전혀
        보지 않은 채로 거절한다 — 애초에 이 호출자가 할 수 없는 일이면 파일 크기·본문
        형식을 검증할 이유가 없다. 이메일/비밀번호로 가입했고 아직 인증 코드를 확인하지
        않은 계정이 대상이며, 소셜 로그인 계정과 V7 마이그레이션 시점 이전 기존 계정은
        가입·전환 시점에 이미 인증된 것으로 표시돼 이 갈래를 밟지 않는다. **이 오퍼레이션
        하나만** 이 게이트를 갖는다 — 로그인을 포함한 나머지는 미인증 사용자에게도 열려
        있다(정본은 위 "소유권 은닉" 절의 예외 항).

        **이 순서는 복합 결함에도 적용된다** (2026-08-20 신설, 근거 **G2**).
        결함이 둘 이상 겹친 요청에서 **관측되는 응답은 이 목록에서 가장 앞선 검사의 것**이다.
        예: 상한을 넘는 파일 + 형식이 잘못된 작업 공간 식별자 → **413이다**(422가 아니다).

        **왜 조항이 필요한가.** 종전 문면은 순서를 열거하면서 ⑴ 복합 결함에 적용되는지
        ⑵ `workspace_id`의 **형식** 검증이 어디에 있는지를 **둘 다 말하지 않았다**(소유권만
        적혀 있었다). 그 공백에서 두 리뷰가 같은 자리를 보고 반대 결론을 냈고(게이트 28 P-4),
        실제 구현에서는 **언어의 인자 평가 순서**가 관측되는 상태 코드를 정하고 있었다 —
        즉 호출 지점의 줄 순서를 바꾸는 리팩터링이 와이어 동작을 조용히 바꾼다.
        **계약이 말하지 않으면 그 순서는 아무도 지키지 않는다.**

        **요구의 내용**: 클라이언트가 재시도 판단을 할 수 있어야 한다. 형식 오류(422)가
        크기 초과(413)를 앞서면 클라이언트는 식별자를 고쳐 **상한 초과 본문을 다시 올리고**
        그제서야 413을 받는다 — 큰 본문을 두 번 보내게 만드는 순서이고, 이 목록이 애초에
        "싼 거절을 먼저"로 짜인 취지에 반한다. 형식 검증은 소유권 확인의 **선결**이므로
        같은 단계에 속하고, 따라서 크기·추출·본문 길이보다 **뒤다**.

        **계약이 정하는 것은 나가는 상태 코드뿐이다** — 크기 판정을 앞으로 끌어오든 형식
        파싱을 뒤로 미루든 구현 판단이다.

        **저장 정의역이 소유권 뒤에 오는 것은 의도다**(`x-stored-text-domain`). 그것은 요청
        필드의 형식 규칙이 아니라 **저장 경로의 정의역**이고, 판정하는 자리가 곧 봉인 직전이다.
        앞의 세 검사와 달리 트랜잭션 **안**에서 나므로 거절되면 함께 롤백된다 — 어느 쪽이든
        **거절된 업로드는 아무 데도 남지 않는다.**

        **저장과 큐 등록은 한 트랜잭션이고 커밋이 마지막이다.** 큐가 별도 저장소가 아니라
        같은 DB이므로 "문서·변환은 커밋됐는데 작업만 없다"는 상태가 **구조적으로 생기지
        않는다**. 등록이 실패하면 문서·변환도 함께 롤백되어 **아무것도 접수되지 않으며**,
        그때 나가는 것은 **500**(`InternalError`)이다 — 되돌릴 것이 없는 실패에 재시도
        신호(502)를 붙이지 않는다. 등록은 작업 id를 변환 id로 고정해 **멱등**하다.

        이 문단은 2026-08-20에 개정됐다. 옛 조항(*"큐 등록에 실패하면 이미 커밋된 변환을
        `failure_code = "EnqueueFailed"`로 표시한 뒤 502"*)은 **Redis/ARQ 전제**였고,
        PostgreSQL lease 큐에는 그 상태를 만들 무대가 없다 — `x-retired-responses` 참조.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTextRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentFileRequest' }
            encoding:
              file:
                contentType: >-
                  application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                  application/pdf,
                  application/hwp+zip
      responses:
        '202':
          description: |
            접수됨. 변환은 아직 시작되지 않았다 — `Location`이 가리키는 주소에서
            상태를 확인한다.
          headers:
            Location:
              description: |
                `/conversions/{conversion_id}` 형식. 클라이언트가 폴링 주소를 스스로
                조립하지 않아도 되게 하는 표준 헤더다. **CORS `expose_headers`에
                포함되어야 브라우저 JS가 읽을 수 있다.**
              required: true
              schema: { type: string, examples: ["/conversions/00000000-0000-4000-8000-000000000001"] }
            X-Credit-Balance:
              description: |
                크레딧 예약 **직후**의 가용 잔액(`balance − reserved`, 정수, 문자열로
                인코딩) — 크레딧 계정 계획 §2 결정 7(C1). 집행 스위치
                (`easydoc.credits.enforced`)와 무관하게 항상 실린다 — 화면이 잔액을
                안다. **스키마(`type`·`examples`)는 이 헤더가 나타나는 모든 자리에서
                문자열 그대로 같아야 한다**(`InsufficientCredits.headers.X-Credit-Balance`
                와, `Retry-After`가 이미 지키는 것과 같은 `ContractSpec.collectHeaders`
                전역 규약).
              required: true
              schema: { type: string, examples: ["0", "1"] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '403':
          description: |
            이메일 인증 전이다(2.9.0 신설) — 남의 자원을 감추는 403이 **아니다**. 위
            "소유권 은닉" 절 예외 항이 이 갈래와 아래 작업 공간 404(그쪽은 여전히 존재
            은닉이다)의 성격 차이를 정리한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                email_not_verified: { value: { detail: "이메일 인증 후 문서를 변환할 수 있습니다" } }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (존재 은닉 — 위 403과는 다른 자리다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found:
                  value: { detail: "작업 공간을 찾을 수 없습니다" }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            빈 본문 · 20,000자 초과 · 지원하지 않는 형식 · 추출 실패 ·
            **텍스트로 저장할 수 없는 문자**(`x-stored-text-domain`) · 잘못된 JSON ·
            `workspace_id` 형식 오류 · 필드 누락.
            앞의 것들은 문자열 detail, 마지막은 배열 detail이다.
            **이 목록도 `examples`도 전칭이 아니다** — 새 거절 갈래가 생기면 그 갈래의
            조항과 예시를 같은 변경 단위에서 더한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty_body:
                  value: { detail: "본문이 비어 있습니다" }
                too_long:
                  value: { detail: "현재는 20,000자 이하 문서만 변환할 수 있습니다" }
                unsupported_format:
                  value: { detail: "지원 형식: docx, pdf, hwpx, txt" }
                undecodable_text:
                  # 값의 정본은 `x-stored-text-domain.detail`이다. 여기 있는 것은 그 값의 예시이며,
                  # 계약 테스트는 두 자리가 같은지도 함께 본다 — 두 벌이 갈리면 오라클이 둘이 된다.
                  value: { detail: "문서 본문에 텍스트로 저장할 수 없는 문자가 있습니다" }
                missing_field:
                  value: { detail: [{ loc: ["body", "text"], msg: "Field required", type: "missing" }] }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

    # =========================================================================
    # #5 GET /documents — 200
    # 원본: app/api/documents.py::list_documents
    # =========================================================================
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 내 문서를 최신순으로 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        소유자 범위로만 조회한다. 총 개수는 싣지 않고 `has_more`로 다음 쪽 유무만
        알린다(전수 count는 목록 조회마다 비싸다).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: workspace_id
          in: query
          required: false
          description: 주면 그 작업 공간만 본다. 내 것이 아니면 404.
          schema:
            anyOf:
              - { type: string, format: uuid }
              - { type: 'null' }
      responses:
        '200':
          description: 문서 목록
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #6 DELETE /documents/{document_id} — 204
  # 원본: app/api/documents.py::delete_document
  # ===========================================================================
  /documents/{document_id}:
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: 문서와 변환 결과를 즉시 파기한다
      security: [{ HTTPBearer: [] }]
      description: |
        보존 기간(30일)을 기다리지 않는 즉시 파기 경로다(master-plan 3.2).
        복구 수단은 없다.

        **본문이 없다.** 지운 내용을 되돌려 주면 방금 파기한 문서를 다시 밖으로
        내보내는 셈이므로 삭제 확인은 상태 코드로만 한다.
        **캐시 금지 헤더는 붙는다** — 본문이 없어 캐시될 내용이 없다는 것은 사실이지만,
        2026-08-12 리더 판정으로 헤더 부착이 열거식 범위에서 전역 규칙으로 바뀌었다
        (`x-global-response-headers`). 종전 서술("붙이지 않는다")은 무효다.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: 파기됨. 본문 길이 0.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다 (403 아님 — 존재 자체를 숨긴다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "문서를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #16 GET /documents/{document_id}/source — 200
  # 원본 없음 — Python 참고 구현에 대응물이 없다(2.2.0 신설).
  # ===========================================================================
  /documents/{document_id}/source:
    get:
      tags: [documents]
      operationId: readDocumentSource
      summary: 추출된 원문을 다시 읽는다
      security: [{ HTTPBearer: [] }]
      description: |
        **검수 화면의 왼쪽 절반이다.** `DESIGN.md` §6.4가 원문과 AI 초안을 나란히 놓고
        비교하라고 정했는데, 원문은 문서 등록 시점 이후로 서버 응답에 실린 적이 없었다.
        그래서 붙여넣기 직후의 한 화면 밖(파일 업로드·기록 재진입·새로고침)에서는
        비교 대상 자체가 없었다. 이 오퍼레이션이 그 자리를 채운다.

        **`ConversionResponse`에 얹지 않고 경로를 새로 냈다.** 변환 조회는 완료를 기다리며
        폴링되는 자리라(2초 간격) 수천 자 본문을 매 폴링마다 실어 보내게 된다. 원문은
        문서 등록 시점에 확정되고 그 뒤 바뀌지 않으므로 **한 번만** 가져오면 된다.

        **여기 실리는 것은 파일에서 뽑아낸 텍스트다** — 원본 파일 바이트가 아니다.
        업로드 파일 자체를 내려받는 경로는 없고, 이 응답의 `char_count`는
        `DocumentListItem.char_count`와 같은 값이다(같은 열을 읽는다).

        **사용자가 올린 문서 원문이 그대로 실린다.** 저장된 원문은 줄바꿈만 저장 시점에
        통일되고(CRLF·단독 CR → LF) 그 밖에는 사용자가 올린 그대로다 — 이 서비스가
        다루는 문서는 공공기관이 이미 공개 배포한 안내문이라 개인정보를 담지 않는다(제품
        결정, 2026-09-07). 그래도 사용자 문서 본문이라 이 오퍼레이션이
        `x-private-response-headers.applies_to`에 있고 캐시 금지 헤더가 필수다.
        **새로 여는 표면은 아니다**: 같은 소유자에게
        `GET /conversions/{conversion_id}`가 이미 `easy_text`·`edited_text`로 변환 본문을
        돌려주고 있으므로, 원문 조회는 그보다 넓은 범주를 열지 않는다.

        **보존 기간(30일)이 지난 문서는 파기 전이라도 404다.** 파기는 워커 배치가 실제로
        행을 지울 때 일어나므로 만료 시각과 다음 배치 사이에 창이 열리는데, 이 응답은
        **문서 전문**이라 그 창에서 나가는 양이 다른 조회보다 크다 — 배치가 늦으면
        master-plan §3.2의 「30일 뒤 자동 삭제」가 가장 큰 데이터에서 먼저 깨진다.
        그래서 **이 오퍼레이션만** 조회 질의에 만료 술어를 함께 건다(다른 조회의 처분은
        `docs/kotlin-redevelopment-backlog.md` §1.1의 추후 개선 항목이다).
        즉시 파기된 문서도, 남의 문서도, 없는 식별자도 **같은 404다** — 넷이 구분되지 않아야
        존재 여부가 드러나지 않는다.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 추출된 원문
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **보존 기간이 지났다** (403 아님 — 존재 자체를 숨긴다).
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "문서를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #7 GET /conversions/{conversion_id} — 200
  # #8 PUT /conversions/{conversion_id} — 200
  # 원본: app/api/documents.py::read_conversion, ::update_conversion
  # ===========================================================================
  /conversions/{conversion_id}:
    parameters:
      - name: conversion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documents]
      operationId: readConversion
      summary: 변환 상태와 결과를 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        **변환된 문서 본문이 실린다** — 소유자 인증을
        통과한 조회에서만 나간다. 그래서 캐시 금지 헤더가 필수다.

        **보존 기간(30일)이 지난 문서의 변환은 파기 전이라도 404다.** 파기는 하루 한 번
        배치이므로(`RetentionPurgeScheduler`) 만료와 파기 사이의 창이 **최대 24시간**인데,
        이 응답은 그 창에서 문서 본문을 그대로 내준다 — 노출 크기는
        `GET /documents/{document_id}/source`보다 작아도 **범주는 같다.**
        완료(`done`) 전에는 `easy_text`·`edited_text`가 비어 있고
        상태와 `failure_code`, 그리고 **형식 셋**(`source_format`·`export_format`·
        `format_preservation`)만 나간다 — 형식 셋은 변환 결과가 아니라 문서 메타에서
        오므로 완료 여부와 무관하다(`ConversionResponse` 설명).
      responses:
        '200':
          description: 변환 상태·결과
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "변환 결과를 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [documents]
      operationId: updateConversion
      summary: 담당자 검수 수정본을 저장한다
      security: [{ HTTPBearer: [] }]
      description: |
        **AI 초안(`easy_text`)은 그대로 남는다.** 수정률 KPI(master-plan 7장)가 둘의
        차이를 재므로 초안을 덮어쓰면 기준선이 사라지고 되살릴 수 없다.

        아직 `done`이 아니면 **409**다 — 없는 것이 아니라 지금이 아닐 뿐이라는 뜻이며
        사용자가 취할 조치가 422와 다르다(기다렸다 다시).

        저장 전에 제어문자를 걷어내고 줄바꿈을 통일한(CRLF·단독 CR → LF) 뒤 빈 값·길이를
        판정한다 — "제어문자만 담긴 수정본"이 빈 수정본과 같은 취급을 받아야 하고, XML(docx)이
        담지 못하는 문자를 저장해 두면 내보내기 시점에야 터지기 때문이다.

        **응답은 GET과 같은 스키마다** — 따라서 캐시 금지 헤더도 GET과 같다
        (api-contract-freeze §2.7 해결 1: 2026-08-11에 구현을 고쳐 계약으로 확정).

        **보존 기간이 지난 문서의 변환은 404다** — GET과 같은 판정이며, 쓰기라서 더 중요하다:
        파기 대상 문서에 새 검수본을 쓰면 다음 배치가 방금 쓴 내용을 지운다. 판정은 저장 전
        잠금 질의가 지므로 **아무것도 쓰이지 않는다.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionReviewRequest' }
      responses:
        '200':
          description: 저장됨 (갱신된 조회 결과)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다** (GET과 같은 판정).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 아직 완료되지 않은 변환이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 수정할 수 있습니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 수정본이 비었거나 20,000자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty: { value: { detail: "수정본이 비어 있습니다" } }
                too_long: { value: { detail: "수정본은 20,000자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # P0-4 S4 (2.14.0) — POST /conversions/{conversion_id}/units/{source_unit_index}/reconvert
  # 원본: 신설 — 계획 docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md §4 결정 3
  # ===========================================================================
  /conversions/{conversion_id}/units/{source_unit_index}/reconvert:
    parameters:
      - name: conversion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: source_unit_index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
    post:
      tags: [documents]
      operationId: reconvertUnit
      summary: 원본 단위 하나를 다시 변환한 후보를 만든다
      security: [{ HTTPBearer: [] }]
      description: |
        **응답은 후보 텍스트뿐이고 변환 본문에는 아무것도 쓰지 않는다.** 채택은
        클라이언트 몫이다 — 이 오퍼레이션은 어떤 경우에도 `easy_text`·`edited_text`를
        바꾸지 않는다(계획 §4 결정 3).

        master-plan §3.2(2026-09-05 개정): *"자동 변환 1건 = LLM 호출 최대 2회(변경
        없음). 사용자 재변환은 문서당 호출 예산(기본 20회, 구성값) 안에서만 실행되며,
        예산은 요청이 아니라 실제 호출 수로 예약·정산한다."*

        **`easy_unit_indexes`·`easy_text_fingerprint`는 서버가 판정에 쓰지 않는다** —
        받은 값을 응답에 그대로 되울릴 뿐이다. 지문이 에디터 현재 본문과 다르면(사용자가
        응답을 기다리는 동안 편집했다) 클라이언트가 스스로 판단해 카드로만 보여준다 —
        서버는 그 판정에 관여하지 않는다.

        **입력은 원본 문서의 `source_unit_index`번째 줄이다.** 변환 경로(1차
        변환 → 조건부 보정 → 채택 판정)는 자동 변환과 완전히 같다 — 최대 1회 변환 +
        1회 조건부 보정.

        **예산은 요청이 아니라 LLM 호출 수로 센다.** 호출 전에 2회를 예약하고
        (`easydoc.reconversion.call-budget`, 기본 20 — 문서 1건당), 호출 뒤 실제
        사용량만 남기고 나머지를 환불한다. 예약이 실패하면(예산 소진) **LLM 호출은
        0회이고** 429다.

        **동기 처리다** — 단위 하나는 짧아 호출이 초 단위이고, 응답 시점까지 클라이언트가
        기다린다. 그래서 이 오퍼레이션만 502(`BadGateway`)를 선언한다(`x-retired-responses[0].reinstated_by`
        2.14.0 항목) — `oauthCallback`·`oauthLinkCallback`과 같이 동기로 하위 시스템
        (LLM 제공자)을 부르기 때문이다.

        **동시 실행에도 상한이 있다** — 이 프로세스가 지금 이미
        `easydoc.reconversion.concurrency`(기본 4)만큼의 재변환 LLM 호출을 진행 중이면 이
        호출은 시작되지 못하고 503이 난다(`ReconversionConcurrencyLimited`). 문서당 영구
        상한인 위 429 예산과는 다른 축이다 — 이쪽은 다른 재변환 호출이 끝나면 곧바로 풀리는
        트랜지언트 상태라 `Retry-After: 1`을 함께 낸다.

        **`easy_text_fingerprint` 형식은 서버가 검증한다** — 64자 소문자 16진수(SHA-256 hex)
        가 아니면 422다. 다만 그 지문이 **에디터의 실제 현재 본문과 일치하는지는 판정하지
        않는다**(위 문단, 계획 §4 결정 3) — 형식만 본다.

        **멱등하지 않다** — 매 호출이 새 결과를 만들고, 클라이언트는 자동으로 재시도하지
        않는다. 비용 방벽은 예약 하나뿐이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconvertUnitRequest' }
      responses:
        '200':
          description: 재변환 후보
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconvertUnitResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다** — `readConversion`과
            같은 판정(세 경우를 구분하지 않는다).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "변환 결과를 찾을 수 없습니다" } }
        '409':
          description: 아직 완료되지 않은 변환이다 — 재변환은 완료 뒤에만 할 수 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 다시 변환할 수 있습니다" } }
        '422':
          description: |
            `source_unit_index`가 원본 단위 범위를 벗어났거나, `easy_text_fingerprint`가
            64자 소문자 16진수(SHA-256 hex) 형식이 아니다 (둘 다 문자열 `detail`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                out_of_range: { value: { detail: "원본 단위 색인이 범위를 벗어났습니다" } }
                invalid_fingerprint: { value: { detail: "easy_text_fingerprint 형식이 올바르지 않습니다" } }
        '429': { $ref: '#/components/responses/ReconversionBudgetExhausted' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ReconversionConcurrencyLimited' }

  # ===========================================================================
  # #9 GET /conversions/{conversion_id}/export — 200 (파일)
  # 원본: app/api/documents.py::export_conversion
  # ===========================================================================
  /conversions/{conversion_id}/export:
    get:
      tags: [documents]
      operationId: exportConversion
      summary: 검수 완료 문서를 파일로 내려받는다
      security: [{ HTTPBearer: [] }]
      description: |
        본문 선택 규칙: 검수본이 있으면 그것이 최종본이고, 없으면 AI 초안이다
        (`edited_text ?? easy_text`). 이 서비스가 다루는 문서는 공공기관이 이미 공개
        배포한 안내문이라 개인정보를 담지 않으므로(제품 결정, 2026-09-07) 본문을 가리거나
        되돌리는 처리는 없다 — 저장된 값을 그대로 내보낸다.

        **결과 형식은 서버가 원본에서 정한다** (2.0.0 — `DESIGN.md` §6.5 「들어온 형식
        그대로 나간다」). 규칙과 처분의 정본은 최상위 `x-export-format-derivation`이고
        여기서 옮겨 적지 않는다. 요약하면: `format`을 **생략하면** 서버가
        `mapping[source_format]`으로 정하고, 주면 그 값과 **같아야** 한다.
        그 값은 이 변환의 `ConversionResponse.export_format`과 언제나 같다.

        **PDF는 다르다 — 서버가 정하지 않고 사용자가 고른다** (2.6.0 재결정,
        `x-export-format-derivation.choices`). 원본이 PDF면 `export_format`이 `null`이고
        `export_format_choices`가 `[docx, hwpx]`다. `format`은 그 배열 안의 값이어야
        하고(생략은 409), 원본을 여닫지 않은 채 **고른 형식의 새 문서**를 조립해 내보낸다
        — 원본 서식을 반영하는 것이 아니므로 `format_preservation`은 언제나
        `not_applicable`이다.

        409가 나는 경우가 넷이다:
          1. 아직 완료되지 않아 내보낼 결과가 없다
          2. `format`이 이 변환의 원본이 정한 형식과 다르다 (`enforcement.on_mismatch`)
          3. **PDF 원본인데 `format`을 생략했다** (`enforcement.on_absent_with_choices`)
             — 서버가 대신 고르지 않는다. 「내보낼 형식을 골라주세요」가 이 갈래의 문구다.
          4. **PDF 원본인데 `format`이 `export_format_choices` 밖이다**
             (`enforcement.on_choice_mismatch`) — 값 집합(`ExportFormat`) 안이어도 이
             원본이 고를 수 있는 형식이 아니면 거절한다.

          PDF가 아닌 원본에는 3·4가 일어나지 않는다 — `export_format_choices`가 비어
          있으므로 `format`을 생략하면 그대로 1·2의 갈래를 지난다(2.0.0부터의 동작과
          같다). `choices`도 없는 원본이 생기면(오늘은 없다) 그때는 옛 `no_exportable_format`
          409가 어떤 `format` 값도·생략도 통과시키지 않는다
          (`enforcement.on_null_mapping`, `x-export-format-derivation.x-null-is-not-unknown`).

        **1과 2·3·4의 순서**: 형식 판정이 먼저다. 2·3·4는 기다려도 바뀌지 않는 사실이고
        1은 시간이 푸는 사실이라, 결국 거절될 요청에 「끝난 뒤에 다시 오라」고 답하면
        틀린 행동을 권하게 된다. 소유 판정(404)은 그 전부보다 먼저다.

        **원본 파일 바이트가 남아 있으면 그 원본을 고쳐서 내보낸다** (2.1.0 —
        `DESIGN.md` §6.5 「원본 문서의 문단, 표, 이미지 위치에 검수한 쉬운 글을
        반영합니다」). 새 문서를 만들지 않으므로 본문에 없던 것 — 이미지, 표, 머리말·
        꼬리말, 스타일, 쪽 나눔 — 이 그대로 남는다. 무엇이 유지되고 무엇이 달라지는지는
        **내려받기 전에** `ConversionResponse.format_preservation`이 말하고, 그 판정과 이
        오퍼레이션은 같은 코드를 지난다. **PDF는 이 갈래가 아니다** — 위에서 말했듯 원본을
        열지 않고 새 문서를 만든다.

        **2.16.0부터 이 반영은 `segment_map`을 소비한다** (P0-4 S6,
        `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md` §10). 자리 맞춤의
        유도는 조회 응답의 `segment_map`과 **같은 함수**를 지난다 — 검수본 줄은 조회
        지도와 같은 규칙으로 빈 줄을 건너뛰어 다시 색인된다(projection). 지도를 쓰는
        한 화면이 보여 준 대응과 파일에 실제로 반영되는 대응이 갈릴 수 없다. `segment_map`
        이 놓은 합침(N:1)은 첫 원본 단위에 쓰고 나머지 본문 단위 중 다른 줄이 쓰지 않은
        것을 비우며, 나눔(1:N)은 원본 단위 문단 바로 뒤에 같은 속성의 새 문단을 끼워
        넣는다 — 둘 다 **대응을 확신한 반영**이라 그 자체로는 `format_preservation.status`
        를 `partial`로 떨어뜨리지 않는다(무슨 일이 있었는지는 `details`로만 말한다).
        지도의 모양(단위 수·색인의 완전성)이 이 원본·검수본과 맞지 않으면 지도를 버리고
        **차례 짝짓기로 떨어진다** — 이때 파일의 자리 맞춤은 오늘까지의 동작과 같지만
        `format_preservation`은 `partial`로 떨어지고 `details`가 그 사실을 말한다. 지도가
        없는 원본(`segment_map: null`, 원문·본문 중 하나를 지금 읽을 수 없는 경우)도 같은
        차례 짝짓기로 떨어진다.

        원본이 없는 문서(붙여넣기 · `document_originals` 표가 서기 전 업로드)는 예전처럼
        본문 문자열로 새 문서를 만든다. 그 갈래의 판정이 `not_applicable`이고 영구히 참이다.

        **보존 기간이 지난 문서의 변환은 404다** — 조회와 **같은 질의**가 그 판정을 지므로
        두 오퍼레이션이 갈릴 수 없다. 이 응답은 검수·변환을 거친 최종본이라
        만료 창에서 나가면 안 되는 값이다.

        **저장된 원본을 열 수 없으면 500이다.** 텍스트 전용 파일로 조용히 대체하지
        않는다(§6.5). 409가 아닌 이유: 업로드 때 같은 바이트가 파서를 지나갔으므로(그래야
        변환이 섰다) 지금 열리지 않는 것은 사용자가 고칠 수 있는 입력 문제도, 기다리면
        달라지는 상태도 아니라 **서버가 보관한 바이트의 문제**다. 그 변환의
        `format_preservation.status`는 같은 사유로 이미 `failed`다.
      parameters:
        - name: conversion_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: false
          description: |
            **선택 파라미터다** (2.0.0에서 필수를 풀었다 —
            `x-export-format-derivation.enforcement`가 정본이다). PDF 원본은 예외다 —
            아래 참고.

            - **생략하면** 서버가 원본에서 정한다. 이것이 기본 경로다.
            - **주면** 이 변환의 `ConversionResponse.export_format`과 같아야 한다.
              값 집합 안이지만 다른 값이면 **409**다(422가 아니다 —
              `x-why-409-and-not-422`).
            - 목록에 없는 값(`pdf`·구버전 `hwp` 등)은 그대로 **422**다. **빈 값
              (`?format=`)도 여기다** — 값을 주지 않은 것이 아니라 목록에 없는 값을 준 것이다.

            **누락은 더 이상 422가 아니다.** 그 갈래는 폐기됐다(`x-superseded`) —
            되살리면 내보내기가 다시 「클라이언트가 형식을 고르는」 오퍼레이션이 된다.

            **PDF 원본(2.6.0)**: `ConversionResponse.export_format`이 `null`이라 위 규칙이
            적용되지 않는다. 대신 `export_format_choices`(`[docx, hwpx]`) 안의 값이어야
            한다 — **생략은 여기서도 409**다(서버가 대신 고르지 않는다), 배열 밖의 값 집합
            안 값(예: `txt`)도 409다.
          schema: { $ref: '#/components/schemas/ExportFormat' }
      responses:
        '200':
          description: |
            파일 바이트. 미디어 타입은 `format`에 따라 셋 중 하나다.
            `txt`의 `charset=utf-8`은 필수다 — 없으면 브라우저가 로캘 기본 인코딩으로
            열어 한글이 깨진다(BOM 없이 UTF-8로 내보내기 때문).
          headers:
            Content-Disposition:
              description: |
                `attachment; filename="easy-read.<ext>"; filename*=UTF-8''<percent-encoded>`

                ASCII 대체 이름과 RFC 5987 확장을 **둘 다** 보낸다. HTTP 헤더 값은
                latin-1만 담을 수 있어 한글 이름은 `filename*`에만 실린다.
                React `parseFilename`이 `filename\*=UTF-8''` 부분만 읽으므로 이 부분이
                빠지면 다운로드는 되고 파일명만 깨진다.
                **CORS `expose_headers`에 포함되어야 브라우저 JS가 읽을 수 있다.**

                **`filename*`의 이름은 `<문서 제목>-쉬운글.<ext>`다** (2.1.0 — `DESIGN.md`
                §6.5 「원본 제목을 기반으로 하되 `-쉬운글`을 덧붙여 원본 파일과 구분한다」).
                원본 서식을 유지해 내보내면 결과가 원본과 **같은 형식**이라, 표식이 없으면
                내려받기 폴더에서 원본과 결과를 가릴 수 없다. 제목이 정제 후 비면 표식 없이
                기본 이름 `쉬운 글.<ext>`다 — 구분할 원본 제목이 애초에 없다.
                `filename`(ASCII 대체)은 계산되지 않는 고정값 `easy-read.<ext>`로 남는다.

                **이 헤더는 `components/headers`로 옮기지 않는다** (2026-08-19 판정).
                값이 문서마다 계산되므로 그쪽 갈래가 요구하는 `schema.const`를 가질 수
                없고, 컴포넌트화하려면 "컴포넌트 갈래는 전부 `const`"라는 탐지 조항을
                약화시켜야 한다 — 탐지를 넓혀 닫은 자리를 구조 변경으로 되돌리는 셈이다.
                재사용처도 이 응답 하나뿐이라 컴포넌트가 줄여 줄 중복이 없다.
                인라인 갈래의 조용한 무시는 파서 쪽에서 fail-closed로 닫혔다.
              required: true
              x-filename-charset:
                ground: G2
                measured_on: "`filename*`의 퍼센트 디코딩 결과 — 인코딩된 표기가 아니라 사용자 파일 시스템에 닿는 이름"
                forbidden: '[\u0000-\u001F\u007F-\u009F"\\/:*?<>|]'
                check: |
                  **`filename*`을 퍼센트 디코딩한 값에 `forbidden`의 문자가 하나도 없다.**
                  대상은 제어문자 세 블록(C0·DEL·C1)과 경로 구분자·따옴표·윈도우 예약 문자다.
                  파일명의 바탕은 문서 제목이고 그 제목은 사용자가 적어 준 값이므로
                  (`x-title-policy` — 본문·파일 이름 유도는 폐기됐다) 그대로 쓰면
                  디렉터리를 벗어나거나 저장이 실패하는 이름이 되고, C1은 눈에 보이지
                  않으면서 일부 터미널·파일 관리자에서 제어 시퀀스로 해석된다.
                  퍼센트 인코딩은 이것을 막아 주지 않는다 — 인코딩은 전송만 안전하게 할 뿐
                  디코딩한 이름은 그대로 남는다.
                rationale: |
                  **왜 이 조항이 여기 새로 생겼나 (근거 G2).**
                  계획 §5 Phase 2의 종료 조건 "내보내기 파일명·`Content-Disposition` 생성
                  포팅"(원장 L348)이 요구하는 성질인데, 그 요구의 일부(C1 블록과 윈도우
                  예약 문자)가 **어느 단언에도 걸리지 않는다**는 것이 게이트 14의 F-3·F-4와
                  게이트 16 후속 R-1의 내용이었고, 마감이 "Phase 4 착수 전"이었다.
                  구현(`backend-kotlin/core/.../easyread/Export.kt`)은 이미 이 성질을
                  만족한다 — 없던 것은 **기계가 읽을 수 있는 오라클**이고, 그것이 없으면
                  경계 테스트가 금지 집합을 코드에 복제하게 된다(X-J2가 금지하는 형태).

                  **이 조항이 정하는 것은 나간 바이트뿐이다.** 어느 층에서 걷어내는지,
                  지우는지 공백으로 바꾸는지는 구현 판단이다. `forbidden`은 계약이
                  오라클이고 `Export.kt`의 집합은 구현이다 — 둘이 갈리면 경계 테스트가
                  빨강으로 알린다(그것이 이 조항을 계약에 두는 이유다).

                  **파일명 fixture 커버리지(F-3·F-4의 parity 몫)는 이 조항이 닫지 않는다.**
                  `.claude/skills/python-kotlin-parity/scripts/`의 손열거는 그 레인 소관이다.
                x-openapi-expressibility: |
                  JSON Schema의 `pattern`으로는 표현되지 않는다 — 제약이 헤더 값 전체가
                  아니라 **한 파라미터를 퍼센트 디코딩한 뒤의** 문자열에 걸리기 때문이다.
                  그래서 `schema` 키워드가 아니라 이 확장 절에 둔다
                  (`x-request-field-constraints.x-openapi-expressibility`와 같은 판단).
              schema:
                type: string
                examples:
                  - "attachment; filename=\"easy-read.docx\"; filename*=UTF-8''%EC%89%AC%EC%9A%B4%20%EA%B8%80.docx"
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            text/plain; charset=utf-8:
              schema: { type: string, format: binary }
            application/hwp+zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            내보낼 수 없는 변환이다 — 완료 전 · 원본과 다른 형식 요청 ·
            선택지 있는 원본(PDF)에서 형식 생략·선택지 밖 요청 · 내보낼 형식 자체가 없음.
            다섯의 구분과 순서는 `description`에 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 내려받을 수 있습니다" } }
                format_mismatch:
                  value: { detail: "원본과 같은 형식으로만 내려받을 수 있습니다" }
                export_format_choice_required:
                  value: { detail: "내보낼 형식을 골라주세요 (docx·hwpx)" }
                export_format_choice_mismatch:
                  value: { detail: "고를 수 있는 형식으로만 내려받을 수 있습니다" }
                no_exportable_format:
                  value: { detail: "이 문서는 내려받을 수 있는 형식이 없습니다" }
        '422':
          description: |
            `format`이 `ExportFormat` 밖의 값이다. **누락은 여기가 아니다** —
            생략은 2.0.0부터 기본 경로이고, 원본과 다른 값은 409다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #15 PUT /conversions/{conversion_id}/feedback — 200
  # 1.5.0 신설(2026-08-26). 파일럿 게이트 ① 판정 수단 — Python 참고 구현에 대응물이 없다.
  #
  # **번호는 자리가 아니라 id다.** 이 오퍼레이션은 목록 중간(#9 다음)에 놓이지만 번호는
  # 가장 큰 수를 잇는다 — 뒤 번호를 밀면 이 파일과 리뷰 기록이 이미 인용한 서수
  # (예: `x-stored-text-domain`의 「마감은 #8을 구현하는 단위다」)가 조용히 다른 것을
  # 가리키게 된다. 다시 세지 않고 안정 id를 주는 것이 게이트 28 P-5의 처방이다.
  # ===========================================================================
  /conversions/{conversion_id}/feedback:
    parameters:
      - name: conversion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [documents]
      operationId: saveConversionFeedback
      summary: 검수 담당자의 파일럿 피드백을 저장한다
      security: [{ HTTPBearer: [] }]
      description: |
        검수 화면 하단 폼의 제출을 받는다 — 배포 의향 · 품질 만족도 · 이번 건 소요 시간 ·
        자유 의견(선택). **게이트 ①의 유일한 수기 입력**이고 나머지 지표는 시스템이 남긴다
        (`docs/pilot-runbook.md` 「기록 방법」).

        **POST가 아니라 PUT인 이유: 한 변환의 피드백은 1건이고 다시 보내면 덮어쓴다.**
        자원이 변환당 하나로 정해져 있어 만드는 자리와 고치는 자리가 같고, 그것이 멱등
        upsert다. 같은 본문을 두 번 보내도 결과가 같아야 하는 것은 취향이 아니다 —
        폼 재제출·네트워크 재시도로 한 변환에 두 건이 쌓이면 게이트 ① 판정의 **분모**
        (10건)가 조용히 부풀고, 그 오염은 집계 시점에 되돌릴 수 없다.

        **아직 `done`이 아니면 409다** — `PUT /conversions/{conversion_id}`와 **같은 사유,
        같은 문구**다. 결과를 보지 않은 채 품질을 답할 수 없으므로 없는 것이 아니라 지금이
        아닐 뿐이고, 사용자가 취할 조치가 422와 다르다(기다렸다 다시).

        **`get`을 두지 않는다.** 재방문 시 이전 값을 폼에 되살리는 것은 이번 범위 밖이다.
        필요해지면 **같은 경로에 `get`을 더한다** — 다른 경로를 새로 만들지 않는다.

        **저장 수명이 문서와 분리돼 있다.** 문서·변환은 보존 기간이 지나면 파기되지만
        (`x-input-limits.retention_days`) 게이트 판정 근거는 그 뒤에 읽는다
        (`docs/pilot-runbook.md` 「집계」). 계약이 정하는 것은 이 오퍼레이션이 문서 파기
        뒤에도 의미를 갖는다는 것뿐이고, 저장 형태는 구현 판단이다.

        **그 분리는 「이미 낸 의견이 남는다」는 뜻이지 「만료 뒤에도 새로 낼 수 있다」는
        뜻이 아니다.** 두 문장을 섞어 읽지 마라 — **보존 기간이 지난 문서의 변환에는
        피드백을 낼 수 없다(404).** 이 저장은 수정률 지표를 계산하려고 변환 본문
        (`easy_text`·`edited_text`)을 **복호화해서 읽기** 때문이다. 만료 뒤에도 허용하면
        「30일 뒤 자동 삭제」(master-plan §3.2) 뒤에 본문 복호화가 계속 열려 있게 되고,
        그것은 2.3.0이 조회·내보내기·검수 저장을 닫은 것과 **같은 이유**다.
        이미 저장된 행은 그대로 남는다 — 닫히는 것은 **새 제출**뿐이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionFeedbackRequest' }
      responses:
        '200':
          description: |
            저장됨. 처음 낸 것이든 덮어쓴 것이든 **같은 200**이다 — 클라이언트가 두 경우를
            구분해서 할 일이 없고, 구분해 주면 "이미 냈는가"가 화면 분기로 새어 들어온다.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionFeedbackResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            없거나, 내 것이 아니거나, **문서의 보존 기간이 지났다.**
            셋이 같은 응답인 것이 조항이다 — 위 `description`의 「분리」 문단이 그 사유다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "변환 결과를 찾을 수 없습니다" } }
        '409':
          description: 아직 완료되지 않은 변환이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_done: { value: { detail: "변환이 끝난 뒤에 수정할 수 있습니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            필수 필드 누락은 **배열** detail(스키마 층)이고, 값 범위 밖·자유 의견 길이 초과는
            **문자열** detail(서비스 층)이다. 두 갈래의 경계는 `ValidationFailed`가 정본이며
            이 오퍼레이션이 새 경계를 만들지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                field_missing:
                  value: { detail: [{ loc: ["body", "publish_intent"], msg: "Field required", type: "missing" }] }
                score_out_of_range: { value: { detail: "품질 만족도는 1에서 5 사이의 값이어야 합니다" } }
                minutes_out_of_range: { value: { detail: "소요 시간은 0에서 600분 사이의 값이어야 합니다" } }
                comment_too_long: { value: { detail: "자유 의견은 500자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #10 GET /workspaces — 200
  # #11 POST /workspaces — 201
  # 원본: app/api/workspaces.py
  # ===========================================================================
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: 내 작업 공간을 만든 순서대로 조회한다
      security: [{ HTTPBearer: [] }]
      description: |
        **첫 번째 항목이 기본 작업 공간이다**(가장 먼저 만든 것). 이 순서가 계약이다 —
        Kotlin이 정렬을 바꾸면 업로드 기본 대상이 달라진다.
        문서 수(`document_count`)는 목록 응답에만 실린다.
      responses:
        '200':
          description: 작업 공간 목록
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: 작업 공간을 만든다
      security: [{ HTTPBearer: [] }]
      description: |
        이름은 제어문자를 걷어내고 앞뒤 공백을 턴 뒤 검사한다. 빈 이름·50자 초과는 422.
        상한을 넘는 이름은 자르지 않고 **거절한다** — 사용자가 직접 적은 이름을
        말없이 자르면 그 사람이 담은 뜻이 사라진다 — 사용자가 준 **문서 제목**을 255자에서
        자르는 것과 다른 판단이다(그쪽은 목록에 보일 이름일 뿐이라 업로드를 통째로
        실패시킬 이유가 없다. `x-title-policy`).
        같은 사용자 안에서 이름은 유일하다(`uq_workspaces_user_id_name`) — 중복은 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceNameRequest' }
      responses:
        '201':
          description: 생성됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 같은 이름의 작업 공간이 이미 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 이름이 비었거나 50자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty: { value: { detail: "작업 공간 이름을 입력해 주세요" } }
                too_long: { value: { detail: "작업 공간 이름은 50자 이하여야 합니다" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #12 PATCH /workspaces/{workspace_id} — 200 (PUT 아님)
  # #13 DELETE /workspaces/{workspace_id} — 204
  # 원본: app/api/workspaces.py
  # ===========================================================================
  /workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: 작업 공간 이름을 바꾼다
      security: [{ HTTPBearer: [] }]
      description: |
        **PUT이 아니라 PATCH다.** 바꾸는 것이 이름 하나뿐이라, 전체 표현을 보내는 PUT은
        클라이언트가 나머지 필드(만든 시각 등)까지 실어 보내야 한다는 뜻이 된다.
        메서드를 바꾸면 React `renameWorkspace`가 그대로 깨진다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceNameRequest' }
      responses:
        '200':
          description: 이름 변경됨
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '409':
          description: 같은 이름의 작업 공간이 이미 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 이름이 비었거나 50자를 넘었다 / 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: 빈 작업 공간을 지운다
      security: [{ HTTPBearer: [] }]
      description: |
        **React에 호출부가 없다** — UI 범위 밖이라 의도적으로 비워 둔 것이다
        (`frontend/src/api/client.ts`의 `renameWorkspace` 주석, `app/api/workspaces.py`
        모듈 docstring). 계약에는 포함하되 Phase 6 타입 교체 후에도 호출 래퍼를
        추가하지 않는다.

        409가 나는 경우가 둘이다(계획 §2.3):
          1. 문서가 남아 있다 — 되돌릴 수 없는 파기를 "정리"라는 이름으로 실행하게
             두지 않고 무엇이 사라지는지 사용자가 먼저 보게 한다
          2. 마지막 남은 작업 공간이다 — 전부 지우면 업로드가 갈 곳을 잃고
             "기본 작업 공간"이라는 기준도 가리킬 대상이 없어진다

        **둘 다 해당하면 2(마지막 남은 작업 공간)를 낸다** — 2026-08-19 신설, 근거 G2.
        겹치는 상태(작업 공간이 하나뿐이고 그 안에 문서가 있다)는 드문 자리가 아니라
        **가입 후 문서를 올리고 두 번째 공간을 만들지 않은 모든 사용자**의 상태다.
        1을 먼저 내면 사용자는 안내대로 문서를 지운 뒤 **다시** 거절당하고, 그때는 1이
        막겠다고 적은 되돌릴 수 없는 파기가 **그 안내를 따랐기 때문에** 이미 일어난
        뒤다. 2를 먼저 내면 문서를 비워도 결과가 바뀌지 않으므로 사용자는 헛된 파기
        대신 새 작업 공간을 만드는 쪽으로 안내된다.
        계약이 침묵하면 두 순서가 다 허용되는데, 그중 하나가 이 조항이 지키겠다고 적은
        것을 정확히 깨뜨린다 — 그래서 침묵이 맞지 않다.
      responses:
        '204':
          description: 삭제됨. 본문 길이 0.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 것이 아니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 문서가 남아 있거나 마지막 남은 작업 공간이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                has_documents:
                  value: { detail: "작업 공간에 문서가 남아 있습니다 — 먼저 비운 뒤 삭제해 주세요" }
                last_one:
                  value: { detail: "작업 공간은 적어도 하나 있어야 합니다" }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # 워크스페이스 사용량 집계 (2.21.0 신설, U2) — GET /workspaces/{workspace_id}/usage
  # 정본: docs/plans/2026-09-07-usage-ledger-and-report.md §2 결정 5-6.
  # `documents`(등록 기준)·`llm_calls`(호출 기준, U1) 두 원장을 워크스페이스·기간으로
  # 집계한다. 크레딧 잔액·차감은 이 묶음 밖이다(§5 범위 밖) — 이 오퍼레이션은 조회뿐이다.
  # ===========================================================================
  /workspaces/{workspace_id}/usage:
    get:
      tags: [workspaces]
      operationId: readWorkspaceUsage
      summary: 워크스페이스의 기간별 사용량을 집계한다
      security: [{ HTTPBearer: [] }]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: |
            `YYYY-MM-DD`. 생략하면 `easydoc.usage.zone`(기본 `Asia/Seoul`) 기준 **이번 달
            1일**이다.

            형식이 `YYYY-MM-DD`로 읽히지 않으면 422(문자열 detail) — 스키마 제약이 아니라
            서비스 층의 형식 규칙이라 `ValidationFailed`의 **문자열** 갈래다
            (`x-request-field-constraints`가 아니라 이 오퍼레이션 고유의 날짜 형식 규칙,
            대표 자리는 `POST /documents`의 `workspace_id` 형식 오류와 같은 경계).
          schema: { type: string, examples: ["2026-09-01"] }
        - name: to
          in: query
          required: false
          description: |
            `YYYY-MM-DD`, **포함** 상한이다(그 날짜 `zone` 자정 직전까지 포함, 다음날
            자정은 제외). 생략하면 `zone` 기준 **오늘**이다.

            `to`가 `from`보다 앞이거나(422) 구간이 366일을 넘으면(422) 둘 다 문자열
            detail이다 — 형식 오류와 같은 이유로 서비스 층 규칙이다.
          schema: { type: string, examples: ["2026-09-07"] }
      description: |
        **문서 수·문자 수·크레딧(문서별 `ceil(char_count/1000)`의 합)은 `documents` 표를
        참조하지 않는다(2026-09-08 리뷰 정정).** 그 기간에 **완료된 LLM 호출이 하나라도
        있던**(`llm_calls.called_at` 기준, `document_id`로 distinct) 문서만 센다 — 등록만
        되고 한 번도 변환되지 않은 문서는 비용도 크레딧도 쓰지 않았으므로 포함되지
        않는다. 값의 출처는 `llm_calls.document_char_count`(그 호출이 속한 문서의
        `documents.char_count` 스냅샷)이며, 문서가 보존 만료·삭제로 없어져도 이 값은
        바뀌지 않는다 — 청구 근거를 남기려고 만든 원장이 문서 삭제로 스스로의 근거를
        잃으면 안 되기 때문이다(U1 계획 §2 결정 1, 2026-09-08 리뷰로 3차 정정).

        LLM 호출 수·토큰·예상 비용도 **호출이 끝난 시각**(`llm_calls.called_at`) 기준이며,
        원장의 `char_count`(호출별 마스킹 입력 길이 — `document_char_count`와는 다른 값)는
        어디에도 합산하지 않는다 — 변환·보정 두 행이 문서 전체 길이를 각자 담아 합치면
        중복이 된다.

        **예상 비용은 알려진 호출만 더한다.** 단가가 설정되지 않아 비용을 모르는 호출은
        합계에 0으로 섞이지 않고 `cost_unknown_calls`로만 센다(계획 §2 결정 4). 그
        기간에 알려진 비용이 하나도 없으면 `estimated_cost_usd`는 `null`이다(문자열
        `"0"`이 아니다 — 「모른다」와 「0달러다」는 다른 사실이다).

        **검증 순서.** `from`/`to` 형식·범위(위 파라미터 설명)가 먼저 걸리고(422), 그
        다음이 소유 판정(404)이다 — 날짜를 읽지 못하면 워크스페이스 조회 자체를 시작할
        이유가 없다. 이 순서는 `exportConversion`의 "소유 판정이 먼저"와 다른 자리다 —
        그쪽은 형식이 이미 유효한 값들 사이의 우선순위였고, 여기는 값을 아직 읽지도
        못한 단계다.

        **워크스페이스가 삭제되며 `llm_calls.workspace_id`가 `SET NULL`된 행은 이
        집계 밖이다** — 그 행은 더 이상 어느 워크스페이스에도 속하지 않는다(U1 계획
        §2 결정 1 「보존 결정의 정정」). 사용자 단위로 그 행까지 모으는 리포트는 이
        오퍼레이션이 아니라 U3(운영 리포트, `usage-report` 프로필)의 몫이다.
      responses:
        '200':
          description: 집계 결과
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceUsageResponse' }
              examples:
                with_cost:
                  value:
                    documents: 12
                    characters: 18000
                    credits: 18
                    llm_calls: 20
                    input_tokens: 40000
                    output_tokens: 12000
                    estimated_cost_usd: "0.184000"
                    cost_unknown_calls: 0
                    by_purpose:
                      - { purpose: convert, llm_calls: 12, input_tokens: 24000, output_tokens: 8000, estimated_cost_usd: "0.112000" }
                      - { purpose: repair, llm_calls: 8, input_tokens: 16000, output_tokens: 4000, estimated_cost_usd: "0.072000" }
                cost_unknown:
                  value:
                    documents: 1
                    characters: 500
                    credits: 1
                    llm_calls: 1
                    input_tokens: 800
                    output_tokens: 200
                    estimated_cost_usd: null
                    cost_unknown_calls: 1
                    by_purpose:
                      - { purpose: convert, llm_calls: 1, input_tokens: 800, output_tokens: 200, estimated_cost_usd: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (존재 은닉)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '422':
          description: |
            네 가지가 이 상태로 나간다.
              1. `from`·`to` 형식 오류(서비스 층 규칙) → 문자열 detail
              2. `to`가 `from`보다 앞(서비스 층 규칙) → 문자열 detail
              3. 구간이 366일 초과(서비스 층 규칙) → 문자열 detail
              4. **빈 값**(`?from=`처럼 값 자체가 없는 자리, 공백뿐인 값 포함) → **배열**
                 detail — 이 경우만 스키마 층이다. `from`·`to`는 자유 형식 문자열이라
                 Spring이 변환에 실패하지 않는 만큼, 값 자체가 없는 자리는
                 `TypedValueSlotInterceptor`가 다른 타입의 값 자리와 같은 방식으로
                 거절한다(형식 오류처럼 "값은 있는데 읽을 수 없다"가 아니라 "읽을 값
                 자체가 없다"는 차이 — `ValidationFailed`의 스키마/서비스 경계 참고).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                malformed_date: { value: { detail: "from·to는 YYYY-MM-DD 형식이어야 합니다" } }
                to_before_from: { value: { detail: "to는 from보다 앞일 수 없습니다" } }
                range_too_wide: { value: { detail: "조회 기간은 366일을 넘을 수 없습니다" } }
                blank_value:
                  value:
                    detail:
                      - { loc: ["query", "from"], msg: "Input should be a valid string", type: "string_parsing" }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #24 GET /workspaces/{workspace_id}/credits — 200 (크레딧 계정 계획 §2 결정 7, 2.22.0 신설)
  # 워크스페이스 크레딧 잔액·예약·최근 거래 50건을 조회한다. C1.
  # ===========================================================================
  /workspaces/{workspace_id}/credits:
    get:
      tags: [workspaces]
      operationId: readWorkspaceCredits
      summary: 워크스페이스의 크레딧 계정을 조회한다
      security: [{ HTTPBearer: [] }]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        **가용 = balance − reserved.** `balance`는 부여 합계 − 소비 합계, `reserved`는
        등록됐지만 아직 끝나지 않은 문서의 몫이다(크레딧 계정 계획
        `docs/plans/2026-09-07-credit-accounts.md` §2 결정 2).

        `enforced`는 `easydoc.credits.enforced`(기본 `false`) 그대로다 — 꺼져 있으면
        `createDocument`의 예약이 잔액과 무관하게 항상 성공한다.

        `transactions`는 최근 **50건**을 최신순으로 담는다 — `credit_transactions`는
        append-only 원장이고, 그 합계가 곧 `balance − reserved`다(정합 불변식, 계획
        §4). `consume`(완료 확정)의 `credits`도 `reserve`와 같은 크기의 음수다 —
        2026-09-07 리뷰로 저장은 `balance_delta`·`reserved_delta` 두 열로 나뉘었지만,
        이 API 값은 계획 §2 결정 2의 원래 부호 규약(`grant`·`release`는 +, `reserve`·
        `consume`·`adjust`는 방향대로)을 그대로 유지한다.
      responses:
        '200':
          description: 크레딧 계정
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceCreditsResponse' }
              examples:
                with_transactions:
                  value:
                    workspace_id: "00000000-0000-4000-8000-000000000001"
                    balance: 47
                    reserved: 3
                    available: 44
                    enforced: true
                    transactions:
                      - id: "00000000-0000-4000-8000-000000000005"
                        kind: consume
                        credits: -3
                        reason: conversion
                        note: null
                        document_id: "00000000-0000-4000-8000-000000000006"
                        created_at: "2026-09-07T09:05:00Z"
                      - id: "00000000-0000-4000-8000-000000000002"
                        kind: reserve
                        credits: -3
                        reason: conversion
                        note: null
                        document_id: "00000000-0000-4000-8000-000000000003"
                        created_at: "2026-09-07T09:00:00Z"
                      - id: "00000000-0000-4000-8000-000000000004"
                        kind: grant
                        credits: 50
                        reason: signup
                        note: null
                        document_id: null
                        created_at: "2026-09-01T00:00:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (존재 은닉)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # 세금계산서 요청 기록 (2.24.0 신설) — POST·GET /workspaces/{workspace_id}/invoice-requests
  # 정본: docs/plans/2026-09-07-invoice-requests.md §2. 로그인한 워크스페이스 소유자가
  # 사업자등록번호로 세금계산서 발급을 **요청**하면 기록이 남고, 운영자가 메일로 알림을
  # 받아 홈택스에서 수동 발급한 뒤 상태를 바꾼다(`invoice-handle` 운영 프로필). 발급 자체
  # (전자세금계산서 API 연동)·결제·PG·금액 계산은 범위 밖이다.
  # ===========================================================================
  /workspaces/{workspace_id}/invoice-requests:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workspaces]
      operationId: createInvoiceRequest
      summary: 세금계산서 발급을 요청한다
      security: [{ HTTPBearer: [] }]
      description: |
        규칙(계획 §2 결정 2):
          - 소유자만(404, 존재 은닉) — 다른 사용자의 워크스페이스는 없는 것과 같다.
          - `business_number`는 하이픈·공백을 포함한 입력을 숫자 10자리로 정규화하고
            **국세청 체크섬**(가중치 `1,3,7,1,3,7,1,3,5` + 9번째 자리 × 5의 십의 자리
            규칙)을 통과해야 한다 — 위반은 422 「사업자등록번호가 올바르지 않습니다」.
          - `company_name`은 필수(제어문자 제거+trim 후 비어 있으면 422, 100자 초과는
            422). `representative_name`·`address`는 선택(있으면 각각 50자·200자 이하).
          - `contact_email`은 `SignupRequest.email`과 같은 규칙으로 검사한다(정규화 후
            255자 이하, 형식 오류는 422).
          - `period_from`·`period_to`는 `YYYY-MM-DD` — `period_to`가 `period_from`보다
            앞이거나 구간이 366일을 넘으면 422(`readWorkspaceUsage`의 `from`/`to`와 같은
            규칙).
          - 같은 워크스페이스에 **같은 기간**의 `requested` 상태 요청이 이미 있으면 409
            「같은 기간의 요청이 처리 대기 중입니다」 — `issued`·`rejected`로 끝난 요청은
            같은 기간을 다시 요청할 수 있다.

        접수되면 메일 두 통을 **최선 노력**(best-effort)으로 보낸다 — 발송 실패가 요청
        자체를 실패시키지 않는다. ① 운영자에게(`easydoc.billing.operator-email`, 비어
        있으면 보내지 않고 서버 로그에만 경고를 남긴다) 요청 id·워크스페이스 id·
        사업자번호·상호·기간·연락 이메일을 담아. ② 요청자(`contact_email`)에게 접수
        확인을.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequestCreate' }
      responses:
        '201':
          description: 요청이 접수됨 — 상태는 `requested`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (존재 은닉)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '409':
          description: 같은 워크스페이스·같은 기간의 요청이 이미 처리 대기 중이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                duplicate_open_period: { value: { detail: "같은 기간의 요청이 처리 대기 중입니다" } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: 사업자번호 체크섬 오류 · 필드 길이 초과 · 기간 형식·범위 오류 · 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_business_number: { value: { detail: "사업자등록번호가 올바르지 않습니다" } }
                empty_company_name: { value: { detail: "상호를 입력해 주세요" } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [workspaces]
      operationId: listInvoiceRequests
      summary: 내 세금계산서 요청 목록을 조회한다
      security: [{ HTTPBearer: [] }]
      description: 최근 **50건**을 최신순으로 담는다. 소유자만 조회할 수 있고 아니면 404(존재 은닉).
      responses:
        '200':
          description: 요청 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceRequestListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 지정한 작업 공간이 없거나 내 것이 아니다 (존재 은닉)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                workspace_not_found: { value: { detail: "작업 공간을 찾을 수 없습니다" } }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #23 POST /dictionary/lookup — 200 (P0-5 조각 1, 2.11.0 신설)
  # 검수 화면에서 지목한 문자열 하나로 사전 후보를 찾는다. 계획 §3.4.
  # ===========================================================================
  /dictionary/lookup:
    post:
      tags: [dictionary]
      operationId: dictionaryLookup
      summary: 지목한 문자열로 쉬운 말 사전 후보를 찾는다
      security: [{ HTTPBearer: [] }]
      description: |
        검수 화면 담당자가 편집기에서 지목한 문자열 하나를 사전 색인(트라이 최장일치)에
        돌려 대체어·뜻·주의·치환 가능 여부를 돌려준다. **위치 정보(문단·시작·끝 오프셋)는
        요청에도 응답에도 없다** — 좌표는 편집기의 클라이언트 전용 상태이고, 이 오퍼레이션이
        받는 것은 선택된 문자열뿐이다(계획 §3.4 위치 계약).

        서버에 저장된 변환 결과가 아니라 **요청에 실린 문자열 그대로**를 찾는다 — 담당자가
        방금 고친 문장의 낱말도 저장 없이 바로 조회할 수 있는 이유다. 그래서 이 오퍼레이션은
        `conversion_id`를 받지 않고, 자원 종속 경로도 두지 않는다.

        후보가 없으면 빈 배열과 함께 **200**이다(404 가 아니다 — 위 "소유권 은닉" 절 예외
        둘). `match_kind`는 서버가 정한 순서로 최대 1건을 돌려준다 — 정의는
        `TermMatchKind` 스키마를 본다. 연속 점수(`score`)는 두지 않는다 — 어휘 일치에는
        뜻이 없고, 있으면 다음 사람이 임의 임계값을 건다(계획 §3.4).

        `applicable`이 참인 후보만 편집기가 치환 버튼을 낸다 — `strategy`가 `substitute`
        이고 `match_kind`가 `compound_part`가 아닐 때뿐이다. `gloss`·`keep`은 원어를
        지우면 안 되므로 설명만 보여준다.

        **사용자별 분당 60회로 남용을 늦춘다**(`easydoc.dictionary.lookup.rate-limit-per-minute`,
        인스턴스별 한도 — 계획 §3.4, 목적은 사전 전량 긁기를 늦추는 것). 사전 조회 기능
        자체가 꺼져 있으면(`easydoc.dictionary.lookup.enabled=false`) 422 문자열 `detail`
        (`"사전 조회가 꺼져 있습니다"`)로 거절한다.

        **`text`를 로그·메트릭에 남기지 않는다.** 검수 담당자가 지목한 문서 조각이라
        사용자 콘텐츠다 — 운영에서 남기는 것은 개수와
        `match_kind` 분포뿐이다(계획 §3.6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryLookupRequest' }
      responses:
        '200':
          description: 조회 결과 (후보 0건도 200)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/XContentTypeOptions' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryLookupResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # #14 GET /health — 200 (인증 불필요)
  # 원본: app/main.py::health
  # ===========================================================================
  /health:
    get:
      tags: [health]
      operationId: health
      summary: 서비스 생존 확인
      security: []
      description: |
        인증이 필요 없다. React 화면은 이 엔드포인트를 부르지 않는다.

        **캐시 금지 헤더는 붙는다.** 정본은 `x-global-response-headers`이며 그 절이
        **모든 응답**을 요구한다 — 이 엔드포인트도 예외가 아니다.
        (2026-08-20 정정, 근거 **G1**. 종전 문면은 *"캐시 금지 헤더도 붙지 않는다(실측 확인
        2026-08-12)"*였다. 그 실측은 같은 날 리더 판정으로 **요구가 뒤집히기 전**의 것이고,
        `x-global-response-headers.x-superseded`가 제외 목록을 이미 무효화했는데 이 산문만
        옛 문면을 들고 있었다. **재실측 2026-08-20**: 이 응답에 두 헤더가 실제로 실려 나간다.)

        **의존 서비스를 진단한다** (2026-08-12 개정, `x-change-policy` G2).
        현재 Python 구현은 상수 `{"status": "ok"}`만 돌려주어 DB·설정이 모두 죽어도
        200 ok가 나온다(`app/main.py::health`). 그것은 요구사항 미구현이지 계약이 아니다 —
        기동을 막지 않는 대신 `/health`로 배포 상태를 진단한다는 설계 의도가
        `app/api/deps.py` 주석에 이미 적혀 있는데, 진단하지 않는 헬스 체크는 그 의도를
        전혀 만족하지 못한다. **Kotlin은 진단하는 쪽으로 구현한다.**

        **항상 200이다. degraded여도 503을 내지 않는다.** 이 엔드포인트 하나가 liveness와
        readiness를 겸하기 때문이다 — 의존 서비스가 잠깐 죽었다고 503을 내면 오케스트레이터가
        멀쩡히 읽기를 처리하던 프로세스를 재시작시켜 장애를 키운다. 상태는 본문으로
        표현하고, 상태 코드는 "프로세스가 살아 있다"만 뜻한다.
        상태 코드를 바꾸는 변경은 배포 동작을 바꾸므로
        `x-change-policy.escalate_to_leader` 4번 항목이다.

        **응답에 진단 상세를 싣지 않는다.** 인증 없이 누구나 부를 수 있으므로 호스트명·
        포트·드라이버 버전·예외 메시지는 넣지 않는다. 의존 서비스 **이름과 up/down**까지다.

        **진단 대상에 Redis는 없다** (2026-08-20 정정, 근거 **G1**). 큐가 PostgreSQL lease
        테이블로 옮겨졌으므로 Redis는 이 런타임의 의존 서비스가 아니다 — 제품 코드 적중 0.
        `checks`의 `queue` 키는 **남는다**: 큐가 사라진 것이 아니라 **같은 DataSource 위의
        테이블**이 됐고, 「그 작업 테이블을 읽을 수 있는가」는 여전히 별개 진단이다.
        따라서 `database`와 `queue`는 **같은 배선을 공유한다** — 별도 Phase가 아니다.

        그 전까지 Kotlin이 확인 못 하는 의존 서비스는 `checks`에서 **키 자체를 생략**한다 —
        확인하지 않은 것을 `true`로 적으면 진단이 거짓말이 된다.

        **`database: false`인 응답은 제품 구성에서 도달 0이다 — 실측 2026-08-20.**
        DB가 도달 불가면 애플리케이션이 **기동하지 못하므로** 그 응답을 낼 프로세스가 없다
        (`x-retired-503-configurations`의 `datasource`가 그 측정이다). 그러므로 DB 축에서는
        `status: degraded`도 도달 0이다.

        **이 사실을 근거로 조항을 지우지 않는다.** DB 진단은 요구사항이 요구하는 것이고
        (`x-improvements` 판정 5), 도달 0인 것은 **기동 정책의 귀결**이다. 즉 고쳐야 할 곳이
        있다면 그것은 이 조항이 아니라 기동 정책이거나 진단 대상의 정의다. 그 처분은 배포
        동작을 바꾸므로 `x-change-policy.escalate_to_leader` 4번이며 **2026-08-20에 리더에게
        올렸다**(`docs/migration/_workspace/04_contract-keeper_p5-verdict.md` §7-2 ⑴).
        판정 전까지 이 조항은 그대로다.
      responses:
        '200':
          description: 프로세스 생존 (degraded 포함 — 상태는 본문으로 표현한다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

components:

  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. HS256 서명, 페이로드 클레임은
        `sub`·`exp`·`typ` 셋뿐이다. 자세한 계약은 최상위 `x-auth` 참고.

  headers:
    CacheControlNoStore:
      description: |
        `no-store`. 이 응답에는 개인정보 또는 자격증명이 실린다. 파일럿은 nginx가
        프론트와 API를 같은 호스트로 서빙하는 구성이라, 누군가 proxy_cache를 켜는
        순간 캐시된 사본이 소유자 검증 없이 다른 사용자에게 나갈 수 있다.
      required: true
      schema: { type: string, const: "no-store" }
    XContentTypeOptions:
      description: |
        `nosniff`. 브라우저가 내용을 보고 타입을 추측하지 않게 한다 — 사용자 본문이
        그대로 담긴 내려받기 파일이 스크립트로 해석되는 경로를 닫는다.
      required: true
      schema: { type: string, const: "nosniff" }
    WWWAuthenticateBearer:
      description: 401에 요구되는 표준 헤더. 클라이언트가 재인증 방식을 안다.
      required: true
      schema: { type: string, const: "Bearer" }

  responses:

    Unauthorized:
      description: |
        인증 실패. **균일성 요구의 정본은 `x-auth.failure_uniformity`다** — 사유 목록을
        여기 옮겨 적지 않는다. 종전 문면은 그 목록을 복사해 두었다가 정본과 갈렸고
        (무헤더 유무), 세 줄 뒤 "메시지는 두 가지"라는 **자기 반증**까지 안고 있었다
        (게이트 24 R-1, G1로 정정 2026-08-19).

        이 응답이 고정하는 것은 **문구가 두 갈래라는 구조**다.

        | 갈래 | `detail` | 균일화 대상 |
        |---|---|---|
        | `Authorization`이 없다 — 헤더 부재·스킴 불일치·토큰부 공백 | `"인증이 필요합니다"` | **아니다** |
        | 토큰·자격증명이 제시됐으나 유효하지 않다 | `"이메일 또는 비밀번호가 올바르지 않습니다"` | **그렇다**(정본 `x-auth.failure_uniformity`) |

        둘째 갈래 **안에서는** 실패 사유를 구분하지 않는다 — 만료·서명 위조·클레임
        누락·`typ` 용도 불일치·계정 삭제·이메일 부재·비밀번호 불일치가 전부 같은 401,
        같은 본문, 같은 헤더 집합으로 모인다. 어디서 실패했는지 알려주면 유효한 토큰
        형식을 탐색하는 단서가 된다.

        **무헤더가 균일화 대상이 아닌 이유**는 정본 조항에 있다 — 두 갈래를 가르는 것이
        서버의 비밀이 아니라 요청자가 스스로 만든 상태라서 정보 이득이 0이다.

        두 문구는 실측 확인했다(2026-08-12). 스킴 비교는 **대소문자를 가리지 않는다** —
        `bearer`로 보낸 요청을 「헤더 없음」으로 취급하면 갈래가 잘못 갈린다.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticateBearer' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            no_header: { value: { detail: "인증이 필요합니다" } }
            invalid_token: { value: { detail: "이메일 또는 비밀번호가 올바르지 않습니다" } }

    Conflict:
      description: 상태 충돌. 요청 자체는 올바르고 지금이 아닐 뿐이거나 이미 있다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            duplicate_email: { value: { detail: "이미 가입된 이메일입니다" } }
            email_already_linked:
              value:
                detail: "이미 같은 이메일로 가입된 계정이 있습니다. 이메일로 로그인한 뒤 연결해 주세요."

    # 2026-08-20에 폐기됐다가 2.8.0(backlog §1.4 P0-1)에서 되살아났다 — 정본은
    # `x-retired-responses[0]`(`reinstated_at`·`reinstated_by`). **`POST
    # /auth/oauth/{provider}/callback`·2.10.0의 `POST
    # /auth/oauth/{provider}/link/callback`·2.14.0의 `POST
    # /conversions/{conversion_id}/units/{source_unit_index}/reconvert` 셋만** 이
    # 컴포넌트를 선언한다 — 셋 다 하위 시스템(제공자 토큰 교환 또는 LLM 제공자)을
    # 동기로 부르는 오퍼레이션이다. 다른 오퍼레이션에 새로 붙이려면 그 오퍼레이션도
    # "동기로 하위 시스템을 부르는지"부터 그 절의 기준으로 판정한다.
    BadGateway:
      description: |
        동기로 부른 하위 시스템(소셜 로그인 제공자 또는 LLM 제공자)에 닿지 못했다 —
        타임아웃·연결 실패·제공자의 5xx. **우리 설정 미비(503)도 우리 코드 버그(500)도
        아니다** — 제공자 쪽 문제이거나 네트워크 문제라 재시도가 값어치 있을 수 있다는
        점에서 예전 502 조항과 성격이 같다.
        **벤더 오류 텍스트를 담지 않는다** — `detail` 은 항상 이 예시의 고정 문구다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            provider_unreachable: { value: { detail: "구글에 연결하지 못했습니다" } }

    PayloadTooLarge:
      description: |
        업로드 파일이 10MB를 넘었다.

        **계획 §2.2 목록에 없는 상태 코드지만 실재한다**(`UploadTooLargeError` →
        `413 CONTENT_TOO_LARGE`, app/api/errors.py). 형식·내용 문제(422)와 가르는
        이유는 사용자가 취할 조치가 "파일을 나눠 올리기"로 다르기 때문이다.
        회귀 테스트: `tests/api/test_documents.py::test_상한을_넘는_파일은_413`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            too_large: { value: { detail: "파일이 너무 큽니다 (최대 10MB)" } }

    TooManyRequests:
      description: |
        너무 잦은 요청 — `Retry-After` 로 재시도 시점을 알린다. 2.9.0 신설 당시는
        `POST /auth/email-verification/request` 재발송 쿨다운(60초) 하나만 이
        컴포넌트를 선언했다. **2.11.0에서 `dictionaryLookup` 이 두 번째로 선언한다**
        — 의미는 다르다(쿨다운이 아니라 사용자별 분당 60회 남용 한도, 계획 §3.4)
        지만 "너무 잦은 요청, 잠시 후 재시도"라는 모양과 `Retry-After` 계약은 같아
        컴포넌트를 새로 만들지 않고 재사용한다.
      headers:
        Retry-After:
          description: |
            RFC 9110 표준 헤더 — 재시도까지 남은 정수 초, 문자열로 인코딩한다.
            **값이 계산된다**(`Location`·`Content-Disposition` 과 같은 자리 —
            `x-private-response-headers` 옆 `components/headers` 의 `const` 규약이
            적용되지 않는 이유다). 최솟값 1이다 — 0을 보내면 클라이언트가 즉시
            재시도를 반복해 쿨다운을 사실상 무력화한다. 값은 계산되지만 **스키마
            (`type`·`examples`)는 이 헤더가 나타나는 모든 자리에서 문자열 그대로 같아야
            한다** — `ContractSpec.collectHeaders`가 같은 이름의 헤더 선언이 계약 안에서
            갈리지 않는지 전역으로 확인한다(`ReconversionConcurrencyLimited`의 고정값 "1"과
            이 예시 "60"을 `examples`에 함께 둔 이유).
          required: true
          schema: { type: string, examples: ["60", "1"] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            rate_limited: { value: { detail: "잠시 후 다시 시도해주세요" } }

    ReconversionBudgetExhausted:
      description: |
        재변환 호출 예산(`easydoc.reconversion.call-budget`, 문서 1건당)이 소진됐다 —
        `reconvertUnit`(2.14.0) 전용, LLM 호출은 0회다.

        **`TooManyRequests`를 재사용하지 않는다.** 그 컴포넌트는 60초 재발송 쿨다운
        전용이라 `Retry-After`(재시도까지 남은 초)를 필수로 요구하는데, 이 예산에는
        쿨다운도 재시도 시각도 없다 — 예산은 시간이 지나면 차는 창이 아니라 문서당
        영구 상한이다. 그래서 **`Retry-After` 헤더가 없다.**

        **잔여 예산은 몸체가 아니라 헤더로 낸다** — `x-error-body-universality`가
        "오류 응답 본문은 언제나 `ErrorResponse`(`detail` 하나뿐)"를 요구하므로,
        본문에 `remaining_call_budget`을 더한 새 스키마를 두면 그 전역 불변식을
        깬다. `Retry-After`가 이미 같은 문제(쿨다운 시점을 몸체가 아니라 헤더로
        나른다)를 푼 자리라 그 패턴을 그대로 따른다.
      headers:
        X-Remaining-Call-Budget:
          description: |
            이 예약 시도 시점의 잔여 재변환 호출 예산(정수, 문자열로 인코딩) — 이
            요청은 예약에 실패했으므로 이 값은 **호출 전** 잔여량이다(호출 성공 응답의
            `remaining_call_budget`은 그 반대로 **정산 후** 값이다).
          required: true
          schema: { type: string, examples: ["0", "1"] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            budget_exhausted: { value: { detail: "재변환 호출 예산을 모두 사용했습니다" } }

    InsufficientCredits:
      description: |
        워크스페이스 크레딧이 모자라 문서 등록을 예약하지 못했다 — `createDocument`
        (2.22.0) 전용, 크레딧 계정 계획 §2 결정 4(C1). `easydoc.credits.enforced`가
        `true`일 때만 나간다 — 꺼져 있으면 잔액이 음수로 기록되며 등록은 계속된다.

        **잔여값은 몸체가 아니라 헤더로 낸다** — `ReconversionBudgetExhausted`와 같은
        이유(`x-error-body-universality`가 오류 응답 본문을 `detail` 하나로 고정한다).
      headers:
        X-Credit-Balance:
          description: 이 예약 시도 시점의 가용 크레딧(`balance − reserved`, 정수, 문자열로 인코딩).
          required: true
          schema: { type: string, examples: ["0", "1"] }
        X-Credits-Required:
          description: 이 요청이 필요로 한 크레딧(`ceil(char_count / 1000)`, 정수, 문자열로 인코딩).
          required: true
          schema: { type: string, examples: ["2", "20"] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            insufficient_credits: { value: { detail: "크레딧이 부족합니다. 충전 후 다시 시도하세요." } }

    ReconversionConcurrencyLimited:
      description: |
        재변환 동시 실행 한도(`easydoc.reconversion.concurrency`, 기본 4)에 도달했다 —
        `reconvertUnit`(2.14.0) 전용, 이 프로세스가 이미 한도만큼의 재변환 LLM 호출을
        진행 중이라 이 호출은 시작되지 못했다. LLM 호출은 0회이고 예약 전액이 환불된다.

        **공유 `ServiceUnavailable` 을 재사용하지 않는다.** 그 컴포넌트는 "이 상태가 되는
        구성은 JWT 서명 키 미설정 하나뿐"이라고 스스로 적어 뒀고(`components/responses
        .ServiceUnavailable`), `Retry-After` 헤더도 없다 — 배포 오설정(고쳐야 사라짐)과
        트랜지언트 동시성 한도(1초 뒤 재시도하면 사라질 수 있음)는 원인의 성격이 다르다.
        `ReconversionBudgetExhausted` 가 `TooManyRequests` 를 재사용하지 않은 것과 같은
        판단이다.

        **`ReconversionBudgetExhausted`(429)와도 다른 축이다** — 그쪽은 문서당 영구 호출
        상한(재발급되지 않는다)이고, 이쪽은 프로세스 전역의 동시 실행 한도(다른 재변환
        호출이 끝나면 즉시 풀린다)다. 그래서 상태 코드도 갈린다: 영구 상한은 429, 트랜지언트
        용량 초과는 503 + `Retry-After`.
      headers:
        Retry-After:
          description: RFC 9110 표준 헤더 — 고정값 "1"(초). 동시성 한도는 다른 호출이 끝나는
            즉시 풀리므로 재시도까지 걸리는 시간을 정확히 계산할 수 없어 최소값을 낸다.
            스키마는 `TooManyRequests.headers.Retry-After`와 문자 그대로 같다 — 같은 이름의
            헤더는 계약 전체에서 하나의 스키마여야 한다(`ContractSpec.collectHeaders`).
          required: true
          schema: { type: string, examples: ["60", "1"] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            concurrency_limited: { value: { detail: "동시 재변환 한도에 도달했습니다. 잠시 후 다시 시도해 주세요" } }

    UnsupportedMediaType:
      description: |
        요청 `Content-Type`이 그 오퍼레이션의 `requestBody.content` 키 집합 밖이다.
        **조항의 정본은 최상위 `x-unsupported-media-type`이다** — 대상 집합·`detail`의 출처·
        `Accept` 응답 헤더·미측정 팔·판정 대기 항목이 그 절 한 곳에 있다. 여기에 옮겨 적지 않는다.

        **422와 가르는 이유**: 422는 "본문의 값이 규칙을 어겼다"이고 415는 "그 형식을 아예
        받지 않는다"다. 사용자가 취할 조치가 다르다 — 앞은 값을 고치는 것이고 뒤는 **다른
        형식으로 보내는 것**이다. 지원 확장자 밖의 파일이나 추출 실패는 415가 **아니라**
        422다(`x-input-limits`) — 그쪽은 `Content-Type`이 아니라 본문 자체를 처리 못 하는 것이다.

        `detail`은 **상태 코드의 표준 사유 문구**이며 도메인 예외의 한국어 문구와 다른 규칙을
        따른다. 그 사유는 `x-unsupported-media-type.detail_source`에 있다 —
        **한국어로 바꾸는 것은 번역이 아니라 세 경로 균일성을 깨는 것이다.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    ValidationFailed:
      description: |
        입력 검증 실패. **Spring 기본값 400이 아니라 422다.**

        같은 422에 `detail`의 두 모양이 모두 나온다:
          - Pydantic/Bean Validation 층에서 걸리면 **배열**
          - 도메인 규칙에서 걸리면 **문자열**

        배열 항목에는 `loc`·`msg`·`type`만 있다. `input`·`ctx`는 금지 —
        비밀번호가 응답 본문과 액세스 로그에 남는 경로다.

        **어느 모양이 나오는지는 구현 재량이 아니라 계약이다.** 경계는 이렇다:

          - **배열** — 필드 누락 · **JSON 원시 타입 불일치**(문자열 자리에 숫자·객체 등) ·
            enum 밖 값, 그리고 스키마에 실제로 제약이 선언된 쿼리 파라미터(`limit`·`offset`)
          - **문자열** — 요청 본문 필드의 길이·형식·빈 값 규칙 **전부**.
            정본은 `x-request-field-constraints`이며 그 다섯 필드에는 `maxLength`/
            `minLength`가 **의도적으로 없다**

        **「타입 불일치」는 JSON 원시 타입까지다** (2026-08-23 신설, 근거 **G4**).
        문자열로 실려 온 값이 대상 타입으로 **변환되지 않는 것**(UUID·날짜 등 형식 위반)은
        배열이 아니라 **문자열** 갈래다 — 그것은 「형식 규칙」이고, 종전 문면은 이 자리에서
        두 줄이 서로 다른 답을 가리켜 **양쪽을 동시에 만족시킬 수 없었다.** 역직렬화기가
        이 실패를 자기 어휘로 「타입 불일치」라 부르는 것은 구현 사정이지 계약의 경계가 아니다.
        대표 자리는 `POST /documents`의 `workspace_id` 형식 오류이며, 그 오퍼레이션의 422
        서술이 이미 문자열이라고 적고 있다 — 이 문단은 그 답을 일반화한 것이지 새 값이 아니다.

        **이 경계는 전송 팔을 가리지 않는다.** 한 오퍼레이션이 JSON과 multipart를 모두 받아도
        같은 결함이면 같은 모양이 나간다. `detail`의 모양을 가르는 축은 **걸린 규칙의 종류**이고
        요청을 어떤 미디어 타입으로 보냈는가는 그 축에 없다 — 팔마다 갈리면 클라이언트가
        같은 실수에 두 가지 화면 문구를 받는다.

        길이 위반을 Bean Validation(`@Size`·`@NotBlank`)으로 구현하면 배열이 나가고
        문구가 영문으로 바뀌어 **계약 위반**이다. 상태 코드가 같아 눈에 띄지 않으므로
        contract test가 `detail`의 **타입까지** 단언한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            field_missing:
              value: { detail: [{ loc: ["body", "password"], msg: "Field required", type: "missing" }] }
            query_range:
              value: { detail: [{ loc: ["query", "limit"], msg: "Input should be greater than or equal to 1", type: "greater_than_equal" }] }
            domain_rule:
              value: { detail: "이메일 형식이 올바르지 않습니다" }

    InternalError:
      description: |
        서버 오류. 두 가지 고정 문구가 있고 **예외 내용을 그대로 노출하지 않는다**.
          - 매핑되지 않은 도메인 예외 → `"요청을 처리하지 못했습니다"`
          - 도메인 밖 예외(라이브러리 오류 등) → `"서버 오류가 발생했습니다"`
          - `StorageError`(코드 버그) → 저장소가 만든 고정 문자열
        미처리 예외(둘째 줄)에 CORS 헤더가 붙는지는 런타임에 따라 다르다 — Python은
        구조적으로 못 붙이고 Kotlin은 붙인다. **의도된 차이**이며 상태 코드와 본문은
        같다(최상위 `x-cors.x-unhandled-500-cors`가 정본).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            unmapped_domain: { value: { detail: "요청을 처리하지 못했습니다" } }
            unexpected: { value: { detail: "서버 오류가 발생했습니다" } }
            storage: { value: { detail: "저장된 변환 결과를 읽을 수 없습니다" } }
            storage_original: { value: { detail: "저장된 원본 파일을 읽을 수 없습니다" } }

    # BadGateway(502)는 2026-08-20에 **폐기**됐다. 되살리기 전에 `x-retired-responses`를 읽어라 —
    # 어느 오퍼레이션도 502를 선언하지 않는다는 것이 지금의 조항이고, 그것을 재는 단언이 있다.

    ServiceUnavailable:
      description: |
        운영 설정 문제(`ConfigurationError`). 사용자 잘못이 아니다.
        **이 상태가 되는 구성은 하나뿐이다.**
          - **JWT 서명 키 미설정 또는 32바이트 미만 → 인증이 필요한 모든 요청**
            (인증 API 셋만이 아니다 — 보호 자원 전체가 같은 인증 경로를 지난다.
            그래서 `ServiceUnavailable`을 인증이 걸린 모든 오퍼레이션이 선언한다.)

        **기동을 막지 않는 것은 이 줄뿐이다.** 서명 키가 비어도 앱은 뜬다(실측 2026-08-20:
        키를 주지 않은 채 기동 → `/health` 200). 그래야 `/health`로 배포 상태를 진단할 수
        있으므로, 그 설정이 필요한 요청만 503이 된다. 401로 감추지 않는 것도 조항이다:
        배포 사고가 "사용자가 토큰을 잘못 냈다"로 둔갑하면 안 된다.

        **다른 오설정은 기동을 막는다** — 저장 암호화 키(2026-08-19 리더 판정)와
        DataSource(2026-08-20 실측)가 그렇다. 그래서 한때 이 목록에 있던 구성 셋이
        내려갔다: **`queue` · `cipher` · `datasource`**.

        **내려간 것의 사유·근거·되살릴 조건은 `x-retired-503-configurations`가 정본이다.**
        이 자리에 두 벌로 적지 않는다 — 이 컴포넌트를 **인증이 걸린 오퍼레이션 전부**가
        선언하므로 사유를 여기 두면 그 모든 자리가 그것을 인용하게 된다.
        (수를 적지 않는 이유는 오퍼레이션이 늘 때마다 산문이 갈리기 때문이다 — 게이트 28 P-5.) **서수로 부르지 않는다**: 그 절의 `id`로만
        가리킨다(서수를 버린 사유는 그 절 머리 주석에 있다 — 게이트 28 P-5).

        **그래서 `POST /documents`의 503은 어디서 오는가**: 위 유일한 줄, 곧 **인증 경로**다.
        업로드 고유의 503 구성은 **없다** — 저장 암호화가 없는 배포는 뜨지 않고, 큐는
        배선이라는 것을 갖지 않으며, DB가 없는 배포도 뜨지 않는다. 큐 등록이 **실패**하는
        것은 구성 문제가 아니라 실행 실패이고 그때는 500이다(`POST /documents` 설명).
        **DB 장애도 503이 아니다** — 제품 구성에서는 응답이 아예 없고(기동 실패), 강제로
        띄운 구성에서는 500이었다(`x-retired-503-configurations`의 `datasource`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            no_jwt: { value: { detail: "인증이 설정되지 않았습니다" } }
            short_secret: { value: { detail: "인증 서명 키는 32바이트 이상이어야 합니다" } }

  schemas:

    # ---------------------------------------------------------------------
    # 오류 본문 — 계약의 핵심
    # ---------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [detail]
      additionalProperties: false
      description: |
        모든 오류 응답의 유일한 모양. 최상위 키는 `detail` 하나뿐이다.

        **"모든"의 범위는 최상위 `x-error-body-universality`가 정본이다** — 전역 예외
        매퍼를 거친 응답만이 아니라 `sendError` → `/error` 디스패치와 컨테이너 생성
        응답까지다. 이 스키마는 **모양**을 정의할 뿐 **어느 응답에 적용되는지**를 정하지
        못한다(OpenAPI 문법의 한계). 2026-08-12 실측에서 `/error` 경로가 Spring
        `BasicErrorController` 기본 본문(`timestamp`·`status`·`error`·`path`)을 내는 것이
        확인됐고, 그것은 `additionalProperties: false`와 `required: [detail]` 양쪽 위반이다.
      properties:
        detail:
          description: |
            **문자열 또는 객체 배열의 union이다.** 이 union이 계약의 핵심이며,
            한쪽만 구현하면 React가 폴백 문구만 보여 준다.
          oneOf:
            - type: string
              description: 도메인 예외의 한국어 사용자 문구
            - type: array
              description: 입력 검증 실패 항목 목록
              items: { $ref: '#/components/schemas/ValidationErrorItem' }

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      additionalProperties: false
      description: |
        검증 실패 항목. **`input`·`ctx`를 넣지 않는다** — FastAPI 기본 핸들러는
        넣지만 `_handle_request_validation`이 걷어낸다. 비밀번호가 응답 본문과
        액세스 로그에 그대로 남는 경로이기 때문이다.
        `loc`의 원소는 현행 구현에서 전부 **문자열**이다(배열 인덱스도 `str()`로
        변환된다 — FastAPI 자동 생성 스키마의 `string | integer`와 다르다).
      properties:
        loc:
          type: array
          items: { type: string }
          examples: [["body", "password"]]
        msg: { type: string, examples: ["Field required"] }
        type: { type: string, examples: ["missing"] }

    # ---------------------------------------------------------------------
    # 값 집합 — enum으로 고정한다
    # ---------------------------------------------------------------------
    ConversionStatus:
      type: string
      enum: [pending, processing, done, failed]
      description: |
        변환 상태. DB CHECK 제약(`ck_conversions_status_valid`)과 **같은 값 집합**이며
        소문자 4개뿐이다.

        **백엔드 Pydantic은 이 필드를 `str`로 선언해 FastAPI 자동 생성 스키마에
        `string`으로만 나온다.** React는 4값 리터럴 union으로 좁혀 놓았으므로,
        계약 파일이 enum으로 고정하지 않으면 Phase 6에서 생성 타입이 자유 문자열로
        넓어져 **현재보다 타입 안전성이 떨어진다**. 교체가 퇴보가 되면 안 되므로
        여기서 enum으로 고정한다(계획 §2.2 "변환 상태 유지"의 이행).

    ExportFormat:
      type: string
      enum: [docx, txt, hwpx]
      description: |
        내보내기 형식. 값이 그대로 확장자이자 쿼리 파라미터 값이다.
        `pdf`와 구버전 `hwp`(바이너리)는 Lean MVP 범위 밖이며 목록에 없는 값은 422다.

        **`pdf`를 여기 더하지 않는다** (2026-08-26 재확인). PDF 렌더러가 없고
        `GET /conversions/{conversion_id}/export?format=pdf`는 오늘 422다
        (`docs/pilot-runbook.md`도 PDF를 범위 밖으로 적는다). 값을 먼저 넣으면 계약이
        없는 기능을 약속한다. 원본이 PDF인 변환의 `ConversionResponse.export_format`이
        `null`인 것이 이 부재를 응답에서 말하는 방법이다.

    SourceFormat:
      type: string
      enum: [text, docx, pdf, hwpx, txt]
      description: |
        문서가 **어디서 왔는가**. 붙여넣기는 `"text"`, 파일은 소문자 확장자다.

        **enum으로 고정한다** (2026-08-12 개정, `x-change-policy` G1).
        초판은 "자유 문자열이라 좁히면 파괴적"이라고 적었으나 사실이 아니었다 —
        값 집합은 이미 닫혀 있다. 저장 값은 업로드 확장자를 소문자화한 것이지만 그 유도는
        추출기가 지원 형식(`docx`·`pdf`·`hwpx`·`txt`)만 통과시킨 **뒤에** 일어나고, 붙여넣기는
        상수 `text`다. 그 밖의 값이 나올 경로가 없다(Kotlin `core/document/SourceFormat.kt`).
        지원 형식을 늘리면 이 enum과 `x-input-limits.supported_upload_formats`를
        같은 변경 단위에서 함께 늘린다(추가는 비파괴).

        **1.6.0에서 `DocumentListItem.source_format`의 인라인 enum을 여기로 옮겼다.**
        `ConversionResponse.source_format`이 **같은 값 집합**을 쓰기 때문이고, 인라인으로
        두 번 적으면 그 순간 값 집합이 두 벌이 된다 — 한쪽만 늘어나는 날이 온다.
        독립 컴포넌트로 두는 둘째 이유는 `ConversionStatus`·`PublishIntent`와 같다:
        React 생성 타입이 **이름으로 부르는 union**이어야 화면 코드가 문자열 리터럴을
        자기 자리에 복제하지 않는다. 값 집합은 옮기기 전과 **한 글자도 다르지 않다.**

        **`txt`는 2.4.0에서 더했다** — `text`(붙여넣기)와는 다른 값이다. 다른 축은 **원본
        바이트의 유무가 아니라 수집 경로**다: `text`는 붙여넣기라 애초에 파일이 없고,
        `txt`는 업로드된 파일이라 요청 시점에는 바이트가 있다 — 다른 세 업로드 형식과 같은
        디코딩 단계를 거친다(`x-input-limits.txt_encoding_policy`).

        **둘 다 `document_originals`에 행을 남기지 않지만, 이유는 다르다** (2.5.1에서 이
        문단을 정정했다 — 종전 문구는 "바이트가 있으면 저장한다"로 읽혔는데 사실이
        아니었다). `text`는 파일이 아니었으므로 저장할 원본 바이트가 처음부터 없고
        (아래 `FormatPreservationStatus` `not_applicable` ⑴), `txt`는 파일이지만 평문에는
        반영할 서식 구조가 없어(글꼴·표·머리말 같은 것이 없다) 바이트를 저장해도 쓸 데가
        없다(같은 상태 ⑶). 저장 여부를 가르는 것은 바이트의 유무가 아니라 **반영할 서식
        구조가 있는지**다(`x-export-format-derivation.mapping`).

    FormatPreservationStatus:
      type: string
      enum: [not_applicable, available, partial, failed]
      description: |
        원본 서식 유지 상태.

        - `not_applicable` — **유지할 원본 서식이 없다.** 네 갈래가 여기 든다:
          ⑴ 붙여넣기(`source_format: text`) — 파일이 아니었으므로 서식이 애초에 없다.
          ⑵ 원본 파일 바이트가 저장돼 있지 않은 문서 — `document_originals` 표가 서기
             전(2026-08-26 이전)에 업로드된 문서가 그렇다. 그 바이트는 파싱 직후 사라졌고
             다시 만들 수 없으므로 이 판정은 앞으로도 바뀌지 않는다.
          ⑶ 업로드된 평문(`source_format: txt`, 2.4.0) — 파일은 맞지만 평문에는 애초에
             유지할 서식이 없다(굵기·글꼴·표·머리말 같은 구조가 없다). ⑴과 사유가 같으므로
             `document_originals`에 원본을 남기지 않는다 — 남겨도 반영할 대상이 없다.
          ⑷ PDF(`source_format: pdf`, 2.6.0) — 원본 파일 바이트는 저장돼 있을 수 있지만
             **반영할 대상 자체가 없다.** 사용자가 `export_format_choices` 중 하나를 골라
             그 형식의 **새 문서**로 조립해 받는다(`x-export-format-derivation.choices`) —
             원본 구조를 여닫지 않으므로 판정할 「짝」이 없다. ⑵와 사유가 다르다 — 바이트가
             없어서가 아니라 반영이라는 개념 자체가 이 갈래에 적용되지 않는다.
          네 갈래 모두 **영구히 참**이고, **완료 전에도** 이 값이 즉시 선다 — 짝지을
          검수본을 기다릴 이유가 없다(아래 `format_preservation: null`의 조건 ⑴ 참고).
        - `available`(「유지 가능」) — **원본 구조 그대로 나간다.** 원본의 본문 단위
          하나하나에 검수본 문단 하나씩이 들어가고(수가 정확히 같다), 원본 문구가 남는
          머리말·꼬리말도 없다. 짝이 하나라도 어긋나면 이 값이 아니다. **2.16.0부터는
          예외가 하나 있다** — `segment_map`(아래 `SegmentMap`)이 놓은 합침(N:1)·나눔
          (1:N)은 **대응을 확신한 반영**이라 그 자체로는 이 값을 깨지 않는다. 다만 무슨
          일이 일어났는지는 `FormatPreservation.details`로 말한다 — 그래서 **2.16.0부터
          `available`에도 `details`가 붙을 수 있다**(그전에는 언제나 빈 배열이었다).
        - `partial`(「일부 유지」) — **일부는 달라진다.** 무엇이 얼마나 달라지는지
          `FormatPreservation.details`가 개수로 말한다. 다음 갈래가 이 값을 만든다:
          머리말·꼬리말이 원본 문구로 남는다 / 반영할 문단이 없어 비워지는 원본 문단이
          있다 / 원본에 자리가 없어 본문 끝에 덧붙는 문단이 있다 / **(2.16.0)** `segment_map`
          이 `LOW` confidence(순서 비례 보간)로 자리를 옮겨 넣은 줄이 있다 / **(2.16.0)**
          `segment_map`의 단위 수가 원본·검수본과 맞지 않아 차례 짝짓기로 떨어졌다(이때는
          뒤쪽 문단이 밀릴 수 있다는 문구가 함께 붙는다).
        - `failed`(「서식 유지 실패」) — **같은 형식으로 다시 만들 수 없다.** 저장된 원본을
          열 수 없다는 뜻이고, `GET /conversions/{conversion_id}/export`도 같은 사유로
          **500**이다. §6.5: "서식을 유지할 수 없을 때 텍스트 전용 파일로 조용히 대체하지
          않는다" — 그 금지를 지키는 방법이 이 값과 그 500이다.

        **`checking`(「서식 확인 중」)은 이 집합에 없다.** 1.6.0이 뺀 사유가 그대로
        유효하다: 이 판정은 **조회 한 번 안에서 동기로 끝난다.** 클라이언트가 지켜볼 진행
        상태가 없으므로, 내보내면 끝나지 않을 스피너를 약속하게 된다. 판정에 필요한
        검수본이 아직 없는 동안(완료 전)은 이 enum의 값이 아니라
        `ConversionResponse.format_preservation: null`이다.

    FormatPreservation:
      type: object
      required: [status, details]
      description: |
        원본 서식 유지 상태와, 사용자에게 보여 줄 영향 항목.
        `ConversionResponse.format_preservation`이 `null`이면 **서버가 판정하지 않았다**는
        뜻이다 — 그 사유는 그 필드 쪽에 적혀 있다.
      properties:
        status: { $ref: '#/components/schemas/FormatPreservationStatus' }
        details:
          type: array
          items: { type: string }
          examples:
            - "머리말·꼬리말 2곳은 원본 문구를 그대로 둡니다."
            - "원본 문단 3개는 반영할 내용이 없어 빈 문단으로 남습니다."
            - "문단 3개는 원본에 자리가 없어 본문 끝에 덧붙습니다."
            - "원본 문단 2개는 앞 문단과 합쳐져 빈 문단으로 남습니다."
            - "문단 3개는 원본 문단이 나뉘어 그 뒤에 새 문단으로 들어갑니다."
            - "문단 4개는 원본 자리를 확신할 수 없어 앞뒤 비율로 자리를 옮겨 넣었습니다."
            - "원본 구조와 문단 수를 맞출 수 없어 차례대로 반영합니다."
            - "문단 수가 원본과 달라 뒤쪽 문단의 서식이 밀릴 수 있습니다."
          description: |
            사용자에게 그대로 보여 줄 **영향 항목** 문구 목록(§6.5). 위 `examples`가
            실제로 나오는 문장 그대로다 — 지어낸 예시가 아니다.

            **문서 본문을 담지 않는다.** 담을 수 있는 것은 구조 요소의 종류와
            개수뿐이다. 구현에서 이 문구들은 **고정 문장 + 개수**로만 만들어진다 — 문서에서
            읽은 문자열이 끼어들 형식 인자가 하나도 없다(Kotlin
            `core/document/FormatPreservation.kt`).

            `not_applicable`에서는 **빈 배열**이다 — 알릴 영향 항목이 없다. `null`이 아니라
            `[]`인 것은 응답의 다른 배열 필드와 같은 규칙이다. `partial`·`failed`에서는 비어
            있지 않다: 「일부」라고 말해 놓고 무엇이 달라지는지 말하지 않으면 사용자가
            취할 행동이 없다.

            **`available`은 2.16.0부터 빈 배열이 아닐 수 있다** — `segment_map`이 놓은
            합침·나눔은 대응을 확신한 반영이라 상태를 깨지 않지만, 무슨 일이 있었는지는
            여전히 알려야 하므로 `details`에 실린다(`FormatPreservationStatus.available`
            참고). 2.15.0까지는 이 값이 언제나 빈 배열이었다.

    # ---------------------------------------------------------------------
    # auth
    # ---------------------------------------------------------------------
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          x-service-constraint: { max_length: 255, measured_on: normalized }
          description: |
            공백 제거 + 소문자로 정규화한 뒤 **그 결과의** 길이(≤255)와 형식을 검사한다.
            위반은 422 **문자열** detail이다.
            **`maxLength`를 쓰지 않는다** — 스키마 키워드는 원시 값에 걸려 정규화로 줄어드는
            입력을 잘못 거절하고, 오류 모양도 배열로 바뀐다(`x-request-field-constraints`).
          examples: ["user@example.test"]
        password:
          type: string
          x-service-constraint: { min_length: 8, measured_on: raw }
          description: |
            최소 8자. 상한은 두지 않는다(argon2는 입력 길이에 비용이 좌우되지 않는다).
            원시 값으로 재지만 판정은 **서비스 층**이라 위반은 422 **문자열** detail이다 —
            경계가 스키마와 같아도 오류 모양이 다르므로 `minLength`를 쓰지 않는다.
            **이 값은 응답 본문·로그 어디에도 반향되지 않는다.**

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, examples: ["user@example.test"] }
        password: { type: string }

    UserResponse:
      type: object
      required: [id, email, email_verified, has_password, identities]
      description: 사용자 공개 표현. `password_hash`는 절대 포함하지 않는다.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, examples: ["user@example.test"] }
        email_verified:
          type: boolean
          description: |
            이메일 소유를 확인했는지(2.9.0 신설, backlog §1.4 P0-1/P0-3). 이메일을
            검증하는 소셜 제공자(구글·카카오) 계정과 V7 마이그레이션 이전 기존 계정은
            항상 참이다. **네이버는 예외다**(2026-09-05 결정) — 그 제공자엔
            `email_verified` 개념이 없어 계정이 거짓으로 만들어질 수 있다. 거짓이면
            `createDocument` 가 403을 낸다 — `POST /auth/email-verification/request`로
            코드를 받고 `confirm` 으로 넘기면 참으로 바뀐다(네이버는 가입 직후 이
            코드가 자동 발급된다, `x-social-login.providers.x-note`).
        has_password:
          type: boolean
          description: |
            비밀번호가 있는지(2.17.0 신설, backlog §1.4 다음 조각) — `users.password_hash
            IS NOT NULL`. 소셜 로그인으로만 가입한 계정은 거짓이다. 화면이 `DELETE
            /auth/oauth/{provider}/link`(연결 해제)가 거절될지(마지막 로그인 수단)를
            요청 전에 미리 판정해 「연결 해제」 버튼을 비활성화할 재료다 — 정본은
            `x-social-login.explicit_linking` 「연결 해제」 문단.
        identities:
          type: array
          items: { $ref: '#/components/schemas/UserIdentityResponse' }
          description: |
            연결된 소셜 신원의 제공자 목록(2.10.0 신설, backlog §1.4 명시적 연결,
            정본은 `x-social-login.explicit_linking`). 비밀번호 전용 계정, 아직 아무것도
            잇지 않은 계정은 빈 배열이다. 화면이 "구글 계정이 연결돼 있음"을 보여주는
            자리다 — `provider_user_id` 등 신원 상세는 담지 않는다(응답 최소화).

    UserIdentityResponse:
      type: object
      required: [provider]
      description: |
        `UserResponse.identities` 의 항목 하나. `oauthStart` 등과 같은 enum
        (`[google, kakao, naver]`)이다.
      properties:
        provider: { type: string, enum: [google, kakao, naver] }

    ConfirmEmailVerificationRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: |
            사용자가 타이핑하지 않고 메일에서 그대로 옮기는 6자리 숫자다 —
            `OAuthCallbackRequest` 의 프로토콜 토큰 필드들과 같은 근거로
            `minLength`/`maxLength` 를 스키마 층에 둔다(`x-request-field-constraints`
            다섯 필드의 "요청 본문은 서비스 층에서만 잰다"는 원칙의 예외이며 이유가 같다).
            형식은 맞지만 값이 틀리면 400(코드 오답)이지 422가 아니다.

    SetPasswordRequest:
      type: object
      required: [new_password]
      description: "`POST /auth/password` 요청. backlog §1.4 다음 조각, 2.19.0 신설."
      properties:
        new_password:
          type: string
          x-service-constraint: { min_length: 8, measured_on: raw }
          description: |
            최소 8자. `SignupRequest.password`와 같은 규칙(`x-request-field-constraints`)
            — 판정은 서비스 층이라 위반은 422 **문자열** detail이다.
            **이 값은 응답 본문·로그 어디에도 반향되지 않는다.**

    PasswordResetRequest:
      type: object
      required: [email]
      description: |
        `POST /auth/password-reset/request` 요청. backlog §1.4 다음 조각, 2.19.0 신설.
        형식·길이 제약을 두지 않는다 — 이 오퍼레이션은 이메일 형식 자체로도 계정
        존재를 흘리지 않기 위해 항상 202이므로, 형식 검증을 별도로 두어도 응답이
        갈리지 않게 하려면 형식 오류도 같은 202로 삼켜야 한다. 서비스가 판정 전에
        걸러야 할 별도 위험이 없으므로 스키마도 서비스도 형식을 검사하지 않는다.
      properties:
        email:
          type: string
          examples: ["user@example.test"]

    PasswordResetConfirmRequest:
      type: object
      required: [email, code, new_password]
      description: "`POST /auth/password-reset/confirm` 요청. backlog §1.4 다음 조각, 2.19.0 신설."
      properties:
        email: { type: string, examples: ["user@example.test"] }
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: |
            메일로 받은 6자리 숫자 코드. `ConfirmEmailVerificationRequest.code`와 같은
            이유로 `minLength`/`maxLength`를 스키마 층에 둔다. 형식은 맞지만 값이
            틀리면(오답·만료·시도 소진) 401이지 422가 아니다 — 이 오퍼레이션은 이메일
            존재 여부도 같은 401로 묶는다.
        new_password:
          type: string
          x-service-constraint: { min_length: 8, measured_on: raw }
          description: |
            최소 8자. [SetPasswordRequest.new_password]와 같은 규칙 — 위반은 422
            **문자열** detail이다. **이 값은 응답 본문·로그 어디에도 반향되지 않는다.**

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      description: |
        `token_type`은 Pydantic 기본값 `"bearer"`가 있어 FastAPI 자동 생성 스키마에서
        `required`가 아니지만 **응답에는 항상 실린다**. React도 필수로 다루므로
        계약에서는 필수로 고정한다.
      properties:
        access_token: { type: string, description: HS256 JWT }
        token_type: { type: string, const: "bearer" }
        expires_in:
          type: integer
          description: |
            유효 기간(초). 클라이언트가 토큰을 디코딩해 `exp`를 읽지 않고도 재발급
            시점을 안다. 현재 기본값 3600(60분).
          examples: [3600]

    # ---------------------------------------------------------------------
    # auth — 소셜 로그인 (backlog §1.4 P0-1, 2.8.0 신설). 정본은 최상위 x-social-login.
    # ---------------------------------------------------------------------
    OAuthStartRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri:
          type: string
          minLength: 1
          description: |
            SPA 가 제공자 인가 뒤 되돌아올 자기 경로. 서버 허용 목록(제공자별 설정)
            안의 값만 받는다 — 밖이면 422(`x-social-login.provider_state`).
            **`minLength: 1`은 스키마 층이다** — `SignupRequest`의 다섯 필드와 달리
            이 필드는 사용자가 타이핑하지 않는 프로토콜 값이라 정규화·형식 판정이
            얽히지 않는다. 완전히 빈 값은 422 **배열**(`loc: ["body",
            "redirect_uri"]`)이고, 제공자 왕복 전에 끊긴다 — 허용 목록 판정
            (`redirect_uri_not_allowed`, 도메인 층·**문자열**)과는 다른 갈래다.
          examples: ["http://localhost:5173/auth/google/callback"]

    OAuthStartResponse:
      type: object
      required: [authorization_url, state]
      properties:
        authorization_url:
          type: string
          description: 사용자를 리디렉션할 제공자 인가 URL. `client_id`·`redirect_uri`·`scope`·`state`·`nonce` 를 담는다.
        state:
          type: string
          description: |
            CSRF 방지 토큰. SPA 는 이 값을 콜백까지 들고 있다가 `OAuthCallbackRequest.state`
            로 그대로 되돌려 보낸다. 서버가 128비트 이상 무작위로 발급하고 단발로만
            소비한다(`x-social-login.state`).

    OAuthCallbackRequest:
      type: object
      required: [code, state, redirect_uri]
      description: |
        SPA 라우트 `/auth/{provider}/callback?code=…&state=…` 가 그대로 받은 두 쿼리
        값과, `oauthStart` 에 보냈던 것과 **같은** `redirect_uri` 를 함께 보낸다 — 셋의
        일치가 `x-social-login.state` 단발 소비 조건이다.
      properties:
        code:
          type: string
          minLength: 1
          description: |
            제공자가 발급한 인가 코드. 응답 본문·로그 어디에도 반향되지 않는다.
            빈 값은 422 **배열**(스키마 층, `OAuthStartRequest.redirect_uri` 와 같은
            근거) — 제공자를 왕복하지 않고 끊긴다.
        state:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          examples: ["http://localhost:5173/auth/google/callback"]

    # ---------------------------------------------------------------------
    # documents
    # ---------------------------------------------------------------------
    DocumentTextRequest:
      type: object
      required: [text]
      description: |
        붙여넣기 업로드 요청 (JSON 모드).
        **FastAPI 자동 생성 OpenAPI에는 이 스키마가 등장하지 않는다** — 라우터가
        `Request`를 직접 읽기 때문이다. 라우터 코드를 읽고 손으로 적었다.
      properties:
        text:
          type: string
          x-service-constraint: { max_length: 20000, measured_on: raw }
          description: |
            공백만 있으면 422("본문이 비어 있습니다").
            20,000자 초과도 422. **바이트가 아니라 문자 수**로 잰다 — 한국어는 UTF-8에서
            글자당 3바이트라 바이트 기준이면 실제 분량의 1/3에서 잘린다.
            둘 다 **서비스 층** 판정이라 422 **문자열** detail이다(`maxLength` 미사용 사유는
            `x-request-field-constraints`). ⚠ 이 필드는 `edited_text`와 달리 **원시 길이**로
            잰다 — 그 비대칭은 미결이다(같은 절 `x-open-asymmetry`).
            길이와 **별개의 축**으로 **정의역**이 걸린다 — 텍스트로 왕복하지 않는 값은
            길이와 무관하게 422다(`x-stored-text-domain`).
        title:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            생략하면(또는 정제 후 남는 것이 없으면) **고정 문구 `제목 없음`**이다.
            **본문 첫 줄에서 유도하지 않는다** (2026-08-20 사용자 결정, `x-change-policy` G3).
            유도된 제목은 봉인된 원문의 조각을 평문 열 `documents.title`에 복제해
            **암호화를 우회**한다 — 얻는 것은 목록 화면의 편의뿐이다. 정본과 전문은
            **`x-title-policy`**.
            사용자가 준 제목은 255자까지 자르기만 하고 거절하지 않는다.
            **파일명은 제목으로 쓰지 않는다** — 임의 문자열이라 내용을 예측할 수 없다.
            (이 개정은 그 금지를 **강화한다**: 파일명도 본문도 쓰지 않는다.)
        workspace_id:
          anyOf: [{ type: string, format: uuid }, { type: 'null' }]
          description: |
            생략하거나 `null`이면 기본(가장 먼저 만든) 작업 공간. 빈 문자열도 미지정과 같다.
            남의 것이면 **404**(403 아님 — 빈 목록으로 답하면 남의 작업 공간 존재를 확인하는
            수단이 된다).

            UUID 형식이 아니면 **422**이고 `detail`은 **문자열**
            `"작업 공간 식별자 형식이 올바르지 않습니다"`다 — **값 자체는 메시지에 담지 않는다.**
            **multipart 팔(`DocumentFileRequest.workspace_id`)과 같은 규칙이며**, 이 문장은
            그 대칭을 복기한다(2026-08-23, 근거 **G4** + G1). 종전에는 같은 규칙이 파일 모드
            쪽에만 적혀 있었고, 그 비대칭에서 JSON 팔이 배열 `detail`을 내는 결함이 실제로
            생겼다 — 오퍼레이션 수준 422 서술이 두 팔 모두에 걸린다는 것이 **이미** 계약이었다.

            **`format: uuid`는 주석이지 강제 지점이 아니다.** 이 형식 검사는 서비스 층에
            있고(`x-request-field-constraints`가 다섯 필드에 대해 판정한 것과 같은 구조),
            역직렬화 층에서 재면 배열 `detail`이 나가 위 문장을 위반한다. 검사가 놓이는
            **순서**는 `paths./documents.post.description`이 정한다 — 형식은 소유권의
            선결이므로 같은 단계이고 크기·추출·본문 길이보다 **뒤다.**

    DocumentFileRequest:
      type: object
      required: [file]
      description: |
        파일 업로드 요청 (multipart/form-data 모드).
        **FastAPI 자동 생성 OpenAPI에는 이 요청 본문이 없다** — 손으로 적었다.
        React `createDocumentFromFile`은 `file`과 `workspace_id`만 보낸다.
      properties:
        file:
          type: string
          format: binary
          description: |
            docx · pdf · hwpx (확장자 대소문자 무시). 10MB 초과는 413,
            그 밖의 형식·추출 실패는 422.
            파트가 없거나 파일이 아니면 422("업로드할 파일(file)이 필요합니다").
        title:
          type: string
          description: |
            폼 값은 전부 문자열이다. 생략하면(또는 정제 후 남는 것이 없으면)
            **고정 문구 `제목 없음`**이다 — **추출한 본문에서도, `file` 파트의 파일 이름에서도
            유도하지 않는다** (2026-08-20 사용자 결정, `x-change-policy` G3).
            **파일명은 제목으로 쓰지 않는다** — 임의 문자열이라 내용을 예측할 수 없고,
            본문 첫 줄은 암호화 경계를 우회한다.
            붙여넣기 모드와 **같은 규칙이다**. 정본과 전문은 **`x-title-policy`**.
        workspace_id:
          type: string
          format: uuid
          description: |
            빈 문자열은 미지정과 같게 다룬다. UUID 형식이 아니면 422
            ("작업 공간 식별자 형식이 올바르지 않습니다") — **값 자체는 메시지에 담지 않는다.**

    DocumentCreatedResponse:
      type: object
      required: [document_id, conversion_id, status, char_count]
      description: 업로드 접수 응답. 변환은 아직 시작되지 않았다(202).
      properties:
        document_id: { type: string, format: uuid }
        conversion_id:
          type: string
          format: uuid
          description: '`Location` 헤더의 값과 같은 식별자여야 한다.'
        status: { $ref: '#/components/schemas/ConversionStatus' }
        char_count:
          type: integer
          description: 공백 포함 문자 수. 크레딧 환산(1,000자 = 1크레딧)의 기준값이다.

    ConversionReviewRequest:
      type: object
      required: [edited_text]
      properties:
        edited_text:
          type: string
          x-service-constraint: { max_length: 20000, measured_on: normalized }
          description: |
            제어문자를 걷어내고 줄바꿈을 통일한(CRLF·단독 CR → LF) 뒤 **그 결과로** 빈 값·길이를
            판정한다. 원문과 **같은 20,000자 상한**을 쓴다 — 검수는 초안을 다듬는 자리이지 새
            문서를 쓰는 자리가 아니다. 먼저 걷어내는 이유는 docx(XML)가 담지 못하는 문자를
            저장해 두면 **내보내기 시점에** 터져 사용자가 원인을 알 수 없는 500을 받기
            때문이다.
            위반은 422 **문자열** detail이며, 그래서 `maxLength`를 쓰지 않는다 — 스키마
            키워드는 정규화 전 원시 값에 걸린다(`x-request-field-constraints`).
            이 필드도 봉인해 저장하므로 **정의역**이 함께 걸린다(`x-stored-text-domain`) —
            길이와는 다른 축이고, 그 팔의 마감은 이 오퍼레이션을 구현하는 단위다.

    ConversionResponse:
      type: object
      required:
        [id, document_id, status, source_format, export_format, export_format_choices,
         format_preservation, easy_text, edited_text, reviewed_at, feedback_submitted_at,
         segment_map, model, provider_name,
         input_tokens, output_tokens, failure_code]
      description: |
        변환 상태·결과. 완료 전에는 **결과 필드**가 모두 비어 있다.

        **형식 셋(`source_format`·`export_format`·`export_format_choices`·
        `format_preservation`)은 결과 필드가 아니다.** 문서 메타에서 오는 값이라
        `pending`·`processing`·`failed`에서도 그대로 나간다. 검수 화면을 직접 URL로
        열거나 새로고침해도 원본 형식을 잃지 않아야 하고(`DESIGN.md` §6.5 「필요한 계약
        정보」), 변환이 실패한 화면에서도 「이 문서는 DOCX였다」는 사실은 여전히 참이기
        때문이다.

        **required 범위가 FastAPI 자동 생성물보다 넓다.** 자동 생성물은
        기본값이 있거나 nullable인 필드를 required에서 빼지만, 실제 응답은 항상
        모든 키를 실어 보내고 React도 모든 키를 필수로 다룬다. 계약은 "키가 항상
        존재하고 값이 null일 수 있다"로 고정한다 — Kotlin이 null 필드를 생략하면
        (Jackson `NON_NULL`) React가 `undefined`를 받아 분기가 달라진다.
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConversionStatus' }
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            이 변환이 딸린 문서의 **원본 형식**. `DocumentListItem.source_format`과
            **같은 값 집합이자 같은 값**이다 — 두 응답이 같은 컬럼을 읽는다.

            검수 화면이 화면 전환 상태에 기대지 않고 이 값 하나로 「DOCX로 내려받기」를
            그릴 수 있어야 한다는 것이 이 필드가 여기 있는 이유다(`DESIGN.md` §6.5).
        export_format:
          anyOf:
            - { $ref: '#/components/schemas/ExportFormat' }
            - { type: 'null' }
          description: |
            이 변환을 내려받을 때 나오는 형식. 서버가 `source_format`에서 유도한다:
            `text → txt` · `docx → docx` · `hwpx → hwpx` · **`pdf → null`**.
            유도표의 정본은 최상위 `x-export-format-derivation`이다.

            **2.0.0부터 「나오는 값」이자 「요청할 수 있는 유일한 값」이다.**
            `GET /conversions/{conversion_id}/export`가 이 값과 다른 `format`을 **거절한다**
            (409). 1.6.0에서 이 필드를 세울 때 「지금 요청해야 하는 값이지 지금 반드시
            나오는 값이 아니다」라고 적었던 단서는 그 강제가 서면서 사라졌다 —
            **정의를 바꾸지 않고** 강제만 붙었다. 그 오퍼레이션의 `format`을 생략하면
            서버가 여기 적힌 값을 그대로 쓴다.

            **`null`이면 서버가 하나로 정하지 않았다는 뜻이다.** 두 갈래로 갈린다 —
            `export_format_choices`가 **비어 있으면** 어떤 `format` 값도 생략도 통과하지
            못하고(내려받기 자체가 없다), **비어 있지 않으면** 그 배열 안의 값 하나를
            `format`으로 골라야 한다(생략은 409). 아래 두 문단이 그 사유다.

            **`null`은 「모른다」가 아니라 「서버가 정하지 않는다」다.** 오늘 이 값이 나오는
            원본은 PDF뿐이다. PDF는 편집 가능한 문서 구조가 아니라서 「들어온 형식 그대로」
            (§6.5)가 성립하지 않고 PDF 렌더러도 없다 — 그래서 **사용자가**
            `export_format_choices`(`[docx, hwpx]`) 중 하나를 골라 그 형식의 새 문서로
            받는다(2.6.0 재결정, `x-export-format-derivation.choices`). 그 전(2.0.0–2.5.1)
            에는 PDF에 선택지도 없어 이 `null`이 곧 「내보낼 수단이 없다」였다 — 오늘도
            `choices`가 비는 원본이 생기면(현재는 없다) 그 원본에서는 이 옛 뜻이 그대로다.
        export_format_choices:
          type: array
          items: { $ref: '#/components/schemas/ExportFormat' }
          description: |
            `export_format`이 `null`이고 이 원본에 사용자가 고를 수 있는 형식이 있을 때만
            **비어 있지 않은 배열**이다 — 그 밖에는(`export_format`이 값을 냈거나, `null`
            이지만 고를 형식도 없을 때) **빈 배열**이다. `null`이 아니라 `[]`인 것은
            응답의 다른 배열 필드와 같은 규칙이다 — React가 `undefined` 분기를 만들지 않는다.

            정본은 `x-export-format-derivation.choices[source_format]`이다. 오늘 이 배열이
            비어 있지 않은 원본은 PDF 하나뿐이고 값은 `[docx, hwpx]`다(2.6.0).

            `GET /conversions/{conversion_id}/export`의 `format`은 이 배열이 비어 있지
            않으면 그 안의 값이어야 한다(생략은 409 — `enforcement.on_absent_with_choices`).
        format_preservation:
          anyOf:
            - { $ref: '#/components/schemas/FormatPreservation' }
            - { type: 'null' }
          description: |
            원본 서식 유지 상태. **`null`은 「서버가 아직 판정하지 않았다」다** —
            「유지 가능」도 「유지 불가」도 아니다.

            `null`이 나오는 조건은 하나뿐이고, **판정의 재료가 없다**는 뜻이다.
              ⑴ **변환이 아직 완료되지 않았다** — 판정의 한쪽인 검수본(`edited_text ??
                 easy_text`)이 없다. 원본 단위와 짝지을 문단이 없으므로 어느 상태를 골라도
                 추측이다. 완료되면 그다음 조회에서 값이 선다.

            **2.6.0에서 둘째 조건(「원본이 PDF다」)이 빠졌다.** PDF는 이제 완료 전이든
            후든 **즉시 `not_applicable`**이다(`FormatPreservationStatus.not_applicable`
            ⑷) — 반영이라는 개념 자체가 PDF에 적용되지 않는다는 사실은 검수본을 기다려도
            바뀌지 않으므로, 붙여넣기·옛 업로드와 같은 「영구히 참」 갈래로 옮겼다.

            그 밖에는 언제나 값이 선다 — 원본이 없거나(붙여넣기·옛 업로드·PDF) `not_applicable`,
            있으면 서버가 **실제로 할 반영을 미리 재서** `available`·`partial`·`failed`
            중 하나다. 판정과 내보내기가 같은 코드를 지나므로 여기서 말한 개수와 실제로
            나가는 파일이 갈릴 수 없다.

            §6.5: "상태는 낙관적으로 추측하지 않는다. 서버가 제공한 결과만 표시한다."
            `null`은 **서버가 아무것도 제공하지 않았다**는 뜻이고, 화면은 그때 상태를
            지어내지 말고 `원본 서식 유지` 패널의 상태 줄을 비운다.
        easy_text:
          anyOf: [{ type: string }, { type: 'null' }]
          description: AI 초안. `done`이 아니면 null.
        edited_text:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            담당자 검수 수정본. 저장 전에는 null.
            **AI 초안과 별도로 보존한다** — 에디터 초기값은 `edited_text ?? easy_text`이고,
            초안은 수정률 KPI의 기준선으로 남는다.
        reviewed_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: 검수 수정본을 마지막으로 저장한 시각(ISO 8601). null이면 초안 그대로.
        feedback_submitted_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            이 변환에 **파일럿 피드백을 마지막으로 제출한** 시각(ISO 8601). 낸 적이 없으면 null.
            값은 `conversion_feedback.submitted_at` 이고 `ConversionFeedbackResponse.submitted_at`
            과 **같은 열**이다 — 덮어쓰면 함께 갱신된다.

            **`reviewed_at` 과 다른 사실이다.** 「수정본을 저장했다」와 「의견을 냈다」는 서로를
            함의하지 않는다: 초안을 그대로 두고 의견만 낼 수 있고, 고쳐 저장하고 의견은 안 낼
            수도 있다. 그래서 피드백 제출이 `reviewed_at` 을 대신 찍지 않는다 — 두 사실을 한
            컬럼에 뭉개면 수정률 지표(`conversion_feedback.edit_distance`·`edited_char_count`)가
            기대는 구분이 무너진다. 검수 화면이 「검수함」을 그리려면 **둘 다** 봐야 하고, 이
            필드가 없으면 새로고침한 화면이 방금 낸 의견을 잃는다.

            **제출 시각뿐이다.** 배포 의향·만족도·소요 시간·자유 의견은 여기 싣지 않는다 —
            자유 의견은 봉인해 둔 사용자 콘텐츠라 조회 응답에 나가지 않고, 그 값을 되돌려
            주는 자리는 저장 응답(`PUT /conversions/{conversion_id}/feedback`) 하나다.
        segment_map:
          anyOf:
            - { $ref: '#/components/schemas/SegmentMap' }
            - { type: 'null' }
          description: |
            원문-쉬운 글 **문단 단위 대응표**(P0-4, `docs/plans/2026-09-04-p0-4-paragraph-mapping-reconversion.md`
            §2·§3). `null`이면 ⑴ 변환이 아직 완료되지 않았거나 ⑵ 완료됐지만 원문·본문 중
            하나를 서버가 지금 읽을 수 없다는 뜻이다 — 사유 필드를 따로 두지 않는다.
            `status`와 `easy_text`가 이미 사유를 말하고, ⑵는 오늘 관측되지 않는 경합 갈래다.

            **서버에 저장되지 않는다.** 매 조회마다 (문서 원문) 대
            (`edited_text ?? easy_text`)에서 순수 함수로 유도한다 — 검수
            저장마다 즉시 낡는 두 번째 진실을 만들지 않기 위해서다. **그래서 클라이언트가
            에디터에서 텍스트를 수정한 뒤에는 이 응답이 낡는다** — 화면은 저장(PUT) 후
            응답이 다시 오는 시점까지, 또는 자신이 가진 원문·수정본으로 **같은 규칙을 다시
            계산**해 대응을 갱신해도 된다(서버가 강제하지 않는 클라이언트 재계산).

            원문 자체(문자열)는 여기 싣지 않는다 — 화면은 이미
            `GET /documents/{document_id}/source`로 원문을 받고, 본문은 이 응답의
            `easy_text`·`edited_text`에 있다. 배열은 색인만 나른다.
        model: { anyOf: [{ type: string }, { type: 'null' }] }
        provider_name: { anyOf: [{ type: string }, { type: 'null' }] }
        input_tokens: { anyOf: [{ type: integer }, { type: 'null' }] }
        output_tokens: { anyOf: [{ type: integer }, { type: 'null' }] }
        failure_code:
          anyOf: [{ type: string }, { type: 'null' }]
          maxLength: 64
          description: |
            실패 사유 코드 = 예외 클래스명. **문서 본문·모델 응답은 절대 담기지 않는다.**
            **변환이 접수된 뒤의 실패만 여기 실린다.** 접수 자체가 실패하면 저장과 큐
            등록이 함께 롤백되어 변환 행이 남지 않으므로(`POST /documents` 설명) 이
            필드로 알릴 대상이 없다.
            `"EnqueueFailed"`는 **2026-08-20에 폐기된 값**이다 — Redis/ARQ 전제였고,
            어떤 구현에서도 더는 나오지 않는다(`x-retired-responses`).

    # ---------------------------------------------------------------------
    # 문단 대응표 (2.12.0 신설, P0-4 S2) — `ConversionResponse.segment_map`이 쓴다.
    # ---------------------------------------------------------------------
    SegmentConfidence:
      type: string
      enum: [high, low]
      description: |
        쉬운 글 단위 하나가 원본 단위에 대응한다는 판정의 **신뢰도**.

        `high`는 다시 쓰기를 견뎌 살아남는 앵커(숫자·날짜·시각·금액·
        백분율·연락처·URL 같은 사실)로 뒷받침된 대응이다. `low`는 그런 앵커가 없어 순서
        비례 보간으로만 나온 추정이다 — 화면은 `high`만 대응으로 주장하고 `low`는 「대응을
        확인하지 못했습니다」로 표시한다(계획 §2).

        실제 (원문, 변환문) 쌍 코퍼스가 없어 이 판정의 정확도를 무료로 측정할 수 없다 —
        그래서 정확도를 약속하는 대신 모르는 것을 모른다고 말하는 모양으로 설계했다.
    SourceUnitKind:
      type: string
      enum: [body, table_cell, list_item]
      description: |
        원본 단위(저장된 추출 원문을 `\n`으로 쪼갠 줄) 하나의 종류 — 2.23.0(P0-4 S8-3)에서
        신설. `table_cell`은 표 칸, `list_item`은 목록 항목(원형 숫자·글머리 기호·번호
        매김 등)이고, 그 밖은 전부 `body`다. 표의 행·열 좌표, 목록의 깊이, 제목 수준은
        싣지 않는다 — 화면이 셀·항목을 합치거나 나누지 말고 그 안만 바꾸라는 힌트로
        족하다. DOCX·HWPX는 추출 시점에 구조에서 직접 정하고, TXT는 줄머리 마커로
        추정한다(휴리스틱이라 완벽하지 않다). 이 조각 이전에 만든 문서는 전부 `body`다
        (백필하지 않는다).
    SegmentMapUnit:
      type: object
      required: [easy_unit_index, source_unit_indexes, confidence]
      description: |
        `segment_map.units`의 항목 하나 — 쉬운 글 단위 하나와 그것이 대응하는 원본 단위들.
      properties:
        easy_unit_index:
          type: integer
          minimum: 0
          description: |
            `edited_text ?? easy_text`를 `\n`으로 쪼갠 줄의 0 기반 색인. `segment_map.units`
            배열에서 이 값과 배열 안 위치는 언제나 같다(§3 「색인 순서 그대로」) — 그래도
            값을 함께 싣는 것은 배열을 다시 정렬해도 이 대응이 깨지지 않게 하기 위해서다.
        source_unit_indexes:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            이 쉬운 글 단위가 대응하는 **원본 단위**(저장된 추출 원문을 `\n`으로 쪼갠 줄)의
            0 기반 색인 목록. **0개 이상**이다 — 빈 배열은 「이 쉬운 글 단위에 대응하는
            원본 단위를 찾지 못했다」는 뜻이다(원본 단위가 하나도 없는 문서 등).
            둘 이상이면 그 원본 단위들이 이 쉬운 글 단위 하나로 합쳐졌다는 뜻이다(N:1).
            원본 단위 하나가 여러 쉬운 글 단위에 걸쳐 나오는 것(1:N)은 이 배열이 아니라
            서로 다른 `units` 항목이 **같은 값**을 실어 나타낸다 — 계획 §2 A3.
        confidence: { $ref: '#/components/schemas/SegmentConfidence' }
    SegmentMap:
      type: object
      required: [source_unit_count, easy_unit_count, units, compliant_source_units, source_unit_kinds]
      description: |
        `ConversionResponse.segment_map`의 본체 — 원문 단위와 쉬운 글 단위 사이의 대응표
        전체. `source_unit_count`·`easy_unit_count`는 각 쪽 단위 총수이고, 검증·화면
        렌더링이 배열 길이를 다시 세지 않아도 되게 한다.

        **스타일 게이트를 이미 통과한 원본 단위 목록(`compliant_source_units`)은 2.18.0부터
        있다**(P0-4 S7, x-changelog 2.18.0 참고). 재변환(P0-4 S4, 2.14.0)은 그 슬라이스에서
        이 자리를 더하지 않고 후보 텍스트를 돌려주는 `reconvertUnit` 오퍼레이션 하나로
        좁혔었다 — 이번 버전이 그 자리를 채운다.

        **원본 단위 종류(`source_unit_kinds`)는 2.23.0부터 있다**(P0-4 S8-3, x-changelog
        2.23.0 참고) — 표·목록 구조 힌트. `source_unit_indexes`(`SegmentMapUnit`)·
        `compliant_source_units`와 같은 좌표계(원본을 `\n`으로 쪼갠 줄)다.
      properties:
        source_unit_count:
          type: integer
          minimum: 0
          description: 원본 단위(저장된 추출 원문을 `\n`으로 쪼갠 줄) 총수.
        easy_unit_count:
          type: integer
          minimum: 0
          description: |
            쉬운 글 단위(`edited_text ?? easy_text`를 `\n`으로 쪼갠 줄) 총수 —
            `units` 배열의 길이와 같다.
        units:
          type: array
          items: { $ref: '#/components/schemas/SegmentMapUnit' }
          description: |
            쉬운 글 단위 색인 순서 그대로, **`easy_unit_count`개**다. 모든 쉬운 글 단위가
            정확히 한 번씩 나온다(전사성) — 계획 §6 A6.
        compliant_source_units:
          type: array
          items: { type: integer, minimum: 0 }
          uniqueItems: true
          description: |
            이미 쉬운 글 스타일 규칙(`checkStyle`, 문장 길이·쉼표 수·이중 피동·어려운
            표현·치환 비문)을 위반 0건으로 통과하고 공백만이 아닌 원본 단위의 0 기반
            색인 — **오름차순, 중복 없음**. 공백만인 단위는 통과로 세지 않는다.

            **원천은 문서 원문이다.** `source_unit_indexes`(`SegmentMapUnit`)와 같은 좌표계다
            (`\n`으로 쪼갠 원본 줄 색인). 저장하지 않고 매 조회마다 다시 계산한다.

            화면은 이 목록에 있는 행에 「이미 쉬운 글 규칙을 통과했다」 표시만 달고
            재변환 버튼을 막지 않는다 — 판단은 사용자 몫이다(P0-4 S7, 계획 §11.2).
        source_unit_kinds:
          type: array
          items: { $ref: '#/components/schemas/SourceUnitKind' }
          description: |
            원본 단위(저장된 추출 원문을 `\n`으로 쪼갠 줄)와 **같은 좌표·같은 길이**로
            `source_unit_count`개다. 원본 단위마다 추출 시점에 정해 저장한 종류(DOCX·
            HWPX는 표 칸·목록 구조, TXT는 줄머리 마커 휴리스틱)를 담는다. 이 필드를
            신설하기 전에 만든 문서는 저장된 값이 없어 전부 `body`로 나간다(백필하지
            않는다) — 계약이 보장하는 것은 배열 길이뿐, 옛 문서의 실제 구조가 아니다.

            화면은 종류가 같은 연속 구간을 표·목록 배지로 묶어 보여 줄 뿐, 재변환이나
            편집을 막지 않는다 — `compliant_source_units`와 같은 원칙(판단은 사용자
            몫).

    # ---------------------------------------------------------------------
    # 재변환 (2.14.0 신설, P0-4 S4) — `reconvertUnit` 하나가 쓴다.
    # ---------------------------------------------------------------------
    ReconvertUnitRequest:
      type: object
      required: [easy_unit_indexes, easy_text_fingerprint]
      description: |
        `POST /conversions/{conversion_id}/units/{source_unit_index}/reconvert`의
        요청 본문. `source_unit_index`는 경로가 지고 본문이 되풀이하지 않는다.
      properties:
        easy_unit_indexes:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            클라이언트가 **지금** 이 원본 단위에 대응시키고 있는 쉬운 글 단위 색인들.
            빈 배열일 수 있다(대응을 찾지 못한 상태). 서버는 이 값으로 판정하지 않고
            응답에 그대로 되울린다.
        easy_text_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: |
            에디터 **현재** 본문의 SHA-256 다이제스트를 16진 소문자 64자로 인코딩한 값.
            서버는 이 값으로 아무 판정도 하지 않고 응답에 그대로 되울린다 — 응답이
            어느 편집 상태에 대한 것인지 클라이언트가 식별하는 용도다.
    ReconvertUnitResponse:
      type: object
      required:
        [
          candidate_text,
          source_unit_index,
          easy_unit_indexes,
          easy_text_fingerprint,
          llm_calls_used,
          remaining_call_budget,
        ]
      description: |
        `reconvertUnit`의 200 응답. **후보뿐이고 변환 본문에는 아무것도 쓰이지 않는다.**
      properties:
        candidate_text:
          type: string
          description: |
            다시 변환한 후보 본문 — 원본 단위 하나에 대응하는 쉬운 글 텍스트다(1:N이면
            `\n`으로 이어질 수 있다, 자동 변환의 프롬프트 규칙과 같다). 채택은 클라이언트
            몫이고 서버는 어떤 본문도 저장하지 않는다.
        source_unit_index:
          type: integer
          minimum: 0
          description: 요청 경로의 `source_unit_index`를 그대로 되울린다.
        easy_unit_indexes:
          type: array
          items: { type: integer, minimum: 0 }
          description: 요청 `easy_unit_indexes`를 그대로 되울린다.
        easy_text_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: 요청 `easy_text_fingerprint`를 그대로 되울린다.
        llm_calls_used:
          type: integer
          minimum: 1
          maximum: 2
          description: |
            이 재변환이 실제로 쓴 LLM 호출 수 — 1(보정 불필요) 또는 2(보정 호출까지).
            `remaining_call_budget`이 줄어든 양과 같다.
        remaining_call_budget:
          type: integer
          minimum: 0
          description: |
            이 호출을 정산한 뒤 이 문서에 남은 재변환 호출 예산
            (`easydoc.reconversion.call-budget`에서 실제 사용량 누계를 뺀 값).

    # ---------------------------------------------------------------------
    # 파일럿 피드백 (1.5.0 신설) — 게이트 ① 판정 수단.
    # 세 스키마 모두 `PUT /conversions/{conversion_id}/feedback` 하나에서만 쓰인다.
    # ---------------------------------------------------------------------
    PublishIntent:
      type: string
      enum: [as_is, with_edits, not_usable]
      description: |
        검수 담당자의 **배포 의향**. 값의 뜻은 이렇다:
          - `as_is` — 그대로 쓸 수 있다
          - `with_edits` — 조금 고쳐서 쓰겠다
          - `not_usable` — 쓸 수 없다

        **이 값 자체가 게이트 ① 판정의 분모다.** 통과 기준 1이 10건 중 `as_is`와
        `with_edits`의 **건수**를 세므로(`docs/pilot-runbook.md` 「게이트 ① 판정」),
        값을 늘리거나 이름을 바꾸면 스키마가 아니라 **판정 기준**이 바뀐다. 「보통」 같은
        중간값을 더하면 세는 쪽이 그것을 어느 편에 넣을지 계약이 답하지 못한다 —
        값 추가는 `x-change-policy.escalate_to_leader`에 걸리는 변경이다.

        **독립 컴포넌트로 두는 이유는 `ConversionStatus`와 같다** — React 생성 타입이
        이름으로 부르는 union이어야 한다. 인라인 enum은 익명 타입으로 풀려 화면 코드가
        세 문자열 리터럴을 자기 자리에 복제하게 되고, 그러면 값 집합이 두 벌이 된다.

    ConversionFeedbackRequest:
      type: object
      required: [publish_intent, quality_score, minutes_spent]
      description: |
        검수 화면 하단 피드백 폼의 제출 본문. 수기 입력은 이 네 필드가 전부이고
        나머지 지표는 시스템이 남긴다(`docs/pilot-runbook.md` 「기록 방법」).
        `comment`만 선택이며, 나머지 셋은 없으면 판정이 성립하지 않으므로 필수다.
      properties:
        publish_intent: { $ref: '#/components/schemas/PublishIntent' }
        quality_score:
          type: integer
          description: |
            품질 만족도. **1 이상 5 이하의 정수**다(1이 가장 낮고 5가 가장 높다).
            게이트 ① 통과 기준 2가 이 값의 평균을 3.5와 견준다.

            **`minimum`/`maximum`을 쓰지 않는다.** 범위 위반은 이 계약에서 **서비스 층**
            판정이고 422 **문자열** detail이다. 스키마 키워드로 적으면 같은 위반이 배열
            detail로 나가고 사용자에게 보이는 문구가 한국어에서 영문으로 바뀐다 —
            `x-request-field-constraints.x-decision`의 둘째 사유가 그대로 적용된다.
            그래서 **범위는 이 산문이 고정한다.**
            `x-service-constraint`도 달지 않는다: 그 확장은 **길이** 축의 상한을 적는
            자리이고 여기는 값의 범위다. 두 축을 한 키로 뭉치면 그 키를 읽는 대조가
            무엇을 재는지 알 수 없게 된다.
        minutes_spent:
          type: integer
          description: |
            **이 건 하나**를 처리하는 데 든 시간(분). **0 이상 600 이하의 정수**다.
            게이트 ① 기준 3의 중앙값이 이 값에서 나온다.

            **상한 600(10시간)의 사유**: 문서 한 건의 검수가 10시간을 넘는 값은 측정값이
            아니라 **오타**다(자릿수를 하나 더 누른 입력 하나가 중앙값을 통째로 끌어올린다).
            상한이 막는 것은 성실한 응답이 아니라 실수다.
            **0을 허용하는 사유**: 1분이 안 걸린 건이 실제로 있다. 하한을 1로 두면 가장
            빠른 건이 반올림 때문에 거절되는데, 그것은 이 지표가 재려는 것과 정반대다.
            범위 위반의 처분은 `quality_score`와 같다(422 문자열, 스키마 키워드 없음).
        comment:
          anyOf: [{ type: string }, { type: 'null' }]
          x-service-constraint: { max_length: 500, measured_on: normalized }
          description: |
            자유 의견. **선택**이며 주지 않거나 `null`이면 의견 없음이다.

            **정규화 후** 길이를 재고 500자를 넘으면 422 **문자열** detail이다.
            `maxLength`를 쓰지 않는 이유는 `ConversionReviewRequest.edited_text`와 같다 —
            스키마 키워드는 정규화 **전** 원시 값에 걸려 "정규화 후 길이"를 말하지 못한다
            (`x-request-field-constraints.x-openapi-expressibility`).
            상한 값의 정본은 `x-input-limits.max_feedback_comment_length`다.

            **이 필드는 AEAD로 봉인해 저장한다.** 자유 의견에는 사용자가 문서 본문 조각을
            그대로 옮겨 적을 수 있어 평문 열에 둘 수 없다. 봉인해 저장하므로 길이와 다른
            축인 **저장 정의역**이 함께 걸린다(`x-stored-text-domain` — 텍스트로 왕복하지
            않는 값은 받지 않는다). 봉인의 귀결로 집계 스크립트는 이 값을 읽지 못한다.

    ConversionFeedbackResponse:
      type: object
      required:
        [conversion_id, publish_intent, quality_score, minutes_spent,
         comment, submitted_at]
      description: |
        저장된 피드백. **required 범위가 넓은 사유는 `ConversionResponse`의 description에
        적힌 것과 같다** — 키는 항상 존재하고 값이 null일 수 있다. Kotlin이 null 필드를
        생략하면(Jackson `NON_NULL`) React가 `undefined`를 받아 분기가 달라진다.

        **저장된 값을 그대로 돌려준다.** 시스템이 계산하는 파생 지표(검수본과 초안의
        편집 거리·글자 수 같은 것)는 **응답에 싣지 않는다.** 그것은 판정용 집계 값이지
        사용자에게 보여 줄 값이 아니고, 검수본과의 차이를 화면에 올리면 「AI가 내 수정을
        채점한다」는 오해를 만든다. 파일럿이 재려는 것은 담당자의 **판단**이지 담당자의
        점수가 아니며, 채점받는다는 느낌은 그 판단 자체를 왜곡한다.
        파생 지표의 집계는 DB에서 스크립트가 한다(`docs/pilot-runbook.md` 「집계」).
      properties:
        conversion_id: { type: string, format: uuid }
        publish_intent: { $ref: '#/components/schemas/PublishIntent' }
        quality_score: { type: integer }
        minutes_spent: { type: integer }
        comment:
          anyOf: [{ type: string }, { type: 'null' }]
          description: |
            저장된 자유 의견. 주지 않았으면 null이다. 봉인해 둔 값을 **소유자 조회에서만**
            푼다 — 그래서 이 응답에 캐시 금지 헤더가 붙는다.
        submitted_at:
          type: string
          format: date-time
          description: |
            이 피드백을 **마지막으로 저장한** 시각(ISO 8601). 덮어쓰면 갱신된다.
            멱등 upsert라 "처음 낸 시각"과 "마지막으로 낸 시각"이 갈리는데, 판정에 쓰는
            것은 마지막 값이므로 계약이 싣는 것도 그것이다.

    DocumentListItem:
      type: object
      required:
        [id, title, source_format, char_count, created_at,
         retention_expires_at, conversion_id, status, reviewed_at, feedback_submitted_at]
      description: 문서 목록 한 줄 (문서 메타 + 최신 변환 상태). required 범위는 ConversionResponse와 같은 이유로 넓다.
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          maxLength: 255
          description: |
            사용자가 적어 준 제목, 없으면 고정 문구 `제목 없음`.
            **문서 본문에서도 업로드 파일 이름에서도 유도되지 않는다**(`x-title-policy`).
            `maxLength`는 사용자 입력을 자른 결과의 사후 보장이다 — 고정 문구는 그 상한과 무관하다.
            React `HistoryPage`가 이 값을 표에 **그대로 렌더링**하므로 값 자체가 화면 문구다.
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            붙여넣기는 `"text"`, 파일은 소문자 확장자.

            **1.6.0에서 인라인 enum을 `SourceFormat` 컴포넌트로 옮겼다** — 값 집합과
            그것을 enum으로 고정한 사유(2026-08-12 개정)는 전부 그쪽에 있다.
            `ConversionResponse.source_format`이 같은 값 집합을 쓰게 되면서, 인라인으로
            두 벌을 두면 한쪽만 늘어나는 날이 오기 때문이다.
        char_count: { type: integer }
        created_at: { type: string, format: date-time }
        retention_expires_at:
          type: string
          format: date-time
          description: 보관 만료 시점. 기본 생성 시각 + 30일.
        conversion_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        status:
          anyOf:
            - { $ref: '#/components/schemas/ConversionStatus' }
            - { type: 'null' }
          description: 최신 변환의 상태. 변환이 하나도 없으면 null.
        reviewed_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            목록에서 "검수함/초안"을 표시하려면 필요하다 — `status`만으로는 알 수 없다
            (`done`은 "AI 변환이 끝났다"는 뜻일 뿐이다).
        feedback_submitted_at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            **최신 변환**에 피드백을 마지막으로 제출한 시각. 낸 적이 없거나 변환이 하나도
            없으면 null이다. `ConversionResponse.feedback_submitted_at`과 같은 열을 읽고,
            그 필드의 설명이 「왜 `reviewed_at`으로 대신 찍지 않는가」의 정본이다.

            여기 함께 싣는 이유: 목록이 "검수함"을 그리는 근거가 **둘로 갈린다**(수정본 저장·
            의견 제출). 한쪽만 보면 의견만 낸 문서가 목록에서 영영 "검수 필요"로 남는다.

            최신 변환이 없으면(`conversion_id`가 null) 이 값도 null이다 — 피드백은 변환 한
            건에 딸리기 때문이다. 반대로 이 값이 서면 `status`는 언제나 `done`이다(완료 전
            변환에는 피드백을 낼 수 없다, #15의 409).

    DocumentSourceResponse:
      type: object
      required: [document_id, source_format, char_count, source_text]
      description: |
        `GET /documents/{document_id}/source` 응답 — **네 필드가 전부다.**

        **`DocumentListItem`에는 이 본문이 실리지 않는다.** 목록은 한 번에 여러 문서를
        돌려주는 자리라 원문을 얹으면 응답 크기가 문서 수만큼 곱해지고, 목록 화면은
        본문을 그리지 않는다. 원문은 언제나 이 오퍼레이션 하나로만 나간다.
      properties:
        document_id: { type: string, format: uuid }
        source_format:
          $ref: '#/components/schemas/SourceFormat'
          description: |
            이 원문이 어디서 왔는지. 붙여넣기는 `"text"`, 파일은 소문자 확장자다.
            `ConversionResponse.source_format`·`DocumentListItem.source_format`과
            **같은 열을 읽으므로** 세 자리의 값이 갈릴 수 없다.
        char_count:
          type: integer
          description: |
            `source_text`의 공백 포함 문자 수. `DocumentListItem.char_count`와 같은 열이다
            — 클라이언트가 본문을 세어 다시 구할 필요가 없게 함께 싣는다.
        source_text:
          type: string
          description: |
            **사용자가 올린 문서 원문 그대로다.** 이 필드가 있기 때문에
            이 오퍼레이션에 캐시 금지 헤더가 필수다.

            파일 업로드였다면 **파서가 뽑아낸 텍스트**이지 원본 파일 바이트가 아니다 —
            서식·표·이미지는 여기 없고, 그것을 되살리는 자리는 내보내기다
            (`GET /conversions/{conversion_id}/export`).
    DocumentListResponse:
      type: object
      required: [items, limit, offset, has_more]
      description: 총 개수는 싣지 않는다(전수 count는 목록 조회마다 비싸다).
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentListItem' }
          description: 최신순.
        limit: { type: integer, description: 요청에 쓰인 값을 그대로 되돌려준다. }
        offset: { type: integer, description: 요청에 쓰인 값을 그대로 되돌려준다. }
        has_more:
          type: boolean
          description: 다음 페이지가 있는지. 한 건 더 읽어(limit+1) 판정한다.

    # ---------------------------------------------------------------------
    # workspaces
    # ---------------------------------------------------------------------
    WorkspaceNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          x-service-constraint: { max_length: 50, non_empty: true, measured_on: normalized }
          description: |
            제어문자를 걷어내고 앞뒤 공백을 턴 뒤 **그 결과로** 판정한다 — 비어 있으면 422,
            50자를 넘으면 422이며 **자르지 않고 거절한다**. 둘 다 문자열 detail이다.
            `minLength`/`maxLength`를 쓰지 않는 이유가 **양방향**이다: `maxLength: 50`은
            제어문자를 포함한 원시 55자를 잘못 거절하고, `minLength: 1`은 서비스가 거절하는
            `"   "`(공백만)를 통과시킨다(`x-request-field-constraints`).

    WorkspaceResponse:
      type: object
      required: [id, name, created_at]
      description: 작업 공간 한 건 (POST·PATCH 응답). `document_count`는 싣지 않는다.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        created_at: { type: string, format: date-time }

    WorkspaceListItem:
      allOf:
        - $ref: '#/components/schemas/WorkspaceResponse'
        - type: object
          required: [document_count]
          description: |
            목록 한 줄. **문서 수는 목록에서만 준다** — 방금 만든 공간은 늘 0이고,
            이름만 바꾼 공간의 문서 수는 화면이 이미 안다. 응답마다 COUNT를 붙이면
            쓰지 않는 값을 위해 질의가 는다.
          properties:
            document_count: { type: integer, minimum: 0 }

    WorkspaceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceListItem' }
          description: '만든 순서. **첫 번째가 기본 작업 공간이다.**'

    # ---------------------------------------------------------------------
    # 워크스페이스 사용량 집계 (2.21.0 신설, U2)
    # ---------------------------------------------------------------------
    UsagePurpose:
      type: string
      enum: [convert, repair, reconvert]
      description: |
        `llm_calls.purpose`(V12, U1)와 같은 값 — 문서 1차 변환·조건부 보정·문단
        재변환. `LlmCallPurpose.wireName`이 정본이다.

    PurposeUsageItem:
      type: object
      required: [purpose, llm_calls, input_tokens, output_tokens, estimated_cost_usd]
      description: 워크스페이스 집계 안의 목적별 한 줄. `WorkspaceUsageResponse.by_purpose`.
      properties:
        purpose: { $ref: '#/components/schemas/UsagePurpose' }
        llm_calls: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd:
          description: |
            USD 소수를 **문자열**로 싣는다(부동소수 반올림 오차를 피한다 —
            `x-request-field-constraints`의 금액 필드와 같은 관행). 이 목적으로 알려진
            비용이 하나도 없으면(전부 단가 미상) `null`이다 — `"0"`이 아니다.
          anyOf:
            - { type: string, examples: ["0.112000"] }
            - { type: 'null' }

    WorkspaceUsageResponse:
      type: object
      required:
        - documents
        - characters
        - credits
        - llm_calls
        - input_tokens
        - output_tokens
        - estimated_cost_usd
        - cost_unknown_calls
        - by_purpose
      description: |
        `GET /workspaces/{workspace_id}/usage` 응답 — 계획
        `docs/plans/2026-09-07-usage-ledger-and-report.md` §2 결정 5-6(U2,
        2026-09-08 리뷰로 `documents`·`characters`·`credits`의 출처를 정정).
      properties:
        documents:
          type: integer
          minimum: 0
          description: |
            그 기간에 **완료된 LLM 호출이 하나라도 있던**(`llm_calls.called_at` 기준,
            문서 단위로 distinct) 문서 수 — `documents.created_at`(등록 시각) 기준이
            **아니다**. 등록만 되고 한 번도 변환되지 않은 문서는 비용도 크레딧도 쓰지
            않았으므로 여기 포함되지 않는다. 문서가 보존 만료·삭제로 없어져도 이 값은
            바뀌지 않는다 — `llm_calls`가 그 문서의 문자 수 스냅샷을 원장 행 자체에
            들고 있다(청구 근거가 문서 삭제로 사라지면 안 된다).
        characters:
          type: integer
          minimum: 0
          description: |
            위 `documents`가 센 문서들의 `char_count` **스냅샷** 합 — 문서가 지워진
            뒤에도 원장에 남은 값이라 지금의 `documents` 표를 다시 읽지 않는다.
        credits:
          type: integer
          minimum: 0
          description: 문서별 `ceil(char_count/1000)`을 각각 올림해 더한 값(합계를 한 번에 올린 값이 아니다). `characters`와 같은 스냅샷 출처를 쓴다.
        llm_calls:
          type: integer
          minimum: 0
          description: 그 기간에 끝난(`llm_calls.called_at`) 호출 수.
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd:
          description: |
            알려진 비용(`estimated_cost_usd IS NOT NULL`)만 더한 합. 그 기간에 알려진
            비용이 하나도 없으면 `null`이다(0달러가 아니다 — CLAUDE.md 「미설정은 null」).
          anyOf:
            - { type: string, examples: ["0.184000"] }
            - { type: 'null' }
        cost_unknown_calls:
          type: integer
          minimum: 0
          description: 단가 미상이라 위 합계에 들어가지 않은 호출 수.
        by_purpose:
          type: array
          items: { $ref: '#/components/schemas/PurposeUsageItem' }
          description: 목적(purpose)별 소계. 그 기간에 호출이 없던 목적은 목록에 없다(0행을 채우지 않는다).

    # ---------------------------------------------------------------------
    # 크레딧 계정 (2.22.0 신설, C1) — docs/plans/2026-09-07-credit-accounts.md
    # ---------------------------------------------------------------------
    CreditTransactionKind:
      type: string
      enum: [grant, reserve, consume, release, adjust]
      description: |
        `credit_transactions.kind`(V15)와 같은 값 — 부여 · 예약 · 소비 확정 · 해제 ·
        운영자 수동 조정. `kr.easydoc.core.credit.CreditTransactionKind.wireName`이
        정본이다.

    CreditReason:
      type: string
      enum: [signup, plan_monthly, manual, refund, conversion]
      description: |
        `credit_transactions.reason`(V15)와 같은 값 — 가입 부여 · 월 구독 갱신 ·
        운영자 수동 · 환급 · 문서 변환.

    CreditTransaction:
      type: object
      required: [id, kind, credits, reason, note, document_id, created_at]
      description: 크레딧 계정 거래 한 건. `WorkspaceCreditsResponse.transactions` 항목.
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CreditTransactionKind' }
        credits:
          type: integer
          description: |
            부호 있음 — `grant`·`release`는 항상 양수, `reserve`·`consume`은 항상 음수
            (등록 시 예약분과 완료 시 실제 청구분이 같은 크기다), `adjust`는 운영자가
            준 부호 그대로.
        reason: { $ref: '#/components/schemas/CreditReason' }
        note:
          description: 운영자 메모(`credit-grant` 프로필의 `--note`). 없으면 `null`.
          anyOf:
            - { type: string, maxLength: 200 }
            - { type: 'null' }
        document_id:
          description: '`reserve`·`consume`·`release`가 문서를 가리킨다. `grant`·`adjust`는 `null`.'
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        created_at: { type: string, format: date-time }

    WorkspaceCreditsResponse:
      type: object
      required: [workspace_id, balance, reserved, available, enforced, transactions]
      description: |
        `GET /workspaces/{workspace_id}/credits` 응답 — 크레딧 계정 계획 §2 결정 2·7.
      properties:
        workspace_id: { type: string, format: uuid }
        balance:
          type: integer
          description: 부여 합계 − 소비 합계. 집행이 꺼진 상태에서는 음수로 기록될 수 있다.
        reserved:
          type: integer
          minimum: 0
          description: 등록됐지만 아직 끝나지 않은 문서의 예약 합.
        available:
          type: integer
          description: '`balance − reserved`. 음수일 수 있다(집행 꺼짐).'
        enforced:
          type: boolean
          description: '`easydoc.credits.enforced` 그대로 — 꺼져 있으면 등록 예약이 잔액과 무관하게 항상 성공한다.'
        transactions:
          type: array
          items: { $ref: '#/components/schemas/CreditTransaction' }
          description: 최근 거래 최신순 50건.

    # ---------------------------------------------------------------------
    # 세금계산서 요청 기록 (2.24.0 신설) — docs/plans/2026-09-07-invoice-requests.md
    # ---------------------------------------------------------------------
    InvoiceRequestStatus:
      type: string
      enum: [requested, issued, rejected]
      description: |
        `invoice_requests.status`(V16)와 같은 값 — 요청됨 · 발급됨(운영자 수동) · 거절됨.
        `kr.easydoc.core.invoice.InvoiceRequestStatus.wireName`이 정본이다.

    InvoiceRequestCreate:
      type: object
      required: [business_number, company_name, contact_email, period_from, period_to]
      description: '`POST /workspaces/{workspace_id}/invoice-requests` 요청 본문. 길이·형식 규칙은 `x-request-field-constraints` 참조.'
      properties:
        business_number:
          type: string
          x-service-constraint: { checksum: national_tax_service, measured_on: normalized }
          description: |
            사업자등록번호. 하이픈·공백을 포함해 보내도 된다 — 숫자만 남겨 10자리로
            정규화하고 국세청 체크섬을 검증한다. 실패는 422 문자열 detail.
          examples: ["220-81-62517"]
        company_name:
          type: string
          x-service-constraint: { max_length: 100, non_empty: true, measured_on: normalized }
          description: 상호. 제어문자를 걷어내고 앞뒤 공백을 턴 뒤 판정한다 — 비어 있으면 422, 100자를 넘으면 422다.
        representative_name:
          x-service-constraint: { max_length: 50, measured_on: normalized }
          description: 대표자명(선택). 있으면 정규화 후 50자 이하여야 한다.
          anyOf:
            - { type: string, maxLength: 50 }
            - { type: 'null' }
        contact_email:
          type: string
          x-service-constraint: { max_length: 255, measured_on: normalized }
          description: 연락 이메일. `SignupRequest.email`과 같은 규칙(정규화 후 255자 이하, 형식 검사)으로 판정한다.
        address:
          x-service-constraint: { max_length: 200, measured_on: normalized }
          description: 주소(선택). 있으면 정규화 후 200자 이하여야 한다.
          anyOf:
            - { type: string, maxLength: 200 }
            - { type: 'null' }
        period_from:
          type: string
          format: date
          description: 청구 대상 기간 시작일(포함).
        period_to:
          type: string
          format: date
          description: 청구 대상 기간 종료일(포함). `period_from`보다 앞일 수 없고 구간은 366일을 넘을 수 없다.

    InvoiceRequestResponse:
      type: object
      required:
        - id
        - workspace_id
        - business_number
        - company_name
        - representative_name
        - contact_email
        - address
        - period_from
        - period_to
        - status
        - operator_note
        - requested_at
        - handled_at
      description: 세금계산서 요청 한 건. `POST`(201)·`GET`(200, 목록 항목) 공용.
      properties:
        id: { type: string, format: uuid }
        workspace_id:
          description: '요청 당시 워크스페이스. 워크스페이스가 지워지면 `null`로 남는다(요청 이력은 보존한다).'
          anyOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        business_number: { type: string, description: '정규화된 10자리 숫자.' }
        company_name: { type: string }
        representative_name:
          anyOf:
            - { type: string }
            - { type: 'null' }
        contact_email: { type: string }
        address:
          anyOf:
            - { type: string }
            - { type: 'null' }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceRequestStatus' }
        operator_note:
          description: '운영자 메모(`invoice-handle --note`). 처리 전이거나 없으면 `null`.'
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
        requested_at: { type: string, format: date-time }
        handled_at:
          description: 운영자가 처리한 시각. 처리 전이면 `null`.
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }

    InvoiceRequestListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceRequestResponse' }
          description: 최근 50건, 최신순.

    # ---------------------------------------------------------------------
    # dictionary (P0-5, 2.11.0)
    # ---------------------------------------------------------------------
    DictionaryLookupRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          x-service-constraint: { max_length: 100, non_empty: true, measured_on: normalized }
          description: |
            검수 화면에서 지목한 문자열 하나. **위치 정보를 담지 않는다** — 좌표는
            편집기의 클라이언트 전용 상태다(계획 §3.4 위치 계약).

            제어문자를 걷어내고 이어지는 공백류를 한 칸으로 뭉갠 뒤 앞뒤 공백을 턴
            **그 결과로** 판정한다 — 비어 있으면 422, 100자를 넘으면 422이며 둘 다
            문자열 `detail`이다. `minLength`/`maxLength`를 쓰지 않는 이유는
            `WorkspaceNameRequest.name`과 같다(`x-request-field-constraints`).

    TermStrategy:
      type: string
      enum: [substitute, gloss, keep]
      description: |
        사전 치환 전략(`dictionary/DESIGN.md` §2.1) — `substitute`(지워도 안전) ·
        `gloss`(원어를 남기고 뜻을 덧붙임) · `keep`(손대면 안 됨).

    TermRisk:
      type: string
      enum: [none, low, high]
      description: 오변환 위험도. `high`는 자동 치환 금지 신호다.

    TermMatchKind:
      type: string
      enum: [exact, inflected, compound_part]
      description: |
        `exact` — 매치 표면형이 표제어와 같고 남는 것이 조사뿐. `inflected` — 표면형이
        표제어와 다른 활용형·이형태. `compound_part` — 질의의 일부(접두·접미)만 사전에
        있는 복합어 부분 일치 — 이 갈래는 `applicable`이 항상 거짓이다. 연속 점수(`score`)는
        두지 않는다 — 어휘 일치에 점수는 뜻이 없다(계획 §3.4).

    DictionaryLookupExample:
      type: object
      required: [before, after]
      properties:
        before: { type: string }
        after: { type: string }

    DictionaryLookupCandidate:
      type: object
      required:
        [term, easy_term, strategy, risk, definition, caution, tags, examples, match_kind, applicable]
      properties:
        term: { type: string, description: 사전 표제어 원형. }
        easy_term: { type: string, description: 쉬운 말. }
        strategy: { $ref: '#/components/schemas/TermStrategy' }
        risk: { $ref: '#/components/schemas/TermRisk' }
        definition: { type: [string, 'null'] }
        caution: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        examples:
          type: array
          items: { $ref: '#/components/schemas/DictionaryLookupExample' }
        match_kind: { $ref: '#/components/schemas/TermMatchKind' }
        applicable:
          type: boolean
          description: |
            참이면 편집기가 치환 버튼을 낸다 — `strategy == substitute` 이고
            `match_kind != compound_part` 일 때만 참이다(계획 §3.4).

    DictionaryAttribution:
      type: object
      required: [name, license, schema_version]
      properties:
        name: { type: string, description: 사전 이름(사전 단위 표기, 계획 §3.2). }
        license: { type: string, description: 라이선스 요약(사전 단위 표기, 원천별 상세는 범위 밖). }
        schema_version:
          type: string
          description: 적재된 색인 파일의 `schema_version`(`DictionaryIndexJsonReader.SUPPORTED_SCHEMA_VERSION`).

    DictionaryLookupResponse:
      type: object
      required: [query, candidates, dictionary]
      properties:
        query:
          type: string
          description: 정제된 질의 문자열 그대로(요청 `text`와 같음, 반향 확인용).
        candidates:
          type: array
          items: { $ref: '#/components/schemas/DictionaryLookupCandidate' }
          description: 후보 0건도 유효한 결과다 — 404가 아니라 빈 배열이다.
        dictionary: { $ref: '#/components/schemas/DictionaryAttribution' }

    # ---------------------------------------------------------------------
    # health
    # ---------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, checks]
      description: |
        `status`는 **`checks`에서 유도한다** — 별개로 계산하지 않는다.
        `checks`의 값이 모두 true면 `ok`, 하나라도 false면 `degraded`다.
        둘이 어긋난 응답은 계약 위반이다(단언하기 쉬운 조항이므로 contract test로 고정한다).
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: |
            `ConversionStatus`와 **다른 네임스페이스**이므로 혼동하지 않는다.
            `"ok"`는 초판(상수 응답)과 같은 값이라, 이 필드만 보던 소비자는 영향받지 않는다.
        checks:
          type: object
          additionalProperties: { type: boolean }
          description: |
            의존 서비스 이름 → 사용 가능 여부. **불리언만 싣는다** — 인증 없는
            엔드포인트이므로 예외 메시지·호스트·버전 같은 내부 정보를 담지 않는다.
            아직 배선되지 않아 확인할 수 없는 의존 서비스는 **키를 생략한다**
            (`false`가 아니다 — "죽었다"와 "확인 안 했다"는 다른 말이다).
            현재 정의된 키: `database`, `queue`. **둘은 같은 DataSource를 공유한다**
            (큐는 같은 DB의 lease 테이블이다 — `paths./health.get.description`).
            의존 서비스가 하나도 배선되지 않았으면 `{}`이고 `status`는 `ok`다.
            **`database: false`는 제품 구성에서 도달 0이다** — 그 사유와 처분은
            `paths./health.get.description`에 있다. 아래 예시 둘은 **조항의 모양**을 보이는
            것이지 오늘 관측되는 응답이 아니다.
          examples:
            - { database: true, queue: true }
            - { database: true, queue: false }

