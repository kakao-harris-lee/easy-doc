  - version: "1.1.0"
    date: "2026-08-12"
    author: contract-keeper
    change: |
      **계약의 성격 개정 — 동결물에서 개선 대상으로.** 아울러 그 새 기준으로 기존
      개선 후보를 전수 재분류하고, 명백한 오기 2건과 정책 변경 1건을 반영했다.

      성격 변경:
        - 최상위 `x-change-policy` 신설 — 변경 근거 G1~G4, 못 바꾸는 불변식,
          리더 에스컬레이션 대상, 절차, parity와의 관계.
        - 파일 머리말·`info.x-baselined-at`(옛 `x-frozen-at`)·`x-source-runtime` —
          "Python 동작 = 계약"이라는 등식을 걷어냈다.
        - `x-v2-candidates` → `x-improvements`. 보류함이 아니라 판정 원장이다.
          ID(V2-N)는 기존 리뷰·문서의 인용을 살리려 그대로 뒀다.

      조항 변경:
        - `MaskedItemResponse` — 마스킹 범주 **2종**(주민등록번호·카드번호) enum 고정,
          `placeholder`·`missing_placeholders` pattern 추가, 허구 예시 `"phone"` 제거.
          (V2-5 · V2-6)
        - `DocumentListItem.source_format` — `[text, docx, pdf, hwpx]` enum 고정. (V2-7)
        - `GET /health` · `HealthResponse` — 의존 서비스 진단으로 개정. `status`는
          `ok|degraded`, `checks`(이름→불리언) 추가. degraded여도 200. (V2-1)
        - `x-private-response-headers` — 범위 규칙을 명시하고, 전역 부착 재심(OQ-1)을
          미결로 기록. **범위 자체는 현행 10곳 그대로다.**
        - `info.description` 인증 우선순위 절 — 근거를 "Python이 그렇다"에서
          "인증되지 않은 호출자에게 검증 의미론을 노출하지 않는다"로 다시 썼다.
    basis: |
      2026-08-12 사용자 결정 — ① Python은 회귀가 잦은 구현이지 기준이 아니며 출력을
      Python과 맞출 필요가 없다, ② API 계약도 개선 대상이고 명백히 잘못된 계약은 고치고
      React도 맞춰 고친다, ③ 마스킹은 주민등록번호·카드번호 2종만 유지한다.
      **`info.version`을 1.1.0으로 올린다** — `source_format`·`category`·`HealthResponse`가
      와이어 스키마 변경이라 React 생성 타입이 달라진다(모두 비파괴: enum 축소는
      응답 필드라 소비자에게 안전하고, `checks`는 필드 추가다).
      영향받는 검증: contract test에 ① `/health` `status`↔`checks` 일관성,
      ② `category` 2종 밖 값 부재, ③ `source_format` enum 밖 값 부재를 추가한다.
      React 영향(고치지 않고 기록): `frontend/src/test/factories.ts`,
      `frontend/src/components/ReviewEditor.test.tsx`의 마스킹 픽스처가 사라진 범주를 쓴다.
      통보 대상: kotlin-implementer, parity-verifier, privacy-gate(마스킹 범위 축소),
      리더(OQ-1 재심).
      재분류 전문: `docs/migration/_workspace/02_contract-rebase.md`

