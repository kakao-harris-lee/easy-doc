openapi: 3.1.0

# =============================================================================
# easy-doc 외부 HTTP 계약 v1
#
# 이 파일이 Kotlin API 구현과 React 타입 생성의 **단일 정본**이다.
# 계약 스펙 전문을 다른 문서에 복사하지 않는다 — 두 벌이 갈라지면 어느 쪽이 정본인지
# 알 수 없게 된다.
#
# ## 이 계약이 무엇인가 (2026-08-12 개정)
#
# **요구사항이 요구하는 인터페이스**다. 현재 Python 구현의 스냅샷이 아니다.
# 초판(2026-08-12)은 "현재 Python 동작을 v1으로 동결한다"는 전제로 썼으나,
# 사용자 결정으로 그 전제가 걷혔다 — **Python은 회귀가 잦은 구현이지 기준이 아니다.**
# 따라서 Python 동작은 이제 **가장 신뢰도 높은 출발점**이지 정답이 아니며,
# 명백히 잘못된 계약(상태 코드 오용, 필드 누락, 실재하지 않는 값 예시)은 고친다.
#
# 그렇다고 아무나 아무 때나 바꿀 수 있는 문서는 아니다. 바꿀 수 있는 근거와
# 바꿀 수 없는 것을 `x-change-policy`에 적었다. **그 절을 읽지 않고 이 파일을 고치지 않는다.**
#
# 계약이 여전히 계약인 이유: React가 의존하는 인터페이스이고, Kotlin 구현과 프런트
# 타입 생성이 같은 한 곳을 읽어야 두 쪽이 갈리지 않는다.
#
# ## 출처
#
# 조항의 1차 출처는 여전히 `app/api/*.py`·`app/main.py`의 실제 동작이다 —
# 다만 "그렇게 동작한다"가 곧 "그래야 한다"는 아니다. Python과 의도적으로 다른 조항은
# 각 자리에 `x-improved` 또는 산문으로 근거를 남긴다.
# 3자 대조 기록: `docs/migration/_workspace/00_contract-keeper_three-way-diff.md`
# 재분류 기록: `docs/migration/_workspace/02_contract-rebase.md`
#
# FastAPI 자동 생성 OpenAPI(`docs/migration/_workspace/00_contract-keeper_openapi-fastapi.yaml`)는
# 초안으로만 썼다. 자동 생성물에는 401·404·409·413·502·503, 모든 응답 헤더,
# multipart 요청 본문, CORS, status enum이 빠져 있어 손으로 채웠다.
#
# 이 파일의 예시 값은 전부 합성이다. 실제 사용자 데이터·개인정보를 넣지 않는다.
# =============================================================================

info:
  title: Easy-Read AI API
  version: "1.1.0"
  x-baselined-at: "2026-08-12"       # 초판 기준선을 뜬 날 (동결일이 아니다)
  x-rebased-at: "2026-08-12"         # 계약의 성격을 "개선 대상"으로 다시 정의한 날
  x-source-runtime: "Python 3.12 / FastAPI (app/main.py) — 기준선 출처이지 정답이 아니다"
  x-change-policy-ref: "최상위 x-change-policy"
  description: |
    공공기관용 '쉬운 글' 자동 변환 서비스의 HTTP 계약 v1.

    **엔드포인트는 정확히 14개다** — 제품 13개 + 헬스 체크 1개.
    계획 §2.2의 "14개 HTTP 엔드포인트"는 `/health`를 포함해야 맞는 수다.

    ## 경로 접두사
    애플리케이션 경로에는 `/api` 접두사가 없다. `app/api/auth.py`의
    `APIRouter(prefix="/auth")`만 존재하고 문서·작업 공간 라우터는 접두사가 없다.
    nginx가 `/api`로 프록시하는 구성(계획 §5 Phase 6)은 **배포 구성 항목**이며
    이 스펙이 정하는 애플리케이션 경로와 별개다.

    ## 오류 본문 계약
    모든 오류 응답의 최상위 키는 `detail` **하나뿐**이고, `Content-Type`은
    `application/json`이다 (`application/problem+json` 아님).
    `detail`은 **문자열 또는 객체 배열의 union**이다:
      - 도메인 예외 → 문자열(한국어 사용자 문구)
      - 입력 검증 실패(422) → `[{loc, msg, type}]` 객체 배열
    React `frontend/src/api/client.ts`의 `readErrorMessage`가 두 모양을 모두
    분기 처리하므로, 한쪽만 구현하면 화면에서 진짜 사유가 사라지고 폴백 문구만 나온다.
    Spring 기본 `ProblemDetail`을 그대로 노출하면 계약 위반이다(계획 §2.2).

    **"모든 오류 응답"은 경로를 가리지 않는다.** 전역 예외 매퍼를 거친 응답만이 아니라,
    `HttpServletResponse.sendError(...)`로 만들어져 `/error`로 ERROR 디스패치된 응답,
    컨테이너가 직접 만든 응답까지 포함이다. 2026-08-12 실측에서 `sendError` 경로가
    `{"timestamp":…,"status":…,"error":…,"path":…}`(Spring `BasicErrorController` 기본
    본문)를 내는 것이 확인됐다 — 이는 `ProblemDetail`이 새는 것과 같은 등급의 위반이다.
    요구와 검증의 정본은 최상위 `x-error-body-universality`이며, 이 자리 역시 OpenAPI
    문법으로는 끝까지 표현되지 않는다(같은 절의 `x-openapi-expressibility`).

    ## 422 응답의 입력값 에코 금지
    검증 실패 응답 항목에 `input`·`ctx` 키를 **넣지 않는다**. FastAPI 기본 핸들러는
    넣지만 `app/api/errors.py`의 `_handle_request_validation`이 걷어낸다 —
    비밀번호가 응답 본문과 액세스 로그에 남는 경로이기 때문이다.
    실측 확인(2026-08-12): `POST /auth/signup` 본문에서 `password`를 빼면
    `{"detail": [{"loc": ["body", "password"], "msg": "Field required", "type": "missing"}]}`.

    ## 소유권 은닉
    다른 사용자의 자원은 **403이 아니라 404**다. 없는 자원과 남의 자원을 구분하지
    않는다 — 구분하면 식별자의 존재 여부가 새어 나간다. 403이 새면 스타일 문제가
    아니라 보안 계약 위반이다(계획 §5 Phase 7 즉시 중단 기준).

    ## 인증 실패와 입력 검증의 우선순위
    **인증이 먼저다.** 이것은 Python이 그렇게 동작해서가 아니라 **그래야 하기
    때문이다** — 인증되지 않은 호출자에게 검증 의미론(어느 파라미터가 어떤 범위를
    받는지, 어떤 경로가 UUID를 요구하는지)을 알려 줄 이유가 없다. 순서가 뒤집히면
    토큰 없이도 API 표면을 탐색할 수 있게 된다.
    실측 확인(2026-08-12): 위조 토큰으로 `GET /documents?limit=0`,
    `DELETE /documents/not-a-uuid`, `GET /conversions/{id}/export?format=pdf`를
    호출하면 셋 다 422가 아니라 **401**이 나온다. Kotlin 구현에서 Bean Validation이
    보안 필터보다 먼저 돌면 이 순서가 뒤집혀 계약 위반이 된다.

    ## 필드 이름
    모든 JSON 필드는 **snake_case**다. Jackson 기본 네이밍 전략이 camelCase로 바꾸면
    계약 위반이다. 식별자는 UUID 문자열, 시각은 ISO 8601 문자열이다.

    ## 응답 헤더 — 전역 요구 (2026-08-12 리더 판정)
    `Cache-Control: no-store`와 `X-Content-Type-Options: nosniff`는 **Kotlin 런타임이
    내보내는 모든 응답**에 붙는다. 상태 코드·경로·핸들러 유무를 가리지 않는다.
    **`paths` 아래 개별 응답에 적힌 헤더 선언 10건을 "붙는 자리 목록"으로 읽으면 안 된다** —
    그것은 고위험 경로에 남긴 **하한선**이고 범위가 아니다.
    요구의 정본은 최상위 `x-global-response-headers`이며, **OpenAPI 문법으로는 이 요구를
    끝까지 표현할 수 없다**(같은 절의 `x-openapi-expressibility`에 무엇을 표현하지 못하는지
    적었다). 이 요구의 대상은 **Kotlin 런타임 하나뿐**이다 — Python은 폐기·재개발
    대상이고 롤백 창이 없으므로 "두 런타임의 헤더가 다르다"는 상황이 존재하지 않는다
    (2026-08-12 2차 재심, `x-global-response-headers.x-origin-of-the-ten`).

servers:
  - url: http://localhost:8000
    description: 개발 서버 (React는 VITE_API_BASE_URL로 주입받는다)

# -----------------------------------------------------------------------------
# 계약 변경 기준 — 이 계약은 동결물이 아니라 개선 대상이다.
# 이 절이 "무엇을 근거로 바꿀 수 있고 무엇은 못 바꾸는지"의 정본이다.
# -----------------------------------------------------------------------------
x-change-policy:
  premise: |
    Python 구현은 회귀가 잦아 Kotlin으로 옮기는 중이다. 따라서 **Python과 같은 값을
    내는 것이 목표가 아니고**, 프로젝트 요구사항을 만족하는 인터페이스를 내는 것이 목표다.
    "Python이 이렇게 한다"는 사실 진술이지 근거가 아니다.

  # 바꿀 수 있는 근거 — 이 넷 중 하나에 해당해야 변경이 성립한다.
  valid_grounds:
    - id: G1
      name: 계약이 사실과 다르다
      detail: |
        스펙에 적힌 값이 어떤 구현에서도 나오지 않는다(존재하지 않는 예시 값, 잘못 옮겨
        적은 상태 코드, 실제와 다른 필드명). 판단이 필요 없는 오기이므로 즉시 고친다.
    - id: G2
      name: 요구사항이 그것을 요구한다
      detail: |
        제품·보안·운영 요구사항이 현재 조항으로 충족되지 않는다. 근거로 요구사항을
        지목해야 하며 "이게 더 낫다"는 취향 진술은 근거가 아니다.
    - id: G3
      name: 정책 결정이 바뀌었다
      detail: |
        사용자·리더가 정책을 바꾸면 계약이 따라간다(예: 마스킹 범주 5종 → 2종,
        2026-08-12 사용자 결정). 계약 소유자가 정책을 만들지는 않는다.
    - id: G4
      name: 조항이 지킬 수 없거나 지켜지지 않는 형태다
      detail: |
        Kotlin/Spring에서 물리적으로 만족시킬 수 없거나, 사람이 매번 기억해야만 지켜지는
        조항이라 이미 두 번 이상 누락된 이력이 있다. 이때는 **결과가 아니라 강제 수단**을
        함께 바꾼다.

  # 바꿀 수 없는 것 — 근거가 G1~G4에 해당해도 이 목록은 계약 소유자 단독으로 못 바꾼다.
  invariants:
    - "소유권 은닉 404 (403 금지) — 보안 계약이다"
    - "오류 본문 최상위 키 `detail` 하나, Content-Type application/json — **어떤 경로로 만들어진
       오류 응답이든** 적용된다(2026-08-12 명시, 정본 `x-error-body-universality`).
       핸들러가 만든 응답만이 아니라 `sendError` → `/error` 디스패치와 컨테이너 생성 응답까지다"
    - "422 응답에 입력값 에코 금지(`input`·`ctx`) — 비밀번호 유출 경로"
    - "JSON 필드 snake_case"
    - "JWT 페이로드에 개인정보 금지 (sub·exp·typ 세 개)"
    - "Cache-Control: no-store + X-Content-Type-Options: nosniff — Kotlin 런타임의 모든 응답
       (2026-08-12 리더 판정, 정본 `x-global-response-headers`). 고위험 10곳은 좁힐 수 없는 하한선이다"
    - "인증 실패 응답의 균일성(계정 열거 방지)"
  invariants_note: |
    위 목록은 깨지면 사용자 데이터가 새는 항목이다. 개선의 이름으로도 좁히지 않는다.
    넓히는 방향(더 많은 응답에 no-store)은 리더 승인 사항이지 금지가 아니다.

  # 계약 소유자가 단독으로 못 정하는 것
  escalate_to_leader:
    - "리더가 이미 명시적으로 판정한 조항을 뒤집는 변경 — 전제가 바뀌었더라도 재심을 요청한다"
    - "React 런타임 코드가 이미 의존하는 동작의 변경 (테스트·타입만 닿는 것은 제외)"
    - "invariants 목록의 축소"
    - "배포·운영 동작이 달라지는 변경 (헬스 체크 상태 코드, 컨테이너 재시작 조건 등)"

  # 절차
  procedure: |
    1. 근거를 G1~G4 중 하나로 지목한다. 지목할 수 없으면 변경하지 않는다.
    2. React 영향을 먼저 확인한다 — `frontend/src/api/types.ts`·`client.ts`·컴포넌트를
       읽고 무엇이 깨지는지 적는다. "아마 괜찮다"는 확인이 아니다.
    3. 파괴적인지 판정한다. 필드·헤더·상태 코드 추가는 대개 비파괴, 제거·이름 변경·
       타입 축소·enum 값 제거는 파괴다.
    4. 계약과 contract test를 **같은 변경 단위**에서 고친다. 스펙만 바뀌면 두 기준이 충돌한다.
    5. `x-changelog`와 `docs/migration/_workspace/00_contract-keeper_changelog.md`에
       조항·근거 ID·영향받는 테스트·통보 대상을 남긴다.
    6. `kotlin-implementer`와 `parity-verifier`에 통보한다.

  parity_relationship: |
    **parity 불일치는 더 이상 자동으로 차단 사유가 아니다.** 계약이 Python과 의도적으로
    다른 조항에서는 Kotlin이 계약을 따르는 것이 옳고, parity 하네스는 그 차이를
    "의도된 차이"로 기록한다. 반대로 계약에 없는 자리에서 값이 갈리면 종전대로 차단이다.
    판정 권한은 계약 소유자에게 있다.

# -----------------------------------------------------------------------------
# CORS 정책 — OpenAPI로 표현할 수 없어 확장 필드로 둔다.
# 원본: app/main.py의 CORSMiddleware 설정.
# -----------------------------------------------------------------------------
x-cors:
  allow_origins:
    - http://localhost:5173   # Settings.cors_origins 기본값 (app/config.py:24)
  allow_credentials: false     # 쿠키를 쓰지 않는다 — 켜면 CSRF 노출 면적만 넓어진다
  allow_methods: [GET, POST, PUT, PATCH, DELETE]  # OPTIONS는 미들웨어가 스스로 처리
  allow_headers: [Authorization, Content-Type]
  expose_headers: [Content-Disposition, Location]
  x-note: |
    expose_headers가 빠지면 서버 응답은 완전한데 **브라우저 JS만** 헤더를 못 읽는다.
    다운로드 파일명(Content-Disposition)과 접수 주소(Location)가 그 대상이다.
    서버 테스트로는 잡히지 않으므로 브라우저 컨텍스트에서 확인한다.
  # 미처리 500 응답의 CORS 헤더 — Python과 Kotlin이 의도적으로 다른 지점.
  # 이 절이 그 결정의 정본이다(다른 문서에 옮겨 적지 않는다).
  x-unhandled-500-cors:
    decision_status: "결정됨 (2026-08-12 리더 판정, 사용자 승인) — 개선을 받아들인다"
    x-rebase-note: |
      2026-08-12 계약 성격 개정 이후 이 항목의 지위가 달라졌다. 예전에는 "동결 원칙의
      유일한 예외"였으나, 이제는 `x-change-policy` G2를 적용한 **통상적인 개선**이다.
      아래 rationale은 그대로 유효하고 결론도 바뀌지 않는다 — 바뀐 것은 "왜 예외가
      허용됐는가"를 더는 설명할 필요가 없다는 점뿐이다.
    python_behavior: |
      미처리 500 응답에는 CORS 헤더가 붙지 않는다. `ServerErrorMiddleware`가 CORS
      미들웨어 **바깥**에 있어 구조적으로 붙일 수 없다(app/api/errors.py에 한계로 명시).
      브라우저는 상태 코드조차 읽지 못하고 네트워크 오류로 보며, React
      `frontend/src/api/client.ts`의 fetch catch가
      `ApiError(0, "서버에 연결하지 못했습니다…")`를 만든다.
    kotlin_behavior: |
      **미처리 500에도 CORS 헤더가 붙는다.** `CorsFilter`가 라우팅 밖(서블릿 필터 체인
      앞)에 있기 때문이다 — Starlette 미들웨어와 같은 위치이고, `/nope`(404)와 405에도
      헤더가 붙어야 하므로 이 배치가 옳다. 그 결과 예외가 어디서 나든 헤더가 남는다.
      실측(리더 보고, 일회성 프로브 — 커밋되지 않음):
      `미처리 500 | status=500 | ACAO=http://localhost:5173 | EXPOSE=Content-Disposition, Location`
    rationale: |
      브라우저가 응답을 읽을 수 있게 되어 React가
      `ApiError(500, "서버 오류가 발생했습니다")`를 받는다. 진단이 쉬워지고 사용자에게
      더 정확한 문구가 나간다. 반대로 Python 동작을 재현하려면 `CorsFilter`를 감싸는
      필터를 새로 만들어야 하는데, 그것은 **일부러 나쁜 동작을 만드는 코드**가 저장소에
      영구히 남는다는 뜻이다.
    scope: |
      달라지는 것은 **CORS 응답 헤더의 유무뿐**이다. 상태 코드(500)와 본문
      (`{"detail": "서버 오류가 발생했습니다"}`)은 Python과 같아야 한다 — 그쪽이
      달라지면 의도된 차이가 아니라 계약 위반이다.
      parity 대조가 이 헤더를 불일치로 잡더라도 **의도된 차이**이므로 구현 차단 사유가
      아니다. 그 밖의 500 응답 항목이 어긋나면 종전대로 차단한다.
    x-phase6-check: |
      **Phase 6 확인 항목 — React 오류 분기.**
      실측(2026-08-12, `grep -rn "NETWORK_ERROR_STATUS|status === 0|\.status" frontend/src`):
      **`status = 0` 경로에 의존하는 화면 분기는 없다.** `NETWORK_ERROR_STATUS`는
      `client.ts`(생성 지점)와 `client.test.ts`(단언)에만 등장한다. 화면 컴포넌트는
      UploadPage · HistoryPage · ReviewEditor · WorkspaceMenu · WorkspaceProvider ·
      useConversionPolling · CredentialsForm 전부
      `caught instanceof ApiError ? caught.message : <폴백 문구>` 한 가지 모양이라
      HTTP 상태를 아예 보지 않는다. 상태로 갈리는 자리는 `client.ts`의
      `response.status === 401 && token !== null`(토큰 폐기 + unauthorizedHandler)
      하나뿐이며 500과 무관하다.
      따라서 이 결정이 깨뜨리는 화면 분기는 없고, 사용자에게 보이는 **문구만**
      "서버에 연결하지 못했습니다…" → "서버 오류가 발생했습니다"로 바뀐다.
      `client.test.ts`의 네트워크 오류 테스트는 `fetch`를 직접 reject시키는 방식이라
      이 변경과 무관하게 통과한다(진짜 연결 실패는 계속 status 0이다).
      Phase 6에서 다시 확인할 것 — ① 위 grep을 재실행해 그 사이 `status === 0` 분기가
      새로 생기지 않았는지, ② Kotlin 미처리 500의 `detail` 문구가 위와 같은지
      (계획 §4.1의 오류 문구 어댑터가 이 값을 전제한다).

# -----------------------------------------------------------------------------
# 인증 계약
# 원본: app/services/auth.py, app/api/deps.py
# -----------------------------------------------------------------------------
x-auth:
  scheme: "Authorization: Bearer <token>"
  algorithm: HS256
  claims: [sub, exp, typ]        # 세 개뿐. 이메일 등 개인정보를 넣지 않는다
  claim_sub: "사용자 UUID 문자열"
  claim_typ: "access"            # 값이 다르면 거부
  required_claims: [sub, exp, typ]  # 모두 있어야 유효. exp 없는 토큰은 영구 자격증명이 된다
  min_secret_bytes: 32           # HS256 해시 출력 크기. 미만이면 ConfigurationError → 503
  default_lifetime_seconds: 3600 # Settings.jwt_expire_minutes 기본 60분
  clock_skew_seconds: 0
  x-clock-skew: |
    **만료 검증에 허용 오차를 두지 않는다.** `exp`를 1초라도 지난 토큰은 401이다.
    Nimbus·Spring Security의 기본 허용 오차가 **60초**라 그냥 두면 만료된 토큰이
    **+59초까지 통과한다**(Phase 0 실측 결함 — 필수조치 B). `exp` 없는 토큰을 금지한
    위 `required_claims` 조항과 같은 목적이다 — 만료가 강제되지 않으면 그 클레임을
    요구한 의미가 없다. 서버 시계는 NTP 동기를 전제한다.
  x-rebuild-note: |
    **2026-08-12 2차 개정 — "Python 발급 토큰과 Kotlin 발급 토큰의 양방향 상호 수용"
    요구는 폐기됐다.** 그 요구는 롤백 창에서만 나왔고, Python 폐기·재개발과 롤백 포기로
    근거가 사라졌다. 없어진 것은 **상호 수용**이지 이 절의 발급·검증 정확성이 아니다 —
    `claims`·`algorithm`·`required_claims`·`clock_skew_seconds`는 그대로 계약이며,
    검증 방법은 `.claude/skills/api-contract-freeze` §2.4·§5로 옮겨 갔다.
  password_hash: "argon2id (time_cost=3, memory_cost=65536, parallelism=4)"
  rehash_policy: |
    로그인 **성공 시에만** 재해시한다. 재해시 실패는 로그인을 막지 않는다(best-effort).

    **재해시 판정은 저장된 PHC의 파라미터가 현재 설정과 전부 같은지로 한다** —
    변형(`argon2id`)·`time_cost`·`memory_cost`·`parallelism` 중 **하나라도 다르면**
    재해시 대상이다. Spring `Argon2PasswordEncoder.upgradeEncoding()`은 `memory`와
    `iterations`의 **"미만"만** 보므로, 파라미터를 **낮춘** 경우와 `parallelism`만 바뀐
    경우를 놓친다(Phase 0 실측 결함 — 필수조치 A). 그대로 쓰면 계약 위반이다.

    **2026-08-12 2차 개정**: 종전 문구는 "기존 PHC 문자열은 그대로 검증 가능해야 한다"는
    **호환 요구**였다. 그 요구는 롤백 창(Python이 Kotlin이 쓴 데이터를 읽어야 한다)에서만
    나왔는데 Python 폐기·재개발과 롤백 포기로 근거가 사라졌다. 남은 것은 호환이 아니라
    **기능 요구**다 — 저장된 해시로 로그인이 되어야 하고, 파라미터가 낡았으면 올려야 한다.
  failure_uniformity: |
    이메일 부재·비밀번호 불일치·토큰 만료·위조(서명 불일치·필수 클레임 누락·`typ`
    용도 불일치를 포함한다)·계정 삭제를 **모두 같은 401과 같은 메시지**로 처리한다.
    구분하면 계정 열거 공격의 단서가 된다. 사용자가 없을 때도 더미 해시로 같은 검증
    비용을 치러 응답 시간으로도 새지 않게 한다.

    **이 조항이 균일성 요구의 정본이다.** 다른 절은 사유 목록을 옮겨 적지 않고 여기를
    가리킨다 — `components/responses/Unauthorized`가 한때 목록을 복사해 두었다가
    갈렸다(게이트 24 R-1, 2026-08-19 정합).

    **범위 — `Authorization` 헤더가 아예 없는 갈래는 여기 들어가지 않는다.**
    위 열거는 전부 **자격증명이 제시된 뒤** 서버만 아는 사실(계정의 존재·삭제 여부,
    토큰의 만료·진위)로 갈리는 자리다. 무헤더는 요청자가 스스로 만든 상태이고 자기가
    붙이지 않았음을 이미 알므로 응답에서 얻는 **정보 이득이 0**이다. 그래서 무헤더는
    균일화 대상이 아니라 `components/responses/Unauthorized`가 적는 **두 문구 구조**의
    첫째 갈래로 남는다.

    따라서 **균일성 판정의 대상은 토큰·자격증명이 제시된 갈래들**이다 — 무헤더를
    함께 넣은 비교(예: 4갈래 응답 시간 비)는 이 조항이 요구하는 균일성의 측정이
    아니다. 무헤더 갈래의 처리 비용이 다른 것은 이 조항 위반이 아니며, 자원 소모
    관점의 논의는 별건이다.
    (범위·근거는 게이트 24 3관점 수렴 + 리더 지시, 2026-08-19.)

# -----------------------------------------------------------------------------
# 입력 상한 — 전부 계약이다.
# -----------------------------------------------------------------------------
x-input-limits:
  max_convertible_chars: 4000        # app/services/documents.py MAX_CONVERTIBLE_CHARS → 초과 시 422
  max_review_chars: 4000             # 검수 수정본도 같은 상한 → 초과 시 422
  max_upload_bytes: 10485760         # app/ingest/extractors.py MAX_UPLOAD_BYTES (10 * 1024 * 1024) → 초과 시 413
  max_extracted_chars: 500000        # 추출 결과 상한 → 초과 시 422
  zip_uncompressed_budget_bytes: 52428800  # 업로드 상한의 5배. 초과 시 422 (압축 폭탄 방어)
  supported_upload_formats: [docx, pdf, hwpx]  # 확장자 대소문자 무시. 그 밖은 422
  legacy_doc_policy: |
    구버전 `.doc`(OLE2)은 전용 안내 문구와 함께 422다 —
    "구버전 doc 형식은 지원하지 않습니다 (docx로 다시 저장해 올려주세요)".
  rejected_pdf: "텍스트 레이어 없는 스캔 PDF·암호화 PDF는 422"
  list_limit: { min: 1, max: 100, default: 20 }   # 범위 밖은 422 — **스키마 층**이라 배열 detail
  list_offset: { min: 0, default: 0 }             # 범위 밖은 422 — **스키마 층**이라 배열 detail
  max_workspace_name_length: 50      # 초과 시 422 (자르지 않고 거절) — 서비스 층, 문자열 detail
  max_email_length: 255              # 초과 시 422 — 서비스 층, 문자열 detail
  min_password_length: 8             # 미만 시 422 — 서비스 층, 문자열 detail
  max_title_length: 255              # 사용자가 준 제목은 자른다(거절하지 않는다)
  retention_days: 30

# -----------------------------------------------------------------------------
# 요청 본문 필드의 길이·형식 제약 — **어느 층이 재는가 · 무엇을 재는가**
#
# 이 절이 F3(교차 리뷰 C-5)의 판정 결과이자 요구의 정본이다.
# 상한 값 자체는 위 `x-input-limits`에, 그 값을 **어떻게 적용하는가**는 여기에 있다.
# -----------------------------------------------------------------------------
x-request-field-constraints:
  x-why-this-section-exists: |
    초판은 다섯 요청 필드에 OpenAPI `maxLength`/`minLength`를 달았다. 그것은 **스키마 층
    제약을 선언한 것**이고, 이 계약 자신의 오류 본문 규칙에 따르면 스키마 실패는 422
    **배열** `detail`이다. 그런데 실제로 이 다섯을 판정하는 것은 스키마가 아니라 서비스
    층이고 결과는 422 **문자열** `detail`이다. **계약이 자기 자신과 충돌했다.**

    실측(2026-08-13): 다섯 필드의 Pydantic 모델에는 길이 제약이 **하나도 없다**
    (`SignupRequest`·`DocumentTextRequest`·`ConversionReviewRequest`·`WorkspaceNameRequest`
    전부 `model_json_schema()`에 `maxLength`/`minLength` 0건). 전부
    `InvalidInputError` → 422 문자열이다.

    더 나쁜 것은 **경계까지 달랐다**는 점이다. 서비스는 정규화한 **뒤**의 길이를 재는데
    스키마 제약은 **원시 값**에 걸리므로, 셋은 계약이 코드보다 엄격했다. 실측한 갈림 입력:

      - `email` 원시 260자(앞 공백 10) → 정규화 후 250자. **코드 통과 / 스키마 거절**
      - `edited_text` 원시 4,010자(제어문자 11) → 정규화 후 3,999자. **코드 통과 / 스키마 거절**
      - `name` 원시 55자(제어문자 10) → 정규화 후 45자. **코드 통과 / 스키마 거절**

    반대 방향도 있다 — `name`의 `minLength: 1`은 `"   "`(공백 3자)를 통과시키지만 서비스는
    거절한다. 한 필드에서 두 방향으로 갈렸다.

  x-decision: |
    **다섯 전부 서비스 층 규칙으로 유지한다. OpenAPI 길이 키워드를 제거한다.**
    (판정 2026-08-13, contract-keeper. 근거 **G1**(계약이 사실과 다름) + **G4**(계약의 두
    조항이 서로 모순이라 양쪽을 동시에 만족시킬 수 없음).)

    반대 방향(코드를 스키마 층으로 옮기기)을 택하지 않은 이유가 셋이다.

    1. **요구가 정규화 후 판정을 지정했다.** "제어문자를 걷어내고 앞뒤 공백을 턴 뒤
       검사한다"는 이 계약 자신의 문장이고(`POST /workspaces` 설명), 제어문자를 먼저
       걷어내는 이유도 명시돼 있다 — 남겨 두면 docx 내보내기 시점에 터져 사용자가 원인을
       알 수 없는 500을 받는다. 스키마 층은 정규화 전에 돌므로 **이 요구를 표현할 수 없다.**
    2. **사용자에게 보이는 문구가 한국어에서 영어로 바뀐다.** React `readErrorMessage`
       (`frontend/src/api/client.ts:83-90`)는 배열 `detail`에서 `msg`만 뽑아 그대로 화면에
       올린다. 스키마 층으로 옮기면 `"작업 공간 이름은 50자 이하여야 합니다"` 대신
       Bean Validation의 영문 문구가 사용자에게 나간다. **상태 코드는 그대로라 테스트로도
       잡히지 않는 종류의 품질 저하다.**
    3. **한 API 안에서 길이 위반의 응답 모양이 둘로 갈린다.** 다섯 중 둘(`password`·`text`)은
       경계가 코드와 같아 옮겨도 값 동작이 안 바뀌지만, 옮기면 같은 "길이 위반"이 필드에
       따라 배열/문자열로 갈려 클라이언트 분기가 예측 불가능해진다.

    **이것은 계약을 느슨하게 만드는 변경이 아니다.** 상한은 그대로이고, 강제하는 층과
    재는 대상이 사실과 맞게 적혔을 뿐이다.

  x-contrast-case: |
    **모든 제약을 걷어낸 것이 아니다.** `GET /documents`의 `limit`·`offset`은 진짜 스키마
    제약이고 그대로 둔다 — 구현이 `Annotated[int, Query(ge=1, le=100)]`로 **실제로 스키마
    층에서** 판정하며 422 배열이 나간다(`ValidationFailed.examples.query_range`가 그 예시다).

    계약이 통째로 틀렸던 것이 아니라, **코드가 스키마 층에서 재는 자리에서는 맞았고 아닌
    자리에서 틀렸다.** 이 대비가 판정의 근거다 — 규칙을 일괄 적용한 것이 아니라 자리마다
    실제 강제 지점을 확인했다.

  fields:
    - field: "SignupRequest.email"
      layer: service            # 위반 시 422 **문자열** detail
      limit: 255
      measured_on: "정규화 후 — 앞뒤 공백 제거 + 소문자화(app/services/auth.py:192-194)"
      detail: "이메일 형식이 올바르지 않습니다"    # 길이 초과와 형식 오류가 같은 문구다(입력값 비반향)
    - field: "SignupRequest.password"
      layer: service
      limit: 8                  # 하한. 상한 없음 — argon2는 입력 길이에 비용이 좌우되지 않는다
      measured_on: "원시 값 — 정규화하지 않는다"
      detail: "비밀번호는 8자 이상이어야 합니다"
    - field: "DocumentTextRequest.text"
      layer: service
      limit: 4000
      measured_on: "원시 값 — 정규화하지 않는다. ⚠ `edited_text`와 비대칭이다(아래 x-open-asymmetry)"
      detail: "현재는 4,000자 이하 문서만 변환할 수 있습니다 (긴 문서 분할 변환은 준비 중입니다)"
    - field: "ConversionReviewRequest.edited_text"
      layer: service
      limit: 4000
      measured_on: "정규화 후 — 제어문자 제거(app/services/documents.py:399-402)"
      detail: "수정본은 4,000자 이하여야 합니다 (긴 문서 분할 변환은 준비 중입니다)"
    - field: "WorkspaceNameRequest.name"
      layer: service
      limit: 50                 # 하한은 "정규화 후 비어 있지 않을 것"이며 minLength로 표현되지 않는다
      measured_on: "정규화 후 — 제어문자 제거 + 앞뒤 공백 제거(app/services/workspaces.py:136-140)"
      detail: ["작업 공간 이름을 입력해 주세요", "작업 공간 이름은 50자 이하여야 합니다"]

  x-open-asymmetry: |
    **미결 — Phase 4, `kotlin-implementer`·`parity-verifier` 공동.**
    `edited_text`는 제어문자를 걷어낸 뒤 길이를 재는데 `text`(붙여넣기)는 그러지 않는다
    (`create_from_text`가 `strip_control_chars`를 부르지 않는다 — 2026-08-13 실측).
    그런데 제어문자를 먼저 걷어내는 **이유**로 계약이 든 것(docx 내보내기가 담지 못해
    500이 된다)은 두 경로에 똑같이 적용된다. 즉 붙여넣기 본문의 제어문자는 지금 저장까지
    도달한다.

    **이 계약은 그 비대칭을 해소하지 않는다** — 정규화 범위를 넓히는 것은 계약 문구가 아니라
    변환 파이프라인의 판단이고, 텍스트 정규화 명세는 parity 레인이 소유한다. 계약은 현재
    요구되는 측정 기준을 **있는 그대로** 적고 이 자리를 미결로 표시한다. 해소되면
