x-changelog:
  - version: "1.0.0"
    date: "2026-08-12"
    author: contract-keeper
    change: "v1 최초 동결 (14 엔드포인트)"
    basis: |
      현재 Python 구현에서 추출. 라우터 코드 정독 + FastAPI OpenAPI 초안 대조 +
      실제 앱 TestClient 실측(422 본문 모양, 401 우선순위, 헤더 유무).
      3자 대조 결과: docs/migration/_workspace/00_contract-keeper_three-way-diff.md

# =============================================================================
# v2 후보 — v1에서는 고치지 않는다
# 개선안이 보여도 v1을 다듬으면 React가 이미 의존하는 동작이 소리 없이 깨지고,
# 실패 원인이 "포팅 버그"인지 "계약 변경"인지 가릴 수 없게 된다(계획 §2.2).
# =============================================================================
x-v2-candidates:
  - id: V2-1
    subject: "GET /health"
    proposal: "의존 서비스(DB·Redis·설정) 상태를 실제로 진단하고 degraded 상태를 표현한다"
    reason: "현재는 상수 ok만 돌려줘 DB가 죽어도 200이다. 계획 §2.2 주변 서술과 어긋난다"
  - id: V2-2
    subject: "미처리 500 응답의 CORS 헤더"
    proposal: "Kotlin에서는 500에도 CORS 헤더를 붙여 브라우저가 상태 코드를 읽게 한다"
    reason: "Python은 ServerErrorMiddleware 위치 때문에 구조적으로 불가능. Kotlin에는 그 제약이 없다"
    status: "미결 — 리더 판단 대기. 재현할지 개선할지 정해지기 전에는 구현하지 않는다"
  - id: V2-3
    subject: "DELETE /documents/{id} · DELETE /workspaces/{id}"
    proposal: "204 응답에도 no-store/nosniff를 붙인다"
    reason: "본문이 없어 실익은 없으나 정책 일관성. v1은 현행 유지가 계약이다"
  - id: V2-4
    subject: "목록 응답의 총 개수"
    proposal: "total 필드 추가 (필드 추가는 비파괴적)"
    reason: "현재는 has_more만으로 페이지네이션 UI를 만들 수 있는 범위가 좁다"
